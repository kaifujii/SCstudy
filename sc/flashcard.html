<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カードで覚える — SC 技術解説書</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SC単語帳">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ── Design tokens ── */
:root {
  --page-bg:    #080c14;
  --card-dark:  #111827;
  --card-back:  #0d1520;
  --border-dim: rgba(255,255,255,0.06);
  --border-mid: rgba(255,255,255,0.10);
  --gold:       #c9a557;
  --gold-dim:   rgba(201,165,87,0.18);
  --gold-glow:  rgba(201,165,87,0.08);
  --text-hi:    #f0f4ff;
  --text-mid:   rgba(240,244,255,0.72);
  --text-lo:    rgba(240,244,255,0.34);
  --accent:     #1570b8;
  --known:      #1a7a52;
  --again:      #1e2d4a;
  --mono:       'JetBrains Mono', monospace;
  --sans:       'Noto Sans JP', sans-serif;
  --serif:      'Noto Serif JP', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--sans);
  background: var(--page-bg);
  /* 紙のような斜線テクスチャ */
  background-image:
    repeating-linear-gradient(
      -45deg,
      transparent 0px, transparent 38px,
      rgba(255,255,255,0.013) 38px, rgba(255,255,255,0.013) 39px
    ),
    radial-gradient(circle at 50% 0%, rgba(21,112,184,0.06) 0%, transparent 60%);
  color: var(--text-hi);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
header {
  background: rgba(8,12,20,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-dim);
  height: 52px; padding: 0 18px;
  display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 100;
}
.back-link {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 7px;
  text-decoration: none; transition: background 0.15s; flex-shrink: 0;
  color: var(--text-lo);
}
.back-link:hover { background: rgba(255,255,255,0.07); color: var(--text-hi); }
.logo-text { display: flex; flex-direction: column; gap: 1px; }
.logo-sub  {
  font-family: var(--mono); font-size: 8px; font-weight: 700;
  letter-spacing: .22em; text-transform: uppercase; color: var(--text-lo);
}
.logo-main {
  font-family: var(--sans); font-size: 0.94rem; font-weight: 700; color: var(--text-hi);
  letter-spacing: -0.3px;
}
#progress-text {
  margin-left: auto;
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  color: var(--text-lo); letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
}

/* ── Doc tabs ── */
#doc-tabs {
  background: rgba(8,12,20,0.80);
  border-bottom: 1px solid var(--border-dim);
  padding: 0 14px; display: flex; overflow-x: auto;
  scrollbar-width: none;
}
#doc-tabs::-webkit-scrollbar { display: none; }
.doc-tab {
  flex-shrink: 0; padding: 9px 13px;
  border: none; background: none;
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  color: var(--text-lo); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap; letter-spacing: .06em;
}
.doc-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.doc-tab:hover:not(.active):not(.locked) { color: var(--text-mid); }
.doc-tab.locked { opacity: 0.25; cursor: default; }

/* ── App ── */
#app { max-width: 520px; margin: 0 auto; padding: 20px 14px 56px; }

/* ── Doc info ── */
#doc-info {
  display: flex; align-items: center; gap: 9px; margin-bottom: 18px;
}
#doc-badge {
  font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; padding: 3px 9px; border-radius: 4px;
  color: var(--gold); background: var(--gold-dim);
  border: 1px solid rgba(201,165,87,0.25);
}
#doc-title { font-size: 0.78rem; font-weight: 700; color: var(--text-mid); }
#doc-count  { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--text-lo); }

/* ── Progress bar ── */
#progress-bar-wrap {
  height: 2px; background: rgba(255,255,255,0.06); border-radius: 2px;
  margin-bottom: 20px; overflow: hidden;
}
#progress-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #1570b8, var(--gold));
  border-radius: 2px; transition: width 0.35s cubic-bezier(0.25,1,0.5,1);
}

/* ── Counter ── */
.card-counter {
  font-family: var(--mono); text-align: center;
  font-size: 10px; color: var(--text-lo); margin-bottom: 14px;
  font-weight: 600; letter-spacing: 3px;
  font-variant-numeric: tabular-nums;
}

/* ── Flashcard ── */
.flashcard {
  min-height: 300px; cursor: pointer;
  perspective: 1400px; position: relative; user-select: none;
}
.flashcard-inner {
  position: relative; width: 100%; min-height: 300px;
  transition: transform 0.46s cubic-bezier(0.25, 1, 0.5, 1);
  transform-style: preserve-3d;
}
.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }

.flashcard-front,
.flashcard-back {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 14px; padding: 26px 24px 22px;
  display: flex; flex-direction: column;
}

/* FRONT — dark navy + paper texture */
.flashcard-front {
  background: var(--card-dark);
  background-image:
    repeating-linear-gradient(
      -45deg,
      transparent 0px, transparent 28px,
      rgba(255,255,255,0.018) 28px, rgba(255,255,255,0.018) 29px
    );
  border: 1px solid var(--border-dim);
  border-top: 2.5px solid var(--gold);
  /* オフセット影（C の紙の質感） */
  box-shadow:
    7px 7px 0 rgba(201,165,87,0.10),
    0 24px 48px rgba(0,0,0,0.55),
    0 4px 12px rgba(0,0,0,0.35);
}

/* BACK — slightly different navy */
.flashcard-back {
  background: var(--card-back);
  background-image:
    repeating-linear-gradient(
      -45deg,
      transparent 0px, transparent 28px,
      rgba(255,255,255,0.018) 28px, rgba(255,255,255,0.018) 29px
    );
  border: 1px solid var(--border-dim);
  border-top: 2.5px solid rgba(201,165,87,0.5);
  box-shadow:
    7px 7px 0 rgba(201,165,87,0.08),
    0 24px 48px rgba(0,0,0,0.55),
    0 4px 12px rgba(0,0,0,0.3);
  transform: rotateY(180deg);
}

/* ── Front content ── */
.card-source-tag {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--gold); opacity: 0.75;
  margin-bottom: 22px;
  display: flex; align-items: center; gap: 6px; align-self: flex-start;
}
.card-term {
  font-family: var(--sans);
  font-size: 32px; font-weight: 900; color: var(--text-hi);
  line-height: 1.2; letter-spacing: -0.03em;
  flex: 1; word-break: break-word;
  text-shadow: 0 2px 18px rgba(0,0,0,0.4);
}
.tap-hint {
  margin-top: 18px; padding-top: 14px;
  border-top: 1px solid var(--border-dim);
  font-size: 11px; color: var(--text-lo);
  display: flex; align-items: center; gap: 6px;
}
.tap-hint svg { flex-shrink: 0; opacity: 0.6; }

/* ── Back content ── */
.card-answer-label {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  letter-spacing: .18em; text-transform: uppercase; color: var(--gold);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
}
.card-answer-label::before {
  content: ''; display: block; width: 20px; height: 1px;
  background: var(--gold); flex-shrink: 0;
}
.card-def {
  font-size: 15px; line-height: 1.95; color: var(--text-mid); flex: 1;
}
.doc-link-btn {
  margin-top: 18px; padding: 12px 16px;
  background: transparent; color: var(--gold);
  border: 1px solid rgba(201,165,87,0.3); border-radius: 8px;
  font-family: var(--sans); font-size: 13px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; gap: 7px; letter-spacing: 0.2px;
  transition: background 0.18s, border-color 0.18s;
  text-decoration: none;
}
.doc-link-btn:hover { background: var(--gold-dim); border-color: rgba(201,165,87,0.6); }
.doc-link-btn svg { flex-shrink: 0; }

/* ── Result buttons ── */
.result-btns { display: flex; gap: 8px; margin-top: 12px; }
.result-btn {
  flex: 1; min-height: 52px; border-radius: 10px;
  font-family: var(--sans); font-size: 14px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; gap: 7px;
  border: 1px solid var(--border-dim);
  transition: all 0.18s;
}
#btn-again {
  background: rgba(30,45,74,0.9); color: var(--text-mid);
  border-color: rgba(255,255,255,0.10);
}
#btn-again:hover { background: rgba(30,45,74,1); border-color: rgba(255,255,255,0.18); }
#btn-known {
  background: rgba(26,122,82,0.22); color: #4dd89a;
  border-color: rgba(77,216,154,0.25);
}
#btn-known:hover { background: rgba(26,122,82,0.36); border-color: rgba(77,216,154,0.45); }

/* ── Nav buttons ── */
.card-nav { display: flex; gap: 8px; margin-top: 8px; }
.nav-btn {
  flex: 1; min-height: 48px; border-radius: 10px;
  font-family: var(--sans); font-size: 13px; font-weight: 700;
  background: transparent; color: var(--text-lo);
  border: 1px solid var(--border-dim); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: all 0.15s;
}
.nav-btn:hover:not(:disabled) { color: var(--text-mid); border-color: var(--border-mid); }
.nav-btn:disabled { opacity: 0.2; cursor: default; }

/* ── Note ── */
.doc-link-note {
  margin-top: 16px; font-size: 10px; color: var(--text-lo);
  text-align: center; display: flex; align-items: center;
  justify-content: center; gap: 5px;
}

/* ── Complete panel ── */
#complete-panel { display: none; text-align: center; padding: 52px 16px; }
#complete-panel.visible { display: block; }

.complete-ornament {
  width: 64px; height: 64px; margin: 0 auto 24px;
  border: 2px solid rgba(201,165,87,0.3); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--gold-dim);
}
.complete-title {
  font-family: var(--sans); font-size: 1.4rem; font-weight: 900;
  color: var(--text-hi); margin-bottom: 8px; letter-spacing: -0.02em;
}
.complete-sub {
  font-size: 13px; color: var(--text-lo); margin-bottom: 32px; line-height: 1.7;
}
.complete-stats {
  display: flex; justify-content: center; gap: 32px; margin-bottom: 36px;
}
.c-stat { text-align: center; }
.c-stat-num {
  font-family: var(--mono); font-size: 2.2rem; font-weight: 700;
  line-height: 1; display: block; letter-spacing: -2px;
  font-variant-numeric: tabular-nums;
}
.c-stat-num.known { color: #4dd89a; }
.c-stat-num.again { color: #6b8cbf; }
.c-stat-num.total { color: var(--text-mid); }
.c-stat-label { font-size: 10px; color: var(--text-lo); margin-top: 5px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; }

.restart-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 32px; border-radius: 10px;
  background: var(--gold-dim); color: var(--gold);
  border: 1px solid rgba(201,165,87,0.35);
  font-family: var(--sans); font-size: 14px; font-weight: 700;
  cursor: pointer; transition: background 0.18s, border-color 0.18s;
  text-decoration: none;
}
.restart-btn:hover { background: rgba(201,165,87,0.26); border-color: rgba(201,165,87,0.55); }

/* ── Card entrance ── */
@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card-in { animation: cardIn 0.28s cubic-bezier(0.25,1,0.5,1); }

@media (prefers-reduced-motion: reduce) {
  .flashcard-inner { transition: none; }
  .card-in { animation: none; }
}

/* ── Mobile ── */
@media (max-width: 480px) {
  .card-term { font-size: 28px; }
  .flashcard-front, .flashcard-back { padding: 22px 20px 20px; }
  #app { padding: 16px 12px 48px; }
}
</style>
</head>
<body>

<header>
  <a href="../index.html" class="back-link" title="ホームへ">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="logo-text">
    <div class="logo-sub">情報処理安全確保支援士</div>
    <div class="logo-main">カードで覚える</div>
  </div>
  <span id="progress-text">— / —</span>
</header>

<div id="doc-tabs"></div>

<div id="app">
  <div id="doc-info">
    <span id="doc-badge"></span>
    <span id="doc-title"></span>
    <span id="doc-count"></span>
  </div>

  <div id="progress-bar-wrap">
    <div id="progress-bar"></div>
  </div>

  <!-- Card area -->
  <div id="card-area">
    <div class="card-counter" id="card-counter">— / —</div>

    <div class="flashcard card-in" id="flashcard" onclick="flipCard()">
      <div class="flashcard-inner" id="flashcard-inner">

        <div class="flashcard-front">
          <div class="card-source-tag" id="front-tag">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            重要用語
          </div>
          <div class="card-term" id="card-term">Loading…</div>
          <div class="tap-hint">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            タップして解説を見る
          </div>
        </div>

        <div class="flashcard-back">
          <div class="card-answer-label">解説</div>
          <div class="card-def" id="card-def">—</div>
          <a class="doc-link-btn" id="doc-link" href="#" target="_blank" rel="noopener"
             onclick="event.stopPropagation()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            解説書で詳しく確認
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>

      </div>
    </div><!-- /.flashcard -->

    <div class="result-btns" id="result-btns" style="display:none">
      <button class="result-btn" id="btn-again" onclick="markAgain()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.85"/></svg>
        もう一度
      </button>
      <button class="result-btn" id="btn-known" onclick="markKnown()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        覚えた！
      </button>
    </div>

    <div class="card-nav">
      <button class="nav-btn" id="btn-prev" onclick="prevCard()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        前へ
      </button>
      <button class="nav-btn" id="btn-next" onclick="nextCard()">
        次へ
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <p class="doc-link-note">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      解説書は新しいタブで開きます。閉じるとカードに戻れます。
    </p>
  </div><!-- /#card-area -->

  <!-- Complete panel -->
  <div id="complete-panel">
    <div class="complete-ornament">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c9a557" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="complete-title">お疲れさまでした！</div>
    <div class="complete-sub" id="complete-sub">全カードを確認しました。</div>
    <div class="complete-stats">
      <div class="c-stat">
        <span class="c-stat-num known" id="stat-known">0</span>
        <div class="c-stat-label">覚えた</div>
      </div>
      <div class="c-stat">
        <span class="c-stat-num again" id="stat-again">0</span>
        <div class="c-stat-label">要復習</div>
      </div>
      <div class="c-stat">
        <span class="c-stat-num total" id="stat-total">0</span>
        <div class="c-stat-label">合計</div>
      </div>
    </div>
    <button class="restart-btn" onclick="restart()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.85"/></svg>
      もう一度挑戦する
    </button>
  </div>
</div>

<script src="data/desc_terms.js"></script>
<script>
// ── State ──────────────────────────────────────────────
let docIdx    = 0;
let deck      = [];
let pos       = 0;
let knownSet  = new Set();
let againSet  = new Set();
let isFlipped = false;

// ── Boot ───────────────────────────────────────────────
function init() {
  buildTabs();
  loadDoc(0);
}

function buildTabs() {
  const bar = document.getElementById('doc-tabs');
  DESC_TERMS.forEach((doc, i) => {
    const btn = document.createElement('button');
    const isAvailable = doc.terms && doc.terms.length > 0;
    btn.className = 'doc-tab' + (i === 0 ? ' active' : isAvailable ? '' : ' locked');
    btn.textContent = doc.badge + '  ' + doc.title.split('（')[0].trim();
    if (isAvailable) {
      btn.addEventListener('click', () => switchDoc(i));
    }
    bar.appendChild(btn);
  });
}

function switchDoc(i) {
  document.querySelectorAll('.doc-tab').forEach((t, j) => {
    t.classList.toggle('active', j === i);
  });
  docIdx = i;
  loadDoc(i);
}

function loadDoc(i) {
  const doc = DESC_TERMS[i];
  deck = [...doc.terms];
  pos  = 0; knownSet.clear(); againSet.clear(); isFlipped = false;

  document.getElementById('doc-badge').textContent = doc.badge;
  document.getElementById('doc-title').textContent = doc.title;
  document.getElementById('doc-count').textContent = doc.terms.length + ' 語';

  document.getElementById('complete-panel').classList.remove('visible');
  document.getElementById('card-area').style.display = '';

  renderCard();
}

// ── Render ─────────────────────────────────────────────
function renderCard() {
  if (pos >= deck.length) { showComplete(); return; }

  const doc  = DESC_TERMS[docIdx];
  const term = deck[pos];
  isFlipped  = false;

  const fc = document.getElementById('flashcard');
  fc.classList.remove('flipped', 'card-in');
  void fc.offsetWidth; // reflow for animation
  fc.classList.add('card-in');

  document.getElementById('card-term').textContent = term.term;
  document.getElementById('card-def').textContent  = term.def;
  document.getElementById('front-tag').firstChild.nextSibling.textContent = ' ' + doc.title;

  const section = term.section || doc.section;
  document.getElementById('doc-link').href = doc.file + '#' + section;

  const total = deck.length;
  document.getElementById('card-counter').textContent = (pos + 1) + ' / ' + total;
  document.getElementById('progress-text').textContent = (pos + 1) + ' / ' + total;
  document.getElementById('progress-bar').style.width = (pos / total * 100) + '%';

  document.getElementById('result-btns').style.display = 'none';
  document.getElementById('btn-prev').disabled = pos === 0;
  document.getElementById('btn-next').disabled = false;
}

// ── Actions ────────────────────────────────────────────
function flipCard() {
  const fc = document.getElementById('flashcard');
  isFlipped = !isFlipped;
  fc.classList.toggle('flipped', isFlipped);
  if (isFlipped) document.getElementById('result-btns').style.display = 'flex';
}

function nextCard() {
  if (pos < deck.length - 1) { pos++; renderCard(); }
  else showComplete();
}

function prevCard() {
  if (pos > 0) { pos--; renderCard(); }
}

function markKnown() {
  knownSet.add(deck[pos].term);
  againSet.delete(deck[pos].term);
  nextCard();
}

function markAgain() {
  againSet.add(deck[pos].term);
  knownSet.delete(deck[pos].term);
  nextCard();
}

// ── Complete ───────────────────────────────────────────
function showComplete() {
  document.getElementById('card-area').style.display = 'none';
  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('progress-text').textContent = '完了';

  const total = DESC_TERMS[docIdx].terms.length;
  document.getElementById('stat-known').textContent = knownSet.size;
  document.getElementById('stat-again').textContent = againSet.size;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('complete-sub').textContent =
    '全 ' + total + ' 語を確認しました。復習が必要な語: ' + againSet.size + ' 語。';

  document.getElementById('complete-panel').classList.add('visible');
}

function restart() { loadDoc(docIdx); }

// ── Keyboard ───────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  if (e.key === 'ArrowRight' || e.key === 'l') nextCard();
  if (e.key === 'ArrowLeft'  || e.key === 'h') prevCard();
  if ((e.key === 'k' || e.key === 'K') && isFlipped) markKnown();
  if ((e.key === 'r' || e.key === 'R') && isFlipped) markAgain();
});

// ── Swipe (touch) ──────────────────────────────────────
let touchStartX = 0;
const fc = document.getElementById('flashcard');
fc.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
fc.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) < 12) return; // tap → flip handled by onclick
  if (dx < -60) nextCard();
  if (dx >  60) prevCard();
}, { passive: true });

init();
</script>
