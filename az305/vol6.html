tr><th>比較項目</th><th>Azure Blueprints</th><th>ARM テンプレート</th></tr></thead><tbody><tr><td>デプロイ後の接続</td><td>✓ 接続維持・追跡</td><td>✗ 切断される</td></tr><tr><td>ポリシー定義を含める</td><td>✓</td><td>✓</td></tr><tr><td>ロール割り当てを含める</td><td>✓</td><td>✓（限定的）</td></tr><tr><td>スコープ</td><td>管理グループ・サブスクリプション</td><td>リソース グループ</td></tr><tr><td>バージョン管理</td><td>✓</td><td>✗（手動管理）</td></tr></tbody></table></div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ ARM テンプレートは展開後もリソースとの関連性を維持する</div><div class=\"exp-block-body\">ARM テンプレートはデプロイ完了後にリソースとの接続を持ちません。テンプレートを変更してもリソースは自動更新されません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Blueprints のみが Azure Policy をサポート / Policy は ARM のみ</div><div class=\"exp-block-body\">どちらも Azure Policy を含めることができます。排他的な関係はありません。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">💡 覚え方</div><div class=\"exp-block-body\"><p><strong>Blueprint = 設計図（完成後も管理）</strong>、ARM = 施工図（建てたら終わり）<br>試験では「継続的な接続・追跡」がキーワードです。</p></div></div></div>","svg":""},{"num":3,"id":"q3","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"以下のリソースが East US リージョンに展開されています：\n・StoreAcctA（Storage v1）、StoreAcctB（Storage v2）\n・LogWS-A、LogWS-B（Log Analytics ワークスペース）\n・EventHub-A（Event Hub）\n\nSalesDB（Azure SQL Database）に DiagConfig1 という診断設定を構成しました：\n  - SQLInsights ログ → StoreAcctA にアーカイブ\n  - SQLInsights ログ → LogWS-A に送信\n\n次の文は正しいですか？\n「SalesDB に追加の診断設定を作成して、SQLInsights ログを EventHub-A に送信できる」","choices":[{"text":"正しい（True）","is_correct":true},{"text":"正しくない（False）","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ 正しい（True）</div><div class=\"exp-block-body\"><p>Azure 診断設定は最大 <strong>5 つ</strong>の異なる送信先を設定できます。</p><table class=\"exp-table\"><caption style=\"text-align:left;font-size:0.75rem;font-weight:700;color:#3d4966;padding:4px 0 2px\">診断設定の有効な送信先</caption><thead><tr><th>送信先の種類</th><th>対応</th><th>備考</th></tr></thead><tbody><tr><td>Storage Account</td><td>✓</td><td>アーカイブ・長期保存</td></tr><tr><td>Log Analytics Workspace</td><td>✓</td><td>クエリ・分析</td></tr><tr><td>Event Hub</td><td>✓</td><td>リアルタイム ストリーミング</td></tr><tr><td>Partner Solution</td><td>✓</td><td>サードパーティ SIEM 等</td></tr></tbody></table><p>DiagConfig1（StoreAcctA + LogWS-A）はすでに 2 送信先を使用しており、EventHub-A への追加送信先を含む新しい診断設定を作成できます。</p></div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ 正しくない（False）</div><div class=\"exp-block-body\">Event Hub は診断設定の有効な送信先です。既存設定とは独立して別の診断設定を追加できます。上限（5件）にも達していません。</div></div></div>","svg":""},{"num":4,"id":"q4","domain":"インフラ設計","domain_code":"IS","domain_color":"#0072C6","question_text":"オンプレミスの SQL Server アプリを Azure VM に移行します。以下の制約を満たす高可用性 SQL Server アーキテクチャを推奨してください：\n・コストを最小限に抑える\n・SQL Server インスタンスが利用不能になった場合、最小限の遅延でフェールオーバーする","choices":[{"text":"Always On フェールオーバー クラスター インスタンス（VNN）＋ Premium Azure ファイル共有","is_correct":false},{"text":"Always On 可用性グループ（Premium マネージド ディスク）＋ 分散ネットワーク名（DNN）","is_correct":true},{"text":"Always On フェールオーバー クラスター インスタンス（VNN）＋ Standard Azure ファイル共有","is_correct":false},{"text":"Always On 可用性グループ（Premium マネージド ディスク）＋ 仮想ネットワーク名（VNN）","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Always On 可用性グループ（Premium マネージド ディスク）＋ DNN</div><div class=\"exp-block-body\"><p><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 18 18\" width=\"14\" height=\"14\" style=\"vertical-align:middle;margin-right:3px;display:inline-block\"><defs><linearGradient id=\"sv_14_b39dcf83-187e-4c64-98df-431bb60809d2\" x1=\"0.5\" y1=\"10.04\" x2=\"13.18\" y2=\"10.04\" gradientUnits=\"userSpaceOnUse\"><stop offset=\"0\" stop-color=\"#005ba1\" /><stop offset=\"0.07\" stop-color=\"#0060a9\" /><stop offset=\"0.36\" stop-color=\"#0071c8\" /><stop offset=\"0.52\" stop-color=\"#0078d4\" /><stop offset=\"0.64\" stop-color=\"#0 l=\"#949494\" /></svg><strong style=\"font-size:0.85em\">Always On AG</strong> に <strong>DNN（分散ネットワーク名）</strong>を組み合わせることで Azure Load Balancer が不要になり、フェールオーバー時間を最短化できます。</p><table class=\"exp-table\"><caption style=\"text-align:left;font-size:0.75rem;font-weight:700;color:#3d4966;padding:4px 0 2px\">SQL Server HA 方式の比較</caption><thead><tr><th>方式</th><th>Load Balancer</th><th>フェールオーバー速度</th><th>コスト</th></tr></thead><tbody><tr><td>AG + DNN ✓</td><td>不要</td><td>最速（ヘルス プローブ待ち不要）</td><td>低</td></tr><tr><td>AG + VNN</td><td>必要</td><td>中（LB ヘルス プローブ分遅延）</td><td>中</td></tr><tr><td>FCI + VNN + Premium FS</td><td>必要</td><td>中</td><td>高（Premium FS）</td></tr><tr><td>FCI + VNN + Standard FS</td><td>必要</td><td>中</td><td>低〜中</td></tr></tbody></table></div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ FCI + VNN（Premium/Standard ファイル共有）</div><div class=\"exp-block-body\">FCI は Failover Cluster Instance で高可用性を提供しますが、VNN は Azure Load Balancer が必要でヘルス プローブによる追加遅延が生じます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ AG + VNN</div><div class=\"exp-block-body\">Premium マネージド ディスクで高性能ですが、VNN は Load Balancer を必要とし DNN より遅延が大きくなります。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">💡 DNN の仕組み</div><div class=\"exp-block-body\"><p>DNN はクラスターの DNS 名をすべてのノード IP にバインドします。<br>クライアントが <code>MultiSubnetFailover=True</code> を指定すると全 IP を並行試行できるため、LB のヘルス プローブ待ちが発生しません。</p></div></div></div>","svg":""},{"num":5,"id":"q5","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"オンプレミスの Microsoft SQL Server データベースを Azure に移行します。以下の要件を満たすソリューションを推奨してください：\n・ユーザーが開始するバックアップを許可する\n・異なる Azure リージョンの複数インスタンスへの自動レプリケーションを提供する\n・ビジネス継続性機能の構成・管理の運用オーバーヘッドを削減する\n\n最適なデプロイ サービスと、そのサービスで使用する冗長性ソリューションをそれぞれ 1 つずつ選んでください（計 2 つ）。","choices":[{"text":"Azure SQL Managed Instance","is_correct":true},{"text":"Azure VM 上の SQL Server","is_correct":false},{"text":"Azure SQL Database シングル データベース","is_correct":false},{ ,"correct_indices":[1,7],"n_correct":2,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ WorkloadA：Block Blob Storage（Premium、ZRS） ＋ WorkloadB：GPv2（Standard、Cool、RA-GRS）</div><div class=\"exp-block-body\"><table class=\"exp-table\"><caption style=\"text-align:left;font-size:0.75rem;font-weight:700;color:#3d4966;padding:4px 0 2px\">WorkloadA vs WorkloadB ストレージ設計</caption><thead><tr><th></th><th>WorkloadA</th><th>WorkloadB</th></tr></thead><tbody><tr><td>要件</td><td>最高スループット・最低レイテンシ</td><td>最低 GB 単価</td></tr><tr><td>アカウント種別</td><td>Block Blob Storage</td><td>General Purpose v2</td></tr><tr><td>パフォーマンス層</td><td>Premium（SSD）</td><td>Standard（HDD）</td></tr><tr><td>アクセス層</td><td>N/A</td><td>Cool</td></tr><tr><td>冗長性</td><td>ZRS（ゾーン冗長）</td><td>RA-GRS（読み取りアクセス付き geo 冗長）</td></tr><tr><td>データセンター障害耐性</td><td>✓（ZRS = 3 ゾーン）</td><td>✓（RA-GRS = 別リージョン）</td></tr></tbody></table></div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ GPv1 + LRS（WorkloadA向け）</div><div class=\"exp-block-body\">GPv1 はレガシー。LRS は単一データセンター内のみでデータセンター障害に耐性がありません。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">💡 ストレージ アカウント種別の選び方</div><div class=\"exp-block-body\"><table class=\"exp-table\"><caption style=\"text-align:left;font-size:0.75rem;font-weight:700;color:#3d4966;padding:4px 0 2px\">ストレージ アカウント種別早見表</caption><thead><tr><th>種別</th><th>用途</th><th>Premium対応</th><th>ライフサイクル管理</th></tr></thead><tbody><tr><td>Block Blob Storage</td><td>大容量 BLOB 高速 I/O</td><td>✓</td><td>✗</td></tr><tr><td>General Purpose v2</td><td>汎用（推奨）</td><td>✗</td><td>✓</td></tr><tr><td>Blob Storage</td><td>BLOB 専用（レガシー）</td><td>✗</td><td>✓</td></tr><tr><td>File Storage</td><td>Premium ファイル共有</td><td>✓</td><td>✗</td></tr></tbody></table></div></div></div>","svg":""},{"num":7,"id":"q7","domain":"インフラ設計","domain_code":"IS","domain_color":"#0072C6","question_text":"Basic レベルの Azure Virtual WAN「CoreWan01」を管理しています。\n\n・EastHubA（E ベース全体を保存時に暗号化しますが、クエリ時に正規ユーザーが機密データを見ることを防ぎません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ RBAC</div><div class=\"exp-block-body\">テーブル・データベース レベルのアクセス制御は提供しますが、特定フィールドの動的マスクには対応しません。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">💡 DDM vs Always Encrypted</div><div class=\"exp-block-body\"><p><strong>DDM</strong>：アプリ変更不要・管理者には見える → 内部不正対策は弱い<br><strong>Always Encrypted</strong>：アプリ側で鍵管理 → DBA・クラウド管理者にも見せない → SSN などに最適</p></div></div></div>","svg":""},{"num":14,"id":"q14","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"Azure Storage を使用するアプリケーションをデプロイする予定です。以下の要件を満たすストレージ アカウントが必要です：\n・複数ユーザーのデータを保存する\n・各ユーザーのデータを異なる暗号化キーで暗号化する\n・すべての保存データをカスタマー マネージド キー（CMK）で暗号化する\n\nデプロイすべきストレージの組み合わせはどれですか？","choices":[{"text":"Azure Data Lake Storage Gen2 アカウントの BLOB","is_correct":false},{"text":"Premium ファイル共有ストレージ アカウントのファイル","is_correct":false},{"text":"General Purpose v2 ストレージ アカウントの BLOB","is_correct":true},{"text":"General Purpose v2 ストレージ アカウントのファイル","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ General Purpose v2 ストレージ アカウントの BLOB</div><div class=\"exp-block-body\"><p><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 18 18\" width=\"14\" height=\"14\" style=\"vertical-align:middle;margin-right:3px;display:inline-block\"><defs><linearGradient id=\"sv_46_a9c62307-1cd0-400c-911b-17ec6a9110ce\" x1=\"9\" y1=\"15.834\" x2=\"9\" y2=\"5.788\" gradientUnits=\"userSpaceOnUse\"><stop offset=\"0\" stop-color=\"#32bedd\" /><stop offset=\"0.775\" stop-color=\"#32d4f5\" /></linearGradient></defs><title>MsPortalFx.base.images-7</title><g id=\"sv_46_f31d214e-f09e-49e3-b3d2-7c5d55682d09\"><g><path d=\"M.5,5.788h17a0,0,0,0,1,0,0v9.478a.568.568,0,0,1-.568.568H1.068A.568.568,0,0,1,.5,15.266V5.788A0,0,0,0,1,.5,5.788Z\" fill=\"url(#sv_46_a9c62307-1cd0-400c-911b-17ec6a9110ce)\" /><path d=\"M1.071,2.166H16.929a.568.568,0,0,1,.568.568V5.788a0,0,0,0,1,0,0H.5a0,0,0,0,1,0,0V2.734A.568.568,0,0,1,1.071,2.166Z\" fill=\"#0078d4\" /><rect x=\"2.328\" y=\"7.049\" width=\"6.281\" height=\"3.408\" rx=\"0.283\" fill=\"#0078d4\" /><rect x=\"9.336\" y=\"7.049\" width=\"6.281\" height=\"3.408\" rx=\"0.283\" fill=\"#fff\" /><rect x=\"2.296\" y=\"11.128\" width=\"6.281\" height=\"3.408\" rx=\"0.283\" fill=\"#0078d4\" /><rect x=\"9.304\" y=\"11.128\" width=\"6.281\" height=\"3.408\" rx=\"0.283\" fill=\"#0078d4\" /></g></g></svg><strong style=\"font-size:0.85em\">GPv2 BLOB</strong> は <strong>暗号化スコープ</strong>（Encryption Scopes）をサポートし、コンテナーや BLOB ごとに異なるカスタマー マネージド キー（CMK）を使用できます。</p><table class=\"exp-table\"><caption style=\"text-align:left;font-size:0.75rem;font-weight:700;color:#3d4966;padding:4px 0 2px\">ユーザーごとの暗号化キー対応比較</caption><thead><tr><th>ストレージ種別</th><th>CMK サポート</th><th>ユーザーごとの別キー</th><th>用途</th></tr></thead><tbody><tr><td>GPv2 BLOB ✓</td><td>✓</td><td>✓（暗号化スコープ）</td><td>汎用・アプリ データ</td></tr><tr><td>ADLS Gen2</td><td>✓</td><td>△（ファイル システム単位）</td><td>ビッグ データ分析</td></tr><tr><td>Premium File Share</td><td>✓</td><td>✗（共有全体のみ）</td><td>SMB ファイル共有</td></tr><tr><td>GPv2 File</td><td>✓</td><td>✗</td><td>SMB ファイル共有</td></tr></tbody></table></div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ ADLS Gen2 / Premium File Share / GPv2 File</div><div class=\"exp-block-body\">ADLS Gen2 はビッグ データ分析向けでアプリ ユーザー データに最適ではありません。File Share 系はユーザーごとの CMK 設定が不可です。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">💡 暗号化スコープ（Encryption Scopes）とは</div><div class=\"exp-block-body\"><p>GPv2 BLOB の機能で、コンテナーや個別 BLOB に異なる CMK を割り当て可能。<br>Azure Key Vault と統合して鍵をローテーション・管理できます。</p></div></div></div>","svg":""},{"num":15,"id":"q15","domain":"インフラ設計","domain_code":"IS","domain_color":"#0072C6","question_text":"複数の Azure サービスで構成される販売アプリケーションを構築しています。各サービスはトランザクションの異なる部分（注文処理・請求・支払い・在庫管理・配送）を担当します。\n\nサービス間でトランザクション詳細を非同期で交換する必要があり、メッセージは ckup / Always On AG</div><div class=\"exp-block-body\">Disk Backup は手動復旧が必要で 15 分 RTO は困難。Always On AG は SQL Server Enterprise が必要で高コストです。</div></div></div>","svg":""},{"num":26,"id":"q26","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"Azure Storage アカウントをデプロイしてファイル共有をホストします。ファイル共有にはトランザクション集約型のオンプレミス アプリケーションがアクセスします。\n\n要件：\n・ファイル共有へのアクセス レイテンシを最小化すること\n・選択したストレージ層で利用可能な最高レベルの回復性を提供すること\n\nストレージ層と冗長性オプションをそれぞれ 1 つ選んでください（計 2 つ）。","choices":[{"text":"ストレージ層：Hot","is_correct":false},{"text":"ストレージ層：Premium","is_correct":true},{"text":"ストレージ層：トランザクション最適化","is_correct":false},{"text":"冗長性：Geo 冗長ストレージ（GRS）","is_correct":false},{"text":"冗長性：ゾーン冗長ストレージ（ZRS）","is_correct":true},{"text":"冗長性：ローカル冗長ストレージ（LRS）","is_correct":false}],"correct_indices":[1,4],"n_correct":2,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Premium ストレージ層 ＋ ZRS</div><div class=\"exp-block-body\"><table class=\"exp-table\"><caption style=\"text-align:left;font-size:0.75rem;font-weight:700;color:#3d4966;padding:4px 0 2px\">Azure Files ストレージ層比較</caption><thead><tr><th></th><th>Premium ファイル共有（✓）</th><th>Hot / Transaction Opt.</th></tr></thead><tbody><tr><td>バックアップ</td><td>SSD</td><td>HDD</td></tr><tr><td>レイテンシ</td><td>最低（<1ms）</td><td>中</td></tr><tr><td>IOPS</td><td>最大 100,000+</td><td>数千</td></tr><tr><td>ZRS 対応</td><td>✓</td><td>✗（Transaction Opt.）</td></tr><tr><td>LRS 対応</td><td>✓</td><td>✓</td></tr><tr><td>GRS 対応</td><td>✗</td><td>✓</td></tr></tbody></table></div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Hot / Transaction Optimized</div><div class=\"exp-block-body\">Hot は Blob 向けのアクセス層で Azure Files には適用されません。Transaction Optimized は ZRS をサポートせず最高回復性の要件を満たしません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ GRS / LRS</div><div class=\"exp-block-body\">GRS はクロスリージョンで DR 向きですが、アクティブな低レイテンシ アクセスには高レイテンシになります。LRS は単一 DC 内のみで最高回復性ではありません。</div></div> const TOTAL = QUESTIONS.length;
const LTR = 'ABCDEFGHIJKLMNOP';
let state={}, filter='all', multiSel={}, displayChoices={};
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function initState(){
  const chk=document.getElementById('chk-shuf');
  const doShuf=chk&&chk.checked;
  state={};multiSel={};displayChoices={};
  QUESTIONS.forEach(q=>{
    state[q.id]={answered:false,correct:false};
    displayChoices[q.id]=doShuf?shuf([...q.choices]):[...q.choices];
  });
}
function filtered(){return filter==='all'?QUESTIONS:QUESTIONS.filter(q=>q.domain===filter);}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){
  const qs=filtered();
  document.getElementById('qwrap').innerHTML=qs.map(q=>renderQ(q)).join('');
  qs.forEach(q=>{if(state[q.id]?.answered)restoreQ(q);});
  updateProgress();
}
// ===== REVIEW SYSTEM =====
let reviewSet = new Set(Object.keys(JSON.parse(localStorage.getItem('az305_review_data')||'{}')).filter(k=>k.startsWith('vol6_')).map(k=>k.slice(5)));
function toggleReview(qid, vol, num) {
  if(reviewSet.has(qid)) {
    reviewSet.delete(qid);
    const data = JSON.parse(localStorage.getItem('az305_review_data')||'{}');
    delete data[vol+'_'+qid];
    localStorage.setItem('az305_review_data', JSON.stringify(data));
  } else {
    reviewSet.add(qid);
    const q = QUESTIONS.find(x=>x.id===qid);
    if(q) {
      const data = JSON.parse(localStorage.getItem('az305_review_data')||'{}');
      const volNum = vol.replace('vol','');
      data[vol+'_'+qid] = {
        vol: vol, volNum: volNum, id: qid, num: q.num, domain: q.domain,
        question_text: q.question_text, choices: q.choices,
        correct_indices: q.correct_indices, n_correct: q.n_correct || 1,
        exp_html: q.exp_html || '', svg: q.svg || ''
      };
      localStorage.setItem('az305_review_data', JSON.stringify(data));
    }
  }
  localStorage.setItem('az305_review_ids', JSON.stringify(Object.keys(JSON.parse(localStorage.getItem('az305_review_data')||'{}'))));  // sync badge count
  const btn = document.getElementById('rbtn_'+qid);
  if(btn) btn.classList.toggle('review-active', reviewSet.has(qid));
  if(window.updateReviewBadge) updateReviewBadge();
}
function renderQ(q){
  const isMulti=q.n_correct>1;
  const mbadge=isMulti?`<span class="mbadge">複数選択 (${q.n_correct}つ)</span>`:'';
  const mhint=isMulti?`<div class="multi-hint">⚡ ${q.n_correct}つの選択肢を選んでください</div>`:'';
  const choices=(displayChoices[q.id]||q.choices).map((c,i)=>`<button class="cbtn" id="c_${q.id}_${i}" onclick="onChoice('${q.id}',${i})"><span class="cltr">${LTR[i]}</span><span>${escH(c.text)}</span></button>`).join('');
  const sub=isMulti?`<button class="submit-btn" id="sub_${q.id}" onclick="submitMulti('${q.id}')">回答を確定する</button>`:'';
  const archEl=q.svg?`<div class="arch-wrap arch-hidden" id="arch_${q.id}">${q.svg}<div class="arch-reveal-overlay"><span class="arch-reveal-hint">回答後にアーキテクチャ図が表示されます</span></div></div>`:'';
  return `<div class="qcard" id="card_${q.id}"><div class="qh"><span class="qnum">問 ${q.num}</span><span class="dbadge" style="background:${q.domain_color||'#0072C6'}">${q.domain}</span>${mbadge}<button class="review-btn ${reviewSet.has(q.id)?'review-active':''}" id="rbtn_${q.id}" onclick="toggleReview('${q.id}','vol6',${q.num})" title="復習リストに追加">★</button></div><div class="qbody"><p class="qtext">${escH(q.question_text)}</p></div>${archEl}${mhint}<div class="choices">${choices}</div>${sub}<div class="expanel" id="exp_${q.id}"><div id="rbadge_${q.id}"></div>${q.exp_html}</div></div>`;
}
function onChoice(qid,idx){
  if(state[qid]?.answered)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  if(q.n_correct>1){
    if(!multiSel[qid])multiSel[qid]=new Set();
    const btn=document.getElementById(`c_${qid}_${idx}`);
    if(multiSel[qid].has(idx)){multiSel[qid].delete(idx);btn.classList.remove('multi-selected');}
    else{if(multiSel[qid].size>=q.n_correct)return;multiSel[qid].add(idx);btn.classList.add('multi-selected');}
    const sub=document.getElementById(`sub_${qid}`);
    if(sub)sub.style.display=multiSel[qid].size>=q.n_correct?'block':'none';
  }else{
    state[qid]={answered:true,correct:(displayChoices[qid]||q.choices)[idx].is_correct};
    applyAnswer(q,[idx]);
  }
}
function submitMulti(qid){
  if(state[qid]?.answered)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  const sel=[...(multiSel[qid]||new Set())];
  const cset=new Set((displayChoices[qid]||q.choices).map((c,i)=>c.is_correct?i:-1).filter(i=>i>=0));
  state[qid]={answered:true,correct:sel.length===cset.size&&sel.every(i=>cset.has(i))};
  applyAnswer(q,sel);
}
function applyAnswer(q,sel){
  const sset=new Set(sel);const isOk=state[q.id].correct;
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);if(!btn)return;
    btn.disabled=true;btn.classList.remove('multi-selected');
    if(sset.has(i))btn.classList.add(c.is_correct?'correct':'wrong');
    if(c.is_correct&&!sset.has(i))btn.classList.add('reveal');
  });
  document.getElementById(`card_${q.id}`).classList.add(isOk?(q.n_correct>1?'multi-ok':'ok'):'ng');
  const archEl = document.getElementById('arch_'+q.id);
  if(archEl) archEl.classList.add('arch-revealed');
  document.getElementById(`rbadge_${q.id}`).innerHTML=isOk
    ?`<div class="rbadge ${q.n_correct>1?'multi-ok':'ok'}">${q.n_correct>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説で正解・理由を確認しましょう</div>';
  document.getElementById(`exp_${q.id}`).style.display='block';
  const sub=document.getElementById(`sub_${q.id}`);if(sub)sub.style.display='none';
  updateProgress();
  setTimeout(()=>document.getElementById(`exp_${q.id}`).scrollIntoView({behavior:'smooth',block:'nearest'}),120);
}
function restoreQ(q){
  const s=state[q.id];if(!s?.answered)return;
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);if(!btn)return;
    btn.disabled=true;if(c.is_correct)btn.classList.add(s.correct?'correct':'reveal');
  });
  document.getElementById(`card_${q.id}`).classList.add(s.correct?(q.n_correct>1?'multi-ok':'ok'):'ng');
  const exp=document.getElementById(`exp_${q.id}`);if(exp)exp.style.display='block';
  const badge=document.getElementById(`rbadge_${q.id}`);
  if(badge)badge.innerHTML=s.correct
    ?`<div class="rbadge ${q.n_correct>1?'multi-ok':'ok'}">${q.n_correct>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説で正解・理由を確認しましょう</div>';
}
function filterDomain(d){
  filter=d;
  document.querySelectorAll('.dbtn').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  render();window.scrollTo({top:0});
}
function updateProgress(){
  const ans=Object.values(state).filter(s=>s.answered).length;
  const cor=Object.values(state).filter(s=>s.correct).length;
  document.getElementById('pbar').style.width=(ans/TOTAL*100)+'%';
  document.getElementById('hdrScore').textContent=`${cor}/${TOTAL}`;
  document.getElementById('hdrPct').textContent=`正解率 ${ans>0?Math.round(cor/ans*100):0}%`;
}
function showResults(){
  const cor=Object.values(state).filter(s=>s.correct).length;
  const pct=Math.round(cor/TOTAL*100);
  const ds={};
  QUESTIONS.forEach(q=>{
    if(!ds[q.domain])ds[q.domain]={t:0,c:0,color:q.domain_color||'#333'};
    ds[q.domain].t++;if(state[q.id]?.correct)ds[q.domain].c++;
  });
  document.getElementById('mscore').textContent=`${cor}/${TOTAL}`;
  document.getElementById('mpct').textContent=`正解率 ${pct}%`;
  const SVG_TROPHY='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 21 12 17 16 21"/><line x1="12" y1="17" x2="12" y2="11"/><path d="M18 6H6l1-4h10l1 4z"/><path d="M6 6c0 7 6 11 6 11s6-4 6-11"/></svg>';
  const SVG_UP='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>';
  const SVG_ZAP='<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
  const SVG_BOOK='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
  let icon=SVG_BOOK,msg='';
  if(pct>=80){icon=SVG_TROPHY;msg='合格圏内！本番でも自信を持って！';}
  else if(pct>=70){icon=SVG_UP;msg='あと少し！弱点ドメインを集中的に復習しよう。';}
  else if(pct>=50){icon=SVG_ZAP;msg='「間違えやすいポイント」を重点的に確認しよう。';}
  else{icon=SVG_BOOK;msg='各解説の「なぜ正解か」「なぜ不正解か」をしっかり読もう！';}
  document.getElementById('micon').innerHTML=icon;
  document.getElementById('mmsg').textContent=msg;
  document.getElementById('mdomains').innerHTML=Object.entries(ds).map(([d,s])=>{
    const p=Math.round(s.c/s.t*100);
    return `<div class="m-ditem"><div class="m-dname">${d}</div><div class="m-dval" style="color:${s.color}">${s.c}/${s.t} <span style="font-size:13px;font-weight:500;color:#888">(${p}%)</span></div></div>`;
  }).join('');
  document.getElementById('modal').classList.add('show');
}
function modalClose(e){if(!e||e.target.id==='modal')document.getElementById('modal').classList.remove('show');}
function resetAll(){document.getElementById('modal').classList.remove('show');initState();render();window.scrollTo({top:0,behavior:'smooth'});}
window.addEventListener('scroll',()=>document.getElementById('scrollTop').classList.toggle('show',window.scrollY>400));
initState();render();

// Highlight active vol nav link
(function(){
  const path = location.pathname;
  const m = path.match(/vol(\d+)\.html/);
  if(m) {
    const el = document.getElementById('vj'+m[1]);
    if(el) el.classList.add('vj-active');
  }
  function updateReviewBadge(){
    const ids = JSON.parse(localStorage.getItem('az305_review_ids')||'[]');
    const badge = document.getElementById('vj-review-count');
    if(badge) badge.textContent = ids.length > 0 ? ids.length : '';
  }
  updateReviewBadge();
  window.updateReviewBadge = updateReviewBadge;
})();
