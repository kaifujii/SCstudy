<script>
const QUESTIONS = [{"num":1,"id":"q1","domain":"ID・ガバナンス","domain_code":"ID","domain_color":"#7719AA","question_text":"オンプレミス環境と同期された Microsoft Entra テナントを管理しています。\n\nWebApp1 というオンプレミスの Web アプリが統合 Windows 認証（IWA）を使用しています。\nリモートワーク中のユーザーは VPN 接続なしで WebApp1 に SSO アクセスする必要があります。\n\n要件を満たす Microsoft Entra 機能を 2 つ選んでください。","choices":[{"text":"Microsoft Entra Identity Management (PIM)","is_correct":false},{"text":"Microsoft Entra エンタープライズ アプリケーション","is_correct":true},{"text":"条件付きアクセス ポリシー","is_correct":false},{"text":"Microsoft Entra アプリケーション プロキシ","is_correct":true},{"text":"Azure Application Gateway","is_correct":false},{"text":"Azure Arc","is_correct":false}],"correct_indices":[1,3],"n_correct":2,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Microsoft Entra エンタープライズ アプリケーション</div><div class=\"exp-block-body\">オンプレミスおよびクラウドのアプリを SSO・ユーザー割り当て・条件付きアクセス向けに構成・公開するために使用します。WebApp1 をエンタープライズ アプリとして登録することで、Entra ID との統合が可能になります。</div></div><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Microsoft Entra アプリケーション プロキシ</div><div class=\"exp-block-body\">VPN なしでオンプレミス アプリへの安全なリモート アクセスを提供します。オンプレミスに軽量コネクタをインストールし、Entra ID 経由でリモート ユーザーが SSO でアクセスできます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Microsoft Entra Identity Management (PIM)</div><div class=\"exp-block-body\">PIM は特権ロールの Just-In-Time アクセス管理に使用します。オンプレミス アプリの公開や SSO とは無関係です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ 条件付きアクセス ポリシー</div><div class=\"exp-block-body\">アクセス制御の強化には使えますが、アプリの公開や SSO 機能そのものを提供するものではありません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Application Gateway</div><div class=\"exp-block-body\">L7 ロード バランサーです。オンプレミス アプリの Entra ID 統合 SSO とは無関係です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Arc</div><div class=\"exp-block-body\">ハイブリッド クラウド管理サービスです。アプリ アクセスや SSO の提供は行いません。</div></div></div>","svg":""},{"num":2,"id":"q2","domain":"ID・ガバナンス","domain_code":"ID","domain_color":"#7719AA","question_text":"Azure Blueprints と Azure Resource Manager（ARM）テンプレートの主な違いとして正しい説明はどれですか？","choices":[{"text":"Azure Blueprints のみが Azure Policy 定義をサポートする","is_correct":false},{"text":"Blueprint は展開されたリソースとの接続を維持する","is_correct":true},{"text":"ARM テンプレートは展開後もリソースとの継続的な関連性を維持する","is_correct":false},{"text":"Azure Policy 定義は ARM テンプレートを使用した場合にのみ含められる","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Blueprint は展開されたリソースとの接続を維持する</div><div class=\"exp-block-body\">Azure Blueprints は展開されたリソースとの接続を維持し、継続的なコンプライアンス追跡や更新を可能にします。これが ARM テンプレートとの主な違いです。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Blueprints のみが Azure Policy 定義をサポートする</div><div class=\"exp-block-body\">ARM テンプレートも Azure Policy の割り当てを含むことができます。どちらもポリシー定義をサポートします。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ ARM テンプレートは展開後もリソースとの継続的な関連性を維持する</div><div class=\"exp-block-body\">誤りです。ARM テンプレートはデプロイ完了後にリソースとの接続を持ちません。テンプレートを変更してもリソースは自動更新されません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Policy 定義は ARM テンプレートを使用した場合にのみ含められる</div><div class=\"exp-block-body\">Blueprints もポリシー定義・ロール割り当て・リソース グループを含むことができます。</div></div></div>","svg":""},{"num":3,"id":"q3","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"以下のリソースが East US リージョンに展開されています：\n・StoreAcctA（Storage v1）、StoreAcctB（Storage v2）\n・LogWS-A、LogWS-B（Log Analytics ワークスペース）\n・EventHub-A（Event Hub）\n\nSalesDB（Azure SQL Database）に DiagConfig1 という診断設定を構成しました：\n  - SQLInsights ログ → StoreAcctA にアーカイブ\n  - SQLInsights ログ → LogWS-A に送信\n\n次の文は正しいですか？\n「SalesDB に追加の診断設定を作成して、SQLInsights ログを EventHub-A に送信できる」","choices":[{"text":"正しい（True）","is_correct":true},{"text":"正しくない（False）","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ 正しい（True）</div><div class=\"exp-block-body\">Azure 診断設定は最大 5 つの送信先（ストレージ アカウント、Log Analytics、Event Hub など）をサポートします。EventHub-A は有効な送信先であるため、新しい診断設定を作成して SQLInsights ログを送信できます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ 正しくない（False）</div><div class=\"exp-block-body\">Event Hub は診断設定の有効な送信先です。既存の設定（StoreAcctA + LogWS-A）とは独立して追加設定を作成できます。</div></div></div>","svg":""},{"num":4,"id":"q4","domain":"インフラ設計","domain_code":"IS","domain_color":"#0072C6","question_text":"オンプレミスの SQL Server アプリを Azure VM に移行します。以下の制約を満たす高可用性 SQL Server アーキテクチャを推奨してください：\n・コストを最小限に抑える\n・SQL Server インスタンスが利用不能になった場合、最小限の遅延でフェールオーバーする","choices":[{"text":"Always On フェールオーバー クラスター インスタンス（VNN）＋ Premium Azure ファイル共有","is_correct":false},{"text":"Always On 可用性グループ（Premium マネージド ディスク）＋ 分散ネットワーク名（DNN）","is_correct":true},{"text":"Always On フェールオーバー クラスター インスタンス（VNN）＋ Standard Azure ファイル共有","is_correct":false},{"text":"Always On 可用性グループ（Premium マネージド ディスク）＋ 仮想ネットワーク名（VNN）","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Always On 可用性グループ（DNN）</div><div class=\"exp-block-body\">DNN（分散ネットワーク名）は Azure Load Balancer への依存を排除し、フェールオーバー時間を短縮します。クライアントが MultiSubnetFailover=True を指定するとすべてのノード IP を並行試行でき、VNN より高速なフェールオーバーが実現します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Always On FCI（VNN）＋ Premium ファイル共有</div><div class=\"exp-block-body\">VNN は Azure Load Balancer を必要とし、ヘルス プローブによる追加の遅延が発生します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Always On FCI（VNN）＋ Standard ファイル共有</div><div class=\"exp-block-body\">コストは下がりますが VNN による Load Balancer の遅延は変わりません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Always On AG（VNN）</div><div class=\"exp-block-body\">VNN は依然として Load Balancer を必要とし、DNN と比較してフェールオーバー時間が長くなります。</div></div></div>","svg":""},{"num":5,"id":"q5","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"オンプレミスの Microsoft SQL Server データベースを Azure に移行します。以下の要件を満たすソリューションを推奨してください：\n・ユーザーが開始するバックアップを許可する\n・異なる Azure リージョンの複数インスタンスへの自動レプリケーションを提供する\n・ビジネス継続性機能の構成・管理の運用オーバーヘッドを削減する\n\n最適なデプロイ サービスと、そのサービスで使用する冗長性ソリューションをそれぞれ 1 つずつ選んでください（計 2 つ）。","choices":[{"text":"Azure SQL Managed Instance","is_correct":true},{"text":"Azure VM 上の SQL Server","is_correct":false},{"text":"Azure SQL Database シングル データベース","is_correct":false},{"text":"自動フェールオーバー グループ（Auto-failover group）","is_correct":true},{"text":"アクティブ geo レプリケーション（Active geo-replication）","is_correct":false},{"text":"ゾーン冗長デプロイ（Zone-redundant deployment）","is_correct":false}],"correct_indices":[0,3],"n_correct":2,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Azure SQL Managed Instance</div><div class=\"exp-block-body\">ユーザーが開始するバックアップをサポートします。Azure SQL Database とは異なり、手動バックアップをトリガーできます。</div></div><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ 自動フェールオーバー グループ</div><div class=\"exp-block-body\">複数リージョンへの自動レプリケーションと自動フェールオーバーを完全マネージドで提供します。Managed Instance と組み合わせることで、管理作業を最小限に抑えながら高可用性を実現します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure VM 上の SQL Server</div><div class=\"exp-block-body\">ユーザー バックアップは可能ですが、リージョン間の高可用性構成（可用性グループ等）に多大な管理作業が必要です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure SQL Database シングル データベース</div><div class=\"exp-block-body\">自動レプリケーションは提供しますが、ユーザーが開始するバックアップはサポートしません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ アクティブ geo レプリケーション</div><div class=\"exp-block-body\">クロスリージョン レプリケーションを提供しますが、フェールオーバーは手動操作が必要です。また Managed Instance では使用できません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ ゾーン冗長デプロイ</div><div class=\"exp-block-body\">単一リージョン内の高可用性を提供しますが、複数リージョンへのレプリケーションはサポートしません。</div></div></div>","svg":""},{"num":6,"id":"q6","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"WorkloadA と WorkloadB 向けに Azure Storage アカウント戦略を設計しています。\n\n設計要件：\n・WorkloadA：最高スループット・最低レイテンシのストレージが必要\n・WorkloadB：GB 単価が最も低いストレージが必要\n・両ワークロードはデータ センター障害時も可用性を維持する必要がある\n・両ワークロードは頻繁なアップロード・ダウンロード操作に最適化する\n\nWorkloadA と WorkloadB それぞれに推奨するストレージ構成を 1 つずつ選んでください（計 2 つ）。","choices":[{"text":"WorkloadA：Blob Storage（Standard、Hot、RA-GRS）","is_correct":false},{"text":"WorkloadA：Block Blob Storage（Premium、ZRS）","is_correct":true},{"text":"WorkloadA：General Purpose v1（Premium、LRS）","is_correct":false},{"text":"WorkloadA：General Purpose v2（Standard、Hot、LRS）","is_correct":false},{"text":"WorkloadB：Blob Storage（Standard、Cool、GRS）","is_correct":false},{"text":"WorkloadB：Block Blob Storage（Premium、ZRS）","is_correct":false},{"text":"WorkloadB：General Purpose v1（Standard、RA-GRS）","is_correct":false},{"text":"WorkloadB：General Purpose v2（Standard、Cool、RA-GRS）","is_correct":true}],"correct_indices":[1,7],"n_correct":2,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ WorkloadA：Block Blob Storage（Premium、ZRS）</div><div class=\"exp-block-body\">Block Blob Storage は高トランザクション レートと低レイテンシに最適化されています。Premium パフォーマンスで最小レイテンシを実現し、ZRS でデータ センター障害に対する可用性を確保します。</div></div><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ WorkloadB：General Purpose v2（Standard、Cool、RA-GRS）</div><div class=\"exp-block-body\">GPv2 は最も低い GB 単価を提供します。Cool アクセス層でさらにコストを削減し、RA-GRS でクロスリージョン可用性を確保します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ WorkloadA：Blob Storage（Standard、Hot、RA-GRS）</div><div class=\"exp-block-body\">Standard パフォーマンスでは最低レイテンシを実現できません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ WorkloadA：General Purpose v1（Premium、LRS）</div><div class=\"exp-block-body\">GPv1 はレガシーでモダン ワークロードに最適化されていません。LRS はデータ センター障害への耐性がありません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ WorkloadA：General Purpose v2（Standard、Hot、LRS）</div><div class=\"exp-block-body\">Standard パフォーマンスは Premium の速度に及ばず、LRS はデータ センター障害を防ぎません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ WorkloadB：Blob Storage（Standard、Cool、GRS）</div><div class=\"exp-block-body\">GRS は RA-GRS と比較して読み取りアクセスが制限されます。GPv2 の方が柔軟性があります。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ WorkloadB：Block Blob Storage（Premium、ZRS）</div><div class=\"exp-block-body\">Premium パフォーマンスはコストを大幅に増加させ、コスト最小化の要件に反します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ WorkloadB：General Purpose v1（Standard、RA-GRS）</div><div class=\"exp-block-body\">GPv1 は GPv2 と比較してオペレーション コストが高く、コスト最適化機能が劣ります。</div></div></div>","svg":""},{"num":7,"id":"q7","domain":"インフラ設計","domain_code":"IS","domain_color":"#0072C6","question_text":"Basic レベルの Azure Virtual WAN「CoreWan01」を管理しています。\n\n・EastHubA（East US）\n・WestHubB（West US）\n\nEast US に既存の ExpressRoute 回線があります。この回線を CoreWan01 に関連付ける計画です。\n\nExpressRoute 回線を Virtual WAN に接続する前に、最初に実行すべき操作はどれですか？","choices":[{"text":"CoreWan01 を Basic レベルから Standard レベルにアップグレードする","is_correct":true},{"text":"EastHubA に ExpressRoute ゲートウェイをデプロイする","is_correct":false},{"text":"East US リージョンにハブ仮想ネットワークを作成する","is_correct":false},{"text":"ExpressRoute 回線の ExpressRoute Premium アドオンを有効にする","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Standard レベルへのアップグレード</div><div class=\"exp-block-body\">ExpressRoute は Basic Virtual WAN ではサポートされません。Standard レベルにアップグレードすることで、ExpressRoute・VPN・リージョン間ハブ接続が利用可能になります。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ ExpressRoute ゲートウェイのデプロイ</ ctions（Dedicated + Basic）</div><div class=\"exp-block-body\">VNet 統合は可能ですが、Basic App Service プランはオートスケールや最適なパフォーマンスを提供せず、コスト効率が悪いです。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Logic Apps（従量課金プラン）</div><div class=\"exp-block-body\">VNet 統合をサポートせず、プライベート IP にアクセスできません。カスタム C# コードの実行にも適していません。</div></div></div>","svg":""},{"num":9,"id":"q9","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"高スループット ワークロードを処理するストレージ ソリューションを設計しています。以下の要件を満たす必要があります：\n・毎秒 800 リクエスト以上を処理できること\n・画像・動画・音声ファイルなどの大容量マルチメディア コンテンツを保存・配信すること\n\nデプロイすべき Azure ストレージ アカウントの種類はどれですか？","choices":[{"text":"Premium ファイル共有","is_correct":false},{"text":"Standard General Purpose v2","is_correct":false},{"text":"Premium ブロック BLOB","is_correct":true},{"text":"Premium ページ BLOB","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Premium ブロック BLOB</div><div class=\"exp-block-body\">ブロック BLOB は大規模データ ストレージとストリーミング ワークロード（画像・動画・音声）に最適化されています。Premium パフォーマンスにより高スループットと低レイテンシが保証され、毎秒 800 リクエスト以上に対応できます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Premium ファイル共有</div><div class=\"exp-block-body\">SMB ベースのワークロード向けで、大容量メディア コンテンツのストリーミングには最適化されていません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Standard General Purpose v2</div><div class=\"exp-block-body\">コスト効率は高いですが、Standard パフォーマンスでは低レイテンシや高トランザクション レートを保証できません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Premium ページ BLOB</div><div class=\"exp-block-body\">VM ディスク（VHD）やランダム読み書きアクセスが必要なワークロード向けです。大容量メディアの順次ストリーミングには最適化されていません。</div></div></div>","svg":""},{"num":10,"id":"q10","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"ミッション クリティカルなアプリケーションのストレージ ソリューションを設計しています。\n\n要件：\n・書き込みレイテンシの SLA を保証すること\n・スループットの SLA を保証すること\n\n推奨ストレージ ソリューションに含めるべきも domain_color":"#0072C6","question_text":"オンプレミスと Azure で仮想マシンを運用しており、ExpressRoute で接続されています。一部の VM でネットワーク接続の問題が発生しています。VM に到達するパケットが許可されているか遮断されているかを検査する必要があります。\n\n次の提案のうち、要件を満たすものはどれですか？","choices":[{"text":"Azure Network Watcher の Traffic Analytics を使用してネットワーク トラフィックを分析する","is_correct":false},{"text":"Azure Advisor を使用してネットワーク トラフィックを分析する","is_correct":false},{"text":"Azure Monitor エージェントと Dependency Agent をインストールして VM Insights でトラフィックを分析する","is_correct":false},{"text":"Azure Network Watcher の IP フロー確認を使用してトラフィックを分析する","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ IP フロー確認（IP flow verify）</div><div class=\"exp-block-body\">Azure Network Watcher の IP フロー確認は、NSG ルールに基づいて VM への特定のトラフィックが許可・拒否されているかを診断するためのツールです。送信元・宛先 IP、ポート、プロトコルを指定してテストでき、個別 VM の接続問題のトラブルシューティングに最適です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Traffic Analytics</div><div class=\"exp-block-body\">NSG フロー ログを基にした高レベルの分析を提供しますが、パケット レベルの可視性や個別 VM の許可・拒否の詳細は得られません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Advisor</div><div class=\"exp-block-body\">コスト・パフォーマンス・可用性・セキュリティのベスト プラクティスを推奨するサービスです。パケット レベルのネットワーク トラフィック分析機能はありません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ VM Insights</div><div class=\"exp-block-body\">パフォーマンス監視・依存関係マップを提供しますが、パケット レベルの解析や NSG ルールの許可・拒否の判定はできません。</div></div></div>","svg":""},{"num":17,"id":"q17","domain":"インフラ設計","domain_code":"IS","domain_color":"#0072C6","question_text":"Azure でステートレス Web アプリを実行する環境を設計しています。以下の条件を満たす必要があります：\n・完全な .NET Framework をサポートする\n・単一の Azure リージョンが利用不能になっても動作を継続する\n・管理者がカスタム依存関係をインストールするために OS にアクセスできること\n\n次の提案のうち、すべての要件を満たすものはどれですか？","choices":[{"text":"2 つの Azure リージョンに Azure VM をデプロイし、Azure Application Gateway を使用する","is_correct":false},{"text":"2 つの Azure リージョンに Azure VM をデプロイし、Azure Traffic Manager プロファイルを作成する","is_correct":true},{"text":"自動スケーリングを使用する Azure VM スケール セットをデプロイする","is_correct":false},{"text":"分離 App Service プランに Web アプリをデプロイする","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ VM × 2 リージョン ＋ Traffic Manager</div><div class=\"exp-block-body\">2 つのリージョンへの VM デプロイでリージョン冗長性を実現します。VM は OS へのフル アクセスを提供し、完全な .NET Framework と カスタム依存関係のインストールが可能です。Traffic Manager がリージョン間の DNS ベース グローバル ロード バランシングを実現し、フェールオーバーを自動化します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ VM × 2 リージョン ＋ Application Gateway</div><div class=\"exp-block-body\">Application Gateway はリージョン サービスであり、複数の Azure リージョンにまたがることができません。リージョン冗長性を実現するには Front Door や Traffic Manager などのグローバル ロード バランサーが必要です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ VM スケール セット（自動スケーリング）</div><div class=\"exp-block-body\">単一リージョン内で動作し、それ自体ではリージョン障害に対応できません。複数リージョンのデプロイと Traffic Manager などが別途必要です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ 分離 App Service プラン</div><div class=\"exp-block-body\">OS へのアクセスを提供せず、カスタム依存関係のインストールができません。また完全な .NET Framework をサポートせず、自動的なリージョン冗長性もありません。</div></div></div>","svg":""},{"num":18,"id":"q18","domain":"ID・ガバナンス","domain_code":"ID","domain_color":"#7719AA","question_text":"ironclad.com という Microsoft Entra テナントに SecGroupA というセキュリティ グループ（割り当て済みメンバーシップ）があります。現在 50 名のユーザー（うち 20 名はゲスト ユーザー）が所属しています。\n\n以下の条件を満たす SecGroupA のメンバーシップ管理方法を推奨してください：\n・レビュー プロセスが 3 ヶ月ごとに自動実行される\n・各メンバーが自分のアクセスが引き続き必要かを確認できる\n・不要と回答したメンバーが自動削除される\n・レビューに応答しないメンバーも自動削除される","choices":[{"text":"Microsoft Entra Identity Protection を有効化する","is_correct":false},{"text":"SecGroupA を動的ユーザー グループに変換する","is_correct":false},{"text":"SecGroupA のアクセス レビューを構成する","is_correct":true},{"text":"Microsoft Entra Privileged Identity Management（PIM）を有効化する","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ アクセス レビューの構成</div><div class=\"exp-block-body\">Microsoft Entra アクセス レビューを使用すると、割り当て済みグループのメンバーシップを定期的にレビューできます。3 ヶ月ごとの実行・メンバーによる自己証明・アクセス不要または無応答のユーザーの自動削除を設定できます。4 つの要件をすべて満たします。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Microsoft Entra Identity Protection</div><div class=\"exp-block-body\">リスクベースの条件付きアクセスとユーザー リスク検出に使用します。グループ メンバーシップのレビューや証明ワークフローには使用できません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ 動的ユーザー グループへの変換</div><div class=\"exp-block-body\">動的メンバーシップはルールとユーザー属性に基づくもので、ユーザーの自己証明やアクセス レビューをサポートしません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Privileged Identity Management（PIM）</div><div class=\"exp-block-body\">特権ロールへの Just-In-Time アクセス管理向けです。通常のセキュリティ グループの定期的なメンバーシップ レビューには適していません。</div></div></div>","svg":""},{"num":19,"id":"q19","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"機械学習ワークロード向けに Azure Databricks をデプロイする予定です。データ エンジニアが Azure Data Lake Storage アカウントを Databricks ファイル システム（DBFS）にマウントします。ストレージ アカウントのフォルダー レベルの権限は個々のデータ エンジニアに直接割り当てられています。\n\n以下の要件を満たす Databricks の設計にしてください：\n・データ エンジニアが明示的に許可されたストレージ フォルダーにのみアクセスできること\n・開発工数を最小限に抑えること\n・コストを最小限に抑えること\n\nDatabricks の SKU とクラスター構成からそれぞれ 1 つ選んでください（計 2 つ）。","choices":[{"text":"SKU：Standard","is_correct":false},{"text":"SKU：Premium","is_correct":true},{"text":"クラスター構成：Credential passthrough（資格情報パススルー）","is_correct":true},{"text":"クラスター構成：Managed Identities（マネージド ID）","is_correct":false},{"text":"クラスター構成：MLflow","is_correct":false},{"text":"クラスター構成：Photon ランタイム","is_correct":false},{"text":"クラスター構成：Secret Scope（シークレット スコープ）","is_correct":false}],"correct_indices":[1,2],"n_correct":2,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ SKU：Premium</div><div class=\"exp-block-body\">フォルダー レベルのアクセス制御に必要な Credential passthrough と ACL（アクセス制御リスト）は Databricks Premium SKU でのみ利用できます。ユーザーの Microsoft Entra ID に基づいてストレージ アクセスを適用できます。</div></div><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Credential passthrough</div><div class=\"exp-block-body\">ログイン ユーザーの ID を使用して Azure Data Lake Storage にアクセスします。ストレージ レイヤーでユーザーごとの権限が適用され、カスタム アクセス ロジックの実装なしにフォルダー レベルの制御が実現できます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ SKU：Standard</div><div class=\"exp-block-body\">Credential passthrough や細かいアクセス制御機能がないため、ユーザーごとのフォルダー権限を強制するには独自ロジックが必要になり開発工数が増加します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Managed Identities</div><div class=\"exp-block-body\">クラスターまたはワークスペース レベルでアクセスを提供するため、すべてのユーザーが同じ ID を使用します。ユーザーごとのフォルダー権限の強制ができません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ MLflow</div><div class=\"exp-block-body\">実験・モデルの追跡ツールです。ストレージのアクセス制御とは無関係です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Photon ランタイム</div><div class=\"exp-block-body\">クエリ パフォーマンス向上エンジンです。認証やアクセス制御の機能はありません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Secret Scope</div><div class=\"exp-block-body\">資格情報や API キーの管理ツールです。フォルダー レベルのアクセス権限を適用する機能はありません。</div></div></div>","svg":""},{"num":20,"id":"q20","domain":"インフラ設計","domain_code":"IS","domain_color":"#0072C6","question_text":"SalesApp と ShippingApp を含む Azure サブスクリプションを管理しています。SalesApp は出荷が必要なトランザクションをストレージ キューにメッセージを入れ、ShippingApp がそれを処理しています。\n\n将来的に追加のアプリケーションが導入され、各アプリがトランザクション詳細に基づいて特定の配送リクエストのみを処理します。\n\n各アプリケーションが関連するメッセージのみを独立して受信・処理できるよう、既存のストレージ キューの代替として推奨するものはどれですか？","choices":[{"text":"1 つの Azure Data Factory パイプライン","is_correct":false},{"text":"複数のストレージ アカウント キュー","is_correct":false},{"text":"1 つの Azure Service Bus キュー","is_correct":false},{"text":"1 つの Azure Service Bus トピック","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Azure Service Bus トピック</div><div class=\"exp-block-body\">トピックはパブリッシュ・サブスクライブ パターンをサポートし、複数のアプリが同じメッセージ ストリームを独立してサブスクライブし、フィルターで関連するメッセージのみを受信できます。将来の複数アプリ対応に最適です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Data Factory パイプライン</div><div class=\"exp-block-body\">データ統合・変換ワークフロー向けです。リアルタイム メッセージングやイベント ドリブン通信には適していません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ 複数のストレージ キュー</div><div class=\"exp-block-body\">各アプリにメッセージを手動で複製する必要があり、管理オーバーヘッドが増大します。ルーティングやフィルタリング機能もありません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Service Bus キュー</div><div class=\"exp-block-body\">1 対 1 のコンシューマー モデルです。1 つのアプリしかメッセージを受信できず、複数アプリが異なる条件で処理する要件に対応できません。</div></div></div>","svg":""},{"num":21,"id":"q21","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"以下のストレージ アカウントを持つ Azure サブスクリプションがあります：\n\n・StoreAlpha：StorageV2、Standard パフォーマンス\n・StoreBeta：StorageV2、Premium パフォーマンス\n・StoreGamma：BlobStorage、Standard パフォーマンス\n・StoreDelta：FileStorage、Premium パフォーマンス\n\n2 つのアプリを新規デプロイします：\n・AppOne：データを異なるストレージ アクセス層間で移動するライフサイクル管理ルールが必要\n・AppTwo：Azure ファイル共有にデータを保存する必要がある\n\nAppOne と AppTwo のそれぞれに推奨するストレージ アカウントを 1 つずつ選んでください（計 2 つ）。","choices":[{"text":"AppOne：StoreAlpha（StorageV2 Standard）のみ","is_correct":false},{"text":"AppOne：StoreAlpha と StoreBeta","is_correct":false},{"text":"AppOne：StoreAlpha と StoreGamma（StorageV2 + BlobStorage、いずれも Standard）","is_correct":true},{"text":"AppOne：StoreAlpha、StoreBeta、StoreGamma","is_correct":false},{"text":"AppTwo：StoreDelta（FileStorage Premium）のみ","is_correct":false},{"text":"AppTwo：StoreAlpha と StoreDelta","is_correct":true},{"text":"AppTwo：StoreAlpha、StoreBeta、StoreDelta","is_correct":false}],"correct_indices":[2,5],"n_correct":2,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ AppOne：StoreAlpha と StoreGamma</div><div class=\"exp-block-body\">ライフサイクル管理は StorageV2（Standard）と BlobStorage（Standard）のみでサポートされます。StoreAlpha は StorageV2 Standard、StoreGamma は BlobStorage Standard のため両方対応。StoreBeta は StorageV2 Premium のためライフサイクル管理非対応。StoreDelta は FileStorage のため対象外。</div></div><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ AppTwo：StoreAlpha と StoreDelta</div><div class=\"exp-block-body\">Azure ファイル共有は StorageV2（Standard）とFileStorage（Premium）でサポートされます。StoreAlpha（StorageV2 Standard）は標準 Azure Files をサポート。StoreDelta（FileStorage Premium）は高パフォーマンスの Premium Azure Files をサポート。StoreBeta（StorageV2 Premium）はファイル共有非対応。StoreGamma（BlobStorage）はファイル共有をサポートしません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ その他の選択肢</div><div class=\"exp-block-body\">StoreBeta（StorageV2 Premium）はライフサイクル管理も Standard Files もサポートしません。StoreGamma（BlobStorage）はファイル共有をサポートしません。</div></div></div>","svg":""},{"num":22,"id":"q22","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"50 MB から 15 GB のビデオ コンテンツを保存するアプリケーションをデプロイします。インターネット経由でアクセスし、証明書ベースの認証を使用します。\n\n要件：\n・最速の読み取りパフォーマンスを提供する\n・ストレージ コストを最小限に抑える\n\n選択すべきストレージ ソリューションはどれですか？","choices":[{"text":"Azure Files","is_correct":false},{"text":"Azure Data Lake Storage Gen2","is_correct":false},{"text":"Azure Blob Storage","is_correct":true},{"text":"Azure SQL Database","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Azure Blob Storage</div><div class=\"exp-block-body\">大容量の非構造化データ（ビデオ ファイルなど）の保存に最適化されており、ホット アクセス層・CDN 統合・高スケーラビリティで高速な読み取りパフォーマンスを実現します。HTTPS によるパブリック アクセスと SAS による証明書ベース認証をサポートし、アクセス層（ホット・クール・アーカイブ）でコストを最小化できます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Files</div><div class=\"exp-block-body\">エンタープライズ アプリ向けのマネージド SMB/NFS ファイル共有サービスで、大規模インターネット向けコンテンツ配信には適していません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Data Lake Storage Gen2</div><div class=\"exp-block-body\">ビッグ データ分析ワークロード向けです。ビデオ ストリーミングのパフォーマンス最適化は Blob Storage には劣ります。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure SQL Database</div><div class=\"exp-block-body\">50 MB〜15 GB の大容量非構造化ファイルの保存には適しておらず、パフォーマンスとコストの両面で非効率です。</div></div></div>","svg":""},{"num":23,"id":"q23","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"オンプレミスのデータベースを Azure に移行します。以下の要件を満たすデータベース プラットフォームを設計してください：\n・必要に応じてスケールアップ・スケールダウンできること\n・地理的にレプリケートされたバックアップを提供すること\n・最大 75 TB のデータベース サイズをサポートすること\n・オンライン トランザクション処理（OLTP）ワークロードに適していること\n\n最適な Azure サービスとサービス レベルをそれぞれ 1 つ選んでください（計 2 つ）。","choices":[{"text":"Azure SQL Database","is_correct":true},{"text":"Azure SQL Managed Instance","is_correct":false},{"text":"Azure Synapse Analytics","is_correct":false},{"text":"Azure VM 上の SQL Server","is_correct":false},{"text":"サービス レベル：Hyperscale","is_correct":true},{"text":"サービス レベル：Business Critical","is_correct":false},{"text":"サービス レベル：General Purpose","is_correct":false},{"text":"サービス レベル：Standard","is_correct":false}],"correct_indices":[0,4],"n_correct":2,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Azure SQL Database</div><div class=\"exp-block-body\">動的スケーリング・組み込みの geo 冗長バックアップ・OLTP 最適化を提供するフル マネージド PaaS サービスです。Hyperscale レベルと組み合わせることで 75 TB 以上をサポートできます。</div></div><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ サービス レベル：Hyperscale</div><div class=\"exp-block-body\">Azure SQL Database で唯一 100 TB までサポートする層です（75 TB の要件を満たします）。迅速な自動拡張スケーリング・geo 冗長バックアップ・高パフォーマンス OLTP をサポートします。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure SQL Managed Instance</div><div class=\"exp-block-body\">最大データベース サイズが 16 TB に制限されており、75 TB の要件を満たしません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Synapse Analytics</div><div class=\"exp-block-body\">OLAP（分析処理）向けに最適化されており、高スループットのトランザクション ワークロードには適していません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure VM 上の SQL Server</div><div class=\"exp-block-body\">大容量はサポートしますが、geo レプリケーションは組み込みではなく、カスタム構成が必要で管理オーバーヘッドが増大します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Business Critical / General Purpose / Standard</div><div class=\"exp-block-body\">これらのサービス レベルは 75 TB のデータベース サイズをサポートしません。</div></div></div>","svg":""},{"num":24,"id":"q24","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"中央のデータ ストアからユーザーにコンテンツを収集・提供するアプリケーションを構築しています。以下の要件を満たすデータベース プラットフォームを選択してください：\n・SQL ベースのクエリでデータにアクセスできること\n・複数のリージョンから同時に書き込み操作をサポートすること\n・読み取り操作の一貫した低レイテンシを保証すること\n\n推奨するデータベース ソリューションはどれですか？","choices":[{"text":"Azure Cosmos DB for NoSQL","is_correct":true},{"text":"アクティブ geo レプリケーションを使用した Azure SQL Database","is_correct":false},{"text":"Azure SQL Database Hyperscale","is_correct":false},{"text":"Azure Cosmos DB for PostgreSQL","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Azure Cosmos DB for NoSQL</div><div class=\"exp-block-body\">SQL API による SQL クエリ・マルチ マスター書き込み（複数リージョンへの同時書き込み）・シングル桁ミリ秒の低レイテンシ読み取りをすべて提供します。グローバル分散アプリケーションに最適です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ アクティブ geo レプリケーションの Azure SQL Database</div><div class=\"exp-block-body\">読み取り専用レプリカのみをサポートし、マルチ マスター書き込みはできません。書き込みはプライマリ データベースに向ける必要があります。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure SQL Database Hyperscale</div><div class=\"exp-block-body\">高スケーラビリティと高パフォーマンスを提供しますが、マルチ マスター書き込みやグローバルな低レイテンシ読み取りはサポートしません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Cosmos DB for PostgreSQL</div><div class=\"exp-block-body\">複数リージョンへの書き込みはサポートしますが、NoSQL ベースのアプリケーション向けの SQL API や JSON ドキュメント ストアの柔軟性がありません。</div></div></div>","svg":""},{"num":25,"id":"q25","domain":"ビジネス継続性","domain_code":"BC","domain_color":"#C50F1F","question_text":"Azure VM 上の SQL Server があり、データベースは毎晩のスケジュール バッチ ジョブで書き込まれます。以下の要件を満たすデータベースの災害復旧アプローチを選択してください：\n・Azure リージョン全体が利用不能になった場合に復旧できること\n・15 分の RTO（目標復旧時間）をサポートすること\n・24 時間の RPO（目標復旧地点）をサポートすること\n・手動操作なしで自動的に復旧すること\n・コストを最小限に抑えること\n\n推奨に含めるべきものはどれですか？","choices":[{"text":"Azure VM 可用性セット","is_correct":false},{"text":"Azure ディスク バックアップ","is_correct":false},{"text":"Always On 可用性グループ","is_correct":false},{"text":"Azure Site Recovery","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Azure Site Recovery</div><div class=\"exp-block-body\">リージョン障害時の Azure VM（SQL Server を含む）の災害復旧を提供します。自動復旧をサポートし 15 分の RTO 要件を満たし、スケジュール レプリケーションで 24 時間の RPO を実現します。Always On 可用性グループよりコストを低く抑えられます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure VM 可用性セット</div><div class=\"exp-block-body\">単一リージョン内のハードウェア障害に対する高可用性を提供しますが、リージョン全体の障害には対応できません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure ディスク バックアップ</div><div class=\"exp-block-body\">スナップショット ベースの保護ですが、自動復旧をサポートせず、15 分の RTO 要件を満たすことが困難です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Always On 可用性グループ</div><div class=\"exp-block-body\">低い RTO/RPO を実現しますが、SQL Server Enterprise エディションが必要で費用が高く、コスト最小化の要件に反します。</div></div></div>","svg":""},{"num":26,"id":"q26","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"Azure Storage アカウントをデプロイしてファイル共有をホストします。ファイル共有にはトランザクション集約型のオンプレミス アプリケーションがアクセスします。\n\n要件：\n・ファイル共有へのアクセス レイテンシを最小化すること\n・選択したストレージ層で利用可能な最高レベルの回復性を提供すること\n\nストレージ層と冗長性オプションをそれぞれ 1 つ選んでください（計 2 つ）。","choices":[{"text":"ストレージ層：Hot","is_correct":false},{"text":"ストレージ層：Premium","is_correct":true},{"text":"ストレージ層：トランザクション最適化","is_correct":false},{"text":"冗長性：Geo 冗長ストレージ（GRS）","is_correct":false},{"text":"冗長性：ゾーン冗長ストレージ（ZRS）","is_correct":true},{"text":"冗長性：ローカル冗長ストレージ（LRS）","is_correct":false}],"correct_indices":[1,4],"n_correct":2,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Premium ストレージ層</div><div class=\"exp-block-body\">SSD バックアップで最低レイテンシと最高 IOPS を提供します。トランザクション集約型ワークロードのオンプレミス アプリに最適です。ZRS をサポートするため最高レベルの回復性も実現できます。</div></div><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ ゾーン冗長ストレージ（ZRS）</div><div class=\"exp-block-body\">リージョン内の 3 つの可用性ゾーンにデータを同期レプリケーションし、データ センター レベルの障害から保護します。Premium Azure Files での最高回復性オプションです。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Hot</div><div class=\"exp-block-body\">BLOB ストレージ向けのアクセス層で、Azure Files には適用されません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ トランザクション最適化</div><div class=\"exp-block-body\">ファイル共有には使用できますが、Premium と比較してパフォーマンスが低く、ZRS をサポートしないため回復性も劣ります。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ GRS</div><div class=\"exp-block-body\">クロスリージョン レプリケーションはディザスター リカバリー向けで、アクティブなトランザクション アクセスには高レイテンシになります。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ LRS</div><div class=\"exp-block-body\">単一データ センター内のみのレプリケーションで、最低レベルの回復性しか提供しません。</div></div></div>","svg":""},{"num":27,"id":"q27","domain":"ID・ガバナンス","domain_code":"ID","domain_color":"#7719AA","question_text":"Microsoft Entra ID ユーザーがオンライン アンケートを作成・公開できる SaaS ソリューションを設計しています。フロントエンド Web アプリとバックエンド Web API で構成されています。\n\n要件：\n・Web アプリが OAuth 2.0 ベアラー トークンを使用してバックエンド API を呼び出すこと\n・Web アプリがアプリケーション専用 ID ではなく、サインイン ユーザーの個別 ID を使用して認証すること\n\n「アクセス トークンは _____ によって生成される」に当てはまるものを選んでください。（設問 1/2）","choices":[{"text":"Microsoft Entra","is_correct":true},{"text":"Web アプリ","is_correct":false},{"text":"Web API","is_correct":false},{"text":"Azure Site Recovery","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Microsoft Entra</div><div class=\"exp-block-body\">OAuth 2.0 フローでは Microsoft Entra ID（認可サーバー）がアクセス トークンを発行します。Web アプリはサインイン ユーザーの代わりに Entra ID に認証し、取得したベアラー トークンを API 呼び出しに使用します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Web アプリ</div><div class=\"exp-block-body\">Web アプリは OAuth 2.0 フローのクライアントとして機能し、トークンを要求しますが発行しません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Web API</div><div class=\"exp-block-body\">Web API はリソース サーバーとして機能し、トークンを検証しますが生成しません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Site Recovery</div><div class=\"exp-block-body\">ディザスター リカバリー サービスであり、OAuth 認証とは無関係です。</div></div></div>","svg":""},{"num":28,"id":"q28","domain":"ID・ガバナンス","domain_code":"ID","domain_color":"#7719AA","question_text":"Microsoft Entra ID ユーザーがオンライン アンケートを作成・公開できる SaaS ソリューションを設計しています。フロントエンド Web アプリとバックエンド Web API で構成されています。\n\n要件：\n・Web アプリが OAuth 2.0 ベアラー トークンを使用してバックエンド API を呼び出すこと\n・Web アプリがアプリケーション専用 ID ではなく、サインイン ユーザーの個別 ID を使用して認証すること\n\n「認可の決定は _____ によって行われる」に当てはまるものを選んでください。（設問 2/2）","choices":[{"text":"Microsoft Entra","is_correct":false},{"text":"Web アプリ","is_correct":false},{"text":"Web API","is_correct":true}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Web API</div><div class=\"exp-block-body\">OAuth 2.0 アーキテクチャでは、リソース サーバー（Web API）が認可の決定を行います。Web アプリから送信されたトークンを検証し、クレーム（ロール・スコープ・ユーザー ID）を検査して、内部ロジックに基づいてアクセスを許可・拒否します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Microsoft Entra</div><div class=\"exp-block-body\">Entra ID は ID プロバイダーおよびトークン発行者です。リソース レベルの認可決定は行わず、認証とコンセントに基づいてトークンを発行するのみです。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Web アプリ</div><div class=\"exp-block-body\">ユーザーを認証し UI レベルのアクセス制御を行いますが、バックエンド API リソースへのアクセス制御は Web API の責任です。</div></div></div>","svg":""},{"num":29,"id":"q29","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"複数の BLOB を持つ BLOB コンテナーを含む Azure サブスクリプションを管理しています。\n\nHR 部門の 15 名のユーザーが 9 月の 1 ヶ月間のみ BLOB にアクセスする必要があります。9 月以外のアクセスを自動的に防ぐセキュリティ アプローチを推奨してください。","choices":[{"text":"条件付きアクセス ポリシー","is_correct":false},{"text":"Shared Access Signature（SAS）","is_correct":true},{"text":"アクセス キー","is_correct":false},{"text":"証明書","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Shared Access Signature（SAS）</div><div class=\"exp-block-body\">特定の期間（9 月）に限定したアクセスを Azure Blob Storage リソースに付与できます。権限（読み取り・書き込みなど）・スコープ（コンテナーや BLOB）・有効期限を設定でき、ストレージ アカウント キーを共有せずに安全で柔軟な一時アクセスを実現します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ 条件付きアクセス ポリシー</div><div class=\"exp-block-body\">Microsoft Entra ID のサインイン条件に適用されるもので、Azure Storage の時間限定アクセス制御には使用できません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ アクセス キー</div><div class=\"exp-block-body\">ストレージ アカウントへのフル アクセスを許可します。きめ細かいまたは時間限定のアクセスは提供せず、共有は推奨されません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ 証明書</div><div class=\"exp-block-body\">アプリや API のクライアント認証に使用されます。Azure Storage リソースへの一時的なアクセス制御には適していません。</div></div></div>","svg":""},{"num":30,"id":"q30","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"Azure Storage アカウントにデータ資産を保存する予定です。以下の要件を満たすストレージ ソリューションを選択してください：\n・書き込まれたデータを変更不可にすること\n・ストレージ アカウントへの匿名アクセスを禁止すること\n・Microsoft Entra と連携した ACL（アクセス制御リスト）ベースの権限をサポートすること","choices":[{"text":"Azure Blob Storage","is_correct":false},{"text":"Azure Data Lake Storage","is_correct":true},{"text":"Azure NetApp Files","is_correct":false},{"text":"Azure Files","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Azure Data Lake Storage</div><div class=\"exp-block-body\">イミュータブル ストレージ（ソフト削除・WORM ポリシー）で書き込み後の変更を防ぎます。デフォルトで匿名アクセスを禁止し、ディレクトリ・ファイル レベルの細かい ACL による Microsoft Entra 権限管理をサポートします。3 つの要件すべてを満たします。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Blob Storage</div><div class=\"exp-block-body\">イミュータビリティはサポートしますが、Microsoft Entra ベースの細かい ACL 権限は Azure RBAC に依存し、ADLS のようなきめ細かな制御はできません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure NetApp Files</div><div class=\"exp-block-body\">高パフォーマンスのエンタープライズ ファイル ストレージです。Microsoft Entra ACL の完全サポートが限定的で、データ資産の要件に最適ではありません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Files</div><div class=\"exp-block-body\">汎用ファイル共有サービスです。ADLS と比較してイミュータブル ストレージが限定的で、Microsoft Entra ACL のきめ細かな制御も劣ります。</div></div></div>","svg":""},{"num":31,"id":"q31","domain":"ビジネス継続性","domain_code":"BC","domain_color":"#C50F1F","question_text":"Windows Server を実行する 20 台のオンプレミス サーバーのデータを Azure にバックアップして保護します。\n\n要件：\n・各サーバーのすべてのファイルとディレクトリをキャプチャすること\n・Azure 内にバックアップ データの 3 つのレプリカ コピーを保持すること\n・バックアップ コストを全体的に最小限に抑えること\n\nサーバーに構成するバックアップ コンポーネントとストレージ構成をそれぞれ 1 つ選んでください（計 2 つ）。","choices":[{"text":"Azure Site Recovery Mobility Service","is_correct":false},{"text":"Microsoft Azure Recovery Services（MARS）エージェント","is_correct":true},{"text":"ボリューム シャドウ コピー サービス（VSS）","is_correct":false},{"text":"Geo 冗長ストレージ（GRS）","is_correct":false},{"text":"ローカル冗長ストレージ（LRS）","is_correct":true},{"text":"ゾーン冗長ストレージ（ZRS）","is_correct":false}],"correct_indices":[1,4],"n_correct":2,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ MARS エージェント</div><div class=\"exp-block-body\">オンプレミス Windows サーバーのすべてのファイル・フォルダー・システム ステートを Azure Recovery Services コンテナーに安全にバックアップします。日次バックアップのスケジュール設定と複数コピーの保持をサポートし、コスト効率が高いです。</div></div><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ ローカル冗長ストレージ（LRS）</div><div class=\"exp-block-body\">同一データ センター内に 3 つのコピーを保持するため「3 つのレプリカ コピー」の要件を満たします。GRS や ZRS と比較して最もコストが低く、バックアップ コスト最小化の要件に合致します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Site Recovery Mobility Service</div><div class=\"exp-block-body\">VM・物理サーバーのディザスター リカバリーと移行向けです。日常的なファイル・フォルダーのバックアップには適していません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ VSS</div><div class=\"exp-block-body\">Windows のスナップショット機能ですが、Azure へのバックアップの自動化・統合・コスト効率は MARS エージェントに劣ります。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ GRS</div><div class=\"exp-block-body\">クロスリージョン レプリケーションにより高い耐久性を提供しますが、コストが大幅に高くなります。コスト最小化の要件に反します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ ZRS</div><div class=\"exp-block-body\">複数の可用性ゾーンにレプリケーションして高可用性を提供しますが、LRS よりコストが高くなります。</div></div></div>","svg":""},{"num":32,"id":"q32","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"1 つのサブスクリプション内の複数の Azure Storage アカウントに対するアクセス認可アプローチを設計しています。\n\n構成：\n・ブロック BLOB を保存する 5 つのストレージ アカウント\n・SMB プロトコルでアクセスするファイル共有をホストする 5 つのストレージ アカウント\n\n要件：\n・可能な限り最高レベルのセキュリティを提供すること\n・共有アクセス キーを禁止すること\n・可能な限り時間制限付きアクセスをサポートすること\n\nブロック BLOB アクセスとファイル共有アクセスそれぞれに推奨するソリューションを 1 つずつ選んでください（計 2 つ）。","choices":[{"text":"BLOB：SAS と保存済みアクセス ポリシーの組み合わせ","is_correct":false},{"text":"BLOB：ユーザー委任 SAS（User delegation SAS）のみ","is_correct":true},{"text":"BLOB：ユーザー委任 SAS と保存済みアクセス ポリシーの組み合わせ","is_correct":false},{"text":"ファイル共有：Microsoft Entra 資格情報","is_correct":true},{"text":"ファイル共有：ユーザー委任 SAS のみ","is_correct":false},{"text":"ファイル共有：ユーザー委任 SAS と保存済みアクセス ポリシーの組み合わせ","is_correct":false}],"correct_indices":[1,3],"n_correct":2,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ BLOB：ユーザー委任 SAS のみ</div><div class=\"exp-block-body\">Microsoft Entra ID でサポートされ共有キーを使用しません。時間制限付きアクセスを提供し、最高レベルのセキュリティ要件を満たします。なお、保存済みアクセス ポリシーはユーザー委任 SAS でサポートされないため、組み合わせは不適切です。</div></div><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ ファイル共有：Microsoft Entra 資格情報</div><div class=\"exp-block-body\">Microsoft Entra ID による ID ベースのセキュリティで共有キーを使用しません。MFA や条件付きアクセスと組み合わせることで最高レベルのセキュリティを実現します。なお、Azure Files に対してユーザー委任 SAS は使用できません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ SAS と保存済みアクセス ポリシーの組み合わせ</div><div class=\"exp-block-body\">共有キーを使用する可能性があり、最高セキュリティの要件に反します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ ユーザー委任 SAS と保存済みアクセス ポリシーの組み合わせ</div><div class=\"exp-block-body\">保存済みアクセス ポリシーはユーザー委任 SAS ではサポートされません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ ファイル共有：ユーザー委任 SAS</div><div class=\"exp-block-body\">ユーザー委任 SAS は Azure Files ではサポートされていません。ID ベースのセキュリティも提供しません。</div></div></div>","svg":""},{"num":33,"id":"q33","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"Azure Synapse Analytics と Azure Data Lake Storage Gen2 を使用するデータ分析ソリューションを設計しています。\n\n以下の要件を満たす Synapse プールを選択してください：\n「Azure Data Lake Storage からハッシュ分散テーブルにデータをロードする」\n\n（設問 1/2）","choices":[{"text":"専用 SQL プール（Dedicated SQL pool）","is_correct":true},{"text":"サーバーレス Apache Spark プール","is_correct":false},{"text":"サーバーレス SQL プール","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ 専用 SQL プール</div><div class=\"exp-block-body\">旧称 SQL Data Warehouse で、大規模なデータ ウェアハウス・分析タスク向けに設計されています。ハッシュ分散テーブルによりデータを複数ノードに分散し、結合・集計クエリのパフォーマンスを向上させます。データの取り込みと保存を直接サポートします。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ サーバーレス Apache Spark プール</div><div class=\"exp-block-body\">オンデマンドのデータ処理・分析向けです。ハッシュ分散テーブルへの直接取り込みには設計されていません。</div></div><div class=\"exp- pted</div><div class=\"exp-block-body\">クライアント アプリケーションが暗号化・復号を処理し、データベース エンジンは暗号化されたデータのみを扱います。クラウド管理者がデータベースにアクセスしても、アプリが管理するキーなしでは SSN を平文で閲覧できません。列レベルの暗号化で最高レベルの保護を提供します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ 列の暗号化</div><div class=\"exp-block-body\">特定列を暗号化できますが、クラウド管理者からの閲覧制限に必要な細粒度はなく、Always Encrypted のようなアプリ レベルのキー管理がありません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ 動的データ マスキング（DDM）</div><div class=\"exp-block-body\">データのマスク表示は提供しますが、保存中のデータの実際の暗号化は行いません。権限を持つ管理者はマスク解除してデータを閲覧できるため、クラウド管理者からの完全な保護には不十分です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ TDE</div><div class=\"exp-block-body\">ページ レベルでデータベース全体を暗号化しますが、特定の列の暗号化や管理者からの特定フィールドの非表示化はできません。</div></div></div>","svg":""},{"num":36,"id":"q36","domain":"データストレージ","domain_code":"DS","domain_color":"#00796B","question_text":"Azure SQL Managed Instance に従業員レコードが含まれています。社会保障番号（SSN）と電話番号などの機密フィールドがあります。\n\n要件：\n・ヘルプデスク チームが従業員の電話番号の下 4 桁のみを閲覧できること\n・クラウド管理者が従業員の社会保障番号を閲覧できないこと\n\n電話番号の列に対して有効にすべき機能はどれですか？（設問 2/2）","choices":[{"text":"Always Encrypted（常に暗号化）","is_correct":false},{"text":"列の暗号化（Column encryption）","is_correct":false},{"text":"動的データ マスキング（DDM）","is_correct":true},{"text":"透過的データ暗号化（TDE）","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ 動的データ マスキング（DDM）</div><div class=\"exp-block-body\">機密データを非特権ユーザーに対してマスクするように設計されています。電話番号の下 4 桁のみを表示するなど、列の一部のみを表示するルールを設定できます。アプリケーションの変更は不要で、SQL Database レイヤーでマスク ルールが適用されます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Always Encrypted</div><div class=\"exp-block-body\">保存中・転送中のデータを暗号化しますが、電話番号の下 4 桁のみを表示するような部分的なデータ開示の機能はありません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ 列の暗号化</div><div class=\"exp-block-body\">列全体を暗号化しますが、DDM のような部分的なデータ表示はできません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ TDE</div><div class=\"exp-block-body\">データベース全体の保存データ暗号化です。特定フィールドの部分的な表示制御には使用できません。</div></div></div>","svg":""},{"num":37,"id":"q37","domain":"ID・ガバナンス","domain_code":"ID","domain_color":"#7719AA","question_text":"Azure Key Vault（KV1）と Windows Server 2022 Azure Edition VM（VM1）を含む Azure サブスクリプションで作業しています。\n\nVM1 に ASP.NET Core アプリ（App1）をデプロイする予定です。App1 はシステム割り当てマネージド ID を使用して KV1 のシークレットにアクセスし、カスタム開発をできるだけ少なくする必要があります。\n\nApp1 の OAuth 2.0 認証フローとトークン取得方法について、それぞれ 1 つ選んでください（計 2 つ）。","choices":[{"text":"OAuth 2.0 フロー：認可コード付与フロー","is_correct":false},{"text":"OAuth 2.0 フロー：クライアント資格情報付与フロー","is_correct":true},{"text":"OAuth 2.0 フロー：暗黙的付与フロー","is_correct":false},{"text":"トークン取得元：Azure Instance Metadata Service（IMDS）エンドポイント","is_correct":true},{"text":"トークン取得元：Microsoft Entra の OAuth 2.0 アクセス トークン エンドポイント","is_correct":false},{"text":"トークン取得元：Microsoft Identity Platform の OAuth 2.0 アクセス トークン エンドポイント","is_correct":false}],"correct_indices":[1,3],"n_correct":2,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ クライアント資格情報付与フロー</div><div class=\"exp-block-body\">VM1 のシステム割り当てマネージド ID を使用して Azure Key Vault に安全にアクセスできます。ユーザー インタラクションが不要なマシン間通信に適した OAuth 2.0 フローです。マネージド ID が認証を処理するため、コードに資格情報を明示的に記述する必要がありません。</div></div><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Azure Instance Metadata Service（IMDS）エンドポイント</div><div class=\"exp-block-body\">Azure VM の非ルーティング IP（169.254.169.254）でアクセス可能な RESTful エンドポイントです。VM のマネージド ID を使用して認証トークンを取得できます。App1 はこのエンドポイントにアクセスして KV1 へのアクセス トークンを取得します。カスタム開発が最小限で済みます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ 認可コード付与フロー</div><div class=\"exp-block-body\">ユーザー インタラクションが必要なシナリオ（Web アプリなど）向けです。システム割り当てマネージド ID のマシン間認証には適していません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ 暗黙的付与フロー</div><div class=\"exp-block-body\">ブラウザー ベースのクライアント サイド アプリ向けです。VM 上で動作する App1 には不適切で、セキュリティ リスクがあります。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Microsoft Entra アクセス トークン エンドポイント</div><div class=\"exp-block-body\">サービス プリンシパルや証明書を使用したユーザー認証・サービス認証向けです。マネージド ID の使用で余分な開発作業が増え、要件の「最小開発」に反します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Microsoft Identity Platform アクセス トークン エンドポイント</div><div class=\"exp-block-body\">主にユーザー中心のシナリオや人間と機械の認証向けです。マネージド ID を持つ VM のマシン間認証には最適ではありません。</div></div></div>","svg":""},{"num":38,"id":"q38","domain":"ID・ガバナンス","domain_code":"ID","domain_color":"#7719AA","question_text":"オンプレミスの Active Directory と同期された Microsoft Entra テナントを管理しています。組織は内部開発の基幹業務アプリを使用しています。\n\n以下の要件を満たす認証ソリューションを設計してください：\n・アプリケーションの SAML ベースのシングルサインオン（SSO）を有効にすること\n・ユーザーが不明または不慣れな場所からサインインする場合に多要素認証（MFA）を要求すること\n\nソリューションに含めるべき 2 つの Microsoft Entra 機能はどれですか？","choices":[{"text":"Microsoft Entra エンタープライズ アプリケーション","is_correct":true},{"text":"Azure Application Gateway","is_correct":false},{"text":"Microsoft Entra Privileged Identity Management（PIM）","is_correct":false},{"text":"Microsoft Entra ID Protection","is_correct":false},{"text":"条件付きアクセス ポリシー","is_correct":true}],"correct_indices":[0,4],"n_correct":2,"exp_html":"<div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ Microsoft Entra エンタープライズ アプリケーション</div><div class=\"exp-block-body\">SAML ベースの SSO を有効にするためのフレームワークを提供します。基幹業務アプリをエンタープライズ アプリとして統合することで、SAML SSO の構成とユーザー アクセス管理が可能になります。</div></div><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✓ 条件付きアクセス ポリシー</div><div class=\"exp-block-body\">不明な場所からのアクセス試行など特定の条件に基づいて MFA を強制できます。ユーザーの場所・デバイスのコンプライアンス・リスク レベルなどのシグナルを評価してアクセス制御を適用します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Azure Application Gateway</div><div class=\"exp-block-body\">L7 ロード バランサーです。SAML SSO の提供や MFA の強制は行いません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Microsoft Entra PIM</div><div class=\"exp-block-body\">特権ロールへの Just-In-Time アクセス管理向けです。SAML SSO の有効化や場所ベースの MFA 強制には使用しません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">✗ Microsoft Entra ID Protection</div><div class=\"exp-block-body\">リスクのあるサインインの検出・緩和に使用します。直接 SAML SSO を構成したり、場所に基づく MFA を強制したりするものではありません。条件付きアクセス ポリシーの方が適切です。</div></div></div>","svg":""}];
const TOTAL = QUESTIONS.length;
const LTR = 'ABCDEFGHIJKLMNOP';
let state={}, filter='all', multiSel={}, displayChoices={};
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function initState(){
  const chk=document.getElementById('chk-shuf');
  const doShuf=chk&&chk.checked;
  state={};multiSel={};displayChoices={};
  QUESTIONS.forEach(q=>{
    state[q.id]={answered:false,correct:false};
    displayChoices[q.id]=doShuf?shuf([...q.choices]):[...q.choices];
  });
}
function filtered(){return filter==='all'?QUESTIONS:QUESTIONS.filter(q=>q.domain===filter);}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){
  const qs=filtered();
  document.getElementById('qwrap').innerHTML=qs.map(q=>renderQ(q)).join('');
  qs.forEach(q=>{if(state[q.id]?.answered)restoreQ(q);});
  updateProgress();
}
// ===== REVIEW SYSTEM =====
let reviewSet = new Set(JSON.parse(localStorage.getItem('az305_review_ids')||'[]'));
function toggleReview(qid, vol, num) {
  if(reviewSet.has(qid)) {
    reviewSet.delete(qid);
    const data = JSON.parse(localStorage.getItem('az305_review_data')||'{}');
    delete data[vol+'_'+qid];
    localStorage.setItem('az305_review_data', JSON.stringify(data));
  } else {
    reviewSet.add(qid);
    const q = QUESTIONS.find(x=>x.id===qid);
    if(q) {
      const data = JSON.parse(localStorage.getItem('az305_review_data')||'{}');
      const volNum = vol.replace('vol','');
      data[vol+'_'+qid] = {
        vol: vol, volNum: volNum, id: qid, num: q.num, domain: q.domain,
        question_text: q.question_text, choices: q.choices,
        correct_indices: q.correct_indices, n_correct: q.n_correct || 1,
        exp_html: q.exp_html || '', svg: q.svg || ''
      };
      localStorage.setItem('az305_review_data', JSON.stringify(data));
    }
  }
  localStorage.setItem('az305_review_ids', JSON.stringify([...reviewSet]));
  const btn = document.getElementById('rbtn_'+qid);
  if(btn) btn.classList.toggle('review-active', reviewSet.has(qid));
  if(window.updateReviewBadge) updateReviewBadge();
}
function renderQ(q){
  const isMulti=q.n_correct>1;
  const mbadge=isMulti?`<span class="mbadge">複数選択 (${q.n_correct}つ)</span>`:'';
  const mhint=isMulti?`<div class="multi-hint">⚡ ${q.n_correct}つの選択肢を選んでください</div>`:'';
  const choices=(displayChoices[q.id]||q.choices).map((c,i)=>`<button class="cbtn" id="c_${q.id}_${i}" onclick="onChoice('${q.id}',${i})"><span class="cltr">${LTR[i]}</span><span>${escH(c.text)}</span></button>`).join('');
  const sub=isMulti?`<button class="submit-btn" id="sub_${q.id}" onclick="submitMulti('${q.id}')">回答を確定する</button>`:'';
  const archEl=q.svg?`<div class="arch-wrap arch-hidden" id="arch_${q.id}">${q.svg}<div class="arch-reveal-overlay"><span class="arch-reveal-hint">回答後にアーキテクチャ図が表示されます</span></div></div>`:'';
  return `<div class="qcard" id="card_${q.id}"><div class="qh"><span class="qnum">問 ${q.num}</span><span class="dbadge" style="background:${q.domain_color||'#0072C6'}">${q.domain}</span>${mbadge}<button class="review-btn ${reviewSet.has(q.id)?'review-active':''}" id="rbtn_${q.id}" onclick="toggleReview('${q.id}','vol6',${q.num})" title="復習リストに追加">★</button></div><div class="qbody"><p class="qtext">${escH(q.question_text)}</p></div>${archEl}${mhint}<div class="choices">${choices}</div>${sub}<div class="expanel" id="exp_${q.id}"><div id="rbadge_${q.id}"></div>${q.exp_html}</div></div>`;
}
function onChoice(qid,idx){
  if(state[qid]?.answered)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  if(q.n_correct>1){
    if(!multiSel[qid])multiSel[qid]=new Set();
    const btn=document.getElementById(`c_${qid}_${idx}`);
    if(multiSel[qid].has(idx)){multiSel[qid].delete(idx);btn.classList.remove('multi-selected');}
    else{if(multiSel[qid].size>=q.n_correct)return;multiSel[qid].add(idx);btn.classList.add('multi-selected');}
    const sub=document.getElementById(`sub_${qid}`);
    if(sub)sub.style.display=multiSel[qid].size>=q.n_correct?'block':'none';
  }else{
    state[qid]={answered:true,correct:(displayChoices[qid]||q.choices)[idx].is_correct};
    applyAnswer(q,[idx]);
  }
}
function submitMulti(qid){
  if(state[qid]?.answered)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  const sel=[...(multiSel[qid]||new Set())];
  const cset=new Set((displayChoices[qid]||q.choices).map((c,i)=>c.is_correct?i:-1).filter(i=>i>=0));
  state[qid]={answered:true,correct:sel.length===cset.size&&sel.every(i=>cset.has(i))};
  applyAnswer(q,sel);
}
function applyAnswer(q,sel){
  const sset=new Set(sel);const isOk=state[q.id].correct;
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);if(!btn)return;
    btn.disabled=true;btn.classList.remove('multi-selected');
    if(sset.has(i))btn.classList.add(c.is_correct?'correct':'wrong');
    if(c.is_correct&&!sset.has(i))btn.classList.add('reveal');
  });
  document.getElementById(`card_${q.id}`).classList.add(isOk?(q.n_correct>1?'multi-ok':'ok'):'ng');
  const archEl = document.getElementById('arch_'+q.id);
  if(archEl) archEl.classList.add('arch-revealed');
  document.getElementById(`rbadge_${q.id}`).innerHTML=isOk
    ?`<div class="rbadge ${q.n_correct>1?'multi-ok':'ok'}">${q.n_correct>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説で正解・理由を確認しましょう</div>';
  document.getElementById(`exp_${q.id}`).style.display='block';
  const sub=document.getElementById(`sub_${q.id}`);if(sub)sub.style.display='none';
  updateProgress();
  setTimeout(()=>document.getElementById(`exp_${q.id}`).scrollIntoView({behavior:'smooth',block:'nearest'}),120);
}
function restoreQ(q){
  const s=state[q.id];if(!s?.answered)return;
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);if(!btn)return;
    btn.disabled=true;if(c.is_correct)btn.classList.add(s.correct?'correct':'reveal');
  });
  document.getElementById(`card_${q.id}`).classList.add(s.correct?(q.n_correct>1?'multi-ok':'ok'):'ng');
  const exp=document.getElementById(`exp_${q.id}`);if(exp)exp.style.display='block';
  const badge=document.getElementById(`rbadge_${q.id}`);
  if(badge)badge.innerHTML=s.correct
    ?`<div class="rbadge ${q.n_correct>1?'multi-ok':'ok'}">${q.n_correct>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説で正解・理由を確認しましょう</div>';
}
function filterDomain(d){
  filter=d;
  document.querySelectorAll('.dbtn').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  render();window.scrollTo({top:0});
}
function updateProgress(){
  const ans=Object.values(state).filter(s=>s.answered).length;
  const cor=Object.values(state).filter(s=>s.correct).length;
  document.getElementById('pbar').style.width=(ans/TOTAL*100)+'%';
  document.getElementById('hdrScore').textContent=`${cor}/${TOTAL}`;
  document.getElementById('hdrPct').textContent=`正解率 ${ans>0?Math.round(cor/ans*100):0}%`;
}
function showResults(){
  const cor=Object.values(state).filter(s=>s.correct).length;
  const pct=Math.round(cor/TOTAL*100);
  const ds={};
  QUESTIONS.forEach(q=>{
    if(!ds[q.domain])ds[q.domain]={t:0,c:0,color:q.domain_color||'#333'};
    ds[q.domain].t++;if(state[q.id]?.correct)ds[q.domain].c++;
  });
  document.getElementById('mscore').textContent=`${cor}/${TOTAL}`;
  document.getElementById('mpct').textContent=`正解率 ${pct}%`;
  const SVG_TROPHY='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 21 12 17 16 21"/><line x1="12" y1="17" x2="12" y2="11"/><path d="M18 6H6l1-4h10l1 4z"/><path d="M6 6c0 7 6 11 6 11s6-4 6-11"/></svg>';
  const SVG_UP='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>';
  const SVG_ZAP='<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
  const SVG_BOOK='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
  let icon=SVG_BOOK,msg='';
  if(pct>=80){icon=SVG_TROPHY;msg='合格圏内！本番でも自信を持って！';}
  else if(pct>=70){icon=SVG_UP;msg='あと少し！弱点ドメインを集中的に復習しよう。';}
  else if(pct>=50){icon=SVG_ZAP;msg='「間違えやすいポイント」を重点的に確認しよう。';}
  else{icon=SVG_BOOK;msg='各解説の「なぜ正解か」「なぜ不正解か」をしっかり読もう！';}
  document.getElementById('micon').innerHTML=icon;
  document.getElementById('mmsg').textContent=msg;
  document.getElementById('mdomains').innerHTML=Object.entries(ds).map(([d,s])=>{
    const p=Math.round(s.c/s.t*100);
    return `<div class="m-ditem"><div class="m-dname">${d}</div><div class="m-dval" style="color:${s.color}">${s.c}/${s.t} <span style="font-size:13px;font-weight:500;color:#888">(${p}%)</span></div></div>`;
  }).join('');
  document.getElementById('modal').classList.add('show');
}
function modalClose(e){if(!e||e.target.id==='modal')document.getElementById('modal').classList.remove('show');}
function resetAll(){document.getElementById('modal').classList.remove('show');initState();render();window.scrollTo({top:0,behavior:'smooth'});}
window.addEventListener('scroll',()=>document.getElementById('scrollTop').classList.toggle('show',window.scrollY>400));
initState();render();

// Highlight active vol nav link
(function(){
  const path = location.pathname;
  const m = path.match(/vol(\d+)\.html/);
  if(m) {
    const el = document.getElementById('vj'+m[1]);
    if(el) el.classList.add('vj-active');
  }
  function updateReviewBadge(){
    const ids = JSON.parse(localStorage.getItem('az305_review_ids')||'[]');
    const badge = document.getElementById('vj-review-count');
    if(badge) badge.textContent = ids.length > 0 ? ids.length : '';
  }
  updateReviewBadge();
  window.updateReviewBadge = updateReviewBadge;
})();
</script>
