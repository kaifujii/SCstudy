<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZ-305 — StudyDeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700;9..40,800&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #edf0f7; --card-bg: #ffffff; --text: #151c2c;
  --sub: #3d4966; --muted: #7c879c; --border: #cdd3e2;
  --accent: #3f52c4; --header: #151c2c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background-color: var(--bg);
  background-image: radial-gradient(circle, #bcc3d6 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
header {
  background: var(--header);
  height: 54px; padding: 0 20px;
  display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 100;
}
.back-link {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 5px; text-decoration: none;
  transition: background 0.15s;
}
.back-link:hover { background: rgba(255,255,255,0.1); }
.logo-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.5rem; color: rgba(255,255,255,0.32);
  letter-spacing: 3.5px; text-transform: uppercase; font-weight: 500;
}
.logo-main {
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem; font-weight: 800; color: #fff; letter-spacing: -0.5px;
}
main {
  max-width: 480px; margin: 0 auto;
  padding: 80px 20px; text-align: center;
}
.badge {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.6rem; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted);
  background: #f3f4f6; border: 1px solid var(--border);
  border-radius: 3px; padding: 3px 10px;
  display: inline-block; margin-bottom: 20px;
}
h1 {
  font-family: 'DM Sans', sans-serif;
  font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em;
  color: var(--text); margin-bottom: 12px; line-height: 1.2;
}
p { font-size: 0.88rem; color: var(--muted); line-height: 1.7; margin-bottom: 28px; }
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px; background: var(--card-bg);
  border: 1.5px solid var(--border); border-radius: 6px;
  text-decoration: none; font-size: 0.82rem; font-weight: 700;
  color: var(--sub); transition: border-color 0.15s;
}
.back-btn:hover { border-color: var(--text); color: var(--text); }
</style>
</head>
<body>
<header>
  <a href="../" class="back-link" title="ホームに戻る">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div>
    <div class="logo-sub">Microsoft Azure</div>
    <div class="logo-main">AZ-305</div>
  </div>
</header>
<main>
  <div class="badge">Coming Soon</div>
  <h1>AZ-305<br>準備中です</h1>
  <p>Microsoft Azure Solutions Architect Expert の学習コンテンツを作成中です。<br>もうしばらくお待ちください。</p>
  <a href="../" class="back-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    ホームに戻る
  </a>
</main>
</body>
</html>
