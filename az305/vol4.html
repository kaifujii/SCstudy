/>\n<line x1=\"490\" y1=\"155\" x2=\"520\" y2=\"100\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<rect x=\"70\" y=\"80\" width=\"100\" height=\"55\" rx=\"7\" fill=\"#112240\" stroke=\"#0078D4\" stroke-width=\"1.5\"/>\n<rect x=\"76\" y=\"85\" width=\"88\" height=\"24\" rx=\"4\" fill=\"#0078D4\" fill-opacity=\"0.18\"/>\n<text x=\"120\" y=\"101\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0078D4\" font-family=\"Segoe UI,Arial,sans-serif\">VNet1</text>\n<text x=\"120\" y=\"121\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">VNet 東日本</text>\n<rect x=\"500\" y=\"80\" width=\"100\" height=\"55\" rx=\"7\" fill=\"#112240\" stroke=\"#0078D4\" stroke-width=\"1.5\"/>\n<rect x=\"506\" y=\"85\" width=\"88\" height=\"24\" rx=\"4\" fill=\"#0078D4\" fill-opacity=\"0.18\"/>\n<text x=\"550\" y=\"101\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0078D4\" font-family=\"Segoe UI,Arial,sans-serif\">VNet2</text>\n<text x=\"550\" y=\"121\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">VNet 西日本</text>\n<line x1=\"310\" y1=\"10\" x2=\"120\" y2=\"107\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<line x1=\"310\" y1=\"10\" x2=\"550\" y2=\"107\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"310\" y=\"235\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">vWAN Hub が複数拠点・VNet・ER を一元管理</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>3つ</strong>のハブが正解です。\nVirtual WAN のハブは<em>リージョンごと</em>に1つ作成します。\n4拠点が3リージョンに分散しており（1リージョンに2拠点が集中）、\nその2拠点を1ハブでカバーできます。4ハブは冗長・コスト増、2ハブでは1リージョンが未カバーです。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>4：</strong>拠点数と一致しますが、ハブはリージョン単位です。同一リージョンの2拠点に2ハブは不要でコスト増。<br>\n<strong>2：</strong>3リージョン中1リージョンがカバーされず要件不満足。<br>\n<strong>1：</strong>単一ハブではマルチリージョン接続不可。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">ハブ数の決め方 = 「拠点数」ではなく「接続が必要なリージョン数」</span><span class=\"fs\">同一リージョンの複数拠点 → 1ハブで集約可能</span><span class=\"fs\">3リージョン → 3ハブが最小かつ十分 ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>ハブ数</th><th>説明</th><th>評価</th></tr></thead><tbody><tr><td>1</td><td>単一リージョンのみカバー</td><td>要件未達</td></tr><tr><td>2</td><td>2リージョンのみカバー</td><td>要件未達</td></tr><tr><td>3 ✅</td><td>3リージョン全カバー・コスト最適</td><td>正解</td></tr><tr><td>4</td><td>冗長ハブあり（不要なコスト）</td><td>コスト増・非最適</td></tr></tbody></table><br>Virtual WAN のハブはリージョン内のスポーク（VNet / VPN / ExpressRoute）を束ねる中継点です。ハブ間通信は Standard SKU が必要（次の q28）。<div class=\"wbox\">「拠点4つ → 4ハブ」という誤解が典型的な罠。ハブ = リージョン の単位で考える。</div></div></div>"},{"num":28,"id":"q28","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"問題27と同じシナリオ。4拠点・複数リージョン・ExpressRoute・コスト最小化。\n\n使用すべき Virtual WAN の SKU はどれですか？","choices":[{"text":"Standard","is_correct":true},{"text":"Basic","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">仮想 WAN: 4拠点 + ExpressRoute（Q27-28）</div><svg viewBox=\"0 0 700 230\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"700\" height=\"230\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"56\" y=\"84\" w " text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#F97C00\" font-family=\"Segoe UI,Arial,sans-serif\">KV</text>\n<text x=\"250\" y=\"171\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Key Vault</text>\n<text x=\"250\" y=\"182\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">シークレット</text>\n<rect x=\"375\" y=\"75\" width=\"120\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#6264A7\" stroke-width=\"1.5\"/>\n<rect x=\"381\" y=\"80\" width=\"108\" height=\"24\" rx=\"4\" fill=\"#6264A7\" fill-opacity=\"0.18\"/>\n<text x=\"435\" y=\"96\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#6264A7\" font-family=\"Segoe UI,Arial,sans-serif\">PE</text>\n<text x=\"435\" y=\"116\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Private Endpoint</text>\n<text x=\"435\" y=\"127\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">DNS統合</text>\n<line x1=\"310\" y1=\"85\" x2=\"370\" y2=\"95\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"340\" y=\"80\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">プライベート</text>\n<text x=\"280\" y=\"220\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">VNet インジェクション → パブリックIP不要・完全プライベート通信</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>サービスプリンシパル</strong>はアプリ・サービス用の Entra ID オブジェクトで、\nユーザー認証に依存しない自動化向け認証を提供します。\nDatabricks <strong>Standard ティアで使用可能</strong>で、退職・異動の影響を受けません。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>マネージドID：</strong>Databricks <em>Premium ティアのみ</em>サポート。Standard では使えません。<br>\n<strong>個人用アクセストークン（PAT）：</strong>特定ユーザーに紐づくため、そのユーザーが退職・離脱すると無効化されます。\n自動化ジョブでは「管理オーバーヘッド最小」要件に反します。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">Databricks Standard ティアで自動化 + 管理最小</span><span class=\"fs\">PAT → ユーザー依存 → 退職リスク → ✗</span><span class=\"fs\">マネージドID → Premium ティア専用 → Standard 不可 → ✗</span><span class=\"fs\">サービスプリンシパル → ユーザー非依存 + Standard 対応 → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>認証方法</th><th>ユーザー依存</th><th>Databricks Standard</th><th>Databricks Premium</th><th>推奨シナリオ</th></tr></thead><tbody><tr><td>PAT</td><td>○（ユーザー紐づき）</td><td>○</td><td>○</td><td>開発・テスト・個人作業</td></tr><tr><td>サービスプリンシパル ✅</td><td>×</td><td>○</td><td>○</td><td>本番自動化・CI/CD</td></tr><tr><td>マネージドID</td><td>×</td><td>×</td><td>○</td><td>Azure IaaS との安全統合</td></tr></tbody></table><div class=\"wbox\">マネージドID は Azure 環境で最も推奨される認証方法だが Databricks Standard では使えない。ティア制約は試験で頻出。</div></div></div>"},{"num":30,"id":"q30","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"北米・欧州の複数リージョンにオフィスがあり Azure にインフラを移行します。要件：①P2S VPN のモバイルユーザーが最寄りの Azure リージョンへ自動接続、②各地域オフィスが対応する Azure リージョンに ExpressRoute 経由で接続、③VNet・オンプレミスネットワーク間のトランジティブルーティング、④FQDN ベースのトラフィックフィルタリング。\n\n推奨に含めるべきものはどれですか？","choices":[{"text":"セキュア仮想ハブを構成した Azure Virtual WAN","is_correct":true},{"text":"VNet ピアリング + アプリケーションセキュリティグループ","is_correct":false},{"text":"仮想ネットワークゲートウェイ + NSG","is_correct":false},{"text":"Azure Route Server + Azure Network Function Manager","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"160\" height=\"110\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#999\" stroke-width=\"1\"/><text x=\"100\" y=\"90\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#999\">要件</text><text x=\"100\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・P2S VPN 対応</text><text x=\"100\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・ExpressRoute 対応</text><text x=\"100\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・FQDN フィルタリング</text><text x=\"100\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・ハブスポーク</text><rect x=\"255\" y=\"20\" width=\"215\" height=\"130\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"362\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">セキュア仮想ハブ</text><text x=\"362\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">VWAN + Azure Firewall</text><text x=\"362\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">全要件を1サービスで</text><rect x=\"267\" y=\"62\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"362\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">P2S VPN（Anycast IP）✅</text><rect x=\"267\" y=\"87\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"362\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ExpressRoute ネイティブ ✅</text><rect x=\"267\" y=\"112\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"362\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Azure Firewall（FQDN）統合 ✅</text><rect x=\"267\" y=\"137\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"362\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ハブスポーク自動構成 ✅</text><rect x=\"545\" y=\"35\" width=\"135\" height=\"65\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"612\" y=\"53\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Hub-Spoke VNet</text><text x=\"612\" y=\"67\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Azure Firewall別途</text><text x=\"612\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">P2S構成が複雑</text><rect x=\"545\" y=\"112\" width=\"135\" height=\"48\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"612\" y=\"122\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">VPN Gateway単独</text><text x=\"612\" y=\"136\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">FQDN フィルタ❌</text><text x=\"612\" y=\"149\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ER別管理</text><text x=\"350\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">セキュア仮想ハブ: Azure Firewall統合済みVWANハブ。P2S/ER/FQDN/ハブスポークを一括実現</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>セキュア仮想ハブ（Azure Virtual WAN + Azure Firewall 統合）</strong>が4要件をすべて満たします：\n①P2S VPN（Anycast）、②ExpressRoute、③FQDN フィルタリング（Azure Firewall 統合）、\n④ハブスポーク自動管理。単一サービスで複合要件を実現できます。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>VNet ピアリング + ASG：</strong>VNet 間接続はできますが、P2S VPN・ER・グローバルルーティング・FQDN フィルタの統合管理がありません。<br>\n<strong>仮想ネットワークゲートウェイ + NSG：</strong>NSG は IP/ポートレベルの制御のみ。FQDN フィルタリングは持ちません。<br>\n<strong>Route Server + Azure Network Manager：</strong>ルーティング制御はできますが P2S VPN・ER・FQDN 統合管理が含まれません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">P2S VPN + ExpressRoute + FQDN + ハブスポーク が同時要件</span><span class=\"fs\">VPN Gateway 単独 → FQDN 機能なし → ✗</span><span class=\"fs\">従来型 Hub-Spoke VNet → Firewall 別途デプロイ・管理複雑 → ✗</span><span class=\"fs\">Virtual WAN + セキュアハブ → 全機能が統合済み → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>機能</th><th>標準ハブ（Virtual WAN）</th><th>セキュアハブ（Virtual WAN）✅</th><th>従来型 Hub-Spoke</th></tr></thead><tbody><tr><td>P2S VPN</td><td>○</td><td>○</td><td>△（別途 GW）</td></tr><tr><td>ExpressRoute</td><td>○（Standard）</td><td>○</td><td>△（別途 GW）</td></tr><tr><td>FQDN フィルタ</td><td>×</td><td>○（Firewall 統合）</td><td>△（別途 Firewall）</td></tr><tr><td>ハブスポーク管理</td><td>○（自動）</td><td>○（自動）</td><td>×（手動）</td></tr><tr><td>セキュリティポリシー統合</td><td>×</td><td>○</td><td>×（別途設定）</td></tr></tbody></table><div class=\"wbox\">セキュア仮想ハブ = Virtual WAN Hub + Azure Firewall の統合。Firewall を別途デプロイする従来型との違いは「統合・自動管理」の有無。FQDN フィルタリング要件 = セキュアハブが必要のシグナル。</div></div></div>"},{"num":31,"id":"q31","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"Azure サブスクリプション Sub1 で 2つの ASP.NET Core アプリ（App1・App2）を100台の VM にデプロイ。ユーザーは apexcore.com ID でサインイン。App1 はカレンダーの読み取り専用アクセス、App2 はカレンダーへの書き込みアクセスが必要です。最小権限の原則の適用と管理オーバーヘッド削減が要件です。\n\n推奨すべき認証ソリューションはどれですか？","choices":[{"text":"Microsoft Entra ID にアプリケーションを登録する","is_correct":true},{"text":"システム割り当てマネージドIDを使用する","is_correct":false},{"text":"ユーザー割り当てマネージドIDを使用する","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6 dth=\"181\" height=\"20\" rx=\"4\" fill=\"#D1C4E9\"/><text x=\"327\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">ユーザー同意フロー</text><rect x=\"505\" y=\"40\" width=\"175\" height=\"75\" rx=\"8\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"2\"/><text x=\"592\" y=\"63\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#0072C6\">Microsoft Graph</text><text x=\"592\" y=\"77\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">Calendars.Read</text><text x=\"592\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">ユーザーカレンダー</text><rect x=\"505\" y=\"128\" width=\"175\" height=\"32\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1\"/><text x=\"592\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">アプリケーション権限</text><text x=\"592\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ユーザーなし動作</text><text x=\"592\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">個人CAL不適</text><line x1=\"150\" y1=\"80\" x2=\"223\" y2=\"92\" stroke=\"#E67700\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"430\" y1=\"90\" x2=\"503\" y2=\"78\" stroke=\"#7719AA\" stroke-width=\"2\" marker-end=\"url(#ap)\"/><text x=\"350\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">デリゲート=ユーザー代理動作 / アプリケーション権限=バックグラウンド処理向け</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Microsoft Entra ID へのアプリケーション登録</strong>が正解です。\nユーザーの代わりに Microsoft Graph API（カレンダー）にアクセスするには、\nアプリ登録でクライアント ID を取得し、<code>Calendars.Read</code> などの\n<strong>デリゲート権限</strong>を設定します。\nユーザーがサインインして同意することで、アプリがユーザーの権限スコープ内で動作します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>システム / ユーザー割り当てマネージドID：</strong>Azure リソース間の認証に使います。\n<em>ユーザーの代理でユーザーのデータにアクセスする</em>デリゲートフロー（OAuth 2.0 Authorization Code）には対応していません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">「ユーザーの代わりに」Graph API にアクセス</span><span class=\"fs\">→ マネージドID は不可（ユーザー代理 OAuth フロー非対応）</span><span class=\"fs\">→ アプリ登録が前提（クライアントID取得）</span><span class=\"fs\">→ デリゲート権限（Calendars.Read）を設定</span><span class=\"fs\">→ ユーザーがサインイン・同意 → Authorization Code Flow ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>許可種別</th><th>サインイン</th><th>対象</th><th>典型ユースケース</th></tr></thead><tbody><tr><td>デリゲート権限 ✅</td><td>必要（ユーザー代理）</td><td>そのユーザーのリソース</td><td>「ユーザーの」カレンダー/メール閲覧</td></tr><tr><td>アプリケーション権限</td><td>不要（バックグラウンド）</td><td>全ユーザーのリソース</td><td>バッチ処理・デーモン</td></tr><tr><td>Azure RBAC</td><td>Entra 認証</td><td>Azure リソース</td><td>VM / Storage 操作</td></tr></tbody></table><div class=\"wbox\">「ユーザーの代わりに」= デリゲート権限。「ユーザーなしでバックグラウンドで」= アプリケーション権限。この使い分けは Graph API 問題の鉄板。</div></div></div>"},{"num":32,"id":"q32","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"問題31と同じシナリオ。サインインユーザーの代わりにカレンダーにアクセスする認可ソリューション。\n\n推奨すべき認可ソリューションはどれですか？","choices":[{"text":"デリゲートされたアクセス許可（Delegated permissions）","is_correct":true},{"text":"アプリケーション許可（Application permissions）","is_correct":false},{"text":"Azure RBAC","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" le\" font-size=\"10\" font-weight=\"700\" fill=\"#0072C6\">Microsoft Graph</text><text x=\"592\" y=\"77\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">Calendars.Read</text><text x=\"592\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">ユーザーカレンダー</text><rect x=\"505\" y=\"128\" width=\"175\" height=\"32\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1\"/><text x=\"592\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">アプリケーション権限</text><text x=\"592\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ユーザーなし動作</text><text x=\"592\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">個人CAL不適</text><line x1=\"150\" y1=\"80\" x2=\"223\" y2=\"92\" stroke=\"#E67700\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"430\" y1=\"90\" x2=\"503\" y2=\"78\" stroke=\"#7719AA\" stroke-width=\"2\" marker-end=\"url(#ap)\"/><text x=\"350\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">デリゲート=ユーザー代理動作 / アプリケーション権限=バックグラウンド処理向け</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>デリゲートされたアクセス許可（Delegated permissions）</strong>が正解です。\nApp1・App2 は<em>サインインしたユーザーの代わりに</em>カレンダーにアクセスするため、\nデリゲート権限が必要です。ユーザーが同意し、アプリはそのユーザーの権限スコープ内でのみ動作します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>アプリケーション許可（Application permissions）：</strong>ユーザーのサインインなしに\nバックグラウンドで全テナントのリソースに一括アクセスします。\nテナント管理者の同意が必要で、個人カレンダーの「ユーザー代理アクセス」には設計されていません。<br>\n<strong>Azure RBAC：</strong>Azure リソース（VM・Storage 等）のアクセス制御。\nMicrosoft Graph API の権限制御には使いません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">「ユーザーの代わりに」→ デリゲート権限</span><span class=\"fs\">「ユーザーなし・バックグラウンド」→ アプリケーション権限</span><span class=\"fs\">「Calendars.Read」= デリゲート権限のスコープ名</span><span class=\"fs\">→ デリゲート権限 ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>許可種別</th><th>サインイン</th><th>スコープ例</th><th>管理者同意</th></tr></thead><tbody><tr><td>デリゲート権限 ✅</td><td>必要</td><td>Calendars.Read / Mail.Read</td><td>任意（高権限時のみ必要）</td></tr><tr><td>アプリケーション権限</td><td>不要</td><td>Calendars.ReadWrite / Mail.ReadAll</td><td>必須</td></tr></tbody></table><div class=\"wbox\">Graph API の問題は「誰がアクセスするか」を確認する。「サインインユーザーの代理」= デリゲート。「サービスとして全員分アクセス」= アプリケーション許可。</div></div></div>"},{"num":33,"id":"q33","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"デジタル画像の保存・管理アプリケーション App1 を Azure に移行します。画像ストレージ要件：①保存時の暗号化、②最大50MBのファイルサポート、③Azure WAF と Azure Front Door によるアクセス制御。\n\n画像ストレージに推奨すべき Azure サービスはどれですか？","choices":[{"text":"Azure Blob Storage","is_correct":true},{"text":"Azure Cosmos DB","is_correct":false},{"text":"Azure SQL Database","is_correct":false},{"text":"Azure Table Storage","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"40\" width=\"135\" height=\"75\" rx=\"8\" fill=\"#FFF8E1\" stroke=\"#E67700\" stroke-width=\"2\"/><text x=\"87\" y=\"63\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#E67700\">デジタル画像</text><text x=\"87\" y=\"77\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">最大 50MB</text><text x=\"87\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">非構造化データ</text><rect x=\"230\" y=\"20\" width=\"215\" height=\"125\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"337\" y=\"68\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Blob Storage</text><text x=\"337\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">非構造化データ保存</text><text x=\"337\" y=\"95\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Front Door 統合</text><rect x=\"242\" y=\"62\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"337\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">サイズ制限なし（GB/TBも可）✅</text><rect x=\"242\" y=\"87\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"337\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">保存時暗号化（デフォルト有効）✅</text><rect x=\"242\" y=\"112\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"337\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Front Door/WAF 原点として利用 ✅</text><rect x=\"525\" y=\"40\" width=\"155\" height=\"65\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"602\" y=\"58\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Azure Files</text><text x=\"602\" y=\"72\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">SMB/NFS共有向け</text><text x=\"602\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">画像配信に非最適</text><rect x=\"525\" y=\"118\" width=\"155\" height=\"37\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1\"/><text x=\"602\" y=\"128\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Table Storage</text><text x=\"602\" y=\"142\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">構造化KV向け</text><line x1=\"155\" y1=\"77\" x2=\"228\" y2=\"90\" stroke=\"#E67700\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><text x=\"350\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Blob: 非構造化データの標準。Front Doorのオリジンとして直接設定可能</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Azure Blob Storage</strong>はデジタル画像などの<strong>非構造化バイナリデータ</strong>保存に最適です。\nデフォルトで保存時暗号化（SSE）が有効で、ブロック Blob の最大サイズは約 4.75 TB、\nAzure Front Door / CDN のオリジンとして直接設定でき、今回の3要件を全て満たします。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Cosmos DB：</strong>ドキュメント / KV データ向け NoSQL DB。大容量バイナリ（50MB+）の直接格納には設計されていません。<br>\n<strong>Azure SQL Database：</strong>構造化リレーショナルデータ向け。大容量バイナリ画像の格納はパフォーマンス・コスト両面で不適。<br>\n<strong>Azure Table Storage：</strong>KV 形式の軽量構造化データ向け。バイナリファイルの格納には使いません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">非構造化データ（画像・動画・ログ）の保存</span><span class=\"fs\">→ Blob Storage が第一選択</span><span class=\"fs\">Front Door / CDN との連携が必要 → Blob Storage ✅</span><span class=\"fs\">構造化データ → SQL / Cosmos DB</span><span class=\"fs\">SMB 共有 → Azure Files</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>ストレージ</th><th>データ形式</th><th>最大サイズ</th><th>CDN 連携</th><th>主な用途</th></tr></thead><tbody><tr><td>Blob Storage ✅</td><td>非構造化（バイナリ）</td><td>〜4.75 TB/blob</td><td>○</td><td>画像・動画・ログ・バックアップ</td></tr><tr><td>Azure Files</td><td>構造化ファイル</td><td>〜100 TB</td><td>×</td><td>SMB / NFS 共有</td></tr><tr><td>Table Storage</td><td>KV（構造化）</td><td>エンティティ 1 MB</td><td>×</td><td>軽量 NoSQL</td></tr><tr><td>Queue Storage</td><td>メッセージ</td><td>64 KB</td><td>×</td><td>メッセージキュー</td></tr></tbody></table><div class=\"wbox\">Cosmos DB / SQL DB に画像を入れようとする選択肢は罠。非構造化バイナリデータは Blob の仕事。</div></div></div>"},{"num":34,"id":"q34","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"問題33と同じシナリオ。顧客アカウント要件：①ストレージ容量の自動スケーリング、②単一DC障害時の可用性維持、③複数リージョンからの読み書き対応。\n\n顧客アカウントに推奨すべき Azure サービスはどれですか？","choices":[{"text":"Azure Cosmos DB","is_correct":true},{"text":"Azure Blob Storage","is_correct":false},{"text":"Azure SQL Database","is_correct":false},{"text":"Azure Table Storage","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"160\" height=\"110\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#999\" stroke-width=\"1\"/><text x=\"100\" y=\"90\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#999\">要件</text><text x=\"100\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・自動スケール（RU/s）</text><text x=\"100\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・ゾーン冗長</text><text x=\"100\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・複数リージョン読み書き</text><text x=\"100\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・99.999% 高可用性</text><rect x=\"248\" y=\"20\" width=\"215\" height=\"135\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"355\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Cosmos DB</text><text x=\"355\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">マルチリージョン書き込み</text><text x=\"355\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">グローバル分散</text><rect x=\"260\" y=\"62\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">マルチリージョン書き込み ✅</text><rect x=\"260\" y=\"87\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">自動スケール（RU/s）✅</text><rect x=\"260\" y=\"112\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ゾーン冗長設定可 ✅</text><rect x=\"260\" y=\"137\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">99.999% SLA（マルチリージョン）✅</text><rect x=\"535\" y=\"35\" width=\"145\" height=\"65\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"607\" y=\"53\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Azure SQL DB</text><text x=\"607\" y=\"67\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">マルチリージョン</text><text x=\"607\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">書き込みは複雑</text><rect x=\"535\" y=\"113\" width=\"145\" height=\"52\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"607\" y=\"125\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Table Storage</text><text x=\"607\" y=\"139\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">マルチリージョン</text><text x=\"607\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">書き込み非対応</text><text x=\"350\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Cosmos DB: グローバル分散DB。全リージョンで読み書き可、5一貫性レベル選択可</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Azure Cosmos DB</strong>はグローバル分散 DB 専用として設計されており、\n<strong>マルチリージョン書き込み</strong>（全リージョンで R/W 可能）、\n<strong>RU/s の自動スケール</strong>、<strong>99.999% SLA</strong>（マルチリージョン）をネイティブで提供します。\n単一 DC 障害時の可用性維持もゾーン冗長設定で対応可能です。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Blob Storage：</strong>オブジェクトストレージ。構造化データのクエリやマルチリージョン書き込み制御は持ちません。<br>\n<strong>Azure SQL Database：</strong>アクティブジオレプリケーションでクロスリージョン読み取りは可能ですが、\nマルチリージョン同時書き込みは複雑な設定が必要で競合解決も手動。<br>\n<strong>Azure Table Storage：</strong>マルチリージョン書き込みをネイティブには提供していません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">マルチリージョン書き込み + 自動スケール + 99.999% SLA</span><span class=\"fs\">SQL DB → マルチ書き込み設定複雑 → ✗</span><span class=\"fs\">Table Storage → グローバル書き込み非対応 → ✗</span><span class=\"fs\">Cosmos DB → 全要件をネイティブ対応 → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><strong>Cosmos DB の5つの SLA（業界唯一）</strong><table class=\"etbl\"><thead><tr><th>SLA 項目</th><th>値</th></tr></thead><tbody><tr><td>可用性（マルチリージョン書き込み）</td><td>99.999%</td></tr><tr><td>可用性（単一リージョン）</td><td>99.99%</td></tr><tr><td>読み取りレイテンシ（P99）</td><td>< 10ms</td></tr><tr><td>書き込みレイテンシ（P99）</td><td>< 10ms</td></tr><tr><td>スループット（RU/s）</td><td>プロビジョニング値を保証</td></tr></tbody></table><div class=\"wbox\">Cosmos DB は「5つの SLA」が有名。可用性だけでなくレイテンシとスループットの SLA も提供する唯一のクラウド DB という点が問われる。</div></div></div>"},{"num":35,"id":"q35","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"Azure Functions を使用して Azure サブスクリプションのアクティビティログを読み取るアプリケーションを構築しています。資格情報とアクセスの管理における管理オーバーヘッドを最小限に抑えることが要件です。\n\n推奨に含めるべきものはどれですか？","choices":[{"text":"システム割り当てマネージドID","is_correct":true},{"text":"エンタープライズアプリケーション（Entra）","is_correct":false},{"text":"Shared Access Signature（SAS）","is_correct":false},{"text":"Microsoft Entra へのアプリケーション登録","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"145\" height=\"90\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"92\" y=\"66\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Functions</text><text x=\"92\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">システム割り当て</text><text x=\"92\" y=\"93\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">マネージドID自動作成</text><rect x=\"240\" y=\"20\" width=\"215\" height=\"125\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"347\" y=\"68\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">Microsoft Entra ID</text><text x=\"347\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">IDを自動管理</text><text x=\"347\" y=\"95\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">認証情報ゼロ</text><rect x=\"252\" y=\"62\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#D1C4E9\"/><text x=\"347\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">Functionsライフサイクルに紐付き</text><rect x=\"252\" y=\"87\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#D1C4E9\"/><text x=\"347\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">Functions削除時に自動削除</text><rect x=\"252\" y=\"112\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#D1C4E9\"/><text x=\"347\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">ローテーション・管理不要</text><rect x=\"252\" y=\"137\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#D1C4E9\"/><text x=\"347\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">RBACでMonitor Readerロール付与</text><rect x=\"535\" y=\"35\" width=\"145\" height=\"70\" rx=\"8\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"2\"/><text x=\"607\" y=\"56\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#0072C6\">Azure Monitor</text><text x=\"607\" y=\"70\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">アクティビティログ</text><text x=\"607\" y=\"83\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">読み取りアクセス</text><rect x=\"535\" y=\"118\" width=\"145\" height=\"47\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"607\" y=\"127\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">ユーザー割り当てID</text><text x=\"607\" y=\"141\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">複数リソース共有用</text><text x=\"607\" y=\"154\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">1:1の今回は不要</text><line x1=\"165\" y1=\"80\" x2=\"238\" y2=\"90\" stroke=\"#107C10\" stroke-width=\"2\" marker-end=\"url(#ag)\"/><line x1=\"455\" y1=\"90\" x2=\"533\" y2=\"70\" stroke=\"#7719AA\" stroke-width=\"2\" marker-end=\"url(#ap)\"/><text x=\"350\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">システム割り当て: 1リソース=1ID。最小権限でシンプル。管理オーバーヘッドゼロ</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>システム割り当てマネージドID</strong>は Azure Functions のライフサイクルに自動紐付けされ、\n認証情報の管理・手動ローテーションが<em>一切不要</em>です。\nFunctions を削除すると自動で ID も削除されます。「管理オーバーヘッド最小」要件に完全合致します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>エンタープライズアプリケーション：</strong>SSO 設定やアプリ管理用の Entra オブジェクト。\nFunctions の認証情報として使うものではありません。<br>\n<strong>SAS：</strong>ストレージ向けの期限付きアクセス署名。Monitor API への RBAC アクセスには使えません。<br>\n<strong>アプリ登録（サービスプリンシパル）：</strong>クライアントシークレットの手動管理・ローテーションが必要で管理オーバーヘッドが発生します。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">Azure リソース → Azure サービスの認証</span><span class=\"fs\">「Azureリソース（Functions/VM等）」なら → マネージドID</span><span class=\"fs\">1対1（そのリソース専用）→ システム割り当て ✅</span><span class=\"fs\">複数リソースで共有 → ユーザー割り当て</span><span class=\"fs\">外部サービス / 非 Azure から → サービスプリンシパル</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>方法</th><th>管理オーバーヘッド</th><th>認証情報の期限</th><th>推奨シナリオ</th></tr></thead><tbody><tr><td>システム割り当てマネージドID ✅</td><td>最小（自動）</td><td>なし（自動管理）</td><td>1リソース専用</td></tr><tr><td>ユーザー割り当てマネージドID</td><td>小</td><td>なし（自動管理）</td><td>複数リソース共有</td></tr><tr><td>サービスプリンシパル</td><td>中（シークレット管理）</td><td>有効期限管理必要</td><td>外部サービス・非 Azure</td></tr><tr><td>SAS</td><td>中（有効期限管理）</td><td>あり（手動更新）</td><td>ストレージのみ</td></tr></tbody></table><div class=\"wbox\">マネージドID は Azure リソース専用。外部アプリ（オンプレ等）から Azure にアクセスする場合はサービスプリンシパルが必要。用途の違いを押さえる。</div></div></div>"},{"num":36,"id":"q36","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"オンプレミスのストレージシステムを Microsoft Azure に移行予定です。移行後のソリューションは Hadoop Distributed File System（HDFS）と互換性を持ち、サポートする必要があります。\n\n選択すべき Azure サービスはどれですか？","choices":[{"text":"Azure Data Lake Storage Gen2","is_correct":true},{"text":"Azure NetApp Files","is_correct":false},{"text":"Azure Data Share","is_correct":false},{"text":"Azure Table Storage","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"145\" height=\"85\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"92\" y=\"63\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">オンプレ HDFS</text><text x=\"92\" y=\"77\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">Hadoop エコシステム</text><text x=\"92\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">移行対象</text><rect x=\"240\" y=\"20\" width=\"215\" height=\"125\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"347\" y=\"68\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">ADLS Gen2</text><text x=\"347\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">HDFS 完全互換</text><text x=\"347\" y=\"95\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Blob 上に構築</text><rect x=\"252\" y=\"62\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"347\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">HDFS API 互換（WebHDFS）✅</text><rect x=\"252\" y=\"87\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"347\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">階層型名前空間（ディレクトリ）✅</text><rect x=\"252\" y=\"112\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"347\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ACL（POSIX準拠）✅</text><rect x=\"252\" y=\"137\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"347\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Databricks/Synapse/HDInsight連携</text><rect x=\"530\" y=\"35\" width=\"150\" height=\"65\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"605\" y=\"53\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Blob Storage（標準）</text><text x=\"605\" y=\"67\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">HDFS API なし</text><text x=\"605\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">フラット名前空間</text><rect x=\"530\" y=\"113\" width=\"150\" height=\"47\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"605\" y=\"122\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Azure Files</text><text x=\"605\" y=\"136\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">SMB/NFS向け</text><text x=\"605\" y=\"149\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">HDFS互換なし</text><line x1=\"165\" y1=\"77\" x2=\"238\" y2=\"90\" stroke=\"#7719AA\" stroke-width=\"2\" marker-end=\"url(#ap)\"/><text x=\"350\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">ADLS Gen2 = Blob + 階層型名前空間 + HDFS互換。HDFSからの移行でコード変更最小</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>ADLS Gen2</strong>は HDFS と完全な互換 API（WebHDFS）を持ち、\n既存の Hadoop コードをほぼ変更なしに移行できます。\nBlob Storage 上に構築されており、階層型名前空間・POSIX 準拠 ACL・大規模並列アクセスを提供します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Azure NetApp Files：</strong>高性能 NAS（NFS / SMB）。Hadoop 互換 API はありません。<br>\n<strong>Azure Data Share：</strong>外部組織へのデータ共有サービス。ストレージとして使うものではありません。<br>\n<strong>Azure Table Storage：</strong>KV 型 NoSQL。HDFS との互換性はありません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">HDFS 互換 + ビッグデータ分析</span><span class=\"fs\">HDFS API（WebHDFS）に対応しているか？</span><span class=\"fs\">Blob Storage（標準）→ HNS なし → ×</span><span class=\"fs\">ADLS Gen2（HNS 有効）→ HDFS 互換 ○ → ✅</span><span class=\"fs\">NetApp Files → NFS / SMB → HDFS 互換なし → ×</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>特徴</th><th>Blob Storage（標準）</th><th>ADLS Gen2</th></tr></thead><tbody><tr><td>HNS（階層型名前空間）</td><td>×（仮想）</td><td>○（真の階層）</td></tr><tr><td>HDFS API 互換</td><td>×</td><td>○（WebHDFS）✅</td></tr><tr><td>ディレクトリ rename（アトミック）</td><td>×（全コピー）</td><td>○（メタデータ操作）</td></tr><tr><td>POSIX ACL</td><td>×</td><td>○</td></tr><tr><td>Event Hubs Capture 対応</td><td>○</td><td>○</td></tr></tbody></table><div class=\"wbox\">HNS はアカウント作成時にしか有効化できない（後から変更不可）。既存 Blob アカウントを ADLS Gen2 にするには新規アカウントを作成してデータを移行する。</div></div></div>"},{"num":37,"id":"q37","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"マイクロサービスベースの Web アプリケーションをホストするアーキテクチャを計画しています。要件：①オンプレミスと Azure の両方にデプロイ可能、②低レイテンシ通信とハイパースケールワークロードのサポート、③各マイクロサービスを他に影響なく独立してアップグレード可能、④問題を自動検出して自己修復アクションを実行するポリシーを定義できること。\n\n推奨すべき技術はどれですか？","choices":[{"text":"Azure Service Fabric","is_correct":true},{"text":"Azure Container Instance","is_correct":false},{"text":"Azure Logic App","is_correct":false},{"text":"Azure VM スケールセット","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">Functions → AKS 移行（Q37）</div s</text>\n<text x=\"85\" y=\"117\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">サーバーレス(移行前)</text>\n<line x1=\"150\" y1=\"97\" x2=\"190\" y2=\"97\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"170\" y=\"92\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">コンテナ化</text>\n<rect x=\"195\" y=\"50\" width=\"150\" height=\"95\" rx=\"7\" fill=\"#112240\" stroke=\"#0078D4\" stroke-width=\"1.5\"/>\n<rect x=\"201\" y=\"55\" width=\"138\" height=\"24\" rx=\"4\" fill=\"#0078D4\" fill-opacity=\"0.18\"/>\n<text x=\"270\" y=\"71\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0078D4\" font-family=\"Segoe UI,Arial,sans-serif\">AKS</text>\n<text x=\"270\" y=\"91\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">AKS Cluster</text>\n<text x=\"270\" y=\"102\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">移行後</text>\n<text x=\"270\" y=\"155\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">KEDA スケーリング</text>\n<line x1=\"345\" y1=\"97\" x2=\"385\" y2=\"80\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<line x1=\"345\" y1=\"97\" x2=\"385\" y2=\"120\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<rect x=\"390\" y=\"45\" width=\"120\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#6264A7\" stroke-width=\"1.5\"/>\n<rect x=\"396\" y=\"50\" width=\"108\" height=\"24\" rx=\"4\" fill=\"#6264A7\" fill-opacity=\"0.18\"/>\n<text x=\"450\" y=\"66\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#6264A7\" font-family=\"Segoe UI,Arial,sans-serif\">ACR</text>\n<text x=\"450\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Container</text>\n<text x=\"450\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Registry</text>\n<rect x=\"390\" y=\"115\" width=\"120\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#107C41\" stroke-width=\"1.5\"/>\n<rect x=\"396\" y=\"120\" width=\"108\" height=\"24\" rx=\"4\" fill=\"#107C41\" fill-opacity=\"0.18\"/>\n<text x=\"450\" y=\"136\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#107C41\" font-family=\"Segoe UI,Arial,sans-serif\">HPA</text>\n<text x=\"450\" y=\"156\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">KEDA / HPA</text>\n<text x=\"450\" y=\"167\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">オートスケール</text>\n<text x=\"290\" y=\"185\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Functions → AKS: KEDA でイベント駆動スケーリング維持</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Azure Service Fabric</strong>はマイクロサービス用の分散システムプラットフォームで、\n<strong>Azure とオンプレミスの両方にデプロイできる唯一</strong>の選択肢です。\nサービス単位の独立アップグレード・組み込みのヘルス監視と自動修復・低レイテンシ分散処理を提供します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Azure Container Instances（ACI）：</strong>コンテナの単発実行向け。マイクロサービスのオーケストレーション・ライフサイクル管理・オンプレデプロイには設計されていません。<br>\n<strong>Azure Logic Apps：</strong>ローコードのワークフロー統合サービス。マイクロサービス基盤ではありません。<br>\n<strong>VM スケールセット：</strong>VM の自動スケールは提供しますが、マイクロサービスの独立デプロイ・自己修復・オンプレデプロイをネイティブには持ちません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">「オンプレ + Azure のハイブリッド」かつ「マイクロサービス」</span><span class=\"fs\">AKS → オンプレは Arc 経由が必要・追加設定が複雑 → ×</span><span class=\"fs\">VMSS → マイクロサービスオーケストレーション機能なし → ×</span><span class=\"fs\">Service Fabric → オンプレ / Azure 両対応・自己修復組み込み → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>サービス</th><th>オンプレ展開</th><th>マイクロサービス管理</th><th>独立デプロイ</th><th>自己修復</th></tr></thead><tbody><tr><td>Service Fabric ✅</td><td>○（専用設計）</td><td>○</td><td>○</td><td>○（組み込み）</td></tr><tr><td>AKS</td><td>△（Arc 経由）</td><td>○（コンテナ）</td><td>○</td><td>○</td></tr><tr><td>ACI</td><td>×</td><td>×（単発実行）</td><td>×</td><td>×</td></tr><tr><td>VMSS</td><td>×</td><td>×</td><td>△</td><td>×（手動）</td></tr></tbody></table><div class=\"wbox\">Service Fabric は「ハイブリッド展開可能なマイクロサービス基盤」として試験頻出。AKS はオンプレ展開に追加設定が必要な点で差別化される。</div></div></div>"},{"num":38,"id":"q38","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"オンプレミスのアプリケーションが複数のDBからデータを取得しており、コード内でサーバー名・DB名・テーブル名を含む完全修飾名でDBオブジェクトを参照しています。このアプリケーションデータを Azure に移行する計画です。\n\nこの要件を満たすアプリケーションデータを移行できる2つの Azure サービスはどれですか？","choices":[{"text":"SQL Server on Azure VM","is_correct":true},{"text":"Azure SQL Managed Instance","is_correct":true},{"text":"SQL Server Stretch Database","is_correct":false},{"text":"Azure SQL Database（あなたの回答の一部）","is_correct":false}],"correct_indices":[0,1],"n_correct":2,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"160\" height=\"115\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#999\" stroke-width=\"1\"/><text x=\"100\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#999\">要件</text><text x=\"100\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">完全修飾オブジェクト名</text><text x=\"100\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">server.db.schema.obj</text><text x=\"100\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">クロス DB クエリ</text><text x=\"100\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">コード変更最小</text><rect x=\"255\" y=\"20\" width=\"205\" height=\"135\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"357\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">SQL MI (B)</text><text x=\"357\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">SQL Server ほぼ完全互換</text><text x=\"357\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">3部構成の名前OK</text><rect x=\"267\" y=\"62\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"357\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">クロスDB クエリ ✅</text><rect x=\"267\" y=\"87\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"357\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">完全修飾名(4部構成) ✅</text><rect x=\"267\" y=\"112\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"357\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">PaaS：管理最小 ✅</text><rect x=\"267\" y=\"137\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"357\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">コード変更ほぼ不要 ✅</text><rect x=\"535\" y=\"20\" width=\"145\" height=\"135\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"607\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">SQL on VM (A)</text><text x=\"607\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">SQL Server 完全制御</text><text x=\"607\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">命名規則そのまま</text><rect x=\"547\" y=\"62\" width=\"121\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"607\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">完全互換 ✅</text><rect x=\"547\" y=\"87\" width=\"121\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"607\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">完全修飾名 ✅</text><rect x=\"547\" y=\"112\" width=\"121\" height=\"20\" rx=\"4\" fill=\"#FFF9C4\"/><text x=\"607\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7B5000\">IaaS（管理作業あり）</text><rect x=\"547\" y=\"137\" width=\"121\" height=\"20\" rx=\"4\" fill=\"#FFF9C4\"/><text x=\"607\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7B5000\">コスト高め</text><text x=\"350\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Azure SQL Database: クロスDB非対応。SQL MIとSQL on VMのみが2要件を満たす(2択)</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>【2択問題】</strong><br>\n<strong>A. SQL Server on Azure VM：</strong>SQL Server をフル制御できる IaaS で、\n<code>server.database.schema.object</code> の4部構成完全修飾名とクロスDB クエリをそのまま使えます。<br>\n<strong>B. Azure SQL Managed Instance：</strong>SQL Server エンジンとほぼ完全互換の PaaS で、\n同様に完全修飾名とクロスDB クエリをサポート。コード変更最小で移行可能です。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>SQL Server Stretch Database：</strong>オンプレ SQL Server のコールドデータをクラウドに拡張する機能（現在非推奨・廃止予定）。移行先ではありません。<br>\n<strong>Azure SQL Database：</strong>単一 DB モデルのため<em>クロスDB クエリ</em>と\n<em>完全修飾4部構成名</em>（<code>server.db.schema.obj</code>）は特別な回避策なしには使えません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">完全修飾オブジェクト名（4部） + クロスDB クエリが要件</span><span class=\"fs\">Azure SQL DB → 単一 DB モデル → 両機能 ✗ → 即除外</span><span class=\"fs\">SQL MI → SQL Server 互換 → 両機能 ○ → ✅</span><span class=\"fs\">SQL on VM → 完全制御 → 両機能 ○ → ✅</span><span class=\"fs\">→ 2択: SQL MI + SQL on VM</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>サービス</th><th>クロスDB クエリ</th><th>完全修飾名（4部）</th><th>マネージド</th><th>管理コスト</th></tr></thead><tbody><tr><td>Azure SQL Database</td><td>×（原則）</td><td>×（原則）</td><td>○（PaaS）</td><td>低</td></tr><tr><td>SQL Managed Instance ✅</td><td>○</td><td>○</td><td>○（PaaS）</td><td>低〜中</td></tr><tr><td>SQL Server on Azure VM ✅</td><td>○</td><td>○</td><td>×（IaaS）</td><td>高</td></tr><tr><td>SQL Database Elastic Pool</td><td>×（原則）</td><td>×（原則）</td><td>○（PaaS）</td><td>低</td></tr></tbody></table><div class=\"wbox\">SQL DB と SQL MI の最大の違いは「インスタンスモデル（MI）vs 単一 DB モデル（DB）」。クロスDB・完全修飾名 → MI が必要のシグナル。</div></div></div>"},{"num":39,"id":"q39","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"高さマップデータから3次元ジオメトリを生成するソリューションを設計しています。要件：①全計算は Azure 内で実行、②全計算ノード間でデータ交換が可能、③複数シーンを最短時間で処理できるよう最大ノード数にスケールアウト、④実装の労力を最小化。\n\n推奨に含めるべき2つのアクションはどれですか？","choices":[{"text":"Azure Batch を使用したレンダーファームの作成","is_correct":true},{"text":"計算ノードでの並列タスク実行の有効化","is_correct":true},{"text":"Azure の並列ファイルシステムの有効化","is_correct":false},{"text":"仮想マシンを使用したレンダーファームの作成","is_correct":false},{"text":"VM スケールセットを使用したレンダーファームの作成（あなたの回答の一部）","is_correct":false}],"correct_indices":[0,1],"n_correct":2,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"155\" height=\"115\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#999\" stroke-width=\"1\"/><text x=\"97\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#999\">要件</text><text x=\"97\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">全計算 Azure 内</text><text x=\"97\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">ノード間データ交換</text><text x=\"97\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">最大ノード数スケール</text><text x=\"97\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">実装労力最小化</text><rect x=\"250\" y=\"20\" width=\"205\" height=\"135\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"352\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Batch (A)</text><text x=\"352\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">HPC ジョブ管理</text><text x=\"352\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">自動スケール</text><rect x=\"262\" y=\"62\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"352\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">自動ジョブスケジューリング ✅</text><rect x=\"262\" y=\"87\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"352\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">プール自動スケール ✅</text><rect x=\"262\" y=\"112\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"352\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ノード間通信 ✅</text><rect x=\"262\" y=\"137\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"352\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">実装労力最小 ✅</text><rect x=\"530\" y=\"20\" width=\"150\" height=\"135\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"605\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">並列タスク有効化 (B)</text><text x=\"605\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">1ノード複数タスク</text><text x=\"605\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">スループット最大化</text><rect x=\"542\" y=\"62\" width=\"126\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"605\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">マルチタスク/ノード実行</text><rect x=\"542\" y=\"87\" width=\"126\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"605\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">リソース利用率最大化</text><rect x=\"542\" y=\"112\" width=\"126\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"605\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">最短処理時間 ✅</text><text x=\"350\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">VMSS単独: HPCオーケストレーション機能なし。Batch+並列タスクが最適(2択)</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>【2択問題】</strong><br>\n<strong>A. Azure Batch でレンダーファームを作成：</strong>HPC ジョブの完全マネージドサービス。\n自動ジョブスケジューリング・プール自動スケール・タスク依存関係・失敗時再試行をネイティブに提供し、\n実装労力を最小化します。<br>\n<strong>B. 計算ノードでの並列タスク実行を有効化：</strong>1 ノードが複数のシーン・フレームを同時処理でき、\nリソース使用率とスループットを最大化。最短処理時間要件を満たします。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Azure 並列ファイルシステムの有効化：</strong>高性能ファイル I/O（Lustre 等）の設定。ジョブ実行の管理自体はできません。<br>\n<strong>VM でレンダーファームを作成：</strong>ジョブスケジューリング・タスク分散を全て手動実装する必要があり実装労力が大幅増加。<br>\n<strong>VM スケールセットでレンダーファームを作成：</strong>ステートレスアプリのスケールには適しますが、HPC ジョブオーケストレーション機能（チェックポイント・タスク依存・優先度付きキュー等）を持ちません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">HPC・大規模並列計算 + 実装労力最小化</span><span class=\"fs\">VM / VMSS → ジョブ管理・スケジューリングを自作 → 実装労力大 → ✗</span><span class=\"fs\">Azure Batch → HPC 専用マネージドサービス → 実装労力最小 → ✅</span><span class=\"fs\">最短処理時間 → 1ノードで複数タスク並列実行 → 並列タスク有効化 → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>サービス</th><th>HPC 向け設計</th><th>ジョブスケジューリング</th><th>実装労力</th><th>典型用途</th></tr></thead><tbody><tr><td>Azure Batch ✅</td><td>○（専用設計）</td><td>○（自動）</td><td>最小</td><td>レンダリング・シミュレーション・遺伝子解析</td></tr><tr><td>VMSS</td><td>△</td><td>×（要自作）</td><td>大</td><td>Webアプリスケール</td></tr><tr><td>AKS</td><td>△</td><td>△（要設定）</td><td>中</td><td>コンテナワークロード</td></tr><tr><td>HPC VM（N/H シリーズ）</td><td>○（ハードウェア）</td><td>×（要自作）</td><td>大</td><td>GPU・InfiniBand 必須時</td></tr></tbody></table><div class=\"wbox\">Azure Batch は「HPC + 管理最小化」の組み合わせで必ず登場。ジョブスケジューリングを自作しなくてよいのが最大メリット。VMSS 単独では HPC オーケストレーションができない。</div></div></div>"},{"num":40,"id":"q40","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"ミッションクリティカルなアプリケーションの運用記録を保存するストレージソリューションを推奨します。ストレージプラットフォームは書き込み操作レイテンシと全体のスループットの両方に対して SLA を保証する必要があります。\n\n推奨に含めるべきものはどれですか？","choices":[{"text":"Azure Cosmos DB","is_correct":true},{"text":"Azure Data Lake Storage Gen2","is_correct":false},{"text":"Azure Blob Storage","is_correct":false},{"text":"Azure SQL Database","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">書き込みレイテンシ・スループット SLA を持つサービスの比較</text><rect x=\"20\" y=\"32\" width=\"205\" height=\"110\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"122\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Cosmos DB</text><text x=\"122\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">包括的 SLA</text><text x=\"122\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">5指標をすべて保証</text><rect x=\"32\" y=\"72\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"122\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">書き込みレイテンシ < 10ms ✅</text><rect x=\"32\" y=\"97\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"122\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">スループット（RU/s）SLA ✅</text><rect x=\"32\" y=\"122\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"122\" y=\"135\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">可用性・一貫性・読み取りも保証</text><rect x=\"245\" y=\"32\" width=\"210\" height=\"110\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"350\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Azure SQL Database</text><text x=\"350\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">可用性 SLA のみ</text><text x=\"350\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">レイテンシ SLA なし</text><rect x=\"257\" y=\"72\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"350\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">可用性 99.99% のみ保証</text><rect x=\"257\" y=\"97\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"350\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">書き込みレイテンシ保証なし</text><rect x=\"475\" y=\"32\" width=\"210\" height=\"110\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"580\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Azure Storage</text><text x=\"580\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">可用性・耐久性のみ</text><text x=\"580\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">スループット SLA なし</text><rect x=\"487\" y=\"72\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"580\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">99.9%/99.99% 可用性のみ</text><rect x=\"487\" y=\"97\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"580\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">スループット保証なし</text><text x=\"350\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Cosmos DB: 可用性/レイテンシ/スループット/一貫性/耐久性の5指標SLAを持つ唯一のDB</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Azure Cosmos DB</strong>は業界唯一、<strong>可用性・書き込みレイテンシ・読み取りレイテンシ・スループット（RU/s）の4指標すべてに SLA</strong>を設けているデータベースサービスです。\n書き込みレイテンシは P99 で 10ms 未満の SLA を保証します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>ADLS Gen2 / Blob Storage：</strong>可用性と耐久性の SLA のみ。書き込みレイテンシやスループットの保証はありません。<br>\n<strong>Azure SQL Database：</strong>可用性（99.99%）の SLA のみ。書き込みレイテンシの SLA は提供していません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">書き込みレイテンシ + スループットの SLA が要件</span><span class=\"fs\">Blob / ADLS → ストレージ系（レイテンシ SLA なし）→ ✗</span><span class=\"fs\">SQL DB → 可用性 SLA のみ → ✗</span><span class=\"fs\">Cosmos DB → 4指標の SLA → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><strong>Cosmos DB の4つの SLA</strong><table class=\"etbl\"><thead><tr><th>SLA 項目</th><th>値</th><th>備考</th></tr></thead><tbody><tr><td>可用性（マルチリージョン書き込み）</td><td>99.999%</td><td>最高水準</td></tr><tr><td>可用性（単一リージョン）</td><td>99.99%</td><td>-</td></tr><tr><td>読み取りレイテンシ（P99）</td><td>< 10ms</td><td>1リージョン内</td></tr><tr><td>書き込みレイテンシ（P99）</td><td>< 10ms ✅</td><td>他DBにはないSLA</td></tr></tbody></table><div class=\"wbox\">試験では「SLA + レイテンシ + スループット」が出たら Cosmos DB 以外に正解がない。「4つの SLA」は暗記必須。</div></div></div>"},{"num":41,"id":"q41","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"Azure VM の VM1（Windows Server 2019）に約700GBのデータファイルが保存されています。Azure Data Factory を使用してこれらのデータファイルを処理・変換し、Azure Data Lake Storage にロードするソリューションを設計しています。\n\nこのデザインをサポートするために VM1 にデプロイすべきコンポーネントはどれですか？","choices":[{"text":"Self-hosted Integration Runtime","is_correct":true},{"text":"オンプレミスデータゲートウェイ","is_correct":false},{"text":"Azure Pipelines エージェント","is_correct":false},{"text":"Azure File Sync エージェント","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"140\" height=\"85\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"90\" y=\"63\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">Azure VM</text><text x=\"90\" y=\"77\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">プライベート VNet</text><text x=\"90\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">ADF 管理境界外</text><rect x=\"235\" y=\"20\" width=\"215\" height=\"125\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"342\" y=\"68\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">セルフホステッド IR</text><text x=\"342\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">オンプレ/VM接続</text><text x=\"342\" y=\"95\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">エージェント方式</text><rect x=\"247\" y=\"62\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"342\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">VMにエージェントインストール</text><rect x=\"247\" y=\"87\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"342\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">プライベートネットワーク経由</text><rect x=\"247\" y=\"112\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"342\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ADF にデータを安全転送</text><rect x=\"247\" y=\"137\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"342\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">VPN/ER不要でも接続可</text><rect x=\"525\" y=\"35\" width=\"155\" height=\"65\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"602\" y=\"53\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Data Factory</text><text x=\"602\" y=\"67\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">パイプライン</text><text x=\"602\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">データ処理</text><rect x=\"525\" y=\"112\" width=\"155\" height=\"43\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"602\" y=\"119\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Azure IR（マネージド）</text><text x=\"602\" y=\"133\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">パブリックEPのみ</text><text x=\"602\" y=\"146\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">プライベートVM❌</text><line x1=\"160\" y1=\"77\" x2=\"233\" y2=\"90\" stroke=\"#7719AA\" stroke-width=\"2\" marker-end=\"url(#ap)\"/><line x1=\"450\" y1=\"90\" x2=\"523\" y2=\"68\" stroke=\"#107C10\" stroke-width=\"2\" marker-end=\"url(#ag)\"/><text x=\"350\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Self-hosted IR: ADF の橋渡し役。VPN/ER不要でプライベートリソースに接続可能</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Self-hosted Integration Runtime（セルフホステッド IR）</strong>は\nAzure Data Factory がプライベート VNet 内の VM やオンプレミスリソースに\n接続するためのエージェントです。VM にインストールし、\nADF パイプラインがプライベート境界を越えてデータを安全に転送できます。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>オンプレミスデータゲートウェイ：</strong>Logic Apps・Power BI・Power Apps 向けのブリッジ。\n<em>ADF とは異なるサービス専用</em>です。ADF には Self-hosted IR が対応します。<br>\n<strong>Azure Pipelines エージェント：</strong>CI/CD のビルド・デプロイエージェント。データ転送とは無関係。<br>\n<strong>Azure File Sync エージェント：</strong>オンプレファイルサーバーと Azure Files を同期するエージェント。ADF のデータ統合には使いません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">ADF + プライベート VM / オンプレへのアクセス</span><span class=\"fs\">ADF マネージド IR → パブリックエンドポイントのみ → ✗</span><span class=\"fs\">Self-hosted IR → プライベート / オンプレ対応 → ✅</span><span class=\"fs\">オンプレデータゲートウェイ → Logic Apps / Power BI 用 → ADF には不適</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>コンポーネント</th><th>用途</th><th>プライベート接続</th><th>対象サービス</th></tr></thead><tbody><tr><td>Azure IR（マネージド）</td><td>パブリックエンドポイント間のデータ移動</td><td>×</td><td>ADF</td></tr><tr><td>Managed VNet IR</td><td>Private Endpoint 経由のデータ移動</td><td>○</td><td>ADF</td></tr><tr><td>Self-hosted IR ✅</td><td>オンプレ / プライベート VM のデータ移動</td><td>○</td><td>ADF</td></tr><tr><td>Azure-SSIS IR</td><td>SSIS パッケージ実行</td><td>△</td><td>ADF</td></tr><tr><td>オンプレデータゲートウェイ</td><td>オンプレデータへの接続</td><td>○</td><td>Logic Apps / Power BI / Power Apps</td></tr></tbody></table><div class=\"wbox\">オンプレデータゲートウェイ（Logic Apps 用）と Self-hosted IR（ADF 用）は混同しやすい。どちらもオンプレ接続だが対象サービスが異なる。</div></div></div>"},{"num":42,"id":"q42","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"Azure リソース：VNET1（ExpressRoute でオンプレミスに接続）、VM1（DNSサーバー）、PE1（SQLDB1 へのプライベートエンドポイント）、apexcore.com プライベート DNS ゾーン（VNET1 にリンク、PE1 の A レコード）、apexcore.com パブリック DNS ゾーン（SQLDB1 の CNAME レコード）。オンプレミスネットワークから PE1 を使用して SQLDB1 へ接続するソリューションで名前解決を設定する必要があります。\n\n選択すべき Azure 設定はどれですか？","choices":[{"text":"VM1 が apexcore.com を 168.63.129.16 の Azure 提供 DNS へ転送するよう設定する","is_correct":true},{"text":"VM1 が apexcore.com をパブリック DNS ゾーンへ転送するよう設定する","is_correct":false},{"text":"VNet1 のカスタム DNS サーバーを 168.63.129.16 に設定する","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">Private Endpoint + DNS + ExpressRoute（Q42-43）</div><svg viewBox=\"0 0 760 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:760px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"760\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"
