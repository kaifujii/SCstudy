h=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/></marker>\n</defs>\n<rect x=\"20\" y=\"65\" width=\"120\" height=\"65\" rx=\"7\" fill=\"#112240\" stroke=\"#F97C00\" stroke-width=\"1.5\"/>\n<rect x=\"26\" y=\"70\" width=\"108\" height=\"24\" rx=\"4\" fill=\"#F97C00\" fill-opacity=\"0.18\"/>\n<text x=\"80\" y=\"86\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#F97C00\" font-family=\"Segoe UI,Arial,sans-serif\">Blob</text>\n<text x=\"80\" y=\"106\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Blob Storage</text>\n<text x=\"80\" y=\"117\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">CSVファイル</text>\n<line x1=\"140\" y1=\"97\" x2=\"180\" y2=\"97\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"160\" y=\"92\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Source</text>\n<rect x=\"185\" y=\"50\" width=\"140\" height=\"95\" rx=\"7\" fill=\"#112240\" stroke=\"#E040FB\" stroke-width=\"1.5\"/>\n<rect x=\"191\" y=\"55\" width=\"128\" height=\"24\" rx=\"4\" fill=\"#E040FB\" fill-opacity=\"0.18\"/>\n<text x=\"255\" y=\"71\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#E040FB\" font-family=\"Segoe UI,Arial,sans-serif\">ADF</text>\n<text x=\"255\" y=\"91\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Azure Data</text>\n<text x=\"255\" y=\"102\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Factory</text>\n<text x=\"255\" y=\"155\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Mapping Data Flow</text>\n<line x1=\"325\" y1=\"97\" x2=\"365\" y2=\"97\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"345\" y=\"92\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Sink</text>\n<rect x=\"370\" y=\"65\" width=\"120\" height=\"65\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"376\" y=\"70\" width=\"108\" height=\"24\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"430\" y=\"86\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">SQL</text>\n<text x=\"430\" y=\"106\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Azure SQL DB</text>\n<text x=\"430\" y=\"117\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">変換後データ</text>\n<line x1=\"255\" y1=\"50\" x2=\"255\" y2=\"25\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<rect x=\"190\" y=\"5\" width=\"130\" height=\"35\" rx=\"7\" fill=\"#112240\" stroke=\"#107C41\" stroke-width=\"1.5\"/>\n<rect x=\"196\" y=\"10\" width=\"118\" height=\"24\" rx=\"4\" fill=\"#107C41\" fill-opacity=\"0.18\"/>\n<text x=\"255\" y=\"26\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#107C41\" font-family=\"Segoe UI,Arial,sans-serif\">Trigger</text>\n<text x=\"255\" y=\"46\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">スケジュール</text>\n<text x=\"255\" y=\"57\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">トリガー</text>\n<text x=\"290\" y=\"175\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">ADF Pipeline: Source → Transform → Sink</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Azure Data Factory (ADF)</strong> はフルマネージドの ETL/ELT サービスで、\nBlob Storage と SQL Database への<strong>ネイティブコネクタ</strong>を標準搭載しています。\n<strong>Tumbling Window トリガー</strong>（月次固定ウィンドウ）を使えば、コード不要でスケジュール実行の\nパイプラインを構築できます。「月次で Blob → SQL へ自動転送」は ADF の最も典型的なユースケースです。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>AzCopy：</strong>CLIベースのストレージ間コピーツール。転送先は Blob / ADLS / Files <em>のみ</em>で、\nSQL Database には書き込めません。スケジュール実行も外部 cron 等が別途必要。<br>\n<strong>Data Migration Assistant (DMA)：</strong>オンプレ SQL Server → Azure SQL への<em>一回限りの移行評価・実行</em>専用ツール。\n定期 ETL には使えません。<br>\n<strong>SSMA：</strong>Oracle / MySQL / Access などの<em>異種DBをSQL Serverへ変換</em>するツール。\nBlob からのデータ転送とはまったく無関係。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">「定期スケジュール実行が必要」→ ADF のトリガー機能あり ✅</span><span class=\"fs\">「宛先が SQL Database」→ ストレージ間専用 AzCopy は除外 ✅</span><span class=\"fs\">「一回限りの移行ツール」DMA / SSMA は定期実行不可 → 除外 ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><strong>4ツールの用途比較</strong><table class=\"etbl\"><thead><tr><th>ツール</th><th>用途</th><th>スケジュール実行</th><th>SQL DB への書き込み</th></tr></thead><tbody><tr><td>ADF ✅</td><td>ETL/ELT パイプライン</td><td>○（組み込み）</td><td>○</td></tr><tr><td>AzCopy</td><td>ストレージ間コピー</td><td>×（外部依存）</td><td>×</td></tr><tr><td>DMA</td><td>SQL Server 移行評価（一回）</td><td>×</td><td>一回のみ</td></tr><tr><td>SSMA</td><td>異種DB → SQL Server 変換（一回）</td><td>×</td><td>一回のみ</td></tr></tbody></table><div class=\"wbox\">AzCopy は「Blob → Blob」なら正解になることも。宛先が SQL Database かどうかで即除外できるかを確認する。</div></div></div>"},{"num":2,"id":"q2","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"レポーティングワークロード向けデータストレージソリューションを設計しています。Azure Event Hubs で大量の JSON データを取り込み、日付・時刻で整理されたディレクトリ構造に格納、直接クエリ可能、集計・変換してデータウェアハウスにロードする必要があります。\n\n取り込んだデータのデータストアとして推奨するサービスはどれですか？","choices":[{"text":"Azure Data Lake Storage Gen2","is_correct":true},{"text":"Azure Blob Storage","is_correct":false},{"text":"Azure Files","is_correct":false},{ f\" font-family=\"Segoe UI,Arial,sans-serif\">デバイス群</text>\n<text x=\"70\" y=\"117\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">テレメトリ</text>\n<line x1=\"125\" y1=\"97\" x2=\"165\" y2=\"97\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"145\" y=\"92\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">HTTPS/AMQP</text>\n<rect x=\"170\" y=\"50\" width=\"130\" height=\"95\" rx=\"7\" fill=\"#112240\" stroke=\"#00897B\" stroke-width=\"1.5\"/>\n<rect x=\"176\" y=\"55\" width=\"118\" height=\"24\" rx=\"4\" fill=\"#00897B\" fill-opacity=\"0.18\"/>\n<text x=\"235\" y=\"71\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#00897B\" font-family=\"Segoe UI,Arial,sans-serif\">EH</text>\n<text x=\"235\" y=\"91\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Event Hubs</text>\n<text x=\"235\" y=\"102\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">取り込み</text>\n<text x=\"235\" y=\"155\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Capture 有効</text>\n<line x1=\"300\" y1=\"97\" x2=\"340\" y2=\"80\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"320\" y=\"75\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Stream</text>\n<line x1=\"300\" y1=\"97\" x2=\"340\" y2=\"120\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"320\" y=\"92\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Capture</text>\n<rect x=\"345\" y=\"45\" width=\"120\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#6264A7\" stroke-width=\"1.5\"/>\n<rect x=\"351\" y=\"50\" width=\"108\" height=\"24\" rx=\"4\" fill=\"#6264A7\" fill-opacity=\"0.18\"/>\n<text x=\"405\" y=\"66\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#6264A7\" font-family=\"Segoe UI,Arial,sans-serif\">ASA</text>\n<text x=\"405\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Stream</text>\n<text x=\"405\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Analytics</text>\n<rect x=\"345\" y=\"115\" width=\"120\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#F97C00\" stroke-width=\"1.5\"/>\n<rect x=\"351\" y=\"120\" width=\"108\" height=\"24\" rx=\"4\" fill=\"#F97C00\" fill-opacity=\"0.18\"/>\n<text x=\"405\" y=\"136\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#F97C00\" font-family=\"Segoe UI,Arial,sans-serif\">ADLS</text>\n<text x=\"405\" y=\"156\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Data Lake</text>\n<text x=\"405\" y=\"167\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Storage Gen2</text>\n<text x=\"295\" y=\"195\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Event Hubs Capture → ADLS へ自動バッチ保存</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>ADLS Gen2（Azure Data Lake Storage Gen2）</strong>は Event Hubs Capture の\n<em>公式サポート対象ターゲット</em>であり、<strong>階層型名前空間（HNS）</strong>によって\n<code>2024/01/15/12/</code> のような深い日付ディレクトリ構造を真のフォルダとして管理できます。\nDatabricks / Synapse / HDInsight とのネイティブ連携も強みで、分析用途に最適です。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>標準 Blob Storage：</strong>Event Hubs Capture のターゲットとして<em>使用可能</em>ですが、HNS がないため\nディレクトリは仮想パス文字列にすぎず、大量フォルダのリネーム・削除が全ファイルコピーになり非常に遅い。<br>\n<strong>Azure Files：</strong>SMB / NFS 共有。Event Hubs Capture のターゲットとして<em>サポートされていません</em>。<br>\n<strong>NetApp Files：</strong>エンタープライズ NAS。ストリーミングデータの自動格納パスではありません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">Event Hubs Capture のターゲットは「Blob Storage」または「ADLS Gen2」の2択のみ</span><span class=\"fs\">→ Azure Files / NetApp Files は即除外</span><span class=\"fs\">「日付・時刻ベースの階層ディレクトリ」が要件</span><span class=\"fs\">→ HNS 必須 → ADLS Gen2 ✅（標準 Blob は擬似ディレクトリで遅い）</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>比較項目</th><th>Blob Storage（標準）</th><th>ADLS Gen2</th></tr></thead><tbody><tr><td>名前空間</td><td>フラット（仮想パス）</td><td>階層型（HNS）✅</td></tr><tr><td>ディレクトリ操作速度</td><td>遅い（全ファイルコピー）</td><td>高速（メタデータ操作）✅</td></tr><tr><td>POSIX 準拠 ACL</td><td>×</td><td>○ ✅</td></tr><tr><td>Hadoop/HDFS 互換 API</td><td>×</td><td>○（WebHDFS）✅</td></tr><tr><td>Event Hubs Capture 対応</td><td>○</td><td>○ ✅</td></tr><tr><td>Databricks / Synapse 連携</td><td>○</td><td>○（最適化済み）✅</td></tr></tbody></table><div class=\"wbox\">HNS はアカウント作成時にしか有効化できない。後から通常 Blob → ADLS Gen2 への変換は不可（2025年現在）。新規アカウントで作成するのが原則。</div></div></div>"},{"num":3,"id":"q3","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"レポーティングワークロード向けデータウェアハウスを設計しています。データウェアハウスは約50TBのリレーショナルデータを格納し、200〜300の同時読み取り操作に対応する必要があります。\n\nデータウェアハウス用のデータストアとして推奨するサービスはどれですか？","choices":[{"text":"Azure SQL Database Hyperscale","is_correct":true},{"text":"Azure Cosmos DB Cassandra API","is_correct":false},{"text":"Azure Cosmos DB SQL API","is_correct":false},{"text":"Azure Synapse Analytics dedicated SQL pools","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 165\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"160\" height=\"110\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#999\" stroke-width=\"1\"/><text x=\"100\" y=\"90\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#999\">要件</text><text x=\"100\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・50 TB リレーショナルDB</text><text x=\"100\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・200〜300 同時読み取り</text><text x=\"100\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・コスト最小化</text><text x=\"100\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・最小管理オーバーヘッド</text><rect x=\"248\" y=\"20\" width=\"205\" height=\"135\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"350\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">SQL Hyperscale</text><text x=\"350\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">最大 100TB スケール</text><text x=\"350\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">読み取りスケールアウト</text><rect x=\"260\" y=\"62\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"350\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">コンピュート/ストレージ独立スケール</text><rect x=\"260\" y=\"87\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"350\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">読み取りレプリカ最大4台</text><rect x=\"260\" y=\"112\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"350\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">PaaS：管理作業最小 ✅</text><rect x=\"260\" y=\"137\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"350\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">50TB  同時300 ✅</text><rect x=\"525\" y=\"35\" width=\"155\" height=\"55\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"602\" y=\"48\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">SQL DB 汎用</text><text x=\"602\" y=\"62\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">最大 4TB</text><text x=\"602\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">50TB 不可</text><rect x=\"525\" y=\"103\" width=\"155\" height=\"55\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"602\" y=\"116\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">SQL MI</text><text x=\"602\" y=\"130\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">最大 8TB</text><text x=\"602\" y=\"143\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">50TB 不可</text><text x=\"350\" y=\"161\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Hyperscale: コンピュートとストレージが分離。読み取りレプリカで200-300同時接続をさばける</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Azure SQL Database Hyperscale</strong>は Azure SQL の中で<em>唯一</em>最大 <strong>100TB</strong> まで\nストレージを自動拡張できる層です。コンピューティングとストレージが分離されており、\n<strong>最大4台の読み取りレプリカ</strong>を追加して 200〜300 の同時読み取りを分散処理できます。\nPaaS なので管理オーバーヘッドも最小です。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Cosmos DB Cassandra / SQL API：</strong>グローバル分散 NoSQL。リレーショナルスキーマのデータウェアハウス用途には設計されておらず、\n複雑な JOIN や集計クエリがフルスキャンになりやすい。<br>\n<strong>Synapse dedicated SQL pool：</strong>MPP アーキテクチャで大規模分析向けですが、<em>OLTP リレーショナルデータの格納・更新</em>には向いていません。\nストレージも DWU に比例した固定コスト構造です。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">50TB 超のリレーショナルDB → Azure SQL 各層の上限を確認</span><span class=\"fs\">General Purpose / Business Critical → 最大 4TB → ✗</span><span class=\"fs\">Hyperscale → 最大 100TB → ✅</span><span class=\"fs\">同時読み取り 200〜300 → 読み取りレプリカ（最大4台）で分散 → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><strong>Azure SQL Database 層の比較</strong><table class=\"etbl\"><thead><tr><th>層</th><th>最大ストレージ</th><th>読み取りスケールアウト</th><th>Serverless</th><th>特徴</th></tr></thead><tbody><tr><td>General Purpose</td><td>4 TB</td><td>×</td><td>○</td><td>汎用・低コスト</td></tr><tr><td>Business Critical</td><td>4 TB</td><td>1台（無料）</td><td>×</td><td>低レイテンシ・インメモリOLTP</td></tr><tr><td>Hyperscale ✅</td><td>100 TB</td><td>最大4台</td><td>×（2025現在）</td><td>コンピュート/ストレージ分離</td></tr><tr><td>Serverless（GP内）</td><td>4 TB</td><td>×</td><td>○</td><td>断続的ワークロード・自動一時停止</td></tr></tbody></table><div class=\"wbox\">Hyperscale は一度設定すると他の層に戻せない（2025年現在）。不可逆性が試験で問われることがある。</div></div></div>"},{"num":4,"id":"q4","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"Microsoft Volume Licensing 顧客 Contoso は License Mobility（Software Assurance 経由）を利用しています。50のデータベースをデプロイし、自動スケーリングをサポートし、SQL Server ライセンスコストを最小化する必要があります。\n\n推奨すべき購入モデルはどれですか？","choices":[{"text":"vCore","is_correct":true},{"text":"DTU","is_correct":false},{"text":"Azure reserved virtual machine instances","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">Azure SQL Database 購入モデル比較</text><rect x=\"20\" y=\"32\" width=\"310\" height=\"110\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"175\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">vCore モデル</text><text x=\"175\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Azure Hybrid Benefit 対応</text><text x=\"175\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">License Mobility 利用可能</text><rect x=\"32\" y=\"72\" width=\"286\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"175\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">AHB: SA付SQL Serverライセンス持込み</text><rect x=\"32\" y=\"97\" width=\"286\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"175\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Serverless / Provisioned 自動スケール</text><rect x=\"32\" y=\"122\" width=\"286\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"175\" y=\"135\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Elastic Pool + vCore も組み合わせ可</text><rect x=\"350\" y=\"32\" width=\"330\" height=\"110\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"515\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">DTU モデル</text><text x=\"515\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">AHB 非対応</text><text x=\"515\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ライセンス持込み不可</text><rect x=\"362\" y=\"72\" width=\"306\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"515\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">固定バンドル（CPU+メモリ+IO）</text><rect x=\"362\" y=\"97\" width=\"306\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"515\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">既存ライセンスの活用不可</text><rect x=\"362\" y=\"122\" width=\"306\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"515\" y=\"135\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Serverless 非対応</text><text x=\"350\" y=\"151\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">License Mobility（AHB）要件 → vCore 一択。DTUはブラックボックスバンドルでAHB❌</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>vCore モデル</strong>は Azure SQL Database で<em>唯一</em> <strong>Azure Hybrid Benefit（AHB）</strong>をサポートします。\nSoftware Assurance 付き SQL Server ライセンスを持ち込むことで最大 <strong>55% のコスト削減</strong>が可能です。\nLicense Mobility という言葉が出たら vCore 一択と覚えてください。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>DTU モデル：</strong>CPU・メモリ・IO を固定バンドルで提供する旧来モデル。AHB には<em>一切対応していません</em>。\n既存ライセンスの活用が要件なら即除外。<br>\n<strong>Azure Reserved VM Instances：</strong>IaaS（VM）向けの 1年/3年 コミット割引モデル。PaaS の SQL Database には直接適用しない（SQL DB 自体に予約購入の仕組みは別）。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">「Software Assurance / License Mobility / AHB」キーワードがある</span><span class=\"fs\">→ DTU モデルは即除外</span><span class=\"fs\">→ vCore モデル一択 ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>観点</th><th>vCore モデル</th><th>DTU モデル</th></tr></thead><tbody><tr><td>Azure Hybrid Benefit（AHB）</td><td>対応</td><td>非対応</td></tr><tr><td>Serverless（自動一時停止）</td><td>✅（GP のみ）</td><td>×</td></tr><tr><td>スケールの透明性</td><td>CPU / メモリを個別指定</td><td>バンドル（不透明）</td></tr><tr><td>Elastic Pool 対応</td><td>✅</td><td>✅</td></tr><tr><td>推奨シナリオ</td><td>新規・AHB 活用</td><td>DTU 移行以外は非推奨</td></tr></tbody></table><div class=\"wbox\">試験で「コスト最適化＋既存ライセンス」が出たら vCore 以外に正解はない。\"License Mobility\" = vCore という紐付けを反射的に思い出せるようにする。</div></div></div>"},{"num":5,"id":"q5","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"問題4と同じシナリオ。Volume Licensing・License Mobility・50データベース・自動スケーリング・SQL Server ライセンスコスト最小化。\n\n推奨すべきデプロイオプションはどれですか？","choices":[{"text":"Azure SQL Database elastic pool","is_correct":true},{"text":"Azure SQL Managed Instance","is_correct":false},{"text":"SQL Server Always On availability group","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"155\" height=\"110\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#999\" stroke-width=\"1\"/><text x=\"97\" y=\"90\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#999\">要件</text><text x=\"97\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・50 個のデータベース</text><text x=\"97\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・vCore 購入モデル</text><text x=\"97\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・コスト効率最大化</text><text x=\"97\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・自動スケーリング</text><rect x=\"245\" y=\"20\" width=\"220\" height=\"135\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"355\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Elastic Pool</text><text x=\"355\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">50DB でリソース共有</text><text x=\"355\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">使用ピーク分散で節約</text><rect x=\"257\" y=\"62\" width=\"196\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">共有プールからDB毎に動的割り当て</text><rect x=\"257\" y=\"87\" width=\"196\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">vCore + AHB 完全対応 ✅</text><rect x=\"257\" y=\"112\" width=\"196\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ピークが重ならなければ大幅コスト削減</text><rect x=\"257\" y=\"137\" width=\"196\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">最大500DBまで同一プール収容</text><rect x=\"540\" y=\"35\" width=\"140\" height=\"55\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"610\" y=\"48\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">個別 DB×50</text><text x=\"610\" y=\"62\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">リソースを各DB</text><text x=\"610\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">に個別予約→割高</text><rect x=\"540\" y=\"105\" width=\"140\" height=\"55\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"610\" y=\"118\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">SQL MI</text><text x=\"610\" y=\"132\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">50DBでの共有</text><text x=\"610\" y=\"145\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">プール非対応</text><text x=\"350\" y=\"156\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Elastic Pool: 50DBが共有プールから必要な時だけリソースを使う→コスト最適</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Elastic Pool</strong>は複数の DB が同一プールの CPU・メモリ・ストレージを<strong>共有</strong>します。\n50個の DB のピーク時間帯が分散していれば、個別にリソースを確保するよりも<strong>大幅にコストを削減</strong>できます。\nvCore モデルの Elastic Pool は AHB にも対応しています（q4 の文脈そのまま）。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>SQL Managed Instance：</strong>インスタンス単位での管理でリソース共有の概念がない。\n50 DB を個別インスタンス化するとコスト激増。<br>\n<strong>SQL Server Always On AG（VM 上）：</strong>高可用性ソリューション。コスト最適化のためのリソース共有機能ではない。\nIaaS のため OS パッチ等の管理オーバーヘッドも発生する。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">DB数が多い（10個〜）かつピーク時間帯がバラバラ</span><span class=\"fs\">→ リソース共有で節約 → Elastic Pool ✅</span><span class=\"fs\">全 DB が同時にピーク</span><span class=\"fs\">→ プール効果が薄い → 個別 DB か SQL MI を検討</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>構成</th><th>適用シナリオ</th><th>AHB 対応</th><th>コスト効率</th></tr></thead><tbody><tr><td>個別 DB</td><td>少数 DB・均一要件</td><td>○（vCore のみ）</td><td>並</td></tr><tr><td>Elastic Pool ✅</td><td>多数 DB・ピーク分散</td><td>○（vCore のみ）</td><td>高（最大3倍効率）</td></tr><tr><td>SQL MI</td><td>SQL Server 高互換・管理統合</td><td>○</td><td>並〜低（単一インスタンス）</td></tr><tr><td>SQL Server on VM</td><td>完全制御・非対応機能利用</td><td>○</td><td>低（管理コスト込み）</td></tr></tbody></table><div class=\"wbox\">Elastic Pool は「同時ピーク」では節約にならない。問題文に「50 データベース・ピークが分散」があれば Elastic Pool。</div></div></div>"},{"num":6,"id":"q6","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"Microsoft Entra テナントを管理しており、Azure Cosmos DB（SQL API）をデプロイ予定です。特定の Microsoft Entra ID ユーザーアカウントに対して Cosmos DB への読み取り専用アクセスを付与する方法を推奨する必要があります。\n\n推奨に含めるべきものはどれですか？","choices":[{"text":"Azure IAM ロール割り当て + リソーストークン","is_correct":true},{"text":"Conditional Access + SAS","is_correct":false},{"text":"Azure Key Vault 証明書","is_correct":false},{"text":"マスターキー + Azure Information Protection","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"45\" width=\"125\" height=\"70\" rx=\"8\" fill=\"#FFF8E1\" stroke=\"#E67700\" stroke-width=\"2\"/><text x=\"82\" y=\"66\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#E67700\">特定ユーザー</text><text x=\"82\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">Cosmos DB</text><text x=\"82\" y=\"93\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">読み取り専用</text><rect x=\"215\" y=\"25\" width=\"210\" height=\"120\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"320\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">IAM + リソーストークン</text><text x=\"320\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Entra ID 認証</text><text x=\"320\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">最小権限</text><rect x=\"227\" y=\"68\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"320\" y=\"81\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">IAM: Cosmos DB Reader ロール割り当て</text><rect x=\"227\" y=\"93\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"320\" y=\"106\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">リソーストークン: 期限付きアクセス</text><rect x=\"227\" y=\"118\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"320\" y=\"131\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">特定コンテナのみ読み取り許可</text><rect x=\"500\" y=\"45\" width=\"175\" height=\"70\" rx=\"8\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"2\"/><text x=\"587\" y=\"66\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#0072C6\">Cosmos DB</text><text x=\"587\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">コンテナ</text><text x=\"587\" y=\"93\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">読み取りアクセス</text><rect x=\"500\" y=\"128\" width=\"175\" height=\"30\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1\"/><text x=\"587\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">マスターキー</text><text x=\"587\" y=\"149\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">全権限 → 過剰</text><line x1=\"145\" y1=\"80\" x2=\"213\" y2=\"90\" stroke=\"#E67700\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"425\" y1=\"90\" x2=\"498\" y2=\"80\" stroke=\"#107C10\" stroke-width=\"2\" marker-end=\"url(#ag)\"/><text x=\"350\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">マスターキー=全権限付与。特定ユーザーへの読み取り専用→RBAC+リソーストークンが原則</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Azure IAM ロール割り当て＋リソーストークン</strong>が正解です。\nCosmos DB は Microsoft Entra ID ベースの<strong>データプレーン RBAC</strong>（組み込みロール：Cosmos DB 組み込みデータ閲覧者 など）をサポートしており、\n特定ユーザーへの<em>最小権限</em>付与が可能です。\nリソーストークンは特定コンテナ・特定操作に限定したスコープ付きアクセスを提供します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Conditional Access + SAS：</strong>Conditional Access は Entra のアクセスポリシー（MFA・デバイス要件）。\nSAS はストレージサービス向けの署名付き URL であり、Cosmos DB のデータプレーン制御には使えません。<br>\n<strong>Key Vault 証明書：</strong>証明書の保管管理サービス。DB アクセス制御とは直接無関係。<br>\n<strong>マスターキー＋AIP：</strong>マスターキーはアカウント全権限を持つ。特定ユーザーへの読み取り専用制御には使えず、\n最小権限原則に著しく違反するアンチパターン。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">「特定ユーザーに最小権限でアクセス付与」</span><span class=\"fs\">マスターキーを共有 → 全権限付与 → 最小権限違反 → ✗</span><span class=\"fs\">Entra ID RBAC → ユーザー / ロール単位で細粒度制御 → ✅</span><span class=\"fs\">一時的・スコープ限定 → リソーストークン → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>方法</th><th>粒度</th><th>セキュリティ</th><th>推奨シナリオ</th></tr></thead><tbody><tr><td>マスターキー</td><td>アカウント全体</td><td>低（全権限）</td><td>開発・テストのみ</td></tr><tr><td>IAM RBAC ✅</td><td>ロール単位</td><td>高</td><td>本番環境・最小権限</td></tr><tr><td>リソーストークン ✅</td><td>コンテナ / 操作単位</td><td>高</td><td>特定操作の一時許可</td></tr><tr><td>SAS（Blob 向け）</td><td>URL 単位</td><td>中</td><td>Cosmos DB には非対応</td></tr></tbody></table><div class=\"wbox\">「最小権限の原則」「特定ユーザー」が問題文に出たらマスターキーを即排除。マスターキーは絶対に共有しないがセキュリティ大原則。</div></div></div>"},{"num":7,"id":"q7","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"Azure Functions ベースのマイクロサービス App1 を Azure Kubernetes Service (AKS) に移行します。既存の Consumption プランと同じスケーリング動作（Queue Storage トリガー）を維持し、kubenet と CNI ネットワークをサポートする必要があります。\n\n実行すべき2つの操作はどれですか？（2つ選択）","choices":[{"text":"HPA（Horizontal Pod Autoscaler）を設定する","is_correct":true},{"text":"KEDA をインストールする","is_correct":true},{"text":"仮想ノードアドオンを有効化する","is_correct":false},{"text":"Virtual Kubelet をインストールする","is_correct":false},{"text":"AKS クラスターレベルのオートスケーリングを有効化する（あなたの回答の一部）","is_correct":false}],"correct_indices":[0,1],"n_correct":2,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 170\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"10\" fill=\"#003F73\" font-weight=\"700\">AKS上でFunctions Consumption相当のスケーリングを実現する2コンポーネント</text><rect x=\"20\" y=\"35\" width=\"140\" height=\"120\" rx=\"8\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"2\"/><text x=\"90\" y=\"81\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#0072C6\">Azure Queue Storage</text><text x=\"90\" y=\"95\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">メッセージ蓄積</text><text x=\"90\" y=\"108\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">スケールトリガー源</text><rect x=\"230\" y=\"25\" width=\"195\" height=\"140\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"327\" y=\"81\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">KEDA (B)</text><text x=\"327\" y=\"95\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">イベント駆動スケーラー</text><text x=\"327\" y=\"108\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Queue長を監視</text><rect x=\"242\" y=\"68\" width=\"171\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"327\" y=\"81\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Queue メッセージ数を計測</text><rect x=\"242\" y=\"93\" width=\"171\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"327\" y=\"106\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">0→N のスケールアウト</text><rect x=\"242\" y=\"118\" width=\"171\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"327\" y=\"131\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">HPA にカスタムメトリクス提供</text><rect x=\"242\" y=\"143\" width=\"171\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"327\" y=\"156\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">kubenet / CNI 両対応 ✅</text><rect x=\"500\" y=\"25\" width=\"180\" height=\"90\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"590\" y=\"56\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">HPA (A)</text><text x=\"590\" y=\"70\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Pod レプリカ数制御</text><text x=\"590\" y=\"83\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">外部メトリクス対応</text><rect x=\"512\" y=\"68\" width=\"156\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"81\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">KEDA提供メトリクスを受け取る</text><rect x=\"512\" y=\"93\" width=\"156\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"106\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Pod 数を自動増減</text><rect x=\"500\" y=\"128\" width=\"180\" height=\"42\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"590\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">仮想ノード/VKubelet</text><text x=\"590\" y=\"149\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ACI バースト用</text><text x=\"590\" y=\"162\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Queue スケール❌</text><line x1=\"160\" y1=\"95\" x2=\"228\" y2=\"95\" stroke=\"#0072C6\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"425\" y1=\"80\" x2=\"498\" y2=\"65\" stroke=\"#107C10\" stroke-width=\"2\" marker-end=\"url(#ag)\"/><text x=\"350\" y=\"166\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">KEDA=イベントソース→スケール判断 / HPA=実際のPod数制御。2つ組み合わせてConsumptionと同等</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>【2択問題】HPA と KEDA の両方が必要です。</strong><br>\n<strong>A. HPA（Horizontal Pod Autoscaler）：</strong>Kubernetes 標準コンポーネント。\nCPU・メモリ・<em>外部カスタムメトリクス</em>に基づいて Pod のレプリカ数を増減します。\nKEDA が提供するキューメトリクスを受け取って実際の Pod 数制御を担当します。<br>\n<strong>B. KEDA（Kubernetes-based Event Driven Autoscaling）：</strong>\nAzure Queue Storage のキュー長など 50 以上のイベントソースを監視し、\n<strong>0 → N のスケールアウト</strong>（ゼロスケール）と HPA へのカスタムメトリクス提供を担います。\nこの2つが連携して初めて「Azure Functions Consumption プラン相当」のイベント駆動スケールが実現します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>仮想ノード（Virtual Nodes）：</strong>ACI へのバーストで高速起動は可能ですが、\nキュー長に応じた自動スケールロジックは持ちません。<br>\n<strong>Virtual Kubelet：</strong>仮想ノードの旧実装方式。現在は<em>非推奨（Deprecated）</em>。<br>\n<strong>クラスターオートスケーラー：</strong>VM ノード数自体を増減するもの（分単位）。Pod 単位のゼロスケールには対応しない。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">「Consumption プラン相当 = イベント駆動 + ゼロスケール」を分解する</span><span class=\"fs\">Kubernetes 単体 → Queue 長でのゼロスケール不可</span><span class=\"fs\">KEDA = イベントソース監視 → カスタムメトリクスを HPA に提供</span><span class=\"fs\">HPA = メトリクス受信 → Pod 数を制御</span><span class=\"fs\">→ 2つセットで「Consumption 相当」が完成</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>コンポーネント</th><th>役割</th><th>ゼロスケール（0→N）</th><th>イベントソース対応</th><th>備考</th></tr></thead><tbody><tr><td>HPA（標準）</td><td>Pod 数制御</td><td>△（0 は非対応）</td><td>×（CPU/メモリのみ）</td><td>Kubernetes 標準</td></tr><tr><td>KEDA ✅</td><td>イベントメトリクス変換</td><td>○（0→N）</td><td>○（Queue/EH/SB 等 50+）</td><td>アドオン</td></tr><tr><td>HPA + KEDA ✅</td><td>完全イベント駆動スケール</td><td>○</td><td>○</td><td>この組み合わせが正解</td></tr><tr><td>クラスターオートスケーラー</td><td>VM ノード数制御</td><td>×</td><td>×</td><td>分単位・ノード粒度</td></tr><tr><td>仮想ノード（ACI）</td><td>ACI バースト</td><td>○</td><td>×</td><td>秒単位だがイベント連動なし</td></tr></tbody></table><div class=\"wbox\">KEDA と HPA はどちらか1つではなく両方が必要。「KEDA だけで動く」は誤り。HPA なしでは Pod 数が変化しない。「ゼロスケール可能」= KEDA の最大の特徴として覚える。</div></div></div>"},{"num":8,"id":"q8","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"Azure Functions を使用して Azure Event Hubs からのイベントを処理するアプリケーションを構築します。各リクエストの実行時間は 5〜20分を予想しています。予想される実行時間に対応でき、イベント駆動自動スケーリングが必要です。\n\n推奨するホスティングプランはどれですか？","choices":[{"text":"Premium ホスティングプラン","is_correct":true},{"text":"Dedicated（App Service）ホスティングプラン","is_correct":false},{"text":"Consumption ホスティングプラン","is_correct":false},{"text":"App Service ホスティングプラン","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">Azure Functions ホスティングプラン 実行時間上限比較</text><rect x=\"20\" y=\"34\" width=\"175\" height=\"26\" rx=\"6\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"1.5\"/><text x=\"107\" y=\"51\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Premium: 最大 60 分</text><rect x=\"203\" y=\"34\" width=\"175\" height=\"26\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1.5\"/><text x=\"290\" y=\"51\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Consumption: 最大 10 分</text><rect x=\"386\" y=\"34\" width=\"175\" height=\"26\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1.5\"/><text x=\"473\" y=\"51\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Dedicated(ASP): 制限なし*</text><rect x=\"569\" y=\"34\" width=\"120\" height=\"26\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1.5\"/><text x=\"629\" y=\"51\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Flex: プレビュー</text><rect x=\"20\" y=\"72\" width=\"660\" height=\"75\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"1\"/><text x=\"350\" y=\"109\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Premium プランが選ばれる理由</text><rect x=\"32\" y=\"108\" width=\"150\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"107\" y=\"121\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">最大60分実行 ✅</text><rect x=\"190\" y=\"108\" width=\"150\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"265\" y=\"121\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">VNet 統合 ✅</text><rect x=\"348\" y=\"108\" width=\"160\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"428\" y=\"121\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">コールドスタートなし ✅</text><rect x=\"516\" y=\"108\" width=\"154\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"593\" y=\"121\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Event Hubsスケール ✅</text><text x=\"350\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">5〜20分の実行 → Consumption(10分上限)は不可。VNet+長時間+イベントスケール = Premium</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Premium ホスティングプラン</strong>は最大 <strong>60分</strong>の実行タイムアウトをサポートし（5〜20分の要件を満たす）、\n<strong>常時ウォームインスタンス</strong>でコールドスタートを排除します。\nVNet 統合・無制限スケール・Event Hubs トリガーでの自動スケールも提供します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Consumption（従量課金）：</strong>タイムアウトは<em>デフォルト5分・最大10分</em>。20分の要件を満たせません。\nコールドスタートも発生します。<br>\n<strong>Dedicated（App Service）：</strong>タイムアウト無制限（-1）ですが、<em>常時起動の VM コストが固定発生</em>します。\n柔軟なスケールアウトも弱く「最低コスト」要件に反します。<br>\n<strong>App Service（Basicなど）：</strong>Dedicated と同義。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">実行時間が 10分超 → Consumption は除外（最大 10分）</span><span class=\"fs\">コールドスタート許容不可 → Consumption は除外</span><span class=\"fs\">コスト最小・柔軟スケール → Dedicated（常時起動コスト）は除外</span><span class=\"fs\">→ 残るのは Premium ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>プラン</th><th>タイムアウト上限</th><th>コールドスタート</th><th>VNet 統合</th><th>コスト形態</th></tr></thead><tbody><tr><td>Consumption</td><td>最大 10分</td><td>あり</td><td>△（プレビュー）</td><td>従量（最安）</td></tr><tr><td>Premium ✅</td><td>最大 60分</td><td>なし（ウォームあり）</td><td>○</td><td>インスタンス課金</td></tr><tr><td>Dedicated / ASP</td><td>無制限（-1 設定可）</td><td>なし</td><td>○</td><td>VM 常時起動コスト</td></tr><tr><td>Flex Consumption（新）</td><td>最大 60分</td><td>最小化</td><td>○</td><td>従量（新世代）</td></tr></tbody></table><div class=\"wbox\">「Consumption の最大タイムアウトは 10分」は頻出の数値。5分超の実行が必要なら Premium 一択。Dedicated は「無制限だが高コスト」として覚える。</div></div></div>"},{"num":9,"id":"q9","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"SQL Server を Azure Virtual Machines にデプロイします。最大 15,000 ディスク IOPS、SR-IOV（Single Root I/O Virtualization）のサポート、全体コストの最小化が要件です。\n\n仮想マシンのシリーズとして選択すべきオプションはどれですか？","choices":[{"text":"DS シリーズ","is_correct":true},{"text":"NC シリーズ","is_correct":false},{"text":"NV シリーズ","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">SQL Server VM: 15,000 IOPS + SR-IOV + コスト最小化</text><rect x=\"20\" y=\"32\" width=\"315\" height=\"115\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"177\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">DS シリーズ VM (Q9)</text><text x=\"177\" y=\"89\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">ディスク集約型最適化</text><text x=\"177\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Premium SSD + SR-IOV 対応</text><rect x=\"32\" y=\"72\" width=\"291\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"177\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Premium SSD 必須対応 ✅</text><rect x=\"32\" y=\"97\" width=\"291\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"177\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">SR-IOV / Accelerated Networking ✅</text><rect x=\"32\" y=\"122\" width=\"291\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"177\" y=\"135\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">15,000 IOPS 達成コスト最小 ✅</text><rect x=\"365\" y=\"32\" width=\"315\" height=\"115\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"522\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Premium SSD (Q10)</text><text x=\"522\" y=\"89\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">P30以上で15,000 IOPS対応</text><text x=\"522\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">コスト効率 ✅</text><rect x=\"377\" y=\"72\" width=\"291\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"522\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">最大20,000 IOPS/ディスク</text><rect x=\"377\" y=\"97\" width=\"291\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"522\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">低遅延・高スループット</text><rect x=\"377\" y=\"122\" width=\"291\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"522\" y=\"135\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Ultra Diskより大幅に安価</text><rect x=\"20\" y=\"152\" width=\"310\" height=\"14\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1.5\"/><text x=\"175\" y=\"163\" text-anchor=\"middle\" font-size=\"8\" fill=\"#C50F1F\">Standard SSD/HDD: IOPSが不足　Ultra Disk: 過剰スペック・高コスト</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>DS シリーズ</strong>はディスク集約型ワークロード向けに最適化された VM 群で、\n<strong>Premium SSD 対応</strong>（名前に \"s\" が付くシリーズ）と <strong>SR-IOV（Accelerated Networking）</strong>を標準サポートします。\nSQL Server 本番環境の代表的な VM シリーズです。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>NC シリーズ：</strong>NVIDIA GPU 搭載の AI/ML・レンダリング向け VM。SQL Server の高 IOPS 要件向けではありません。<br>\n<strong>NV シリーズ：</strong>GPU 搭載のリモート可視化・VDI 向け。同様に SQL Server には不適。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">GPU が必要か？ NO → NC / NV は即除外</span><span class=\"fs\">Premium SSD 対応が必要 → シリーズ名に \"s\" が付くか確認</span><span class=\"fs\">DS, Es, GS, Ms など → SQL Server の汎用選択は DS ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>シリーズ例</th><th>カテゴリ</th><th>Premium SSD</th><th>SR-IOV</th><th>主な用途</th></tr></thead><tbody><tr><td>DS / Dsv3 / Dsv5 ✅</td><td>汎用（ストレージ最適化）</td><td>○</td><td>○</td><td>SQL Server・汎用</td></tr><tr><td>Es / Esv5</td><td>メモリ最適化</td><td>○</td><td>○</td><td>大規模インメモリ DB</td></tr><tr><td>NC / NCv3</td><td>GPU（NVIDIA）計算</td><td>×</td><td>×</td><td>AI / ML</td></tr><tr><td>NV</td><td>GPU 可視化</td><td>×</td><td>×</td><td>VDI・リモートデスクトップ</td></tr><tr><td>F / Fs</td><td>コンピュート最適化</td><td>×（F） / ○（Fs）</td><td>△</td><td>CPU 集約型処理</td></tr></tbody></table><br><strong>命名規則：</strong>名前に <code>s</code> がつく = Premium SSD 対応（例: Ds, Es, Gs）。<code>v5</code> = 最新世代。SR-IOV = Accelerated Networking とも呼ばれ NIC を仮想化なしで直接使用する技術。<div class=\"wbox\">NC / NV は GPU シリーズ。SQL Server の問題でこれらが出たら即除外。「ストレージ IOPS が高い VM」≠「GPU VM」を区別する。</div></div></div>"},{"num":10,"id":"q10","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"問題9と同じシナリオ。SQL Server VM、15,000 IOPS、SR-IOV、コスト最小化。\n\nディスクタイプとして選択すべきオプションはどれですか？","choices":[{"text":"Premium SSD","is_correct":true},{"text":"Standard SSD","is_correct":false},{"text":"Ultra Disk","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">SQL Server VM: 15,000 IOPS + SR-IOV + コスト最小化</text><rect x=\"20\" y=\"32\" width=\"315\" height=\"115\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"177\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">DS シリーズ VM (Q9)</text><text x=\"177\" y=\"89\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">ディスク集約型最適化</text><text x=\"177\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Premium SSD + SR-IOV 対応</text><rect x=\"32\" y=\"72\" width=\"291\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"177\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Premium SSD 必須対応 ✅</text><rect x=\"32\" y=\"97\" width=\"291\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"177\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">SR-IOV / Accelerated Networking ✅</text><rect x=\"32\" y=\"122\" width=\"291\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"177\" y=\"135\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">15,000 IOPS 達成コスト最小 ✅</text><rect x=\"365\" y=\"32\" width=\"315\" height=\"115\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"522\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Premium SSD (Q10)</text><text x=\"522\" y=\"89\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">P30以上で15,000 IOPS対応</text><text x=\"522\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">コスト効率 ✅</text><rect x=\"377\" y=\"72\" width=\"291\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"522\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">最大20,000 IOPS/ディスク</text><rect x=\"377\" y=\"97\" width=\"291\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"522\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">低遅延・高スループット</text><rect x=\"377\" y=\"122\" width=\"291\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"522\" y=\"135\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Ultra Diskより大幅に安価</text><rect x=\"20\" y=\"152\" width=\"310\" height=\"14\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1.5\"/><text x=\"175\" y=\"163\" text-anchor=\"middle\" font-size=\"8\" fill=\"#C50F1F\">Standard SSD/HDD: IOPSが不足　Ultra Disk: 過剰スペック・高コスト</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Premium SSD</strong>はディスクサイズに応じて最大 <strong>20,000 IOPS</strong>（P80 = 20,000 IOPS）を提供し、\n15,000 IOPS の要件を満たします。Ultra Disk と比較してコストが大幅に安く、「コスト最小化」要件にも合致します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Standard SSD：</strong>最大 6,000 IOPS 程度で 15,000 IOPS には届きません。<br>\n<strong>Ultra Disk：</strong>最大 160,000 IOPS を提供しますが、15,000 IOPS に対して<em>過剰スペックで高コスト</em>。\nデプロイ時に VM の停止が必要な制約もあります。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">15,000 IOPS が要件</span><span class=\"fs\">Standard HDD（最大500）→ 不足 → ✗</span><span class=\"fs\">Standard SSD（最大 6,000）→ 不足 → ✗</span><span class=\"fs\">Premium SSD（最大 20,000）→ 要件充足・コスト中 → ✅</span><span class=\"fs\">Ultra Disk（最大 160,000）→ 過剰スペック・高コスト → ✗</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>ディスク種別</th><th>IOPS（最大）</th><th>レイテンシ目安</th><th>コスト</th><th>用途</th></tr></thead><tbody><tr><td>Standard HDD</td><td>500</td><td>〜20ms</td><td>最安</td><td>バックアップ・低頻度アクセス</td></tr><tr><td>Standard SSD</td><td>6,000</td><td>〜10ms</td><td>低</td><td>開発・Web サーバー</td></tr><tr><td>Premium SSD ✅</td><td>20,000</td><td>〜1ms</td><td>中</td><td>本番 SQL Server・IOPS 集約型</td></tr><tr><td>Ultra Disk</td><td>160,000</td><td><0.5ms</td><td>高（大幅）</td><td>超低レイテンシ・超高 IOPS 専用</td></tr></tbody></table><div class=\"wbox\">Ultra Disk は「コスト最小化」要件と必ず衝突する。15,000〜20,000 IOPS 程度は Premium SSD で十分。Ultra が正解になるのは「数万 IOPS かつ最低レイテンシ」という限定的なケース。</div></div></div>"},{"num":11,"id":"q11","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"2つのコンポーネントがキューを通じてメッセージを交換するアーキテクチャを設計しています。メッセージを受信した順（FIFO）に処理することを保証するソリューションを推奨する必要があります。\n\n推奨に含めるべきものはどれですか？","choices":[{"text":"セッションを有効にした Azure Service Bus キュー","is_correct":true},{"text":"カスタムメタデータ設定の Azure Storage キュー","is_correct":false},{"text":"パーティショニングを有効にした Azure Service Bus キュー","is_correct":false},{"text":"保存アクセスポリシー設定の Azure Storage キュー","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">Service Bus FIFO メッセージング（Q11）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"156\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"162\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"200\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">APP</text>\n<text x=\"200\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">送信</text>\n<text x=\"200\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">コンポーネント</text>\n<rect x=\"276\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#9575CD\" stroke-width=\"1.5\"/>\n<rect x=\"282\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#9575CD\" fill-opacity=\"0.18\"/>\n<text x=\"320\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#9575CD\" font-family=\"Segoe UI,Arial,sans-serif\">SB</text>\n<text x=\"320\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Service Bus</text>\n<text x=\"320\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Queue (FIFO)</text>\n<rect x=\"396\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"402\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"440\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">APP</text>\n<text x=\"440\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">受信</text>\n<text x=\"440\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">コンポーネント</text>\n<line x1=\"244\" y1=\"75\" x2=\"270\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"260\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">送信</text>\n<line x1=\"364\" y1=\"75\" x2=\"390\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"380\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">順序通り処理</text>\n</svg></div><svg viewBox=\"0 0 500 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:500px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"500\" height=\"200\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/></marker>\n</defs>\n<rect x=\"15\" y=\"65\" width=\"110\" height=\"65\" rx=\"7\" fill=\"#112240\" stroke=\"#107C41\" stroke-width=\"1.5\"/>\n<rect x=\"21\" y=\"70\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#107C41\" fill-opacity=\"0.18\"/>\n<text x=\"70\" y=\"86\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#107C41\" font-family=\"Segoe UI,Arial,sans-serif\">Sender</text>\n<text x=\"70\" y=\"106\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">送信者</text>\n<text x=\"70\" y=\"117\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">App Service</text>\n<line x1=\"125\" y1=\"97\" x2=\"165\" y2=\"97\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"145\" y=\"92\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Send</text>\n<rect x=\"170\" y=\"45\" width=\"150\" height=\"105\" rx=\"7\" fill=\"#112240\" stroke=\"#F97C00\" stroke-width=\"1.5\"/>\n<rect x=\"176\" y=\"50\" width=\"138\" height=\"24\" rx=\"4\" fill=\"#F97C00\" fill-opacity=\"0.18\"/>\n<text x=\"245\" y=\"66\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#F97C00\" font-family=\"Segoe UI,Arial,sans-serif\">SB</text>\n<text x=\"245\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Service Bus</text>\n<text x=\"245\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Queue (FIFO)</text>\n<text x=\"245\" y=\"160\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Sessions有効</text>\n<line x1=\"320\" y1=\"97\" x2=\"360\" y2=\"97\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"340\" y=\"92\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Receive</text>\n<rect x=\"365\" y=\"65\" width=\"110\" height=\"65\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"371\" y=\"70\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"420\" y=\"86\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">Receiver</text>\n<text x=\"420\" y=\"106\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">受信者</text>\n<text x=\"420\" y=\"117\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Functions</text>\n<text x=\"255\" y=\"185\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Sessions = 送信順序保証 (FIFO) / Dead-letter queue</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>セッションを有効にした Azure Service Bus キュー</strong>は、同じ <strong>SessionId</strong> を持つメッセージを\n1つのコンシューマーが<strong>排他的</strong>に到着順（FIFO）で処理することを保証します。\nAzure でストリクトな FIFO を保証できる<em>唯一の構成</em>です。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>カスタムメタデータ付き Storage Queue：</strong>「ベストエフォート FIFO」のみ。\n複数コンシューマーが並行取得するため順序は保証されません。メタデータは属性追加機能であり FIFO 制御とは無関係。<br>\n<strong>パーティショニング有効の Service Bus：</strong>スループット向上のための機能。\nパーティション間の順序は保証されません。<br>\n<strong>保存アクセスポリシー付き Storage Queue：</strong>アクセス制御ポリシーの設定機能。FIFO とは無関係。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">厳密な FIFO が要件</span><span class=\"fs\">Storage Queue → ベストエフォート FIFO → ✗（厳密保証が必要なら除外）</span><span class=\"fs\">Service Bus（セッションなし）→ 複数コンシューマーで順序崩れ → ✗</span><span class=\"fs\">Service Bus + Sessions → SessionId 単位で排他制御 → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>サービス</th><th>FIFO 保証</th><th>メッセージサイズ</th><th>トランザクション</th><th>推奨シナリオ</th></tr></thead><tbody><tr><td>Storage Queue</td><td>ベストエフォート</td><td>64 KB</td><td>×</td><td>シンプル・低コスト</td></tr><tr><td>Service Bus（標準）</td><td>△（単一コンシューマーなら）</td><td>256 KB〜1 MB</td><td>○</td><td>エンタープライズ統合</td></tr><tr><td>Service Bus + Sessions ✅</td><td>厳密 FIFO</td><td>256 KB〜1 MB</td><td>○</td><td>順序付き処理必須</td></tr><tr><td>Event Hubs</td><td>パーティション内のみ</td><td>最大 1 MB</td><td>×</td><td>ストリーム処理</td></tr></tbody></table><div class=\"wbox\">「FIFO 保証」と「ベストエフォート FIFO」の違いが問われる。Storage Queue の FIFO は保証ではなく「だいたい順番」。試験で「保証」という言葉が出たら Service Bus + Sessions 一択。</div></div></div>"},{"num":12,"id":"q12","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"VM1（Central US、フロントエンド）、VM2（East US、バックエンド）、VM3（West US 2、フロントエンド）が異なる VNet にあり、HTTPS ベースのアプリケーションをプライベート IP アドレスのみでアクセスします。VM2 が利用不可の場合は VM3 へ、VM3 が利用不可の場合は VM2 へ自動フェールオーバーする負荷分散ソリューションが必要です。\n\nソリューションに含めるべきものはどれですか？","choices":[{"text":"Azure Front Door Premium","is_correct":true},{"text":"Azure Firewall Premium","is_correct":false},{"text":"Azure Application Gateway v2","is_correct":false},{"text":"クロスリージョン ロードバランサー","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">マルチリージョン VM + Front Door（Q12）</div><svg viewBox=\"0 0 700 220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"700\" height=\"220\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"56\" y=\"79\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#107C10\" stroke-width=\"1.5\"/>\n<rect x=\"62\" y=\"84\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#107C10\" fill-opacity=\"0.18\"/>\n<text x=\"100\" y=\"103\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#107C10\" font-family=\"Segoe UI,Arial,sans-serif\">FD</text>\n<text x=\"100\" y=\"121\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Front Door</text>\n<text x=\"100\" y=\"132\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">HTTPS Global LB</text>\n<rect x=\"556\" y=\"-1\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"562\" y=\"4\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"600\" y=\"23\" text-anchor=\"middl  fill=\"#107C41\" font-family=\"Segoe UI,Arial,sans-serif\">VMSS1</text>\n<text x=\"232\" y=\"89\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">VM Scale Set</text>\n<text x=\"232\" y=\"100\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">East US</text>\n<rect x=\"140\" y=\"140\" width=\"190\" height=\"100\" rx=\"8\" fill=\"none\" stroke=\"#1e4080\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/>\n<text x=\"235\" y=\"154\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">West US</text>\n<rect x=\"155\" y=\"158\" width=\"155\" height=\"65\" rx=\"7\" fill=\"#112240\" stroke=\"#107C41\" stroke-width=\"1.5\"/>\n<rect x=\"161\" y=\"163\" width=\"143\" height=\"24\" rx=\"4\" fill=\"#107C41\" fill-opacity=\"0.18\"/>\n<text x=\"232\" y=\"179\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#107C41\" font-family=\"Segoe UI,Arial,sans-serif\">VMSS2</text>\n<text x=\"232\" y=\"199\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">VM Scale Set</text>\n<text x=\"232\" y=\"210\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">West US</text>\n<rect x=\"350\" y=\"80\" width=\"90\" height=\"55\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"356\" y=\"85\" width=\"78\" height=\"24\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"395\" y=\"101\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">LB</text>\n<text x=\"395\" y=\"121\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Load</text>\n<text x=\"395\" y=\"132\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Balancer</text>\n<line x1=\"330\" y1=\"80\" x2=\"345\" y2=\"95\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<line x1=\"330\" y1=\"180\" x2=\"345\" y2=\"115\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"240\" y=\"260\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Front Door → リージョン単位ルーティング → LB → VMSS</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Azure Front Door Premium</strong>は<strong>グローバル Anycast</strong>による L7 負荷分散・自動フェールオーバーを提供し、\n<em>Premium SKU のみ</em> <strong>Azure Private Link</strong> でプライベート IP バックエンドへの接続をサポートします。\nWAF との統合も組み込みで、今回の要件（グローバル + プライベートバックエンド）を単一サービスで満たします。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Azure Firewall Premium：</strong>L7 ファイアウォール（TLS 検査・IDS）。グローバル負荷分散機能はありません。<br>\n<strong>Application Gateway v2：</strong>リージョン内 L7 ロードバランサー。クロスリージョンの自動フェールオーバーに対応しません。<br>\n<strong>クロスリージョン Load Balancer：</strong>L4（TCP/UDP）のグローバル LB。HTTP ルーティングや WAF はありません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">グローバル負荷分散が必要 → Application Gateway（リージョン内）を除外</span><span class=\"fs\">プライベート IP バックエンドへの接続が必要 → Front Door Standard を除外</span><span class=\"fs\">→ Front Door Premium のみが両要件を満たす ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>サービス</th><th>スコープ</th><th>レイヤー</th><th>Private Link</th><th>WAF</th><th>主な用途</th></tr></thead><tbody><tr><td>Front Door Standard</td><td>グローバル</td><td>L7</td><td>×</td><td>○</td><td>グローバル CDN + LB</td></tr><tr><td>Front Door Premium ✅</td><td>グローバル</td><td>L7</td><td>○</td><td>○（拡張）</td><td>Private バックエンドの保護</td></tr><tr><td>Application Gateway v2</td><td>リージョン</td><td>L7</td><td>×</td><td>○</td><td>リージョン内 Web LB</td></tr><tr><td>Azure Load Balancer</td><td>リージョン</td><td>L4</td><td>×</td><td>×</td><td>TCP/UDP 高性能 LB</td></tr><tr><td>Cross-Region LB</td><td>グローバル</td><td>L4</td><td>×</td><td>×</td><td>グローバル TCP LB</td></tr></tbody></table><div class=\"wbox\">Front Door Standard と Premium の最大の違いは「Private Link サポート」の有無。本番環境でバックエンドがプライベート IP なら Premium 一択。名前が似ている Azure Firewall Premium と混同しないよう注意。</div></div></div>"},{"num":13,"id":"q13","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"マルチティアアプリケーション App1 と Azure SQL Database SQL1 があります。高負荷時にデータ取得が遅延するとユーザーから報告されています。データ要求の応答時間を短縮する必要があります。\n\nソリューションに含めるべきものはどれですか？","choices":[{"text":"Azure Cache for Redis","is_correct":true},{"text":"Azure CDN","is_correct":false},{"text":"Azure Data Factory","is_correct":false},{"text":"Azure Synapse Analytics","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">App Service + SQL DB + Redis Cache（Q13）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"156\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"162\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"200\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">APP</text>\n<text x=\"200\" y=\"86\" text-anchor=\"middle\"
