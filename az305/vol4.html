 fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">キャッシュミス時</text>\n</svg></div><svg viewBox=\"0 0 320 225\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:320px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"320\" height=\"225\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/></marker>\n</defs>\n<rect x=\"15\" y=\"75\" width=\"110\" height=\"65\" rx=\"7\" fill=\"#112240\" stroke=\"#0078D4\" stroke-width=\"1.5\"/>\n<rect x=\"21\" y=\"80\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#0078D4\" fill-opacity=\"0.18\"/>\n<text x=\"70\" y=\"96\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0078D4\" font-family=\"Segoe UI,Arial,sans-serif\">App</text>\n<text x=\"70\" y=\"116\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">App Service</text>\n<text x=\"70\" y=\"127\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Webアプリ</text>\n<line x1=\"125\" y1=\"107\" x2=\"165\" y2=\"87\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"145\" y=\"82\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">クエリ(キャッシュミス)</text>\n<line x1=\"125\" y1=\"107\" x2=\"165\" y2=\"130\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"145\" y=\"102\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">キャッシュ読取</text>\n<rect x=\"170\" y=\"50\" width=\"120\" height=\"65\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"176\" y=\"55\" width=\"108\" height=\"24\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"230\" y=\"71\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">SQL</text>\n<text x=\"230\" y=\"91\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Azure SQL DB</text>\n<text x=\"230\" y=\"102\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">永続データ</text>\n<rect x=\"170\" y=\"125\" width=\"120\" height=\"65\" rx=\"7\" fill=\"#112240\" stroke=\"#E05252\" stroke-width=\"1.5\"/>\n<rect x=\"176\" y=\"130\" width=\"108\" height=\"24\" rx=\"4\" fill=\"#E05252\" fill-opacity=\"0.18\"/>\n<text x=\"230\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#E05252\" font-family=\"Segoe UI,Arial,sans-serif\">Redis</text>\n<text x=\"230\" y=\"166\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Azure Cache</text>\n<text x=\"230\" y=\"177\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">for Redis</text>\n<line x1=\"170\" y1=\"82\" x2=\"133\" y2=\"107\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"151\" y=\"77\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">結果キャッシュ</text>\n<text x=\"230\" y=\"210\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Cache-Aside: Redis ミス → SQL 読取 → Redis 書込</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Azure Cache for Redis</strong>はインメモリ KV ストアで、\n頻繁にアクセスされる SQL Database のクエリ結果をキャッシュします。\n次回以降の同じリクエストは DB にアクセスせず<strong>サブミリ秒（0.1〜1ms）</strong>で応答でき、\n往復遅延を劇的に短縮します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Azure CDN：</strong>静的コンテンツ（画像・CSS・JS）のエッジキャッシュ。\n<em>動的なデータベースクエリ結果</em>のキャッシュは設計されていません。<br>\n<strong>Azure Data Factory：</strong>ETL/データ統合サービス。リアルタイムのクエリ遅延改善には無関係。<br>\n<strong>Azure Synapse Analytics：</strong>大規模データウェアハウス・分析。OLTP 的な読み取り遅延改善には使いません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">SQL DB への繰り返しクエリが遅延の原因</span><span class=\"fs\">静的コンテンツの問題？ NO → CDN は除外</span><span class=\"fs\">データ統合・バッチ処理？ NO → ADF / Synapse は除外</span><span class=\"fs\">DB クエリ結果のキャッシュ → Redis ✅</span><span class=\"fs\">Redis ミス時のみ DB に問い合わせ → 結果を Redis に格納（Cache-Aside パターン）</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>キャッシュパターン</th><th>仕組み</th><th>コード変更</th><th>一貫性</th></tr></thead><tbody><tr><td>Cache-Aside ✅</td><td>アプリが Redis 確認 → ミスなら DB → Redis に保存</td><td>必要</td><td>手動制御</td></tr><tr><td>Read-Through</td><td>Redis が自動で DB から取得</td><td>ほぼ不要</td><td>自動</td></tr><tr><td>Write-Through</td><td>書き込み時に DB と Redis を同期</td><td>必要</td><td>高</td></tr><tr><td>Write-Behind</td><td>先に Redis に書き後で DB 同期</td><td>必要</td><td>低（非同期）</td></tr></tbody></table><div class=\"wbox\">CDN は「静的コンテンツ」専用。試験で「データベースの遅延」「動的データ」が出たら CDN は即除外。遅延改善 = Redis というパターンを反射的に思い出す。</div></div></div>"},{"num":14,"id":"q14","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"2つの Entra テナント（apexcore.com、ironclad.com）を管理。User1 は選択したサブスクリプションに関連付けられた Entra テナントを変更できる必要があります。最小権限の原則を適用。\n\nUser1 に割り当てるべきロールはどれですか？","choices":[{"text":"Owner","is_correct":true},{"text":"Co-administrator","is_correct":false},{"text":"Service administrator","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"200\" height=\"105\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#999\" stroke-width=\"1\"/><text x=\"120\" y=\"87\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#999\">シナリオ</text><text x=\"120\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">Q14: サブスクリプションの</text><text x=\"120\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">Entra テナント変更</text><text x=\"120\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">Q15: テナント移行後の</text><text x=\"120\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">アクセス昇格</text><rect x=\"285\" y=\"20\" width=\"230\" height=\"130\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"400\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Owner ロール</text><text x=\"400\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">サブスクリプション全権</text><text x=\"400\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">ロール割り当て権限</text><rect x=\"297\" y=\"62\" width=\"206\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"400\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">テナント変更権限 (Q14)</text><rect x=\"297\" y=\"87\" width=\"206\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"400\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">全リソースへのフルアクセス</text><rect x=\"297\" y=\"112\" width=\"206\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"400\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">他ユーザーへのロール割り当て</text><rect x=\"297\" y=\"137\" width=\"206\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"400\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">自己昇格・アクセス管理 (Q15)</text><rect x=\"545\" y=\"35\" width=\"135\" height=\"55\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"612\" y=\"48\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Co-admin</text><text x=\"612\" y=\"62\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">クラシック専用</text><text x=\"612\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ARM 非対応</text><rect x=\"545\" y=\"103\" width=\"135\" height=\"52\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"612\" y=\"115\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Contributor</text><text x=\"612\" y=\"129\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ロール割り当て❌</text><text x=\"612\" y=\"142\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">テナント変更❌</text><text x=\"350\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Owner = Azure RBAC最高位。テナント変更もロール割り当てもOwnerのみが可能</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Owner</strong>はサブスクリプションを別の Entra テナントに関連付け（移動）できる<em>唯一</em>の RBAC ロールです。\nAzure Portal の「サブスクリプション → ディレクトリの変更」でこの操作を実行できます。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Co-administrator / Service administrator：</strong>どちらも<em>Azure クラシックデプロイメント（旧管理ポータル）専用のレガシーロール</em>です。\n現行の ARM（Azure Resource Manager）リソースの管理やテナント変更には使えません。\n試験でこの2つが出たら、まずレガシーロールとして除外検討してください。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">テナント変更・ロール割り当て変更が要件</span><span class=\"fs\">Co-admin / Service admin → クラシック専用 → 即除外</span><span class=\"fs\">Contributor → ロール割り当て権限なし → 除外</span><span class=\"fs\">Owner → 全権限（ロール割り当て含む） → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>ロール</th><th>種類</th><th>テナント変更</th><th>ARM リソース管理</th><th>ロール割り当て</th><th>現在の推奨</th></tr></thead><tbody><tr><td>Owner ✅</td><td>現行 RBAC</td><td>○</td><td>○（全権）</td><td>○</td><td>推奨</td></tr><tr><td>Contributor</td><td>現行 RBAC</td><td>×</td><td>○（割り当て除く）</td><td>×</td><td>推奨</td></tr><tr><td>User Access Admin</td><td>現行 RBAC</td><td>×</td><td>×</td><td>○（IAM のみ）</td><td>限定的</td></tr><tr><td>Co-administrator</td><td>クラシック</td><td>×</td><td>×</td><td>×</td><td>非推奨（レガシー）</td></tr><tr><td>Service administrator</td><td>クラシック</td><td>×</td><td>×</td><td>×</td><td>非推奨（レガシー）</td></tr></tbody></table><div class=\"wbox\">試験で Co-admin や Service admin が選択肢に出たら「クラシック専用＝レガシー」として大抵は除外してよい。現行 Azure は Owner / Contributor / Reader で管理するのが基本。</div></div></div>"},{"num":15,"id":"q15","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"問題14と同じシナリオ。サブスクリプションが新しい Entra テナントに移動されて完全権限を持つアカウントがない場合、User2 のアクセスをサブスクリプションに昇格できる必要があります。\n\nUser2 に割り当てるべきロールはどれですか？","choices":[{"text":"Owner","is_correct":true},{"text":"Service administrator","is_correct":false},{"text":"Co-administrator","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"200\" height=\"105\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#999\" stroke-width=\"1\"/><text x=\"120\" y=\"87\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#999\">シナリオ</text><text x=\"120\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">Q14: サブスクリプションの</text><text x=\"120\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">Entra テナント変更</text><text x=\"120\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">Q15: テナント移行後の</text><text x=\"120\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">アクセス昇格</text><rect x=\"285\" y=\"20\" width=\"230\" height=\"130\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"400\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Owner ロール</text><text x=\"400\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">サブスクリプション全権</text><text x=\"400\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">ロール割り当て権限</text><rect x=\"297\" y=\"62\" width=\"206\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"400\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">テナント変更権限 (Q14)</text><rect x=\"297\" y=\"87\" width=\"206\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"400\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">全リソースへのフルアクセス</text><rect x=\"297\" y=\"112\" width=\"206\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"400\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">他ユーザーへのロール割り当て</text><rect x=\"297\" y=\"137\" width=\"206\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"400\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">自己昇格・アクセス管理 (Q15)</text><rect x=\"545\" y=\"35\" width=\"135\" height=\"55\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"612\" y=\"48\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Co-admin</text><text x=\"612\" y=\"62\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">クラシック専用</text><text x=\"612\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ARM 非対応</text><rect x=\"545\" y=\"103\" width=\"135\" height=\"52\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"612\" y=\"115\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Contributor</text><text x=\"612\" y=\"129\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ロール割り当て❌</text><text x=\"612\" y=\"142\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">テナント変更❌</text><text x=\"350\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Owner = Azure RBAC最高位。テナント変更もロール割り当てもOwnerのみが可能</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\nテナント移行後にサブスクリプションに誰も Owner がいない状況では、\n<strong>Entra グローバル管理者</strong>が Azure Portal の「プロパティ」で\n「Azure リソースへのアクセス管理」を一時的に昇格させると、\n自身に <strong>User Access Administrator</strong>（ルートスコープ）が付与されます。\nその後、自分自身に <strong>Owner</strong>を付与すれば完全権限を回復できます。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Service administrator / Co-administrator：</strong>クラシックロール。ARM リソースやテナント移行後の権限回復には使えません。\nテナント移行後のロック状態（誰も Owner がいない）を解除するには、\nEntra グローバル管理者による昇格操作が唯一の正規手段です。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">テナント移行後に Owner がいない状態</span><span class=\"fs\">1. Entra グローバル管理者として Azure Portal にログイン</span><span class=\"fs\">2. 「Entra ID → プロパティ → Azure リソースへのアクセス管理」を ON</span><span class=\"fs\">3. 自分に User Access Administrator が付与される</span><span class=\"fs\">4. 自分に Owner ロールを割り当て → 完全権限回復 ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>ロール</th><th>種類</th><th>テナント変更</th><th>ARM 管理</th><th>推奨</th></tr></thead><tbody><tr><td>Owner ✅</td><td>現行 RBAC</td><td>○</td><td>○（全権）</td><td>推奨</td></tr><tr><td>Service administrator</td><td>クラシック</td><td>×</td><td>×</td><td>非推奨</td></tr><tr><td>Co-administrator</td><td>クラシック</td><td>×</td><td>×</td><td>非推奨</td></tr></tbody></table><div class=\"wbox\">q14 と q15 はペア問題。「クラシックロール = Co-admin / Service admin」はほぼ除外と覚えておく。</div></div></div>"},{"num":16,"id":"q16","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"複数の App Service インスタンスを Azure SQL DB に接続してデプロイします。規制上、承認済み Azure リージョンにのみデプロイする必要があります。提案されたソリューション：Microsoft Defender for Cloud の Regulatory compliance ダッシュボードを使用する。\n\nこのソリューションは要件を満たしますか？","choices":[{"text":"いいえ（満たさない）","is_correct":true},{"text":"はい（満たす）","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">リージョン制御の正しい方法（Q16/Q17）</text><rect x=\"20\" y=\"32\" width=\"310\" height=\"115\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"175\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Q16 Defender for Cloud</text><text x=\"175\" y=\"89\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">デプロイ後の監視・評価ツール</text><text x=\"175\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">リージョン強制機能なし</text><rect x=\"32\" y=\"72\" width=\"286\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"175\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">コンプライアンスレポートを生成するのみ</text><rect x=\"32\" y=\"97\" width=\"286\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"175\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">デプロイ先リージョンを制限・拒否できない</text><rect x=\"348\" y=\"32\" width=\"332\" height=\"115\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"514\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Q17 RG ポリシーのみ</text><text x=\"514\" y=\"89\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">RGのリージョン制御だけでは不十分</text><text x=\"514\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">リソース自体は別リージョンに配置可</text><rect x=\"360\" y=\"72\" width=\"308\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"514\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">RGとリソースのリージョンは独立</text><rect x=\"360\" y=\"97\" width=\"308\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"514\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Microsoft.Web/sites 等に個別Policyが必要</text><rect x=\"20\" y=\"154\" width=\"660\" height=\"14\" rx=\"4\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"1\"/><text x=\"350\" y=\"161\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">正解: Azure Policy (Deny効果) でリソースプロバイダー毎にallowedLocationsを指定 → デプロイ時点で強制</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>「いいえ（満たさない）」</strong>が正解です。\nDefender for Cloud はデプロイ<em>後</em>のリソースセキュリティ状態を評価・レポートするサービスです。\nリソースが特定リージョン以外に<em>デプロイされる前に</em>拒否する（事前制御）機能はありません。\nリージョン制御には <strong>Azure Policy（allowedLocations）の Deny 効果</strong>が必要です。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n「はい（満たす）」: Defender for Cloud の Regulatory Compliance ダッシュボードは\n「どのリソースがどの規制に違反しているか」を<em>事後に表示</em>するだけで、\nデプロイ自体を事前にブロックする機能はありません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">「デプロイを事前に防ぐ（拒否）」= Azure Policy の Deny 効果</span><span class=\"fs\">「デプロイ後に問題を検知・報告する」= Defender for Cloud / Monitor</span><span class=\"fs\">Defender for Cloud → 事後評価 → 要件（事前制御）を満たさない → いいえ ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>サービス</th><th>機能</th><th>デプロイ前制御</th><th>デプロイ後評価</th></tr></thead><tbody><tr><td>Azure Policy (Deny) ✅</td><td>リソースデプロイを拒否</td><td>○</td><td>○</td></tr><tr><td>Azure Policy (Audit)</td><td>コンプライアンス記録</td><td>×</td><td>○</td></tr><tr><td>Defender for Cloud</td><td>セキュリティ評価・脅威検知</td><td>×</td><td>○</td></tr><tr><td>Azure Monitor</td><td>メトリクス・ログ監視</td><td>×</td><td>○</td></tr><tr><td>RG のリージョン設定</td><td>RG 自体の場所</td><td>×</td><td>×</td></tr></tbody></table><div class=\"wbox\">「デプロイを防ぐ（事前制御）」= Azure Policy の Deny 効果。「デプロイ後に問題を検知」= Defender for Cloud。この役割の違いは試験で頻出。</div></div></div>"},{"num":17,"id":"q17","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"問題16と同じシナリオ。提案されたソリューション：Azure Policy イニシアチブを使用して、リソースグループに対して許可されるリージョンを強制する。\n\nこの方法は目標を満たしますか？","choices":[{"text":"いいえ（満たさない）","is_correct":true},{"text":"はい（満たす）","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">リージョン制御の正しい方法（Q16/Q17）</text><rect x=\"20\" y=\"32\" width=\"310\" height=\"115\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"175\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Q16 Defender for Cloud</text><text x=\"175\" y=\"89\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">デプロイ後の監視・評価ツール</text><text x=\"175\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">リージョン強制機能なし</text><rect x=\"32\" y=\"72\" width=\"286\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"175\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">コンプライアンスレポートを生成するのみ</text><rect x=\"32\" y=\"97\" width=\"286\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"175\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">デプロイ先リージョンを制限・拒否できない</text><rect x=\"348\" y=\"32\" width=\"332\" height=\"115\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"514\" y=\"75\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Q17 RG ポリシーのみ</text><text x=\"514\" y=\"89\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">RGのリージョン制御だけでは不十分</text><text x=\"514\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">リソース自体は別リージョンに配置可</text><rect x=\"360\" y=\"72\" width=\"308\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"514\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">RGとリソースのリージョンは独立</text><rect x=\"360\" y=\"97\" width=\"308\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"514\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Microsoft.Web/sites 等に個別Policyが必要</text><rect x=\"20\" y=\"154\" width=\"660\" height=\"14\" rx=\"4\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"1\"/><text x=\"350\" y=\"161\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">正解: Azure Policy (Deny効果) でリソースプロバイダー毎にallowedLocationsを指定 → デプロイ時点で強制</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>「いいえ（満たさない）」</strong>が正解です。\nAzure Policy イニシアチブをリソースグループに割り当てても、\nそのリソースグループ<em>内</em>のリソースがデプロイされるリージョンを制限できます。\nしかし、問題のシナリオはリソースグループを対象にした設定で、\n<em>サブスクリプションや管理グループレベル</em>への割り当てが本来必要です。\nまた、RG のリージョンは RG 自体のメタデータ保存場所であり、\n<strong>RG 内リソースのリージョンとは独立</strong>しています。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n「はい（満たす）」:\nPolicy の allowedLocations を RG レベルに割り当てると、\nその RG 内の新規リソースは制限されますが、\n「サブスクリプション全体のリソースのデプロイ先を制限する」という要件には不十分です。\n他の RG にデプロイされたリソースには適用されません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">サブスクリプション全体でリージョン制限したい</span><span class=\"fs\">Policy をサブスクリプションまたは管理グループレベルに割り当てる → ✅</span><span class=\"fs\">RG レベルのみの割り当て → その RG 内だけ → 全体制御にならない → ✗</span><span class=\"fs\">RG のリージョン設定 → RG 内リソースのリージョンとは無関係 → ✗</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>Policy 割り当てスコープ</th><th>影響範囲</th><th>全体制御に適切か</th></tr></thead><tbody><tr><td>管理グループ</td><td>配下の全サブスクリプション・RG</td><td>○（最広範）</td></tr><tr><td>サブスクリプション</td><td>配下の全 RG・リソース</td><td>○</td></tr><tr><td>リソースグループ</td><td>その RG 内のみ</td><td>×（全体制御にならない）</td></tr><tr><td>リソース</td><td>そのリソースのみ</td><td>×（全体制御にならない）</td></tr></tbody></table><div class=\"wbox\">Policy のスコープは「管理グループ > サブスクリプション > RG > リソース」の順。全体制御には上位スコープへの割り当てが必要。</div></div></div>"},{"num":18,"id":"q18","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"Azure サブスクリプションに約5,000のリソースがあります。サブスクリプションのコンプライアンスレポートを生成し、部門ごとにリソースを論理的にグループ化できるソリューションが必要です。\n\nリソースを整理するために使用すべきものはどれですか？","choices":[{"text":"Azure Policy + リソースタグ","is_correct":true},{"text":"アプリケーショングループ + クォータ制限","is_correct":false},{"text":"管理ユニット + Azure Lighthouse","is_correct":false},{"text":"リソースグループ + ロール割り当て","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"150\" height=\"105\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#999\" stroke-width=\"1\"/><text x=\"95\" y=\"87\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#999\">5,000 リソース</text><text x=\"95\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・部門別グループ化</text><text x=\"95\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・コンプライアンスレポート</text><text x=\"95\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・物理移動なし</text><text x=\"95\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・自動付与</text><rect x=\"240\" y=\"20\" width=\"210\" height=\"125\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"345\" y=\"68\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Policy + タグ</text><text x=\"345\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Modify 効果で自動付与</text><text x=\"345\" y=\"95\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">論理グループ化</text><rect x=\"252\" y=\"62\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"345\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Department=Engineering タグ付与</text><rect x=\"252\" y=\"87\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"345\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Policy: 未タグ→Modify で自動付与</text><rect x=\"252\" y=\"112\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"345\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Cost Management でフィルタ集計</text><rect x=\"252\" y=\"137\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"345\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">物理的な場所・RG変更不要 ✅</text><rect x=\"525\" y=\"35\" width=\"155\" height=\"60\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"602\" y=\"51\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">管理グループ</text><text x=\"602\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">物理的な階層移動</text><text x=\"602\" y=\"78\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">既存構造の変更必要</text><rect x=\"525\" y=\"108\" width=\"155\" height=\"52\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"602\" y=\"120\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">個別 RG</text><text x=\"602\" y=\"134\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">手動管理</text><text x=\"602\" y=\"147\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">スケールしない</text><text x=\"350\" y=\"151\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">タグ: 論理分類でリソースを整理。Policy+Modifyで既存リソースにも自動付与</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Azure Policy + リソースタグ</strong>が正解です。\nタグ（例: <code>Department=Engineering</code>）はリソースを<em>物理的に移動せず</em>論理的にグループ化するメタデータです。\nPolicy の Modify 効果でタグのないリソースへの自動付与（修復タスク）も可能で、\n5,000 リソースへの一括適用も現実的に管理できます。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>アプリケーショングループ + クォータ：</strong>Azure Virtual Desktop 向け機能。汎用リソース管理には使えません。<br>\n<strong>管理ユニット + Azure Lighthouse：</strong>管理ユニットは Entra ID ユーザー/グループの<em>管理委任</em>用途。リソースのグループ化ではありません。<br>\n<strong>リソースグループ + ロール割り当て：</strong>物理的な RG 移動が必要で 5,000 リソースの移動は膨大な工数。既存の依存関係も破壊するリスクがあります。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">「物理移動なしで 5,000 リソースを論理グループ管理」</span><span class=\"fs\">物理移動不要 → RG への移行は除外</span><span class=\"fs\">ユーザー管理ではなくリソース管理 → 管理ユニットは除外</span><span class=\"fs\">リソースに論理ラベル付け → タグ + Policy ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>Policy の効果</th><th>動作</th><th>既存リソースへの適用方法</th></tr></thead><tbody><tr><td>Deny</td><td>ポリシー違反のデプロイを拒否</td><td>新規のみ（既存には不適用）</td></tr><tr><td>Audit</td><td>違反をログに記録（デプロイは通過）</td><td>既存も評価対象</td></tr><tr><td>Modify ✅</td><td>タグ / プロパティを自動追加・変更</td><td>修復タスクで既存リソースに適用可</td></tr><tr><td>DeployIfNotExists</td><td>関連リソースを自動デプロイ</td><td>修復タスクで既存にも対応</td></tr></tbody></table><div class=\"wbox\">Modify は Policy 割り当てだけでは既存リソースに<em>自動適用されない</em>。「修復タスク（Remediation Task）」を別途手動実行またはスケジュール設定が必要。</div></div></div>"},{"num":19,"id":"q19","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"1日約50,000イベントを生成するアプリケーションがあります。Azure Event Hub にストリームし、Event Hubs Capture でコールドパス処理を有効にします。キャプチャデータはレポーティングソリューションで消費されます。\n\nEvent Hubs Capture をサポートするために必要なストレージタイプはどれですか？","choices":[{"text":"Azure Data Lake Storage Gen2","is_correct":true},{"text":"Premium ブロック BLOB","is_correct":false},{"text":"Premium ファイル共有","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">Event Hubs Capture コールドパス（Q19）</div><svg viewBox=\"0 0 740 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:740px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"740\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"146\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"152\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"190\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">APP</text>\n<text x=\"190\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe " rx=\"4\" fill=\"#F97C00\" fill-opacity=\"0.18\"/>\n<text x=\"410\" y=\"126\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#F97C00\" font-family=\"Segoe UI,Arial,sans-serif\">ADLS</text>\n<text x=\"410\" y=\"146\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Data Lake</text>\n<text x=\"410\" y=\"157\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Storage (Avro)</text>\n<line x1=\"475\" y1=\"132\" x2=\"510\" y2=\"132\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"492\" y=\"127\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">バッチ分析</text>\n<rect x=\"515\" y=\"105\" width=\"110\" height=\"55\" rx=\"7\" fill=\"#112240\" stroke=\"#E040FB\" stroke-width=\"1.5\"/>\n<rect x=\"521\" y=\"110\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#E040FB\" fill-opacity=\"0.18\"/>\n<text x=\"570\" y=\"126\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#E040FB\" font-family=\"Segoe UI,Arial,sans-serif\">Databricks</text>\n<text x=\"570\" y=\"146\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">HDInsight</text>\n<text x=\"570\" y=\"157\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">/ Databricks</text>\n<text x=\"330\" y=\"180\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Capture = 自動的に Avro 形式で ADLS へ保存</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>ADLS Gen2</strong>は Event Hubs Capture の公式サポートターゲット（Blob Storage または ADLS Gen2 の2択のみ）のうち、\n<strong>階層型名前空間（HNS）</strong>による日付/時刻パスの自動管理と\n後続の分析パイプライン（Synapse・Databricks）との連携に最適な選択肢です。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Premium ブロック BLOB：</strong>高スループット Blob ティアですが、\nEvent Hubs Capture のターゲットとして公式サポートされていません。<br>\n<strong>Premium ファイル共有：</strong>Azure Files の Premium ティア。Capture ターゲットではありません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">Event Hubs Capture のターゲット = Blob Storage OR ADLS Gen2 の2択のみ</span><span class=\"fs\">他のストレージ（Files / NetApp / Premium Block）は即除外</span><span class=\"fs\">日付・時刻ディレクトリ管理 + 分析用途 → ADLS Gen2 ✅</span><span class=\"fs\">シンプルな保存のみ → 標準 Blob でも可</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><strong>Event Hubs Capture のまとめ</strong><table class=\"etbl\"><thead><tr><th>項目</th><th>詳細</th></tr></thead><tbody><tr><td>対応ターゲット</td><td>Azure Blob Storage または ADLS Gen2 のみ</td></tr><tr><td>出力形式</td><td>Apache Avro（バイナリ・スキーマ埋め込み）固定</td></tr><tr><td>ファイル命名パターン</td><td>namespace/eventhub/partition/year/month/day/hour/min/sec</td></tr><tr><td>最小キャプチャ間隔</td><td>設定可能（デフォルト 5 分 or 300 MB）</td></tr><tr><td>追加コスト</td><td>Capture 有効化ごとに別途課金</td></tr></tbody></table><div class=\"wbox\">Capture は Avro 形式固定。Databricks 等で Avro → Parquet に変換するのが典型パターンのため、「Capture の出力が Parquet」と混同しやすい。</div></div></div>"},{"num":20,"id":"q20","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"問題19と同じシナリオ。Event Hubs にストリーム後、Capture でコールドパス処理。\n\nレポーティングシステムが処理できる必要があるデータ形式はどれですか？","choices":[{"text":"Avro","is_correct":true},{"text":"Apache Parquet","is_correct":false},{"text":"JSON","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"40\" width=\"145\" height=\"80\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"92\" y=\"66\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">Azure Event Hubs</text><text x=\"92\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">Capture 機能</text><text x=\"92\" y=\"93\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">イベント自動保存</text><rect x=\"240\" y=\"20\" width=\"220\" height=\"130\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"350\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">ADLS Gen2 (Q19)</text><text x=\"350\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Capture 対応ターゲット</text><text x=\"350\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">分析最適化</text><rect x=\"252\" y=\"62\" width=\"196\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"350\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Event Hubs Capture 公式対応 ✅</text><rect x=\"252\" y=\"87\" width=\"196\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"350\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Apache Avro 形式で保存 (Q20) ✅</text><rect x=\"252\" y=\"112\" width=\"196\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"350\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">日時パス構造に自動保存</text><rect x=\"252\" y=\"137\" width=\"196\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"350\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Databricks/Synapse と直接連携</text><rect x=\"540\" y=\"40\" width=\"140\" height=\"60\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"610\" y=\"56\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Cosmos DB</text><text x=\"610\" y=\"70\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Capture 非対応</text><text x=\"610\" y=\"83\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ターゲット</text><rect x=\"540\" y=\"115\" width=\"140\" height=\"30\" rx=\"6\" fill=\"#FFF8E1\" stroke=\"#E67700\" stroke-width=\"1.5\"/><text x=\"610\" y=\"134\" text-anchor=\"middle\" font-size=\"8\" fill=\"#E67700\">Avro: バイナリ圧縮</text><line x1=\"165\" y1=\"80\" x2=\"238\" y2=\"92\" stroke=\"#7719AA\" stroke-width=\"2\" marker-end=\"url(#ap)\"/><text x=\"350\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Capture出力先: ADLS Gen2またはBlob Storageのみ。形式はAvro固定(JSONやParquetは❌)</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Avro（Apache Avro）</strong>は Event Hubs Capture が出力する<em>唯一の形式</em>です。\n行指向のコンパクトなバイナリ形式で、スキーマをデータに埋め込みます。\nDatabricks・Synapse・HDInsight がネイティブサポートしています。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Parquet：</strong>列指向の高圧縮フォーマット。Capture の直接出力ではありませんが、\n後続処理（Databricks 等）で <strong>Avro → Parquet に変換するのが一般的パターン</strong>のため混同されやすい。<br>\n<strong>JSON：</strong>可読性が高いテキスト形式ですが、Capture は JSON を出力しません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">「Event Hubs Capture の出力形式は？」</span><span class=\"fs\">→ Avro 固定（選択の余地なし）</span><span class=\"fs\">Parquet が正解になるのは「変換後のファイル形式」を聞いている場合のみ</span><span class=\"fs\">この問題は Capture の出力を聞いている → Avro ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>フォーマット</th><th>構造</th><th>スキーマ</th><th>圧縮率</th><th>Capture 出力</th><th>主な用途</th></tr></thead><tbody><tr><td>Avro ✅</td><td>行指向</td><td>データ内に埋め込み</td><td>中</td><td>○（Capture 固定）</td><td>ストリーミング・Kafka</td></tr><tr><td>Parquet</td><td>列指向</td><td>外部スキーマ</td><td>高</td><td>×</td><td>分析・DWH</td></tr><tr><td>JSON</td><td>テキスト</td><td>なし（自由形式）</td><td>低</td><td>×</td><td>API・設定ファイル</td></tr><tr><td>ORC</td><td>列指向</td><td>フッターに格納</td><td>高</td><td>×</td><td>Hive・Hadoop DWH</td></tr></tbody></table><div class=\"wbox\">「Capture = Avro 固定」は確実に覚える。Avro と Parquet の違い（行指向 vs 列指向）も選択肢の判断に使える知識。</div></div></div>"},{"num":21,"id":"q21","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"East US に Azure Database for MySQL フレキシブルサーバー Server1 をデプロイ予定です。ペアとなる Azure リージョンへのフェールオーバー時にサービスのダウンタイムを最小化できる事業継続戦略を設計する必要があります。\n\n実行すべきアクションはどれですか？","choices":[{"text":"ジオ冗長バックアップを有効化する","is_correct":true},{"text":"読み取り専用レプリカを構成する","is_correct":false},{"text":"Azure Premium ファイル共有にDBファイルを保存する","is_correct":false},{"text":"ネイティブ MySQL レプリケーションを構成する","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"> \">ペアリージョン</text><text x=\"605\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">バックアップ復元</text><rect x=\"530\" y=\"120\" width=\"150\" height=\"45\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"605\" y=\"128\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">ゾーン冗長HA</text><text x=\"605\" y=\"142\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">同一リージョン内</text><text x=\"605\" y=\"155\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">リージョン障害には❌</text><line x1=\"165\" y1=\"80\" x2=\"238\" y2=\"92\" stroke=\"#7719AA\" stroke-width=\"2\" marker-end=\"url(#ap)\"/><line x1=\"455\" y1=\"95\" x2=\"528\" y2=\"73\" stroke=\"#107C10\" stroke-width=\"2\" marker-end=\"url(#ag)\"/><text x=\"350\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">ゾーン冗長HA=同リージョン内AZ間 / ジオ冗長=別リージョン。リージョン障害→ジオ冗長が必要</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>ジオ冗長バックアップ（Geo-redundant backup）</strong>を有効化することで、\nバックアップデータがペアリージョンに複製されます。\n<strong>リージョン全体の大規模障害</strong>（データセンター全滅クラスの障害）が発生しても、\nペアリージョンでサーバーを復元できます。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>読み取り専用レプリカ：</strong>クロスリージョンに作成可能ですが、<em>自動フェールオーバーがなく手動昇格が必要</em>。バックアップの代替ではありません。<br>\n<strong>Premium ファイル共有への DB ファイル保存：</strong>MySQL DB ファイルを Azure Files に保存する設計はサポートされていません。<br>\n<strong>ネイティブ MySQL レプリケーション：</strong>オンプレ → Azure 移行時に使用しますが、\nリージョン障害からの自動保護には不十分です。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">「ペアリージョンでの復元」= リージョン全体の障害対策</span><span class=\"fs\">ゾーン冗長 HA → 同リージョン内 AZ 間の保護 → リージョン障害には対応不可</span><span class=\"fs\">ジオ冗長バックアップ → ペアリージョンにバックアップ複製 → ✅</span><span class=\"fs\">読み取りレプリカ → 手動昇格が必要 → 自動復旧ではない</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>機能</th><th>保護範囲</th><th>自動フェールオーバー</th><th>RPO</th><th>RTO</th></tr></thead><tbody><tr><td>ローカルバックアップ</td><td>ゾーン内</td><td>×（手動復元）</td><td>最大24h</td><td>数時間〜</td></tr><tr><td>ゾーン冗長 HA</td><td>同リージョン内 AZ</td><td>○（秒〜分）</td><td>0（同期）</td><td>分以内</td></tr><tr><td>ジオ冗長バックアップ ✅</td><td>別リージョン（ペア）</td><td>×（手動復元）</td><td>〜1時間</td><td>1時間〜</td></tr><tr><td>クロスリージョン読み取りレプリカ</td><td>別リージョン</td><td>×（手動昇格）</td><td>数分</td><td>分〜</td></tr></tbody></table><div class=\"wbox\">ゾーン冗長 HA とジオ冗長バックアップは保護スコープが異なる。AZ 障害 → ゾーン冗長 HA。リージョン障害 → ジオ冗長バックアップまたはジオレプリケーション。</div></div></div>"},{"num":22,"id":"q22","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"オンプレミス MySQL データベースを Azure Database for MySQL フレキシブルサーバーに移行します。データセンター障害時もアクセス可能で、全体のコストを最小化するコンピューティング層構成を推奨する必要があります。\n\n推奨するコンピューティング層はどれですか？","choices":[{"text":"General Purpose（汎用）","is_correct":true},{"text":"Burstable（バースタブル）","is_correct":false},{"text":"Memory Optimized（メモリ最適化）","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">MySQL フレキシブルサーバー コンピューティング層比較</text><rect x=\"20\" y=\"32\" width=\"205\" height=\"110\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"122\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">General Purpose</text><text x=\"122\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">ゾーン冗長 HA 対応</text><text x=\"122\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">コスト最小</text><rect x=\"32\" y=\"72\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"122\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ゾーン冗長 HA ✅</text><rect x=\"32\" y=\"97\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"122\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">3層の中で最もコスト効率高</text><rect x=\"245\" y=\"32\" width=\"205\" height=\"110\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"347\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Burstable</text><text x=\"347\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ゾーン冗長 HA 非対応</text><text x=\"347\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">開発/テスト向け</text><rect x=\"257\" y=\"72\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"347\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">HA機能なし ❌</text><rect x=\"257\" y=\"97\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"347\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">低コストだがHA不可</text><rect x=\"470\" y=\"32\" width=\"210\" height=\"110\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"575\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Business Critical</text><text x=\"575\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ゾーン冗長HA対応</text><text x=\"575\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">だが最高コスト</text><rect x=\"482\" y=\"72\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"575\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">HA対応だが高コスト</text><rect x=\"482\" y=\"97\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"575\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">メモリ最適化：過剰スペック</text><text x=\"350\" y=\"151\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">ゾーン冗長HA対応かつ最低コスト → General Purpose。Burstable=HA❌/Business Critical=高コスト</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>General Purpose（汎用）</strong>層はゾーン冗長 HA をサポートする層の中で\n<strong>最もコスト効率が高い</strong>選択肢です。\nゾーン冗長 HA を有効化することで、1つの AZ が障害になっても別 AZ のスタンバイに自動フェールオーバーします。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Burstable：</strong>最も安価ですが<em>ゾーン冗長 HA に非対応</em>。開発・テスト専用層です。<br>\n<strong>Memory Optimized：</strong>ゾーン冗長 HA には対応しますが、メモリ集約型ワークロード向けの<em>高スペック・高コスト</em>層。コスト最小化要件に反します。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">ゾーン冗長 HA 必須 → Burstable を即除外（非対応）</span><span class=\"fs\">コスト最小化 → Memory Optimized（高コスト）を除外</span><span class=\"fs\">残るのは General Purpose ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>層</th><th>ゾーン冗長 HA</th><th>IOPS 上限</th><th>vCores</th><th>推奨シナリオ</th></tr></thead><tbody><tr><td>Burstable</td><td>×</td><td>低</td><td>1〜20</td><td>開発・テスト・軽負荷</td></tr><tr><td>General Purpose ✅</td><td>○</td><td>中〜高</td><td>2〜96</td><td>本番・汎用ワークロード</td></tr><tr><td>Memory Optimized</td><td>○</td><td>高</td><td>2〜96</td><td>インメモリ DB・高メモリ要求</td></tr></tbody></table><div class=\"wbox\">Burstable はゾーン冗長 HA 非対応。試験では「本番環境 + HA + コスト最小」で Burstable を罠として選ばせることが多い。</div></div></div>"},{"num":23,"id":"q23","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"従業員の PII を保存する Azure Web アプリケーション向けに Azure SQL Database を設計します。要件：①単一データセンター障害時も可用性維持、②PII の列レベル暗号化、③給与処理期間中の自動スケーリング、④運用コストの最小化。\n\n推奨すべきサービス層とコンピューティング層の組み合わせはどれですか？","choices":[{"text":"General Purpose + Serverless","is_correct":true},{"text":"Business Critical + Serverless","is_correct":false},{"text":"Hyperscale + Provisioned","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">SQL DB 高可用性 + 暗号化（Q23）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"156\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"162\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"200\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">APP</text>\n<text x=\"200\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Web アプリ</text>\n<text x=\"200\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">従業員 PII</text>\n<rect x=\"276\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#6264A7\" stroke-width=\"1.5\"/>\n<rect erif\">Auto-Failover</text>\n<line x1=\"215\" y1=\"145\" x2=\"255\" y2=\"155\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"235\" y=\"140\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Geo-Backup</text>\n<rect x=\"260\" y=\"20\" width=\"200\" height=\"170\" rx=\"8\" fill=\"none\" stroke=\"#1e4080\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/>\n<text x=\"360\" y=\"34\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Secondary (West US)</text>\n<rect x=\"275\" y=\"40\" width=\"165\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"281\" y=\"45\" width=\"153\" height=\"24\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"357\" y=\"61\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">SQL-S</text>\n<text x=\"357\" y=\"81\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">SQL DB Secondary</text>\n<text x=\"357\" y=\"92\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">読み取りレプリカ</text>\n<rect x=\"275\" y=\"115\" width=\"165\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#107C41\" stroke-width=\"1.5\"/>\n<rect x=\"281\" y=\"120\" width=\"153\" height=\"24\" rx=\"4\" fill=\"#107C41\" fill-opacity=\"0.18\"/>\n<text x=\"357\" y=\"136\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#107C41\" font-family=\"Segoe UI,Arial,sans-serif\">AG</text>\n<text x=\"357\" y=\"156\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Auto-Failover</text>\n<text x=\"357\" y=\"167\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Group</text>\n<rect x=\"480\" y=\"70\" width=\"110\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#6264A7\" stroke-width=\"1.5\"/>\n<rect x=\"486\" y=\"75\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#6264A7\" fill-opacity=\"0.18\"/>\n<text x=\"535\" y=\"91\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#6264A7\" font-family=\"Segoe UI,Arial,sans-serif\">KV</text>\n<text x=\"535\" y=\"111\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Key Vault</text>\n<text x=\"535\" y=\"122\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">CMK管理</text>\n<text x=\"285\" y=\"210\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Always Encrypted + TDE + Customer Managed Key</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>General Purpose + Serverless</strong>が正解です。\n①<strong>ゾーン冗長</strong>：GP 層はゾーン冗長設定が可能。\n②<strong>Always Encrypted</strong>：vCore 全層でサポート。\n③<strong>Serverless</strong>：<em>GP 層のみ</em>のオプション。断続的な給与処理ワークロードで使用時のみ課金。\n3要件を最低コストで満たす唯一の組み合わせです。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Business Critical + Serverless：</strong>BC は<em>Serverless を非サポート</em>（Provisioned のみ）。<br>\n<strong>Hyperscale + Provisioned：</strong>Hyperscale も<em>Serverless 非対応</em>。\nまた、一度 Hyperscale に変更すると他の層に戻せない制約があります。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">Serverless が要件 → GP のみ対応 → BC / Hyperscale は即除外</span><span class=\"fs\">ゾーン冗長 → GP / BC / Hyperscale 全てで対応（絞り込みには使えない）</span><span class=\"fs\">Always Encrypted → vCore 全層で対応（絞り込みには使えない）</span><span class=\"fs\">→ Serverless = GP というシグナルで GP + Serverless に絞れる ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>層</th><th>Serverless</th><th>ゾーン冗長</th><th>Always Encrypted</th><th>最大ストレージ</th></tr></thead><tbody><tr><td>General Purpose ✅</td><td>○（GP のみ）</td><td>○</td><td>○</td><td>4 TB</td></tr><tr><td>Business Critical</td><td>×</td><td>○</td><td>○</td><td>4 TB</td></tr><tr><td>Hyperscale</td><td>×</td><td>○</td><td>○</td><td>100 TB（不可逆）</td></tr></tbody></table><div class=\"wbox\">「Serverless 対応 = General Purpose のみ」は確実に覚える。断続的ワークロード + コスト最小 = Serverless というキーワードで GP に絞り込む。</div></div></div>"},{"num":24,"id":"q24","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"問題23と同じシナリオ。PII を含むデータに対して列レベルの暗号化を実現する必要があります。\n\n推奨すべき暗号化方式はどれですか？","choices":[{"text":"Always Encrypted","is_correct":true},{"text":"SQL Server 暗号化キー（一般）","is_correct":false},{"text":"TDE","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"160\" height=\"115\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#999\" stroke-width=\"1\"/><text x=\"100\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#999\">要件</text><text x=\"100\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・PII 列レベル暗号化</text><text x=\"100\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・ゾーン冗長</text><text x=\"100\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・Serverless 自動スケール</text><text x=\"100\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・コスト最小</text><rect x=\"248\" y=\"20\" width=\"210\" height=\"135\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"353\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">GP + Serverless (Q23)</text><text x=\"353\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">3要件すべて充足</text><text x=\"353\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">コスト最小</text><rect x=\"260\" y=\"62\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"353\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ゾーン冗長設定可 ✅</text><rect x=\"260\" y=\"87\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"353\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Serverless: 使用時のみ課金 ✅</text><rect x=\"260\" y=\"112\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"353\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Always Encrypted 全層対応 ✅</text><rect x=\"260\" y=\"137\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"353\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Business Criticalより低コスト ✅</text><rect x=\"530\" y=\"20\" width=\"150\" height=\"85\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"605\" y=\"48\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">Always Encrypted (Q24)</text><text x=\"605\" y=\"62\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">列レベル暗号化</text><text x=\"605\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">クライアント側で復号</text><rect x=\"542\" y=\"62\" width=\"126\" height=\"20\" rx=\"4\" fill=\"#D1C4E9\"/><text x=\"605\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">暗号化キーはDBに非保存</text><rect x=\"542\" y=\"87\" width=\"126\" height=\"20\" rx=\"4\" fill=\"#D1C4E9\"/><text x=\"605\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">DBA も参照不可</text><rect x=\"530\" y=\"118\" width=\"150\" height=\"52\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"605\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Business Critical</text><text x=\"605\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">過剰スペック</text><text x=\"605\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">高コスト</text><text x=\"350\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">GP+Serverless: ゾーン冗長/自動スケール/低コスト。AlwaysEncrypted: 全層でPII保護</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Always Encrypted</strong>は列レベルの暗号化機能で、\n暗号化・復号は<strong>クライアントアプリケーション側</strong>で行われます。\n<em>暗号化キーがサーバーに渡ることがない</em>ため、SQL Server が侵害されてもデータは保護されます。\n<strong>DBA でさえ平文データを参照できない</strong>のが最大の特徴で、PII 保護に最適です。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>SQL Server 暗号化キー（一般）：</strong>サーバー側で管理されるため DBA が参照可能。PII の列保護には不十分。<br>\n<strong>TDE（Transparent Data Encryption）：</strong>ディスク全体の暗号化でストレージ盗難への対策。\n<em>SQL Server 自身はデータを平文で処理する</em>ため DBA は参照できます。列保護には使えません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">「DBA も参照できない PII 保護」が要件</span><span class=\"fs\">TDE → サーバーは平文で処理 → DBA が参照可能 → ✗</span><span class=\"fs\">動的データマスキング → 元データは参照可能（表示制限のみ） → ✗</span><span class=\"fs\">Always Encrypted → クライアントで暗号化 → サーバーは暗号文のみ → DBA も見えない → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>機能</th><th>暗号化の場所</th><th>DBA が参照</th><th>保護対象</th><th>適切な用途</th></tr></thead><tbody><tr><td>TDE</td><td>ディスク（サーバー管理）</td><td>○（平文処理）</td><td>ディスク盗難</td><td>保存データ全体の基本保護</td></tr><tr><td>Always Encrypted ✅</td><td>クライアント（APP 管理）</td><td>×（暗号文のみ）</td><td>特定列の PII</td><td>最高機密データの列保護</td></tr><tr><td>動的データマスキング</td><td>なし（表示のみ）</td><td>○（元データ参照可）</td><td>クエリ結果表示</td><td>非特権ユーザーへの表示制限</td></tr><tr><td>行レベルセキュリティ</td><td>なし（アクセス制御）</td><td>○</td><td>行単位アクセス</td><td>マルチテナントデータ分離</td></tr></tbody></table><div class=\"wbox\">TDE と Always Encrypted の違いが頻出。PII・DBA からの隠蔽が要件 → Always Encrypted。ディスク盗難対策だけでよい → TDE で十分。</div></div></div>"},{"num":25,"id":"q25","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"オンプレミスアプリ App1 を Azure SQL Managed Instance に移行予定。カスタマーマネージドの TDE（Transparent Data Encryption）を構成し、最高レベルの暗号化強度を提供するソリューションが必要です。\n\nTDE プロテクターに選択すべき暗号化アルゴリズムとキー長はどれですか？","choices":[{"text":"RSA 3072","is_correct":true},{"text":"RSA 2048","is_correct":false},{"text":"AES 256","is_correct":false},{"text":"RSA 4096","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">SQL MI TDE カスタマー管理キー 強度比較</text><rect x=\"20\" y=\"34\" width=\"200\" height=\"26\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1.5\"/><text x=\"120\" y=\"51\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">RSA 2048: サポートあり（標準）</text><rect x=\"228\" y=\"34\" width=\"200\" height=\"26\" rx=\"6\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"1.5\"/><text x=\"328\" y=\"51\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">RSA 3072: Azure SQL 最強</text><rect x=\"436\" y=\"34\" width=\"200\" height=\"26\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1.5\"/><text x=\"536\" y=\"51\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">RSA 4096: Azure SQL 非対応</text><rect x=\"20\" y=\"68\" width=\"200\" height=\"26\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1.5\"/><text x=\"120\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">EC P-256: 署名用 / TDE保護❌</text><rect x=\"228\" y=\"68\" width=\"200\" height=\"26\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1.5\"/><text x=\"328\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">AES 256: 対称鍵 / TDE保護❌</text><rect x=\"460\" y=\"60\" width=\"220\" height=\"75\" rx=\"\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"1\"/><text x=\"570\" y=\"89\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">TDE の仕組み</text><text x=\"570\" y=\"103\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Key Vault でキー管理</text><rect x=\"472\" y=\"92\" width=\"196\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"570\" y=\"105\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">DEK(データ暗号化キー)をTDE保護キーで暗号</text><rect x=\"472\" y=\"113\" width=\"196\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"570\" y=\"126\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Key Vault に保管: RSA 2048/3072 対応</text><text x=\"350\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Azure SQL: RSA 2048/3072/EC P-256n をサポート。RSA 4096 は理論上強いが非対応</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>RSA 3072</strong>が Azure SQL Database・SQL Managed Instance の TDE プロテクター（Bring Your Own Key / BYOK）で\nサポートされる中で最もビット長が大きいキーです。\nRSA 2048 / RSA 3072 / EC P-256n がサポートされており、3072 が最強です。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>RSA 2048：</strong>サポートされていますが 3072 より弱い。<br>\n<strong>AES 256：</strong>対称鍵暗号。TDE 内部の DEK（データ暗号化キー）自体の暗号化に使われますが、\n<em>TDE プロテクター（KEK）には RSA 非対称鍵が使われる</em>ため AES 256 を直接設定できません。<br>\n<strong>RSA 4096：</strong>理論上最強ですが <em>2025 年現在 Azure SQL は RSA 4096 非サポート</em>。\nKey Vault には格納可能ですが TDE 保護キーとしては使用不可。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">Azure SQL TDE の最強キー長</span><span class=\"fs\">RSA 4096 → 理論最強だが Azure SQL 非対応 → ✗</span><span class=\"fs\">AES 256 → 対称鍵（KEK には使えない） → ✗</span><span class=\"fs\">RSA 3072 → Azure SQL サポート最大 → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>キー種別</th><th>Azure SQL TDE 対応</th><th>ビット強度</th><th>備考</th></tr></thead><tbody><tr><td>RSA 2048</td><td>○</td><td>2048bit</td><td>NIST 推奨最小（2030年以降は移行推奨）</td></tr><tr><td>RSA 3072 ✅</td><td>○</td><td>3072bit（Azure 最大）</td><td>NIST 推奨・高セキュリティ</td></tr><tr><td>RSA 4096</td><td>×</td><td>4096bit</td><td>Azure SQL 非サポート（Key Vault には保存可）</td></tr><tr><td>EC P-256n</td><td>○</td><td>256bit 相当</td><td>楕円曲線（署名用途向き）</td></tr><tr><td>AES 256</td><td>×（KEK として）</td><td>256bit</td><td>内部 DEK 暗号化に使用</td></tr></tbody></table><div class=\"wbox\">「RSA 4096 が最強だから正解」という典型的な罠。Azure SQL は RSA 4096 非対応。サポート範囲内で最強は RSA 3072。</div></div></div>"},{"num":26,"id":"q26","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"複数国の売上データを集約するために Azure Cosmos DB を使用するソリューションを設計しています。要件：①SQL ベースのクエリをサポート、②リージョン間の地理的レプリケーション、③リレーショナルスタイルのモデルでデータを格納・アクセス。\n\n推奨すべき Azure Cosmos DB API はどれですか？","choices":[{"text":"PostgreSQL","is_correct":true},{"text":"Apache Cassandra","is_correct":false},{"text":"MongoDB","is_correct":false},{"text":"NoSQL（Core/SQL）","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"160\" height=\"110\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#999\" stroke-width=\"1\"/><text x=\"100\" y=\"90\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#999\">要件</text><text x=\"100\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・複数国の売上データ</text><text x=\"100\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・標準 SQL クエリ</text><text x=\"100\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・地理的レプリケーション</text><text x=\"100\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・リレーショナルモデル</text><rect x=\"250\" y=\"20\" width=\"210\" height=\"135\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"355\" y=\"73\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Cosmos DB for PostgreSQL</text><text x=\"355\" y=\"87\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Citus 分散型</text><text x=\"355\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">グローバル配布</text><rect x=\"262\" y=\"62\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">標準 ANSI SQL ✅</text><rect x=\"262\" y=\"87\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">水平シャーディング（Citus）✅</text><rect x=\"262\" y=\"112\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">マルチリージョン対応 ✅</text><rect x=\"262\" y=\"137\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">リレーショナルモデル ✅</text><rect x=\"535\" y=\"35\" width=\"145\" height=\"60\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"607\" y=\"51\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Cosmos DB NoSQL</text><text x=\"607\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">非リレーショナル</text><text x=\"607\" y=\"78\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">SQLクエリ制限</text><rect x=\"535\" y=\"108\" width=\"145\" height=\"57\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"607\" y=\"122\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Azure SQL DB</text><text x=\"607\" y=\"136\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">地理的分散書き込み</text><text x=\"607\" y=\"149\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">制限あり</text><text x=\"350\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">PostgreSQL=リレーショナル+ANSI SQL / Citus=水平スケール。Cosmos for PostgreSQLが全要件を満たす</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Cosmos DB for PostgreSQL（Citus）</strong>はリレーショナルモデル・標準 ANSI SQL・\nグローバル分散（マルチリージョン書き込み）を組み合わせた唯一の選択肢です。\nCitus エクステンションによる水平シャーディングで複数国のデータを分散処理できます。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Cassandra API：</strong>ワイドカラム型 NoSQL（CQL）。標準 SQL は使えません。<br>\n<strong>MongoDB API：</strong>ドキュメント型 NoSQL。標準 SQL は使えません。<br>\n<strong>NoSQL（Core/SQL）API：</strong>Cosmos DB 独自の SQL-like 構文。標準 ANSI SQL とは異なります。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">「標準 SQL」「リレーショナルモデル」が要件</span><span class=\"fs\">→ Cassandra / MongoDB / Core（NoSQL）API は即除外</span><span class=\"fs\">「グローバル分散（マルチリージョン書き込み）」も要件</span><span class=\"fs\">→ Azure SQL DB（マルチ書き込み制限あり）は除外</span><span class=\"fs\">→ Cosmos DB for PostgreSQL（Citus）✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>Cosmos DB API</th><th>データモデル</th><th>標準 SQL</th><th>グローバル分散</th><th>主な用途</th></tr></thead><tbody><tr><td>Core (NoSQL) ✅</td><td>ドキュメント</td><td>△（独自）</td><td>○</td><td>汎用 NoSQL・低レイテンシ</td></tr><tr><td>MongoDB API</td><td>ドキュメント</td><td>×</td><td>○</td><td>MongoDB 移行</td></tr><tr><td>Cassandra API</td><td>ワイドカラム</td><td>×（CQL）</td><td>○</td><td>Cassandra 移行</td></tr><tr><td>Gremlin API</td><td>グラフ</td><td>×</td><td>○</td><td>グラフデータ</td></tr><tr><td>Table API</td><td>KV</td><td>×</td><td>○</td><td>Table Storage 移行</td></tr><tr><td>for PostgreSQL ✅</td><td>リレーショナル</td><td>○（ANSI SQL）</td><td>○（Citus）</td><td>SQL + グローバル分散</td></tr></tbody></table><div class=\"wbox\">「標準 SQL」「リレーショナル」キーワード → NoSQL 系 API を全除外できる。「グローバル分散 + 書き込み」→ Azure SQL DB も制限される。</div></div></div>"},{"num":27,"id":"q27","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"組織はニューヨーク、シドニー、パリ、ヨハネスブルグにオフィスがあり、各 Azure リージョン（East US、Southeast Asia、North Europe、South Africa）に ExpressRoute 回線を接続、3つのリージョンで接続を有効にしてレイテンシを最小化、コストを最小化が要件です。\n\n最低限デプロイする必要がある Azure Virtual WAN ハブの数はいくつですか？","choices":[{"text":"3","is_correct":true},{"text":"4","is_correct":false},{"text":"2","is_correct":false},{"text":"1","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">仮想 WAN: 4拠点 + ExpressRoute（Q27-28）</div><svg viewBox=\"0 0 700 230\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"700\" height=\"230\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"56\" y=\"84\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#107C10\" stroke-width=\"1.5\"/>\n<rect x=\"62\" y=\"89\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#107C10\" fill-opacity=\"0.18\"/>\n<text x=\"100\" y=\"108\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#107C10\" font-family=\"Segoe UI,Arial,sans-serif\">VWAN</text>\n<text x=\"100\" y=\"126\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Virtual WAN</text>\n<text x=\"100\" y=\"137\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Standard SKU</text>\n<rect x=\"556\" y=\"-36\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#107C10\" stroke-width=\"1.5\"/>\n<rect x=\"562\" y
