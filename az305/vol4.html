-end=\"url(#arr)\"/>\n<line x1=\"424\" y1=\"75\" x2=\"450\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<line x1=\"544\" y1=\"75\" x2=\"570\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n</svg></div><svg viewBox=\"0 0 630 240\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:630px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"630\" height=\"240\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/></marker>\n</defs>\n<rect x=\"15\" y=\"75\" width=\"110\" height=\"65\" rx=\"7\" fill=\"#112240\" stroke=\"#7a9cbf\" stroke-width=\"1.5\"/>\n<rect x=\"21\" y=\"80\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#7a9cbf\" fill-opacity=\"0.18\"/>\n<text x=\"70\" y=\"96\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">OnPrem</text>\n<text x=\"70\" y=\"116\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">オンプレ</text>\n<text x=\"70\" y=\"127\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">クライアント</text>\n<line x1=\"125\" y1=\"107\" x2=\"165\" y2=\"107\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"145\" y=\"102\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">ER/VPN</text>\n<rect x=\"170\" y=\"25\" width=\"340\" height=\"180\" rx=\"8\" fill=\"none\" stroke=\"#1e4080\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/>\n<text x=\"340\" y=\"39\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Azure VNet</text>\n<rect x=\"185\" y=\"45\" width=\"110\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#F97C00\" stroke-width=\"1.5\"/>\n<rect x=\"191\" y=\"50\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#F97C00\" fill-opacity=\"0.18\"/>\n<text x=\"240\" y=\"66\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#F97C00\" font-family=\"Segoe UI,Arial,sans-serif\">VGW</text>\n<text x=\"240\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">VPN/ER</text>\n<text x=\"240\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Gateway</text>\n<line x1=\"295\" y1=\"75\" x2=\"335\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"315\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">プライベート</text>\n<rect x=\"340\" y=\"45\" width=\"120\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#6264A7\" stroke-width=\"1.5\"/>\n<rect x=\"346\" y=\"50\" width=\"108\" height=\"24\" rx=\"4\" fill=\"#6264A7\" fill-opacity=\"0.18\"/>\n<text x=\"400\" y=\"66\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#6264A7\" font-family=\"Segoe UI,Arial,sans-serif\">PE</text>\n<text x=\"400\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Private Endpoint</text>\n<text x=\"400\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">10.x.x.x</text>\n<rect x=\"340\" y=\"120\" width=\"120\" height=\"55\" rx=\"7\" fill=\"#112240\" stroke=\"#E040FB\" stroke-width=\"1.5\"/>\n<rect x=\"346\" y=\"125\" width=\"108\" height=\"24\" rx=\"4\" fill=\"#E040FB\" fill-opacity=\"0.18\"/>\n<text x=\"400\" y=\"141\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#E040FB\" font-family=\"Segoe UI,Arial,sans-serif\">DNS</text>\n<text x=\"400\" y=\"161\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Private DNS</text>\n<text x=\"400\" y=\"172\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Zone</text>\n<line x1=\"460\" y1=\"75\" x2=\"500\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<rect x=\"505\" y=\"45\" width=\"100\" height=\"65\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"511\" y=\"50\" width=\"88\" height=\"24\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"555\" y=\"66\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">SA</text>\n<text x=\"555\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Storage</text>\n<text x=\"555\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">/ SQL / KV</text>\n<line x1=\"400\" y1=\"120\" x2=\"400\" y2=\"105\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"290\" y=\"225\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Private DNS Zone → オンプレから FQDN でプライベート解決</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>VM1 が apexcore.com を 168.63.129.16（Azure 提供 DNS）へ転送するよう設定する</strong>のが正解です。\nVM1 は VNet1 内にあるため、Azure の DNS リゾルバー（168.63.129.16）に直接アクセスでき、\nPrivate DNS Zone の A レコード（プライベートIP）を解決できます。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>パブリック DNS ゾーンへ転送：</strong>パブリック DNS にはプライベート IP アドレスのレコードがなく解決できません。<br>\n<strong>VNet1 のカスタム DNS を 168.63.129.16 に設定：</strong>VNet 設定でカスタム DNS を 168.63.129.16 にすると\nVNet 内 VM は直接 Azure DNS を使いますが、オンプレから VM1 を経由した解決フローが壊れます。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">VM1 の役割: DNS フォワーダー</span><span class=\"fs\">apexcore.com のクエリ → 168.63.129.16 に転送</span><span class=\"fs\">168.63.129.16 → Private DNS Zone を参照 → プライベートIP 返却 ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><strong>Private Endpoint DNS 解決の完全なフロー</strong><br><code>オンプレPC → オンプレDNS → VM1（VNet内DNSフォワーダー）→ 168.63.129.16（Azure DNS）→ Private DNS Zone → プライベートIP</code><br><br><table class=\"etbl\"><thead><tr><th>ステップ</th><th>経路</th><th>理由</th></tr></thead><tbody><tr><td>①</td><td>オンプレPC → オンプレDNS</td><td>クライアントのデフォルト DNS 設定</td></tr><tr><td>②</td><td>オンプレDNS → VM1（Q43の設定）</td><td>apexcore.com を VM1 に転送</td></tr><tr><td>③</td><td>VM1 → 168.63.129.16（Q42の設定）</td><td>Azure DNS は VNet 内からのみアクセス可</td></tr><tr><td>④</td><td>168.63.129.16 → Private DNS Zone</td><td>apexcore.com の A レコード参照</td></tr><tr><td>⑤</td><td>Private DNS Zone → プライベートIP返却</td><td>10.x.x.x を返す</td></tr></tbody></table><div class=\"wbox\">168.63.129.16 は Azure 仮想ネットワーク内部からのみアクセスできる特殊 IP アドレス。オンプレから直接アクセスすることはできないため、VNet 内の DNS フォワーダー（VM1）が必要。</div></div></div>"},{"num":43,"id":"q43","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"問題42と同じシナリオ。\n\n選択すべきオンプレミス設定はどれですか？","choices":[{"text":"apexcore.com を VM1 へ転送する","is_correct":true},{"text":"apexcore.com をパブリック DNS ゾーンへ転送する","is_correct":false},{"text":"apexcore.com を 168.63.129.16 の Azure DNS へ転送する","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">Private Endpoint + DNS + ExpressRoute（Q42-43）</div><svg viewBox=\"0 0 760 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:760px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"760\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\  stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<rect x=\"505\" y=\"45\" width=\"100\" height=\"65\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"511\" y=\"50\" width=\"88\" height=\"24\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"555\" y=\"66\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">SA</text>\n<text x=\"555\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Storage</text>\n<text x=\"555\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">/ SQL / KV</text>\n<line x1=\"400\" y1=\"120\" x2=\"400\" y2=\"105\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"290\" y=\"225\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Private DNS Zone → オンプレから FQDN でプライベート解決</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>オンプレ DNS が apexcore.com を VM1 に転送するよう設定する</strong>のが正解です。\nVM1 は VNet1 内にあるため 168.63.129.16 にアクセスできます。\nオンプレ DNS → VM1 → 168.63.129.16 → Private DNS Zone という解決チェーンが完成します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>パブリック DNS ゾーンへ転送：</strong>プライベートIP を解決できません。<br>\n<strong>168.63.129.16 へ直接転送：</strong>168.63.129.16 は VNet 外（オンプレ含む）からアクセスできない特殊 IP です。直接転送しても応答が返りません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">オンプレから Private Endpoint の IP を解決</span><span class=\"fs\">168.63.129.16 は VNet 外からアクセス不可</span><span class=\"fs\">オンプレDNS → VM1（VNet 内）→ 168.63.129.16 という2ホップが必要</span><span class=\"fs\">Q43 の設定: オンプレDNS が apexcore.com を VM1 へ転送 ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><strong>Private Endpoint DNS 解決の完全なフロー</strong><br><code>オンプレPC → オンプレDNS → VM1（VNet内DNSフォワーダー）→ 168.63.129.16（Azure DNS）→ Private DNS Zone → プライベートIP</code><br><br><table class=\"etbl\"><thead><tr><th>ステップ</th><th>経路</th><th>理由</th></tr></thead><tbody><tr><td>①</td><td>オンプレPC → オンプレDNS</td><td>クライアントのデフォルト DNS 設定</td></tr><tr><td>②</td><td>オンプレDNS → VM1（Q43の設定）</td><td>apexcore.com を VM1 に転送</td></tr><tr><td>③</td><td>VM1 → 168.63.129.16（Q42の設定）</td><td>Azure DNS は VNet 内からのみアクセス可</td></tr><tr><td>④</td><td>168.63.129.16 → Private DNS Zone</td><td>apexcore.com の A レコード参照</td></tr><tr><td>⑤</td><td>Private DNS Zone → プライベートIP返却</td><td>10.x.x.x を返す</td></tr></tbody></table><div class=\"wbox\">168.63.129.16 は Azure 仮想ネットワーク内部からのみアクセスできる特殊 IP アドレス。オンプレから直接アクセスすることはできないため、VNet 内の DNS フォワーダー（VM1）が必要。</div></div></div>"},{"num":44,"id":"q44","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"ハイブリッド Microsoft Entra テナントに関連付けられた Azure サブスクリプション Sub1 があります。オンプレミスデータセンターには VPN 接続がなく、Server1（Microsoft SQL Server 2016）はインターネットアクセスが制限されています。Azure Logic App LogicApp1 が Server1 のデータベースへの書き込みアクセスが必要です。\n\nLogicApp1 が Server1 にアクセスできるようにするためにオンプレミスにデプロイすべきものはどれですか？","choices":[{"text":"オンプレミスデータゲートウェイ","is_correct":true},{"text":"Windows Server の Web Application Proxy","is_correct":false},{"text":"Azure AD アプリケーションプロキシコネクタ","is_correct":false},{"text":"Hybrid Connection Manager","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"40\" width=\"135\" height=\"80\" rx=\"8\" fill=\"#FFF8E1\" stroke=\"#E67700\" stroke-width=\"2\"/><text x=\"87\" y=\"66\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#E67700\">Azure Logic Apps</text><text x=\"87\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">オンプレSQL Serverへ</text><text x=\"87\" y=\"93\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">アクセス</text><rect x=\"230\" y=\"20\" width=\"210\" height=\"130\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"335\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Q44: オンプレ GW</text><text x=\"335\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">オンプレ側インストール</text><text x=\"335\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">エージェント</text><rect x=\"242\" y=\"62\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"335\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">オンプレServer1にインストール</text><rect x=\"242\" y=\"87\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"335\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">暗号化トンネル確立</text><rect x=\"242\" y=\"112\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"335\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">VPN/公開IP不要</text><rect x=\"242\" y=\"137\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"335\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">SQL Server接続を中継</text><rect x=\"515\" y=\"20\" width=\"165\" height=\"130\" rx=\"8\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"2\"/><text x=\"597\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#0072C6\">Q45: 接続GWリソース</text><text x=\"597\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">Azure Portal側設定</text><text x=\"597\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">クラウド表現</text><rect x=\"527\" y=\"62\" width=\"141\" height=\"20\" rx=\"4\" fill=\"#BBDEFB\"/><text x=\"597\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#003F73\">Azure Portalで作成</text><rect x=\"527\" y=\"87\" width=\"141\" height=\"20\" rx=\"4\" fill=\"#BBDEFB\"/><text x=\"597\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#003F73\">オンプレGWとペアリング</text><rect x=\"527\" y=\"112\" width=\"141\" height=\"20\" rx=\"4\" fill=\"#BBDEFB\"/><text x=\"597\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#003F73\">Logic Appsから参照</text><line x1=\"155\" y1=\"80\" x2=\"228\" y2=\"92\" stroke=\"#E67700\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"440\" y1=\"92\" x2=\"513\" y2=\"92\" stroke=\"#0072C6\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><text x=\"350\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">オンプレGW(Q44)=オンプレ側エージェント / 接続GWリソース(Q45)=Azure側クラウド設定</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>オンプレミスデータゲートウェイ</strong>はオンプレ Server1 にインストールするエージェントで、\nLogic Apps・Power Automate・Power BI・Power Apps とオンプレ SQL Server などのデータソース間の\n<strong>暗号化されたトンネル</strong>を確立します。VPN や公開IP の構成なしにアクセスを実現します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Web Application Proxy コネクタ：</strong>Entra ID Application Proxy の一部でWeb アプリの SSO 公開用。SQL データアクセスとは無関係。<br>\n<strong>Entra ID Application Proxy コネクタ：</strong>オンプレ Web アプリをインターネットに安全公開する機能。SQL データソースへのアクセスには使いません。<br>\n<strong>Hybrid Connection Manager：</strong>Azure App Service からオンプレへの接続に使いますが Logic Apps のネイティブなオンプレ接続方法ではありません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">Logic Apps + オンプレ SQL Server、VPN 不要</span><span class=\"fs\">→ オンプレデータゲートウェイを Server1 にインストール</span><span class=\"fs\">→ Azure でゲートウェイリソースを作成（Q45）</span><span class=\"fs\">→ Logic Apps の SQL Server コネクタでゲートウェイを選択 ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>コンポーネント</th><th>場所</th><th>役割</th></tr></thead><tbody><tr><td>オンプレミスデータゲートウェイ（Q44）</td><td>オンプレミスサーバー</td><td>エージェントとして暗号化トンネルを確立</td></tr><tr><td>接続ゲートウェイリソース（Q45）</td><td>Azure ポータル</td><td>クラウド側の設定・参照先オブジェクト</td></tr><tr><td>SQL Server コネクタ</td><td>Logic Apps の設定</td><td>GW リソース経由で接続</td></tr></tbody></table><div class=\"wbox\">オンプレデータゲートウェイ（Logic Apps 用）と Self-hosted IR（ADF 用）の混同に注意。対象サービスが異なるがどちらもオンプレ接続のエージェント方式。</div></div></div>"},{"num":45,"id":"q45","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"問題44と同じシナリオ。\n\nAzure にデプロイすべき推奨ソリューションはどれですか？","choices":[{"text":"接続ゲートウェイリソース（Connection gateway resource）","is_correct":true},{"text":"Azure Application Gateway","is_correct":false},{"text":"Azure Event Grid ドメイン","is_correct":false},{"text":"エンタープライズアプリケーション","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"40\" width=\"135\" height=\"80\" rx=\"8\" fill=\"#FFF8E1\" stroke=\"#E67700\" stroke-width=\"2\"/><text x=\"87\" y=\"66\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#E67700\">Azure Logic Apps</text><text x=\"87\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">オンプレSQL Serverへ</text><text x=\"87\" y=\"93\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">アクセス</text><rect x=\"230\" y=\"20\" width=\"210\" height=\"130\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"335\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Q44: オンプレ GW</text><text x=\"335\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">オンプレ側インストール</text><text x=\"335\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">エージェント</text><rect x=\"242\" y=\"62\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"335\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">オンプレServer1にインストール</text><rect x=\"242\" y=\"87\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"335\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">暗号化トンネル確立</text><rect x=\"242\" y=\"112\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"335\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">VPN/公開IP不要</text><rect x=\"242\" y=\"137\" width=\"186\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"335\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">SQL Server接続を中継</text><rect x=\"515\" y=\"20\" width=\"165\" height=\"130\" rx=\"8\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"2\"/><text x=\"597\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#0072C6\">Q45: 接続GWリソース</text><text x=\"597\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">Azure Portal側設定</text><text x=\"597\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">クラウド表現</text><rect x=\"527\" y=\"62\" width=\"141\" height=\"20\" rx=\"4\" fill=\"#BBDEFB\"/><text x=\"597\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#003F73\">Azure Portalで作成</text><rect x=\"527\" y=\"87\" width=\"141\" height=\"20\" rx=\"4\" fill=\"#BBDEFB\"/><text x=\"597\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#003F73\">オンプレGWとペアリング</text><rect x=\"527\" y=\"112\" width=\"141\" height=\"20\" rx=\"4\" fill=\"#BBDEFB\"/><text x=\"597\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#003F73\">Logic Appsから参照</text><line x1=\"155\" y1=\"80\" x2=\"228\" y2=\"92\" stroke=\"#E67700\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"440\" y1=\"92\" x2=\"513\" y2=\"92\" stroke=\"#0072C6\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><text x=\"350\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">オンプレGW(Q44)=オンプレ側エージェント / 接続GWリソース(Q45)=Azure側クラウド設定</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>接続ゲートウェイリソース（Connection gateway resource）</strong>は\nAzure Portal 上で作成するオブジェクトで、\nインストール済みのオンプレゲートウェイとペアリングします。\nLogic Apps がこのリソースを参照することで、ゲートウェイ経由でオンプレ SQL Server に接続できます。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Azure Application Gateway：</strong>Azure の L7 ロードバランサー。オンプレデータへのブリッジではありません。<em>名前が似ているため混同注意。</em><br>\n<strong>Azure Event Grid ドメイン：</strong>イベント配信サービス。オンプレ接続とは無関係。<br>\n<strong>エンタープライズアプリケーション：</strong>Entra ID の SSO アプリ管理オブジェクト。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">オンプレデータゲートウェイ（物理）の Azure 側の対となるオブジェクト</span><span class=\"fs\">→ 接続ゲートウェイリソース（Azure ポータルで作成）</span><span class=\"fs\">→ GW のインストールID・リージョンを紐付け</span><span class=\"fs\">→ Logic Apps のコネクタでこのリソースの ID を指定 ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>コンポーネント</th><th>場所</th><th>役割</th></tr></thead><tbody><tr><td>オンプレミスデータゲートウェイ（Q44）</td><td>オンプレミスサーバー</td><td>エージェントとして暗号化トンネルを確立</td></tr><tr><td>接続ゲートウェイリソース（Q45）</td><td>Azure ポータル</td><td>クラウド側の設定・参照先オブジェクト</td></tr><tr><td>SQL Server コネクタ</td><td>Logic Apps の設定</td><td>GW リソース経由で接続</td></tr></tbody></table><div class=\"wbox\">オンプレデータゲートウェイ（Logic Apps 用）と Self-hosted IR（ADF 用）の混同に注意。対象サービスが異なるがどちらもオンプレ接続のエージェント方式。</div></div></div>"},{"num":46,"id":"q46","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"VM1（Azure VM、RG1内）と VM2（オンプレミス VM、Azureリソースグループに未関連）があります。新しいリソースグループ RG2 を Azure に作成しました。両 VM を RG2 に移動する必要があります。\n\nVM1 を移動するために使用すべきものはどれですか？","choices":[{"text":"Azure Resource Mover","is_correct":true},{"text":"Azure Arc","is_correct":false},{"text":"Azure Lighthouse","is_correct":false},{"text":"Azure Migrate","is_correct":false},{"text":"Data Migration Assistant","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"155\" height=\"105\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#999\" stroke-width=\"1\"/><text x=\"97\" y=\"87\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#999\">移動対象</text><text x=\"97\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">Q46: Azure VM (VM1)</text><text x=\"97\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">現在: RG1 → RG2</text><text x=\"97\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">Q47: オンプレ VM (VM2)</text><text x=\"97\" y=\"115\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">→ Azure RG2 へ移行</text><rect x=\"253\" y=\"20\" width=\"205\" height=\"130\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"355\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Resource Mover (Q46)</text><text x=\"355\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Azure VM の移動</text><text x=\"355\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">RG/リージョン/サブスク</text><rect x=\"265\" y=\"62\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Azure VM → RG 間移動 ✅</text><rect x=\"265\" y=\"87\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">依存関係チェック自動化</text><rect x=\"265\" y=\"112\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">移動前後の検証機能</text><rect x=\"535\" y=\"20\" width=\"145\" height=\"65\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"607\" y=\"38\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Migrate (Q47)</text><text x=\"607\" y=\"52\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">オンプレ→Azure</text><text x=\"607\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">評価+移行</text><rect x=\"535\" y=\"100\" width=\"145\" height=\"60\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"607\" y=\"116\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">逆は不可</text><text x=\"607\" y=\"130\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">AzureMigrate ≠</text><text x=\"607\" y=\"143\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Azure内の移動</text><text x=\"350\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Resource Mover: Azure内の移動 / Azure Migrate: オンプレ→Azureへの移行</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Azure Resource Mover</strong>は Azure VM などの既存 Azure リソースを\nRG・リージョン・サブスクリプション間で移動するネイティブ Azure サービスです。\n依存関係（NIC・NSG・ディスク等）の自動チェックと移動後の検証機能を提供します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Azure Arc：</strong>オンプレ / マルチクラウドリソースを Azure で管理する拡張サービス。リソースの物理的な移動には使いません。<br>\n<strong>Azure Lighthouse：</strong>MSP が複数顧客の Azure テナントを管理するための委任サービス。<br>\n<strong>Azure Migrate：</strong>オンプレから Azure への移行ツール。Azure 内のリソース移動には使えません（VM2 の Q47 参照）。<br>\n<strong>DMA：</strong>SQL 移行専用。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">VM1 は Azure 上の VM → Azure 内の移動が必要</span><span class=\"fs\">→ Azure Resource Mover（Azure → Azure）✅</span><span class=\"fs\">オンプレ VM なら Azure Migrate を使う（Q47 参照）</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>サービス</th><th>対象</th><th>方向</th><th>主な用途</th></tr></thead><tbody><tr><td>Azure Resource Mover ✅（Q46）</td><td>Azure リソース</td><td>Azure 内（RG / リージョン / サブスク間）</td><td>VM・NSG・NIC の移動</td></tr><tr><td>Azure Migrate ✅（Q47）</td><td>オンプレ・VMware・Hyper-V・AWS</td><td>オンプレ → Azure</td><td>リフト＆シフト移行</td></tr><tr><td>Data Migration Assistant</td><td>SQL Server DB</td><td>オンプレ → Azure SQL</td><td>SQL 移行評価</td></tr><tr><td>Azure Arc</td><td>オンプレサーバー</td><td>オンプレのまま管理</td><td>ハイブリッド管理（移行ではない）</td></tr><tr><td>Azure Lighthouse</td><td>Azure サブスクリプション</td><td>管理委任</td><td>MSP の顧客管理</td></tr></tbody></table><div class=\"wbox\">Resource Mover は「Azure 内の移動」、Azure Migrate は「オンプレから Azure への移行」。「移動」vs「移行」という方向の違いを意識する。</div></div></div>"},{"num":47,"id":"q47","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"問題46と同じシナリオ。VM2 はオンプレミス VM。\n\nVM2 を移動するために使用すべきものはどれですか？","choices":[{"text":"Azure Migrate","is_correct":true},{"text":"Azure Arc","is_correct":false},{"text":"Azure Lighthouse","is_correct":false},{"text":"Azure Resource Mover","is_correct":false},{"text":"Data Migration Assistant","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"155\" height=\"105\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#999\" stroke-width=\"1\"/><text x=\"97\" y=\"87\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#999\">移動対象</text><text x=\"97\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">Q46: Azure VM (VM1)</text><text x=\"97\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">現在: RG1 → RG2</text><text x=\"97\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">Q47: オンプレ VM (VM2)</text><text x=\"97\" y=\"115\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">→ Azure RG2 へ移行</text><rect x=\"253\" y=\"20\" width=\"205\" height=\"130\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"355\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Resource Mover (Q46)</text><text x=\"355\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Azure VM の移動</text><text x=\"355\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">RG/リージョン/サブスク</text><rect x=\"265\" y=\"62\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Azure VM → RG 間移動 ✅</text><rect x=\"265\" y=\"87\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">依存関係チェック自動化</text><rect x=\"265\" y=\"112\" width=\"181\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"355\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">移動前後の検証機能</text><rect x=\"535\" y=\"20\" width=\"145\" height=\"65\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"607\" y=\"38\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Migrate (Q47)</text><text x=\"607\" y=\"52\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">オンプレ→Azure</text><text x=\"607\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">評価+移行</text><rect x=\"535\" y=\"100\" width=\"145\" height=\"60\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"607\" y=\"116\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">逆は不可</text><text x=\"607\" y=\"130\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">AzureMigrate ≠</text><text x=\"607\" y=\"143\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Azure内の移動</text><text x=\"350\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Resource Mover: Azure内の移動 / Azure Migrate: オンプレ→Azureへの移行</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Azure Migrate</strong>はオンプレミス VM を Azure に移行（リフト＆シフト）するための統合ツールです。\n発見・評価・レプリケーション・移行の全プロセスをサポートし、\n移行後の RG2 への配置も設定できます。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Azure Arc：</strong>オンプレを Azure に移行せず<em>オンプレのまま</em> Azure で管理する拡張サービス。「移行」ではなく「管理拡張」。<br>\n<strong>Azure Lighthouse：</strong>MSP 向け管理委任。移行とは無関係。<br>\n<strong>Resource Mover：</strong>Azure 上のリソースを別 RG / リージョンに移動するもの。オンプレ VM の移行には使えません（Q46 参照）。<br>\n<strong>DMA：</strong>SQL データベースの移行評価専用。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">VM2 はオンプレ → Azure への移行が必要</span><span class=\"fs\">→ Azure Migrate（オンプレ → Azure）✅</span><span class=\"fs\">Azure 上の VM なら Resource Mover を使う（Q46 参照）</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>サービス</th><th>対象</th><th>方向</th><th>主な用途</th></tr></thead><tbody><tr><td>Azure Resource Mover ✅（Q46）</td><td>Azure リソース</td><td>Azure 内（RG / リージョン / サブスク間）</td><td>VM・NSG・NIC の移動</td></tr><tr><td>Azure Migrate ✅（Q47）</td><td>オンプレ・VMware・Hyper-V・AWS</td><td>オンプレ → Azure</td><td>リフト＆シフト移行</td></tr><tr><td>Data Migration Assistant</td><td>SQL Server DB</td><td>オンプレ → Azure SQL</td><td>SQL 移行評価</td></tr><tr><td>Azure Arc</td><td>オンプレサーバー</td><td>オンプレのまま管理</td><td>ハイブリッド管理（移行ではない）</td></tr><tr><td>Azure Lighthouse</td><td>Azure サブスクリプション</td><td>管理委任</td><td>MSP の顧客管理</td></tr></tbody></table><div class=\"wbox\">Resource Mover は「Azure 内の移動」、Azure Migrate は「オンプレから Azure への移行」。「移動」vs「移行」という方向の違いを意識する。</div></div></div>"},{"num":48,"id":"q48","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"ApexCore は Microsoft Entra テナントと Azure サブスクリプションを持ちます。IronClad の10人の開発者が ApexCore の Azure サブスクリプション内リソースグループスコープで Contributor ロールを持つ必要があります。開発者が既存の資格情報でサインインし続けられる必要があります。\n\n推奨すべきソリューションはどれですか？","choices":[{"text":"ApexCore の Entra テナントに IronClad 開発者用ゲストアカウントを作成する","is_correct":true},{"text":"ApexCore の Entra テナントにクラウド専用ユーザーアカウントを作成する","is_correct":false},{"text":"ApexCore と IronClad の AD フォレスト間にフォレスト信頼を構成する","is_correct":false},{"text":"IronClad と ApexCore の M365 テナント間に組織関係を構成する","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"145\" height=\"85\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"92\" y=\"63\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">IronClad 開発者</text><text x=\"92\" y=\"77\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">外部組織</text><text x=\"92\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">既存資格情報</text><rect x=\"240\" y=\"20\" width=\"215\" height=\"125\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"347\" y=\"68\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">ゲストアカウント作成</text><text x=\"347\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">ApexCore Entra テナント</text><text x=\"347\" y=\"95\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">B2B コラボレーション</text><rect x=\"252\" y=\"62\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"347\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">IronClad 既存IDで招待（B2B）✅</text><rect x=\"252\" y=\"87\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"347\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">IronClad 資格情報そのまま使用</text><rect x=\"252\" y=\"112\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"347\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Azure リソースへの RBAC 付与</text><rect x=\"252\" y=\"137\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"347\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">別テナント作成は不要</text><rect x=\"530\" y=\"35\" width=\"150\" height=\"65\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"605\" y=\"53\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">新テナント作成</text><text x=\"605\" y=\"67\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">管理が複雑</text><text x=\"605\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">不要なオーバーヘッド</text><rect x=\"530\" y=\"112\" width=\"150\" height=\"48\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"605\" y=\"122\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">パスワード発行</text><text x=\"605\" y=\"136\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">既存資格情報を</text><text x=\"605\" y=\"149\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">使わせない</text><line x1=\"165\" y1=\"77\" x2=\"238\" y2=\"88\" stroke=\"#7719AA\" stroke-width=\"2\" marker-end=\"url(#ap)\"/><text x=\"350\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">B2B: 外部ユーザーが自社IDでApexCoreリソースにアクセス。別テナント・パスワード発行不要</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>ApexCore の Entra テナントに IronClad 開発者のゲストアカウントを作成</strong>するのが正解です。\nMicrosoft Entra B2B コラボレーションにより、外部ユーザー（IronClad 開発者）を自テナントのゲストとして招待でき、\n<strong>IronClad 側の既存資格情報をそのまま使用</strong>して ApexCore の Azure リソースにアクセスできます。\n新しいパスワード不要、最小設定で実現できます。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>クラウド専用ユーザーアカウントの新規作成：</strong>IronClad 社員に別の資格情報を発行することになり「既存資格情報を使う」要件に反します。<br>\n<strong>AD フォレスト間の信頼関係：</strong>オンプレ AD との信頼設定で Entra ID の B2B とは異なります。複雑な設定が必要。<br>\n<strong>M365 テナント間の組織関係設定：</strong>Microsoft 365 のテナント設定であり Azure リソースへの RBAC アクセス制御とは別の仕組みです。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">外部組織のユーザーに既存 ID で Azure リソースアクセスを許可</span><span class=\"fs\">新しいパスワード発行 → 要件（既存資格情報）に反 → ✗</span><span class=\"fs\">B2B ゲスト招待 → 既存 ID そのまま・最小設定 → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>シナリオ</th><th>方法</th><th>既存 ID 利用</th><th>設定複雑さ</th></tr></thead><tbody><tr><td>外部ユーザーに Azure リソースアクセス ✅</td><td>B2B ゲスト招待</td><td>○</td><td>低</td></tr><tr><td>エンドユーザーへのアプリ提供</td><td>B2C テナント</td><td>○（SNS / メール）</td><td>中</td></tr><tr><td>オンプレ AD との統合</td><td>Entra Connect</td><td>○</td><td>高</td></tr><tr><td>MSP による顧客テナント管理</td><td>Azure Lighthouse</td><td>○</td><td>中</td></tr></tbody></table><div class=\"wbox\">B2B = 組織間コラボレーション（既存 ID 利用）。B2C = エンドユーザー向け（SNS ログイン等）。「外部組織のユーザー」= B2B ゲスト招待が鉄板。</div></div></div>"},{"num":49,"id":"q49","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"全 Azure リソースは環境・オーナー・部門・コストセンターの運用メタデータで明確に識別できる必要があります。このメタデータを使用してリソース全体のレポート生成ができる必要があります。\n\nソリューションに含めるべきものはどれですか？","choices":[{"text":"必須リソースタグの使用を強制する Azure Policy 定義","is_correct":true},{"text":"Azure REST API を使用するデータカタログ","is_correct":false},{"text":"親グループで階層を定義する管理グループ構造","is_correct":false},{"text":"Microsoft Entra 管理ユニット","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"135\" height=\"85\" rx=\"8\" fill=\"#FFF8E1\" stroke=\"#E67700\" stroke-width=\"2\"/><text x=\"87\" y=\"63\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#E67700\">全リソース</text><text x=\"87\" y=\"77\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">Environment/Owner</text><text x=\"87\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">タグ要件</text><rect x=\"230\" y=\"20\" width=\"215\" height=\"125\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"337\" y=\"68\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Policy（タグ強制）</text><text x=\"337\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Deny/Modify 効果</text><text x=\"337\" y=\"95\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">自動付与・強制</text><rect x=\"242\" y=\"62\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"337\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">タグなし → デプロイ拒否（Deny）</text><rect x=\"242\" y=\"87\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"337\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Modify: 既存リソースも自動修復</text><rect x=\"242\" y=\"112\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"337\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">コスト管理・レポートに活用</text><rect x=\"242\" y=\"137\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"337\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">全リソース種別に一括適用</text><rect x=\"525\" y=\"35\" width=\"155\" height=\"70\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"602\" y=\"56\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">ARM テンプレート</text><text x=\"602\" y=\"70\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">デプロイ時のみ</text><text x=\"602\" y=\"83\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">既存リソース適用❌</text><rect x=\"525\" y=\"118\" width=\"155\" height=\"47\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"602\" y=\"127\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">手動タグ付け</text><text x=\"602\" y=\"141\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">一貫性なし</text><text x=\"602\" y=\"154\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">スケールしない</text><text x=\"350\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Policy+Modify: 既存リソースも修復タスクでタグ自動付与。ARM/手動は網羅性に欠ける</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>必須リソースタグを強制する Azure Policy 定義</strong>が正解です。\nPolicy の Deny 効果でタグのないリソースのデプロイを拒否し、\nModify 効果で既存リソースへのタグ自動付与（修復タスク）も可能です。\n<code>Environment</code>・<code>Owner</code> などのタグで Cost Management でのレポート・集計に活用できます。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Azure REST API を使うデータカタログ：</strong>Azure Purview などのデータカタログはデータ資産のメタデータ管理用。リソースへのタグ強制機能ではありません。<br>\n<strong>管理グループの階層定義：</strong>サブスクリプションの階層管理であり個々のリソースへのタグ付けとは異なります。<br>\n<strong>Entra 管理ユニット：</strong>Entra ID のユーザー・グループ管理の委任用途。Azure リソースへのタグ付けとは無関係。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">全リソースへのタグ付けを「強制」したい</span><span class=\"fs\">任意タグ → ガバナンス不可 → ✗</span><span class=\"fs\">ARMテンプレートにタグ → 既存リソースには不適用 → ✗</span><span class=\"fs\">Azure Policy（Deny/Modify）→ デプロイ拒否＋自動付与 → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>Policy の効果</th><th>タグ付けへの使い方</th><th>既存リソースへの適用</th></tr></thead><tbody><tr><td>Deny</td><td>タグなしリソースのデプロイを拒否</td><td>×（新規のみ）</td></tr><tr><td>Append</td><td>タグを追加（上書きなし）</td><td>×（新規のみ）</td></tr><tr><td>Modify ✅</td><td>タグを追加・変更</td><td>○（修復タスクで可能）</td></tr><tr><td>Audit</td><td>タグなしをログ記録（拒否なし）</td><td>○（記録のみ）</td></tr></tbody></table><div class=\"wbox\">Modify で既存リソースにタグを付与するには「修復タスク（Remediation Task）」を手動で実行またはスケジュール設定する必要がある。Policy 割り当てだけでは既存リソースに自動適用されない。</div></div></div>"},{"num":50,"id":"q50","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"ニューヨークとロサンゼルスのオンプレミスデータセンターが East US および West US の Azure リージョンと ExpressRoute Global Reach 回線で接続されています。要件：①VNet のワークロードからインターネットへの送信トラフィックが最寄りのオンプレミス拠点経由でルーティングされること、②1拠点が利用不可になった場合に自動フェールオーバーされること。\n\nVNet からオンプレミス拠点へのルーティング設定に使用すべきものはどれですか？","choices":[{"text":"BGP（Border Gateway Protocol）","is_correct":true},{"text":"Azure 既定ルート","is_correct":false},{"text":"ユーザー定義ルート（UDR）","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">ExpressRoute Global Reach + Traffic Manager（Q50-51）</div><svg viewBox=\"0 0 740 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:740px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"740\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"376\" y=\"26\" width=\"228\" height=\"98\" rx=\"8\" fill=\"#0072C6\" fill-opacity=\"0.06\" stroke=\"#0072C6\" stroke-width=\"1\" stroke-dasharray=\"5,3\"/>\n<text x=\"384\" y=\"40\" font-size=\"8.5\" font-weight=\"600\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">Azure</text>\n<rect x=\"146\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#546E7A\" stroke-width=\"1.5\"/>\n<rect x=\"152\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#546E7A\" fill-opacity=\"0.18\"/>\n<text x=\"190\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#546E7A\" font-family=\"Segoe UI,Arial,sans-serif\">SRV</text>\n<text x=\"190\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">NYC / LA</text>\n<text x=\"190\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" sans-serif\">ER Circuit 1</text>\n<rect x=\"175\" y=\"55\" width=\"130\" height=\"80\" rx=\"7\" fill=\"#112240\" stroke=\"#F97C00\" stroke-width=\"1.5\"/>\n<rect x=\"181\" y=\"60\" width=\"118\" height=\"24\" rx=\"4\" fill=\"#F97C00\" fill-opacity=\"0.18\"/>\n<text x=\"240\" y=\"76\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#F97C00\" font-family=\"Segoe UI,Arial,sans-serif\">MSEE</text>\n<text x=\"240\" y=\"96\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">MS Enterprise</text>\n<text x=\"240\" y=\"107\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Edge (東京)</text>\n<line x1=\"305\" y1=\"95\" x2=\"345\" y2=\"95\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"325\" y=\"90\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Global Reach</text>\n<rect x=\"350\" y=\"55\" width=\"130\" height=\"80\" rx=\"7\" fill=\"#112240\" stroke=\"#F97C00\" stroke-width=\"1.5\"/>\n<rect x=\"356\" y=\"60\" width=\"118\" height=\"24\" rx=\"4\" fill=\"#F97C00\" fill-opacity=\"0.18\"/>\n<text x=\"415\" y=\"76\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#F97C00\" font-family=\"Segoe UI,Arial,sans-serif\">MSEE</text>\n<text x=\"415\" y=\"96\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">MS Enterprise</text>\n<text x=\"415\" y=\"107\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Edge (欧州)</text>\n<line x1=\"480\" y1=\"95\" x2=\"520\" y2=\"115\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"500\" y=\"90\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">ER Circuit 2</text>\n<rect x=\"525\" y=\"85\" width=\"110\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#7a9cbf\" stroke-width=\"1.5\"/>\n<rect x=\"531\" y=\"90\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#7a9cbf\" fill-opacity=\"0.18\"/>\n<text x=\"580\" y=\"106\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">DC-EU</text>\n<text x=\"580\" y=\"126\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">欧州 DC</text>\n<text x=\"580\" y=\"137\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">オンプレ</text>\n<line x1=\"240\" y1=\"55\" x2=\"240\" y2=\"20\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<line x1=\"415\" y1=\"55\" x2=\"415\" y2=\"20\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<rect x=\"255\" y=\"5\" width=\"150\" height=\"35\" rx=\"7\" fill=\"#112240\" stroke=\"#E040FB\" stroke-width=\"1.5\"/>\n<rect x=\"261\" y=\"10\" width=\"138\" height=\"24\" rx=\"4\" fill=\"#E040FB\" fill-opacity=\"0.18\"/>\n<text x=\"330\" y=\"26\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#E040FB\" font-family=\"Segoe UI,Arial,sans-serif\">TM</text>\n<text x=\"330\" y=\"46\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Traffic Manager</text>\n<text x=\"330\" y=\"57\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">DR フェイルオーバー</text>\n<text x=\"320\" y=\"170\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Global Reach: 2つのERサーキットをMSバックボーン経由で接続</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>BGP（Border Gateway Protocol）</strong>は ExpressRoute（Global Reach 含む）で\n<em>唯一</em>サポートされる動的ルーティングプロトコルです。\nAS パスプリペンディングや Local Preference でトラフィックの優先経路を制御でき、\n最寄りの拠点経由でルーティングを最適化できます。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Azure 既定ルート：</strong>VNet 内のシステムルート。Dynamic WAN ルーティングには使えません。<br>\n<strong>ユーザー定義ルート（UDR）：</strong>VNet 内のルーティングテーブルの上書き。\nExpressRoute / BGP の動的ルーティングを補完しますが動的ルーティングプロトコル自体ではありません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">ExpressRoute + 動的ルーティング</span><span class=\"fs\">→ BGP が唯一の選択肢 ✅</span><span class=\"fs\">Global Reach（拠点間直接接続）も BGP ベース</span><span class=\"fs\">AS パスプリペンディング → 特定の経路を優先</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>プロトコル</th><th>種別</th><th>ExpressRoute</th><th>動的フェールオーバー</th><th>用途</th></tr></thead><tbody><tr><td>BGP ✅</td><td>EGP（外部）</td><td>○（必須）</td><td>○（自動）</td><td>インターネット・WAN・ExpressRoute</td></tr><tr><td>OSPF</td><td>IGP（内部）</td><td>×</td><td>○</td><td>LAN 内ルーティング</td></tr><tr><td>EIGRP</td><td>IGP（Cisco 独自）</td><td>×</td><td>○</td><td>Cisco LAN</td></tr><tr><td>HSRP</td><td>ゲートウェイ冗長（Cisco）</td><td>×</td><td>○（LAN 内）</td><td>LAN 内 GW 冗長化</td></tr><tr><td>VRRP</td><td>ゲートウェイ冗長（標準）</td><td>×</td><td>○（LAN 内）</td><td>LAN 内 GW 冗長化</td></tr><tr><td>静的ルート</td><td>なし</td><td>△（組み合わせ可）</td><td>×</td><td>シンプル環境</td></tr></tbody></table><div class=\"wbox\">ExpressRoute は BGP が必須（静的ルートのみでは動作しない）。HSRP / VRRP は LAN 内のゲートウェイ冗長化プロトコルで WAN フェールオーバーには使えない。</div></div></div>"},{"num":51,"id":"q51","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"問題50と同じシナリオ。\n\nフェールオーバー後の自動ルーティング設定に使用すべきものはどれですか？","choices":[{"text":"BGP（Border Gateway Protocol）","is_correct":true},{"text":"HSRP（Hot Standby Routing Protocol）","is_correct":false},{"text":"VRRP（Virtual Router Redundancy Protocol）","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">ExpressRoute Global Reach + Traffic Manager（Q50-51）</div><svg viewBox=\"0 0 740 150 rial,sans-serif\">自動ルーティング</text>\n<line x1=\"474\" y1=\"75\" x2=\"500\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n</svg></div><svg viewBox=\"0 0 660 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:660px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"660\" height=\"185\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/></marker>\n</defs>\n<rect x=\"15\" y=\"85\" width=\"110\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#7a9cbf\" stroke-width=\"1.5\"/>\n<rect x=\"21\" y=\"90\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#7a9cbf\" fill-opacity=\"0.18\"/>\n<text x=\"70\" y=\"106\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">DC-JP</text>\n<text x=\"70\" y=\"126\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">東京 DC</text>\n<text x=\"70\" y=\"137\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">オンプレ</text>\n<line x1=\"125\" y1=\"115\" x2=\"170\" y2=\"95\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"147\" y=\"90\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">ER Circuit 1</text>\n<rect x=\"175\" y=\"55\" width=\"130\" height=\"80\" rx=\"7\" fill=\"#112240\" stroke=\"#F97C00\" stroke-width=\"1.5\"/>\n<rect x=\"181\" y=\"60\" width=\"118\" height=\"24\" rx=\"4\" fill=\"#F97C00\" fill-opacity=\"0.18\"/>\n<text x=\"240\" y=\"76\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#F97C00\" font-family=\"Segoe UI,Arial,sans-serif\">MSEE</text>\n<text x=\"240\" y=\"96\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">MS Enterprise</text>\n<text x=\"240\" y=\"107\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Edge (東京)</text>\n<line x1=\"305\" y1=\"95\" x2=\"345\" y2=\"95\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"325\" y=\"90\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Global Reach</text>\n<rect x=\"350\" y=\"55\" width=\"130\" height=\"80\" rx=\"7\" fill=\"#112240\" stroke=\"#F97C00\" stroke-width=\"1.5\"/>\n<rect x=\"356\" y=\"60\" width=\"118\" height=\"24\" rx=\"4\" fill=\"#F97C00\" fill-opacity=\"0.18\"/>\n<text x=\"415\" y=\"76\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#F97C00\" font-family=\"Segoe UI,Arial,sans-serif\">MSEE</text>\n<text x=\"415\" y=\"96\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">MS Enterprise</text>\n<text x=\"415\" y=\"107\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Edge (欧州)</text>\n<line x1=\"480\" y1=\"95\" x2=\"520\" y2=\"115\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"500\" y=\"90\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">ER Circuit 2</text>\n<rect x=\"525\" y=\"85\" width=\"110\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#7a9cbf\" stroke-width=\"1.5\"/>\n<rect x=\"531\" y=\"90\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#7a9cbf\" fill-opacity=\"0.18\"/>\n<text x=\"580\" y=\"106\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">DC-EU</text>\n<text x=\"580\" y=\"126\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">欧州 DC</text>\n<text x=\"580\" y=\"137\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">オンプレ</text>\n<line x1=\"240\" y1=\"55\" x2=\"240\" y2=\"20\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<line x1=\"415\" y1=\"55\" x2=\"415\" y2=\"20\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<rect x=\"255\" y=\"5\" width=\"150\" height=\"35\" rx=\"7\" fill=\"#112240\" stroke=\"#E040FB\" stroke-width=\"1.5\"/>\n<rect x=\"261\" y=\"10\" width=\"138\" height=\"24\" rx=\"4\" fill=\"#E040FB\" fill-opacity=\"0.18\"/>\n<text x=\"330\" y=\"26\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#E040FB\" font-family=\"Segoe UI,Arial,sans-serif\">TM</text>\n<text x=\"330\" y=\"46\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Traffic Manager</text>\n<text x=\"330\" y=\"57\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">DR フェイルオーバー</text>\n<text x=\"320\" y=\"170\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Global Reach: 2つのERサーキットをMSバックボーン経由で接続</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>BGP</strong>は障害発生時に障害ルートのアドバタイズを自動的に取り消し、\n代替経路への再配布を行います。\nこれにより<strong>手動操作なしでフェールオーバーが自動実現</strong>されます。\nExpressRoute の冗長回線（プライマリ / セカンダリ）間のフェールオーバーも BGP が処理します。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>HSRP：</strong>Cisco 独自の LAN ゲートウェイ冗長化プロトコル。WAN レベルのルーティング自動切り替えには使えません。<br>\n<strong>VRRP：</strong>標準の LAN ゲートウェイ冗長化プロトコル。同様に WAN には対応しません。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">ExpressRoute 障害時の自動フェールオーバー</span><span class=\"fs\">HSRP / VRRP → LAN 内のゲートウェイ冗長 → WAN には ✗</span><span class=\"fs\">BGP → ルートアドバタイズ自動変更 → 手動不要 → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>プロトコル</th><th>種別</th><th>ExpressRoute</th><th>動的フェールオーバー</th><th>用途</th></tr></thead><tbody><tr><td>BGP ✅</td><td>EGP（外部）</td><td>○（必須）</td><td>○（自動）</td><td>インターネット・WAN・ExpressRoute</td></tr><tr><td>OSPF</td><td>IGP（内部）</td><td>×</td><td>○</td><td>LAN 内ルーティング</td></tr><tr><td>EIGRP</td><td>IGP（Cisco 独自）</td><td>×</td><td>○</td><td>Cisco LAN</td></tr><tr><td>HSRP</td><td>ゲートウェイ冗長（Cisco）</td><td>×</td><td>○（LAN 内）</td><td>LAN 内 GW 冗長化</td></tr><tr><td>VRRP</td><td>ゲートウェイ冗長（標準）</td><td>×</td><td>○（LAN 内）</td><td>LAN 内 GW 冗長化</td></tr><tr><td>静的ルート</td><td>なし</td><td>△（組み合わせ可）</td><td>×</td><td>シンプル環境</td></tr></tbody></table><div class=\"wbox\">ExpressRoute は BGP が必須（静的ルートのみでは動作しない）。HSRP / VRRP は LAN 内のゲートウェイ冗長化プロトコルで WAN フェールオーバーには使えない。</div></div></div>"},{"num":52,"id":"q52","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"100個の Microsoft SQL Server Integration Services（SSIS）パッケージが10個のオンプレミス SQL Server データベースにデータをロードしています。これら10個のDBを Azure SQL Database に移行予定です。既存の SSIS パッケージが Azure SQL Database をターゲットとして使用できるように Azure SSIS パッケージを作成するソリューションを推奨する必要があります。\n\n推奨に含めるべきものはどれですか？","choices":[{"text":"Azure Data Factory","is_correct":true},{"text":"Data Migration Assistant","is_correct":false},{"text":"Azure Data Catalog","is_correct":false},{"text":"SQL Server Migration Assistant（SSMA）","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 155\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"150\" height=\"85\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"95\" y=\"63\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">100個の SSIS パッケージ</text><text x=\"95\" y=\"77\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">オンプレ SQL Server 2019</text><text x=\"95\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">リフト＆シフト</text><rect x=\"245\" y=\"20\" width=\"215\" height=\"125\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"352\" y=\"68\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Data Factory</text><text x=\"352\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">SSIS 統合ランタイム</text><text x=\"352\" y=\"95\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">コード変更なし</text><rect x=\"257\" y=\"62\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"352\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Azure-SSIS IR: パッケージそのまま実行</text><rect x=\"257\" y=\"87\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"352\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">既存 .dtsx ファイルを変更不要 ✅</text><rect x=\"257\" y=\"112\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"352\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">マネージド PaaS（管理最小）</text><rect x=\"257\" y=\"137\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"352\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ADF パイプラインと統合可能</text><rect x=\"535\" y=\"35\" width=\"145\" height=\"60\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"607\" y=\"51\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Azure Synapse</text><text x=\"607\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Azure-SSIS IR</text><text x=\"607\" y=\"78\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">非対応</text><rect x=\"535\" y=\"108\" width=\"145\" height=\"52\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"607\" y=\"120\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">SQL MI</text><text x=\"607\" y=\"134\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">SSIS実行環境</text><text x=\"607\" y=\"147\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">別途構成複雑</text><line x1=\"170\" y1=\"77\" x2=\"243\" y2=\"90\" stroke=\"#7719AA\" stroke-width=\"2\" marker-end=\"url(#ap)\"/><text x=\"350\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">ADF Azure-SSIS IR: 既存SSISパッケージをそのままクラウド実行。移行コスト最小</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Azure Data Factory</strong>は Azure-SSIS Integration Runtime を使って\n既存の SSIS パッケージ（.dtsx ファイル）を<strong>コード変更なし</strong>で Azure 上で実行できます。\n100個のパッケージをそのまま移行できるリフト＆シフトの最良選択肢です。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Data Migration Assistant（DMA）：</strong>SQL Server DB の移行評価ツール。SSIS パッケージの実行環境ではありません。<br>\n<strong>Azure Data Catalog：</strong>データ資産のメタデータ管理・発見サービス（現在は Microsoft Purview に統合）。データ実行とは無関係。<br>\n<strong>SSMA：</strong>異種 DB（Oracle・MySQL 等）から SQL Server への移行ツール。SSIS パッケージとは無関係。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">100個の SSIS パッケージを Azure に移行（コード変更なし）</span><span class=\"fs\">Azure Synapse → Azure-SSIS IR 非対応 → ✗</span><span class=\"fs\">ADF → Azure-SSIS IR でパッケージをそのまま実行 → ✅</span><span class=\"fs\">「既存 SSIS パッケージ」+「コード変更なし」= ADF + Azure-SSIS IR</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>SSIS 移行オプション</th><th>コード変更</th><th>マネージド</th><th>SSIS 実行</th><th>備考</th></tr></thead><tbody><tr><td>ADF + Azure-SSIS IR ✅</td><td>不要</td><td>○</td><td>○</td><td>リフト＆シフトの最良手</td></tr><tr><td>SQL MI（SSIS エージェント）</td><td>不要</td><td>△</td><td>○</td><td>複雑な構成が必要</td></tr><tr><td>Synapse + SSIS</td><td>×</td><td>○</td><td>×</td><td>Azure-SSIS IR 非対応</td></tr><tr><td>コンテナ化して再構築</td><td>必要</td><td>○</td><td>間接</td><td>工数大</td></tr></tbody></table><div class=\"wbox\">SSIS 移行の Azure 推奨パスは ADF + Azure-SSIS IR。「既存パッケージを変更せず移行」= ADF を選ぶ。</div></div></div>"},{"num":53,"id":"q53","domain":"インフラストラクチャ設計","domain_code":"イン","domain_color":"#C50F1F","question_text":"Linux ノードを使用する AKS（Azure Kubernetes Service）ソリューションをデプロイ予定です。要件：①スケールアウト時のコンピューティング容量プロビジョニング時間の短縮、②Linux コンテナワークロードの自動スケーリングサポート、③継続的な管理オーバーヘッドの最小化。\n\n推奨するスケーリングオプションはどれですか？","choices":[{"text":"仮想ノード（Virtual nodes）","is_correct":true},{"text":"Horizontal Pod Autoscaler（HPA）","is_correct":false},{"text":"クラスターオートスケーラー","is_correct":false},{"text":"Virtual Kubelet","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:10px auto;border-radius:10px;background:#F8FAFF;font-family:'Segoe UI',sans-serif\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"140\" height=\"85\" rx=\"8\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"2\"/><text x=\"90\" y=\"63\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#0072C6\">AKS クラスター</text><text x=\"90\" y=\"77\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">通常 VM ノード</text><text x=\"90\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">プロビジョニング遅い</text><rect x=\"240\" y=\"20\" width=\"215\" height=\"130\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"347\" y=\"71\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">仮想ノード</text><text x=\"347\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">ACI にバースト</text><text x=\"347\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">秒単位で起動</text><rect x=\"252\" y=\"62\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"347\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">コンテナ秒単位起動 ✅</text><rect x=\"252\" y=\"87\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"347\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">VM プロビジョニング不要</text><rect x=\"252\" y=\"112\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"347\" y=\"125\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">自動スケールアウト ✅</text><rect x=\"252\" y=\"137\" width=\"191\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"347\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Linux コンテナ対応 ✅</text><rect x=\"530\" y=\"35\" width=\"150\" height=\"75\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"605\" y=\"58\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">Azure Container Instances</text><text x=\"605\" y=\"72\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">サーバーレスコンテナ</text><text x=\"605\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">秒単位課金</text><rect x=\"530\" y=\"122\" width=\"150\" height=\"48\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"605\" y=\"132\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Cluster Autoscaler</text><text x=\"605\" y=\"146\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">VM ノード追加</text><text x=\"605\" y=\"159\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">数分かかる</text><line x1=\"160\" y1=\"77\" x2=\"238\" y2=\"92\" stroke=\"#0072C6\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"455\" y1=\"92\" x2=\"528\" y2=\"73\" stroke=\"#107C10\" stroke-width=\"2\" marker-end=\"url(#ag)\"/><text x=\"350\" y=\"157\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">仮想ノード: AKSがACIにバーストしてVMプロビジョニングを回避。スケールを秒単位に短縮</text></svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>仮想ノード（Virtual Nodes）</strong>は AKS が Azure Container Instances（ACI）にバーストすることを可能にします。\nVM ノードのプロビジョニング（数分）をスキップし、コンテナを<strong>秒単位</strong>で起動できます。\nLinux コンテナに対応しており今回の要件を満たします。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>HPA：</strong>既存ノード上の Pod 数を増減しますが、ノードキャパシティが不足すると VM プロビジョニングが必要になりスケール時間は短縮されません。<br>\n<strong>クラスターオートスケーラー：</strong>VM ノードを追加・削除しますが VM プロビジョニングに数分かかります。「プロビジョニング時間の短縮」要件を満たしません。<br>\n<strong>Virtual Kubelet：</strong>仮想ノードの旧実装方式。現在は<em>非推奨（Deprecated）</em>。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">「秒単位のスケール」「VM プロビジョニング不要」が要件</span><span class=\"fs\">クラスターオートスケーラー → VM 追加（数分） → 秒単位にならない → ✗</span><span class=\"fs\">HPA → Pod 数増加のみ → ノード不足時に VM 必要 → ✗</span><span class=\"fs\">仮想ノード（ACI）→ VM なしでコンテナを秒単位起動 → ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>スケール方法</th><th>起動時間</th><th>VM 追加</th><th>主な用途</th></tr></thead><tbody><tr><td>HPA</td><td>Pod 起動のみ（秒〜分）</td><td>×</td><td>CPU / メモリ負荷増加時</td></tr><tr><td>クラスターオートスケーラー</td><td>VM + Pod（数分）</td><td>○</td><td>持続的な負荷増加</td></tr><tr><td>仮想ノード（ACI）✅</td><td>コンテナのみ（秒）</td><td>×（ACI 使用）</td><td>バースト・スパイク対応</td></tr><tr><td>KEDA</td><td>Pod 起動のみ（秒〜）</td><td>×</td><td>イベント駆動スケール</td></tr><tr><td>Virtual Kubelet（非推奨）</td><td>—</td><td>—</td><td>使わない</td></tr></tbody></table><div class=\"wbox\">「秒単位スケール」= 仮想ノード（ACI）が答え。クラスターオートスケーラーは VM プロビジョニングがあるため「秒単位」にならない。Virtual Kubelet は Deprecated なので選ばない。</div></div></div>"},{"num":54,"id":"q54","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"複数のオンプレミス SQL Server からのデータを Azure の分析ソリューションに取り込み・処理するデータパイプラインを設計します。パイプラインは：①定期的にDB変更を Azure Blob Storage のステージングエリアにエクスポート、②高度に並列化されたデータロードプロセスでクレンジング・変換、③データウェアハウスにロード、④処理済みデータで OLAP モデルをリフレッシュ、⑤数千の同時エンドユーザーへのアクセス提供。\n\nデータウェアハウスの実装に使用すべきものはどれですか？","choices":[{"text":"Azure Synapse Analytics dedicated SQL pools","is_correct":true},{"text":"Apache Spark pool","is_correct":false},{"text":"Azure Data Lake Analytics","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">データパイプライン: SQL → ADF → Synapse（Q54-55）</div><svg viewBox=\"0 0 760 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:760px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"760\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/> t-size=\"11\" font-weight=\"700\" fill=\"#E040FB\" font-family=\"Segoe UI,Arial,sans-serif\">ADF</text>\n<text x=\"240\" y=\"91\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Azure Data</text>\n<text x=\"240\" y=\"102\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Factory</text>\n<text x=\"240\" y=\"155\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Mapping Data Flow</text>\n<line x1=\"310\" y1=\"97\" x2=\"350\" y2=\"80\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<line x1=\"310\" y1=\"97\" x2=\"350\" y2=\"120\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<rect x=\"355\" y=\"45\" width=\"130\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#F97C00\" stroke-width=\"1.5\"/>\n<rect x=\"361\" y=\"50\" width=\"118\" height=\"24\" rx=\"4\" fill=\"#F97C00\" fill-opacity=\"0.18\"/>\n<text x=\"420\" y=\"66\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#F97C00\" font-family=\"Segoe UI,Arial,sans-serif\">ADLS</text>\n<text x=\"420\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Data Lake</text>\n<text x=\"420\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Storage (Staging)</text>\n<rect x=\"355\" y=\"115\" width=\"130\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#6264A7\" stroke-width=\"1.5\"/>\n<rect x=\"361\" y=\"120\" width=\"118\" height=\"24\" rx=\"4\" fill=\"#6264A7\" fill-opacity=\"0.18\"/>\n<text x=\"420\" y=\"136\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#6264A7\" font-family=\"Segoe UI,Arial,sans-serif\">Synapse</text>\n<text x=\"420\" y=\"156\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Synapse SQL</text>\n<text x=\"420\" y=\"167\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Pool (DWH)</text>\n<line x1=\"485\" y1=\"75\" x2=\"525\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"505\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">分析</text>\n<rect x=\"530\" y=\"45\" width=\"100\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#E040FB\" stroke-width=\"1.5\"/>\n<rect x=\"536\" y=\"50\" width=\"88\" height=\"24\" rx=\"4\" fill=\"#E040FB\" fill-opacity=\"0.18\"/>\n<text x=\"580\" y=\"66\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#E040FB\" font-family=\"Segoe UI,Arial,sans-serif\">PBI</text>\n<text x=\"580\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Power BI</text>\n<text x=\"580\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">可視化</text>\n<text x=\"310\" y=\"190\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">ADF → ADLS Staging → Synapse PolyBase COPY</text>\n\n</svg></div>\n<div class=\"eb eb-ok\"><div class=\"eb-lbl\">なぜ正解か</div><div class=\"eb-body\">\n<strong>Azure Synapse Analytics dedicated SQL pools</strong>は MPP（Massively Parallel Processing）アーキテクチャで、\n最大 60 のコンピューティングノードがデータを分散処理します。\nOLAP ワークロードのリフレッシュと PolyBase による<strong>並列データロード</strong>に最適化されています。\n</div></div><div class=\"eb eb-ng\"><div class=\"eb-lbl\">各選択肢が不正解な理由</div><div class=\"eb-body\">\n<strong>Apache Spark pool：</strong>インメモリ分散処理に優れますが SQL 専用の OLAP 向け MPP アーキテクチャではありません。<br>\n<strong>Azure Data Lake Analytics：</strong>U-SQL を使った大規模バッチ分析サービスで現在は<em>廃止予定（2024年9月に提供終了）</em>。試験では正解として選ばないこと。\n</div></div><div class=\"eb eb-fl\"><div class=\"eb-lbl\">🎯 迷わず解くための判断フロー</div><div class=\"eb-body\"><div class=\"fwrap\"><span class=\"fs\">大規模 OLAP / データウェアハウス + MPP + PolyBase 並列ロード</span><span class=\"fs\">Data Lake Analytics → 廃止予定 → 即除外</span><span class=\"fs\">Spark pool → 分析処理向け（SQL DWH の MPP ではない） → ✗</span><span class=\"fs\">→ Synapse dedicated SQL pool ✅</span></div></div></div><div class=\"eb eb-dp\"><div class=\"eb-lbl\">周辺知識・よく出る引っかけ</div><div class=\"eb-body\"><table class=\"etbl\"><thead><tr><th>Synapse のコンピューティング</th><th>アーキテクチャ</th><th>得意なワークロード</th><th>SQL 対応</th></tr></thead><tbody><tr><td>dedicated SQL pool ✅</td><td>MPP（最大 60 ノード）</td><td>OLAP・大規模 DWH</td><td>○（T-SQL）</td></tr><tr><td>serverless SQL pool</td><td>オンデマンド</td><td>アドホッククエリ</td><td>○（T-SQL）</td></tr><tr><td>Apache Spark pool</td><td>分散インメモリ</td><td>ETL・ML・大規模変換</td><td>○（Spark SQL）</td></tr></tbody></table><div class=\"wbox\">Data Lake Analytics は 2024 年 9 月に廃止完了。試験に出たら正解候補から除外。dedicated と serverless の使い分けも重要（dedicated = 常設 DWH / serverless = アドホック）。</div></div></div>"},{"num":55,"id":"q55","domain":"データストレージ設計","domain_code":"デー","domain_color":"#0072C6","question_text":"問題54と同じシナリオ。処理済みデータで OLAP モデルをリフレッシュし、数千の同時エンドユーザーへのアクセスを提供するサービング層。\n\nサービング層の実装に使用すべきものはどれですか？","choices":[{"text":"Azure Analysis Services","is_correct":true},{"text":"Apache Spark pool（Azure Synapse Analytics）","is_correct":false},{"text":"Azure Synapse Analytics dedicated SQL pools","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">データパイプライン: SQL → ADF → Synapse（Q54-55）</div><svg viewBox=\"0 0 760 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:760px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"760\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" f
