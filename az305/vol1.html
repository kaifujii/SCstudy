copy</strong>: Windows の標準コピーツールで、ローカル間やSMB間のコピーには使用しますが、Azure ストレージへの直接転送は非効率です。<br><strong>Azure Storage Mover</strong>: マネージドな移行サービスで、SMB から Azure Files や Blob への移行をサポートしますが、AzCopy ほどシンプルではありません。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「継続的な同期」→ Azure File Sync、「一回限りの大量移行」→ AzCopy または Storage Mover。1TB 程度であれば Data Box（物理デバイス）は不要です。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">AzCopy の主な機能：SAS トークンまたはマネージドID による認証、並列転送（--parallel-level）、チェックポイント再開（中断後の再開）、ジョブログ管理。`azcopy copy 'ソース' 'https://...'` のシンプルな構文で使用できます。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/common/storage-use-azcopy-v10\" target=\"_blank\">AzCopy を使ってみる</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 230\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6 el\">なぜ正解なのか</div><div class=\"exp-block-body\">正解は<strong>3</strong>番の構成です。Log Analytics ワークスペース（WS1）にプライベートリンクでアクセスするには、Azure Monitor Private Link Scope（AMPLS）を作成し、WS1 をスコープに追加した上で、VNet にプライベートエンドポイントを作成します。構成3はこの要件を満たす正しいアーキテクチャです。プライベートエンドポイントにより、パブリックインターネットを経由せずに Log Analytics にアクセスできます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>1</strong>: AMPLS の構成が不完全か、プライベートエンドポイントが欠如している構成です。<br><strong>2</strong>: VNet リンクまたは DNS 設定が不適切な構成で、プライベートエンドポイントへの名前解決が機能しません。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Log Analytics のプライベートリンクは通常のサービスとは異なり、AMPLS（Azure Monitor Private Link Scope）を経由します。AMPLS に複数の Log Analytics ワークスペースや Application Insights を追加でき、1つのプライベートエンドポイントで管理できます。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">AMPLS の注意点：プライベートリンクを使用すると、ワークスペースのパブリックアクセスを制限できます。`publicNetworkAccessForIngestion` と `publicNetworkAccessForQuery` を「無効」に設定すると、プライベートリンク経由のみのアクセスになります。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/azure-monitor/logs/private-link-security\" target=\"_blank\">Azure Private Link を使用した Azure Monitor の安全なリンク</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 660 250\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" ref x=\"580\" y=\"171\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">セキュリティ分析</text>\n<rect x=\"0\" y=\"228\" width=\"660\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"330\" y=\"243\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">DCR = データ収集の定義・フィルタリング・ルーティングルール</text>\n</svg>"},{"num":40,"id":"q40","domain":"ID・ガバナンス・監視","question_text":"WS1 という名前の Log Analytics ワークスペース（パブリックエンドポイント経由でアクセス可能）を含む Azure サブスクリプションがあります。\n\nサブスクリプションには、リージョンと構成でグループ化された以下の Windows 仮想マシンが含まれています。\n\n・米国中部: Arc 対応の 20 台の VM（マシン設定アドオンなし）\n・米国東部: Arc 対応の 15 台の VM（マシン設定アドオンあり）\n・米国西部: 10 台の VM（Arc なし）\n\nWindows VM のゲスト構成証明を有効化し、データを WS1 に収集したいと考えています。\n\nすべての Windows VM のゲスト構成証明を有効化するために必要なデータ収集ルール（DCR）の数は最低いくつですか？","choices":[{"text":"0","is_correct":true},{"text":"1","is_correct":false},{"text":"2","is_correct":false},{"text":"3","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">正解は<strong>0</strong>です。Q39 のシナリオの別の側面で、追加で作成が必要な Log Analytics ワークスペースの数は0です。既存の WS1 を AMPLS に追加するだけで要件を満たせるため、新規のワークスペース作成は不要です。プライベートリンク設定は既存のワークスペースに対して適用できます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>1, 2, 3</strong>: 追加のワークスペースは不要です。既存の WS1 に AMPLS とプライベートエンドポイントを設定するだけで、プライベートネットワークからのセキュアなアクセスが実現できます。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「プライベートアクセスに切り替える」ために新しいワークスペースを作成する必要はありません。既存のリソースに対してプライベートリンク設定を追加するだけです。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">AMPLS に追加できるリソース：Log Analytics ワークスペース、Application Insights（クラシックおよびワークスペースベース）。1つの AMPLS から最大300個のワークスペースを参照できます。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/azure-monitor/logs/private-link-configure\" target=\"_blank\">Azure Monitor プライベートリンクの構成</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 660 250\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.4)\"/>\n      </filter>\n    </defs>\n<rect width=\"660\" height=\"250\" fill=\"#0a0f1e\" rx=\"12\"/>\n<rect x=\"198\" y=\"28\" width=\"104\" height=\"212\" rx=\"10\" fill=\"#0a1628\" stroke=\"#fbbf24\" stroke-width=\"1.5\" stroke-dasharray=\"5,3\"/>\n<text x=\"206\" y=\"42\" font-family=\"Outfit,sans-serif\" font-size=\"10\" fill=\"#fbbf24\" font-weight=\"600\">Data Collection Rules</text>\n<path d=\"M 107.3,113.6 H 222.7 V 86.4\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" marker-end=\"url(#ah-y)\" opacity=\"0.9\"/>\n<path d=\"M 106.9,127.9 H 223.1 V 1 c. ケーススタディ】正解は<strong>BLOB サービスのアクセスポリシーを作成する</strong>です。保存されたアクセスポリシー（Stored Access Policy）により、SAS（Shared Access Signature）の有効期限やアクセス権限を後から変更・無効化できます。アクセスポリシーに紐づく SAS を無効化するには、ポリシー自体を削除または変更するだけでよく、個別の SAS を追跡する必要がありません。これにより、アクセス制御の柔軟な管理が可能です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure RBAC 割り当てを作成する</strong>: RBAC はユーザー・グループ・サービスプリンシパルへの権限付与に使用します。SAS ベースの一時的なアクセス付与には向いていません。<br><strong>BLOB サービスのアクセスレベルを変更する</strong>: 匿名アクセスの有効/無効を制御しますが、特定ユーザーへのアクセス制御には不適切です。<br><strong>Azure リソースロックを実装する</strong>: リソースの削除や変更を防ぐロック機能であり、アクセス制御ではありません。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">アドホック SAS（ポリシー未使用）は一度発行すると有効期限まで無効化できません。保存されたアクセスポリシーを使用することで、後から SAS を無効化できます。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">SAS の種類：①アカウント SAS（ストレージアカウント全体）、②サービス SAS（特定のサービス：BLOB/Queue/Table）、③ユーザー委任 SAS（Entra ID 認証、推奨）。保存されたアクセスポリシーはサービス SAS と組み合わせて使用します。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/common/storage-sas-overview\" target=\"_blank\">Shared Access Signatures（SAS）を使用して Azure Storage リソースへの制限付きアクセスを付与する</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 240\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" re =\"12.83\" cy=\"11.09\" rx=\"1.27\" ry=\"1.28\" fill=\"#50e6ff\" /><path d=\"M2.41,5.58A.24.24,0,0,1,2.5,5.5L8.32,2.11c.08,0,5,2.78,5,2.78a.24.24,0,0,0,.36-.21V3.59a.24.24,0,0,0-.12-.21S8.4.46,8.33.5L1.11,4.64,1,4.72Z\" fill=\"#949494\" /><path d=\"M13.3,13.14,8.56,15.87a.35.35,0,0,1-.11,0v1.6a.2.2,0,0,0,.11,0l5-2.86a.24.24,0,0,0,.12-.2V13.35A.24.24,0,0,0,13.3,13.14Z\" fill=\"#949494\" /><path d=\"M8.45,15.9a.31.31,0,0,1-.13,0L2.5,12.47a.22.22,0,0,1-.12-.2V5.7a.27.27,0,0,1,0-.12L1,4.72a.28.28,0,0,0,0,.13v8.27a.24.24,0,0,0,.11.21l7.22,4.14a.24.24,0,0,0,.12,0Z\" fill=\"#b3b3b3\" /></svg>\n</g>\n<text x=\"290\" y=\"223\" text-anchor=\"middle\" fill=\"#f0f4ff\" font-size=\"11\" font-family=\"Outfit,sans-serif\" font-weight=\"600\">保持ポリシー</text>\n<text x=\"290\" y=\"236\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">法的保持・時間ベース</text>\n<rect x=\"0\" y=\"218\" width=\"600\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"300\" y=\"233\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">WORM = Write Once Read Many / SEC 17a-4 / CFTC コンプライアンス対応</text>\n</svg>"},{"num":42,"id":"q42","domain":"インフラストラクチャ設計","question_text":"【BlueRock Inc. ケーススタディ概要】\nBlueRock Inc. は App1 をオンプレミス環境から Azure に移行する計画があります。App1 は移行後、Azure Storage アカウントにアプリケーションデータを格納します。\n\n主なセキュリティ・コンプライアンス要件：\n・App1 データをホストする Azure Storage アカウントのパブリックエンドポイントへのアクセスを防止すること。\n・データアクセスがパブリックインターネットを経由しないようにすること。\n\nApp1 の移行に際し、ストレージアカウントへのネットワーク接続ソリューションを推奨する必要があります。\n\n推奨に含めるべきものは何ですか？","choices":[{"text":"サービスエンドポイントポリシーに関連付けられた Azure サービスエンドポイントを構成する","is_correct":false},{"text":"ExpressRoute 回線でパブリックピアリングを使用する","is_correct":false},{"text":"Azure Storage アカウントにプライベートエンドポイント接続を実装する","is_correct":true},{"text":"ExpressRoute 回線で Microsoft ピアリングを使用する","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">【BlueRock Inc.】正解は<strong>Azure Storage アカウントにプライベートエンドポイントを作成する</strong>です。App1 が ExpressRoute 経由でオンプレミスから Azure Storage にアクセスする場合、プライベートエンドポイントを使用することで、ストレージアカウントの通信がプライベート IP アドレス（VNet 内）を経由するようになります。これにより、インターネットやパブリック IP を経由せず、ExpressRoute の閉域ネットワーク内で安全にアクセスできます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>サービスエンドポイントポリシーに関連付ける</strong>: サービスエンドポイントは VNet の特定サブネットからストレージへのトラフィックを Azure バックボーン経由にしますが、プライベート IP ではなくパブリック IP を使用します。ExpressRoute 接続では必ずしも意図した動作にならない場合があります。<br><strong>ExpressRoute 回線でパブリックピアリングを使用する</strong>: パブリックピアリングは Azure サービスのパブリックエンドポイントに対してルーティングするため、セキュリティの観点から推奨されません。現在は Microsoft ピアリングに置き換えられています。<br><strong>ExpressRoute 回線で Microsoft ピアリングを使用する</strong>: Microsoft ピアリングはパブリックエンドポイントへのルーティングを提供しますが、プライベートエンドポイントほどのセキュリティ分離は提供しません。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「サービスエンドポイント」と「プライベートエンドポイント」の違い：サービスエンドポイントはパブリック IP のままでトラフィックを Azure バックボーン経由にする、プライベートエンドポイントは VNet 内のプライベート IP を割り当てて完全にプライベート化する。セキュリティ要件が高い場合はプライベートエンドポイントが推奨です。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">プライベートエンドポイントを使用する場合、ストレージアカウントのパブリックアクセスを「無効」に設定することで、インターネットからの直接アクセスを完全に遮断できます。ExpressRoute プライベートピアリング + プライベートエンドポイントが最もセキュアな構成です。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/common/storage-private-endpoints\" target=\"_blank\">Azure Storage にプライベートエンドポイントを使用する</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 650 235\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\" enefit対象外 / Spot=本番不可</text>\n</svg>"},{"num":43,"id":"q43","domain":"インフラストラクチャ設計","question_text":"【BlueRock Inc. ケーススタディ概要】\nBlueRock Inc. は 2 つの Microsoft Entra テナントを保有しています。\n\n・bluerock.com: 10 個のサブスクリプション\n・dev.bluerock.com: 5 個のサブスクリプション\n\nネットワーク管理者は、すべての仮想ネットワークにわたって Network Contributor Azure RBAC ロールを割り当てる必要があります。\n\nこの要件を満たしながら、最小権限の原則に準拠するために必要な Azure RBAC ロール割り当ての最小数はいくつですか？","choices":[{"text":"1","is_correct":false},{"text":"2","is_correct":true},{"text":"5","is_correct":false},{"text":"10","is_correct":false},{"text":"15","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">【BlueRock Inc.】正解は<strong>2</strong>つの Microsoft Entra テナントです。BlueRock Inc. は2つの独立した Entra ID テナント（本番用と開発用、またはテナント間の B2B コラボレーション）を使用しています。問題の要件（外部ユーザーへのアクセス付与方法や B2B 招待の設定など）に対して、2つのテナントが最小限の必要数です。テナントを増やすと管理コストが増大し、減らすと要件を満たせません。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>1</strong>: 単一テナントでは、B2B コラボレーションや環境分離（本番/開発）の要件を満たせない可能性があります。<br><strong>5, 10, 15</strong>: 必要以上のテナント数は管理コストの増大、ポリシー管理の複雑化につながります。最小必要数の2が正解です。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「テナントの数」は組織の独立した ID 境界の数を意味します。B2B コラボレーションでは、1テナントのユーザーが別テナントにゲストとして招待されますが、テナント自体は分離されたままです。不必要にテナントを増やすと管理負荷が上がります。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Microsoft Entra の B2B コラボレーション：外部組織のユーザーを自テナントにゲストとして招待し、リソースへのアクセスを付与する仕組み。ゲストユーザーは自分のホームテナントの資格情報でサインインします。テナントを新規作成するより B2B の方が管理コストが低いです。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/entra/external-id/what-is-b2b\" target=\"_blank\">Microsoft Entra B2B コラボレーションの概要</a></div></div>","svg":"<  Sans JP,sans-serif\">Windows/SQLのみ</text>\n<rect x=\"0\" y=\"213\" width=\"650\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"325\" y=\"228\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Ubuntu本番 = Reservations（最大72%削減）/ Hybrid Benefit対象外 / Spot=本番不可</text>\n</svg>"},{"num":44,"id":"q44","domain":"ID・ガバナンス・監視","question_text":"【BlueRock Inc. ケーススタディ概要】\nBlueRock Inc. は、すべての Azure SQL データベースで Transparent Data Encryption（TDE）を有効化することを義務付けています。これには既存のデータベースと将来作成されるデータベースの両方が含まれます。\n\nAzure Policy を使用してこの要件を実装・適用する計画があります。\n\n以下の手順を正しい順序に並べ替えてください：\n1. Azure ポリシー割り当てを作成する\n2. ユーザー割り当てマネージド ID を作成する\n3. Modify エフェクトを使用した Azure ポリシー定義を作成する\n4. 修復タスクを呼び出す\n5. deployIfNotExists エフェクトを使用した Azure ポリシー定義を作成する","choices":[{"text":"1-4-2（割り当て→修復→マネージドID）","is_correct":false},{"text":"4-3-1（修復→Modifyポリシー→割り当て）","is_correct":false},{"text":"5-1-4（DeployIfNotExistsポリシー→割り当て→修復タスク）","is_correct":true},{"text":"3-1-5（Modifyポリシー→割り当て→DeployIfNotExists）","is_correct":false},{"text":"1-4-5（割り当て→修復→DeployIfNotExistsポリシー）","is_correct":false},{"text":"2-3-1（マネージドID→Modifyポリシー→割り当て）","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><p>正解は <strong>5→1→4</strong> の順序です。</p><table class=\"exp-table\"><thead><tr><th>ステップ</th><th>手順</th><th>理由</th></tr></thead><tbody><tr><td><strong>Step 1</strong><br>（手順5）</td><td>deployIfNotExists エフェクトを使用した Azure ポリシー定義を作成する</td><td>まずポリシーのロジックを定義します。deployIfNotExists (DINE) エフェクトは、コンプライアンス違反リソースを検出した際に自動的にリソースをデプロイ（TDE を有効化）します。Modify エフェクト（手順3）ではなく DINE が必要なのは、TDE 有効化にはリソースの作成・更新操作が必要なためです。</td></tr><tr><td><strong>Step 2</strong><br>（手順1）</td><td>Azure ポリシー割り当てを作成する</td><td>定義したポリシーをスコープ（サブスクリプションまたはリソースグループ）に割り当てます。この際、DINE ポリシーが自動デプロイを実行するためのマネージド ID（システム割り当てまたはユーザー割り当て）を指定します。ユーザー割り当てマネージド ID（手順2）は割り当て時に同時に設定するか、事前に作成して指定します。</td></tr><tr><td><strong>Step 3</strong><br>（手順4）</td><td>修復タスクを呼び出す</td><td>既存の非準拠リソース（TDE が無効な SQL DB）にポリシーを適用するために修復タスクを実行します。新規リソースには自動適用されますが、既存リソースには修復タスクが必要です。</td></tr></tbody></table></div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><table class=\"exp-table\"><thead><tr><th>順序</th><th>問題点</th></tr></thead><tbody><tr><td>1-4-2</td><td>ポリシー定義なしに割り当てはできません。また修復タスクはマネージドIDより後でないと実行できません。</td></tr><tr><td>4-3-1</td><td>Modify エフェクトは TDE 有効化には不適切。修復タスクはポリシー割り当て後に実行する必要があります。</td></tr><tr><td>3-1-5</td><td>Modify エフェクト（手順3）は TDE 有効化に使用できません。deployIfNotExists が必要です。</td></tr><tr><td>1-4-5</td><td>ポリシー定義より先に割り当てはできません。</td></tr><tr><td>2-3-1</td><td>Modify ポリシー（手順3）は不適切で、この組み合わせでは TDE 自動有効化を実現できません。</td></tr></tbody></table></div></div><div class=\"exp-block exp-tip\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\"><ul><li><strong>Modify vs DeployIfNotExists</strong>: Modify はタグや SKU などの単純なプロパティ変更に使用。DeployIfNotExists は別リソースのデプロイや複雑な設定変更に使用。TDE 有効化は DINE が必要。</li><li><strong>修復タスク</strong>: 既存リソースへの適用に必要。新規リソースにはポリシー割り当て後、自動的に DINE が実行される。</li><li><strong>マネージド ID</strong>: DINE ポリシーが実際のデプロイ操作を行うために必要。ポリシー割り当て時に自動作成（システム割り当て）または事前作成（ユーザー割り当て）のどちらでも可。</li></ul></div></div>""svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 660 250\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\ 45","domain":"データストレージ設計","question_text":"【BlueRock Inc. ケーススタディ概要】\nBlueRock Inc. のクラウドモダナイゼーションプログラムの一環として、DB1 と DB2 という 2 つの重要なデータベースをオンプレミス環境から Azure に移行する準備をしています。\n\nこれらのデータベースはビジネスクリティカルなワークロードをサポートしており、以下の要件を満たす必要があります。\n\n・リージョン内の 2 つのアベイラビリティーゾーンが障害になっても可用性を維持すること。\n・自動フェールオーバーをサポートすること。\n・I/O レイテンシを最小化すること。\n・管理工数を最小化すること。\n\nAzure データベースの構成は何を適用しますか？","choices":[{"text":"単一の Azure SQL データベース","is_correct":false},{"text":"Azure SQL Managed Instance","is_correct":true},{"text":"Azure SQL Database エラスティックプール","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">\u306a\u305c\u6b63\u89e3\u306a\u306e\u304b</div><div class=\"exp-block-body\"><p>\u6b63\u89e3\u306f <strong><svg id=\"ic_sql_mana_aee944_1_a5c93a83-9fd9-4ccb-ba77-53d6c609a7d3\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 18 18\" width=\"16\" height=\"16\" style=\"vertical-align:middle;margin-right:3px;display:inline-block\"><defs><linearGradient id=\"ic_sql_mana_aee944_1_acf2da4b-8aca-4b58-b995-ca6956cf663e\" x1=\"5.41\" y1=\"17.33\" x2=\"5.41\" y2=\"0.61\" gradientUnits=\"userSpaceOnUse\"><stop offset=\"0\" stop-color=\"#949494\" /><stop offset=\"0.53\" stop-color=\"#a2a2a2\" /><stop offset=\"1\" stop-color=\"#b3b3b3\" /></linearGradient><linearGradient id=\"ic_sql_mana_aee944_1_b152b416-25c2-4a4a-9d7f-a0bb2a13f84a\" x1=\"10.04\" y1=\"17.39\" x2=\"10.04\" y2=\"6.82\" gradientUnits=\"userSpaceOnUse\"><stop offset=\"0\" stop-color=\"#0078d4\" /><stop offset=\"0.16\" stop-color=\"#1380da\" /><stop offset=\"0.53\" stop-color=\"#3c91e5\" /><stop offset=\"0.82\" stop-color=\"#559cec\" /><stop offset=\"1\" stop-color=\"#5ea0ef\" /></linearGradient></defs><title>Icon-databases-136</title><path d=\"M10.32,16.76a.58.58,0,0,1-.57.57H1.07a.57.57,0,0,1-.57-.57V1.18A.56.56,0,0,1,1.07.61H9.75a.57.57,0,0,1,.57.57Z\" fill=\"url(#ic_sql_mana_aee944_1_acf2da4b-8aca-4b58-b995-ca6956cf663e)\" /><path d=\"M1.94,6.47A1.07,1.07,0,0 "0 0 18 18\" width=\"48\" height=\"48\"><defs><linearGradient id=\"az_storage_ad4c4f96-09aa-4f91-ba10-5cb8ad530f74\" x1=\"9\" y1=\"15.83\" x2=\"9\" y2=\"5.79\" gradientUnits=\"userSpaceOnUse\"><stop offset=\"0\" stop-color=\"#b3b3b3\" /><stop offset=\"0.26\" stop-color=\"#c1c1c1\" /><stop offset=\"1\" stop-color=\"#e6e6e6\" /></linearGradient></defs><title>Icon-storage-86</title><path d=\"M.5,5.79h17a0,0,0,0,1,0,0v9.48a.57.57,0,0,1-.57.57H1.07a.57.57,0,0,1-.57-.57V5.79A0,0,0,0,1,.5,5.79Z\" fill=\"url(#az_storage_ad4c4f96-09aa-4f91-ba10-5cb8ad530f74)\" /><path d=\"M1.07,2.17H16.93a.57.57,0,0,1,.57.57V5.79a0,0,0,0,1,0,0H.5a0,0,0,0,1,0,0V2.73A.57.57,0,0,1,1.07,2.17Z\" fill=\"#37c2b1\" /><path d=\"M2.81,6.89H15.18a.27.27,0,0,1,.26.27v1.4a.27.27,0,0,1-.26.27H2.81a.27.27,0,0,1-.26-.27V7.16A.27.27,0,0,1,2.81,6.89Z\" fill=\"#fff\" /><path d=\"M2.82,9.68H15.19a.27.27,0,0,1,.26.27v1.41a.27.27,0,0,1-.26.27H2.82a.27.27,0,0,1-.26-.27V10A.27.27,0,0,1,2.82,9.68Z\" fill=\"#37c2b1\" /><path d=\"M2.82,12.5H15.19a.27.27,0,0,1,.26.27v1.41a.27.27,0,0,1-.26.27H2.82a.27.27,0,0,1-.26-.27V12.77A.27.27,0,0,1,2.82,12.5Z\" fill=\"#258277\" /></svg>\n</g>\n<text x=\"500\" y=\"138\" text-anchor=\"middle\" fill=\"#f0f4ff\" font-size=\"11\" font-family=\"Outfit,sans-serif\" font-weight=\"600\">Premium File Shares</text>\n<text x=\"500\" y=\"151\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">SMB/NFS高性能</text>\n<rect x=\"0\" y=\"163\" width=\"640\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"320\" y=\"178\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Standard GPv2 = 最も汎用的・ライフサイクル管理・全冗長オプション対応</text>\n</svg>"},{"num":46,"id":"q46","domain":"データストレージ設計","question_text":"【BlueRock Inc. ケーススタディ概要】\nBlueRock Inc. のクラウドモダナイゼーションプログラムの一環として、DB1 と DB2 という 2 つの重要なデータベースをオンプレミス環境から Azure に移行する準備をしています。\n\nこれらのデータベースはビジネスクリティカルなワークロードをサポートしており、以下の要件を満たす必要があります。\n\n・リージョン内の 2 つのアベイラビリティーゾーンが障害になっても可用性を維持すること。\n・自動フェールオーバーをサポートすること。\n・I/O レイテンシを最小化すること。\n・管理工数を最小化すること。\n\n適用するサービスティアは何ですか？","choices":[{"text":"Hyperscale","is_correct":false},{"text":"Business Critical","is_correct":true},{"text":"General Purpose","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">【BlueRock Inc.】正解は<strong>Business Critical</strong>ティアです。BlueRock の本番データベースは高可用性（99.99% SLA）、低レイテンシ I/O、読み取りワークロードの分離が必要です。Business Critical ティアは：①常時オンの読み取りセカンダリレプリカ（無料）、②インメモリ OLTP サポート、③SSD ローカルストレージによる高 IOPS・低レイテンシ、④SLA 99.99% を提供します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>General Purpose</strong>: リモートストレージ（Azure Premium Storage）を使用するため、Business Critical より IOPS とレイテンシが劣ります。読み取りセカンダリも別途コストがかかります。<br><strong>Hyperscale</strong>: 大規模なデータベース（4TB超）向けで、コストが高くなります。読み取りレプリカは追加コストが必要です。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「高可用性 + 読み取りスケールアウト」のキーワードがあれば Business Critical が正解です。Hyperscale は「大規模データ（4TB超）」のキーワードで区別します。General Purpose は「標準的なワークロード」に適しています。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Business Critical のアーキテクチャ：AlwaysOn 可用性グループを内部で使用し、3〜4個の同期レプリカを維持します。フェールオーバーが数秒で完了し、読み取りワークロードをセカンダリに自動オフロードできます。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/azure-sql/database/service-tier-business-critical\" target=\"_blank\">Business Critical サービスティア - Azure SQL Database</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 185\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3. block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Identity Protection と条件付きアクセスは連携して機能します。Identity Protection がリスクを検出 → 条件付きアクセスがリスクレベルに応じてMFA要求やアクセスブロックを実行。「リスクベース」という要件があれば、Identity Protection（検出側）が答えになるケースが多いです。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Identity Protection のリスク種別：①サインインリスク（そのサインインが不正である確率）、②ユーザーリスク（アカウントが侵害されている確率）。リスクレベル：低・中・高。Entra ID P2 ライセンスが必要です。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/entra/id-protection/overview-identity-protection\" target=\"_blank\">Microsoft Entra ID Protection とは</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 630 235\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.4)\"/>\n      </f 0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"315\" y=\"228\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Conditional Access = If/Then ポリシー: ユーザー・場所・デバイス・リスクを評価</text>\n</svg>"},{"num":48,"id":"q48","domain":"ID・ガバナンス・監視","question_text":"【BlueRock Inc. ケーススタディ概要】\nBlueRock Inc. の本番セキュリティモデルでは、本番 Azure リソースを管理する管理者は Azure MFA に登録され、Azure ポータルにサインインするたびに MFA の使用を要求される必要があります。\n\n既存の Conditional Access ポリシー（Capolicy1）がすでに設定されています。\n\n本番管理者が MFA 認証を使用することを強制するために何を設定しますか？","choices":[{"text":"Capolicy1 の許可コントロール","is_correct":true},{"text":"Capolicy1 のセッションコントロール","is_correct":false},{"text":"Microsoft Entra Identity Protection のサインインリスクポリシー","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">【BlueRock Inc.】正解は<strong>Capolicy1 の許可コントロール（Grant controls）</strong>です。条件付きアクセスポリシーの「許可コントロール」は、アクセスを「許可する（条件付きで）」か「ブロックする」かを定義します。「準拠デバイスが必要」「ハイブリッドAzure AD参加済みデバイスが必要」「MFAが必要」などの要件を設定します。BlueRock の要件（準拠デバイスからのみアクセス許可）は許可コントロールで設定します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Capolicy1 のセッションコントロール</strong>: セッションコントロールは、アクセス許可後のセッション動作を制限します（例：ダウンロード禁止、セッションタイムアウト、アプリ強制制限）。デバイスコンプライアンス要件の設定には使用しません。<br><strong>Microsoft Entra Identity Protection（のリスクポリシー変更）</strong>: Identity Protection はリスク検出であり、準拠デバイス要件の設定先ではありません。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">条件付きアクセスの「許可コントロール」と「セッションコントロール」の違いを混同しないこと。<br>「許可」：アクセスを許可するための条件（MFA必須、準拠デバイス必須など）<br>「セッション」：許可後のセッション内での行動制限（ダウンロード禁止、セッション頻度など）</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">条件付きアクセスの許可コントロールの設定項目：①多要素認証を要求する、②準拠デバイスを必須にする（Intune管理）、③ハイブリッドAzure AD参加デバイスを必須にする、④承認済みクライアントアプリを必須にする、⑤アプリ保護ポリシーを必須にする。複数の条件を「すべて必要」または「いずれかが必要」で組み合わせられます。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/entra/identity/conditional-access/concept-conditional-access-grant\" target=\"_blank\">条件付きアクセスポリシーの許可コントロール</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 630 235\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.4)\"/>\n      </filter>\n    </defs>\n<rect width=\"630\" height=\"235\" fill=\"#0a0f1e\" rx=\"12\"/>\n<line x1=\"98.0\" y1=\"100.0\" x2=\"212.0\" y2=\"100.0\" stroke=\"#50e6ff\" stroke-width=\"2\"  marker-end=\"url(#ah)\" opacity=\"0.9\"/>\n<rect x=\"125.0\" y=\"104.0\" width=\"60\" height=\"14\" rx=\"3\" fill=\"rgba(10,15,30,0.85)\"/>\n<text x=\"155.0\" y=\"116.0\" text-anchor=\"middle\" fill=\"#50e6ff\" font-size=\"9\" font-family=\"Outfit,sans-serif\" font-weight=\ イントなどのネットワーク制御と統合できること。\n・エンタープライズコンプライアンス要件を満たすこと。\n・不必要なコストや複雑さを増やさないこと。\n\nApp1 のデータをホストするために推奨する Azure ストレージアカウントの種類はどれですか？","choices":[{"text":"Premium ページ BLOB","is_correct":false},{"text":"Premium ファイル共有","is_correct":false},{"text":"Standard 汎用 v2","is_correct":true}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">【BlueRock Inc.】正解は<strong>Standard 汎用 v2</strong>です。大量のファイルを保存し、アクセス頻度に応じてコストを最適化する（Hot/Cool/Archive ティアの切り替え）には Standard 汎用 v2 ストレージアカウントが必要です。このタイプのみがBLOB のライフサイクル管理ポリシー（アクセス頻度に基づく自動ティアリング）をサポートしています。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Premium ページ BLOB</strong>: SSD ベースの高 IOPS ストレージで、VM ディスク（VHD）用途に最適化されています。ライフサイクル管理（Hot/Cool/Archive）をサポートしていません。<br><strong>Premium ファイル共有</strong>: SSD ベースの高パフォーマンスファイル共有です。BLOB ストレージとは異なり、アーカイブティアは使用できません。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「Premium」は高パフォーマンス（SSD）を意味しますが、Hot/Cool/Archive のアクセスティア切り替えはできません。ライフサイクル管理でコストを最適化するには Standard 汎用 v2 が必要です。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">BLOB ストレージのアクセスティア：Hot（高アクセス、高コスト）、Cool（低アクセス、低コスト、最低30日保存）、Cold（さらに低アクセス、最低90日保存）、Archive（ほぼアクセスなし、最低180日保存、リハイドレーションに数時間）。ライフサイクル管理ポリシーで自動的にティアを移行できます。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/blobs/lifecycle-management-overview\" target=\"_blank\">Azure BLOB Storage のライフサイクル管理</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 185\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient= ass=\"exp-block-body\">「ADLS Gen2 を作成する」= 「Standard 汎用 v2 ストレージアカウント + 階層的な名前空間を有効化」です。ADLS Gen2 は独立したサービスではなく、Blob Storage のオプション機能として実装されています。作成後に有効化することはできず、アカウント作成時に設定する必要があります。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">ADLS Gen2 の主な用途：ビッグデータ分析（Spark、Hive、HDInsight）、Azure Synapse Analytics のデータレイク、Azure Databricks との統合。階層的な名前空間のメリット：ディレクトリ操作の効率化（O(1) の名前変更/削除）、きめ細かい ACL によるセキュリティ制御。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/blobs/data-lake-storage-introduction\" target=\"_blank\">Azure Data Lake Storage Gen2 の概要</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 235\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.4)\"/>\n      </filter>\n    </defs>\n<rect .82,12.5Z\" fill=\"#258277\" /></svg>\n</g>\n<text x=\"500\" y=\"198\" text-anchor=\"middle\" fill=\"#f0f4ff\" font-size=\"11\" font-family=\"Outfit,sans-serif\" font-weight=\"600\">Large File Shares</text>\n<text x=\"500\" y=\"211\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">100TiB SMB</text>\n<rect x=\"0\" y=\"213\" width=\"620\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"310\" y=\"228\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Hierarchical Namespace = ADLS Gen2を有効化・ビッグデータ分析に最適</text>\n</svg>"},{"num":51,"id":"q51","domain":"インフラストラクチャ設計","question_text":"【BlueRock Inc. ケーススタディ概要】\nBlueRock Inc. のアプリケーションモダナイゼーション戦略の一環として、App1 をオンプレミスから Azure に移行します。App1 はビジネスクリティカルなワークロードであり、以下の可用性要件を満たす必要があります。\n\n・アベイラビリティーゾーンをサポートする Azure リージョンでホストすること。\n・2 つのアベイラビリティーゾーンが障害になっても可用性を維持すること。\n・自動スケーリングをサポートする Azure 仮想マシンでホストすること。\n・Azure 専用ホスト（ホストグループにまとめられる）に展開すること。\n\nApp1 に高可用性を提供するために Azure 設計に含める構成はどれですか？","choices":[{"text":"ホストグループ数: 2 / 仮想マシンスケールセット数: 1","is_correct":false},{"text":"ホストグループ数: 1 / 仮想マシンスケールセット数: 1","is_correct":false},{"text":"ホストグループ数: 3 / 仮想マシンスケールセット数: 3","is_correct":true},{"text":"ホストグループ数: 3 / 仮想マシンスケールセット数: 0","is_correct":false},{"text":"ホストグループ数: 6 / 仮想マシンスケールセット数: 0","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">【BlueRock Inc.】正解は<strong>ホストグループ数: 3 / 仮想マシンスケールセット数: 3</strong>です。Azure Dedicated Host の要件：<br>・ホストグループは可用性ゾーン単位で作成します（BlueRock は3つの可用性ゾーンを使用 → 3つのホストグループ）<br>・VM スケールセット（VMSS）は各ホストグループに対して1つ配置します（3つのホストグループ × 1 VMSS = 3 VMSS）<br>ホストグループとAZは1対1の関係にあるため、3 AZ = 3ホストグループ = 3 VMSSが正解です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>ホストグループ: 1 / VMSS: 1</strong>: 可用性ゾーンが複数ある場合、1つのホストグループは1つのAZにしか属せないため不十分です。<br><strong>ホストグループ: 2 / VMSS: 2</strong>: 3つの可用性ゾーンをカバーするには3つのホストグループが必要です。<br><strong>ホストグループ: 6 / VMSS: 6</strong>: 過剰な数です。VMファミリーの種類によってホストを増やす場合もありますが、基本は AZ 数と一致させます。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「ホストグループ = 可用性ゾーン数」という関係を覚えましょう。ホストグループは特定のAZと関連付けられており、複数のAZにまたがることはできません。VM のタイプや数でホストグループを増やすのではなく、AZ 数で決まります。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Azure Dedicated Host の用途：コンプライアンス要件（物理ホストの専有）、Azure ハイブリッド特典の適用（Windowsライセンス）、メンテナンスのコントロール（メンテナンスウィンドウの制御）。ホストグループ内に複数のホスト（物理サーバー）を配置し、そこにVMをデプロイします。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/virtual-machines/dedicated-hosts\" target=\"_blank\">Azure Dedicated Hosts の概要</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 260\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, ,0-1.53-3.67Z\" fill=\"#32bedd\" /><path d=\"M6.22,6.85l-2-2A6.16,6.16,0,0,0,2.72,8.56H5.51A3.6,3.6,0,0,1,6.22,6.85Z\" fill=\"#50e6ff\" /><path d=\"M14.14,7a.45.45,0,0,0-.57-.25L9.45,8.41l.32.81,4.12-1.63A.44.44,0,0,0,14.14,7Z\" fill=\"#f04049\" /><ellipse cx=\"9\" cy=\"9\" rx=\"1.2\" ry=\"1.2\" fill=\"url(#az_monitor_a9954820-cb38-4943-9842-f0a568d2b015)\" /></svg>\n</g>\n<text x=\"480\" y=\"213\" text-anchor=\"middle\" fill=\"#f0f4ff\" font-size=\"11\" font-family=\"Outfit,sans-serif\" font-weight=\"600\">Azure Advisor</text>\n<text x=\"480\" y=\"226\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">最適化推奨</text>\n<rect x=\"0\" y=\"238\" width=\"620\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"310\" y=\"253\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">BlueRock App1 = 本番Ubuntu VM → Reservations適用でコスト最適化</text>\n</svg>"},{"num":52,"id":"q52","domain":"ID・ガバナンス・監視","question_text":"【BlueRock Inc. ケーススタディ概要】\nBlueRock Inc. のクラウド移行イニシアティブの一環として、App1 がオンプレミスから Azure に移行されます。App1 は Azure コンピューティングリソース上で動作し、資格情報をコードや設定ファイルに格納せずに他の Azure サービスに安全にアクセスする必要があります。\n\n・App1 はホストする仮想マシンのマネージド ID を使用して Azure 上のリソースにアクセスすること。\n\nApp1 が Azure でアクセストークンを安全に取得するために使用すべきエンドポイントの種類はどれですか？","choices":[{"text":"Microsoft Entra","is_correct":false},{"text":"Azure Instance Metadata Service (IMDS)","is_correct":true},{"text":"Azure Service Management","is_correct":false},{"text":"Microsoft ID プラットフォーム","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">【BlueRock Inc.】正解は<strong>Azure Instance Metadata Service（IMDS）</strong>です。Azure VM 上のアプリケーションがマネージドIDを使用して Entra ID のアクセストークンを取得するには、IMDS エンドポイント（169.254.169.254）にHTTPリクエストを送信します。IMDS はリンクローカルアドレスでアクセスでき、VMの内部からのみ到達可能です。Azure SDK（DefaultAzureCredential）は内部的に IMDS を呼び出してトークンを取得します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Microsoft Entra（Entra ID エンドポイント直接）</strong>: マネージドIDの場合、アプリはEntra IDに直接接続するのではなく、IMDSを経由してトークンを取得します。<br><strong>Azure Service Management API</strong>: 旧来のAzureリソース管理APIです。マネージドIDのトークン取得には関係しません。<br><strong>Microsoft ID プラットフォーム</strong>: サービスプリンシパルやユーザー認証で使用するエンドポイントです。マネージドIDではIMDSが仲介します。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">マネージドIDのトークン取得フロー：アプリ → IMDS（169.254.169.254/metadata/identity/oauth2/token）→ Entra ID がトークン発行 → アプリがトークン取得。アプリは直接 Entra ID に接続せず、IMDSが仲介します。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">IMDS はトークン取得以外にも、VMのメタデータ（インスタンス情報、サブスクリプション情報）や Scheduled Events（メンテナンス予告）を提供します。IMDSは外部ネットワークからアクセス不可能なリンクローカルアドレス（169.254.169.254）を使用するため、VM内からのみアクセスできます。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/virtual-machines/instance-metadata-service\" target=\"_blank\">Azure Instance Metadata Service</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 660 220\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX "600\" y=\"171\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">セキュリティポスチャ</text>\n<rect x=\"0\" y=\"198\" width=\"660\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"330\" y=\"213\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Azure Policy = 組織標準の強制・コンプライアンスレポート</text>\n</svg>"},{"num":53,"id":"q53","domain":"ID・ガバナンス・監視","question_text":"【BlueRock Inc. ケーススタディ概要】\nBlueRock Inc. の移行戦略の一環として、App1 がオンプレミスから Azure に移行されます。App1 は機密ビジネスデータを処理し、以下のセキュリティ・コンプライアンス要件を満たす必要があります。\n\n・App1 が Azure に移行された後、新しいデータを書き込むことはできますが、新規および既存のデータの変更を 3 年間防止すること。\n\nApp1 が使用する Azure のデータストレージがコンプライアンス要件を満たすようにするために何を行いますか？","choices":[{"text":"Azure リソースロックを実装する","is_correct":false},{"text":"BLOB サービスのアクセスレベルを変更する","is_correct":false},{"text":"BLOB サービスのアクセスポリシーを作成する","is_correct":true},{"text":"Azure RBAC 割り当てを作成する","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">【BlueRock Inc.】正解は<strong>BLOB サービスのアクセスポリシーを作成する</strong>です。Q41 と同様のシナリオです。保存されたアクセスポリシー（Stored Access Policy）を使用することで、発行済み SAS の有効期限や権限を後から変更・無効化できます。アクセスポリシーを削除するだけで、そのポリシーに紐づくすべての SAS が即座に無効化されます。これにより、SAS の管理と取り消しが容易になります。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure リソースロックを実装する</strong>: ロックはリソースの誤削除・変更を防ぐものであり、SAS アクセス制御とは無関係です。<br><strong>BLOB サービスのアクセスレベルを変更する</strong>: 匿名アクセスの有効/無効を制御しますが、認証済み SAS のアクセス制御には直接関係しません。<br><strong>Azure RBAC 割り当てを作成する</strong>: RBAC はユーザー・グループ・サービスプリンシパルへの継続的な権限付与です。一時的な SAS ベースのアクセス管理には使用しません。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Q41 と Q53 は類似の問題です。SAS の取り消し可能性を確保するには「保存されたアクセスポリシー」に紐づけることが必須です。アドホック SAS（ポリシー未使用）は発行後に無効化できないことを覚えましょう。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">セキュリティのベストプラクティス：SAS を発行する際は保存されたアクセスポリシーを使用し、最小権限・短い有効期限を設定します。より安全なアプローチとして「ユーザー委任SAS」（Entra ID 認証ベース）の使用が推奨されています。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/common/storage-stored-access-policy-define-dotnet\" target=\"_blank\">保存されたアクセスポリシーの作成 - Azure Storage</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 660 220\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.4)\"/>\n      </filter>\n    </defs>\n<rect width=\"660\" height=\"220\" fill=\"#0a0f1e\" rx=\"12\"/>\n<line x1=\"108.0\" y1=\"100.0\" x2=\"232.0\" y2=\"100.0\" stroke=\"#c4b5fd\" stroke-width=\"2\"  marker-end=\"url(#ah)\" opacity=\"0.9\"/>\n<rect x=\"140.0\" y=\"104.0\" width=\"60\" height text":"Azure Advisor","is_correct":false},{"text":"Azure コスト管理 Power BI アプリ","is_correct":false},{"text":"Azure 総所有コスト（TCO）計算ツール","is_correct":true}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><p>正解は <strong>Azure 総所有コスト（TCO）計算ツール</strong> です。</p><table class=\"exp-table\"><thead><tr><th>項目</th><th>詳細</th></tr></thead><tbody><tr><td>用途</td><td>オンプレミスから Azure への移行前コスト比較</td></tr><tr><td>入力項目</td><td>サーバー台数・CPU・メモリ・ストレージ・ネットワーク・電力・人件費</td></tr><tr><td>出力</td><td>オンプレミス運用コスト vs Azure 移行後コストの比較レポート</td></tr><tr><td>用途シナリオ</td><td>移行可否の経営判断・財務部門への提案資料作成</td></tr></tbody></table><p>「<strong>移行前</strong>にオンプレミスと Azure のコストを<strong>比較</strong>する」場面で使います。</p></div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><table class=\"exp-table\"><thead><tr><th>選択肢</th><th>用途</th><th>不正解の理由</th></tr></thead><tbody><tr><td>Azure Advisor</td><td>既存Azureリソースの最適化推奨</td><td>移行前のコスト比較には使えない。Azure上のリソースが対象。</td></tr><tr><td>Azure コスト管理 Power BI アプリ</td><td>既存Azure利用コストの可視化・分析</td><td>移行後のコスト管理ツール。移行前の見積もりには使えない。</td></tr></tbody></table></div></div><div class=\"exp-block exp-tip\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\"><table class=\"exp-table\"><thead><tr><th>ツール</th><th>使用タイミング</th><th>主な用途</th></tr></thead><tbody><tr><td>TCO 計算ツール</td><td>移行前</td><td>オンプレミス vs Azure のコスト比較</td></tr><tr><td>料金計算ツール（Pricing Calculator）</td><td>移行設計時</td><td>Azure サービス単体の料金見積もり</td></tr><tr><td>Azure Cost Management</td><td>移行後</td><td>実際のAzure利用コスト監視・分析</td></tr><tr><td>Azure Advisor</td><td>移行後</td><td>コスト最適化の推奨事項</td></tr></tbody></table></div></div>""svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 610 235\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" o // ============================================================
// App state & helpers
// ============================================================
const TOTAL = QUESTIONS.length;
const LTR = 'ABCDEFGHIJKLMNOP';
const DOMAIN_CODE = {
  'ビジネス継続性設計': 'BC',
  'ID・ガバナンス・監視': 'ID',
  'データストレージ設計': 'DS',
  'インフラストラクチャ設計': 'IS'
};
const DOMAIN_COLOR = {
  'BC': '#107C10',
  'ID': '#5C2D91',
  'DS': '#0072C6',
  'IS': '#C50F1F'
};

let state = {};
let multiSel = {};
let filter = 'all';
let displayChoices = {};

function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function initState(){
  const chk=document.getElementById('chk-shuf');
  const doShuf=chk&&chk.checked;
  state={};multiSel={};displayChoices={};
  QUESTIONS.forEach(q=>{
    state[q.id]={answered:false,correct:false};
    displayChoices[q.id]=doShuf?shuf([...q.choices]):[...q.choices];
  });
}

function filtered(){
  return filter==='all'?QUESTIONS:QUESTIONS.filter(q=>(DOMAIN_CODE[q.domain]||'IS')===filter);
}

function renderAll(){
  const qs=filtered();
  document.getElementById('qwrap').innerHTML=qs.map(q=>renderQ(q)).join('');
  qs.forEach(q=>{if(state[q.id]?.answered)restoreQ(q);});
  updateProgress();
}

function renderQ(q){
  const multi=q.n_correct>1;
  const dc=DOMAIN_CODE[q.domain]||'IS';
  const color=DOMAIN_COLOR[dc]||'#0072C6';
  const mBadge=multi?`<span class="mbadge">複数選択 (${q.n_correct}つ)</span>`:'';
  const mHint=multi?`<div class="multi-hint">${q.n_correct}つ選択してください</div>`:'';
  const choices=(displayChoices[q.id]||q.choices).map((c,i)=>`
    <button class="cbtn" id="c_${q.id}_${i}" onclick="onChoice('${q.id}',${i})">
      <span class="cltr">${LTR[i]}</span>
      <span>${esc(c.text)}</span>
    </button>`).join('');
  const subBtn=multi?`<button class="sub-btn" id="sub_${q.id}" onclick="submitQ('${q.id}')">回答を確定する</button>`:'';
  const arch=q.svg?`<div class="arch-svg-wrap arch-hidden" id="arch_${q.id}">${q.svg}<div class="arch-reveal-overlay"><span class="arch-reveal-hint">回答後にアーキテクチャ図が表示されます</span></div></div>`:'';
  const isReview = reviewSet.has(q.id);
  return `<div class="qcard" id="card_${q.id}">
    <div class="qh">
      <span class="qnum">問 ${q.num}</span>
      <span class="dbadge" style="background:${color}">${esc(q.domain)}</span>
      ${mBadge}
      <button class="review-btn ${isReview?'review-active':''}" id="rbtn_${q.id}" onclick="toggleReview('${q.id}','vol1',${q.num})" title="復習リストに追加">★</button>
    </div>
    <div class="qbody"><p class="qtext">${esc(q.question_text)}</p></div>
    ${arch}
    ${mHint}
    <div class="choices">${choices}</div>
    ${subBtn}
    <div class="expanel" id="exp_${q.id}">
      <div id="rb_${q.id}"></div>
      ${q.exp_html||''}
    </div>
  </div>`;
}

function onChoice(qid,idx){
  if(state[qid]?.answered)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  if(q.n_correct>1){
    if(!multiSel[qid])multiSel[qid]=new Set();
    const btn=document.getElementById(`c_${qid}_${idx}`);
    if(multiSel[qid].has(idx)){multiSel[qid].delete(idx);btn.classList.remove('multi-sel');}
    else{if(multiSel[qid].size>=q.n_correct)return;multiSel[qid].add(idx);btn.classList.add('multi-sel');}
    const sub=document.getElementById(`sub_${qid}`);
    if(sub)sub.style.display=multiSel[qid].size>=q.n_correct?'block':'none';
  }else{
    const ok=(displayChoices[qid]||q.choices)[idx].is_correct;
    state[qid]={answered:true,correct:ok};
    applyAnswer(q,qid,[idx],ok);
  }
}

function submitQ(qid){
  if(state[qid]?.answered)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  const sel=[...(multiSel[qid]||new Set())];
  const dc=displayChoices[qid]||q.choices;
  const cset=new Set(dc.map((c,i)=>c.is_correct?i:-1).filter(i=>i>=0));
  const ok=sel.length===cset.size&&sel.every(i=>cset.has(i));
  state[qid]={answered:true,correct:ok};
  applyAnswer(q,qid,sel,ok);
}

function applyAnswer(q,qid,selIdxs,ok){
  const sset=new Set(selIdxs);
  (displayChoices[qid]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${qid}_${i}`);if(!btn)return;
    btn.disabled=true;btn.classList.remove('multi-sel');
    if(sset.has(i))btn.classList.add(c.is_correct?'correct':'wrong');
    if(c.is_correct&&!sset.has(i))btn.classList.add('reveal');
  });
  document.getElementById(`card_${qid}`).classList.add(ok?(q.n_correct>1?'multi-ok':'ok'):'ng');
  const rb=document.getElementById(`rb_${qid}`);
  if(rb)rb.innerHTML=ok
    ?`<div class="rbadge ${q.n_correct>1?'multi-ok':'ok'}">${q.n_correct>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説で正解・理由を確認しましょう</div>';
  document.getElementById(`exp_${qid}`).style.display='block';
  const sub=document.getElementById(`sub_${qid}`);
  if(sub)sub.style.display='none';
  // Reveal arch diagram
  const archEl = document.getElementById('arch_'+qid);
  if(archEl) { archEl.classList.add('arch-revealed'); }
  updateProgress();
}

function restoreQ(q){
  const s=state[q.id];if(!s?.answered)return;
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);if(!btn)return;
    btn.disabled=true;if(c.is_correct)btn.classList.add(s.correct?'correct':'reveal');
  });
  document.getElementById(`card_${q.id}`)?.classList.add(s.correct?(q.n_correct>1?'multi-ok':'ok'):'ng');
  document.getElementById(`exp_${q.id}`).style.display='block';
  const rb=document.getElementById(`rb_${q.id}`);
  if(rb)rb.innerHTML=s.correct
    ?`<div class="rbadge ${q.n_correct>1?'multi-ok':'ok'}">${q.n_correct>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説で正解・理由を確認しましょう</div>';
}

function filterDomain(d){
  filter=d;
  document.querySelectorAll('.dbtn').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  renderAll();
}

function updateProgress(){
  const answered=Object.values(state).filter(s=>s.answered).length;
  const correct=Object.values(state).filter(s=>s.correct).length;
  const pct=answered>0?Math.round(correct/answered*100):0;
  document.getElementById('pb').style.width=(answered/TOTAL*100)+'%';
  document.getElementById('hdrScore').textContent=`${correct}/${TOTAL}`;
  document.getElementById('hdrPct').textContent=`正解率 ${answered>0?pct:0}%`;
}

function showResults(){
  const correct=Object.values(state).filter(s=>s.correct).length;
  const pct=Math.round(correct/TOTAL*100);
  const dstats={};
  QUESTIONS.forEach(q=>{
    if(!dstats[q.domain])dstats[q.domain]={t:0,c:0,color:DOMAIN_COLOR[DOMAIN_CODE[q.domain]||'IS']||'#333'};
    dstats[q.domain].t++;
    if(state[q.id]?.correct)dstats[q.domain].c++;
  });
  document.getElementById('mscore').textContent=`${correct}/${TOTAL}`;
  document.getElementById('mpct').textContent=`正解率 ${pct}%`;
  const SVG_TROPHY='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 21 12 17 16 21"/><line x1="12" y1="17" x2="12" y2="11"/><path d="M18 6H6l1-4h10l1 4z"/><path d="M6 6c0 7 6 11 6 11s6-4 6-11"/></svg>';
  const SVG_UP='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>';
  const SVG_ZAP='<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
  const SVG_BOOK='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
  let icon=SVG_BOOK,msg='';
  if(pct>=80){icon=SVG_TROPHY;msg='合格圈内！本番でも自信を持って！';}
  else if(pct>=70){icon=SVG_UP;msg='あと一息！弱点ドメインを重点復習しよう。';}
  else if(pct>=50){icon=SVG_ZAP;msg='継続が大切。解説を熟読して繰り返し解こう。';}
  else{icon=SVG_BOOK;msg='基礎から丁寧に見直しましょう。';}
  document.getElementById('micon').innerHTML=icon;
  document.getElementById('mmsg').textContent=msg;
  document.getElementById('mdomains').innerHTML=Object.entries(dstats).map(([d,s])=>{
    const p=Math.round(s.c/s.t*100);
    return `<div class="m-ditem">
      <div class="m-dname">${d}</div>
      <div class="m-dval" style="color:${s.color}">${s.c}/${s.t} <span style="font-size:12px;color:#888">(${p}%)</span></div>
    </div>`;
  }).join('');
  document.getElementById('modal').classList.add('show');
}

function modalClose(e){
  if(!e||e.target.id==='modal')document.getElementById('modal').classList.remove('show');
}

function resetAll(){
  document.getElementById('modal').classList.remove('show');
  initState();
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

window.addEventListener('scroll',()=>{
  document.getElementById('st').classList.toggle('show',window.scrollY>400);
});


// ===== REVIEW SYSTEM =====
let reviewSet = new Set(JSON.parse(localStorage.getItem('az305_review_ids')||'[]'));

function toggleReview(qid, vol, num) {
  if(reviewSet.has(qid)) {
    reviewSet.delete(qid);
    // Remove from stored data
    const data = JSON.parse(localStorage.getItem('az305_review_data')||'{}');
    delete data[vol+'_'+qid];
    localStorage.setItem('az305_review_data', JSON.stringify(data));
  } else {
    reviewSet.add(qid);
    // Save question data
    const q = QUESTIONS.find(x=>x.id===qid);
    if(q) {
      const data = JSON.parse(localStorage.getItem('az305_review_data')||'{}');
      data[vol+'_'+qid] = {
        vol: vol,
        volNum: vol.replace('vol',''),
        id: qid,
        num: q.num,
        domain: q.domain,
        question_text: q.question_text,
        choices: q.choices,
        correct_indices: q.correct_indices,
        n_correct: q.n_correct,
        exp_html: q.exp_html,
        svg: q.svg||''
      };
      localStorage.setItem('az305_review_data', JSON.stringify(data));
    }
  }
  localStorage.setItem('az305_review_ids', JSON.stringify([...reviewSet]));
  const btn = document.getElementById('rbtn_'+qid);
  if(btn) {
    btn.classList.toggle('review-active', reviewSet.has(qid));
  }
  if(window.updateReviewBadge) updateReviewBadge();
}

initState();
renderAll();
</script>
