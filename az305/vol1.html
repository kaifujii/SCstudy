-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Recovery Vault (Sub1) = バックアップ保管庫 ／ Resource Guard (Sub2) = Multi-User Authorization保護</text>\n</svg>"},{"num":2,"id":"q2","domain":"ビジネス継続性設計","question_text":"以下の特性を持つ複数のAzureサブスクリプションを管理する責任があります。\n\nサブスクリプション名: Sub1\nリージョン: 米国東部\nMicrosoft Entraテナント: contoso.onmicrosoft.com\n\nサブスクリプション名: Sub2\nリージョン: 米国東部\nMicrosoft Entraテナント: contoso-recovery.onmicrosoft.com\n\ncontoso.onmicrosoft.com テナントには User1 というユーザーアカウントが含まれています。\n\nランサムウェアの脅威に対する保護を提供するソリューションを設計・展開する必要があります。ソリューションは以下の要件を満たす必要があります。\n\n・Sub1 に展開されたすべてのリソースを Azure Backup を使用して保護すること。\n・User1 がバックアップ構成に重大な変更を加える前に、Sub2 でロールの割り当てを受けることを必須とすること。\n\nSub2 にはどのリソースを作成する必要がありますか？","choices":[{"text":"Recovery Services コンテナー","is_correct":false},{"text":"Resource Guard","is_correct":true},{"text":"Azure Site Recovery ジョブ","is_correct":false},{"text":"Microsoft Azure Backup Server (MABS)","is_correct":false},{"text":"Microsoft Azure Recovery Services (MARS) エージェント","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">\u306a\u305c\u6b63\u89e3\u306a\u306e\u304b</div><div class=\"exp-block-body\"><strong>Resource Guard</strong>\u3092 Sub2 \u306b\u4f5c\u6210\u3057\u307e\u3059\u3002Resource Guard \u306f Multi-User Authorization\uff08MUA\uff09\u3092\u5b9f\u88c5\u3059\u308b\u305f\u3081\u306e\u30ea\u30bd\u30fc\u30b9\u3067\u3001Sub2\uff08\u5225\u30c6\u30ca\u30f3\u30c8\u306e\u30b5\u30d6\u30b9\u30af\u30ea\u30d7\u30b7\u30e7\u30f3\uff09\u306b\u914d\u7f6e\u3059\u308b\u3053\u3068\u3067\u3001User1 \u304c Sub1 \u306e\u30d0\u30c3\u30af\u30a2\u30c3\u30d7\u306b\u91cd\u5927\u306a\u5909\u66f4\uff08\u4e0d\u5909\u30b9\u30c8\u30ec\u30fc\u30b8\u306e\u7121\u52b9\u5316\u3001MUA \u306e\u7121\u52b9\u5316\u306a\u3069\uff09\u3092\u884c\u3046\u969b\u306b Sub2 \u3067\u306e\u30ed\u30fc\u30eb\u5272\u308a\u5f53\u3066\u3092\u5fc5\u9808\u3068\u3057\u307e\u3059\u3002\u653b\u6483\u8005\u304c Sub1 \u3092\u4fb5\u5bb3\u30 開発工数で実現すること。\n・全体的なコストを最小化すること。\n\nどのような対応を行う必要がありますか？","choices":[{"text":"AKS1 に外部ロードバランサーを構成する","is_correct":false},{"text":"APIM1 を AKS1 が含まれる仮想ネットワークに再展開する","is_correct":false},{"text":"AKS1 に ExternalName サービスを構成する","is_correct":false},{"text":"AKS1 にイングレスコントローラーを展開する","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><strong>AKS1 にイングレスコントローラーを展開する</strong>ことが正解です。イングレスコントローラー（例：NGINX Ingress、Application Gateway Ingress Controller）は AKS クラスター内で HTTP/HTTPS トラフィックのルーティングを管理し、パスベース・ホストベースのルーティング、SSL 終端、ロードバランシングを1つのエントリポイントで実現します。外部からのリクエストを適切なサービスに転送するためのリバースプロキシとして機能します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>外部ロードバランサーを構成する</strong>: L4（TCP/UDP）レベルのロードバランシングのみで、HTTP パスやホストヘッダーに基づくルーティングができません。<br><strong>APIM1 を AKS1 が含まれる仮想ネットワークに統合する</strong>: API Management は API ゲートウェイとして機能しますが、AKS 内部のサービスルーティングには不要なオーバーヘッドです。<br><strong>ExternalName サービスを構成する</strong>: ExternalName は外部 DNS 名への CNAME マッピングであり、内部サービスへのトラフィックルーティングには使用しません。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「ロードバランサー」と「イングレスコントローラー」の違い。ロードバランサーは L4（IP+ポート）、イングレスは L7（HTTP パス・ホスト名）でルーティングできます。複数サービスへのパスベースルーティングが必要な場合はイングレスが正解です。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">AKS のイングレスコントローラーの種類：①NGINX Ingress Controller（OSS）、②Application Gateway Ingress Controller（AGIC、Azure WAF 統合）、③Azure Load Balancer Ingress。AGIC は WAF ポリシーと統合できるため、セキュリティ要件が高い場合に適しています。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/aks/ingress-basic\" target=\"_blank\">AKS で NGINX イングレスコントローラーを作成する</a></div></div>","svg":"<svg xmlns=\"http://www.w3.o -trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「Azure 内でデータを移動する」→ Synapse パイプライン（同テナント内）、「外部組織にデータを共有する」→ Data Share、「オンプレミスから Azure へ」→ Data Box / AzCopy の使い分けが重要。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Synapse パイプラインは Azure Data Factory（ADF）と同等の機能を提供します。90以上のコネクタ、データフロー変換、トリガーベースのスケジュール実行をサポートしています。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/synapse-analytics/get-started-pipelines\" target=\"_blank\">Azure Synapse Analytics でパイプラインを使ってみる</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 190\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.4)\"/>\n      </filter>\n    </defs>\n<rect width=\"620\" height=\"190\" fill=\"#0a0f1e\ 要があります。\n・apexcoreworkspace1 内のデータのスナップショットへの制限付きアクセスを Ironclad に提供すること。\n\n何を推奨しますか？","choices":[{"text":"Azure Data Box Gateway","is_correct":false},{"text":"Azure Data Share","is_correct":true},{"text":"Azure Synapse パイプライン","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><strong>Azure Data Share</strong>が正解です。Data Share は組織間（異なる Azure テナント）でデータを安全に共有するためのサービスです。データのコピーを送る「スナップショット共有」と、データを直接参照させる「インプレース共有」をサポートします。共有したデータの制御（アクセス取り消しなど）をデータ提供側が保持できます。外部パートナーや顧客とのデータ共有シナリオで使用します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure Data Box Gateway</strong>: オンプレミスとクラウド間の大容量データ転送用です。<br><strong>Azure Synapse パイプライン</strong>: 同一テナント内のデータ統合・変換ツールです（Q5 の正解）。外部組織とのデータ共有機能はありません。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「共有」という言葉から「共有ストレージ」を思い浮かべがちですが、Data Share は「別テナントの組織」にデータを渡すためのものです。同一テナント内なら RBAC や Synapse パイプラインで対応します。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Data Share が対応するデータソース：Azure Blob Storage、Azure Data Lake Storage Gen1/Gen2、Azure SQL Database、Azure Synapse Analytics、Azure Data Explorer。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/data-share/overview\" target=\"_blank\">Azure Data Share の概要</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 580 210\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerW n points=\"14.42 10.92 12.74 11.91 11.05 10.92 12.74 9.93 14.42 10.92\" fill=\"#c3f1ff\" /><polygon points=\"12.74 11.91 12.74 13.87 11.05 12.88 11.05 10.92 12.74 11.91\" fill=\"#9cebff\" /><polygon points=\"11.05 12.88 12.74 11.9 12.74 13.87 11.05 12.88\" fill=\"#c3f1ff\" /><polygon points=\"14.42 12.88 12.74 11.9 12.74 13.87 14.42 12.88\" fill=\"#9cebff\" /><path d=\"M14.76,17.32c-1-.16-1-.88-1-2h-2c0,1.16,0,1.88-1,2a.59.59,0,0,0-.5.57h5A.59.59,0,0,0,14.76,17.32Z\" fill=\"url(#az_vmss_ab373d88-41af-4fc3-b172-d4489f9107a0)\" /></svg>\n</g>\n<text x=\"540\" y=\"138\" text-anchor=\"middle\" fill=\"#f0f4ff\" font-size=\"11\" font-family=\"Outfit,sans-serif\" font-weight=\"600\">VMSS1</text>\n<text x=\"540\" y=\"151\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">バックエンドVMs</text>\n<rect x=\"0\" y=\"198\" width=\"630\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"315\" y=\"213\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Gateway LB = NVAチェーン透過的な L4 ロードバランサー</text>\n</svg>"},{"num":8,"id":"q8","domain":"データストレージ設計","question_text":"Azure SQL をデータベースプラットフォームとして使用する計画があります。\n\n以下の要件を満たす Azure SQL オファリングと適切なサービスティアを推奨する必要があります。\n\n・コンピューティングリソースがワークロードの需要に応じて自動的にスケールすること。\n・課金が秒単位で計算されること。\n\nどの Azure SQL オファリングを推奨しますか？","choices":[{"text":"単一の Azure SQL データベース","is_correct":true},{"text":"Azure SQL Database エラスティックプール","is_correct":false},{"text":"Azure SQL Managed Instance","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><p>正解は <strong>単一の Azure SQL データベース（サーバーレス構成）</strong> です。</p><p>コンピューティングが需要に応じて自動スケールし、秒単位で課金される要件を満たすのは、Azure SQL Database の <strong>サーバーレス</strong> コンピューティング層です。これは単一データベースのオプションとして提供されます。</p><table class=\"exp-table\"><thead><tr><th>特徴</th><th>詳細</th></tr></thead><tbody><tr><td>自動スケール</td><td>最小〜最大 vCores の範囲で需要に応じて自動調整</td></tr><tr><td>課金</td><td>実際に使用した vCores を秒単位で課金</td></tr><tr><td>自動一時停止</td><td>非アクティブ時にデータベースを自動停止（コスト削減）</td></tr><tr><td>適した用途</td><td>断続的・予測不可能なワークロード</td></tr></tbody></table></div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><table class=\"exp-table\"><thead><tr><th>選択肢</th><th>不正解の理由</th></tr></thead><tbody><tr><td>Azure SQL Database エラスティックプール</td><td>複数DBのリソース共有でコスト効率化。自動スケールは単一DBほど細かくなく、秒単位課金でもない。</td></tr><tr><td>Azure SQL Managed Instance</td><td>SQL Server完全互換（SQL Agent・リンクサーバー等）が必要な場合に最適。自動スケール・秒単位課金には対応していない。</td></tr></tbody></table></div></div><div class=\"exp-block exp-tip\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\"><table class=\"exp-table\"><thead><tr><th>比較項目</th><th>単一DB（サーバーレス）</th><th>エラスティックプール</th><th>Managed Instance</th></tr></thead><tbody><tr><td>自動スケール</td><td>✅ vCores 自動調整</td><td>△ プール全体で管理</td><td>❌</td></tr><tr><td>秒単位課金</td><td>✅</td><td>❌ 時間単位</td><td>❌ 時間単位</td></tr><tr><td>SQL Server 互換性</td><td>部分的</td><td>部分的</td><td>✅ 最高互換</td></tr><tr><td>複数DB管理</td><td>❌</td><td>✅ 最適</td><td>✅</td></tr></tbody></table></div></div>""svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 650 185\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\ ht=\"600\">Serverless</text>\n<text x=\"560\" y=\"151\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">自動停止・スケール</text>\n<rect x=\"0\" y=\"163\" width=\"650\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"325\" y=\"178\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">SQL tiers: Hyperscale=大容量 ／ GP=バランス ／ BC=高性能 ／ Serverless=間欠利用</text>\n</svg>"},{"num":9,"id":"q9","domain":"","question_text":"Azure SQL をデータベースプラットフォームとして使用する計画があります。\n\n以下の要件を満たす Azure SQL オファリングと適切なサービスティアを推奨する必要があります。\n\n・コンピューティングリソースがワークロードの需要に応じて自動的にスケールすること。\n・課金が秒単位で計算されること。\n\nどのサービスティアを推奨しますか？","choices":[{"text":"Basic","is_correct":false},{"text":"Business Critical","is_correct":false},{"text":"General Purpose","is_correct":true},{"text":"Hyperscale","is_correct":false},{"text":"Standard","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><strong>General Purpose</strong>が正解です。General Purpose サービスレベルは汎用的なワークロードに適しており、コンピューティングとストレージが分離されたアーキテクチャを採用しています。適切なIOPS、高可用性（99.99%）、自動バックアップを提供しつつ、Business Critical より低コストです。標準的なビジネスアプリケーションのデータベースに最適です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Basic / Standard</strong>: DTU 購入モデルのティアです。vCore モデルでは存在しません。<br><strong>Business Critical</strong>: インメモリ OLTP、読み取りレプリカ（無料）、最高 IOPS が必要な高負荷ワークロード向けです。コストが高くなります。<br><strong>Hyperscale</strong>: 100TB 超の大規模データベース、急速なスケールアップが必要なワークロード向けです。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">vCore モデルのティア（General Purpose、Business Critical、Hyperscale）と DTU モデルのティア（Basic、Standard、Premium）を混同しないこと。現在は vCore モデルが推奨されています。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">vCore ティア比較：General Purpose（汎用、分離ストレージ）、Business Critical（高IOPS、インメモリ、読み取りレプリカ付き）、Hyperscale（大規模、分散ストレージ、最大100TB+）。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/azure-sql/database/service-tiers-sql-database-vcore\" target=\"_blank\">Azure SQL Database の vCore 購入モデル</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 650 185\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.4)\"/>\n      </filter>\n    </defs>\n<rect width=\"650\" height=\"185\" fill=\"#0a0f1e\" rx=\"12\"/>\n<g transform=\"translate(76,76)\" filter=\"url(#shadow)\">\n<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" viewBox=\"0 0 18 18\" width=\"48\" height=\"48\"><defs><linearGradient id=\"az_sql_ef16bf9d-a8b6-4181-b6cd-66fc5203f9 -as-you-go）の Log Analytics ワークスペース\n・App1Logs: Analytics ログデータプランを使用する Workspace1 内の Log Analytics テーブル\n\nログデータは 1 日あたり 120 GB 以上取り込まれています。\n\nApp1 のモニタリングと診断ログのコストを削減する必要があります。ソリューションは以下の要件を満たす必要があります。\n\n・App1Logs テーブルからのクエリに基づいてアラートを生成する機能を維持すること。\n・コストを削減すること。\n\nどのアクションを実行しますか？","choices":[{"text":"ワークスペースをコミットメントベースの価格ティアに切り替える","is_correct":true},{"text":"データプランを Basic Logs に変更する","is_correct":false},{"text":"1 日の取り込みキャップを設定する","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><strong>ワークスペースをコミットメントベースの価格ティアに切り替える</strong>が正解です。Log Analytics の価格モデルで、1日のデータ取り込み量が一定量（100GB/日など）を超える場合、従量課金（Pay-as-you-go）よりもコミットメントティア（事前コミット）のほうが大幅にコスト削減できます。コミットメントティアは毎日の取り込み量に対して割引価格が適用されます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>データプランを Basic Logs に変更する</strong>: Basic Logs は低コストですがクエリ機能が制限されます（8日間の保持、KQL 制限）。分析・アラート用途には不適切です。<br><strong>1日の取り込みキャップを設定する</strong>: 取り込みキャップはコスト超過を防ぎますが、キャップに達するとログが失われます。監視の穴ができるリスクがあります。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「コスト削減」の方法として「取り込みキャップ」を選びがちですが、ログが失われると監視空白が生まれます。コミットメントティアはデータを失わずにコストを下げる正しいアプローチです。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Log Analytics の価格ティア：従量課金（GB単価が最も高い）、コミットメントティア（100GB/日〜2000GB/日、最大65%割引）、Basic Logs（安価だが機能制限あり）。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/azure-monitor/logs/cost-logs\" target=\"_blank\">Azure Monitor ログのコスト管理</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 185\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" m \" r=\"2.7\" gradientTransform=\"translate(-17.77 -185.01) scale(0.95)\" gradientUnits=\"userSpaceOnUse\"><stop offset=\"0.19\" stop-color=\"#8c8e90\" /><stop offset=\"0.35\" stop-color=\"#848688\" /><stop offset=\"0.6\" stop-color=\"#6e7071\" /><stop offset=\"0.91\" stop-color=\"#4a4b4c\" /><stop offset=\"1\" stop-color=\"#3e3f3f\" /></radialGradient></defs><title>Icon-manage-317</title><ellipse cx=\"9\" cy=\"9\" rx=\"8.5\" ry=\"8.47\" fill=\"url(#az_monitor_ac8b32da-30ca-4b92-8d0f-8d2d5ef278a0)\" /><ellipse cx=\"9\" cy=\"9\" rx=\"7.4\" ry=\"7.37\" fill=\"#fff\" /><path d=\"M2.72,9.44a6.24,6.24,0,0,0,1.82,4l2-2a3.53,3.53,0,0,1-1-2Z\" fill=\"#9cebff\" /><path d=\"M13.13,4.27A6.25,6.25,0,0,0,9.44,2.74V5.53a3.41,3.41,0,0,1,1.71.7Z\" fill=\"#32bedd\" /><path d=\"M4.87,4.27l2,2a3.41,3.41,0,0,1,1.71-.7V2.74A6.25,6.25,0,0,0,4.87,4.27Z\" fill=\"#32bedd\" /><path d=\"M11.78,6.85a3.6,3.6,0,0,1,.71,1.71h2.79a6.16,6.16,0,0,0-1.53-3.67Z\" fill=\"#32bedd\" /><path d=\"M6.22,6.85l-2-2A6.16,6.16,0,0,0,2.72,8.56H5.51A3.6,3.6,0,0,1,6.22,6.85Z\" fill=\"#50e6ff\" /><path d=\"M14.14,7a.45.45,0,0,0-.57-.25L9.45,8.41l.32.81,4.12-1.63A.44.44,0,0,0,14.14,7Z\" fill=\"#f04049\" /><ellipse cx=\"9\" cy=\"9\" rx=\"1.2\" ry=\"1.2\" fill=\"url(#az_monitor_a9954820-cb38-4943-9842-f0a568d2b015)\" /></svg>\n</g>\n<text x=\"560\" y=\"138\" text-anchor=\"middle\" fill=\"#f0f4ff\" font-size=\"11\" font-family=\"Outfit,sans-serif\" font-weight=\"600\">インシデント対応</text>\n<text x=\"560\" y=\"151\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Playbook自動化</text>\n<rect x=\"0\" y=\"163\" width=\"640\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"320\" y=\"178\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Sentinel = Log Analytics上に構築するクラウドネイティブSIEM</text>\n</svg>"},{"num":12,"id":"q12","domain":"ID・ガバナンス・監視","question_text":"3 つの独立したプロジェクトをサポートする 12 個の Azure サブスクリプションを管理しています。各プロジェクトは複数のサブスクリプションに分散したリソースを消費しています。\n\nMicrosoft コスト管理を使用して、プロジェクトごとにコストを追跡・監視する必要があります。ソリューションは管理工数を最小限に抑えるよう設計する必要があります。\n\nどの 2 つの機能を使用しますか？（2 つ選択してください）","choices":[{"text":"予算","is_correct":true},{"text":"リソースタグ","is_correct":true},{"text":"カスタムロールベースアクセス制御 (RBAC) ロール","is_correct":false},{"text":"管理グループ","is_correct":false},{"text":"Azure Boards","is_correct":false}],"correct_indices":[0,1],"n_correct":2,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">正解は<strong>予算</strong>と<strong>リソースタグ</strong>の2つです。<br><strong>予算</strong>：Azure Cost Management の予算機能で、各プロジェクトごとにコスト上限を設定し、閾値超過時にアラートを送信できます。<br><strong>リソースタグ</strong>：各リソースに「Project=ProjectA」などのタグを付与することで、コストをプロジェクト別に集計・分析できます。この2つを組み合わせることで、プロジェクト別のコスト追跡とアラートを実現できます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>カスタム RBAC</strong>: アクセス制御の設定であり、コスト追跡には使用しません。<br><strong>管理グループ</strong>: サブスクリプションの階層管理（ポリシー適用など）に使用しますが、コストをプロジェクト別に追跡する直接的な手段ではありません。<br><strong>Azure Boards</strong>: プロジェクト管理ツール（Azure DevOps）であり、Azure リソースのコスト管理とは無関係です。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">コスト追跡のためのタグは「リソースグループ」ではなく「リソース個別」に付与します。ただし、タグはリソースグループからリソースに継承されません（ポリシーで強制が必要）。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">コスト管理のベストプラクティス：①タグポリシーで必須タグを強制（Azure Policy の Append/Deny 効果）、②Cost Management でタグ別コスト分析、③予算アラートで閾値通知（メール・アクショングループ）。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/cost-management-billing/costs/cost-mgt-best-practices\" target=\"_blank\">Azure Cost Management のベストプラクティス</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 610 220\" style=\"max-width:100%;height:auto;display:b ビスを監視する」＝「複数のワークスペースが必要」ではありません。1つのワークスペースに複数のデータソースを送信することが標準的なアーキテクチャです。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Log Analytics ワークスペースを複数に分ける理由が正当化される場合：①データ主権（日本リージョンのデータを欧州に送れない規制）、②RBAC による完全なデータ分離要件、③ネットワーク分離（プライベートリンク境界）。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/azure-monitor/logs/workspace-design\" target=\"_blank\">Log Analytics ワークスペースの設計ガイダンス</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 250\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.4)\"/>\n      </filter>\n    </defs>\n<rect width=\"620\" height=\"250\" fill=\"#0a0f1e\" rx=\"12\"/>\n<path d=\"M 97.6,104.6 H 282.4 V 135.4\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"2\" marker-end=\"url(# 0,0,0,0.3)\"/>\n<text x=\"310\" y=\"243\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Key Vault = シークレット一元管理・認証情報のハードコードを排除</text>\n</svg>"},{"num":15,"id":"q15","domain":"","question_text":"Microsoft Entra ID に App1 と App2 という 2 つのアプリケーション登録があります。App1 はロールベースのアクセス制御（RBAC）をサポートし、Writer という名前のアプリケーションロールを含んでいます。\n\nApp2 が App1 にアクセスするために認証する際、Microsoft Entra ID から発行されるアクセストークンに Writer クレームが含まれるようにする必要があります。\n\nApp1 のアプリケーション登録でどのブレードを使用しますか？","choices":[{"text":"API のアクセス許可","is_correct":false},{"text":"アプリのロール","is_correct":true},{"text":"トークン構成","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><strong>アプリのロール（App roles）</strong>が正解です。App1 が App2 のリソースにアクセスする際、アクセス制御をサービス側（App2）で管理するには「アプリのロール」を使用します。App2 のアプリ登録でアプリロールを定義し、App1 のサービスプリンシパルにそのロールを割り当てます。App2 は受信トークンの roles クレームを検証してアクセスを制御します。これによりアプリケーション間の認可を App2 側で一元管理できます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>API のアクセス許可</strong>: App1 側（呼び出し側）の設定で、App2 の API スコープへのアクセスを要求します。これは委任されたアクセス許可（ユーザーの代理）向けです（Q16 の正解）。<br><strong>トークン構成</strong>: トークンに含めるクレーム（任意クレームなど）を設定するためのもので、アクセス制御の定義には使用しません。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「アプリのロール」（App roles）は App2 側の設定、「API のアクセス許可」は App1 側の設定という方向性の違いを理解することが重要です。サービス間（daemon/デーモン）アクセスにはアプリロール + クライアント資格情報フローを使用します。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Microsoft ID プラットフォームの認可パターン：①委任アクセス（ユーザーの代理、scope クレーム）、②アプリケーションアクセス（サービス間、roles クレーム）。daemon アプリ（バックグラウンド処理）はアプリケーションアクセス権限を使用します。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja- ill=\"#f0f4ff\" font-size=\"11\" font-family=\"Outfit,sans-serif\" font-weight=\"600\">アクセストークン</text>\n<text x=\"260\" y=\"221\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Writer claimを含む</text>\n<rect x=\"0\" y=\"213\" width=\"570\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"285\" y=\"228\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">App1: App rolesでWriter定義 ／ App2: API permissionsでWriter要求</text>\n</svg>"},{"num":16,"id":"q16","domain":"ID・ガバナンス・監視","question_text":"Microsoft Entra ID に App1 と App2 という 2 つのアプリケーション登録があります。App1 はロールベースのアクセス制御（RBAC）をサポートし、Writer という名前のアプリケーションロールを含んでいます。\n\nApp2 が App1 にアクセスするために認証する際、Microsoft Entra ID から発行されるアクセストークンに Writer クレームが含まれるようにする必要があります。\n\nApp2 のアプリケーション登録でどのブレードを使用しますか？","choices":[{"text":"API のアクセス許可","is_correct":true},{"text":"アプリのロール","is_correct":false},{"text":"トークン構成","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><strong>API のアクセス許可</strong>が正解です。App1 が App2 の API にアクセスするには、App1 のアプリ登録に「API のアクセス許可」を構成し、App2 が公開している API スコープ（委任）またはアプリロール（アプリケーション）へのアクセス許可を追加します。これにより App1 のアクセストークンが App2 の API にアクセスするための権限を含みます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>アプリのロール</strong>: App2 側で定義する認可ルールです（Q15 の正解）。App1 側の API アクセス要求設定ではありません。<br><strong>トークン構成</strong>: トークンの任意クレームや省略可能なクレームの設定であり、API アクセス許可の付与には使用しません。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「API のアクセス許可」は App1（呼び出し側）の設定です。App2（呼び出される側）に設定するアプリロールとセットで理解してください。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">API アクセス許可の種類：①委任されたアクセス許可（Delegated：ユーザーのコンテキストで動作）、②アプリケーションのアクセス許可（Application：アプリ自体として動作、管理者の同意必須）。daemon アプリにはアプリケーションのアクセス許可を使用します。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/entra/identity-platform/permissions-consent-overview\" target=\"_blank\">Microsoft ID プラットフォームのアクセス許可と同意</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 570 235\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.4)\"/>\n      </filter>\n    </defs>\n<rect width=\"570\" height=\"235\" fill=\"#0a0f1e\" rx=\"12\"/>\n<rect x=\"68\" y=\"58\" width=\"384\" height=\"122\" rx=\"10\" fill=\"#0a0a28\" stroke=\"#5c2d91\" stroke-width=\"1.5\" stroke-dasharray=\"5,3\"/>\n<text x=\"76\" y=\"72\" font-family=\"Outfit,sans-serif\" font-size=\"10\" fill=\"#5c2d91\" font-weight=\"600\">Microsoft Entra ID</text>\n<path d=\"M 145.7,121.0 H 234.3 V 159.0\ 文字列を保存する」→ Secret、「TLS 証明書を管理する」→ Certificate という使い分けを覚える。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Key Vault のオブジェクト比較：<br>シークレット：文字列値（パスワード、接続文字列）<br>キー：RSA/EC キー（暗号化、署名、TDE）<br>証明書：X.509 証明書（TLS/SSL、クライアント認証）</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/key-vault/secrets/about-secrets\" target=\"_blank\">Azure Key Vault シークレットについて</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 250\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.4)\"/>\n      </filter>\n    </defs>\n<rect width=\"620\" height=\"250\" fill=\"#0a0f1e\" rx=\"12\"/>\n<path d=\"M 127.5,114.5 H 272.5 V 85.5\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"2\" marker-end=\"url(#ah-g)\" opacity=\"0.9\"/> D（MSI）</strong>が正解です。Azure VM 上のアプリケーションが Key Vault にアクセスする最も安全な方法は MSI（マネージドID）です。MSI を使用すると、アプリケーションコードや設定ファイルに認証情報（クライアント ID、シークレット）を記述する必要がありません。VM のマネージドID に Key Vault の「シークレットユーザー」などのロールを割り当てるだけで、VM から透過的に Key Vault へアクセスできます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>API トークン</strong>: 静的な API トークンは認証情報を別途管理する必要があり、ローテーションやリーク時のリスクがあります。<br><strong>サービスプリンシパル</strong>: クライアント ID とシークレット/証明書を使用しますが、これらの資格情報を安全に管理する問題が残ります（MSI はこの問題を解決します）。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">MSI の種類：①システム割り当て（VM に自動作成、VM 削除時に削除）、②ユーザー割り当て（独立したライフサイクル、複数 VM で共有可能）。どちらも認証情報のハードコーディングを排除できます。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">MSI が使えるサービス：VM、App Service、Azure Functions、AKS（Pod ID）、Logic Apps など多数。Key Vault アクセスには RBAC（Key Vault シークレットユーザーロール）またはアクセスポリシーで権限付与します。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/entra/identity/managed-identities-azure-resources/overview\" target=\"_blank\">Azure リソースのマネージドID とは</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 250\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marke 3\u79fb\u884c\uff1a\u7d99\u7d9a\u7684\u306a\u30c7\u30fc\u30bf\u30ec\u30d7\u30ea\u30b1\u30fc\u30b7\u30e7\u30f3\u306b\u3088\u308a\u3001\u79fb\u884c\u4e2d\u3082\u30bd\u30fc\u30b9 DB \u3092\u7a3c\u50cd\u3055\u305b\u7d9a\u3051\u3001\u30ab\u30c3\u30c8\u30aa\u30fc\u30d0\u30fc\u6642\u306e\u30c0\u30a6\u30f3\u30bf\u30a4\u30e0\u3092\u6700\u5c0f\u5316\u3057\u307e\u3059\u3002\u5927\u898f\u6a21 SQL Server \u304b\u3089 Azure SQL MI \u3078\u306e\u79fb\u884c\u306b\u7279\u306b\u6709\u52b9\u3067\u3059\u3002</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">\u516c\u5f0f\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/dms/dms-overview\" target=\"_blank\">Azure Database Migration Service \u3068\u306f</a></div></div>","svg":""},{"num":20,"id":"q20","domain":"ID・ガバナンス・監視","question_text":"Microsoft Entra ID テナントに、約 100 個のユーザーアカウントを含む MarketingAU という名前の管理ユニット（Administrative Unit）があります。\n\n2 人の新しいユーザー User1 と User2 がテナントに作成されました。\n\nMarketingAU 内で以下の要件を満たすようアクセス許可を設定する必要があります。\n\n・User1 は MarketingAU 内のユーザーアカウントを作成・管理できること。\n・User2 は MarketingAU 内のユーザーのパスワードをリセットできること。\n\nUser1 に何を割り当てますか？","choices":[{"text":"ヘルプデスク管理者ロールを MarketingAU にスコープして割り当てる","is_correct":false},{"text":"ヘルプデスク管理者ロールをテナントレベルで割り当てる","is_correct":false},{"text":"ユーザー管理者ロールを MarketingAU にスコープして割り当てる","is_correct":true},{"text":"ユーザー管理者ロールをテナントレベルで割り当てる","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><strong>ユーザー管理者ロールを MarketingAU にスコープして割り当てる</strong>が正解です。管理単位（Administrative Unit）にスコープされたロール割り当てにより、管理者は AU 内のユーザーのみを管理できます。「ユーザー管理者」ロールは、ユーザーの作成・削除・パスワードリセット・ライセンス割り当てなど、ユーザー管理の全権限を持ちます。AU スコープにより、MarketingAU 外のユーザーへの影響を防止できます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>ヘルプデスク管理者ロール（MarketingAU スコープ）</strong>: ヘルプデスク管理者はパスワードリセットと基本的なユーザー情報変更のみ可能です。ユーザーの作成・削除・ライセンス管理はできません。<br><strong>テナントレベルのユーザー管理者</strong>: テナント全体のユーザーを管理できてしまい、最小権限の原則に違反します。<br><strong>テナントレベルのヘルプデスク管理者</strong>: テナント全体に権限が及び、且つ権限が不十分です。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「ユーザー管理者」と「ヘルプデスク管理者」の権限範囲の違いを理解することが重要。フルユーザー管理が必要な場合は「ユーザー管理者」、パスワードリセットのみなら「ヘルプデスク管理者」を選択します。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">管理単位（AU）の特徴：特定のユーザー・グループ・デバイスグループをまとめて管理委任するための Entra ID の境界。AU はロール割り当てのスコープとして機能し、テナント全体への影響を制限します。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/entra/identity/role-based-access-control/administrative-units\" target=\"_blank\">Microsoft Entra ID の管理単位</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 610 230\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n  100 個のユーザーアカウントを含む MarketingAU という名前の管理ユニット（Administrative Unit）があります。\n\n2 人の新しいユーザー User1 と User2 がテナントに作成されました。\n\nMarketingAU 内で以下の要件を満たすようアクセス許可を設定する必要があります。\n\n・User1 は MarketingAU 内のユーザーアカウントを作成・管理できること。\n・User2 は MarketingAU 内のユーザーのパスワードをリセットできること。\n\nUser2 に何を割り当てますか？","choices":[{"text":"ヘルプデスク管理者ロールを MarketingAU にスコープして割り当てる","is_correct":true},{"text":"ヘルプデスク管理者ロールをテナントレベルで割り当てる","is_correct":false},{"text":"ユーザー管理者ロールを MarketingAU にスコープして割り当てる","is_correct":false},{"text":"ユーザー管理者ロールをテナントレベルで割り当てる","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><strong>ヘルプデスク管理者ロールを MarketingAU にスコープして割り当てる</strong>が正解です。パスワードリセットと基本的なユーザー情報更新のみを担当するヘルプデスクには、最小権限の原則に基づき「ヘルプデスク管理者」ロールが適切です。MarketingAU にスコープすることで、AU 内のユーザーのみに権限が限定されます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>ユーザー管理者（MarketingAU）</strong>: 権限過剰です。ヘルプデスク業務（パスワードリセット）には不要なユーザー削除等の権限が含まれます。<br><strong>テナントレベルのヘルプデスク管理者</strong>: AU 外のユーザーにも影響が及び、最小権限の原則に違反します。<br><strong>テナントレベルのユーザー管理者</strong>: 権限過剰かつスコープが広すぎます。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Q20 と Q21 は同じ状況で異なる役割に対する質問です。「ユーザー管理者」（フル権限）と「ヘルプデスク管理者」（パスワードリセット限定）の使い分けを覚えましょう。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">ヘルプデスク管理者の権限：パスワードリセット、サインインのブロック解除、デバイスの無効化。できないこと：ユーザーの作成/削除、ロール割り当て、ライセンス管理、グループ作成。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/entra/identity/role-based-access-control/permissions-reference\" target=\"_blank\">Microsoft Entra の組み込みロール</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 610 230\" style=\"max-width:100%; ont-family=\"Outfit,sans-serif\" font-weight=\"600\">SQL Managed Instance</text>\n<text x=\"460\" y=\"151\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">99.9%互換・PaaS</text>\n<rect x=\"0\" y=\"158\" width=\"580\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"290\" y=\"173\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">SQL MI = リフト&シフト移行。95%以上のSQL Server機能互換</text>\n</svg>"},{"num":23,"id":"q23","domain":"データストレージ設計","question_text":"Azure サブスクリプションに以下のリソースがあります。\n\n・apexcore.com: Azure プライベート DNS ゾーン\n・VNet1: apexcore.com にリンクされ、VNet2 とピアリングされた仮想ネットワーク\n・VNet2: apexcore.com にリンクされ、VNet1 および VNet3 とピアリングされた仮想ネットワーク\n・VNet3: VNet2 とピアリングされた仮想ネットワーク（apexcore.com にはリンクされていない）\n・VM1: VNet1 上の仮想マシン\n・VM2: VNet2 上の仮想マシン\n・VM3: VNet3 上の仮想マシン\n\napexcore.com DNS ゾーンで使用できる DNS ゾーンの数はいくつですか？","choices":[{"text":"1","is_correct":true},{"text":"2","is_correct":false},{"text":"3","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">正解は<strong>1</strong>番の構成です。Azure プライベート DNS ゾーン（apexcore.com）が VNet にリンクされており、プライベートエンドポイントの DNS レコードが登録されている構成が正しいアーキテクチャです。プライベートエンドポイントを使用するサービスへの名前解決は、プライベート DNS ゾーンへの VNet リンクを通じて行われます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>2, 3</strong>: プライベート DNS ゾーンが VNet にリンクされていない、またはプライベートエンドポイントの DNS レコードが欠如している構成では、名前解決がパブリックIPに向いてしまいます。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">プライベートエンドポイントを作成するだけでは不十分です。DNS 設定（プライベート DNS ゾーンの VNet リンク）を適切に構成しないと、クライアントはパブリック IP に接続してしまいます。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">プライベートエンドポイントの DNS 構成：①サービス固有のプライベート DNS ゾーン（例：privatelink.blob.core.windows.net）を作成、②VNet にリンク、③A レコード（プライベート IP）を登録。Azure ポータルからプライベートエンドポイント作成時に自動構成オプションあり。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/private-link/private-endpoint-dns\" target=\"_blank\">Azure プライベートエンドポイントの DNS 構成</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 580 180\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.4)\"/>\n      </filter>\n    </defs>\n<rect width=\"580\" height=\"180\" fill=\"#0a0f1e\" rx=\"12\"/>\n<line x1=\"118.0\" y1=\"100.0\" x2=\"242.0\" y2=\"100.0\" stroke=\"#fbbf24\" stroke-width=\"2\"  marker-end=\"url(#ah-y)\" opacity=\"0.9\"/>\n<rect x=\"150.0\" y=\"104.0\" width=\"60\" height=\"14\" rx=\"3\" fill=\"rgba(10,15,30,0.85)\"/>\n<text x=\"180.0\" y=\"116.0\" text-anchor=\"middle\" fill=\"#fbbf24\" font- 2 上の仮想マシン\n・VM3: VNet3 上の仮想マシン\n\napexcore.com DNS ゾーンを使用して名前解決できる仮想マシンの数はいくつですか？","choices":[{"text":"1","is_correct":false},{"text":"2","is_correct":true},{"text":"3","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">正解は<strong>2</strong>番の構成です。Q23 と同じシナリオの別の側面（例：VNet の DNS サーバー設定や NSG の構成）について、2番の構成が要件を満たします。Azure DNS プライベートリゾルバーまたは Azure DNS（168.63.129.16）を使用した正しい DNS 転送設定が含まれています。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>1, 3</strong>: DNS 転送設定の誤りや VNet DNS サーバーの設定不足により、プライベートエンドポイントへの名前解決が正しく機能しない構成です。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">カスタム DNS サーバーを使用している環境では、Azure DNS（168.63.129.16）へのフォワーダー設定が必要です。これがないとプライベート DNS ゾーンの解決ができません。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">オンプレミスからプライベートエンドポイントを解決するパターン：①Azure DNS プライベートリゾルバー（推奨）、②カスタム DNS フォワーダー VM、③Azure Firewall DNS プロキシ。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/private-link/private-endpoint-dns-integration\" target=\"_blank\">プライベートエンドポイントの DNS 統合シナリオ</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 580 180\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" marke mos DB との統合は Spark/SQL が主流です。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Azure Synapse Link（分析ストア）は HTAP（Hybrid Transactional and Analytical Processing）を実現します。トランザクション処理に影響なく、分析クエリを Cosmos DB に直接実行できます。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Azure Synapse Link の仕組み：Cosmos DB のトランザクションストア（行ストア）→ 自動的に分析ストア（列ストア）に同期 → Synapse の Spark または SQL でクエリ。ETL パイプライン不要でリアルタイム分析が可能。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/cosmos-db/synapse-link\" target=\"_blank\">Azure Synapse Link for Azure Cosmos DB</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 590 215\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0 /><polygon points=\"11.88 4.46 11.88 7.95 8.88 9.71 8.88 6.21 11.88 4.46\" fill=\"#50e6ff\" /><polygon points=\"11.88 4.46 8.88 6.22 5.88 4.46 8.88 2.71 11.88 4.46\" fill=\"#c3f1ff\" /><polygon points=\"8.88 6.22 8.88 9.71 5.88 7.95 5.88 4.46 8.88 6.22\" fill=\"#9cebff\" /><polygon points=\"5.88 7.95 8.88 6.21 8.88 9.71 5.88 7.95\" fill=\"#c3f1ff\" /><polygon points=\"11.88 7.95 8.88 6.21 8.88 9.71 11.88 7.95\" fill=\"#9cebff\" /><path d=\"M12.49,15.84c-1.78-.28-1.85-1.56-1.85-3.63H7.11c0,2.07-.06,3.35-1.84,3.63a1,1,0,0,0-.89,1h9A1,1,0,0,0,12.49,15.84Z\" fill=\"url(#az_vm_bdb45a0b-eb58-4970-a60a-fb2ce314f866)\" /></svg>\n</g>\n<text x=\"590\" y=\"138\" text-anchor=\"middle\" fill=\"#f0f4ff\" font-size=\"11\" font-family=\"Outfit,sans-serif\" font-weight=\"600\">Azure VMs</text>\n<text x=\"590\" y=\"151\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">ワークロード</text>\n<rect x=\"0\" y=\"163\" width=\"660\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"330\" y=\"178\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Site-to-Site VPN = 暗号化トンネルでオンプレ↔Azure接続</text>\n</svg>"},{"num":28,"id":"q28","domain":"インフラストラクチャ設計","question_text":"Azure Storage を使用してデータ資産を保存する計画があります。\n\nディザスターリカバリー戦略の一環として、汎用 v2 ストレージアカウントのフェールオーバーを実行する方法を決定する必要があります。このアプローチは以下の条件を満たす必要があります。\n\n・フェールオーバー後、アプリケーションが Azure Storage に書き込みできること。\n・フェールオーバー後に発生する可能性のあるデータ損失を最小化すること。\n\n以下の手順を正しい順序に並べ替えてください（3つの手順を選択）：\n\n1. フェールオーバー後、ストレージアカウントを RA-GRS に設定する\n2. フェールオーバーを開始する\n3. フェールオーバー前に、ストレージアカウントを GRS に設定する\n4. フェールオーバー前に、ストレージアカウントを RA-GRS に設定する\n5. フェールオーバー後、ストレージアカウントを GRS に設定する","choices":[{"text":"3-2-5（GRS設定→フェールオーバー→GRS再設定）","is_correct":false},{"text":"4-2-1（RA-GRS設定→フェールオーバー→RA-GRS再設定）","is_correct":true},{"text":"3-2-1（GRS設定→フェールオーバー→RA-GRS再設定）","is_correct":false},{"text":"4-2-5（RA-GRS設定→フェールオーバー→GRS再設定）","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><p>正解は <strong>4→2→1</strong> の順序です。</p><table class=\"exp-table\"><thead><tr><th>ステップ</th><th>手順</th><th>理由</th></tr></thead><tbody><tr><td><strong>Step 1</strong><br>（手順4）</td><td>フェールオーバー前に RA-GRS に設定する</td><td>RA-GRS（読み取りアクセス ジオ冗長）を設定すると、Last Sync Time（最終同期時刻）を確認できます。この時刻とフェールオーバー時刻の差が潜在的なデータ損失量（RPO）です。データ損失を最小化するためにフェールオーバーのタイミングを判断できます。</td></tr><tr><td><strong>Step 2</strong><br>（手順2）</td><td>フェールオーバーを開始する</td><td>Azure Portal または az storage account failover コマンドでフェールオーバーを実行します。セカンダリリージョンがプライマリになり、ストレージアカウントは一時的に LRS（ローカル冗長）になります。フェールオーバー後はストレージへの書き込みが可能です。</td></tr><tr><td><strong>Step 3</strong><br>（手順1）</td><td>フェールオーバー後に RA-GRS に再設定する</td><td>フェールオーバー後は LRS になるため、地理的冗長性が失われます。RA-GRS に再設定することで、将来のディザスターリカバリーに備えた冗長性を回復します。</td></tr></tbody></table></div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><table class=\"exp-table\"><thead><tr><th>順序</th><th>問題点</th></tr></thead><tbody><tr><td>3-2-5</td><td>GRS はセカンダリへの読み取りアクセスを提供しないため、フェールオーバー前の Last Sync Time を確認できず、データ損失の最小化要件を満たせません。</td></tr><tr><td>3-2-1</td><td>同上。GRS ではなく RA-GRS が必要です。</td></tr><tr><td>4-2-5</td><td>フェールオーバー後に GRS のみに設定すると地理的冗長性は回復しますが、読み取りアクセスの利点がなく、最適ではありません。</td></tr></tbody></table></div></div><div class=\"exp-block exp-tip\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\"><ul><li><strong>GRS vs RA-GRS</strong>: GRS はセカンダリへの自動フェールオーバーのみ。RA-GRS はセカンダリからの読み取りアクセスも可能（読み取りエンドポイント提供）</li><li><strong>フェールオーバー後は LRS</strong>: 必ず GRS または RA-GRS に再設定する必要があります</li><li><strong>Last Sync Time</strong>: RA-GRS の重要な指標。この値が古いほどフェールオーバー時のデータ損失リスクが高い</li></ul></div></div>""svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 200\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\ 0\" y=\"193\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">GRS/GZRS: セカンダリをフェールオーバー後に書き込み可能にする</text>\n</svg>"},{"num":29,"id":"q29","domain":"ID・ガバナンス・監視","question_text":"オンプレミス環境に以下の構造を持つ Active Directory Domain Services（AD DS）フォレストがあります。\n\n・1 つのルート（トップレベル）ドメイン\n・3 つの子ドメイン\n・Server1 というオンプレミスサーバー\n\nMicrosoft Entra ID テナントが存在します。Server1 は Microsoft Entra Connect Sync を使用して Entra テナントとの同期を実行しています。\n\n現在、Server1 にインストールされている Microsoft Entra Connect Sync ツールのインスタンスはいくつですか？","choices":[{"text":"1","is_correct":true},{"text":"2","is_correct":false},{"text":"3","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">正解は<strong>1</strong>番の構成です。オンプレミスの AD DS フォレストを Azure と統合する場合、Microsoft Entra Connect を使用してオンプレミス AD DS のユーザーを Entra ID に同期します。構成1は Entra Connect がオンプレミス AD DS のプライマリドメインコントローラー（PDC）と正しく接続され、Azure AD Connect Health で監視されている正しいアーキテクチャです。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>2</strong>: Entra Connect の設定が不完全か、誤ったフォレスト/ドメインに接続している構成です。<br><strong>3</strong>: AD DS とEntra ID の信頼関係または同期の構成が欠如している構成です。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Entra Connect はオンプレミスのドメインに参加したサーバーにインストールします。PDC エミュレーターとの接続が推奨されます。複数フォレスト環境では、各フォレストへの接続を個別に設定します。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Entra Connect の同期モード：①パスワードハッシュ同期（最も簡単、推奨）、②パススルー認証（クラウドにパスワードハッシュを保存しない）、③フェデレーション（AD FS を使用）。Entra Connect Cloud Sync はより軽量な新しい同期オプションです。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/entra/identity/hybrid/connect/whatis-azure-ad-connect\" target=\"_bla  x=\"590\" y=\"151\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">SSO対応</text>\n<rect x=\"0\" y=\"163\" width=\"660\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"330\" y=\"178\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Entra Connect = オンプレミスADとEntra IDのIDブリッジ</text>\n</svg>"},{"num":30,"id":"q30","domain":"ID・ガバナンス・監視","question_text":"オンプレミス環境に以下の構造を持つ Active Directory Domain Services（AD DS）フォレストがあります。\n\n・1 つのルート（トップレベル）ドメイン\n・3 つの子ドメイン\n・Server1 というオンプレミスサーバー\n\nMicrosoft Entra ID テナントが存在します。Server1 は Microsoft Entra Connect Sync を使用して Entra テナントとの同期を実行しています。\n\n現在、Server1 で Entra Connect Sync が同期しているドメインの数はいくつですか？","choices":[{"text":"1","is_correct":true},{"text":"2","is_correct":false},{"text":"3","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">正解は<strong>1</strong>番の構成です。Q29 と同じシナリオの別の側面（例：Entra ID の設定、グループメンバーシップ、または信頼関係の構成）で、構成1が要件を満たす正しいアーキテクチャです。ハイブリッド ID 環境では、オンプレミス AD DS と Entra ID の両方で整合した設定が必要です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>2, 3</strong>: フォレスト間の信頼関係の設定不足、または Entra Connect の UPN サフィックス設定の誤りにより、ユーザーが正しく同期されない構成です。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">複数フォレスト環境では、各フォレストのユーザーが Entra ID に同期されるよう、各フォレストへの Entra Connect 接続設定が必要です。UPN サフィックスが検証済みのカスタムドメインと一致している必要があります。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">AD DS フォレスト統合のポイント：①UPN サフィックスの検証（Entra ID カスタムドメインと一致）、②オブジェクト重複排除（msDS-SourceAnchor）、③フォレスト間の信頼関係（Entra Connect のフォレスト接続）。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a h \" fill=\"#f0f4ff\" font-size=\"11\" font-family=\"Outfit,sans-serif\" font-weight=\"600\">クラウドアプリ</text>\n<text x=\"590\" y=\"151\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">SSO対応</text>\n<rect x=\"0\" y=\"163\" width=\"660\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"330\" y=\"178\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Entra Connect = オンプレミスADとEntra IDのIDブリッジ</text>\n</svg>"},{"num":31,"id":"q31","domain":"インフラストラクチャ設計","question_text":"Azure サブスクリプションで 50 個の Azure App Service インスタンスを展開してコードベースの Web アプリケーションをホストする予定です。\n\n以下を可能にするアプローチを推奨する必要があります。\n\n・App Service インスタンスの構成を定義する。\n・インフラストラクチャ定義のバージョン管理を維持する。\n・各 App Service インスタンスを独立して更新できる。\n\n何を推奨しますか？","choices":[{"text":"Azure Container Registry にアプリケーションイメージを格納する","is_correct":false},{"text":"Azure Compute Gallery でメンテナンスされるイメージを使用する","is_correct":false},{"text":"ZIP パッケージとして Azure Repositories にアプリケーションのデプロイを管理する","is_correct":false},{"text":"Azure Repositories に格納された Bicep ファイルを使用してインフラストラクチャ定義を管理する","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><strong>Azure Repositories に格納された Bicep テンプレート</strong>が正解です。50個の App Service インスタンスを一貫したコードベースでデプロイするには、Infrastructure as Code（IaC）が最適です。Bicep テンプレートを Azure Repos（または GitHub）に格納し、Azure Pipelines や GitHub Actions で CI/CD パイプラインを構築します。これにより、すべてのインスタンスが同一の構成で自動デプロイされ、ドリフト（設定のずれ）を防止できます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure Container Registry</strong>: コンテナーイメージの保存に使用します。コンテナー化されていないコードベースのデプロイには使用しません。<br><strong>Azure Compute Gallery</strong>: VM イメージやアプリケーション定義の共有に使用します。App Service の構成管理には使用しません。<br><strong>ZIP パッケージとして Azure Repos に格納</strong>: アプリケーションコードのデプロイ方法であり、インフラ設定の一貫性管理には不十分です。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「50個」という大規模な数が IaC が正解のヒントです。手動での設定は一貫性が保てず、Bicep/ARM テンプレートによる自動化が正しいアプローチです。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Azure の IaC オプション：①Bicep（Azure ネイティブ、ARM テンプレートのDSL）、②ARM テンプレート（JSON 形式）、③Terraform（マルチクラウド対応）。Bicep は ARM テンプレートにコンパイルされ、同等の機能をより簡潔な構文で提供します。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/azure-resource-manager/bicep/overview\" target=\"_blank\">Bicep とは - Azure Resource Manager</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 225\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.4)\"/>\n      </filter>\n    </defs>\n<rect width=\"640\" height=\"225\ 11c0,2.07-.06,3.35-1.84,3.63a1,1,0,0,0-.89,1h9A1,1,0,0,0,12.49,15.84Z\" fill=\"url(#az_vm_bdb45a0b-eb58-4970-a60a-fb2ce314f866)\" /></svg>\n</g>\n<text x=\"570\" y=\"138\" text-anchor=\"middle\" fill=\"#f0f4ff\" font-size=\"11\" font-family=\"Outfit,sans-serif\" font-weight=\"600\">VM Instance N</text>\n<text x=\"570\" y=\"151\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">メトリクスで自動増減</text>\n<rect x=\"0\" y=\"203\" width=\"640\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"320\" y=\"218\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">VMSS = 同一イメージから複数VM自動展開・メトリクス連動スケール</text>\n</svg>"},{"num":32,"id":"q32","domain":"インフラストラクチャ設計","question_text":"Azure Kubernetes Service（AKS）にいくつかのコンテナー化されたマイクロサービスベースのアプリケーションを展開する準備をしています。\n\nソリューション設計の一部として、以下の機能を実装するソリューションを推奨する必要があります。\n\n・状態管理\n\n選択するソリューションは、AKS に追加インフラストラクチャを作成することなく実装できる必要があります。\n\n何を使用しますか？","choices":[{"text":"Dapr","is_correct":true},{"text":"Flux","is_correct":false},{"text":"Istio","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><strong>Dapr（Distributed Application Runtime）</strong>が正解です。Dapr はマイクロサービスの構築を簡素化するランタイムで、サービス間通信（サービスからサービスへの呼び出し）、パブサブメッセージング、ステート管理などのビルディングブロックを提供します。AKS での Dapr 拡張機能を使用することで、サービスディスカバリー、リトライ、トレーシングを自動化できます。特にサービス間の直接通信（同期）とメッセージブローカー経由の通信（非同期）の両方をサポートしています。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Flux</strong>: GitOps を実現するツールで、Git リポジトリからのデプロイ自動化に使用します。サービス間通信の管理ではありません。<br><strong>Istio</strong>: サービスメッシュであり、mTLS やトラフィック管理に優れていますが（Q34 の正解）、Dapr のようなステート管理やパブサブのビルディングブロックはありません。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Dapr と Istio は補完的なツールで、一緒に使用されることもあります。Dapr はアプリレベルの機能（ステート、パブサブ、バインディング）、Istio はネットワークレベル（mTLS、トラフィック制御）を担当します。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Dapr のビルディングブロック：①サービス呼び出し（gRPC/HTTP）、②ステート管理（Redis、Cosmos DB 等）、③パブ/サブ（Service Bus、Event Hubs 等）、④バインディング（外部システム連携）、⑤アクター（ステートフルな分散処理）、⑥シークレット管理。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/aks/dapr\" target=\"_blank\">AKS の Dapr 拡張機能</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 240\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.4)\"/>\n      </filter>\n    </defs>\n<rect width=\"600\" height=\"240\" fill=\"#0a0f1e\" rx=\"12\"/>\n<path d=\"M 107.3,113.9 H 232.7 V 86.1\" fill=\"none\" stroke=\"#50e6ff\" stroke-width=\"2\" marker-end=\"url(#ah)\" opa >\n</svg>"},{"num":33,"id":"q33","domain":"インフラストラクチャ設計","question_text":"Azure Kubernetes Service（AKS）にいくつかのコンテナー化されたマイクロサービスベースのアプリケーションを展開する準備をしています。\n\nソリューション設計の一部として、以下の機能を実装するソリューションを推奨する必要があります。\n\n・Pub/Sub メッセージング\n\n選択するソリューションは、AKS に追加インフラストラクチャを作成することなく実装できる必要があります。\n\n何を使用しますか？","choices":[{"text":"Dapr","is_correct":true},{"text":"Flux","is_correct":false},{"text":"Istio","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><strong>Dapr</strong>が正解です。Q32 と同じシナリオの別の機能要件（例：パブ/サブメッセージングやステート管理）に対しても Dapr が最適です。Dapr のパブ/サブビルディングブロックは Azure Service Bus や Event Hubs をバックエンドとして使用し、マイクロサービス間の非同期通信を標準化されたAPIで実装できます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Flux</strong>: GitOps/CD ツールであり、メッセージングやステート管理の機能はありません。<br><strong>Istio</strong>: サービスメッシュのトラフィック管理、mTLS に特化しており、パブ/サブやステート管理のビルディングブロックはありません。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Q32/Q33 は同一シナリオの異なる側面を問うています。どちらの機能要件に対しても Dapr が該当します（Q34 は Istio が正解の別シナリオ）。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Dapr のステート管理は、アプリケーションコードを変更せずにバックエンドストア（Redis、Cosmos DB、Azure Table Storage 等）を切り替えられます。開発環境では Redis、本番では Cosmos DB など、環境別の構成が簡単に実現できます。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/aks/dapr-overview\" target=\"_blank\">AKS の Dapr 拡張機能の概要</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 240\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon poi  16.93) rotate(134.92)\" fill=\"#50e6ff\" /><path d=\"M2.56,2.91H3.5a.3.3,0,0,1,.3.3v7.43a0,0,0,0,1,0,0H2.86a.6.6,0,0,1-.6-.6V3.21a.3.3,0,0,1,.3-.3Z\" transform=\"translate(5.66 -0.16) rotate(44.92)\" fill=\"#1490df\" /><path d=\"M14.15,7.28h.94a.6.6,0,0,1,.6.6v6.94a.3.3,0,0,1-.3.3h-.94a.3.3,0,0,1-.3-.3V7.28a0,0,0,0,1,0,0Z\" transform=\"translate(12.32 -7.28) rotate(45.08)\" fill=\"#50e6ff\" /><path d=\"M14.81,2.91h.94a0,0,0,0,1,0,0v7.43a.3.3,0,0,1-.3.3H14.5a.3.3,0,0,1-.3-.3V3.51a.6.6,0,0,1,.6-.6Z\" transform=\"translate(30.36 0.99) rotate(135.08)\" fill=\"#1490df\" /></svg>\n</g>\n<text x=\"440\" y=\"208\" text-anchor=\"middle\" fill=\"#f0f4ff\" font-size=\"11\" font-family=\"Outfit,sans-serif\" font-weight=\"600\">トラフィック制御</text>\n<text x=\"440\" y=\"221\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Canary/Blue-Green</text>\n<rect x=\"0\" y=\"218\" width=\"600\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"300\" y=\"233\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Istio = トラフィックルーティング・分割 ／ Dapr = アプリランタイム ／ Flux = GitOps</text>\n</svg>"},{"num":34,"id":"q34","domain":"インフラストラクチャ設計","question_text":"Azure Kubernetes Service（AKS）にいくつかのコンテナー化されたマイクロサービスベースのアプリケーションを展開する準備をしています。\n\nソリューション設計の一部として、以下の機能を実装するソリューションを推奨する必要があります。\n\n・トラフィックルーティングと分割\n\n選択するソリューションは、AKS に追加インフラストラクチャを作成することなく実装できる必要があります。\n\n何を使用しますか？","choices":[{"text":"Dapr","is_correct":false},{"text":"Flux","is_correct":false},{"text":"Istio","is_correct":true}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\"><strong>Istio</strong>が正解です。サービスメッシュとして Istio は相互TLS（mTLS）によるサービス間の暗号化通信、きめ細かなトラフィック管理（カナリアリリース、A/B テスト、フォールト注入）、分散トレーシング、セキュリティポリシー（認証・認可ポリシー）を提供します。ゼロトラストネットワーク、トラフィックルーティングの高度な制御が必要な場合に Istio が最適です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Dapr</strong>: アプリケーションビルディングブロック（ステート、パブサブ）が主な機能です。mTLS やトラフィック管理は Istio の専門領域です。<br><strong>Flux</strong>: GitOps ツールであり、サービスメッシュ機能はありません。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「mTLS」「ゼロトラスト」「カナリアデプロイ」「トラフィックシフト」→ Istio、「ステート管理」「パブサブ」「サービス呼び出しの簡素化」→ Dapr という使い分けを覚えましょう。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Istio の主要機能：①mTLS（自動証明書ローテーション）、②VirtualService（トラフィックルーティング）、③DestinationRule（ロードバランシング、サーキットブレーカー）、④AuthorizationPolicy（アクセス制御）、⑤Envoy サイドカープロキシ。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/aks/istio-about\" target=\"_blank\">AKS の Istio サービス メッシュ アドオン</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 240\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill= ll=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Canary/Blue-Green</text>\n<rect x=\"0\" y=\"218\" width=\"600\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"300\" y=\"233\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">Istio = トラフィックルーティング・分割 ／ Dapr = アプリランタイム ／ Flux = GitOps</text>\n</svg>"},{"num":35,"id":"q35","domain":"ID・ガバナンス・監視","question_text":"Azure 環境が管理グループ、サブスクリプション、仮想マシン、リソースグループ、Azure Policy 割り当てを使用して以下のように構成されています。\n\n【管理グループ階層】\n・Tenant Root Group（階層のルート）\n  - MG1（Tenant Root Group の子）\n    - Sub2（MG1 の子サブスクリプション）\n    - Sub4（MG1 の子サブスクリプション）\n  - MG2（Tenant Root Group の子）\n    - Sub3（MG2 の子サブスクリプション）\n・Sub1（Tenant Root Group に直接属するサブスクリプション）\n\n【仮想マシン】\n・VM1: Sub1 に展開\n・VM2: Sub2 に展開\n・VM3: Sub3 に展開\n\n【Azure Policy 割り当て】\n・PA1: MG1 に割り当て\n・PA2: Sub1 に割り当て（Tenant Root Group ポリシーの明示的な除外あり）\n・PA3: Tenant Root Group に割り当て\n\n「PA1 は Sub2 のリソースのみを評価する」という記述は正しいですか？","choices":[{"text":"\"PA1 は Sub2 のリソースのみを評価する\"","is_correct":false},{"text":"True（正しい）","is_correct":false},{"text":"False（誤り）","is_correct":true}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">正解は<strong>False（誤り）</strong>です。「PA1 は Sub2 のリソースのみを評価する」という主張が誤りです。PA1 が管理グループスコープで割り当てられている場合、その管理グループ配下のすべてのサブスクリプション（Sub1、Sub2 など）のリソースを評価します。Sub2 のみに限定されることはありません。Azure Policy は親スコープから子スコープに継承されます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>True</strong>: PA1 が管理グループレベルに割り当てられているにもかかわらず、Sub2 のみを評価するという誤った主張です。ポリシーは割り当てスコープ以下のすべてのリソースに適用されます。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Azure Policy の継承ルール：管理グループ → サブスクリプション → リソースグループ → リソース の順に継承されます。除外（Exclude）スコープを設定しない限り、すべての子スコープに適用されます。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">Azure Policy の効果（Effect）：Deny（リソース作成を拒否）、Audit（コンプライアンス違反を記録）、Append（プロパティを追加）、Modify（タグ等を変更）、DeployIfNotExists（関連リソースを自動デプロイ）、AuditIfNotExists（関連リソースが存在しない場合に記録）。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/governance/policy/overview\" target=\"_blank\">Azure Policy の概要</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 265\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\n      <marker id=\"ah-r\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#f87171\"/>\n      </marker>\n      <marker id=\"as\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto-start-reverse\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <filter id=\"shadow\">\n        <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"rgba(0,0,0,0.4)\"/>\n      </filter>\n    </defs>\n<rect width=\"620\" height=\"265\" fill=\"#0a0f1e\" rx=\"12\"/>\n<path d=\"M 275.7,73.9 H 184.3 V 126.1\" fill=\"none\" stroke=\"#7c3aed\" stroke-width=\"2\" marker-end=\"url(#ah)\" opacity=\"0.9\"/>\n<path d=\"M 324.3,73.9 H 415.7 V 126.1\" fill=\"none\" stroke=\" ><path d=\"M17.5,2.78a.16.16,0,0,0-.08-.14L16.27,2l-2-1.14a.18.18,0,0,0-.23.06L13.43,2a.15.15,0,0,0,.06.22l2.29,1.33a.16.16,0,0,1,.08.14V14.27a.16.16,0,0,1-.08.14l-2.29,1.33a.15.15,0,0,0-.06.22l.65,1.15a.18.18,0,0,0,.23.06l1.92-1.11,1.19-.7a.16.16,0,0,0,.08-.14V2.78Z\" fill=\"#949494\" /><path d=\"M13.43,16l.65,1.15a.18.18,0,0,0,.17.08l.08,0,1.92-1.11,1.19-.7a.1.1,0,0,0,.06,0h0a.24.24,0,0,0,0-.08l-1.64-1a.16.16,0,0,1-.08.14l-2.29,1.33A.15.15,0,0,0,13.43,16Z\" fill=\"#a3a3a3\" /><path d=\"M13.43,2,14.08.89a.18.18,0,0,1,.17-.08.12.12,0,0,1,.08,0l1.92,1.11,1.19.7a.1.1,0,0,1,.06,0h0a.24.24,0,0,1,0,.08l-1.64,1a.16.16,0,0,0-.08-.14L13.49,2.26A.16.16,0,0,1,13.43,2Z\" fill=\"#a3a3a3\" /></g></svg>\n</g>\n<text x=\"530\" y=\"178\" text-anchor=\"middle\" fill=\"#f0f4ff\" font-size=\"11\" font-family=\"Outfit,sans-serif\" font-weight=\"600\">Sub1 (direct)</text>\n<text x=\"530\" y=\"191\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">PA2・PA3除外</text>\n<rect x=\"0\" y=\"243\" width=\"620\" height=\"22\" rx=\"0\" fill=\"rgba(0,0,0,0.3)\"/>\n<text x=\"310\" y=\"258\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"9\" font-family=\"Noto Sans JP,sans-serif\">PA1 → MG1 = Sub2 AND Sub4 両方に適用（子孫すべてに継承）</text>\n</svg>"},{"num":36,"id":"q36","domain":"ID・ガバナンス・監視","question_text":"Azure 環境が管理グループ、サブスクリプション、仮想マシン、リソースグループ、Azure Policy 割り当てを使用して以下のように構成されています。\n\n【管理グループ階層】\n・Tenant Root Group（階層のルート）\n  - MG1（Tenant Root Group の子）\n    - Sub2（MG1 の子サブスクリプション）\n    - Sub4（MG1 の子サブスクリプション）\n  - MG2（Tenant Root Group の子）\n    - Sub3（MG2 の子サブスクリプション）\n・Sub1（Tenant Root Group に直接属するサブスクリプション）\n\n【仮想マシン】\n・VM1: Sub1 に展開\n・VM2: Sub2 に展開\n・VM3: Sub3 に展開\n\n【Azure Policy 割り当て】\n・PA1: MG1 に割り当て\n・PA2: Sub1 に割り当て（Tenant Root Group ポリシーの明示的な除外あり）\n・PA3: Tenant Root Group に割り当て\n\n「PA2 はすべてのサブスクリプションに展開されたすべての仮想マシンを評価する」という記述は正しいですか？","choices":[{"text":"\"PA2 はすべてのサブスクリプションに展開されたすべての仮想マシンを評価する\"","is_correct":false},{"text":"True（正しい）","is_correct":false},{"text":"False（誤り）","is_correct":true}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">正解は<strong>False（誤り）</strong>です。「PA2 はすべてのサブスクリプションに適用される」という主張が誤りです。PA2 が特定のサブスクリプションまたはリソースグループスコープで割り当てられている場合、そのスコープ配下にのみ適用され、他のサブスクリプションには影響しません。「すべてのサブスクリプション」に適用するには、ルート管理グループかテナントルートへの割り当てが必要です。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>True</strong>: PA2 のスコープが限定されているにもかかわらず、すべてのサブスクリプションに適用されるという誤った主張です。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「すべてのサブスクリプション」にポリシーを適用するには、テナントのルート管理グループに割り当てる必要があります。個別のサブスクリプションや管理グループに割り当てた場合は、その配下のみに適用されます。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">ポリシーの除外スコープ：`notScopes` パラメーターを使用して、割り当てスコープ内の特定のリソースやリソースグループをポリシー評価から除外できます。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azure/governance/policy/concepts/scope\" target=\"_blank\">Azure Policy のスコープについて</a></div></div>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 265\" style=\"max-width:100%;height:auto;display:block;margin:0 auto;\">\n<defs>\n      <marker id=\"ah\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#50e6ff\"/>\n      </marker>\n      <marker id=\"ah-g\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#4ade80\"/>\n      </marker>\n      <marker id=\"ah-y\" markerWidth=\"10\" markerHeight=\"7\" refX=\"9\" refY=\"3.5\" orient=\"auto\">\n        <polygon points=\"0 0, 10 3.5, 0 7\" fill=\"#fbbf24\"/>\n      </marker>\ to Sans JP,sans-serif\">PA1 → MG1 = Sub2 AND Sub4 両方に適用（子孫すべてに継承）</text>\n</svg>"},{"num":37,"id":"q37","domain":"ID・ガバナンス・監視","question_text":"Azure 環境が管理グループ、サブスクリプション、仮想マシン、リソースグループ、Azure Policy 割り当てを使用して以下のように構成されています。\n\n【管理グループ階層】\n・Tenant Root Group（階層のルート）\n  - MG1（Tenant Root Group の子）\n    - Sub2（MG1 の子サブスクリプション）\n    - Sub4（MG1 の子サブスクリプション）\n  - MG2（Tenant Root Group の子）\n    - Sub3（MG2 の子サブスクリプション）\n・Sub1（Tenant Root Group に直接属するサブスクリプション）\n\n【仮想マシン】\n・VM1: Sub1 に展開\n・VM2: Sub2 に展開\n・VM3: Sub3 に展開\n\n【Azure Policy 割り当て】\n・PA1: MG1 に割り当て\n・PA2: Sub1 に割り当て（Tenant Root Group ポリシーの明示的な除外あり）\n・PA3: Tenant Root Group に割り当て\n\n「PA3 は VM3 を評価する」という記述は正しいですか？","choices":[{"text":"\"PA3 は VM3 を評価する\"","is_correct":false},{"text":"True（正しい）","is_correct":true},{"text":"False（誤り）","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">正解は<strong>True（正しい）</strong>です。「PA3 は VM3 を評価する」という主張は正しいです。PA3 がリソースグループまたはサブスクリプションスコープで割り当てられており、VM3 がそのスコープ内にある場合、PA3 は VM3 を評価します。ポリシーは割り当てスコープ以下のすべてのリソースを評価するため、VM3 が適切なスコープ内にあれば評価対象になります。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>False</strong>: VM3 が PA3 の割り当てスコープ内にある場合、評価されないという主張は誤りです。除外スコープ（notScopes）に VM3 のリソースグループが含まれていない限り、評価されます。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Q35〜Q37 は同一のポリシー環境について異なるスコープのシナリオを問うています。ポリシーの継承（下方向への適用）と除外スコープの概念を正確に理解することが重要です。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">周辺の関連知識</div><div class=\"exp-block-body\">ポリシーコンプライアンス評価のトリガー：①新規/更新されたリソース（即時）、②ポリシー割り当て/更新時（24時間以内）、③定期評価（24時間ごと）、④手動トリガー（Azure CLI/PowerShell）。</div></div><div class=\"exp-block\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\"><a href=\"https://learn.microsoft.com/ja-jp/azur
