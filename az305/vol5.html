<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AZ-305 練習問題集 Vol.5</title>
<style>
/* ================================================================
   az305.css — AZ-305 共通スタイル
   StudyDeck デザインシステム準拠 (vol2 / vol3 / vol4 / vol5 共通)
   Palette: Slate Monochrome + Azure blue
   Font:    DM Sans (数値・ラベル) + Noto Sans JP (本文)
   ================================================================ */

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700;9..40,800&family=Noto+Sans+JP:wght@400;500;700&display=swap');

/* ── CSS Variables ── */
:root {
  /* Slate palette (StudyDeck共通) */
  --bg:       #edf0f7;
  --card:     #ffffff;
  --text:     #151c2c;
  --sub:      #3d4966;
  --muted:    #7c879c;
  --border:   #cdd3e2;

  /* Azure blue — AZ-305 アクセント */
  --blue:     #0078d4;
  --blue-lt:  #e8f3fb;
  --blue-dk:  #005a9e;

  /* Domain colors — muted */
  --purple:   #6b4fa0;
  --green:    #2d7a4f;
  --red:      #b03535;
  --orange:   #c25b00;

  /* Semantic ok / ng */
  --ok:       #2d7a4f;
  --ok-bg:    #f0f7f2;
  --ok-bd:    #a8d4b8;
  --ng:       #b03535;
  --ng-bg:    #fdf2f2;
  --ng-bd:    #e0a8a8;

  /* Geometry (両エイリアスに対応) */
  --radius:   8px;
  --r:        8px;
  --shadow:   0 1px 4px rgba(0,0,0,.05), 0 4px 20px rgba(0,0,0,.07);
  --sh:       0 1px 4px rgba(0,0,0,.05), 0 4px 20px rgba(0,0,0,.07);
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Body ── */
body {
  font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  background-image: radial-gradient(circle, #bcc3d6 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--text);
  min-height: 100vh;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

/* ── StudyDeck global nav bar ── */
.studydeck-nav {
  position: relative;
  z-index: 9999;
  background: #0f1829;
  border-bottom: 1px solid rgba(255,255,255,.07);
  height: 42px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  font-family: 'DM Sans', system-ui, sans-serif;
  flex-shrink: 0;
}
.studydeck-nav a {
  display: flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  color: rgba(255,255,255,.45);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 6px 8px;
  border-radius: 4px;
  transition: color 0.15s;
}
.studydeck-nav a:hover { color: rgba(255,255,255,.85); }
.studydeck-nav .nav-sep { color: rgba(255,255,255,.12); font-size: 14px; }
.studydeck-nav .nav-current { color: rgba(255,255,255,.35); font-size: 11px; font-weight: 600; letter-spacing: 1px; }

/* ================================================================
   HEADER — SCサイトと同じダークネイビー
   ================================================================ */
.hdr {
  background: #151c2c;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 36px 36px;
  color: #fff;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.hdr-icon { display: flex; align-items: center; flex-shrink: 0; opacity: .85; color: rgba(255,255,255,.7); }
.hdr-title {
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -.3px;
  line-height: 1.2;
  color: #fff;
}
.hdr-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: .6rem;
  opacity: .4;
  margin-top: 2px;
  letter-spacing: .3px;
}
.hdr-stat {
  margin-left: auto;
  text-align: right;
  font-family: 'DM Sans', sans-serif;
  font-size: .7rem;
  opacity: .5;
  flex-shrink: 0;
}
.hdr-stat strong {
  font-size: 1.25rem;
  font-weight: 800;
  display: block;
  opacity: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.5px;
}

/* ================================================================
   CONTROL BAR — SCのチャプタータブと同スタイル
   ================================================================ */
.cbar {
  background: #151c2c;
  border-bottom: 1px solid rgba(255,255,255,.06);
  padding: 0 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0;
  position: sticky;
  top: 0;
  z-index: 100;
  overflow-x: auto;
  scrollbar-width: none;
}
.cbar::-webkit-scrollbar { display: none; }
.cbar-label {
  font-family: 'DM Sans', sans-serif;
  font-size: .55rem;
  font-weight: 700;
  color: rgba(255,255,255,.28);
  text-transform: uppercase;
  letter-spacing: 2.5px;
  white-space: nowrap;
  padding: 12px 12px 12px 0;
  flex-shrink: 0;
}

/* Domain filter buttons — タブスタイル */
.dbtn {
  flex-shrink: 0;
  padding: 10px 11px;
  border: none;
  border-bottom: 2px solid transparent;
  background: none;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: .68rem;
  font-weight: 600;
  cursor: pointer;
  color: rgba(255,255,255,.32);
  white-space: nowrap;
  transition: color .15s, border-color .15s;
  margin-bottom: -1px;
}
.dbtn:hover:not(.on) { color: rgba(255,255,255,.65); }
.dbtn.on { color: #fff; }

/* Domain color accents on active tab */
.dbtn[data-d="all"].on,
.dbtn[data-d="データストレージ設計"].on,
.dbtn[data-d="DS"].on             { border-bottom-color: var(--blue); }
.dbtn[data-d="ID・ガバナンス・監視"].on,
.dbtn[data-d="ID"].on             { border-bottom-color: #a07fe0; }
.dbtn[data-d="ビジネス継続性設計"].on,
.dbtn[data-d="BC"].on             { border-bottom-color: #5aad8a; }
.dbtn[data-d="インフラストラクチャ設計"].on,
.dbtn[data-d="IS"].on             { border-bottom-color: #d07070; }

.cbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  padding: 8px 0;
}

/* ── Shuffle Label ── */
.shuf-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--tx2);
  cursor: pointer;
  white-space: nowrap;
}
.shuf-label input { cursor: pointer; accent-color: var(--az-blue); }

/* ── Progress Bar (両エイリアス) ── */
.pbar-wrap, .pb-wrap {
  width: 90px;
  background: rgba(255,255,255,.1);
  border-radius: 4px;
  height: 3px;
}
.pbar, .pb {
  background: var(--blue);
  height: 100%;
  border-radius: 4px;
  transition: width .4s cubic-bezier(.25,1,.5,1);
}

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
  font-size: .78rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.btn-out {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15);
  color: rgba(255,255,255,.7);
}
.btn-out:hover { background: rgba(255,255,255,.14); color: #fff; }
.btn-prim { background: var(--blue); color: #fff; }
.btn-prim:hover { background: var(--blue-dk); }

/* ================================================================
   QUESTION AREA
   ================================================================ */
.qwrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }

.qcard {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: border-left-color .2s;
}
.qcard.ok       { border-left: 4px solid var(--ok); }
.qcard.ng       { border-left: 4px solid var(--ng); }
.qcard.multi-ok { border-left: 4px solid var(--orange); }

/* Question header */
.qh {
  padding: 14px 20px 0;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.qnum {
  font-family: 'DM Sans', monospace;
  font-weight: 800;
  font-size: 1.05rem;
  color: var(--blue);
  letter-spacing: -.5px;
  font-variant-numeric: tabular-nums;
}
.dbadge {
  padding: 2px 9px;
  border-radius: 3px;
  font-family: 'DM Sans', sans-serif;
  font-size: .6rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: .3px;
}
.mbadge {
  padding: 2px 9px;
  border-radius: 3px;
  font-family: 'DM Sans', sans-serif;
  font-size: .6rem;
  font-weight: 700;
  background: var(--orange);
  color: #fff;
}

/* Question body */
.qbody { padding: 10px 20px 12px; }
.qtext {
  font-size: .92rem;
  line-height: 1.85;
  white-space: pre-wrap;
  color: var(--text);
}

/* ================================================================
   ANSWER CHOICES
   ================================================================ */
.choices {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 0 20px 18px;
}
.cbtn {
  padding: 10px 14px;
  border-radius: 6px;
  border: 1.5px solid var(--border);
  background: #fff;
  text-align: left;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: .88rem;
  line-height: 1.55;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.cbtn:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-lt); }
.cbtn:disabled { cursor: default; }
.cbtn.correct        { border-color: var(--ok-bd) !important; background: var(--ok-bg) !important; font-weight: 600; }
.cbtn.wrong          { border-color: var(--ng-bd) !important; background: var(--ng-bg) !important; }
.cbtn.reveal         { border-color: var(--ok-bd); background: var(--ok-bg); }
.cbtn.multi-selected,
.cbtn.multi-sel      { border-color: #e8a000 !important; background: #fff8e8 !important; }

.cltr {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--border);
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Sans', monospace;
  font-size: .7rem;
  font-weight: 700;
  color: var(--muted);
  flex-shrink: 0;
  margin-top: 1px;
  transition: background .15s, color .15s;
}
.cbtn.correct .cltr,
.cbtn.reveal .cltr          { background: var(--ok); color: #fff; }
.cbtn.wrong .cltr           { background: var(--ng); color: #fff; }
.cbtn.multi-selected .cltr,
.cbtn.multi-sel .cltr       { background: var(--orange); color: #fff; }

/* Multi-select */
.multi-hint {
  font-size: .72rem;
  color: var(--orange);
  font-weight: 700;
  padding: 0 20px 8px;
}
.submit-btn, .sub-btn {
  display: none;
  margin: 0 20px 14px;
  padding: 10px 22px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: .85rem;
  font-weight: 700;
  cursor: pointer;
  transition: background .15s;
}
.submit-btn:hover, .sub-btn:hover { background: var(--blue-dk); }

/* ================================================================
   EXPLANATION PANEL
   ================================================================ */
.expanel {
  display: none;
  border-top: 1px solid var(--border);
  background: #f8f9fc;
  animation: slideDown .25s cubic-bezier(.25,1,.5,1);
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Result badge */
.rbadge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 20px;
  font-family: 'DM Sans', sans-serif;
  font-size: .75rem;
  font-weight: 700;
  margin: 14px 20px 0;
}
.rbadge.ok       { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-bd); }
.rbadge.ng       { background: var(--ng-bg); color: var(--ng); border: 1px solid var(--ng-bd); }
.rbadge.multi-ok { background: #fff4e0; color: var(--orange); border: 1px solid #f0c060; }

/* ── Explanation blocks (vol2/vol3/vol4 style) ── */
.exp-sections { padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 10px; }
.exp-block { border-radius: 6px; overflow: hidden; border: 1.5px solid var(--border); }
.exp-block-label {
  padding: 7px 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: .6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
.exp-block-body {
  padding: 11px 14px;
  font-size: .85rem;
  line-height: 1.85;
  white-space: pre-wrap;
}
.exp-block-body code {
  background: #f1f5f9;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'DM Mono', monospace;
  font-size: .82rem;
  color: #1e293b;
}
.exp-correct { border-color: var(--ok-bd); }
.exp-correct .exp-block-label { background: var(--ok-bg); color: var(--ok); }
.exp-correct .exp-block-body  { background: #f5faf7; }
.exp-wrong   { border-color: var(--ng-bd); }
.exp-wrong .exp-block-label   { background: var(--ng-bg); color: var(--ng); }
.exp-wrong .exp-block-body    { background: #fdf8f8; }
.exp-trap    { border-color: #f0c060; }
.exp-trap .exp-block-label    { background: #fff8e8; color: var(--orange); }
.exp-trap .exp-block-body     { background: #fffdf5; }
.exp-key     { border-color: #c8b8e8; }
.exp-key .exp-block-label     { background: #f5f0ff; color: var(--purple); }
.exp-key .exp-block-body      { background: #faf8ff; font-weight: 500; }

/* ── Explanation sections (vol5 style) ── */
.exp-section { margin-bottom: 12px; padding: 0 20px; }
.expanel > .exp-section:first-child { padding-top: 14px; }
.expanel > .exp-section:last-child  { padding-bottom: 18px; }
.exp-title {
  font-family: 'DM Sans', sans-serif;
  font-size: .6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin-bottom: 6px;
}
.exp-body { font-size: .85rem; line-height: 1.85; color: var(--sub); }
.exp-body p { margin-bottom: 6px; }
.exp-body strong { color: var(--text); }

/* ── vol4 explanation blocks (eb-*) ── */
.eb { border-radius: 6px; overflow: hidden; border: 1.5px solid var(--border); margin-bottom: 10px; }
.eb-lbl {
  padding: 7px 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: .6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
.eb-body { padding: 11px 14px; font-size: .85rem; line-height: 1.85; }
.eb-ok { border-color: var(--ok-bd); }
.eb-ok .eb-lbl { background: var(--ok-bg); color: var(--ok); }
.eb-ng { border-color: var(--ng-bd); }
.eb-ng .eb-lbl { background: var(--ng-bg); color: var(--ng); }
.eb-dp { border-color: #c8b8e8; }
.eb-dp .eb-lbl { background: #f5f0ff; color: var(--purple); }
.eb-fl { border-color: #b0ccee; }
.eb-fl .eb-lbl { background: var(--blue-lt); color: var(--blue); }

/* ================================================================
   CALLOUT BOXES
   ================================================================ */
.key-box {
  background: var(--blue-lt);
  border-left: 3px solid var(--blue);
  border-radius: 0 6px 6px 0;
  padding: 10px 14px;
  margin-bottom: 10px;
  font-size: .85rem;
  line-height: 1.7;
}
.key-box .k-title {
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  color: var(--blue);
  font-size: .6rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.warn-box, .wbox {
  background: #fff8e8;
  border-left: 3px solid var(--orange);
  border-radius: 0 6px 6px 0;
  padding: 10px 14px;
  margin-bottom: 10px;
  font-size: .85rem;
  line-height: 1.7;
}
.warn-box .w-title {
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  color: var(--orange);
  font-size: .6rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

/* ================================================================
   ARCHITECTURE DIAGRAMS
   ================================================================ */
.arch-box, .arch-svg-wrap {
  background: var(--blue-lt);
  border: 1px solid #c5d8f0;
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  overflow-x: auto;
}
.arch-title {
  font-family: 'DM Sans', sans-serif;
  font-size: .6rem;
  font-weight: 700;
  color: var(--blue);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
}
.arch-box svg, .arch-svg-wrap svg { width: 100%; height: auto; display: block; overflow: hidden; }
.arch-box svg text, .arch-svg-wrap svg text,
.arch-box svg tspan, .arch-svg-wrap svg tspan {
  font-family: 'DM Sans', 'Noto Sans JP', Arial, sans-serif !important;
}

/* ================================================================
   COMPARISON TABLES
   ================================================================ */
/* vol2/vol3/vol4 style */
.comp-s { border-radius: 6px; overflow: hidden; border: 1.5px solid #c8b8e8; }
.comp-l {
  padding: 7px 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: .6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  background: #f3ecff;
  color: var(--purple);
}
.ctw { overflow-x: auto; }
.ct { width: 100%; border-collapse: collapse; font-size: .82rem; }
.ct th {
  background: #f5f0ff;
  padding: 8px 12px;
  text-align: left;
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: .7rem;
  color: var(--purple);
  border-bottom: 2px solid #c8b8e8;
  white-space: nowrap;
}
.ct td {
  padding: 7px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  line-height: 1.5;
}
.ct tr:last-child td { border-bottom: none; }
.ct tr:hover td { background: #faf8ff; }
.ct .cc { background: var(--ok-bg) !important; font-weight: 600; }
.ct th.cc { background: #c8edca !important; color: var(--ok) !important; }

/* vol5 style */
.tbl-wrap { overflow-x: auto; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 12px; }
table.ctbl, .etbl { width: 100%; border-collapse: collapse; font-size: .82rem; }
.ctbl th, .etbl th {
  background: #f3f5f9;
  padding: 8px 12px;
  text-align: left;
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: .68rem;
  color: var(--muted);
  border-bottom: 2px solid var(--border);
}
.ctbl td, .etbl td {
  padding: 7px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  line-height: 1.5;
}
.ctbl tr:last-child td, .etbl tr:last-child td { border-bottom: none; }
.ctbl tr:hover td, .etbl tr:hover td { background: #f8f9fc; }
.ctbl .hl, .ctbl td.hl { background: var(--ok-bg) !important; font-weight: 600; }
.ctbl th.hl            { background: #c8edca !important; color: var(--ok) !important; }
.cc { background: var(--ok-bg) !important; font-weight: 600; }

/* Inline badges */
.badge-ok {
  display: inline-block; padding: 1px 7px;
  background: var(--ok-bg); color: var(--ok);
  border-radius: 20px; font-size: .7rem; font-weight: 700;
}
.badge-ng {
  display: inline-block; padding: 1px 7px;
  background: var(--ng-bg); color: var(--ng);
  border-radius: 20px; font-size: .7rem; font-weight: 700;
}

/* ================================================================
   REFERENCE LINKS
   ================================================================ */
/* vol2/vol3/vol4 style */
.refs-s { border-radius: 6px; overflow: hidden; border: 1.5px solid #f0c840; }
.refs-l {
  padding: 7px 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: .6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  background: #fffbe8;
  color: var(--orange);
}
.refs-ul { list-style: none; padding: 8px 12px; display: flex; flex-direction: column; gap: 5px; background: #fffdf5; }
.refs-ul li a { font-size: .75rem; color: #0066bb; word-break: break-all; text-decoration: none; }
.refs-ul li a:hover { text-decoration: underline; }

/* vol5 style */
.refs { background: #fffbe8; border: 1px solid #f0c840; border-radius: 6px; padding: 10px 14px; margin-top: 6px; }
.refs-title {
  font-family: 'DM Sans', sans-serif;
  font-size: .6rem; font-weight: 700; color: var(--orange);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
}
.refs ul { list-style: none; display: flex; flex-direction: column; gap: 4px; }

/* ================================================================

   ================================================================ */
.modal {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 200;
  align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal.show { display: flex; }
.mcard {
  background: #fff;
  border-radius: 12px;
  padding: 32px;
  max-width: 500px; width: 92%;
  box-shadow: 0 24px 80px rgba(0,0,0,.3);
  animation: popIn .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn {
  from { transform: scale(.85); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
.m-icon { display: flex; align-items: center; justify-content: center; color: var(--blue); margin-bottom: 8px; }
.m-score {
  font-family: 'DM Sans', monospace;
  font-size: 3rem; font-weight: 900;
  text-align: center; margin: 6px 0;
  letter-spacing: -2px;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.m-pct  { text-align: center; font-size: .8rem; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.m-msg  { text-align: center; font-size: .88rem; color: var(--muted); margin-bottom: 20px; }
.m-domains { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.m-ditem { background: var(--bg); border-radius: 6px; padding: 10px 14px; }
.m-dname { font-size: .65rem; color: var(--muted); font-weight: 700; }
.m-dval  {
  font-family: 'DM Sans', monospace;
  font-size: 1.3rem; font-weight: 900;
  margin-top: 3px;
  font-variant-numeric: tabular-nums;
}
.m-btns { display: flex; flex-direction: column; gap: 7px; }
.m-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px; border-radius: 6px; border: none;
  font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
  font-size: .85rem; font-weight: 700; cursor: pointer; transition: all .15s;
}
.m-btn-p { background: var(--blue); color: #fff; }
.m-btn-p:hover { background: var(--blue-dk); }
.m-btn-o { background: #fff; border: 1.5px solid var(--border); color: var(--text); }
.m-btn-o:hover { border-color: var(--text); }

/* vol4 final screen */
.fs   { text-align: center; padding: 40px 20px; }
.fwrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }

/* ================================================================
   SCROLL-TO-TOP
   ================================================================ */
.scroll-top {
  position: fixed; bottom: 22px; right: 22px;
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--blue); color: #fff;
  border: none; font-size: 16px; cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,.2);
  display: none; z-index: 50;
  align-items: center; justify-content: center;
  transition: background .15s;
}
.scroll-top:hover { background: var(--blue-dk); }
.scroll-top.show  { display: flex; }

/* ================================================================
   RESPONSIVE
   ================================================================ */
@media (max-width: 600px) {
  .hdr   { padding: 12px 16px; flex-wrap: wrap; }
  .cbar  { padding: 0 12px; }
  .qwrap { padding: 12px 10px 70px; }
  .qh    { padding: 12px 14px 0; }
  .qbody { padding: 8px 14px 10px; }
  .choices { padding: 0 14px 14px; }
  .exp-sections { padding: 12px 12px 16px; }
  .m-domains { grid-template-columns: 1fr; }
  .mcard { padding: 24px 18px; }
}

@media (prefers-reduced-motion: reduce) {
  .expanel, .mcard { animation: none; }
  .pbar, .pb { transition: none; }
}

<div class="key-box">
<div class="k-title">正解：2</div>
Azure VNet は<strong>リージョンスコープのリソース</strong>です。1 つの VNet は 1 つのリージョン内にしか存在できません。<br><br>
「2 リージョン × 各 2 AZ = 計 4 AZ」という構成では、リージョンごとに VNet が 1 つ必要となるため、最低 <strong>2 つの VNet</strong> が必要です。<br><br>
可用性ゾーン (AZ) は同一リージョン内の物理的な分離であり、同じ VNet 内のサブネットで対応できるため、VNet 数は増えません。
</div>
<div class="warn-box">
<div class="w-title">よくある誤解</div>
「4 つの AZ → 4 つの VNet が必要」と思いがちですが誤りです。AZ はネットワーク分離ではなくデータセンターの物理分離です。リージョンをまたぐ通信には VNet ピアリングまたは VPN Gateway を使用します。
</div>

</tbody></table></div>

<div class="k-title">正解：B シリーズ（バースト可能 VM）</div>

<div class="key-box">
<div class="k-title">正解：Azure SQL Database (Business Critical 層)</div>
Business Critical 層は Always On 可用性グループをベースにしており、<strong>最大 4 つの読み取り可能なセカンダリレプリカ</strong>をサポートします。RTO は 30 秒未満で、15 分の要件を大きく下回ります。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">サービス</th><th>複数セカンダリ</th><th>自動レプリケーション</th><th>RTO</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>SQL DB (Business Critical)</strong></td><td>最大 4 つ</td><td>Always On AG</td><td>~30 秒</td></tr>
<tr><td>SQL Managed Instance (BC)</td><td>最大 1 つ</td><td>○</td><td>~30 秒</td></tr>
<tr><td>SQL DB (Hyperscale)</td><td>最大 30</td><td>○</td><td>~3 分</td></tr>
</tbody></table></div>
<div class="warn-box">
<div class="w-title">SQL MI との違い</div>
「複数のセカンダリレプリカ」がキー要件です。SQL Managed Instance の Business Critical 層はセカンダリレプリカが 1 つのみのため不正解です。Hyperscale は多数のセカンダリをサポートしますが、一般的な移行シナリオでは SQL DB が適切です。
</div>
</div>
<div class="refs"><div class="refs-title">参考ドキュメント</div><ul>
<li><a href="https://learn.microsoft.com/azure/azure-sql/database/service-tier-business-critical" target="_blank">Business Critical サービス層</a></li>
</ul></div>`},

// ── Q4 ─────────────────────────────────────────────────────
{num:4,id:"q4",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Q3 と同じシナリオです。SQL1 の Azure 移行で「複数の読み取り専用セカンダリレプリカ」「自動レプリケーション」「RTO 15 分以内」を満たす必要があります。

推奨すべきレプリケーションメカニズムはどれですか？`,
choices:[{t:"アクティブ geo レプリケーション",c:true},{t:"自動フェールオーバーグループ",c:false},{t:"標準 geo レプリケーション（読み取り不可）",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>

<div class="key-box">
<div class="k-title">正解：アクティブ geo レプリケーション</div>
アクティブ geo レプリケーションは Azure SQL Database 専用の機能で、<strong>最大 4 つの読み取り可能なセカンダリレプリカ</strong>を異なるリージョンに作成できます。RTO は 30 秒未満（手動フェールオーバー）です。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">レプリケーション</th><th>複数セカンダリ</th><th>読み取り可能</th><th>RTO</th><th>対象サービス</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>アクティブ geo レプリケーション</strong></td><td>最大4</td><td>○</td><td>&lt;30秒</td><td>SQL Database のみ</td></tr>
<tr><td>自動フェールオーバーグループ</td><td>グループ単位</td><td>○</td><td>&lt;60秒</td><td>SQL DB / SQL MI</td></tr>
<tr><td>標準 geo レプリケーション</td><td>1つのみ</td><td>オフライン</td><td>可変</td><td>旧機能</td></tr>
</tbody></table></div>
<div class="warn-box">
<div class="w-title">自動フェールオーバーグループとの違い</div>
自動フェールオーバーグループは<strong>複数の独立したセカンダリレプリカを持てない</strong>（グループ内でのフェールオーバーは1つの方向）ため、「複数の読み取り専用レプリカ」要件を満たしません。
</div>
</div>
<div class="refs"><div class="refs-title">参考ドキュメント</div><ul>
<li><a href="https://learn.microsoft.com/azure/azure-sql/database/active-geo-replication-overview" target="_blank">アクティブ geo レプリケーションの概要</a></li>
</ul></div>`},

{num:6,id:"q6",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Q5 と同じシナリオです。Azure Data Explorer でペタバイト規模のデータをクエリする際に使用すべきクエリ言語はどれですか？`,
choices:[{t:"KQL（Kusto Query Language）",c:true},{t:"Transact-SQL（T-SQL）",c:false},{t:"U-SQL",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：KQL（Kusto Query Language）</div>
KQL は Azure Data Explorer のネイティブクエリ言語です。パイプライン（<code>|</code>）ベースの読みやすい構文で、大規模データの集計・フィルタリング・可視化を高速に行えます。
</div>

<pre style="font-size:12px;color:#1a1a2e;line-height:1.7;overflow-x:auto">
LogData
| where TimeGenerated &gt; ago(1h)
| where Level == "Error"
| summarize Count = count() by Service
| order by Count desc
| take 10
</pre>
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">クエリ言語</th><th>主なサービス</th><th>用途</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>KQL</strong></td><td>Azure Data Explorer、Azure Monitor、Microsoft Sentinel</td><td>大規模データ探索・分析</td></tr>
<tr><td>T-SQL</td><td>SQL Server、Azure SQL Database、Synapse 専用プール</td><td>リレーショナル DB クエリ</td></tr>
<tr><td>U-SQL</td><td>Azure Data Lake Analytics（廃止予定）</td><td>バッチ ETL 処理</td></tr>
</tbody></table></div>
</div>
<div class="refs"><div class="refs-title">参考ドキュメント</div><ul>
<li><a href="https://learn.microsoft.com/azure/data-explorer/kusto/query/" target="_blank">KQL クエリ言語リファレンス</a></li>
</ul></div>`},

{num:7,id:"q7",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`大量の頻繁にアクセスされるデータを保存するアプリ向けのストレージソリューションを設計しています。

要件：
・可能な限り高いデータスループット
・保存データを 1 年間変更できないようにする（WORM）
・低レイテンシの読み書きアクセス

推奨すべき Azure Storage アカウントの種類はどれですか？`,
choices:[{t:"BlobStorage（レガシー Blob 専用）",c:false},{t:"BlockBlobStorage（Premium ブロック BLOB）",c:true},{t:"FileStorage（Premium ファイル共有）",c:false},{t:"StorageV2 (Standard 汎用 v2)",c:false}],
ci:[1],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="arch-box">
<div class="arch-title">ストレージアカウント選択フロー</div>
<svg viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:480px">
  <rect width="480" height="160" fill="#F0F6FF" rx="10"/>
  <!-- Decision 1 -->
  <rect x="150" y="10" width="180" height="35" rx="6" fill="#607D8B"/>
  <text x="240" y="27" text-anchor="middle" font-size="11" fill="#fff">Blob データを保存する?</text>
  <text x="240" y="40" text-anchor="middle" font-size="9" fill="#ddd">（非構造化オブジェクト）</text>
  <!-- Yes arrow -->
  <line x1="240" y1="45" x2="240" y2="65" stroke="#555" stroke-width="1.5" marker-end="url(#a7)"/>
  <text x="250" y="58" font-size="9" fill="#107C10">Yes</text>
  <!-- Decision 2 -->
  <rect x="130" y="65" width="220" height="35" rx="6" fill="#607D8B"/>
  <text x="240" y="81" text-anchor="middle" font-size="11" fill="#fff">高スループット＋低レイテンシ？</text>
  <text x="240" y="94" text-anchor="middle" font-size="9" fill="#ddd">（Premium SSD が必要）</text>
  <!-- Yes arrow -->
  <line x1="240" y1="100" x2="240" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#a7)"/>
  <text x="250" y="113" font-size="9" fill="#107C10">Yes</text>
  <!-- Result -->
  <rect x="130" y="120" width="220" height="35" rx="6" fill="#E53935"/>
  <text x="240" y="136" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">BlockBlobStorage</text>
  <text x="240" y="150" text-anchor="middle" font-size="9" fill="#fdd">Premium SSD + WORM 対応 ○</text>
  <defs><marker id="a7" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker></defs>
</svg>
</div>
<div class="key-box">
<div class="k-title">正解：BlockBlobStorage（Premium ブロック BLOB）</div>
BlockBlobStorage は SSD ベースの Premium ストレージを使用し、<strong>最高のスループットと最低レイテンシ</strong>を提供します。不変ストレージ（WORM）ポリシーもサポートしており、すべての要件を満たします。
</div>
<div class="tbl-wrap">

<tr><td>BlobStorage</td><td>Standard (HDD)</td><td>○</td><td>レガシー Blob 専用</td></tr>
<tr><td>FileStorage</td><td>Premium (SSD)</td><td>×</td><td>SMB/NFS ファイル共有</td></tr>
<tr><td>StorageV2</td><td>Standard/Premium</td><td>○</td><td>汎用（全機能）</td></tr>

</div>

</ul></div>`},

{num:8,id:"q8",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Q7 と同じ要件（高スループット、WORM、低レイテンシ）のストレージソリューションで、BlockBlobStorage アカウント内で使用すべきストレージサービスはどれですか？`,
choices:[{t:"Blob（オブジェクトストレージ）",c:true},{t:"File（SMB/NFS ファイル共有）",c:false},{t:"Table（NoSQL キーバリュー）",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：Blob</div>
Azure Blob Storage は大量の非構造化データを格納するオブジェクトストレージです。BlockBlobStorage アカウントと組み合わせることで最高スループット・低レイテンシを実現し、<strong>不変ストレージ（WORM）ポリシー</strong>も Blob レベルで設定できます。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">ストレージサービス</th><th>用途</th><th>WORM</th><th>高スループット</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>Blob</strong></td><td>非構造化データ（動画・ログ・バックアップ）</td><td>○</td><td>○</td></tr>
<tr><td>File</td><td>SMB/NFS ファイル共有</td><td>×</td><td>△</td></tr>
<tr><td>Table</td><td>NoSQL 構造化データ</td><td>×</td><td>×</td></tr>
</tbody></table></div>
</div>`},

// ── Q10 ─────────────────────────────────────────────────────
{num:10,id:"q10",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`Q9 と同じシナリオです。「受信ログを変換し、処理済みデータを Log Analytics テーブルに保存する」ために使用すべきクエリ言語はどれですか？`,
choices:[{t:"KQL クエリ（データ収集ルール内の変換）",c:true},{t:"WQL（Windows Query Language）",c:false},{t:"XPath クエリ",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：KQL クエリ（DCR 内の変換）</div>
データ収集ルール (DCR) 内では KQL を使用してデータを変換します。具体的には <code>transformKql</code> プロパティに KQL 式を記述し、受信した JSON データを加工してカスタムテーブルに格納します。
</div>
<div class="arch-box">
<div class="arch-title">DCR 変換 KQL の例</div>
<pre style="font-size:12px;color:#1a1a2e;line-height:1.7;overflow-x:auto">
source
| extend TimeGenerated = todatetime(RawData.timestamp)
| project TimeGenerated,
          Level = tostring(RawData.level),
          Message = tostring(RawData.message),
          Computer = tostring(RawData.host)
</pre>
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">クエリ言語</th><th>使用場所</th><th>DCR 変換に使用可能か</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>KQL</strong></td><td>DCR、Log Analytics、ADX、Sentinel</td><td>○</td></tr>
<tr><td>WQL</td><td>Windows WMI クエリ</td><td>×</td></tr>
<tr><td>XPath</td><td>XML ドキュメント、Windows イベントフィルタリング</td><td>×（構造変換には使えない）</td></tr>
</tbody></table></div>
</div>`},

{num:11,id:"q11",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Azure Storage アカウントへのアクセス制御を設計しています。

外部コンサルタントに対して機密 BLOB コンテナーへの一時的なアクセス権を付与する必要があります。アクセスは「特定の BLOB タグ（例：Department=HR）を持つデータのみ」に制限する必要があります。

どのアクセス制御モデルを使用すべきですか？`,
choices:[{t:"ABAC（属性ベースアクセス制御）— BLOB インデックスタグによる条件付き RBAC",c:true},{t:"RBAC（ロールベースアクセス制御）— ストレージ BLOB データ閲覧者ロールの割り当て",c:false},{t:"SAS（共有アクセス署名）— 時間制限付きアクセス",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="arch-box">
<div class="arch-title">ABAC — BLOB タグベースアクセス制御の仕組み</div>
<svg viewBox="0 0 480 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:480px">
  <rect width="480" height="140" fill="#F0F6FF" rx="10"/>
  <!-- User -->

  <rect x="120" y="30" width="160" height="80" rx="7" fill="#7719AA"/>
  <text x="200" y="55" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">RBAC ロール割り当て</text>
  <text x="200" y="70" text-anchor="middle" font-size="10" fill="#fff">＋ ABAC 条件</text>
  <rect x="130" y="78" width="140" height="24" rx="4" fill="#fff" opacity=".2"/>
  <text x="200" y="94" text-anchor="middle" font-size="9" fill="#fff">@Resource[tags][Department]=='HR'</text>
  <!-- Arrow -->
  <line x1="97" y1="70" x2="117" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#a11)"/>
  <line x1="283" y1="70" x2="303" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#a11)"/>
  <!-- Storage -->
  <rect x="305" y="30" width="160" height="80" rx="7" fill="#0072C6"/>
  <text x="385" y="55" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Blob Storage</text>
  <rect x="315" y="65" width="130" height="22" rx="4" fill="#fff" opacity=".2"/>
  <text x="380" y="80" text-anchor="middle" font-size="9" fill="#fff">tag: Department=HR アクセス可</text>

  <text x="380" y="101" text-anchor="middle" font-size="9" fill="#fff">tag: Department=Finance 拒否</text>

<div class="key-box">
<div class="k-title">正解：ABAC（属性ベースアクセス制御）</div>
ABAC は RBAC に条件（Condition）を追加した拡張機能です。BLOB インデックスタグなどのリソース属性に基づいてアクセスを細粒度で制御できます。「特定タグを持つ BLOB のみ」というシナリオに最適です。
</div>
<div class="tbl-wrap">

<tr><td>RBAC のみ</td><td>リソース全体への権限のみ</td><td>Azure AD 管理</td><td><span class="badge-ng">×</span></td></tr>

</tbody></table></div>
</div>

</ul></div>`},

// ── Q12 ─────────────────────────────────────────────────────
{num:12,id:"q12",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`組織は毎日大量のログファイルを Azure Storage に保存します。ログファイルは月に 1 度しかアクセスされず、3 年間保持する必要があります。コストを最小限に抑えながら要件を満たすストレージサービスはどれですか？`,
choices:[{t:"Blobs（クール/アーカイブ層＋ライフサイクル管理）",c:true},{t:"Files（Azure ファイル共有）",c:false},{t:"Tables（NoSQL キーバリュー）",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="arch-box">
<div class="arch-title">Blob ライフサイクル管理によるコスト最適化</div>
<svg viewBox="0 0 480 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:480px">
  <rect width="480" height="130" fill="#F0F6FF" rx="10"/>
  <!-- Hot -->
  <rect x="15" y="25" width="100" height="80" rx="7" fill="#E53935" opacity=".8"/>
  <text x="65" y="50" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Hot 層</text>
  <text x="65" y="65" text-anchor="middle" font-size="9" fill="#fff">高アクセス頻度</text>
  <text x="65" y="80" text-anchor="middle" font-size="9" fill="#fdd">コスト高</text>
  <text x="65" y="95" text-anchor="middle" font-size="9" fill="#fdd">即時アクセス</text>
  <!-- Arrow -->
  <line x1="118" y1="65" x2="145" y2="65" stroke="#555" stroke-width="1.5" marker-end="url(#a12)"/>
  <text x="131" y="57" font-size="8" fill="#555">30日後</text>
  <!-- Cool -->
  <rect x="148" y="25" width="100" height="80" rx="7" fill="#FB8C00" opacity=".8"/>
  <text x="198" y="50" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Cool 層</text>
  <text x="198" y="65" text-anchor="middle" font-size="9" fill="#fff">低頻度アクセス</text>
  <text x="198" y="80" text-anchor="middle" font-size="9" fill="#fdd">コスト中</text>
  <text x="198" y="95" text-anchor="middle" font-size="9" fill="#fdd">即時アクセス</text>
  <!-- Arrow -->
  <line x1="251" y1="65" x2="278" y2="65" stroke="#555" stroke-width="1.5" marker-end="url(#a12)"/>
  <text x="264" y="57" font-size="8" fill="#555">90日後</text>
  <!-- Cold -->
  <rect x="281" y="25" width="100" height="80" rx="7" fill="#1976D2" opacity=".8"/>
  <text x="331" y="50" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Cold 層</text>
  <text x="331" y="65" text-anchor="middle" font-size="9" fill="#fff">まれなアクセス</text>
  <text x="331" y="80" text-anchor="middle" font-size="9" fill="#ddf">コスト低</text>
  <text x="331" y="95" text-anchor="middle" font-size="9" fill="#ddf">即時アクセス</text>
  <!-- Arrow -->
  <line x1="384" y1="65" x2="411" y2="65" stroke="#555" stroke-width="1.5" marker-end="url(#a12)"/>
  <text x="397" y="57" font-size="8" fill="#555">1年後</text>
  <!-- Archive -->
  <rect x="414" y="25" width="60" height="80" rx="7" fill="#512DA8" opacity=".85"/>
  <text x="444" y="50" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Archive</text>
  <text x="444" y="65" text-anchor="middle" font-size="8" fill="#fff">長期保存</text>
  <text x="444" y="80" text-anchor="middle" font-size="8" fill="#ddf">最低コスト</text>
  <text x="444" y="95" text-anchor="middle" font-size="8" fill="#ddf">復元に数時間</text>
  <text x="240" y="15" text-anchor="middle" font-size="10" fill="#0072C6" font-weight="bold">ライフサイクル管理による自動層移行</text>
  <defs><marker id="a12" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker></defs>
</svg>
</div>
<div class="key-box">
<div class="k-title">正解：Blobs</div>
Azure Blob Storage は<strong>ライフサイクル管理ポリシー</strong>により、データを自動的に Hot → Cool → Cold → Archive 層へ移行できます。月 1 度のアクセスであれば Cool/Cold 層、保持中はアーカイブが最適です。
</div>
<div class="warn-box">
<div class="w-title">Files と Tables は不適</div>
Azure Files は SMB/NFS ファイル共有用でアーカイブ層がなく、コスト最適化に不向きです。Tables は NoSQL データストアであり、ログファイル保存用途ではありません。
</div>
</div>`},

// ── Q13 ─────────────────────────────────────────────────────
{num:13,id:"q13",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Azure Blob Storage に大量のテキストファイルを保存する予定です。

要件：
・データの並列アップロードをサポートすること
・アップロードが失敗した場合に途中から再開できること

どの BLOB の種類を使用すべきですか？`,
choices:[{t:"ブロック BLOB（Block Blob）",c:true},{t:"アペンド BLOB（Append Blob）",c:false},{t:"ページ BLOB（Page Blob）",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="arch-box">
<div class="arch-title">ブロック BLOB の並列アップロード仕組み</div>
<svg viewBox="0 0 480 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:480px">
  <rect width="480" height="140" fill="#F0F6FF" rx="10"/>
  <!-- File -->
  <rect x="15" y="40" width="80" height="60" rx="7" fill="#607D8B"/>
  <text x="55" y="65" text-anchor="middle" font-size="10" fill="#fff">テキストファイル</text>
  <text x="55" y="80" text-anchor="middle" font-size="10" fill="#fff">100 MB</text>
  <!-- Split arrows -->
  <line x1="98" y1="55" x2="148" y2="40" stroke="#0072C6" stroke-width="1.5" marker-end="url(#a13)"/>
  <line x1="98" y1="65" x2="148" y2="65" stroke="#0072C6" stroke-width="1.5" marker-end="url(#a13)"/>
  <line x1="98" y1="75" x2="148" y2="90" stroke="#0072C6" stroke-width="1.5" marker-end="url(#a13)"/>
  <text x="123" y="58" font-size="8" fill="#0072C6">並列</text>
  <!-- Blocks -->
  <rect x="150" y="25" width="60" height="30" rx="5" fill="#0072C6"/>
  <text x="180" y="44" text-anchor="middle" font-size="9" fill="#fff">Block 1</text>
  <rect x="150" y="55" width="60" height="30" rx="5" fill="#0072C6"/>
  <text x="180" y="74" text-anchor="middle" font-size="9" fill="#fff">Block 2</text>
  <rect x="150" y="85" width="60" height="30" rx="5" fill="#E53935"/>
  <text x="180" y="104" text-anchor="middle" font-size="9" fill="#fff">Block 3 ×</text>
  <!-- Arrow to commit -->
  <line x1="213" y1="65" x2="248" y2="65" stroke="#555" stroke-width="1.5" marker-end="url(#a13)"/>
  <!-- Commit -->
  <rect x="250" y="40" width="100" height="50" rx="7" fill="#107C10"/>
  <text x="300" y="62" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Put Block List</text>
  <text x="300" y="76" text-anchor="middle" font-size="9" fill="#ddd">Block3 のみ再送後</text>
  <text x="300" y="88" text-anchor="middle" font-size="9" fill="#ddd">コミット</text>
  <!-- Arrow to result -->
  <line x1="353" y1="65" x2="388" y2="65" stroke="#555" stroke-width="1.5" marker-end="url(#a13)"/>
  <!-- Result -->
  <rect x="390" y="40" width="80" height="50" rx="7" fill="#512DA8"/>
  <text x="430" y="60" text-anchor="middle" font-size="10" fill="#fff">完成した</text>
  <text x="430" y="74" text-anchor="middle" font-size="10" fill="#fff">Block Blob</text>
  <text x="430" y="88" text-anchor="middle" font-size="9" fill="#ddd">再開可能 ○</text>
  <defs><marker id="a13" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker></defs>
</svg>
</div>
<div class="key-box">
<div class="k-title">正解：ブロック BLOB</div>
ブロック BLOB はデータを独立したブロックに分割してアップロードします。各ブロックは<strong>並列アップロード</strong>が可能で、失敗したブロックのみ再送できるため「再開可能アップロード」を実現できます。最大サイズは約 190.7 TB です。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">BLOB の種類</th><th>並列アップロード</th><th>再開可能</th><th>主な用途</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>ブロック BLOB</strong></td><td>○</td><td>○</td><td>テキスト・バイナリファイル</td></tr>
<tr><td>アペンド BLOB</td><td>末尾追記のみ</td><td>×</td><td>ログファイルの蓄積</td></tr>
<tr><td>ページ BLOB</td><td>ランダム書込み</td><td>×</td><td>Azure VM ディスク (VHD)</td></tr>
</tbody></table></div>
</div>`},

<div class="key-box">
<div class="k-title">正解：Azure Synapse Link for Cosmos DB</div>
Synapse Link は Cosmos DB の<strong>分析ストア</strong>（列指向ストレージ）を自動作成し、ETL なしで Synapse Analytics から直接クエリできます。OLTP ワークロードへの影響がゼロで、ほぼリアルタイムの分析が可能です。
</div>

<tbody>
<tr class="hl"><td><strong>Synapse Link (分析ストア)</strong></td><td>なし</td><td>ほぼリアルタイム</td><td>不要</td></tr>
<tr><td>変更フィード</td><td>△ 低影響</td><td>リアルタイム</td><td>コード実装必要</td></tr>
<tr><td>Azure Data Factory</td><td>△ バッチ時に影響</td><td>バッチ処理</td><td>パイプライン構築必要</td></tr>
<tr><td>読み取りレプリカ</td><td>なし</td><td>△</td><td>Synapse 連携不可</td></tr>
</tbody></table></div>

{num:17,id:"q17",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`Q16 と同じ APIM シナリオです。「API のレート制限」として推奨されるポリシー機能はどれですか？`,
choices:[{t:"JWT トークンによる認証後にレート制限する（validate-jwt + rate-limit-by-key）",c:false},{t:"キーによるレート制限（rate-limit-by-key）",c:true},{t:"サブスクリプションごとのクォータ制限（quota）",c:false}],
ci:[1],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>

<div class="key-box">
<div class="k-title">正解：キーによるレート制限（rate-limit-by-key）</div>
<code>rate-limit-by-key</code> ポリシーはサブスクリプションキー・IP アドレス・ユーザー ID など任意のキーに基づいて API 呼び出しレートを制限します。「単位時間あたりの呼び出し数」を制御するリアルタイムのスロットリングです。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">ポリシー</th><th>機能</th><th>キー指定</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>rate-limit-by-key</strong></td><td>単位時間あたりの呼び出し数制限</td><td>任意のキー</td></tr>
<tr><td>rate-limit</td><td>サブスクリプション全体の呼び出し数制限</td><td>サブスクリプション固定</td></tr>
<tr><td>quota</td><td>長期間での合計呼び出し数/帯域制限</td><td>長期クォータ</td></tr>
</tbody></table></div>
<div class="warn-box">
<div class="w-title">rate-limit と quota の違い</div>
<code>rate-limit</code> は短期間（秒・分）のスロットリング、<code>quota</code> は長期間（週・月）の上限設定です。パートナー向け API の過負荷防止には <code>rate-limit-by-key</code> が最適です。
</div>
</div>`},

q:`Azure Policy を使用して、指定された Azure リージョン外へのリソースデプロイを防止する必要があります。

ポリシーの効果（effect）として何を使用すべきですか？`,
choices:[{t:"DeployIfNotExists（自動修復デプロイ）",c:false},{t:"Deny（拒否）",c:true},{t:"Audit（監査のみ）",c:false}],
ci:[1],n:1,

// ── Q19 ─────────────────────────────────────────────────────
{num:19,id:"q19",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`Azure リソースへのアクセスを管理しています。ユーザーに必要な最小限の権限のみを付与する「最小権限の原則」を実施する必要があります。

最小権限の原則を実施するために何を変更すべきですか？`,
choices:[{t:"必要な権限のみを持つ RBAC ロールを割り当てる",c:true},{t:"すべてのリソースにリソースロックを適用する",c:false},{t:"条件付きアクセスポリシーを構成する",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：必要な権限のみを持つ RBAC ロールを割り当てる</div>
最小権限の原則は<strong>RBAC（ロールベースアクセス制御）</strong>を通じて実装します。組み込みロール（Owner → Contributor → Reader → カスタムロール）から必要最小限の権限のみを持つロールを選択し、適切なスコープ（リソースグループ・リソースレベル）で割り当てます。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">オプション</th><th>目的</th><th>最小権限の実現</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>RBAC ロール割り当て</strong></td><td>権限管理（誰が何をできるか）</td><td>直接的に実現</td></tr>
<tr><td>リソースロック</td><td>削除・変更の保護（ReadOnly/Delete）</td><td>権限管理ではない</td></tr>
<tr><td>条件付きアクセス</td><td>サインイン条件の制御（MFA、場所など）</td><td>認証条件の制御</td></tr>
</tbody></table></div>
<div class="warn-box">
<div class="w-title">よくある誤解</div>
条件付きアクセスは「誰がサインインできるか」を制御しますが、「サインイン後に何ができるか」の権限は RBAC で制御します。リソースロックは既存リソースの保護であり、アクセス権限の管理とは別の機能です。
</div>
</div>`},

// ── Q20 ─────────────────────────────────────────────────────
{num:20,id:"q20",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Azure Storage アカウントを作成しています。このストレージアカウントは可用性ゾーン障害に対して耐性を持つ必要があります。コストを最小限に抑える必要もあります。

どのレプリケーションオプションを使用すべきですか？`,
choices:[{t:"ゾーン冗長ストレージ (ZRS)",c:true},{t:"ローカル冗長ストレージ (LRS)",c:false},{t:"geo 冗長ストレージ (GRS)",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="arch-box">
<div class="arch-title">ストレージ冗長性の比較</div>
<svg viewBox="0 0 480 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:480px">
  <rect width="480" height="140" fill="#F0F6FF" rx="10"/>
  <!-- LRS -->
  <rect x="10" y="25" width="130" height="90" rx="7" fill="#607D8B"/>
  <text x="75" y="45" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">LRS</text>
  <text x="75" y="60" text-anchor="middle" font-size="9" fill="#ddd">同一 DC 内 3 コピー</text>
  <rect x="20" y="70" width="110" height="15" rx="3" fill="#fff" opacity=".2"/>
  <text x="75" y="82" text-anchor="middle" font-size="8" fill="#fff">ゾーン障害 脆弱</text>
  <text x="75" y="106" text-anchor="middle" font-size="9" fill="#4CAF50">💰 最安</text>
  <!-- ZRS -->
  <rect x="155" y="25" width="160" height="90" rx="7" fill="#E53935"/>
  <text x="235" y="45" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">ZRS ← 正解</text>
  <text x="235" y="60" text-anchor="middle" font-size="9" fill="#fff">3 AZ に 1 コピーずつ</text>
  <rect x="165" y="68" width="130" height="15" rx="3" fill="#fff" opacity=".2"/>
  <text x="235" y="80" text-anchor="middle" font-size="8" fill="#fff">ゾーン障害 耐性あり</text>
  <text x="235" y="95" text-anchor="middle" font-size="9" fill="#fdd">リージョン障害 ×</text>
  <text x="235" y="108" text-anchor="middle" font-size="9" fill="#4CAF50">💰💰 中コスト</text>
  <!-- GRS -->
  <rect x="330" y="25" width="140" height="90" rx="7" fill="#607D8B"/>
  <text x="400" y="45" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">GRS</text>
  <text x="400" y="60" text-anchor="middle" font-size="9" fill="#ddd">2 リージョンに複製</text>
  <text x="400" y="75" text-anchor="middle" font-size="9" fill="#ddd">ゾーン障害 ○</text>
  <text x="400" y="90" text-anchor="middle" font-size="9" fill="#ddd">リージョン障害 ○</text>
  <text x="400" y="106" text-anchor="middle" font-size="9" fill="#FF9800">💰💰💰 高コスト</text>
  <text x="240" y="15" text-anchor="middle" font-size="10" fill="#0072C6" font-weight="bold">ゾーン障害耐性 + コスト最小 = ZRS</text>
</svg>
</div>
<div class="key-box">
<div class="k-title">正解：ZRS（ゾーン冗長ストレージ）</div>
ZRS は同一リージョン内の 3 つの可用性ゾーンにデータを分散コピーします。1 ゾーン障害に対して耐性を持ち、LRS よりも高可用性で GRS よりもコストが低い、最適な選択です。
</div>
</div>`},

// ── Q21 ─────────────────────────────────────────────────────
{num:21,id:"q21",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`頻繁に読み書きが行われる大量の BLOB データを保存するソリューションを設計しています。

要件：
・最高のトランザクションパフォーマンス
・ゾーン障害に対する耐性

どのストレージアカウントオプションを使用すべきですか？`,
choices:[{t:"Premium ブロック BLOB（BlockBlobStorage） + ZRS",c:true},{t:"Standard 汎用 v2 (StorageV2) + GRS",c:false},{t:"Standard 汎用 v2 (StorageV2) + LRS",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：Premium ブロック BLOB（BlockBlobStorage） + ZRS</div>
「最高のトランザクションパフォーマンス」には <strong>Premium（SSD ベース）</strong>の BlockBlobStorage アカウントが必要です。「ゾーン障害耐性」には <strong>ZRS</strong> が必要です。この 2 つの組み合わせがすべての要件を満たします。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">オプション</th><th>パフォーマンス</th><th>ゾーン耐性</th><th>判定</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>Premium BlockBlobStorage + ZRS</strong></td><td>最高 (SSD)</td><td>○</td><td><span class="badge-ok">正解</span></td></tr>
<tr><td>Standard V2 + GRS</td><td>標準 (HDD)</td><td>○</td><td><span class="badge-ng">×</span></td></tr>
<tr><td>Standard V2 + LRS</td><td>標準 (HDD)</td><td>×</td><td><span class="badge-ng">×</span></td></tr>
</tbody></table></div>
</div>`},

<div class="k-title">正解：Azure SQL Database のエラスティックプール</div>
エラスティックプールは複数のデータベースが eDTU または vCore リソースを共有する仕組みです。各テナントに独立したデータベースを提供しながら、コンピュートリソースを共有することでコストを大幅に削減できます。テナントの増減にも柔軟に対応します。

// ── Q24 ─────────────────────────────────────────────────────
{num:24,id:"q24",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`コンテナー化されたアプリの CI/CD パイプラインを設計しています。コンテナーイメージを一元管理する必要があります。

コンテナーイメージを保存・管理するために何を使用すべきですか？`,
choices:[{t:"Azure Container Registry (ACR)",c:true},{t:"Azure Container Apps",c:false},{t:"Azure Kubernetes Service (AKS)",c:false},{t:"Azure Blob Storage",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>


<div class="key-box">
<div class="k-title">正解：Azure Container Registry (ACR)</div>
ACR はプライベートな Docker イメージレジストリです。イメージのバージョン管理、脆弱性スキャン（Microsoft Defender for Containers との統合）、geo レプリケーションを提供します。
</div>
<div class="warn-box">
<div class="w-title">他の選択肢との混同に注意</div>
Container Apps・AKS はコンテナーの<strong>実行環境</strong>であり、イメージの保存には使用しません。Blob Storage はオブジェクトストレージですが、Docker レジストリプロトコルをサポートしていません。
</div>
</div>`},

// ── Q25 ─────────────────────────────────────────────────────
{num:25,id:"q25",domain:"ビジネス継続性設計",dc:"BC",color:"#107C10",
q:`Azure VM 上で動作する SQL Server Always On 可用性グループを管理しています。現在、プライマリレプリカと 1 つのセカンダリレプリカがあります。

RTO（目標復旧時間）を短縮するために何をすべきですか？`,
choices:[{t:"既存の可用性グループにセカンダリレプリカを追加する",c:true},{t:"新しい可用性グループを別途作成する",c:false},{t:"フェールオーバークラスターを再構成する",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：既存の可用性グループにセカンダリレプリカを追加する</div>
RTO 短縮には複数の<strong>同期コミット</strong>セカンダリレプリカを追加することが効果的です。自動フェールオーバーの対象となるレプリカが増えることで、障害時に最も近いレプリカへ迅速にフェールオーバーできます。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th>コミットモード</th><th>RTO</th><th>RPO</th><th>適した配置</th></tr></thead>
<tbody>
<tr><td>同期コミット</td><td>数秒（自動フェールオーバー可）</td><td>ゼロ（データ損失なし）</td><td>同一リージョン</td></tr>
<tr><td>非同期コミット</td><td>△ 数分（手動フェールオーバー）</td><td>△ 少量の損失可能性</td><td>異なるリージョン（DR）</td></tr>
</tbody></table></div>
</div>`},

Application Gateway はリージョンスコープの Layer 7 ロードバランサーで、リバースプロキシ・SSL 終端・WAF（Web Application Firewall）機能を提供します。「単一リージョン + WAF + リバースプロキシ」の要件に最適です。
</div>

<tr><td>Front Door</td><td>グローバル L7</td><td>○</td><td>○</td><td>○</td></tr>
<tr><td>Load Balancer</td><td>リージョン L4</td><td>×</td><td>×</td><td>×</td></tr>

</tbody></table></div>
<div class="warn-box">
<div class="w-title">Front Door との使い分け</div>
Front Door は<strong>グローバル</strong>の分散アプリに使用します。<strong>単一リージョン</strong>の Web アプリには Application Gateway が適切です。

{num:30,id:"q30",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`Q29 と同じシナリオです。WebApp1 から DB1 のプライベートエンドポイント IP アドレスへの名前解決（DNS）を設定する必要があります。

仮想ネットワークからの名前解決に何を使用すべきですか？`,
choices:[{t:"Azure プライベート DNS ゾーン",c:true},{t:"パブリック DNS ゾーン",c:false},{t:"Azure DNS プライベートリゾルバー",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>

<div class="key-box">
<div class="k-title">正解：Azure プライベート DNS ゾーン</div>
プライベートエンドポイントを使用する場合、データベースの FQDN（例：<code>sql1.database.windows.net</code>）がプライベート IP アドレスに解決されるよう<strong>プライベート DNS ゾーン</strong>（例：<code>privatelink.database.windows.net</code>）を VNet にリンクする必要があります。
</div>

// ── Q32 ─────────────────────────────────────────────────────
{num:32,id:"q32",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`【関連問題】Q31 と同じ構成です（APIM が外部 VNet モードで VNet1 の ProdSubnet に統合、VM1 は同じ VNet1 の Subnet1 に配置）。

True か False か：
「APIM インスタンスは VM1 からリアルタイムデータにアクセスできます。」`,
choices:[{t:"True",c:true},{t:"False",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>

<div class="key-box">
<div class="k-title">正解：True</div>
APIM（ProdSubnet）と VM1（Subnet1）は<strong>同じ VNet1 内</strong>にあります。同一 VNet 内であれば VNet ピアリング等なしに直接通信可能です。外部 VNet モードの APIM は VNet 内バックエンドにプライベート IP でアクセスできます。
</div>
<div class="arch-box">
<div class="arch-title">通信フロー（APIM → VNet → VM）</div>
<pre style="font-size:12px;line-height:1.8;color:#1a1a2e">
インターネット → APIM (ProdSubnet, パブリック IP) → VM1 (Subnet1, プライベート IP)
               ↑ 外部モード: パブリックアクセス可    ↑ 同一 VNet: プライベート通信可
</pre>
</div>
</div>`},

// ── Q33 ─────────────────────────────────────────────────────
{num:33,id:"q33",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`【関連問題】Q31・Q32 と同じ構成です（APIM が外部 VNet モード）。

True か False か：
「パートナーの API アクセスには VPN ゲートウェイが必要です。」`,
choices:[{t:"True",c:false},{t:"False",c:true}],
ci:[1],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>

<div class="key-box">
<div class="k-title">正解：False</div>
APIM が外部 VNet モードで統合されている場合、API はすでにパブリックインターネットからアクセス可能です。パートナーが API を利用するために<strong>VPN ゲートウェイは不要</strong>です。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th>VPN ゲートウェイが必要なケース</th><th>本シナリオ</th></tr></thead>
<tbody>
<tr><td>オンプレミス ↔ Azure VNet のサイト間接続</td><td>不要（パブリック API アクセス）</td></tr>
<tr><td>Azure VNet ↔ VNet 間の接続</td><td>不要</td></tr>
<tr><td>リモートユーザーのポイント対サイト接続</td><td>不要</td></tr>
</tbody></table></div>
</div>`},

// ── Q34 ─────────────────────────────────────────────────────
{num:34,id:"q34",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Azure Blob Storage の不変ストレージを設計しています。規制要件により BLOB は一定期間変更・削除できないようにする必要があります。

BLOB を更新する際に現在のバージョンを自動保持しながら新しいバージョンを作成できる機能はどれですか？`,
choices:[{t:"BLOB バージョニング",c:true},{t:"BLOB スナップショット",c:false},{t:"BLOB ソフト削除",c:false},{t:"変更フィード",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：BLOB バージョニング</div>
BLOB バージョニングを有効にすると、BLOB が上書きされるたびに<strong>以前のバージョンが自動的に保存</strong>されます。現在のバージョン（Current Version）と過去バージョン（Previous Versions）の両方を保持できます。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">機能</th><th>自動バージョン保持</th><th>用途</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>BLOB バージョニング</strong></td><td>上書き時に自動保存</td><td>バージョン管理・復元</td></tr>
<tr><td>BLOB スナップショット</td><td>手動作成が必要</td><td>特定時点のコピー</td></tr>
<tr><td>ソフト削除</td><td>×（削除保護のみ）</td><td>誤削除からの保護</td></tr>
<tr><td>変更フィード</td><td>×（変更履歴記録のみ）</td><td>監査・イベント処理</td></tr>
</tbody></table></div>
</div>`},

// ── Q36 ─────────────────────────────────────────────────────
{num:36,id:"q36",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`Azure Policy を使用してリソースのコンプライアンスを管理しています。

診断設定が構成されていないリソースに対して、自動的に診断設定を追加するために、どのポリシー効果（effect）を使用すべきですか？`,
choices:[{t:"DeployIfNotExists（自動デプロイ・修復）",c:true},{t:"Deny（拒否）",c:false},{t:"Audit（監査のみ）",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：DeployIfNotExists</div>
<code>DeployIfNotExists</code> は指定された条件が満たされていない場合に、ARM テンプレートを使用してリソースを<strong>自動的にデプロイ・設定</strong>します。「診断設定がないリソースに自動で診断設定を追加する」という要件に最適です。修復タスクを手動または自動でトリガーできます。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">Effect</th><th>動作</th><th>自動修復</th><th>「診断設定追加」に適切か</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>DeployIfNotExists</strong></td><td>条件不満足時にリソースを自動デプロイ</td><td>○</td><td>正解</td></tr>
<tr><td>Deny</td><td>非準拠リソースの作成を拒否</td><td>×</td><td>×（既存リソースには効果なし）</td></tr>
<tr><td>Audit</td><td>非準拠をログ記録のみ</td><td>×</td><td>×（修復しない）</td></tr>
</tbody></table></div>
</div>
<div class="refs"><div class="refs-title">参考ドキュメント</div><ul>
<li><a href="https://learn.microsoft.com/azure/governance/policy/concepts/effect-deploy-if-not-exists" target="_blank">DeployIfNotExists の詳細</a></li>
</ul></div>`},

<div class="key-box">
<div class="k-title">正解：マネージド ID</div>
マネージド ID は Azure AD によって自動管理される ID です。クライアントシークレットや証明書を手動管理する必要がなく、ローテーションも自動です。Azure サービスから他の Azure サービスへのアクセスでは常に第一選択です。
</div>

<table class="ctbl">

</div>`},

// ── Q38 ─────────────────────────────────────────────────────
{num:38,id:"q38",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`大量のトランザクションを処理するアプリのデータベースを設計しています。

要件：
・高い IOPS が必要
・ビジネスクリティカルなワークロード
・読み取りスケールアウトが必要

どのオプションを使用すべきですか？`,
choices:[{t:"vCore ベースの Azure SQL Database（Business Critical 層）",c:true},{t:"DTU ベースの Azure SQL Database（Standard 層）",c:false},{t:"Azure SQL Managed Instance（General Purpose 層）",c:false},{t:"Azure Database for MySQL",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：vCore ベースの Azure SQL Database（Business Critical 層）</div>
vCore モデルの Business Critical 層は SSD ベースの高 IOPS ストレージ、組み込みの読み取り可能なセカンダリレプリカ（読み取りスケールアウト）、最高可用性を提供します。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">オプション</th><th>IOPS</th><th>読み取りスケールアウト</th><th>ビジネスクリティカル向け</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>vCore SQL DB (Business Critical)</strong></td><td>高 (SSD)</td><td>セカンダリレプリカ</td><td>○</td></tr>
<tr><td>DTU SQL DB (Standard)</td><td>限定的</td><td>×</td><td>×</td></tr>
<tr><td>SQL MI (General Purpose)</td><td>△ 中程度</td><td>×</td><td>△</td></tr>
<tr><td>Azure DB for MySQL</td><td>△</td><td>読み取りレプリカ</td><td>SQL Server 非互換</td></tr>
</tbody></table></div>
</div>`},

// ── Q39 ─────────────────────────────────────────────────────
{num:39,id:"q39",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`Azure SQL Database の診断ログを 7 年間保存する規制要件があります。コストを最小化しながら要件を満たすには何を設定すべきですか？`,
choices:[{t:"データベースに長期リテンションポリシー（LTR）を構成する",c:true},{t:"Log Analytics ワークスペースに診断ログを送信する",c:false},{t:"Azure Storage アカウントに診断ログを送信する（診断設定）",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：長期リテンションポリシー（LTR）を構成する</div>
Azure SQL Database の LTR（Long-Term Retention）を使用すると、<strong>週次・月次・年次のバックアップを最大 10 年間</strong> Azure Blob Storage に自動保持できます。7 年間の要件を満たす最適な方法です。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">オプション</th><th>最大保存期間</th><th>7年要件</th><th>コスト</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>LTR（長期リテンション）</strong></td><td>最大 10 年</td><td>○</td><td>低（RA-GRS Blob）</td></tr>
<tr><td>Log Analytics</td><td>最大 2 年</td><td>不足</td><td>中</td></tr>
<tr><td>Storage（診断設定）</td><td>最大 365 日</td><td>不足</td><td>低</td></tr>
</tbody></table></div>
</div>`},

<div class="key-box">
<div class="k-title">正解：Azure VM にドメインコントローラーをデプロイする</div>
<strong>NTLM/Kerberos 認証</strong>には Windows Server Active Directory Domain Services が必要です。Azure VM 上に既存ドメイン（corp.ironclad.com）の DC をデプロイし、オンプレミス AD と同期することで、既存ユーザーが Kerberos/NTLM で認証できるようになります。
</div>

<tr><td>Entra Domain Services</td><td>○</td><td>△ ワンウェイ同期</td><td>マネージド</td></tr>
<tr><td>AD FS</td><td>フェデレーション認証</td><td>○</td><td>×</td></tr>
</tbody></table></div>
<div class="warn-box">
<div class="w-title">Entra Domain Services では不十分な理由</div>
Entra Domain Services は Entra ID からの<strong>ワンウェイ同期</strong>のみで、既存オンプレミス AD との完全な双方向信頼関係を確立できません。corp.ironclad.com ドメインとの完全な統合には Azure VM DC が必要です。
</div>
</div>`},

// ── Q41 ─────────────────────────────────────────────────────
{num:41,id:"q41",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Azure Storage アカウントのガバナンスとセキュリティを設計しています。

以下の 2 つの要件を満たすために有効化すべき設定を 2 つ選択してください：
・リテンションポリシーを Azure サブスクリプション全体で一貫して適用すること
・データが不正な場所にコピーされた場合にアクセスを無効化または削除できること`,
choices:[
  {t:"Azure Backup による操作バックアップを有効にする",c:true},
  {t:"コンテナーのポイントインタイムリストアを有効にする",c:false},
  {t:"BLOB のソフト削除を有効にする",c:false},
  {t:"コンテナーのソフト削除を有効にする",c:false},
  {t:"ソフト削除済みアイテムの永続削除（Permanent Delete）を有効にする",c:true},
  {t:"BLOB のバージョニングを有効にする",c:false}
],
ci:[0,4],n:2,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：① Azure Backup 操作バックアップ + ② 永続削除を有効にする</div>
<strong>① Azure Backup の操作バックアップ：</strong>バックアップポリシーを使用してサブスクリプション全体で一貫したリテンションポリシーを Azure Policy として適用できます。<br><br>
<strong>② ソフト削除済みアイテムの永続削除（Permanent Delete）：</strong>ソフト削除状態のデータを保持期間内に完全削除する機能です。不正な場所に移動されたデータを確実に削除するための要件を満たします。
</div>

<tr class="hl"><td><strong>Azure Backup 操作バックアップ</strong></td><td>Azure Policy で適用可</td><td>—</td></tr>
<tr class="hl"><td><strong>永続削除（Permanent Delete）</strong></td><td>—</td><td>ソフト削除中でも削除可</td></tr>
<tr><td>ポイントインタイムリストア</td><td>×</td><td>×（復元機能）</td></tr>
<tr><td>BLOB/コンテナーのソフト削除</td><td>アカウント単位</td><td>×（復元保護）</td></tr>
<tr><td>BLOB バージョニング</td><td>×</td><td>×（バージョン管理）</td></tr>
</tbody></table></div>
</div>`},

</svg></div>
<div class="key-box">
<div class="k-title">正解：Synapse Analytics のマネージド仮想ネットワーク（Managed VNet）</div>
Synapse の Managed Virtual Network を有効にすると、すべての統合ランタイムが分離された専用 VNet 内で実行されます。マネージドプライベートエンドポイントを使用してデータソースにプライベート接続でき、<strong>データエクスフィルトレーション（データ持ち出し）保護</strong>も提供されます。
</div>
<div class="tbl-wrap">
<table class="ctbl">

<tbody>
<tr class="hl"><td><strong>Managed VNet</strong></td><td>マネージド PE</td><td>○</td><td>ベストプラクティス</td></tr>
<tr><td>パブリックエンドポイント</td><td>×</td><td>×</td><td>×</td></tr>
<tr><td>VPN ゲートウェイ</td><td>○</td><td>△</td><td>管理オーバーヘッド高</td></tr>
</tbody></table></div>
</div>`},

// ── Q43 ─────────────────────────────────────────────────────
{num:43,id:"q43",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`Azure Synapse Analytics ワークスペースから機密データソースに安全にアクセスするための接続方法として最も推奨されるものはどれですか？`,
choices:[{t:"マネージドプライベートエンドポイント",c:true},{t:"パブリックエンドポイント",c:false},{t:"VNet ゲートウェイ",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>

<div class="key-box">
<div class="k-title">正解：マネージドプライベートエンドポイント</div>
マネージドプライベートエンドポイントは Synapse の Managed VNet 内から外部 Azure サービス（ADLS Gen2、Azure SQL など）へのプライベート接続を提供します。インターネットを経由せず、プライベート IP でデータソースにアクセスできます。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">接続方法</th><th>プライベート接続</th><th>セキュリティレベル</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>マネージドプライベートエンドポイント</strong></td><td>○</td><td>最高</td></tr>
<tr><td>パブリックエンドポイント</td><td>インターネット経由</td><td>低</td></tr>
<tr><td>VNet ゲートウェイ</td><td>○</td><td>高（管理複雑）</td></tr>
</tbody></table></div>
</div>`},

// ── Q44 ─────────────────────────────────────────────────────
{num:44,id:"q44",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`Azure サブスクリプション内の複数の Azure リソースに対してポリシーを適用する必要があります。リソースがポリシーに準拠していない場合、自動的に修復する必要があります。

どのポリシー効果（effect）を使用すべきですか？`,
choices:[{t:"DeployIfNotExists（自動修復デプロイ）",c:true},{t:"Deny（作成を拒否）",c:false},{t:"AuditIfNotExists（監査のみ）",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：DeployIfNotExists</div>
<code>DeployIfNotExists</code> は非準拠リソースを検出した際に、ARM テンプレートを使用してリソースを<strong>自動的にデプロイ・修復</strong>します。マネージド ID で修復タスクを実行します。「自動修復」の要件にはこの Effect のみが対応します。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">Effect</th><th>自動修復</th><th>作成ブロック</th><th>「自動修復」要件</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>DeployIfNotExists</strong></td><td>○</td><td>×</td><td>正解</td></tr>
<tr><td>Deny</td><td>×</td><td>○</td><td>×</td></tr>
<tr><td>AuditIfNotExists</td><td>×</td><td>×</td><td>×</td></tr>
</tbody></table></div>
</div>`},

// ── Q45 ─────────────────────────────────────────────────────
{num:45,id:"q45",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`Azure Logic Apps から Azure Key Vault に格納された資格情報に安全にアクセスする必要があります。資格情報管理を最小化するベストプラクティスはどれですか？`,
choices:[{t:"マネージド IDを使用する",c:true},{t:"サービスプリンシパルを使用する",c:false},{t:"ストレージアクセスキーを使用する",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：マネージド ID（Q37 の再確認問題）</div>
Q37 と同様に、Azure リソースから Azure Key Vault へのアクセスには<strong>マネージド ID</strong>が最もセキュアです。クライアントシークレットや証明書を管理する必要がなく、ライフサイクルは Azure が自動管理します。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">認証方法</th><th>シークレット管理</th><th>Key Vault アクセス</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>マネージド ID</strong></td><td>不要 ○</td><td>RBAC または Key Vault アクセスポリシー経由</td></tr>
<tr><td>サービスプリンシパル</td><td>必要 ×</td><td>クライアントシークレット/証明書が必要</td></tr>
<tr><td>アクセスキー</td><td>必要 ×</td><td>Key Vault には不適</td></tr>
</tbody></table></div>
</div>`},

// ── Q46 ─────────────────────────────────────────────────────
{num:46,id:"q46",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Azure SQL Database を使用するアプリを設計しています。

要件：
・予測不可能なワークロードへの柔軟なコンピューティングリソース
・使用していない時間帯のコストを最小化（自動一時停止）
・最新の SQL Server 機能が必要

どのオプションを使用すべきですか？`,
choices:[{t:"vCore ベースの Azure SQL Database（General Purpose / サーバーレス）",c:true},{t:"DTU ベースの Azure SQL Database（Standard 層）",c:false},{t:"Azure SQL Managed Instance",c:false},{t:"Azure Database for PostgreSQL",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：vCore SQL Database（サーバーレス計算層）</div>
vCore モデルの <strong>General Purpose 層のサーバーレス計算層</strong> は、使用状況に応じて自動スケールし、非アクティブ時には<strong>自動一時停止</strong>してコストをほぼゼロに削減できます。予測不可能なワークロードに最適です。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">オプション</th><th>自動スケール</th><th>自動一時停止</th><th>最新機能</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>vCore SQL DB（サーバーレス）</strong></td><td>○</td><td>○</td><td>○</td></tr>
<tr><td>DTU Standard</td><td>固定リソース</td><td>×</td><td>○</td></tr>
<tr><td>SQL Managed Instance</td><td>△</td><td>×</td><td>SQL Server 完全互換</td></tr>
<tr><td>Azure DB for PostgreSQL</td><td>○</td><td>○</td><td>PostgreSQL のみ</td></tr>
</tbody></table></div>
</div>`},

// ── Q47 ─────────────────────────────────────────────────────
{num:47,id:"q47",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Azure SQL Database の自動バックアップの保持期間を拡張する必要があります。業務要件により、バックアップを 3 年間保持する必要があります。

どのように設定すべきですか？`,
choices:[{t:"データベースに長期リテンションポリシー（LTR）を構成する",c:true},{t:"Log Analytics ワークスペースにバックアップログを送信する",c:false},{t:"Azure Storage アカウントに手動でバックアップを保存する",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：長期リテンションポリシー（LTR）を構成する</div>
Azure SQL Database の LTR は、週次・月次・年次バックアップを<strong>最大 10 年間</strong> Azure Blob Storage（RA-GRS）に自動保持します。3 年間の要件を満たす最適な方法です。<br><br>
既定の保持期間: 7 日（Basic: 1 日）、最大: 35 日 → LTR を使用することで最大 10 年まで拡張可能
</div>
</div>`},

{num:50,id:"q50",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Azure Storage アカウントの BLOB バージョニングについて：

True か False か：
「BLOB バージョニングを有効にしている場合、BLOB を上書きすると以前のバージョンが自動的に保持されます。」`,
choices:[{t:"True",c:true},{t:"False",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：True</div>
BLOB バージョニングが有効な場合、BLOB が作成・上書き・削除されるたびに、Azure Storage は自動的に以前のバージョンを保存します。上書き後も「過去バージョン」として以前の内容にアクセス・復元が可能です。
</div>
<div class="arch-box">
<div class="arch-title">バージョニングの動作例</div>
<pre style="font-size:12px;color:#1a1a2e;line-height:1.8">
操作              現在バージョン    保持されるバージョン
──────────────────────────────────────────
アップロード     v1（Current）      なし
上書き           v2（Current）      v1（Previous）自動保持
再上書き         v3（Current）      v1, v2（Previous）○
削除マーカー     Delete Marker      v1, v2, v3（全て保持）
</pre>
</div>
</div>`},

// ── Q51 ─────────────────────────────────────────────────────
{num:51,id:"q51",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Azure Storage アカウントのソフト削除について：

True か False か：
「ソフト削除が有効な場合、削除されたデータは指定した保持期間が終了すると完全に削除されます。」`,
choices:[{t:"True",c:true},{t:"False",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：True</div>
ソフト削除が有効な場合：<br>
・削除操作後 → データは「ソフト削除済み」状態で<strong>保持期間中は復元可能</strong><br>
・保持期間（1〜365 日）が終了後 → <strong>データは自動的に完全削除（ガベージコレクション）</strong><br><br>
したがって「保持期間が終了すると完全に削除される」は<strong>True</strong>です。
</div>
<div class="warn-box">
<div class="w-title">注意：「永続削除（Permanent Delete）」について</div>
Q41 で登場した<strong>永続削除を有効にする</strong>設定は、保持期間<strong>内</strong>でも完全削除を可能にするオプションです。これはデータ移動後のアクセス無効化シナリオで使用します。
</div>
</div>`},

// ── Q53 ─────────────────────────────────────────────────────
{num:53,id:"q53",domain:"ビジネス継続性設計",dc:"BC",color:"#107C10",
q:`【関連問題】Q52 と同じ要件（RTO 4 時間、手動フェールオーバー、異なるリージョン DR）。

True か False か：
「Always On 可用性グループの非同期コミットモードはこの要件を満たすことができます。」`,
choices:[{t:"True",c:true},{t:"False",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>

<div class="key-box">
<div class="k-title">正解：True</div>
<strong>非同期コミットモード</strong>は地理的に離れたリージョン間のレプリケーションに適しています。プライマリへのコミットはセカンダリの確認を待たないため、ネットワークレイテンシの影響が最小限です。RTO 4 時間の手動フェールオーバーに対応できます。
</div>

<thead><tr><th>コミットモード</th><th>リージョン間 DR</th><th>パフォーマンス影響</th><th>RPO</th></tr></thead>
<tbody>
<tr><td>同期コミット</td><td>高レイテンシで不推奨</td><td>高（ブロッキング）</td><td>ゼロ</td></tr>
<tr><td>非同期コミット</td><td>推奨</td><td>低（ノンブロッキング）</td><td>少量の損失可能性</td></tr>
</tbody></table></div>
</div>`},

// ── Q54 ─────────────────────────────────────────────────────
{num:54,id:"q54",domain:"ビジネス継続性設計",dc:"BC",color:"#107C10",
q:`【関連問題】Q52 と同じ要件（RTO 4 時間、手動フェールオーバー、異なるリージョン DR）。

True か False か：
「Always On 可用性グループの同期コミットモードはこの要件を満たすことができます。」`,
choices:[{t:"True",c:false},{t:"False",c:true}],
ci:[1],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>

<div class="key-box">
<div class="k-title">正解：False</div>
<strong>同期コミットモード</strong>はセカンダリがコミットを確認するまでプライマリがブロックされます。リージョン間の高いネットワークレイテンシ（通常数十〜数百 ms）があると、プライマリのトランザクションパフォーマンスに<strong>深刻な影響</strong>が出ます。
</div>
<div class="warn-box">
<div class="w-title">同期コミットの推奨環境</div>
同期コミットは<strong>同一データセンター内または往復レイテンシ &lt; 5ms の環境</strong>でのみ推奨されます。異なるリージョン間では非同期コミットを使用してください。
</div>
</div>`},

// ── Q55 ─────────────────────────────────────────────────────
{num:55,id:"q55",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`Azure Policy のイニシアチブ（ポリシーセット定義）を使用してポリシーを適用しています。

イニシアチブに追加するポリシー定義の最小数はいくつですか？`,
choices:[{t:"1",c:true},{t:"2",c:false},{t:"3",c:false},{t:"4",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：1</div>
Azure Policy のイニシアチブは<strong>1 つ以上</strong>のポリシー定義をグループ化したコレクションです。技術的には 1 つのポリシー定義だけでもイニシアチブを作成できます（実用的には複数定義をまとめるために使用します）。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th>構成要素</th><th>説明</th><th>最小数</th></tr></thead>
<tbody>
<tr><td>ポリシー定義</td><td>個別のルール（条件 + Effect）</td><td>1</td></tr>
<tr><td>イニシアチブ定義</td><td>複数ポリシーのグループ</td><td>最低 1 ポリシー定義を含む</td></tr>
<tr><td>ポリシー割り当て</td><td>定義をスコープに適用</td><td>1 割り当て per スコープ</td></tr>
</tbody></table></div>
</div>`},

// ── Q56 ─────────────────────────────────────────────────────
{num:56,id:"q56",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`Azure サブスクリプションに複数の仮想マシンがあります。ある仮想マシンに対するすべての RBAC ロール割り当てを確認したいと思います。

VM リソース単体の「アクセス制御 (IAM)」画面で表示されるロール割り当て数の最小値はいくつですか？`,
choices:[{t:"0",c:true},{t:"1",c:false},{t:"2",c:false},{t:"3",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：0</div>
RBAC ロール割り当ては<strong>0 から始まります</strong>。新しく作成した VM に明示的なロール割り当てがなければ、リソースレベルでのロール割り当ては 0 件になります。ただし、上位スコープ（リソースグループ・サブスクリプション）からのロールは継承されますが、VM 単体の IAM 画面には「継承されたロール」として表示されます。
</div>
<div class="warn-box">
<div class="w-title">RBAC スコープの継承に注意</div>
Azure RBAC はスコープ階層（管理グループ → サブスクリプション → リソースグループ → リソース）で継承されます。「このリソースに直接割り当てられているロール」は 0 件でも、上位スコープから継承されたロールが有効です。
</div>
</div>`},
