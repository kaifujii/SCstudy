  function escR(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
  function tagIcons(html){
    const sv=[];
    let s=html.replace(/<(svg|pre|code|a)[^>]*>[\s\S]*?<\/\1>/gi,m=>{sv.push(m);return'\x00S'+(sv.length-1)+'\x00';});
    const entries=Object.entries(ICONS).sort((a,b)=>b[0].length-a[0].length);
    const ph=[];
    for(const[name,icon]of entries){
      s=s.replace(new RegExp(escR(name),'g'),()=>{
        ph.push(`<span class="az-svc">${icon}${name}</span>`);
        return'\x00I'+(ph.length-1)+'\x00';
      });
    }
    s=s.replace(/\x00I(\d+)\x00/g,(_,i)=>ph[+i]);
    s=s.replace(/\x00S(\d+)\x00/g,(_,i)=>sv[+i]);
    return s;
  }
  QS.forEach(q=>{q.exp=tagIcons(q.exp);});
})();

// ============================================================
// App state & helpers
// ============================================================
const TOTAL = QS.length;
const LTR = 'ABCDEFGHIJ';
let state = {};
let multiSel = {};
let filter = 'all';
let displayChoices = {};
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function initState(){
  const chk=document.getElementById('chk-shuf');
  const doShuf=chk&&chk.checked;
  state={};multiSel={};displayChoices={};
  QS.forEach(q=>{
    state[q.id]={answered:false,correct:false};
    displayChoices[q.id]=doShuf?shuf([...q.choices]):[...q.choices];
  });
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function filtered(){ return filter==='all'?QS:QS.filter(q=>q.dc===filter); }

function renderAll(){
  const qs=filtered();
  document.getElementById('qwrap').innerHTML=qs.map((q,i)=>renderQ(q,i)).join('');
  qs.forEach(q=>{ if(state[q.id]?.answered) restoreQ(q); });
  updateProgress();
}

// ===== REVIEW SYSTEM =====
let reviewSet = new Set(JSON.parse(localStorage.getItem('az305_review_ids')||'[]'));

function toggleReview(qid, vol, num) {
  if(reviewSet.has(qid)) {
    reviewSet.delete(qid);
    const data = JSON.parse(localStorage.getItem('az305_review_data')||'{}');
    delete data[vol+'_'+qid];
    localStorage.setItem('az305_review_data', JSON.stringify(data));
  } else {
    reviewSet.add(qid);
    const q = QS.find(x=>x.id===qid);
    if(q) {
      const data = JSON.parse(localStorage.getItem('az305_review_data')||'{}');
      const volNum = vol.replace('vol','');
      data[vol+'_'+qid] = {
        vol: vol,
        volNum: volNum,
        id: qid,
        num: q.num,
        domain: q.domain,
        question_text: q.q,
        choices: q.choices,
        correct_indices: q.correct_indices || [],
        n_correct: q.n || 1,
        exp_html: q.exp || '',
        svg: q.svg || ''
      };
      localStorage.setItem('az305_review_data', JSON.stringify(data));
    }
  }
  localStorage.setItem('az305_review_ids', JSON.stringify([...reviewSet]));
  const btn = document.getElementById('rbtn_'+qid);
  if(btn) btn.classList.toggle('review-active', reviewSet.has(qid));
  if(window.updateReviewBadge) updateReviewBadge();
}
function renderQ(q){
  const multi=q.n>1;
  const mBadge=multi?`<span class="mbadge">複数選択 (${q.n}つ)</span>`:'';
  const mHint=multi?`<div class="multi-hint">${q.n}つ選択してください</div>`:'';
  const choices=(displayChoices[q.id]||q.choices).map((c,i)=>`
    <button class="cbtn" id="c_${q.id}_${i}" onclick="onChoice('${q.id}',${i})">
      <span class="cltr">${LTR[i]}</span>
      <span>${esc(c.t)}</span>
    </button>`).join('');
  const subBtn=multi?`<button class="sub-btn" id="sub_${q.id}" onclick="submitMulti('${q.id}')">回答を確定する</button>`:'';
  const arch5=q.svg?`<div class="arch-wrap arch-hidden" id="arch_${q.id}">${q.svg}<div class="arch-reveal-overlay"><span class="arch-reveal-hint">回答後にアーキテクチャ図が表示されます</span></div></div>`:'';
  return `<div class="qcard" id="card_${q.id}">
    <div class="qh">
      <span class="qnum">問 ${q.num}</span>
      <span class="dbadge" style="background:${q.color}">${q.domain}</span>
      ${mBadge}
      <button class="review-btn ${reviewSet.has(q.id)?'review-active':''}" id="rbtn_${q.id}" onclick="toggleReview('${q.id}','vol5',${q.num})" title="復習リストに追加">★</button>
    </div>
    <div class="qbody"><p class="qtext">${esc(q.q)}</p></div>
    ${arch5}
    ${mHint}
    <div class="choices">${choices}</div>
    ${subBtn}
    <div class="expanel" id="exp_${q.id}">
      <div id="rb_${q.id}"></div>
      ${q.exp}
    </div>
  </div>`;
}

function onChoice(qid,idx){
  if(state[qid]?.answered) return;
  const q=QS.find(x=>x.id===qid);
  if(q.n>1){
    if(!multiSel[qid]) multiSel[qid]=new Set();
    const btn=document.getElementById(`c_${qid}_${idx}`);
    if(multiSel[qid].has(idx)){
      multiSel[qid].delete(idx);
      btn.classList.remove('multi-sel');
    } else {
      if(multiSel[qid].size>=q.n) return;
      multiSel[qid].add(idx);
      btn.classList.add('multi-sel');
    }
    const sub=document.getElementById(`sub_${qid}`);
    if(sub) sub.style.display=multiSel[qid].size>=q.n?'block':'none';
  } else {
    const ok=(displayChoices[qid]||q.choices)[idx].c;
    state[qid]={answered:true,correct:ok};
    applyAnswer(q,[idx],ok);
  }
}

function submitMulti(qid){
  if(state[qid]?.answered) return;
  const q=QS.find(x=>x.id===qid);
  const sel=[...(multiSel[qid]||new Set())];
  const correctSet=new Set((displayChoices[qid]||q.choices).map((c,i)=>c.c?i:-1).filter(i=>i>=0));
  const ok=sel.length===correctSet.size&&sel.every(i=>correctSet.has(i));
  state[qid]={answered:true,correct:ok};
  applyAnswer(q,sel,ok);
}

function applyAnswer(q,selIdxs,ok){
  const selSet=new Set(selIdxs);
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);
    if(!btn) return;
    btn.disabled=true;
    btn.classList.remove('multi-sel');
    if(selSet.has(i)) btn.classList.add(c.c?'correct':'wrong');
    if(c.c&&!selSet.has(i)) btn.classList.add('reveal');
  });
  const card=document.getElementById(`card_${q.id}`);
  card.classList.add(ok?(q.n>1?'multi-ok':'ok'):'ng');
  const archEl5 = document.getElementById('arch_'+q.id);
  if(archEl5) archEl5.classList.add('arch-revealed');
  const rb=document.getElementById(`rb_${q.id}`);
  if(rb) rb.innerHTML=ok
    ?`<div class="rbadge ${q.n>1?'multi-ok':'ok'}">${q.n>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説を確認しましょう</div>';
  const exp=document.getElementById(`exp_${q.id}`);
  if(exp) exp.style.display='block';
  const sub=document.getElementById(`sub_${q.id}`);
  if(sub) sub.style.display='none';
  updateProgress();
}

function restoreQ(q){
  const s=state[q.id];
  if(!s?.answered) return;
  const correctSet=new Set((displayChoices[q.id]||q.choices).map((c,i)=>c.c?i:-1).filter(i=>i>=0));
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);
    if(!btn) return;
    btn.disabled=true;
    if(c.c) btn.classList.add(s.correct?'correct':'reveal');
  });
  const card=document.getElementById(`card_${q.id}`);
  card.classList.add(s.correct?(q.n>1?'multi-ok':'ok'):'ng');
  const exp=document.getElementById(`exp_${q.id}`);
  if(exp) exp.style.display='block';
  const rb=document.getElementById(`rb_${q.id}`);
  if(rb) rb.innerHTML=s.correct
    ?`<div class="rbadge ${q.n>1?'multi-ok':'ok'}">${q.n>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説を確認しましょう</div>';
}

function filterDomain(d){
  filter=d;
  document.querySelectorAll('.dbtn').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  renderAll();
}

function updateProgress(){
  const answered=Object.values(state).filter(s=>s.answered).length;
  const correct=Object.values(state).filter(s=>s.correct).length;
  const pct=answered>0?Math.round(correct/answered*100):0;
  document.getElementById('pb').style.width=(answered/TOTAL*100)+'%';
  document.getElementById('hdrScore').textContent=`${correct}/${TOTAL}`;
  document.getElementById('hdrPct').textContent=`正解率 ${answered>0?pct:0}%`;
}

function showResults(){
  const answered=Object.values(state).filter(s=>s.answered).length;
  const correct=Object.values(state).filter(s=>s.correct).length;
  const pct=Math.round(correct/TOTAL*100);
  const dstats={};
  QS.forEach(q=>{
    if(!dstats[q.domain]) dstats[q.domain]={t:0,c:0,col:q.color};
    dstats[q.domain].t++;
    if(state[q.id]?.correct) dstats[q.domain].c++;
  });
  document.getElementById('mscore').textContent=`${correct}/${TOTAL}`;
  document.getElementById('mpct').textContent=`正解率 ${pct}%`;
  const SVG_TROPHY='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 21 12 17 16 21"/><line x1="12" y1="17" x2="12" y2="11"/><path d="M18 6H6l1-4h10l1 4z"/><path d="M6 6c0 7 6 11 6 11s6-4 6-11"/></svg>';
  const SVG_UP='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>';
  const SVG_ZAP='<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
  const SVG_BOOK='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
  let icon=SVG_BOOK,msg='';
  if(pct>=80){icon=SVG_TROPHY;msg='合格圏内！本番でも自信を持って！';}
  else if(pct>=70){icon=SVG_UP;msg='あと一息！弱点ドメインを重点復習しよう。';}
  else if(pct>=50){icon=SVG_ZAP;msg='継続が大切。解説を熟読して繰り返し解こう。';}
  else{icon=SVG_BOOK;msg='基礎から丁寧に見直しましょう。';}
  document.getElementById('micon').innerHTML=icon;
  document.getElementById('mmsg').textContent=msg;
  document.getElementById('mdomains').innerHTML=Object.entries(dstats).map(([d,s])=>{
    const p=Math.round(s.c/s.t*100);
    return `<div class="m-ditem">
      <div class="m-dname">${d}</div>
      <div class="m-dval" style="color:${s.col}">${s.c}/${s.t} <span style="font-size:12px;color:#888">(${p}%)</span></div>
    </div>`;
  }).join('');
  document.getElementById('modal').classList.add('show');
}

function modalClose(e){
  if(!e||e.target.id==='modal') document.getElementById('modal').classList.remove('show');
}

function resetAll(){
  document.getElementById('modal').classList.remove('show');
  initState();
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

window.addEventListener('scroll',()=>{
  const btn=document.getElementById('st');
  btn.classList.toggle('show',window.scrollY>400);
});

initState();
renderAll();

// Highlight active vol nav link
(function(){
  const path = location.pathname;
  const m = path.match(/vol(\d)\.html/);
  if(m) {
    const el = document.getElementById('vj'+m[1]);
    if(el) el.classList.add('vj-active');
  }
  function updateReviewBadge(){
    const ids = JSON.parse(localStorage.getItem('az305_review_ids')||'[]');
    const badge = document.getElementById('vj-review-count');
    if(badge) badge.textContent = ids.length > 0 ? ids.length : '';
  }
  updateReviewBadge();
  window.updateReviewBadge = updateReviewBadge;
})();
</script>
