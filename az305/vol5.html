{num:1,id:"q1",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`Azure VM で多層アプリ「App1」を 2 つのリージョンにまたがる 4 つの可用性ゾーンにデプロイする計画です。

デプロイに必要な仮想ネットワーク (VNet) の最小数はいくつですか？`,
choices:[{t:"1",c:false},{t:"2",c:true},{t:"3",c:false},{t:"4",c:false}],
ci:[1],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="arch-box">
<div class="arch-title">アーキテクチャ概念図</div>
<svg viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:500px">
  <rect width="500" height="160" fill="#F0F6FF" rx="10"/>
  <!-- Region 1 -->
  <rect x="30" y="20" width="200" height="120" rx="8" fill="none" stroke="#0072C6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="130" y="14" text-anchor="middle" font-size="11" fill="#0072C6" font-weight="bold">East Japan (リージョン1)</text>
  <rect x="50" y="35" width="75" height="45" rx="6" fill="#BDD7EE"/>
  <text x="87" y="56" text-anchor="middle" font-size="10" fill="#1a1a2e">AZ-1</text>
  <text x="87" y="70" text-anchor="middle" font-size="9" fill="#1a1a2e">VM群</text>
  <rect x="140" y="35" width="75" height="45" rx="6" fill="#BDD7EE"/>
  <text x="177" y="56" text-anchor="middle" font-size="10" fill="#1a1a2e">AZ-2</text>
  <text x="177" y="70" text-anchor="middle" font-size="9" fill="#1a1a2e">VM群</text>
  <rect x="50" y="95" width="165" height="30" rx="5" fill="#0072C6" opacity=".15"/>
  <text x="132" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#0072C6">VNet 1</text>
  <!-- Arrow -->
  <line x1="243" y1="80" x2="267" y2="80" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="255" y="74" text-anchor="middle" font-size="9" fill="#888">VNet</text>
  <text x="255" y="85" text-anchor="middle" font-size="9" fill="#888">Peering</text>
  <!-- Region 2 -->
  <rect x="270" y="20" width="200" height="120" rx="8" fill="none" stroke="#107C10" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="370" y="14" text-anchor="middle" font-size="11" fill="#107C10" font-weight="bold">West Japan (リージョン2)</text>
  <rect x="290" y="35" width="75" height="45" rx="6" fill="#C8EDC8"/>
  <text x="327" y="56" text-anchor="middle" font-size="10" fill="#1a1a2e">AZ-3</text>
  <text x="327" y="70" text-anchor="middle" font-size="9" fill="#1a1a2e">VM群</text>
  <rect x="380" y="35" width="75" height="45" rx="6" fill="#C8EDC8"/>
  <text x="417" y="56" text-anchor="middle" font-size="10" fill="#1a1a2e">AZ-4</text>
  <text x="417" y="70" text-anchor="middle" font-size="9" fill="#1a1a2e">VM群</text>
  <rect x="290" y="95" width="165" height="30" rx="5" fill="#107C10" opacity=".15"/>
  <text x="372" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#107C10">VNet 2</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#888"/></marker></defs>
</svg>
</div>
<div class="key-box">
<div class="k-title">正解：2</div>
Azure VNet は<strong>リージョンスコープのリソース</strong>です。1 つの VNet は 1 つのリージョン内にしか存在できません。<br><br>
「2 リージョン × 各 2 AZ = 計 4 AZ」という構成では、リージョンごとに VNet が 1 つ必要となるため、最低 <strong>2 つの VNet</strong> が必要です。<br><br>
可用性ゾーン (AZ) は同一リージョン内の物理的な分離であり、同じ VNet 内のサブネットで対応できるため、VNet 数は増えません。
</div>
<div class="warn-box">
<div class="w-title">よくある誤解</div>
「4 つの AZ → 4 つの VNet が必要」と思いがちですが誤りです。AZ はネットワーク分離ではなくデータセンターの物理分離です。リージョンをまたぐ通信には VNet ピアリングまたは VPN Gateway を使用します。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th>リソース</th><th>スコープ</th><th>今回の必要数</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>VNet</strong></td><td>リージョン</td><td>2（リージョン数分）</td></tr>
<tr><td>サブネット</td><td>VNet 内</td><td>AZ 数に応じて分割可能</td></tr>
<tr><td>可用性ゾーン</td><td>リージョン内</td><td>VNet 数に影響しない</td></tr>
</tbody></table></div>
</div>
<div class="refs"><div class="refs-title">参考ドキュメント</div><ul>
<li><a href="https://learn.microsoft.com/azure/virtual-network/virtual-networks-overview" target="_blank">Azure 仮想ネットワークの概要</a></li>
<li><a href="https://learn.microsoft.com/azure/availability-zones/az-overview" target="_blank">可用性ゾーンの概要</a></li>
</ul></div>`},

{num:2,id:"q2",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`Azure VM で多層アプリ「App1」をホストします。ピーク使用時間は平日の朝夕 2 時間のみです。

ci:[1],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="arch-box">
<div class="arch-title">⚡ B シリーズの CPU クレジット動作</div>
<svg viewBox="0 0 480 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:480px">
  <rect width="480" height="140" fill="#F0F6FF" rx="10"/>
  <!-- Timeline axis -->
  <line x1="40" y1="100" x2="450" y2="100" stroke="#888" stroke-width="1.5"/>

  <text x="210" y="118" font-size="10" fill="#888">9:00</text>
  <text x="300" y="118" font-size="10" fill="#888">16:00</text>
  <text x="390" y="118" font-size="10" fill="#888">17:00</text>
  <!-- Credit accumulation bar -->
  <rect x="40" y="60" width="100" height="30" fill="#4CAF50" rx="3" opacity=".7"/>
  <text x="90" y="80" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">クレジット蓄積</text>
  <!-- Peak bar -->
  <rect x="145" y="30" width="60" height="60" fill="#E53935" rx="3" opacity=".8"/>
  <text x="175" y="55" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">ピーク</text>
  <text x="175" y="68" text-anchor="middle" font-size="9" fill="#fff">消費</text>
  <!-- Accumulate again -->
  <rect x="215" y="55" width="90" height="35" fill="#4CAF50" rx="3" opacity=".7"/>
  <text x="260" y="77" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">再び蓄積</text>
  <!-- Peak 2 -->
  <rect x="310" y="30" width="60" height="60" fill="#E53935" rx="3" opacity=".8"/>
  <text x="340" y="55" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">ピーク</text>
  <text x="340" y="68" text-anchor="middle" font-size="9" fill="#fff">消費</text>
  <!-- Accumulate -->
  <rect x="375" y="65" width="70" height="25" fill="#4CAF50" rx="3" opacity=".7"/>
  <text x="410" y="82" text-anchor="middle" font-size="9" fill="#fff">蓄積</text>

</svg>
</div>
<div class="key-box">
<div class="k-title">正解：B シリーズ（バースト可能 VM）</div>
B シリーズは<strong>CPU クレジット方式</strong>を採用しており、使用率が低いときにクレジットを蓄積し、ピーク時に消費してバーストパフォーマンスを発揮します。「朝夕のみピーク、それ以外は低負荷」という App1 の特性に最適です。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">VM シリーズ</th><th>CPU クレジット</th><th>主な用途</th><th>本問の判定</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>B シリーズ</strong></td><td>蓄積・消費</td><td>バースト可能、断続的ワークロード</td><td><span class="badge-ok">正解</span></td></tr>
<tr><td>A シリーズ</td><td>なし</td><td>開発・テスト用エントリーモデル</td><td><span class="badge-ng">❌</span></td></tr>
<tr><td>D シリーズ</td><td>なし</td><td>汎用・高コンピュート</td><td><span class="badge-ng">❌</span></td></tr>
<tr><td>M シリーズ</td><td>なし</td><td>大規模インメモリワークロード</td><td><span class="badge-ng">❌</span></td></tr>
</tbody></table></div>
</div>
<div class="refs"><div class="refs-title">参考ドキュメント</div><ul>

</ul></div>`},

{num:3,id:"q3",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`オンプレミスの SQL Server データベース「SQL1」を Azure に移行します。

choices:[{t:"Azure SQL Database (Business Critical 層)",c:true},{t:"Azure SQL Managed Instance (Business Critical 層)",c:false},{t:"Azure SQL Database (Hyperscale 層)",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="arch-box">
<div class="arch-title">Azure SQL Database Business Critical – レプリカ構成</div>
<svg viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:480px">

</div>

{num:6,id:"q6",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Q5 と同じシナリオです。Azure Data Explorer でペタバイト規模のデータをクエリする際に使用すべきクエリ言語はどれですか？`,
choices:[{t:"KQL（Kusto Query Language）",c:true},{t:"Transact-SQL（T-SQL）",c:false},{t:"U-SQL",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：KQL（Kusto Query Language）</div>
KQL は Azure Data Explorer のネイティブクエリ言語です。パイプライン（<code>|</code>）ベースの読みやすい構文で、大規模データの集計・フィルタリング・可視化を高速に行えます。
</div>
<div class="arch-box">
<div class="arch-title">📝 KQL クエリ例</div>
<pre style="font-size:12px;color:#1a1a2e;line-height:1.7;overflow-x:auto">
LogData
| where TimeGenerated &gt; ago(1h)
| where Level == "Error"
| summarize Count = count() by Service
| order by Count desc
| take 10
</pre>
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">クエリ言語</th><th>主なサービス</th><th>用途</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>KQL</strong></td><td>Azure Data Explorer、Azure Monitor、Microsoft Sentinel</td><td>大規模データ探索・分析</td></tr>
<tr><td>T-SQL</td><td>SQL Server、Azure SQL Database、Synapse 専用プール</td><td>リレーショナル DB クエリ</td></tr>
<tr><td>U-SQL</td><td>Azure Data Lake Analytics（廃止予定）</td><td>バッチ ETL 処理</td></tr>
</tbody></table></div>
</div>
<div class="refs"><div class="refs-title">参考ドキュメント</div><ul>
<li><a href="https://learn.microsoft.com/azure/data-explorer/kusto/query/" target="_blank">KQL クエリ言語リファレンス</a></li>
</ul></div>`},

{num:10,id:"q10",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`Q9 と同じシナリオです。「受信ログを変換し、処理済みデータを Log Analytics テーブルに保存する」ために使用すべきクエリ言語はどれですか？`,
choices:[{t:"KQL クエリ（データ収集ルール内の変換）",c:true},{t:"WQL（Windows Query Language）",c:false},{t:"XPath クエリ",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：KQL クエリ（DCR 内の変換）</div>
データ収集ルール (DCR) 内では KQL を使用してデータを変換します。具体的には <code>transformKql</code> プロパティに KQL 式を記述し、受信した JSON データを加工してカスタムテーブルに格納します。
</div>
<div class="arch-box">
<div class="arch-title">📝 DCR 変換 KQL の例</div>
<pre style="font-size:12px;color:#1a1a2e;line-height:1.7;overflow-x:auto">
source
| extend TimeGenerated = todatetime(RawData.timestamp)
| project TimeGenerated,
          Level = tostring(RawData.level),
          Message = tostring(RawData.message),
          Computer = tostring(RawData.host)
</pre>
</div>
<div class="tbl-wrap">

<tr><td>WQL</td><td>Windows WMI クエリ</td><td>❌</td></tr>
<tr><td>XPath</td><td>XML ドキュメント、Windows イベントフィルタリング</td><td>❌（構造変換には使えない）</td></tr>
</tbody></table></div>
</div>`},

{num:11,id:"q11",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Azure Storage アカウントへのアクセス制御を設計しています。

外部コンサルタントに対して機密 BLOB コンテナーへの一時的なアクセス権を付与する必要があります。アクセスは「特定の BLOB タグ（例：Department=HR）を持つデータのみ」に制限する必要があります。

どのアクセス制御モデルを使用すべきですか？`,
choices:[{t:"ABAC（属性ベースアクセス制御）— BLOB インデックスタグによる条件付き RBAC",c:true},{t:"RBAC（ロールベースアクセス制御）— ストレージ BLOB データ閲覧者ロールの割り当て",c:false},{t:"SAS（共有アクセス署名）— 時間制限付きアクセス",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="arch-box">
<div class="arch-title">ABAC — BLOB タグベースアクセス制御の仕組み</div>

{num:12,id:"q12",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`組織は毎日大量のログファイルを Azure Storage に保存します。ログファイルは月に 1 度しかアクセスされず、3 年間保持する必要があります。コストを最小限に抑えながら要件を満たすストレージサービスはどれですか？`,
choices:[{t:"Blobs（クール/アーカイブ層＋ライフサイクル管理）",c:true},{t:"Files（Azure ファイル共有）",c:false},{t:"Tables（NoSQL キーバリュー）",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="arch-box">
<div class="arch-title">Blob ライフサイクル管理によるコスト最適化</div>
<svg viewBox="0 0 480 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:480px">
  <rect width="480" height="130" fill="#F0F6FF" rx="10"/>
  <!-- Hot -->
  <rect x="15" y="25" width="100" height="80" rx="7" fill="#E53935" opacity=".8"/>
  <text x="65" y="50" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Hot 層</text>
  <text x="65" y="65" text-anchor="middle" font-size="9" fill="#fff">高アクセス頻度</text>
  <text x="65" y="80" text-anchor="middle" font-size="9" fill="#fdd">コスト高</text>
  <text x="65" y="95" text-anchor="middle" font-size="9" fill="#fdd">即時アクセス</text>
  <!-- Arrow -->
  <line x1="118" y1="65" x2="145" y2="65" stroke="#555" stroke-width="1.5" marker-end="url(#a12)"/>
  <text x="131" y="57" font-size="8" fill="#555">30日後</text>
  <!-- Cool -->
  <rect x="148" y="25" width="100" height="80" rx="7" fill="#FB8C00" opacity=".8"/>
  <text x="198" y="50" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Cool 層</text>
  <text x="198" y="65" text-anchor="middle" font-size="9" fill="#fff">低頻度アクセス</text>
  <text x="198" y="80" text-anchor="middle" font-size="9" fill="#fdd">コスト中</text>
  <text x="198" y="95" text-anchor="middle" font-size="9" fill="#fdd">即時アクセス</text>
  <!-- Arrow -->
  <line x1="251" y1="65" x2="278" y2="65" stroke="#555" stroke-width="1.5" marker-end="url(#a12)"/>
  <text x="264" y="57" font-size="8" fill="#555">90日後</text>
  <!-- Cold -->
  <rect x="281" y="25" width="100" height="80" rx="7" fill="#1976D2" opacity=".8"/>
  <text x="331" y="50" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Cold 層</text>
  <text x="331" y="65" text-anchor="middle" font-size="9" fill="#fff">まれなアクセス</text>
  <text x="331" y="80" text-anchor="middle" font-size="9" fill="#ddf">コスト低</text>
  <text x="331" y="95" text-anchor="middle" font-size="9" fill="#ddf">即時アクセス</text>
  <!-- Arrow -->
  <line x1="384" y1="65" x2="411" y2="65" stroke="#555" stroke-width="1.5" marker-end="url(#a12)"/>
  <text x="397" y="57" font-size="8" fill="#555">1年後</text>
  <!-- Archive -->
  <rect x="414" y="25" width="60" height="80" rx="7" fill="#512DA8" opacity=".85"/>
  <text x="444" y="50" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Archive</text>
  <text x="444" y="65" text-anchor="middle" font-size="8" fill="#fff">長期保存</text>
  <text x="444" y="80" text-anchor="middle" font-size="8" fill="#ddf">最低コスト</text>
  <text x="444" y="95" text-anchor="middle" font-size="8" fill="#ddf">復元に数時間</text>
  <text x="240" y="15" text-anchor="middle" font-size="10" fill="#0072C6" font-weight="bold">ライフサイクル管理による自動層移行</text>
  <defs><marker id="a12" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker></defs>
</svg>
</div>
<div class="key-box">
<div class="k-title">正解：Blobs</div>
Azure Blob Storage は<strong>ライフサイクル管理ポリシー</strong>により、データを自動的に Hot → Cool → Cold → Archive 層へ移行できます。月 1 度のアクセスであれば Cool/Cold 層、保持中はアーカイブが最適です。
</div>
<div class="warn-box">
<div class="w-title">Files と Tables は不適</div>
Azure Files は SMB/NFS ファイル共有用でアーカイブ層がなく、コスト最適化に不向きです。Tables は NoSQL データストアであり、ログファイル保存用途ではありません。
</div>
</div>`},

// ── Q16 ─────────────────────────────────────────────────────
{num:16,id:"q16",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`Azure API Management (APIM) でパートナー向けの外部 API を公開しています。API は Azure App Service バックエンドに接続されています。

「最も一般的な Web 攻撃からの保護」として推奨されるポリシー機能はどれですか？`,
choices:[{t:"OWASP Top 10 脅威からの保護ポリシー",c:true},{t:"JWT トークンの検証ポリシー",c:false},{t:"IP アドレスフィルタリングポリシー",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：OWASP Top 10 脅威からの保護ポリシー</div>
Azure APIM には OWASP Top 10 の脅威（SQL インジェクション、XSS、CSRF など）からリクエストを保護する組み込みポリシーがあります。WAF（Web Application Firewall）機能として動作します。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">ポリシー</th><th>保護対象</th><th>Web 攻撃保護</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>OWASP Top 10 保護</strong></td><td>SQL インジェクション、XSS、CSRF など</td><td>✅</td></tr>
<tr><td>JWT 検証</td><td>認証トークンの有効性確認</td><td>❌（認証用）</td></tr>
<tr><td>IP フィルタリング</td><td>特定 IP の許可/拒否</td><td>❌（アクセス制御用）</td></tr>
</tbody></table></div>
</div>`},

// ── Q17 ─────────────────────────────────────────────────────
{num:17,id:"q17",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`Q16 と同じ APIM シナリオです。「API のレート制限」として推奨されるポリシー機能はどれですか？`,
choices:[{t:"JWT トークンによる認証後にレート制限する（validate-jwt + rate-limit-by-key）",c:false},{t:"キーによるレート制限（rate-limit-by-key）",c:true},{t:"サブスクリプションごとのクォータ制限（quota）",c:false}],
ci:[1],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：キーによるレート制限（rate-limit-by-key）</div>
<code>rate-limit-by-key</code> ポリシーはサブスクリプションキー・IP アドレス・ユーザー ID など任意のキーに基づいて API 呼び出しレートを制限します。「単位時間あたりの呼び出し数」を制御するリアルタイムのスロットリングです。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">ポリシー</th><th>機能</th><th>キー指定</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>rate-limit-by-key</strong></td><td>単位時間あたりの呼び出し数制限</td><td>任意のキー</td></tr>
<tr><td>rate-limit</td><td>サブスクリプション全体の呼び出し数制限</td><td>サブスクリプション固定</td></tr>
<tr><td>quota</td><td>長期間での合計呼び出し数/帯域制限</td><td>長期クォータ</td></tr>
</tbody></table></div>
<div class="warn-box">
<div class="w-title">rate-limit と quota の違い</div>
<code>rate-limit</code> は短期間（秒・分）のスロットリング、<code>quota</code> は長期間（週・月）の上限設定です。パートナー向け API の過負荷防止には <code>rate-limit-by-key</code> が最適です。
</div>
</div>`},

// ── Q18 ─────────────────────────────────────────────────────
{num:18,id:"q18",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`Azure Policy を使用して、指定された Azure リージョン外へのリソースデプロイを防止する必要があります。

ポリシーの効果（effect）として何を使用すべきですか？`,
choices:[{t:"DeployIfNotExists（自動修復デプロイ）",c:false},{t:"Deny（拒否）",c:true},{t:"Audit（監査のみ）",c:false}],
ci:[1],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="arch-box">
<div class="arch-title">Azure Policy Effect の動作フロー</div>
<svg viewBox="0 0 480 140" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:480px">

  <line x1="118" y1="70" x2="148" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#a18)"/>

  <text x="220" y="55" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Azure Policy 評価</text>
  <text x="220" y="70" text-anchor="middle" font-size="9" fill="#ddd">条件: location NOT IN</text>
  <text x="220" y="83" text-anchor="middle" font-size="9" fill="#ddd">['japaneast','japanwest']</text>
  <text x="220" y="100" text-anchor="middle" font-size="10" fill="#FFE57F" font-weight="bold">Effect: Deny 🚫</text>
  <!-- Arrows -->
  <line x1="293" y1="55" x2="323" y2="45" stroke="#E53935" stroke-width="2" marker-end="url(#a18)"/>
  <line x1="293" y1="85" x2="323" y2="95" stroke="#107C10" stroke-width="2" marker-end="url(#a18)"/>

  <rect x="325" y="25" width="140" height="35" rx="6" fill="#E53935"/>

  <text x="395" y="56" text-anchor="middle" font-size="9" fill="#fdd">403 エラー返却</text>

<div class="key-box">

</ul></div>`},

// ── Q19 ─────────────────────────────────────────────────────
{num:19,id:"q19",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`Azure リソースへのアクセスを管理しています。ユーザーに必要な最小限の権限のみを付与する「最小権限の原則」を実施する必要があります。

最小権限の原則を実施するために何を変更すべきですか？`,
choices:[{t:"必要な権限のみを持つ RBAC ロールを割り当てる",c:true},{t:"すべてのリソースにリソースロックを適用する",c:false},{t:"条件付きアクセスポリシーを構成する",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：必要な権限のみを持つ RBAC ロールを割り当てる</div>
最小権限の原則は<strong>RBAC（ロールベースアクセス制御）</strong>を通じて実装します。組み込みロール（Owner → Contributor → Reader → カスタムロール）から必要最小限の権限のみを持つロールを選択し、適切なスコープ（リソースグループ・リソースレベル）で割り当てます。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">オプション</th><th>目的</th><th>最小権限の実現</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>RBAC ロール割り当て</strong></td><td>権限管理（誰が何をできるか）</td><td>直接的に実現</td></tr>
<tr><td>リソースロック</td><td>削除・変更の保護（ReadOnly/Delete）</td><td>権限管理ではない</td></tr>
<tr><td>条件付きアクセス</td><td>サインイン条件の制御（MFA、場所など）</td><td>認証条件の制御</td></tr>
</tbody></table></div>
<div class="warn-box">
<div class="w-title">よくある誤解</div>
条件付きアクセスは「誰がサインインできるか」を制御しますが、「サインイン後に何ができるか」の権限は RBAC で制御します。リソースロックは既存リソースの保護であり、アクセス権限の管理とは別の機能です。
</div>
</div>`},

{num:20,id:"q20",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Azure Storage アカウントを作成しています。このストレージアカウントは可用性ゾーン障害に対して耐性を持つ必要があります。コストを最小限に抑える必要もあります。

choices:[{t:"ゾーン冗長ストレージ (ZRS)",c:true},{t:"ローカル冗長ストレージ (LRS)",c:false},{t:"geo 冗長ストレージ (GRS)",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">

</div>`},

{num:30,id:"q30",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`Q29 と同じシナリオです。WebApp1 から DB1 のプライベートエンドポイント IP アドレスへの名前解決（DNS）を設定する必要があります。

choices:[{t:"Azure プライベート DNS ゾーン",c:true},{t:"パブリック DNS ゾーン",c:false},{t:"Azure DNS プライベートリゾルバー",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：Azure プライベート DNS ゾーン</div>
プライベートエンドポイントを使用する場合、データベースの FQDN（例：<code>sql1.database.windows.net</code>）がプライベート IP アドレスに解決されるよう<strong>プライベート DNS ゾーン</strong>（例：<code>privatelink.database.windows.net</code>）を VNet にリンクする必要があります。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">DNS オプション</th><th>機能</th><th>プライベートEP の名前解決</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>プライベート DNS ゾーン</strong></td><td>VNet 内の名前解決</td><td>プライベート IP に解決</td></tr>
<tr><td>パブリック DNS ゾーン</td><td>インターネットからの名前解決</td><td>パブリック IP を返す</td></tr>
<tr><td>Azure DNS プライベートリゾルバー</td><td>オンプレミス ↔ Azure DNS クエリ転送</td><td>△ 追加設定が必要</td></tr>
</tbody></table></div>
</div>`},

// ── Q31 ─────────────────────────────────────────────────────
{num:31,id:"q31",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`【関連問題】Azure VM 上の Web サービスが API を公開しています。VM1・VM2 は Subnet1（VNet1）にあります。APIM が「外部 VNet モード」で ProdSubnet に統合されています。

True か False か：
「API はパートナーにインターネット経由でアクセス可能です。」`,
choices:[{t:"True",c:true},{t:"False",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：True</div>
APIM が<strong>外部 VNet モード</strong>で統合されている場合、APIM はパブリック IP アドレスを持ち、インターネットからアクセス可能な状態になります。したがって、パートナーはインターネット経由で API にアクセスできます。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">APIM VNet モード</th><th>パブリックアクセス</th><th>VNet バックエンドアクセス</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>外部モード</strong></td><td>インターネット可</td><td>VNet 内に到達可</td></tr>
<tr><td>内部モード</td><td>VNet 内のみ</td><td>✅</td></tr>
<tr><td>非統合</td><td>✅</td><td>VNet 内に到達不可</td></tr>
</tbody></table></div>
</div>`},

// ── Q32 ─────────────────────────────────────────────────────
{num:32,id:"q32",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`【関連問題】Q31 と同じ構成です（APIM が外部 VNet モードで VNet1 の ProdSubnet に統合、VM1 は同じ VNet1 の Subnet1 に配置）。

True か False か：
「APIM インスタンスは VM1 からリアルタイムデータにアクセスできます。」`,
choices:[{t:"True",c:true},{t:"False",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：True</div>
APIM（ProdSubnet）と VM1（Subnet1）は<strong>同じ VNet1 内</strong>にあります。同一 VNet 内であれば VNet ピアリング等なしに直接通信可能です。外部 VNet モードの APIM は VNet 内バックエンドにプライベート IP でアクセスできます。
</div>
<div class="arch-box">
<div class="arch-title">通信フロー</div>
<pre style="font-size:12px;line-height:1.8;color:#1a1a2e">
インターネット → APIM (ProdSubnet, パブリック IP) → VM1 (Subnet1, プライベート IP)
               ↑ 外部モード: パブリックアクセス可    ↑ 同一 VNet: プライベート通信可
</pre>
</div>
</div>`},

// ── Q33 ─────────────────────────────────────────────────────
{num:33,id:"q33",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`【関連問題】Q31・Q32 と同じ構成です（APIM が外部 VNet モード）。

choices:[{t:"True",c:false},{t:"False",c:true}],
ci:[1],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：False</div>
APIM が外部 VNet モードで統合されている場合、API はすでにパブリックインターネットからアクセス可能です。パートナーが API を利用するために<strong>VPN ゲートウェイは不要</strong>です。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th>VPN ゲートウェイが必要なケース</th><th>本シナリオ</th></tr></thead>
<tbody>
<tr><td>オンプレミス ↔ Azure VNet のサイト間接続</td><td>不要（パブリック API アクセス）</td></tr>
<tr><td>Azure VNet ↔ VNet 間の接続</td><td>不要</td></tr>
<tr><td>リモートユーザーのポイント対サイト接続</td><td>不要</td></tr>
</tbody></table></div>
</div>`},

// ── Q34 ─────────────────────────────────────────────────────
{num:34,id:"q34",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Azure Blob Storage の不変ストレージを設計しています。規制要件により BLOB は一定期間変更・削除できないようにする必要があります。

ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>

</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">機能</th><th>自動バージョン保持</th><th>用途</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>BLOB バージョニング</strong></td><td>上書き時に自動保存</td><td>バージョン管理・復元</td></tr>
<tr><td>BLOB スナップショット</td><td>手動作成が必要</td><td>特定時点のコピー</td></tr>
<tr><td>ソフト削除</td><td>❌（削除保護のみ）</td><td>誤削除からの保護</td></tr>
<tr><td>変更フィード</td><td>❌（変更履歴記録のみ）</td><td>監査・イベント処理</td></tr>
</tbody></table></div>
</div>`},

{num:36,id:"q36",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`Azure Policy を使用してリソースのコンプライアンスを管理しています。

診断設定が構成されていないリソースに対して、自動的に診断設定を追加するために、どのポリシー効果（effect）を使用すべきですか？`,
choices:[{t:"DeployIfNotExists（自動デプロイ・修復）",c:true},{t:"Deny（拒否）",c:false},{t:"Audit（監査のみ）",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：DeployIfNotExists</div>
<code>DeployIfNotExists</code> は指定された条件が満たされていない場合に、ARM テンプレートを使用してリソースを<strong>自動的にデプロイ・設定</strong>します。「診断設定がないリソースに自動で診断設定を追加する」という要件に最適です。修復タスクを手動または自動でトリガーできます。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">Effect</th><th>動作</th><th>自動修復</th><th>「診断設定追加」に適切か</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>DeployIfNotExists</strong></td><td>条件不満足時にリソースを自動デプロイ</td><td>✅</td><td>正解</td></tr>
<tr><td>Deny</td><td>非準拠リソースの作成を拒否</td><td>❌</td><td>❌（既存リソースには効果なし）</td></tr>
<tr><td>Audit</td><td>非準拠をログ記録のみ</td><td>❌</td><td>❌（修復しない）</td></tr>
</tbody></table></div>
</div>
<div class="refs"><div class="refs-title">参考ドキュメント</div><ul>
<li><a href="https://learn.microsoft.com/azure/governance/policy/concepts/effect-deploy-if-not-exists" target="_blank">DeployIfNotExists の詳細</a></li>
</ul></div>`},

// ── Q38 ─────────────────────────────────────────────────────
{num:38,id:"q38",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`大量のトランザクションを処理するアプリのデータベースを設計しています。

要件：
・高い IOPS が必要
・ビジネスクリティカルなワークロード
・読み取りスケールアウトが必要

どのオプションを使用すべきですか？`,
choices:[{t:"vCore ベースの Azure SQL Database（Business Critical 層）",c:true},{t:"DTU ベースの Azure SQL Database（Standard 層）",c:false},{t:"Azure SQL Managed Instance（General Purpose 層）",c:false},{t:"Azure Database for MySQL",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：vCore ベースの Azure SQL Database（Business Critical 層）</div>
vCore モデルの Business Critical 層は SSD ベースの高 IOPS ストレージ、組み込みの読み取り可能なセカンダリレプリカ（読み取りスケールアウト）、最高可用性を提供します。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">オプション</th><th>IOPS</th><th>読み取りスケールアウト</th><th>ビジネスクリティカル向け</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>vCore SQL DB (Business Critical)</strong></td><td>高 (SSD)</td><td>セカンダリレプリカ</td><td>✅</td></tr>
<tr><td>DTU SQL DB (Standard)</td><td>限定的</td><td>❌</td><td>❌</td></tr>
<tr><td>SQL MI (General Purpose)</td><td>△ 中程度</td><td>❌</td><td>△</td></tr>
<tr><td>Azure DB for MySQL</td><td>△</td><td>読み取りレプリカ</td><td>SQL Server 非互換</td></tr>
</tbody></table></div>
</div>`},

// ── Q39 ─────────────────────────────────────────────────────
{num:39,id:"q39",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`Azure SQL Database の診断ログを 7 年間保存する規制要件があります。コストを最小化しながら要件を満たすには何を設定すべきですか？`,
choices:[{t:"データベースに長期リテンションポリシー（LTR）を構成する",c:true},{t:"Log Analytics ワークスペースに診断ログを送信する",c:false},{t:"Azure Storage アカウントに診断ログを送信する（診断設定）",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：長期リテンションポリシー（LTR）を構成する</div>
Azure SQL Database の LTR（Long-Term Retention）を使用すると、<strong>週次・月次・年次のバックアップを最大 10 年間</strong> Azure Blob Storage に自動保持できます。7 年間の要件を満たす最適な方法です。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">オプション</th><th>最大保存期間</th><th>7年要件</th><th>コスト</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>LTR（長期リテンション）</strong></td><td>最大 10 年</td><td>✅</td><td>低（RA-GRS Blob）</td></tr>
<tr><td>Log Analytics</td><td>最大 2 年</td><td>不足</td><td>中</td></tr>
<tr><td>Storage（診断設定）</td><td>最大 365 日</td><td>不足</td><td>低</td></tr>
</tbody></table></div>
</div>`},

// ── Q40 ─────────────────────────────────────────────────────
{num:40,id:"q40",domain:"ID・ガバナンス・監視",dc:"ID",color:"#7719AA",
q:`オンプレミスの Active Directory ドメイン「corp.ironclad.com」が Azure AD と同期しています。

Azure でホストされているアプリが、オンプレミスユーザーを NTLM または Kerberos 認証で認証できるようにする必要があります。

どのソリューションを使用すべきですか？`,
choices:[{t:"Azure VM に corp.ironclad.com のドメインコントローラーをデプロイする",c:true},{t:"Microsoft Entra Domain Services を構成する",c:false},{t:"AD FS を Azure VM にデプロイする",c:false}],
ci:[0],n:1,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：Azure VM にドメインコントローラーをデプロイする</div>
<strong>NTLM/Kerberos 認証</strong>には Windows Server Active Directory Domain Services が必要です。Azure VM 上に既存ドメイン（corp.ironclad.com）の DC をデプロイし、オンプレミス AD と同期することで、既存ユーザーが Kerberos/NTLM で認証できるようになります。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">オプション</th><th>NTLM/Kerberos</th><th>既存 AD との統合</th><th>マネージド</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>Azure VM DC (corp.ironclad.com)</strong></td><td>✅</td><td>同一ドメイン</td><td>自己管理</td></tr>
<tr><td>Entra Domain Services</td><td>✅</td><td>△ ワンウェイ同期</td><td>マネージド</td></tr>
<tr><td>AD FS</td><td>フェデレーション認証</td><td>✅</td><td>❌</td></tr>
</tbody></table></div>
<div class="warn-box">
<div class="w-title">Entra Domain Services では不十分な理由</div>
Entra Domain Services は Entra ID からの<strong>ワンウェイ同期</strong>のみで、既存オンプレミス AD との完全な双方向信頼関係を確立できません。corp.ironclad.com ドメインとの完全な統合には Azure VM DC が必要です。
</div>
</div>`},

// ── Q41 ─────────────────────────────────────────────────────
{num:41,id:"q41",domain:"データストレージ設計",dc:"DS",color:"#0072C6",
q:`Azure Storage アカウントのガバナンスとセキュリティを設計しています。

以下の 2 つの要件を満たすために有効化すべき設定を 2 つ選択してください：
・リテンションポリシーを Azure サブスクリプション全体で一貫して適用すること
・データが不正な場所にコピーされた場合にアクセスを無効化または削除できること`,
choices:[
  {t:"Azure Backup による操作バックアップを有効にする",c:true},
  {t:"コンテナーのポイントインタイムリストアを有効にする",c:false},
  {t:"BLOB のソフト削除を有効にする",c:false},
  {t:"コンテナーのソフト削除を有効にする",c:false},
  {t:"ソフト削除済みアイテムの永続削除（Permanent Delete）を有効にする",c:true},
  {t:"BLOB のバージョニングを有効にする",c:false}
],
ci:[0,4],n:2,
exp:`<div class="exp-section">
<div class="exp-title">解説</div>
<div class="key-box">
<div class="k-title">正解：① Azure Backup 操作バックアップ + ② 永続削除を有効にする</div>
<strong>① Azure Backup の操作バックアップ：</strong>バックアップポリシーを使用してサブスクリプション全体で一貫したリテンションポリシーを Azure Policy として適用できます。<br><br>
<strong>② ソフト削除済みアイテムの永続削除（Permanent Delete）：</strong>ソフト削除状態のデータを保持期間内に完全削除する機能です。不正な場所に移動されたデータを確実に削除するための要件を満たします。
</div>
<div class="tbl-wrap">
<table class="ctbl">
<thead><tr><th class="hl">設定</th><th>サブスク横断ポリシー</th><th>データ完全削除</th></tr></thead>
<tbody>
<tr class="hl"><td><strong>Azure Backup 操作バックアップ</strong></td><td>Azure Policy で適用可</td><td>—</td></tr>
<tr class="hl"><td><strong>永続削除（Permanent Delete）</strong></td><td>—</td><td>ソフト削除中でも削除可</td></tr>
<tr><td>ポイントインタイムリストア</td><td>❌</td><td>❌（復元機能）</td></tr>
<tr><td>BLOB/コンテナーのソフト削除</td><td>アカウント単位</td><td>❌（復元保護）</td></tr>
<tr><td>BLOB バージョニング</td><td>❌</td><td>❌（バージョン管理）</td></tr>
</tbody></table></div>
</div>`},

// ── Q42 ─────────────────────────────────────────────────────
{num:42,id:"q42",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`Azure Synapse Analytics でデータパイプラインを管理しています。外部データソース（Azure Data Lake Storage、Azure Blob Storage など）に安全にアクセスする必要があります。

データソースへのアクセスに最も推奨されるアーキテクチャはどれですか？`,
choices:[{t:"Synapse Analytics 専用のマネージド仮想ネットワーク（Managed VNet）を有効にする",c:true},{t:"パブリックエンドポイントを使用する",c:false},{t:"個別の VPN ゲートウェイを使用する",c:false}],

Synapse の Managed Virtual Network を有効にすると、すべての統合ランタイムが分離された専用 VNet 内で実行されます。マネージドプライベートエンドポイントを使用してデータソースにプライベート接続でき、<strong>データエクスフィルトレーション（データ持ち出し）保護</strong>も提供されます。

<div class="tbl-wrap">
<table class="ctbl">

<tbody>
<tr class="hl"><td><strong>Managed VNet</strong></td><td>マネージド PE</td><td>✅</td><td>ベストプラクティス</td></tr>
<tr><td>パブリックエンドポイント</td><td>❌</td><td>❌</td><td>❌</td></tr>
<tr><td>VPN ゲートウェイ</td><td>✅</td><td>△</td><td>管理オーバーヘッド高</td></tr>
</tbody></table></div>
</div>`},

// ── Q43 ─────────────────────────────────────────────────────
{num:43,id:"q43",domain:"インフラストラクチャ設計",dc:"IS",color:"#C50F1F",
q:`Azure Synapse Analytics ワークスペースから機密データソースに安全にアクセスするための接続方法として最も推奨されるものはどれですか？`,

q:`Azure サブスクリプション内の複数の Azure リソースに対してポリシーを適用する必要があります。リソースがポリシーに準拠していない場合、自動的に修復する必要があります。

// ============================================================
// App state & helpers
// ============================================================
const TOTAL = QS.length;
const LTR = 'ABCDEFGHIJ';
let state = {};
let multiSel = {};
let filter = 'all';
let displayChoices = {};
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function initState(){
  const chk=document.getElementById('chk-shuf');
  const doShuf=chk&&chk.checked;
  state={};multiSel={};displayChoices={};
  QS.forEach(q=>{
    state[q.id]={answered:false,correct:false};
    displayChoices[q.id]=doShuf?shuf([...q.choices]):[...q.choices];
  });
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function filtered(){ return filter==='all'?QS:QS.filter(q=>q.dc===filter); }

function renderAll(){
  const qs=filtered();
  document.getElementById('qwrap').innerHTML=qs.map((q,i)=>renderQ(q,i)).join('');
  qs.forEach(q=>{ if(state[q.id]?.answered) restoreQ(q); });
  updateProgress();
}

function renderQ(q){
  const multi=q.n>1;
  const mBadge=multi?`<span class="mbadge">複数選択 (${q.n}つ)</span>`:'';
  const mHint=multi?`<div class="multi-hint">⚡ ${q.n}つ選択してください</div>`:'';
  const choices=(displayChoices[q.id]||q.choices).map((c,i)=>`
    <button class="cbtn" id="c_${q.id}_${i}" onclick="onChoice('${q.id}',${i})">
      <span class="cltr">${LTR[i]}</span>
      <span>${esc(c.t)}</span>
    </button>`).join('');
  const subBtn=multi?`<button class="sub-btn" id="sub_${q.id}" onclick="submitMulti('${q.id}')">回答を確定する</button>`:'';
  return `<div class="qcard" id="card_${q.id}">
    <div class="qh">
      <span class="qnum">問 ${q.num}</span>
      <span class="dbadge" style="background:${q.color}">${q.domain}</span>
      ${mBadge}
    </div>
    <div class="qbody"><p class="qtext">${esc(q.q)}</p></div>
    ${mHint}
    <div class="choices">${choices}</div>
    ${subBtn}
    <div class="expanel" id="exp_${q.id}">
      <div id="rb_${q.id}"></div>
      ${q.exp}
    </div>
  </div>`;
}

function onChoice(qid,idx){
  if(state[qid]?.answered) return;
  const q=QS.find(x=>x.id===qid);
  if(q.n>1){
    if(!multiSel[qid]) multiSel[qid]=new Set();
    const btn=document.getElementById(`c_${qid}_${idx}`);
    if(multiSel[qid].has(idx)){
      multiSel[qid].delete(idx);
      btn.classList.remove('multi-sel');
    } else {
      if(multiSel[qid].size>=q.n) return;
      multiSel[qid].add(idx);
      btn.classList.add('multi-sel');
    }
    const sub=document.getElementById(`sub_${qid}`);
    if(sub) sub.style.display=multiSel[qid].size>=q.n?'block':'none';
  } else {
    const ok=(displayChoices[qid]||q.choices)[idx].c;
    state[qid]={answered:true,correct:ok};
    applyAnswer(q,[idx],ok);
  }
}

function submitMulti(qid){
  if(state[qid]?.answered) return;
  const q=QS.find(x=>x.id===qid);
  const sel=[...(multiSel[qid]||new Set())];
  const correctSet=new Set((displayChoices[qid]||q.choices).map((c,i)=>c.c?i:-1).filter(i=>i>=0));
  const ok=sel.length===correctSet.size&&sel.every(i=>correctSet.has(i));
  state[qid]={answered:true,correct:ok};
  applyAnswer(q,sel,ok);
}

function applyAnswer(q,selIdxs,ok){
  const selSet=new Set(selIdxs);
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);
    if(!btn) return;
    btn.disabled=true;
    btn.classList.remove('multi-sel');
    if(selSet.has(i)) btn.classList.add(c.c?'correct':'wrong');
    if(c.c&&!selSet.has(i)) btn.classList.add('reveal');
  });
  const card=document.getElementById(`card_${q.id}`);
  card.classList.add(ok?(q.n>1?'multi-ok':'ok'):'ng');
  const rb=document.getElementById(`rb_${q.id}`);
  if(rb) rb.innerHTML=ok
    ?`<div class="rbadge ${q.n>1?'multi-ok':'ok'}">${q.n>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説を確認しましょう</div>';
  const exp=document.getElementById(`exp_${q.id}`);
  if(exp) exp.style.display='block';
  const sub=document.getElementById(`sub_${q.id}`);
  if(sub) sub.style.display='none';
  updateProgress();
}

function restoreQ(q){
  const s=state[q.id];
  if(!s?.answered) return;
  const correctSet=new Set((displayChoices[q.id]||q.choices).map((c,i)=>c.c?i:-1).filter(i=>i>=0));
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);
    if(!btn) return;
    btn.disabled=true;
    if(c.c) btn.classList.add(s.correct?'correct':'reveal');
  });
  const card=document.getElementById(`card_${q.id}`);
  card.classList.add(s.correct?(q.n>1?'multi-ok':'ok'):'ng');
  const exp=document.getElementById(`exp_${q.id}`);
  if(exp) exp.style.display='block';
  const rb=document.getElementById(`rb_${q.id}`);
  if(rb) rb.innerHTML=s.correct
    ?`<div class="rbadge ${q.n>1?'multi-ok':'ok'}">${q.n>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説を確認しましょう</div>';
}

function filterDomain(d){
  filter=d;
  document.querySelectorAll('.dbtn').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  renderAll();
}

function updateProgress(){
  const answered=Object.values(state).filter(s=>s.answered).length;
  const correct=Object.values(state).filter(s=>s.correct).length;
  const pct=answered>0?Math.round(correct/answered*100):0;
  document.getElementById('pb').style.width=(answered/TOTAL*100)+'%';
  document.getElementById('hdrScore').textContent=`${correct}/${TOTAL}`;
  document.getElementById('hdrPct').textContent=`正解率 ${answered>0?pct:0}%`;
}

function showResults(){
  const answered=Object.values(state).filter(s=>s.answered).length;
  const correct=Object.values(state).filter(s=>s.correct).length;
  const pct=Math.round(correct/TOTAL*100);
  const dstats={};
  QS.forEach(q=>{
    if(!dstats[q.domain]) dstats[q.domain]={t:0,c:0,col:q.color};
    dstats[q.domain].t++;
    if(state[q.id]?.correct) dstats[q.domain].c++;
  });
  document.getElementById('mscore').textContent=`${correct}/${TOTAL}`;
  document.getElementById('mpct').textContent=`正解率 ${pct}%`;
  const SVG_TROPHY='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 21 12 17 16 21"/><line x1="12" y1="17" x2="12" y2="11"/><path d="M18 6H6l1-4h10l1 4z"/><path d="M6 6c0 7 6 11 6 11s6-4 6-11"/></svg>';
  const SVG_UP='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>';
  const SVG_ZAP='<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
  const SVG_BOOK='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
  let icon=SVG_BOOK,msg='';
  if(pct>=80){icon=SVG_TROPHY;msg='合格圏内！本番でも自信を持って！';}
  else if(pct>=70){icon=SVG_UP;msg='あと一息！弱点ドメインを重点復習しよう。';}
  else if(pct>=50){icon=SVG_ZAP;msg='継続が大切。解説を熟読して繰り返し解こう。';}
  else{icon=SVG_BOOK;msg='基礎から丁寧に見直しましょう。';}
  document.getElementById('micon').innerHTML=icon;
  document.getElementById('mmsg').textContent=msg;
  document.getElementById('mdomains').innerHTML=Object.entries(dstats).map(([d,s])=>{
    const p=Math.round(s.c/s.t*100);
    return `<div class="m-ditem">
      <div class="m-dname">${d}</div>
      <div class="m-dval" style="color:${s.col}">${s.c}/${s.t} <span style="font-size:12px;color:#888">(${p}%)</span></div>
    </div>`;
  }).join('');
  document.getElementById('modal').classList.add('show');
}

function modalClose(e){
  if(!e||e.target.id==='modal') document.getElementById('modal').classList.remove('show');
}

function resetAll(){
  document.getElementById('modal').classList.remove('show');
  initState();
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

window.addEventListener('scroll',()=>{
  const btn=document.getElementById('st');
  btn.classList.toggle('show',window.scrollY>400);
});

initState();
renderAll();
</script>
</body>
</html>
