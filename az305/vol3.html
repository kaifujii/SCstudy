bel\">なぜ正解なのか</div><div class=\"exp-block-body\">Q31 と同じシナリオで、別のソリューション案（IP フロー検証）。\n\n<strong>IP フロー検証（IP Flow Verify）</strong>は「このパケットが NSG ルールによって許可されるか拒否されるか」を<strong>シミュレーション</strong>するツールです。実際の通信のブロックはしません。\n\n「トラフィックをブロックする」という要件に対しては <strong>No が正解</strong>です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Yes を選んだ場合：</strong> IP フロー検証が「実際に通信をブロックする」と誤解している。これは診断ツールであり、NSG ルールの確認専用</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">IP フロー検証（IP Flow Verify）と NSG の違い：\n\n• <strong>IP フロー検証</strong>：「このトラフィックは通過する？」を診断するシミュレーター\n• <strong>NSG</strong>：実際にトラフィックを許可・拒否するルール\n\n「検証ツール ≠ 実行ツール」という概念を理解する。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">IP フロー検証は NSG ルールの動作を<strong>シミュレーション</strong>するだけ。実際のブロックは NSG ルール自体が行う。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/network-watcher/ip-flow-verify-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/network-watcher/ip-flow-verify-overview</a></li></ul></div>\n</div>"}, {"num": 33, "id": "q33", "domain": "インフラストラクチャ設計", "domain_code": "IS", "domain_color": "#C50F1F", "question_text": "注意：この問題は同じシナリオを使用する一連の問題の一部です。シリーズの各問題は要件を満たす場合と満たさない場合のある異なるソリューションを提示します。\n\n組織はオンプレミスと Azure の両方で仮想マシン (VM) を実行しています。Azure ExpressRoute はオンプレミス環境と Azure の間の接続を提供するために構成されています。\n\nいくつかの仮想マシンでネットワーク接続の問題が発生しています。\n\nパケットが VM に対して許可または拒否されているかを確認するためにネットワーク トラフィックを検査する必要があります。\n\n提案されたソリューション：Azure Network Watcher から Azure Traffic Analytics を使用する。\n\nこのソリューションは要件を満たしていますか？", "choices": [{"text": "Yes（はい）", "is_correct": false}, {"text": "No（いいえ）", "is_correct": true}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class -sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">Azure Firewall ポリシーのカスタム ルール変換</text><rect x=\"20\" y=\"38\" width=\"300\" height=\"25\" rx=\"6\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"1.5\"/><text x=\"170\" y=\"54\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">US-Central-Firewall-policy (Central US)</text><rect x=\"20\" y=\"68\" width=\"300\" height=\"25\" rx=\"6\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"1.5\"/><text x=\"170\" y=\"84\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">US-East-Firewall-policy (East US)</text><rect x=\"20\" y=\"98\" width=\"300\" height=\"25\" rx=\"6\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"1.5\"/><text x=\"170\" y=\"114\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">EU-Firewall-policy (West Europe)</text><rect x=\"20\" y=\"128\" width=\"300\" height=\"25\" rx=\"6\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"1.5\"/><text x=\"170\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Q35: 変換できるポリシー数 = 3</text><rect x=\"380\" y=\"35\" width=\"290\" height=\"130\" rx=\"8\" fill=\"#E8F5E9\" strok 計する必要があります。\n\n推奨に含めるべきコンポーネントはどれですか？", "choices": [{"text": "Microsoft Entra アプリケーション プロキシ コネクターをインストールした Windows Server を実行するサーバー", "is_correct": true}, {"text": "オンプレミス データ ゲートウェイをインストールした Windows Server を実行するサーバー", "is_correct": false}, {"text": "Web アプリケーション プロキシ (WAP) ロール サービスをインストールした Windows Server を実行するサーバー", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"55\" width=\"120\" height=\"75\" rx=\"8\" fill=\"#FFF8E1\" stroke=\"#E67700\" stroke-width=\"2\"/><text x=\"80\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#E67700\">外部ユーザー</text><text x=\"80\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">インターネット経由</text><text x=\"80\" y=\"112\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">AD DS 認証アプリ</text><rect x=\"210\" y=\"35\" width=\"155\" height=\"115\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"287\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">App Proxy コネクタ</text><text x=\"287\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Windows Server 上</text><text x=\"287\" y=\"112\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">オンプレミスに設置</text><rect x=\"220\" y=\"75\" width=\"135\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"287\" y=\"88\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">コネクタ = 橋渡し役</text><rect x=\"220\" y=\"100\" width=\"135\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"287\" y=\"113\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Entra ID ↔ AD DS 仲介</text><rect x=\"220\" y=\"125\" width=\"135\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"287\" y=\"138\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ファイアウォール変更不要</text><rect x=\"440\" y=\"55\" width=\"150\" height=\"75\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"515\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">Server1</text><text x=\"515\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">AD DS 認証</text><text x=\"515\" y=\"112\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">App1 ホスト</text><rect x=\"440\" y=\"145\" width=\"150\" height=\"35\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"515\" y=\"154\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">オンプレデータゲートウェイ</text><text x=\"515\" y=\"168\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Power BI 等向け</text><text x=\"515\" y=\"182\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">App Proxy代替不可</text><line x1=\"140\" y1=\"92\" x2=\"208\" y2=\"92\" stroke=\"#E67700\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"365\" y1=\"92\" x2=\"438\" y2=\"92\" stroke=\"#107C10\" stroke-width=\"2\" marker-end=\"url(#ag)\"/><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">App Proxy: 外部→Entra ID認証→コネクタ→オンプレAD DS認証。VPN不要でオンプレアプリ公開</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「オンプレミスの App1（AD DS 認証依存）をインターネット経由で Azure AD ユーザーに公開し、MFA を適用する」。\n\n<strong>Entra アプリケーション プロキシ コネクター（Windows Server）</strong>：オンプレミスにコネクターをインストールし、App1 をインターネット経由で安全に公開します。Entra ID 認証と AD DS 認証を橋渡し（Kerberos 制約付き委任）し、MFA・条件付きアクセスの適用が可能です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>オンプレミス データ ゲートウェイ（Windows Server）：</strong> Power BI・Power Apps・Logic Apps などが Entra 外のオンプレミス データに接続するためのゲートウェイ。Web アプリの公開には使わない\n<strong>Web Application Proxy（WAP）ロール サービス：</strong> AD FS と連携してアプリを公開する機能。Entra ID との直接統合が難しく、構成も複雑。クラウドファーストの現代では App Proxy が推奨</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">アプリケーション プロキシ vs WAP：\n\n• <strong>Entra App Proxy</strong>：Entra ID（クラウド）ベースで設定がシンプル。AD FS 不要\n• <strong>Web Application Proxy（WAP）</strong>：AD FS に依存。オンプレミス中心の旧来の構成\n\nクラウドファーストの現代では App Proxy が推奨される方法です。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>Entra ID 統合</th><th>AD FS 依存</th><th>MFA 対応</th><th>設定の複雑さ</th></tr></thead><tbody><tr><td class=\"cc\">Entra App Proxy コネクター <span class=\"tbl-ok\">○</span></td><td>ネイティブ</td><td>不要</td><td><span class=\"tbl-ok\">○</span></td><td>低</td></tr><tr><td class=\"cc\">Web Application Proxy（WAP）</td><td><span class=\"tbl-part\">△</span>（AD FS 経由）</td><td>依存</td><td><span class=\"tbl-ok\">○</span>（AD FS で設定）</td><td>高</td></tr><tr><td class=\"cc\">オンプレミス データ ゲートウェイ</td><td><span class=\"tbl-part\">△</span></td><td><span class=\"tbl-ng\">×</span></td><td><span class=\"tbl-ng\">×</span></td><td>中（用途違い）</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">オンプレミス Web アプリ → Entra ID 認証 + MFA = <strong>Entra アプリケーション プロキシ コネクター</strong>。WAP は AD FS 依存で旧来の方法。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/active-directory/app-proxy/application-proxy\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/active-directory/app-proxy/application-proxy</a></li></ul></div>\n</div>"}, {"num": 43, "id": "q43", "domain": "インフラストラクチャ設計", "domain_code": "IS", "domain_color": "#C50F1F", "question_text": "【ApexCore Ltd. ケース スタディに基づく問題】\n\nApexCore Ltd. のケース スタディでは以下が定義されています：\n・App1 は複数の Azure リージョンにデプロイされ、インターネット経由でアクセスされます\n・App1 の接続要件を満たすために Azure Traffic Manager と Azure Application Gateway を組み合わせた使用を評価しています\n\nApp1 の接続要件（リージョン間トラフィック分散と Web Application Firewall 機能）を考慮して、以下の各サービスに必要な最小インスタンス数を決定してください：\n\n・Azure Traffic Manager の最小インスタンス数\n・Azure Application Gateway の最小インスタンス数", "choices": [{"text": "Traffic Manager: 6、Application Gateway: 3", "is_correct": false}, {"text": "Traffic Manager: 2、Application Gateway: 1", "is_correct": false}, {"text": "Traffic Manager: 3、Application Gateway: 6", "is_correct": false}, {"text": "Traffic Manager: 1、Application Gateway: 3", "is_correct": true}, {"text": "Traffic Manager: 2、Application Gateway: 3", "is_correct": false}, {"text": "Traffic Manager: 1、Application Gateway: 2", "is_correct": false}], "correct_indices": [3], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">ApexCore: Traffic Manager マルチリージョン（Q43）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon " y=\"73\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">エンタイトルメント管理</text><rect x=\"250\" y=\"85\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#D1C4E9\"/><text x=\"332\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">アクセス レビュー (Q45) ✅</text><rect x=\"250\" y=\"110\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#D1C4E9\"/><text x=\"332\" y=\"123\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">PIM（特権管理）</text><rect x=\"250\" y=\"135\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#D1C4E9\"/><text x=\"332\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">ライフサイクル ワークフロー</text><rect x=\"500\" y=\"40\" width=\"170\" height=\"100\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"585\" y=\"82\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Identity Protection</text><text x=\"585\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">異常サインイン検知</text><text x=\"585\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ガバナンス管理ではない</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Identity Governance = アクセス管理全体。レビュー = 定期確認で不要権限削除</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">ApexCore シナリオ：「Fabrikam のアカウント マネージャーが毎月、App1 へのアクセスを持つ Fabrikam ユーザーを確認し、不要なアカウントをゲストから削除する」。\n\n<strong>アクセス レビュー</strong>：既存のアクセス権を定期的（月次など）に確認する仕組みです。レビュアー（マネージャー）へのメール通知、応答なし時の自動削除オプション（自動適用）があり、ゲスト ユーザーのアクセス棚卸しに最適。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>アクセス パッケージ（エンタイトルメント管理）：</strong> アクセス権の「申請・付与・期限切れ」を管理するもの。「既存アクセスを定期確認して削除する」用途には別機能のアクセス レビューが必要\n<strong>承認：</strong> エンタイトルメント管理の一部（申請時の承認プロセス）。定期的な棚卸しには使えない\n<strong><img src=\"data:image/svg+xml;base64,PHN2ZyBpZD0iYjE1NjVlOTctZTUzYS00NGE1LTk0NzktMTk5ZDhjM2M0MmQyIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMj exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">ApexCore シナリオ：「App1 がサードパーティの認証情報なしに Key Vault にアクセスする。App1 と Key Vault の<strong>ライフサイクルが紐付いている</strong>（App1 が削除されたら不要になる）」。\n\n<strong>システム割り当てマネージド ID</strong>：App1 のリソース（App Service）に紐付けた Entra ID マネージド ID です。App1 が削除されると自動的に ID も削除され（ライフサイクルが一致）、資格情報管理が不要です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>証明書（Certificate）：</strong> 有効期限の管理・更新作業が必要。「認証情報不要」の要件に反する\n<strong>ユーザー割り当てマネージド ID：</strong> 独立した ID リソースとして作成され、複数リソースから共有可能。ただし App1 を削除しても ID は残る（ライフサイクルが別）。App1 専用の場合はシステム割り当ての方が適切</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">システム割り当て vs ユーザー割り当てマネージド ID の選択基準：\n\n• <strong>システム割り当て</strong>：特定リソース専用、ライフサイクルが一致、1 リソース : 1 ID\n• <strong>ユーザー割り当て</strong>：複数リソース間で共有可能、ライフサイクルが独立、1 ID : 多リソース\n\n「そのリソース専用で一緒に削除してほしい」→ システム割り当て。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">マネージド ID 種別</th><th>ライフサイクル</th><th>共有</th><th>適した場面</th></tr></thead><tbody><tr><td class=\"cc\">システム割り当て <span class=\"tbl-ok\">○</span></td><td>リソースと一致（リソース削除で自動削除）</td><td>1 リソース専用</td><td>単一リソース専用</td></tr><tr><td class=\"cc\">ユーザー割り当て</td><td>独立（手動削除が必要）</td><td>複数リソースで共有</td><td>複数リソース間での共有</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「App とライフサイクルが一致する ID」= <strong>システム割り当てマネージド ID</strong>。App 削除時に自動削除される。共有したい場合 → ユーザー割り当て。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/active-directory/managed-identities-azure-resources/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/active-directory/managed-identities-azure-resources/overview</a></li></ul></div>\n</div>"}, {"num": 47, "id": "q47", "domain": "ID・ガバナンス・監視", "domain_code": "ID", "domain_color": "#7719AA", "question_text": "【ApexCore Ltd. ケース スタディに基づく問題】\n\nApexCore Ltd. のケース スタディでは以下のセキュリティ要件が定義されています：\n・App1 はサードパーティの認証情報とアクセス文字列を安全に取得する必要があります\n・認証情報とアクセス文字列は Azure Key Vault に格納されています\n\nApp1 が Key Vault からシークレットを取得するための承認に使用すべきものはどれですか？", "choices": [{"text": "アクセス ポリシー", "is_correct": true}, {"text": "接続済みサービス", "is_correct": false}, {"text": "プライベート リンク", "is_correct": false}, {"text": "ロール割り当て", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">App Service + Managed Identity + Key Vault（Q46-47）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"156\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"162\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<image href=\"data:image/svg+xml;base64,PHN2ZyBpZD0iYjcwYWNmMGEtMzRiNC00YmRmLTkwMjQtNzQ5NjA0M2ZmOTE1IiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxOCIgaGVpZ2h0PSIxOCIgdmlld0JveD0iMCAwIDE4IDE4Ij48ZGVmcz48cmFkaWFsR3JhZGllbnQgaWQ9ImUyY2Y4NzQ2LWM5YTgtNGVlZS04NmMyLTQ5NTE5ODNjNjAzMiIgY3g9IjEzNDI4LjgxIiBjeT0iMzUxOC44NiIgcj0iNTYuNjciIGdyYWRpZW50VHJhbnNmb3JtPSJ0cmFuc2xhdGUoLTIwMDUuMzMgLTUxOC44Mykgc2NhbGUoMC4xN  モデルなので RBAC ではなくアクセス ポリシーが正解</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Key Vault のアクセス制御には 2 つのモデルがあります：\n\n• <strong>アクセス ポリシー（従来）</strong>：Key Vault 固有の IAM。Get/List/Set などを個別に設定\n• <strong>Azure RBAC（新しいモデル）</strong>：標準の Azure RBAC ロール（Key Vault Secrets User など）を使用\n\n問題文やシナリオで「どちらのモデルか」を確認することが重要です。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">モデル</th><th>設定場所</th><th>粒度</th><th>推奨</th></tr></thead><tbody><tr><td class=\"cc\">アクセス ポリシー（従来）<span class=\"tbl-ok\">○</span></td><td>Key Vault のアクセス ポリシー画面</td><td>操作レベル（Get/List/Set）</td><td>既存 KV</td></tr><tr><td class=\"cc\">Azure RBAC（新）</td><td>Key Vault の IAM（ロール割り当て）</td><td>ロールレベル（Secrets User 等）</td><td>新規 KV 推奨</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Key Vault アクセス ポリシー モデルでのアクセス付与 = <strong>アクセス ポリシー</strong>。RBAC モデルのときはロール割り当てを使う。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/key-vault/general/security-features\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/key-vault/general/security-features</a></li></ul></div>\n</div>"}, {"num": 48, "id": "q48", "domain": "インフラストラクチャ設計", "domain_code": "IS", "domain_color": "#C50F1F", "question_text": "【ApexCore Ltd. ケース スタディに基づく問題】\n\nApexCore Ltd. のケース スタディでは App1 について以下が定義されています：\n・Python ベースの Web アプリケーションで Linux ランタイムで実行される\n・複数の Azure リージョンにデプロイされる\n・App1 は 6 つのインスタンスを持つ：米国東部 (East US) リージョンに 3 つ、西ヨーロッパ (West Europe) リージョンに 3 つ\n・すべての機能、接続性、セキュリティ、可用性、リージョン トラフィック ルーティング要件を満たすこと\n・全体的なコストを最小化すること\n\nApp1 に推奨すべき App Service アーキテクチャはどれですか？", "choices": [{"text": "リージョンごとに 1 つの App Service Environment (ASE)", "is_correct": false}, {"text": "可用性ゾーンごとに 1 つ \"10\" font-weight=\"700\" fill=\"#107C10\">デプロイ スロット (Q49)</text><text x=\"340\" y=\"146\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">ステージング→本番スワップ</text><text x=\"340\" y=\"160\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">ダウンタイムなし</text><rect x=\"510\" y=\"20\" width=\"170\" height=\"70\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"595\" y=\"47\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">ASE (App Service Env)</text><text x=\"595\" y=\"61\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">隔離 VNet 環境向け</text><text x=\"595\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">今回の要件超過</text><rect x=\"510\" y=\"105\" width=\"170\" height=\"70\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"595\" y=\"132\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">CI/CD ソース</text><text x=\"595\" y=\"146\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">デプロイ自動化のみ</text><text x=\"595\" y=\"160\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">テスト検証機能なし</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">プランはリージョン単位でAZを有効化。スロットで本番前テスト→スワップのサイクルが標準</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">ApexCore シナリオ：「本番環境への影響なく新バージョンをテストし、承認後にスワップで本番に昇格させたい」。\n\n<strong>デプロイ スロット（Deployment Slots）</strong>：App Service のステージング・本番環境を別々のスロットとして管理します。コードを staging スロットに先にデプロイして動作確認し、問題なければ「スワップ」操作一つで本番に昇格（ダウンタイムなし）。ロールバックも再度スワップで簡単にできます。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>CI/CD ソース：</strong> GitHub Actions などの継続的デプロイ設定。デプロイ先のステージング管理はスロットが担う\n<strong><img src=\"data:image/svg+xml;base64,PHN2ZyBpZD0iYjcwYWNmMGEtMzRiNC00YmRmLTkwMjQtNzQ5NjA0M2ZmOTE1IiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoP lass=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">デプロイ スロットのよく使われるパターン：\n\n• <strong>production</strong> スロット：本番トラフィックが流れる\n• <strong>staging</strong> スロット：テスト・確認用\n• スワップで一瞬で入れ替え（ダウンタイムなし）\n• ロールバックも再スワップで即座に戻せる\n\nBlue/Green デプロイの実現にも使われます。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「本番影響なし + テスト + スワップで昇格」= <strong>デプロイ スロット</strong>。ダウンタイムなしの Blue/Green デプロイが実現できる。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/app-service/deploy-staging-slots\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/app-service/deploy-staging-slots</a></li></ul></div>\n</div>"}, {"num": 50, "id": "q50", "domain": "インフラストラクチャ設計", "domain_code": "IS", "domain_color": "#C50F1F", "question_text": "【ApexCore Ltd. ケース スタディに基づく問題】\n\nApexCore Ltd. のケース スタディでは App1 について以下が定義されています：\n\n・App1 はスケジュールベースで定期的にメンテナンス タスクを実行する必要がある\n・タスクは集中管理された場所から PowerShell スクリプトを実行して、すべての App1 インスタンス間でファイル コピー操作を行う\n・毎時間実行される\n・ソリューションはコストを最小化すること\n\nApp1 のメンテナンス タスクをサポートするために推奨に含めるべきものはどれですか？", "choices": [{"text": "Azure 仮想マシン", "is_correct": false}, {"text": "Azure Function アプリ", "is_correct": true}, {"text": "Azure Logic アプリ", "is_correct": false}, {"text": "Azure App Service WebJob", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0, function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function initState(){
  const chk=document.getElementById('chk-shuf');
  const doShuf=chk&&chk.checked;
  state={};multiSel={};displayChoices={};
  QUESTIONS.forEach(q=>{
    state[q.id]={answered:false,correct:false};
    displayChoices[q.id]=doShuf?shuf([...q.choices]):[...q.choices];
  });
}
function filtered(){return filter==='all'?QUESTIONS:QUESTIONS.filter(q=>q.domain===filter);}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){
  const qs=filtered();
  document.getElementById('qwrap').innerHTML=qs.map(q=>renderQ(q)).join('');
  qs.forEach(q=>{if(state[q.id]?.answered)restoreQ(q);});
  updateProgress();
}
// ===== REVIEW SYSTEM =====
let reviewSet = new Set(Object.keys(JSON.parse(localStorage.getItem('az305_review_data')||'{}')).filter(k=>k.startsWith('vol3_')).map(k=>k.slice(5)));

function toggleReview(qid, vol, num) {
  if(reviewSet.has(qid)) {
    reviewSet.delete(qid);
    const data = JSON.parse(localStorage.getItem('az305_review_data')||'{}');
    delete data[vol+'_'+qid];
    localStorage.setItem('az305_review_data', JSON.stringify(data));
  } else {
    reviewSet.add(qid);
    const q = QUESTIONS.find(x=>x.id===qid);
    if(q) {
      const data = JSON.parse(localStorage.getItem('az305_review_data')||'{}');
      const volNum = vol.replace('vol','');
      data[vol+'_'+qid] = {
        vol: vol,
        volNum: volNum,
        id: qid,
        num: q.num,
        domain: q.domain,
        question_text: q.question_text,
        choices: q.choices,
        correct_indices: q.correct_indices,
        n_correct: q.n_correct || q.n || 1,
        exp_html: q.exp_html || '',
        svg: q.svg || ''
      };
      localStorage.setItem('az305_review_data', JSON.stringify(data));
    }
  }
  localStorage.setItem('az305_review_ids', JSON.stringify(Object.keys(JSON.parse(localStorage.getItem('az305_review_data')||'{}'))));  // sync badge count
  const btn = document.getElementById('rbtn_'+qid);
  if(btn) btn.classList.toggle('review-active', reviewSet.has(qid));
  if(window.updateReviewBadge) updateReviewBadge();
}
function renderQ(q){
  const isMulti=q.n_correct>1;
  const mbadge=isMulti?`<span class="mbadge">複数選択 (${q.n_correct}つ)</span>`:'';
  const mhint=isMulti?`<div class="multi-hint">⚡ ${q.n_correct}つの選択肢を選んでください</div>`:'';
  const choices=(displayChoices[q.id]||q.choices).map((c,i)=>`<button class="cbtn" id="c_${q.id}_${i}" onclick="onChoice('${q.id}',${i})"><span class="cltr">${LTR[i]}</span><span>${escH(c.text)}</span></button>`).join('');
  const sub=isMulti?`<button class="submit-btn" id="sub_${q.id}" onclick="submitMulti('${q.id}')">回答を確定する</button>`:'';
  const arch3=q.svg?`<div class="arch-wrap arch-hidden" id="arch_${q.id}">${q.svg}<div class="arch-reveal-overlay"><span class="arch-reveal-hint">回答後にアーキテクチャ図が表示されます</span></div></div>`:'';
  return `<div class="qcard" id="card_${q.id}"><div class="qh"><span class="qnum">問 ${q.num}</span><span class="dbadge" style="background:${q.domain_color||'#0072C6'}">${q.domain}</span>${mbadge}<button class="review-btn ${reviewSet.has(q.id)?'review-active':''}" id="rbtn_${q.id}" onclick="toggleReview('${q.id}','vol3',${q.num})" title="復習リストに追加">★</button></div><div class="qbody"><p class="qtext">${escH(q.question_text)}</p></div>${arch3}${mhint}<div class="choices">${choices}</div>${sub}<div class="expanel" id="exp_${q.id}"><div id="rbadge_${q.id}"></div>${q.exp_html}</div></div>`;
}
function onChoice(qid,idx){
  if(state[qid]?.answered)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  if(q.n_correct>1){
    if(!multiSel[qid])multiSel[qid]=new Set();
    const btn=document.getElementById(`c_${qid}_${idx}`);
    if(multiSel[qid].has(idx)){multiSel[qid].delete(idx);btn.classList.remove('multi-selected');}
    else{if(multiSel[qid].size>=q.n_correct)return;multiSel[qid].add(idx);btn.classList.add('multi-selected');}
    const sub=document.getElementById(`sub_${qid}`);
    if(sub)sub.style.display=multiSel[qid].size>=q.n_correct?'block':'none';
  }else{
    state[qid]={answered:true,correct:(displayChoices[qid]||q.choices)[idx].is_correct};
    applyAnswer(q,[idx]);
  }
}
function submitMulti(qid){
  if(state[qid]?.answered)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  const sel=[...(multiSel[qid]||new Set())];
  const cset=new Set((displayChoices[qid]||q.choices).map((c,i)=>c.is_correct?i:-1).filter(i=>i>=0));
  state[qid]={answered:true,correct:sel.length===cset.size&&sel.every(i=>cset.has(i))};
  applyAnswer(q,sel);
}
function applyAnswer(q,sel){
  const sset=new Set(sel);const isOk=state[q.id].correct;
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);if(!btn)return;
    btn.disabled=true;btn.classList.remove('multi-selected');
    if(sset.has(i))btn.classList.add(c.is_correct?'correct':'wrong');
    if(c.is_correct&&!sset.has(i))btn.classList.add('reveal');
  });
  document.getElementById(`card_${q.id}`).classList.add(isOk?(q.n_correct>1?'multi-ok':'ok'):'ng');
  const archEl3 = document.getElementById('arch_'+q.id);
  if(archEl3) archEl3.classList.add('arch-revealed');
  document.getElementById(`rbadge_${q.id}`).innerHTML=isOk
    ?`<div class="rbadge ${q.n_correct>1?'multi-ok':'ok'}">${q.n_correct>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説で正解・理由を確認しましょう</div>';
  document.getElementById(`exp_${q.id}`).style.display='block';
  const sub=document.getElementById(`sub_${q.id}`);if(sub)sub.style.display='none';
  updateProgress();
  setTimeout(()=>document.getElementById(`exp_${q.id}`).scrollIntoView({behavior:'smooth',block:'nearest'}),120);
}
function restoreQ(q){
  const s=state[q.id];if(!s?.answered)return;
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);if(!btn)return;
    btn.disabled=true;if(c.is_correct)btn.classList.add(s.correct?'correct':'reveal');
  });
  document.getElementById(`card_${q.id}`).classList.add(s.correct?(q.n_correct>1?'multi-ok':'ok'):'ng');
  const exp=document.getElementById(`exp_${q.id}`);if(exp)exp.style.display='block';
  const badge=document.getElementById(`rbadge_${q.id}`);
  if(badge)badge.innerHTML=s.correct
    ?`<div class="rbadge ${q.n_correct>1?'multi-ok':'ok'}">${q.n_correct>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説で正解・理由を確認しましょう</div>';
}
function filterDomain(d){
  filter=d;
  document.querySelectorAll('.dbtn').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  render();window.scrollTo({top:0});
}
function updateProgress(){
  const ans=Object.values(state).filter(s=>s.answered).length;
  const cor=Object.values(state).filter(s=>s.correct).length;
  document.getElementById('pbar').style.width=(ans/TOTAL*100)+'%';
  document.getElementById('hdrScore').textContent=`${cor}/${TOTAL}`;
  document.getElementById('hdrPct').textContent=`正解率 ${ans>0?Math.round(cor/ans*100):0}%`;
}
function showResults(){
  const cor=Object.values(state).filter(s=>s.correct).length;
  const pct=Math.round(cor/TOTAL*100);
  const ds={};
  QUESTIONS.forEach(q=>{
    if(!ds[q.domain])ds[q.domain]={t:0,c:0,color:q.domain_color||'#333'};
    ds[q.domain].t++;if(state[q.id]?.correct)ds[q.domain].c++;
  });
  document.getElementById('mscore').textContent=`${cor}/${TOTAL}`;
  document.getElementById('mpct').textContent=`正解率 ${pct}%`;
  const SVG_TROPHY='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 21 12 17 16 21"/><line x1="12" y1="17" x2="12" y2="11"/><path d="M18 6H6l1-4h10l1 4z"/><path d="M6 6c0 7 6 11 6 11s6-4 6-11"/></svg>';
  const SVG_UP='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>';
  const SVG_ZAP='<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
  const SVG_BOOK='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
  let icon=SVG_BOOK,msg='';
  if(pct>=80){icon=SVG_TROPHY;msg='合格圏内！本番でも自信を持って！';}
  else if(pct>=70){icon=SVG_UP;msg='あと少し！弱点ドメインを集中的に復習しよう。';}
  else if(pct>=50){icon=SVG_ZAP;msg='「間違えやすいポイント」を重点的に確認しよう。';}
  else{icon=SVG_BOOK;msg='各解説の「なぜ正解か」「なぜ不正解か」をしっかり読もう！';}
  document.getElementById('micon').innerHTML=icon;
  document.getElementById('mmsg').textContent=msg;
  document.getElementById('mdomains').innerHTML=Object.entries(ds).map(([d,s])=>{
    const p=Math.round(s.c/s.t*100);
    return `<div class="m-ditem"><div class="m-dname">${d}</div><div class="m-dval" style="color:${s.color}">${s.c}/${s.t} <span style="font-size:13px;font-weight:500;color:#888">(${p}%)</span></div></div>`;
  }).join('');
  document.getElementById('modal').classList.add('show');
}
function modalClose(e){if(!e||e.target.id==='modal')document.getElementById('modal').classList.remove('show');}
function resetAll(){document.getElementById('modal').classList.remove('show');initState();render();window.scrollTo({top:0,behavior:'smooth'});}
window.addEventListener('scroll',()=>document.getElementById('scrollTop').classList.toggle('show',window.scrollY>400));
initState();render();

// Highlight active vol nav link
(function(){
  const path = location.pathname;
  const m = path.match(/vol(\d)\.html/);
  if(m) {
    const el = document.getElementById('vj'+m[1]);
    if(el) el.classList.add('vj-active');
  }
  function updateReviewBadge(){
    const ids = JSON.parse(localStorage.getItem('az305_review_ids')||'[]');
    const badge = document.getElementById('vj-review-count');
    if(badge) badge.textContent = ids.length > 0 ? ids.length : '';
  }
  updateReviewBadge();
  window.updateReviewBadge = updateReviewBadge;
})();

const DESC_LINKS_VOL3 = {"q31": "descriptions/bgp-az305-guide.html", "q32": "descriptions/bgp-az305-guide.html", "q33": "descriptions/bgp-az305-guide.html", "q34": "descriptions/bgp-az305-guide.html"};
(function(){
  Object.entries(DESC_LINKS_VOL3).forEach(([qid, url]) => {
    const card = document.getElementById('card_'+qid);
    if(!card) return;
    const qbody = card.querySelector('.qbody');
    if(!qbody) return;
    qbody.insertAdjacentHTML('beforeend', '<a href="' + url + '" target="_blank" class="desc-link"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>参考解説を読む</a>');
  });
})();
</script>
