5\" x2=\"500\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"490\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">ログ収集</text>\n</svg></div><img src=\"picture/vol3_q31_q34_expressroute.png\" style=\"width:100%;border-radius:4px;max-width:760px;\"></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Q31〜Q33 と同じシナリオで、Azure Advisor を使ったソリューション案。\n\n<strong>Azure Advisor</strong> はリソースの高可用性・セキュリティ・パフォーマンス・コスト・オペレーション エクセレンスに関する<strong>推奨事項</strong>を提供するサービスです。パケット レベルのトラフィック検査やブロック機能は持っていません。よって <strong>No が正解</strong>です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Yes を選んだ場合：</strong> Azure Advisor が「セキュリティ推奨事項でトラフィックをブロックできる」と誤解しているパターン ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Azure Advisor は「こうした方が良い」という<strong>推奨事項（アドバイス）を提供する</strong>だけです。実際のリソース変更は手動（または推奨を適用ボタンで実施）で行います。トラフィックのリアルタイム制御は行いません。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Azure Advisor = ベスト プラクティスの<strong>推奨事項提供</strong>。ネットワーク トラフィックのブロック機能はない。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/advisor/advisor-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/advisor/advisor-overview</a></li></ul></div>\n</div>"},{"num":35,"id":"q35","domain":"インフラストラクチャ設計","domain_code":"IS","domain_color":"#C50F1F","question_text":"以下の Azure リソースがデプロイされています：\n\n・US-Central-Firewall-policy（セントラル US リージョン）\n・US-East-Firewall-policy（東部 US リージョン）\n・EU-Firewall-policy（西ヨーロッパ リージョン）\n\nすべての Azure Firewall デプロイに適用される必須ルールを定義する新しい Azure Firewall ポリシーをデプロイする必要があります。\n\nこの新しいポリシーは既存のファイアウォール ポリシーの親ポリシーとして構成されます。\n\n作成する必要がある追加の Azure Firewall ポリシーの最小数はいくつですか？","choices":[{"text":"0","is_correct":false},{"text":"1","is_correct":false},{"text":"2","is_correct":false},{"text":"3","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">Azure Firewall ポリシーのカスタム ルール変換</text><rect x=\"20\" y=\"38\" width=\"300\" height=\"25\" rx=\"6\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"1.5\"/><text x=\"170\" y=\"54\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">US-Central-Firewall-policy (Central US)</text><rect x=\"20\" y=\"68\" width=\"300\" height=\"25\" rx=\"6\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"1.5\"/><text x=\"170\" y=\"84\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">US-East-Firewall-policy (East US)</text><rect x=\"20\" y=\"98\" width=\"300\" height=\"25\" rx=\"6\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"1.5\"/><text x=\"170\" y=\"114\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">EU-Firewall-policy (West Europe)</text><rect x=\"20\" y=\"128\" width=\"300\" height=\"25\" rx=\"6\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"1.5\"/><text x=\"170\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Q35: 変換できるポリシー数 = 3</text><rect x=\"380\" y=\"35\" width=\"290\" height=\"130\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"1\"/><text x=\"525\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">変換条件確認</text><text x=\"525\" y=\"62\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">カスタム ルールのみ → 3ポリシーすべて対象</text><text x=\"525\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#555\">ルール コレクション グループ ≤ 50</text><text x=\"525\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" fill=\"#555\">ルール コレクション ≤ 1000</text><text x=\"525\" y=\"122\" text-anchor=\"middle\" font-size=\"9\" fill=\"#555\">優先度の重複なし</text><text x=\"525\" y=\"142\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\" font-weight=\"700\">→ 3ポリシーすべて移行可 ✅</text><text x=\"350\" y=\"188\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Firewall Policyのカスタムルールは上限内であれば全ポリシー移行可能。4つ目は存在しない</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">シナリオ：「US-Central・US-East・US-West の各リージョンに Firewall Policy がある。Azure Firewall Manager で管理するポリシー数はいくつか？」\n\n各リージョンに 1 つずつ Firewall Policy が存在するため、管理するポリシー数は <strong>3</strong> です。Azure Firewall Manager は 1 つで複数リージョンの Firewall Policy を一元管理できます（Manager 自体は 1 つで済む）。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>0：</strong> 3 つのポリシーが存在するため 0 ではない ❌\n\n<strong>1・2：</strong> 3 リージョン分のポリシーをカバーするには 3 が必要 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Azure Firewall Manager と Azure Firewall Policy の関係：\n\n• <strong>Azure Firewall Manager</strong>：複数リージョン・複数ハブにわたる Firewall Policy を一元管理するコントロール プレーン（1 つで全体管理）\n• <strong>Firewall Policy</strong>：各リージョン・各ファイアウォールに適用するルールの定義（リージョンごとに作成）\n\n「Manager の数」ではなく「管理するポリシーの数」が問われています。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Azure Firewall Manager は 1 つで複数リージョンを管理可能。管理対象の<strong>ポリシー数</strong>はリージョン数（3）に依存する。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/firewall-manager/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/firewall-manager/overview</a></li></ul></div>\n</div>"},{"num":36,"id":"q36","domain":"データストレージ設計","domain_code":"DS","domain_color":"#0078D4","question_text":"以下の Azure リソースがあります：\n\nAS1：Azure Synapse Analytics インスタンス\nCDB1：Azure Cosmos DB SQL API アカウント\n\nCDB1 には継続的に更新されるオペレーショナル データを保持するコンテナーがあります。\n\nAS1 が毎日のベースでオペレーショナル データを分析するソリューションを設計しています。\n\nCDB1 のオペレーショナル データ ストアのパフォーマンスに影響を与えることなく分析を実行できるソリューションを推奨する必要があります。\n\n推奨に含めるべきものはどれですか？","choices":[{"text":"Azure Cosmos DB 変更フィード","is_correct":false},{"text":"Azure Cosmos DB と Azure Synapse Analytics を使用した Azure Data Factory","is_correct":false},{"text":"PolyBase データ ローディングを使用した Azure Synapse Analytics","is_correct":false},{"text":"Azure Cosmos DB 向け Azure Synapse Link","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">Cosmos DB → Synapse Analytics（Q36）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY or=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">分析</text>\n<line x1=\"244\" y1=\"75\" x2=\"270\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"260\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Synapse Link</text>\n<line x1=\"364\" y1=\"75\" x2=\"390\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"380\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">クエリ</text>\n</svg></div><img src=\"picture/vol3_q36_cosmos_synapse.png\" style=\"width:100%;border-radius:4px;max-width:760px;\"></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「Cosmos DB（CDB1）のデータを Azure Synapse Analytics（AS1）でリアルタイムに分析する。<strong>Cosmos DB への影響なし + コスト最小化</strong>」。\n\n<strong>Azure Cosmos DB 向け Azure Synapse Link</strong>：Cosmos DB の分析ストア（列指向）を有効化し、Synapse Analytics から直接クエリ可能。Cosmos DB の運用パフォーマンスへの影響なし（トランザクション処理と分析処理が分離）、ETL 不要でリアルタイム分析が可能。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Cosmos DB 変更フィード：</strong> 変更データをリアルタイムで追跡できるが、Synapse Analytics から直接クエリできず、別途パイプラインが必要でコストが増加 ❌\n\n<strong>Cosmos DB + Synapse を使った ADF：</strong> ADF を介したデータ コピーはバッチ処理となり「リアルタイム分析」の要件を満たしにくい。追加コストも発生 ❌\n\n<strong>PolyBase を使った Synapse：</strong> Cosmos DB との直接 PolyBase 連携は標準的にはサポートされない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「Synapse Link」は Cosmos DB と Synapse Analytics の<strong>ネイティブ統合</strong>機能です。追加サービス不要でリアルタイム分析が可能で、ETL パイプラインが不要な分コスト削減にもなります。\n\n「Cosmos DB の影響なし」= Synapse Link は分析ストア（列指向）を使うためトランザクション処理への影響がゼロです。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">方法</th><th>リアルタイム分析</th><th>Cosmos DB への影響</th><th>ETL 不要</th></tr></thead><tbody><tr><td class=\"cc\">Azure Synapse Link ✅</td><td>✅</td><td>なし</td><td>✅</td></tr><tr><td class=\"cc\">変更フィード + パイプライン</td><td>△（近リアルタイム）</td><td>△ 若干あり</td><td>❌</td></tr><tr><td class=\"cc\">ADF バッチ</td><td>❌（バッチ）</td><td>なし</td><td>❌</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「Cosmos DB リアルタイム分析 + Cosmos DB への影響なし + コスト最小」= <strong>Azure Synapse Link</strong>。ETL 不要でネイティブ統合。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/cosmos-db/synapse-link\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/cosmos-db/synapse-link</a></li></ul></div>\n</div>"},{"num":37,"id":"q37","domain":"インフラストラクチャ設計","domain_code":"IS","domain_color":"#C50F1F","question_text":"注意：この問題は同じシナリオを使用する一連の問題の一部です。シリーズの各問題は要件を満たす場合と満たさない場合のある異なるソリューションを提示します。\n\n組織は、Azure SQL Database に接続する複数の Azure App Service インスタンスをデプロイする計画があります。App Service インスタンスと対応する Azure SQL Database は同時にプロビジョニングされます。\n\n規制要件により以下が義務付けられています：\n\n・App Service インスタンスは特定の承認済み Azure リージョンにのみデプロイできること\n・App Service インスタンスと SQL Database はそれぞれ特定のリソース グループにデプロイされること\n\n提案されたソリューション：場所に基づいてリソース グループを作成し、リソース グループにリソース ロックを追加する。\n\nこのソリューションは要件を満たしていますか？","choices":[{"text":"Yes（はい）","is_correct":false},{"text":"No（いいえ）","is_correct":true}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"50\" width=\"130\" height=\"80\" rx=\"8\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"2\"/><text x=\"85\" y=\"82\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#0072C6\">Azure App Service</text><text x=\"85\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">複数アプリ</text><text x=\"85\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">SQL DB に接続</text><rect x=\"220\" y=\"30\" width=\"170\" height=\"130\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"305\" y=\"87\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">プライベート エンドポイント</text><text x=\"305\" y=\"101\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">SQL DB 向け</text><text x=\"305\" y=\"115\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">VNet 内プライベート接続</text><rect x=\"230\" y=\"70\" width=\"150\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"305\" y=\"83\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">パブリックIP不使用 ✅</text><rect x=\"230\" y=\"95\" width=\"150\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"305\" y=\"108\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">VNet内限定アクセス ✅</text><rect x=\"230\" y=\"120\" width=\"150\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"305\" y=\"133\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">App Service VNet統合必要</text><rect x=\"230\" y=\"145\" width=\"150\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"305\" y=\"158\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">SQL DBのFW設定変更不要</text><rect x=\"460\" y=\"50\" width=\"200\" height=\"80\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"560\" y=\"82\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Q37 No の選択肢</text><text x=\"560\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">サービス エンドポイントのみ</text><text x=\"560\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">パブリック IP 経由（不完全）</text><line x1=\"150\" y1=\"90\" x2=\"218\" y2=\"90\" stroke=\"#0072C6\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"20\" y=\"155\" width=\"620\" height=\"22\" rx=\"6\" fill=\"#FFF8E1\" stroke=\"#E67700\" stroke-width=\"1.5\"/><text x=\"330\" y=\"170\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">サービスEP≠プライベートEP: サービスEPはまだパブリックIPを使いうる。完全プライベート化にはプライベートEP</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">完全プライベート化 = プライベートエンドポイント + App Service VNet統合の組み合わせが必要</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">シナリオ：「Azure SQL Database の監視設定。提示されたソリューション（診断設定をストレージ アカウントのみに送信）が全要件を満たすか？」\n\nストレージ アカウントへの保存で「保存」要件は満たせますが、「リアルタイム クエリ・分析」要件を満たさないため <strong>No が正解</strong>です。リアルタイム クエリが必要であれば Log Analytics ワークスペースへの送信が必要です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Yes を選んだ場合：</strong> ストレージ アカウントへの保存で「保存」要件は満たせるが、「リアルタイム クエリ・分析」要件を見落としているパターン ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">診断ログの送信先によって実現できることが異なります：\n\n• <strong>ストレージ アカウント</strong>：長期保存・アーカイブ（リアルタイムクエリは不可）\n• <strong>Log Analytics</strong>：KQL でリアルタイムクエリ・アラート設定可\n• <strong>Event Hub</strong>：リアルタイム ストリーム（外部 SIEM への転送など）</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「リアルタイム クエリが必要」= <strong>Log Analytics</strong>。ストレージ アカウントは保存専用でクエリには向かない。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/azure-monitor/essentials/diagnostic-settings\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/azure-monitor/essentials/diagnostic-settings</a></li></ul></div>\n</div>"},{"num":38,"id":"q38","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"複数のストレージ アカウントを含む Azure サブスクリプションがあり、それらのストレージ アカウントに Azure Policy 定義が割り当てられています。\n\n以下の要件を満たすソリューションを推奨する必要があります：\n\n・オンデマンドの Azure Policy コンプライアンス スキャンをトリガーすること\n・Log Analytics に格納されたデータをクエリすることで非準拠リソースの Azure Monitor アラートを生成すること\n\nこれらの要件を満たすために、Azure Policy コンプライアンス スキャンのトリガーに使用すべきものはどれですか？","choices":[{"text":"Azure ARM テンプレート","is_correct":true},{"text":"Azure コマンドライン インターフェイス (CLI)","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"50\" width=\"140\" height=\"80\" rx=\"8\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"2\"/><text x=\"90\" y=\"82\" text-anchor=\"middle\ t><text x=\"80\" y=\"112\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">AD DS 認証アプリ</text><rect x=\"210\" y=\"35\" width=\"155\" height=\"115\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"287\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">App Proxy コネクタ</text><text x=\"287\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Windows Server 上</text><text x=\"287\" y=\"112\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">オンプレミスに設置</text><rect x=\"220\" y=\"75\" width=\"135\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"287\" y=\"88\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">コネクタ = 橋渡し役</text><rect x=\"220\" y=\"100\" width=\"135\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"287\" y=\"113\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Entra ID ↔ AD DS 仲介</text><rect x=\"220\" y=\"125\" width=\"135\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"287\" y=\"138\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ファイアウォール変更不要</text><rect x=\"440\" y=\"55\" width=\"150\" height=\"75\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"515\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">Server1</text><text x=\"515\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">AD DS 認証</text><text x=\"515\" y=\"112\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">App1 ホスト</text><rect x=\"440\" y=\"145\" width=\"150\" height=\"35\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"515\" y=\"154\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">オンプレデータゲートウェイ</text><text x=\"515\" y=\"168\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Power BI 等向け</text><text x=\"515\" y=\"182\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">App Proxy代替不可</text><line x1=\"140\" y1=\"92\" x2=\"208\" y2=\"92\" stroke=\"#E67700\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"365\" y1=\"92\" x2=\"438\" y2=\"92\" stroke=\"#107C10\" stroke-width=\"2\" marker-end=\"url(#ag)\"/><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">App Proxy: 外部→Entra ID認証→コネクタ→オンプレAD DS認証。VPN不要でオンプレアプリ公開</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「オンプレミスの App1（AD DS 認証依存）をインターネット経由で Azure AD ユーザーに公開し、MFA を適用する」。\n\n<strong>Entra アプリケーション プロキシ コネクター（Windows Server）</strong>：オンプレミスにコネクターをインストールし、App1 をインターネット経由で安全に公開します。Entra ID 認証と AD DS 認証を橋渡し（Kerberos 制約付き委任）し、MFA・条件付きアクセスの適用が可能です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>オンプレミス データ ゲートウェイ（Windows Server）：</strong> Power BI・Power Apps・Logic Apps などが Entra 外のオンプレミス データに接続するためのゲートウェイ。Web アプリの公開には使わない ❌\n\n<strong>Web Application Proxy（WAP）ロール サービス：</strong> AD FS と連携してアプリを公開する機能。Entra ID との直接統合が難しく、構成も複雑。クラウドファーストの現代では App Proxy が推奨 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">アプリケーション プロキシ vs WAP：\n\n• <strong>Entra App Proxy</strong>：Entra ID（クラウド）ベースで設定がシンプル。AD FS 不要\n• <strong>Web Application Proxy（WAP）</strong>：AD FS に依存。オンプレミス中心の旧来の構成\n\nクラウドファーストの現代では App Proxy が推奨される方法です。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>Entra ID 統合</th><th>AD FS 依存</th><th>MFA 対応</th><th>設定の複雑さ</th></tr></thead><tbody><tr><td class=\"cc\">Entra App Proxy コネクター ✅</td><td>ネイティブ</td><td>不要</td><td>✅</td><td>低</td></tr><tr><td class=\"cc\">Web Application Proxy（WAP）</td><td>△（AD FS 経由）</td><td>依存</td><td>✅（AD FS で設定）</td><td>高</td></tr><tr><td class=\"cc\">オンプレミス データ ゲートウェイ</td><td>△</td><td>❌</td><td>❌</td><td>中（用途違い）</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">オンプレミス Web アプリ → Entra ID 認証 + MFA = <strong>Entra アプリケーション プロキシ コネクター</strong>。WAP は AD FS 依存で旧来の方法。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/active-directory/app-proxy/application-proxy\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/active-directory/app-proxy/application-proxy</a></li></ul></div>\n</div>"},{"num":43,"id":"q43","domain":"インフラストラクチャ設計","domain_code":"IS","domain_color":"#C50F1F","question_text":"【ApexCore Ltd. ケース スタディに基づく問題】\n\nApexCore Ltd. のケース スタディでは以下が定義されています：\n・App1 は複数の Azure リージョンにデプロイされ、インターネット経由でアクセスされます\n・App1 の接続要件を満たすために Azure Traffic Manager と Azure Application Gateway を組み合わせた使用を評価しています\n\nApp1 の接続要件（リージョン間トラフィック分散と Web Application Firewall 機能）を考慮して、以下の各サービスに必要な最小インスタンス数を決定してください：\n\n・Azure Traffic Manager の最小インスタンス数\n・Azure Application Gateway の最小インスタンス数","choices":[{"text":"Traffic Manager: 6、Application Gateway: 3","is_correct":false},{"text":"Traffic Manager: 2、Application Gateway: 1","is_correct":false},{"text":"Traffic Manager: 3、Application Gateway: 6","is_correct":false},{"text":"Traffic Manager: 1、Application Gateway: 3","is_correct":true},{"text":"Traffic Manager: 2、Application Gateway: 3","is_correct":false},{"text":"Traffic Manager: 1、Application Gateway: 2","is_correct":false}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">ApexCore: Traffic Manager マルチリージョン（Q43）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"156\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#107C10\" stroke-width=\"1.5\"/>\n<rect x=\"162\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#107C10\" fill-opacity=\"0.18\"/>\n<text x=\"200\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#107C10\" font-family=\"Segoe UI,Arial,sans-serif\">TM</text>\n<text x=\"200\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Traffic Manager</text>\n<rect x=\"276\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"282\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"320\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">APP</text>\n<text x=\"320\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">App1</text>\n<text x=\"320\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">リージョン A</text>\n<rect x=\"396\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"402\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"440\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">APP</text>\n<text x=\"440\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">App1</text>\n<text x=\"440\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">リージョン B</text>\n<line x1=\"244\" y1=\"75\" x2=\"270\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"260\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">ルーティング</text>\n<line x1=\"364\" y1=\"75\" x2=\"390\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n</svg></div><img src=\"picture/vol3_q43_apexcore_tm.png\" style=\"width:100%;border-radius:4px;max-width:760px;\"></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">ApexCore のシナリオ：「App1 を 3 リージョンにデプロイし、グローバルな DNS ベース ルーティングと各リージョン内での L7 ロード バランシングが必要」。\n\n<strong>Traffic Manager: 1、Application Gateway: 3</strong>：\n• <strong>Traffic Manager 1 つ</strong>：グローバルな DNS ベースのルーティング（3 リージョンのエンドポイントを管理）\n• <strong>Application Gateway 3 つ</strong>：各リージョンに 1 つずつ配置し、リージョン内での L7 ロード バランシング・SSL 終端・WAF を提供</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Traffic Manager: 6、Application Gateway: 3：</strong> Traffic Manager は 1 つで複数のエンドポイントを管理できる。6 つも必要ない ❌\n\n<strong>Traffic Manager: 2、Application Gateway: 1：</strong> リージョン数（3）に対して Application Gateway が 1 つでは不足 ❌\n\n<strong>Traffic Manager: 3、Application Gateway: 6：</strong> Traffic Manager をリージョンごとに作る必要はない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Traffic Manager と Application Gateway の配置パターン：\n\n• <strong>Traffic Manager</strong>：グローバルで 1 つ。複数リージョンのエンドポイントを管理\n• <strong>Application Gateway</strong>：リージョンごとに 1 つ。そのリージョン内のバックエンドを管理\n\n「1 グローバル + n リージョン」というパターンは試験頻出。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>サービス</th><th>スコープ</th><th>必要な数</th><th>役割</th></tr></thead><tbody><tr><td>Traffic Manager</td><td>グローバル</td><td>1（全体で）</td><td>DNS ルーティング・フェールオーバー</td></tr><tr><td>Application Gateway</td><td>リージョン</td><td>リージョン数（3）</td><td>L7 LB・SSL 終端・WAF</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">グローバル DNS ルーティング = <strong>Traffic Manager 1 つ</strong>、各リージョンの L7 LB = <strong>Application Gateway × リージョン数（3）</strong>。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/traffic-manager/traffic-manager-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/traffic-manager/traffic-manager-overview</a></li></ul></div>\n</div>"},{"num":44,"id":"q44","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"【ApexCore Ltd. ケース スタディに基づく問題】\n\nApexCore Ltd. のケース スタディでは以下の ID とアクセスの要件が定義されています：\n・ApexCore ユーザーと外部パートナー（Fabrikam 社）ユーザーの両方がアプリケーションにアクセスできること\n・毎月、Fabrikam のアカウント マネージャーが App1 へのアクセス権を持つ Fabrikam ユーザーを確認し、不要なアカウントをゲストから削除すること\n\nID 要件を満たすために実装すべき Azure サービスはどれですか？","choices":[{"text":"Microsoft Entra ID Identity Governance","is_correct":true},{"text":"Microsoft Entra ID Identity Protection","is_correct":false},{"text":"Microsoft Entra Privileged Identity Management (PIM)","is_correct":false},{"text":"Azure Automation","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"40\" width=\"155\" height=\"100\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#888\" stroke-width=\"1\"/><text x=\"97\" y=\"82\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#888\">要件</text><text x=\"97\" y=\"65\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">外部パートナー(Fabrikam)</text><text x=\"97\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">アクセスの定期レビュー</text><text x=\"97\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">不要権限の自動削除</text><text x=\"97\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">ガバナンス統合管理</text><rect x=\"240\" y=\"20\" width=\"185\" height=\"150\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"332\" y=\"87\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">Entra ID Identity Governance</text><text x=\"332\" y=\"101\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">(Q44) ガバナンス傘</text><rect x=\"250\" y=\"60\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#D1C4E9\"/><text x=\"332\" y=\"73\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">エンタイトルメント管理</text><rect x=\"250\" y=\"85\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#D1C4E9\"/><text x=\"332\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">アクセス レビュー (Q45) ✅</text><rect x=\"250\" y=\"110\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#D1C4E9\"/><text x=\"332\" y=\"123\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">PIM（特権管理）</text><rect x=\"250\" y=\"135\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#D1C4E9\"/><text x=\"332\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4527A0\">ライフサイクル ワークフロー</text><rect x=\"500\" y=\"40\" width=\"170\" height=\"100\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"585\" y=\"82\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Identity Protection</text><text x=\"585\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">異常サインイン検知</text><text x=\"585\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ガバナンス管理ではない</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Identity Governance = アクセス管理全体。レビュー = 定期確認で不要権限削除</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「ApexCore のユーザーと外部ユーザー（Fabrikam）のアクセス ライフサイクル（申請・承認・定期確認・自動削除）を管理する」。\n\n<strong>Microsoft Entra ID Identity Governance</strong>：エンタイトルメント管理・アクセス レビュー・PIM・ライフサイクル ワークフローをまとめてカバーする包括的なガバナンス ソリューションです。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Entra ID Identity Protection：</strong> リスクの高いサインイン・侵害されたアカウントの検出と対応。アクセス ライフサイクル管理ではない ❌\n\n<strong>Entra PIM：</strong> 特権ロール（管理者）の JIT アクセス管理。一般ユーザーのライフサイクル管理を包括的にカバーするには不十分（PIM は Identity Governance の一部）❌\n\n<strong>Azure Automation：</strong> IT 自動化ツール。ID ガバナンスのネイティブ機能はない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「Identity Governance」と「Identity Protection」は名前が似ていますが全く異なるサービスです：\n\n• <strong>Identity Governance</strong>：アクセス権のライフサイクル（誰が何にアクセスできるか）を管理\n• <strong>Identity Protection</strong>：不審なサインイン・アカウント侵害のリスク検出と対応\n\n「ガバナンス = アクセス管理」「プロテクション = セキュリティリスク」と覚えましょう。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>アクセスライフサイクル</th><th>リスク検出</th><th>包括性</th></tr></thead><tbody><tr><td class=\"cc\">Identity Governance ✅</td><td>完全</td><td>❌</td><td>最高</td></tr><tr><td class=\"cc\">Identity Protection</td><td>❌</td><td>✅</td><td>セキュリティ特化</td></tr><tr><td class=\"cc\">PIM</td><td>△（特権のみ）</td><td>❌</td><td>特権 ID 専用</td></tr><tr><td class=\"cc\">Azure Automation</td><td>❌</td><td>❌</td><td>汎用 IT 自動化</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">アクセス権ライフサイクルの包括管理 = <strong>Entra ID Identity Governance</strong>。Identity Protection はリスク検出専用で別物。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/active-directory/governance/identity-governance-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/active-directory/governance/identity-governance-overview</a></li></ul></div>\n</div>"},{"num":45,"id":"q45","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"【ApexCore Ltd. ケース スタディに基づく問題】\n\nApexCore Ltd. のケース スタディでは以下の ID とアクセスの要件が定義されています：\n・ApexCore ユーザーと外部パートナー（Fabrikam 社）ユーザーの両方がアプリケーションにアクセスできること\n・毎月、Fabrikam のアカウント マネージャーが App1 へのアクセス権を持つ Fabrikam ユーザーを確認し、不要なアカウントをゲストから削除すること\n\nこの ID 要件を満たすために実装すべき機能はどれですか？","choices":[{"text":"アクセス パッケージ","is_correct":false},{"text":"アクセス レビュー","is_correct":true},{"text":"承認","is_correct":false},{"text":"Runbook","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/ ext><rect x=\"500\" y=\"40\" width=\"170\" height=\"100\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"585\" y=\"82\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Identity Protection</text><text x=\"585\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">異常サインイン検知</text><text x=\"585\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ガバナンス管理ではない</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Identity Governance = アクセス管理全体。レビュー = 定期確認で不要権限削除</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">ApexCore シナリオ：「Fabrikam のアカウント マネージャーが毎月、App1 へのアクセスを持つ Fabrikam ユーザーを確認し、不要なアカウントをゲストから削除する」。\n\n<strong>アクセス レビュー</strong>：既存のアクセス権を定期的（月次など）に確認する仕組みです。レビュアー（マネージャー）へのメール通知、応答なし時の自動削除オプション（自動適用）があり、ゲスト ユーザーのアクセス棚卸しに最適。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>アクセス パッケージ（エンタイトルメント管理）：</strong> アクセス権の「申請・付与・期限切れ」を管理するもの。「既存アクセスを定期確認して削除する」用途には別機能のアクセス レビューが必要 ❌\n\n<strong>承認：</strong> エンタイトルメント管理の一部（申請時の承認プロセス）。定期的な棚卸しには使えない ❌\n\n<strong>Runbook（Azure Automation）：</strong> スクリプト自動化ツール。コーディングが必要で、アクセス レビューのようなノーコードのワークフローではない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">アクセス レビューとエンタイトルメント管理（アクセス パッケージ）の区別：\n\n• <strong>エンタイトルメント管理</strong>：「新しいアクセス権をどのように申請・付与・失効させるか」（将来）\n• <strong>アクセス レビュー</strong>：「既に持っているアクセス権を定期的に見直す」（現在の棚卸し）\n\n問題文に「毎月確認して削除する」= アクセス レビュー。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">機能</th><th>目的</th><th>タイミング</th><th>自動削除</th></tr></thead><tbody><tr><td class=\"cc\">アクセス レビュー ✅</td><td>既存アクセスの定期確認・削除</td><td>定期（月次等）</td><td>✅（自動適用）</td></tr><tr><td class=\"cc\">エンタイトルメント管理</td><td>新規アクセスの申請〜付与〜失効</td><td>申請時</td><td>✅（期限切れ）</td></tr><tr><td class=\"cc\">PIM</td><td>特権ロールの JIT 管理</td><td>使用時</td><td>✅（時間制限）</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「毎月既存アクセスを確認して不要ユーザーを削除」= <strong>アクセス レビュー</strong>。「新規アクセス申請・付与」= エンタイトルメント管理。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/active-directory/governance/access-reviews-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/active-directory/governance/access-reviews-overview</a></li></ul></div>\n</div>"},{"num":46,"id":"q46","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"【ApexCore Ltd. ケース スタディに基づく問題】\n\nApexCore Ltd. のケース スタディでは以下のセキュリティ要件が定義されています：\n・App1 はサードパーティの認証情報とアクセス文字列を安全に取得する必要があります\n・認証情報とアクセス文字列は Azure Key Vault に格納されています\n・シークレットは保護された状態に保つこと\n・認証情報は特定のサービス インスタンスに紐付けること\n・認証情報はサービス間で共有しないこと\n\nApp1 は Azure App Service にホストされています。\n\nこれらのセキュリティ要件を満たすために App1 の認証に使用すべきものはどれですか？","choices":[{"text":"証明書","is_correct":false},{"text":"システム割り当てマネージド ID","is_correct":true},{"text":"ユーザー割り当てマネージド ID","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">App Service + Managed Identity + Key Vault（Q46-47）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 Segoe UI,Arial,sans-serif\">シークレット</text>\n<line x1=\"244\" y1=\"75\" x2=\"270\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"260\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">ID 利用</text>\n<line x1=\"364\" y1=\"75\" x2=\"390\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"380\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">シークレット取得</text>\n</svg></div><img src=\"picture/vol3_q46_q47_app_keyvault.png\" style=\"width:100%;border-radius:4px;max-width:760px;\"></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">ApexCore シナリオ：「App1 がサードパーティの認証情報なしに Key Vault にアクセスする。App1 と Key Vault の<strong>ライフサイクルが紐付いている</strong>（App1 が削除されたら不要になる）」。\n\n<strong>システム割り当てマネージド ID</strong>：App1 のリソース（App Service）に紐付けた Entra ID マネージド ID です。App1 が削除されると自動的に ID も削除され（ライフサイクルが一致）、資格情報管理が不要です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>証明書（Certificate）：</strong> 有効期限の管理・更新作業が必要。「認証情報不要」の要件に反する ❌\n\n<strong>ユーザー割り当てマネージド ID：</strong> 独立した ID リソースとして作成され、複数リソースから共有可能。ただし App1 を削除しても ID は残る（ライフサイクルが別）。App1 専用の場合はシステム割り当ての方が適切 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">システム割り当て vs ユーザー割り当てマネージド ID の選択基準：\n\n• <strong>システム割り当て</strong>：特定リソース専用、ライフサイクルが一致、1 リソース : 1 ID\n• <strong>ユーザー割り当て</strong>：複数リソース間で共有可能、ライフサイクルが独立、1 ID : 多リソース\n\n「そのリソース専用で一緒に削除してほしい」→ システム割り当て。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">マネージド ID 種別</th><th>ライフサイクル</th><th>共有</th><th>適した場面</th></tr></thead><tbody><tr><td class=\"cc\">システム割り当て ✅</td><td>リソースと一致（リソース削除で自動削除）</td><td>1 リソース専用</td><td>単一リソース専用</td></tr><tr><td class=\"cc\">ユーザー割り当て</td><td>独立（手動削除が必要）</td><td>複数リソースで共有</td><td>複数リソース間での共有</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「App とライフサイクルが一致する ID」= <strong>システム割り当てマネージド ID</strong>。App 削除時に自動削除される。共有したい場合 → ユーザー割り当て。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/active-directory/managed-identities-azure-resources/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/active-directory/managed-identities-azure-resources/overview</a></li></ul></div>\n</div>"},{"num":47,"id":"q47","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"【ApexCore Ltd. ケース スタディに基づく問題】\n\nApexCore Ltd. のケース スタディでは以下のセキュリティ要件が定義されています：\n・App1 はサードパーティの認証情報とアクセス文字列を安全に取得する必要があります\n・認証情報とアクセス文字列は Azure Key Vault に格納されています\n\nApp1 が Key Vault からシークレットを取得するための承認に使用すべきものはどれですか？","choices":[{"text":"アクセス ポリシー","is_correct":true},{"text":"接続済みサービス","is_correct":false},{"text":"プライベート リンク","is_correct":false},{"text":"ロール割り当て","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">App Service + Managed Identity + Key Vault（Q46-47）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"156\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"162\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"200\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">APP</text>\n<text x=\"200\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">App1</text>\n<text x=\"200\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">App Service</text>\n<rect x=\"276\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#7719AA\" stroke-width=\"1.5\"/>\n<rect x=\"282\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#7719AA\" fill-opacity=\"0.18\"/>\n<text x=\"320\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#7719AA\" font-family=\"Segoe UI,Arial,sans-serif\">MI</text>\n<text x=\"320\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Managed</text>\n<text x=\"320\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Identity</text>\n<rect x=\"396\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#E8A000\" stroke-width=\"1.5\"/>\n<rect x=\"402\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#E8A000\" fill-opacity=\"0.18\"/>\n<text x=\"440\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#E8A000\" font-family=\"Segoe UI,Arial,sans-serif\">KV</text>\n<text x=\"440\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Key Vault</text>\n<text x=\"440\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">シークレット</text>\n<line x1=\"244\" y1=\"75\" x2=\"270\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"260\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">ID 利用</text>\n<line x1=\"364\" y1=\"75\" x2=\"390\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"380\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">シークレット取得</text>\n</svg></div><img src=\"picture/vol3_q46_q47_app_keyvault.png\" style=\"width:100%;border-radius:4px;max-width:760px;\"></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">ApexCore シナリオの続き：「App1 のマネージド ID に Key Vault へのアクセス許可を付与する。Key Vault は<strong>アクセス ポリシー</strong>モデルを使用している」。\n\n<strong>アクセス ポリシー（Key Vault Access Policy）</strong>：Key Vault の従来のデータプレーン アクセス制御モデルです。マネージド ID に Get/List/Set などの個別操作を細かく付与できます。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>接続済みサービス（Connected Services）：</strong> Visual Studio などの IDE からサービス参照を追加する機能。アクセス制御の設定ではない ❌\n\n<strong>プライベート リンク：</strong> Key Vault へのネットワークレベルのプライベート接続。アクセス許可（誰が何をできるか）の設定ではない ❌\n\n<strong>ロール割り当て（RBAC）：</strong> Key Vault が Azure RBAC モデルを使用している場合に有効。この問題ではアクセス ポリシー モデルなので RBAC ではなくアクセス ポリシーが正解 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Key Vault のアクセス制御には 2 つのモデルがあります：\n\n• <strong>アクセス ポリシー（従来）</strong>：Key Vault 固有の IAM。Get/List/Set などを個別に設定\n• <strong>Azure RBAC（新しいモデル）</strong>：標準の Azure RBAC ロール（Key Vault Secrets User など）を使用\n\n問題文やシナリオで「どちらのモデルか」を確認することが重要です。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">モデル</th><th>設定場所</th><th>粒度</th><th>推奨</th></tr></thead><tbody><tr><td class=\"cc\">アクセス ポリシー（従来）✅</td><td>Key Vault のアクセス ポリシー画面</td><td>操作レベル（Get/List/Set）</td><td>既存 KV</td></tr><tr><td class=\"cc\">Azure RBAC（新）</td><td>Key Vault の IAM（ロール割り当て）</td><td>ロールレベル（Secrets User 等）</td><td>新規 KV 推奨</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Key Vault アクセス ポリシー モデルでのアクセス付与 = <strong>アクセス ポリシー</strong>。RBAC モデルのときはロール割り当てを使う。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/key-vault/general/security-features\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/key-vault/general/security-features</a></li></ul></div>\n</div>"},{"num":48,"id":"q48","domain":"インフラストラクチャ設計","domain_code":"IS","domain_color":"#C50F1F","question_text":"【ApexCore Ltd. ケース スタディに基づく問題】\n\nApexCore Ltd. のケース スタディでは App1 について以下が定義されています：\n・Python ベースの Web アプリケーションで Linux ランタイムで実行される\n・複数の Azure リージョンにデプロイされる\n・App1 は 6 つのインスタンスを持つ：米国東部 (East US) リージョンに 3 つ、西ヨーロッパ (West Europe) リージョンに 3 つ\n・すべての機能、接続性、セキュリティ、可用性、リージョン トラフィック ルーティング要件を満たすこと\n・全体的なコストを最小化すること\n\nApp1 に推奨すべき App Service アーキテクチャはどれですか？","choices":[{"text":"リージョンごとに 1 つの App Service Environment (ASE)","is_correct":false},{"text":"可用性ゾーンごとに 1 つの App Service Environment (ASE)","is_correct":false},{"text":"リージョンごとに 1 つの App Service プラン","is_correct":true},{"text":"可用性ゾーンごとに 1 つの App Service プラン","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" ref oke-width=\"2\"/><text x=\"595\" y=\"47\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">ASE (App Service Env)</text><text x=\"595\" y=\"61\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">隔離 VNet 環境向け</text><text x=\"595\" y=\"75\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">今回の要件超過</text><rect x=\"510\" y=\"105\" width=\"170\" height=\"70\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"595\" y=\"132\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">CI/CD ソース</text><text x=\"595\" y=\"146\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">デプロイ自動化のみ</text><text x=\"595\" y=\"160\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">テスト検証機能なし</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">プランはリージョン単位でAZを有効化。スロットで本番前テスト→スワップのサイクルが標準</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">ApexCore シナリオ：「Python ベースの Web アプリ（App1）を 3 リージョンにデプロイ。リージョンごとに自動スケールを独立して制御したい」。\n\n<strong>リージョンごとに 1 つの App Service プラン</strong>：App Service プランはリージョン単位でスケール設定を持ちます。3 リージョン = 3 つの App Service プランで、各プランが独立して自動スケールを設定できます。App Service Environment（ASE）は必要なく、通常のプランで十分です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>リージョンごとに 1 つの ASE：</strong> ASE は完全な隔離ネットワーク環境が必要な場合（コンプライアンス・高スループット）に使用。通常の Python Web アプリには過剰でコスト大幅増（基本料金 $2,000+/月）❌\n\n<strong>可用性ゾーンごとに 1 つの ASE：</strong> App Service Environment を可用性ゾーンごとに作るのは設計として誤り ❌\n\n<strong>可用性ゾーンごとに 1 つの App Service プラン：</strong> App Service プランは可用性ゾーンごとに作るものではなく、ゾーン冗長を有効化してリージョン内で分散させる ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">App Service プランと ASE の使い分け：\n\n• <strong>App Service プラン</strong>：標準的なマルチテナント環境。自動スケール対応。コスト効率良\n• <strong>App Service E "#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"572\" y=\"57\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Azure VM</text><text x=\"572\" y=\"71\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">常時起動コスト</text><text x=\"572\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">スケジュール向きでない</text><rect x=\"480\" y=\"115\" width=\"185\" height=\"55\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"572\" y=\"134\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Logic Apps</text><text x=\"572\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">フロー/統合向き</text><text x=\"572\" y=\"162\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">コスト高</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">Functions タイマートリガー: CRON式でスケジュール定義。消費プランで実行時のみ課金</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">ApexCore シナリオ：「App1 はスケジュールベースで定期的に処理を実行する。Python ベース。コスト効率重視」。\n\n<strong>Azure Function アプリ</strong>：Timer トリガーを使ってスケジュールベースの処理を実行できます。サーバーレスのため実行時のみ課金され、コスト効率が最も高いです。Python をサポートしており、App1 の要件に完全に一致します。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure 仮想マシン：</strong> スケジュール処理のために常時起動する VM は過剰でコスト大幅増。スケジュール実行には不向き ❌\n\n<strong>Azure Logic アプリ：</strong> ロー コードのワークフロー自動化ツール。スケジュール実行は可能だが、Python コードの実行には不向きで、コストも Functions より高い傾向 ❌\n\n<strong>Azure App Service WebJob：</strong> App Service 上でバックグラウンド ジョブを実行できるが、App Service プランが常時稼働するためコストが発生。Functions の方がコスト効率が良い ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">スケジュールベースの処理を選ぶ際の選択肢比較：\n\n• <strong>Azure Functions（Timer トリガー）</strong>：サーバーレス・実行時のみ課金・Python 対応 → 最もコスト効率が高い\n• <strong>WebJob</strong>：App Service の一部として動作。App Service プランが常時稼働\n• <strong>Logic Apps</strong>：ロー コード・スケジュール対応だが Python 実行が苦手\n• <strong>VM</strong>：常時稼働でコスト最大</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>スケジュール実行</th><th>Python 対応</th><th>コスト効率</th><th>サーバーレス</th></tr></thead><tbody><tr><td class=\"cc\">Azure Functions（Timer）✅</td><td>✅</td><td>✅</td><td>最高</td><td>✅</td></tr><tr><td class=\"cc\">Azure Logic Apps</td><td>✅</td><td>△</td><td>中</td><td>✅</td></tr><tr><td class=\"cc\">App Service WebJob</td><td>✅</td><td>✅</td><td>低（常時稼働）</td><td>❌</td></tr><tr><td class=\"cc\">Azure VM</td><td>△（Task Scheduler）</td><td>✅</td><td>最低（常時課金）</td><td>❌</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「スケジュールベース + Python + コスト効率」= <strong>Azure Functions（Timer トリガー）</strong>。実行時のみ課金のサーバーレスが最適。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/azure-functions/functions-bindings-timer\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/azure-functions/functions-bindings-timer</a></li></ul></div>\n</div>"},{"num":51,"id":"q51","domain":"インフラストラクチャ設計","domain_code":"IS","domain_color":"#C50F1F","question_text":"【ApexCore Ltd. ケース スタディに基づく問題】\n\nApexCore Ltd. のケース スタディでは App1 について以下のデータ要件が定義されています：\n\n・App1 は各 Azure リージョンの複数の可用性ゾーンにデプロイされる\n・データは App1 インスタンスと同じ可用性ゾーン内にローカルに書き込まれること\n・いずれかの App1 インスタンスによって書き込まれたデータは、他のすべての App1 インスタンスから参照可能であること\n\nApp1 のインスタンスをホストする各可用性ゾーンにデプロイすべきものはどれですか？","choices":[{"text":"geo ゾーン冗長ストレージ (GZRS) を使用する Azure Storage アカウント","is_correct":false},{"text":"マルチリージョン書き込みを使用する Azure Cosmos DB","is_correct":true},{"text":"geo ゾーン冗長ストレージ (GZRS) を使用する Azure Data Lake ストア","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div か</div><div class=\"exp-block-body\"><strong>geo ゾーン冗長ストレージ（GZRS）を使用する Azure Storage アカウント：</strong> ストレージの冗長性オプション。複数リージョンからの同時書き込み（マルチマスター）は基本的にサポートしない ❌\n\n<strong>GZRS を使用する Azure Data Lake ストア：</strong> Data Lake は分析・バッチ処理向けのストレージ。複数リージョンからのリアルタイムな低レイテンシ書き込みには設計されていない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「複数リージョンから低レイテンシで書き込みたい」= Cosmos DB のマルチリージョン書き込み（マルチマスター）が唯一の選択肢です。\n\nGRS/GZRS は「リージョン障害時の読み取りフェールオーバー」であり、複数リージョンからの同時書き込みには対応していません。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>マルチリージョン書き込み</th><th>低レイテンシ読み書き</th><th>グローバル分散</th></tr></thead><tbody><tr><td class=\"cc\">Cosmos DB（マルチリージョン書き込み）✅</td><td>✅</td><td>✅</td><td>✅</td></tr><tr><td class=\"cc\">Azure Storage（GZRS）</td><td>❌</td><td>△（リード）</td><td>❌</td></tr><tr><td class=\"cc\">Azure Data Lake（GZRS）</td><td>❌</td><td>❌（バッチ向け）</td><td>❌</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「複数リージョンからの低レイテンシ同時書き込み」= <strong>Cosmos DB マルチリージョン書き込み</strong>。GRS/GZRS は書き込みのマルチリージョン化ではない。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/cosmos-db/multi-region-writes\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/cosmos-db/multi-region-writes</a></li></ul></div>\n</div>"},{"num":52,"id":"q52","domain":"インフラストラクチャ設計","domain_code":"IS","domain_color":"#C50F1F","question_text":"【ApexCore Ltd. ケース スタディに基づく問題】\n\nApexCore Ltd. のケース スタディでは App2 について以下の監視要件が定義されています：\n\n・App2 は Azure App Service アプリケーションです\n・アプリケーション トランザクションの実行時間を分析する監視が必要です\n・監視ソリューションはアプリケーション コードへの変更を必要としないこと\n\nApp2 の監視要件を満たすために推奨に含めるべきものはどれですか？","choices":[{"text":"Container Insights","is_correct":false},{"text":"Azure Ap 択肢は不正解か</div><div class=\"exp-block-body\"><strong>Container Insights：</strong> AKS や Azure Monitor コンテナー向けの<strong>インフラ レベル</strong>の監視（CPU・メモリ・ノード状態）。アプリケーション レベルのパフォーマンス・依存関係追跡には不向き ❌\n\n<strong>Microsoft Sentinel：</strong> セキュリティ情報・イベント管理（SIEM）とセキュリティ オーケストレーション（SOAR）。アプリのパフォーマンス監視ではなく、セキュリティ脅威の検出が目的 ❌\n\n<strong>VM Insights：</strong> 仮想マシンのパフォーマンス・プロセス依存関係の監視。コンテナー アプリの APM には対応していない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">監視サービスの「レイヤー」の違いを理解することが重要です：\n\n• <strong>Application Insights</strong>：アプリケーション レベル（コード・依存関係・例外）\n• <strong>Container Insights</strong>：コンテナー/インフラ レベル（CPU・メモリ・ノード）\n• <strong>VM Insights</strong>：VM レベル（OS パフォーマンス・プロセス）\n• <strong>Microsoft Sentinel</strong>：セキュリティ レベル（脅威検出・インシデント対応）</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">監視サービス</th><th>監視レイヤー</th><th>APM（アプリ性能）</th><th>コンテナー対応</th><th>セキュリティ</th></tr></thead><tbody><tr><td class=\"cc\">Application Insights ✅</td><td>アプリケーション</td><td>依存関係・例外</td><td>✅</td><td>❌</td></tr><tr><td class=\"cc\">Container Insights</td><td>コンテナー/インフラ</td><td>❌</td><td>✅</td><td>❌</td></tr><tr><td class=\"cc\">VM Insights</td><td>VM</td><td>❌</td><td>❌</td><td>❌</td></tr><tr><td class=\"cc\">Microsoft Sentinel</td><td>セキュリティ</td><td>❌</td><td>△</td><td>✅</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「コンテナー アプリのパフォーマンス監視・依存関係追跡・例外ログ」= <strong>Azure Application Insights</strong>。Container Insights はインフラ監視でアプリ APM は対象外。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/azure-monitor/app/app-insights-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/azure-monitor/app/app-insights-overview</a></li></ul></div>\n</div>"}];
const TOTAL = QUESTIONS.length;
const LTR = 'ABCDEFGHIJKLMNOP';
let state={}, filter='all', multiSel={}, displayChoices={};
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function initState(){
  const chk=document.getElementById('chk-shuf');
  const doShuf=chk&&chk.checked;
  state={};multiSel={};displayChoices={};
  QUESTIONS.forEach(q=>{
    state[q.id]={answered:false,correct:false};
    displayChoices[q.id]=doShuf?shuf([...q.choices]):[...q.choices];
  });
}
function filtered(){return filter==='all'?QUESTIONS:QUESTIONS.filter(q=>q.domain===filter);}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){
  const qs=filtered();
  document.getElementById('qwrap').innerHTML=qs.map(q=>renderQ(q)).join('');
  qs.forEach(q=>{if(state[q.id]?.answered)restoreQ(q);});
  updateProgress();
}
function renderQ(q){
  const isMulti=q.n_correct>1;
  const mbadge=isMulti?`<span class="mbadge">複数選択 (${q.n_correct}つ)</span>`:'';
  const mhint=isMulti?`<div class="multi-hint">⚡ ${q.n_correct}つの選択肢を選んでください</div>`:'';
  const choices=(displayChoices[q.id]||q.choices).map((c,i)=>`<button class="cbtn" id="c_${q.id}_${i}" onclick="onChoice('${q.id}',${i})"><span class="cltr">${LTR[i]}</span><span>${escH(c.text)}</span></button>`).join('');
  const sub=isMulti?`<button class="submit-btn" id="sub_${q.id}" onclick="submitMulti('${q.id}')">回答を確定する</button>`:'';
  return `<div class="qcard" id="card_${q.id}"><div class="qh"><span class="qnum">問 ${q.num}</span><span class="dbadge" style="background:${q.domain_color||'#0072C6'}">${q.domain}</span>${mbadge}</div><div class="qbody"><p class="qtext">${escH(q.question_text)}</p></div>${mhint}<div class="choices">${choices}</div>${sub}<div class="expanel" id="exp_${q.id}"><div id="rbadge_${q.id}"></div>${q.exp_html}</div></div>`;
}
function onChoice(qid,idx){
  if(state[qid]?.answered)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  if(q.n_correct>1){
    if(!multiSel[qid])multiSel[qid]=new Set();
    const btn=document.getElementById(`c_${qid}_${idx}`);
    if(multiSel[qid].has(idx)){multiSel[qid].delete(idx);btn.classList.remove('multi-selected');}
    else{if(multiSel[qid].size>=q.n_correct)return;multiSel[qid].add(idx);btn.classList.add('multi-selected');}
    const sub=document.getElementById(`sub_${qid}`);
    if(sub)sub.style.display=multiSel[qid].size>=q.n_correct?'block':'none';
  }else{
    state[qid]={answered:true,correct:(displayChoices[qid]||q.choices)[idx].is_correct};
    applyAnswer(q,[idx]);
  }
}
function submitMulti(qid){
  if(state[qid]?.answered)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  const sel=[...(multiSel[qid]||new Set())];
  const cset=new Set((displayChoices[qid]||q.choices).map((c,i)=>c.is_correct?i:-1).filter(i=>i>=0));
  state[qid]={answered:true,correct:sel.length===cset.size&&sel.every(i=>cset.has(i))};
  applyAnswer(q,sel);
}
function applyAnswer(q,sel){
  const sset=new Set(sel);const isOk=state[q.id].correct;
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);if(!btn)return;
    btn.disabled=true;btn.classList.remove('multi-selected');
    if(sset.has(i))btn.classList.add(c.is_correct?'correct':'wrong');
    if(c.is_correct&&!sset.has(i))btn.classList.add('reveal');
  });
  document.getElementById(`card_${q.id}`).classList.add(isOk?(q.n_correct>1?'multi-ok':'ok'):'ng');
  document.getElementById(`rbadge_${q.id}`).innerHTML=isOk
    ?`<div class="rbadge ${q.n_correct>1?'multi-ok':'ok'}">${q.n_correct>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説で正解・理由を確認しましょう</div>';
  document.getElementById(`exp_${q.id}`).style.display='block';
  const sub=document.getElementById(`sub_${q.id}`);if(sub)sub.style.display='none';
  updateProgress();
  setTimeout(()=>document.getElementById(`exp_${q.id}`).scrollIntoView({behavior:'smooth',block:'nearest'}),120);
}
function restoreQ(q){
  const s=state[q.id];if(!s?.answered)return;
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);if(!btn)return;
    btn.disabled=true;if(c.is_correct)btn.classList.add(s.correct?'correct':'reveal');
  });
  document.getElementById(`card_${q.id}`).classList.add(s.correct?(q.n_correct>1?'multi-ok':'ok'):'ng');
  const exp=document.getElementById(`exp_${q.id}`);if(exp)exp.style.display='block';
  const badge=document.getElementById(`rbadge_${q.id}`);
  if(badge)badge.innerHTML=s.correct
    ?`<div class="rbadge ${q.n_correct>1?'multi-ok':'ok'}">${q.n_correct>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説で正解・理由を確認しましょう</div>';
}
function filterDomain(d){
  filter=d;
  document.querySelectorAll('.dbtn').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  render();window.scrollTo({top:0});
}
function updateProgress(){
  const ans=Object.values(state).filter(s=>s.answered).length;
  const cor=Object.values(state).filter(s=>s.correct).length;
  document.getElementById('pbar').style.width=(ans/TOTAL*100)+'%';
  document.getElementById('hdrScore').textContent=`${cor}/${TOTAL}`;
  document.getElementById('hdrPct').textContent=`正解率 ${ans>0?Math.round(cor/ans*100):0}%`;
}
function showResults(){
  const cor=Object.values(state).filter(s=>s.correct).length;
  const pct=Math.round(cor/TOTAL*100);
  const ds={};
  QUESTIONS.forEach(q=>{
    if(!ds[q.domain])ds[q.domain]={t:0,c:0,color:q.domain_color||'#333'};
    ds[q.domain].t++;if(state[q.id]?.correct)ds[q.domain].c++;
  });
  document.getElementById('mscore').textContent=`${cor}/${TOTAL}`;
  document.getElementById('mpct').textContent=`正解率 ${pct}%`;
  const SVG_TROPHY='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 21 12 17 16 21"/><line x1="12" y1="17" x2="12" y2="11"/><path d="M18 6H6l1-4h10l1 4z"/><path d="M6 6c0 7 6 11 6 11s6-4 6-11"/></svg>';
  const SVG_UP='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>';
  const SVG_ZAP='<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
  const SVG_BOOK='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
  let icon=SVG_BOOK,msg='';
  if(pct>=80){icon=SVG_TROPHY;msg='合格圏内！本番でも自信を持って！';}
  else if(pct>=70){icon=SVG_UP;msg='あと少し！弱点ドメインを集中的に復習しよう。';}
  else if(pct>=50){icon=SVG_ZAP;msg='「間違えやすいポイント」を重点的に確認しよう。';}
  else{icon=SVG_BOOK;msg='各解説の「なぜ正解か」「なぜ不正解か」をしっかり読もう！';}
  document.getElementById('micon').innerHTML=icon;
  document.getElementById('mmsg').textContent=msg;
  document.getElementById('mdomains').innerHTML=Object.entries(ds).map(([d,s])=>{
    const p=Math.round(s.c/s.t*100);
    return `<div class="m-ditem"><div class="m-dname">${d}</div><div class="m-dval" style="color:${s.color}">${s.c}/${s.t} <span style="font-size:13px;font-weight:500;color:#888">(${p}%)</span></div></div>`;
  }).join('');
  document.getElementById('modal').classList.add('show');
}
function modalClose(e){if(!e||e.target.id==='modal')document.getElementById('modal').classList.remove('show');}
function resetAll(){document.getElementById('modal').classList.remove('show');initState();render();window.scrollTo({top:0,behavior:'smooth'});}
window.addEventListener('scroll',()=>document.getElementById('scrollTop').classList.toggle('show',window.scrollY>400));
initState();render();
</script>
