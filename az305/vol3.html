t-hubs\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/azure-functions/functions-bindings-event-hubs</a></li></ul></div>\n</div>"}, {"num": 3, "id": "q3", "domain": "データストレージ設計", "domain_code": "DS", "domain_color": "#0078D4", "question_text": "機密データ用の Azure ストレージ ソリューションを設計しています。データには毎日アクセスされ、データ量の合計は 10 GB 未満です。\n\nストレージ ソリューションは以下の要件を満たす必要があります：\n\n・ストレージに書き込まれたすべてのデータは最低 5 年間保持されること\n・データが書き込まれた後は読み取り専用となり、保持期間中は変更や削除が許可されないこと\n・5 年間の保持期間が経過した後は、データを削除できること\n\nどのストレージ ソリューションを推奨しますか？", "choices": [{"text": "アーカイブ アクセス層用の Blob ストレージを持つ汎用 v2", "is_correct": false}, {"text": "クール アクセス層用の Blob ストレージを持つ汎用 v2", "is_correct": false}, {"text": "ホット アクセス層用の Blob ストレージを持つ汎用 v2", "is_correct": true}], "correct_indices": [2], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">機密データ＋毎日アクセス＋書込み後変更不可</text><rect x=\"20\" y=\"35\" width=\"200\" height=\"130\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#888\" stroke-width=\"1\"/><text x=\"120\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#888\">要件</text><text x=\"120\" y=\"60\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・毎日アクセス（高頻度）</text><text x=\"120\" y=\"77\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・10 GB 未満</text><text x=\"120\" y=\"94\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・書込み後変更不可（WORM）</text><text x=\"120\" y=\"111\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・機密データ</text><rect x=\"240\" y=\"35\" width=\"165\" height=\"60\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"322\" y=\"57\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">ホット アクセス層</text><text x=\"322\" y=\"71\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">毎日アクセス → Hot最適</text><text x=\"322\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">汎用 v2 ストレージ</text><rect x=\"240\" y=\"108\" width=\"165\" height=\"60\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"322\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">コンテナーアクセスポリシー</text><text x=\"322\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">WORM(書込一度のみ)</text><text x=\"322\" y=\"158\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">変更・削除を防止</text><rect x=\"430\" y=\"35\" width=\"160\" height=\"60\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"510\" y=\"57\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">クール層</text><text x=\"510\" y=\"71\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">低頻度向け。毎日</text><text x=\"510\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">アクセスはコスト高</text><rect x=\"430\" y=\"108\" width=\"160\" height=\"60\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"510\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">コンテナーアクセスレベル</text><text x=\"510\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">公開/非公開設定のみ</text><text x=\"510\" y=\"158\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">変更防止機能なし</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">アクセス層:Hot=高頻度 / ポリシー:コンテナーアクセスポリシー=WORM的な変更防止</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：①毎日アクセスされる（高頻度）、②機密データの暗号化が必要、③10 GB 未満（少量）、④最小コスト。\n\n<strong>汎用 v2 + ホット アクセス層</strong>：毎日アクセスするデータにはホット層が最適（アクセスコストが最安）。少量データのためストレージコストも低く抑えられます。汎用 v2 は Azure Storage Encryption（SSE）による保存時暗号化をデフォルトでサポートし、CMK（カスタマー マネージド キー）にも対応。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>アーカイブ アクセス層：</strong> めったにアクセスしないデータ向け（リハイドレーションに最大 15 時間）。毎日アクセスするデータには致命的に不適切\n<strong>クール アクセス層：</strong> 30 日以上アクセスしないデータ向け。毎日アクセスするとアクセスコストがホット層より高くなり、トータルコストが増加する</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">アクセス層の選択は「アクセス頻度」で決まります：\n\n• <strong>ホット</strong>：毎日〜週 1 回以上 → ストレージコスト高・アクセスコスト安\n• <strong>クール</strong>：月 1 回程度 → ストレージコスト中・アクセスコスト中\n• <strong>コールド</strong>：年 1〜2 回\n• <strong>アーカイブ</strong>：ほとんどアクセスなし → ストレージコスト最安・アクセスコスト最高</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">アクセス層</th><th>アクセス頻度の目安</th><th>ストレージコスト</th><th>アクセスコスト</th><th>最小保存期間</th></tr></thead><tbody><tr><td class=\"cc\">ホット <span class=\"tbl-ok\">○</span></td><td>毎日〜頻繁</td><td>高</td><td>最安</td><td>なし</td></tr><tr><td class=\"cc\">クール</td><td>月 1 回程度</td><td>中</td><td>中</td><td>30 日</td></tr><tr><td class=\"cc\">コールド</td><td>年 1〜2 回</td><td>低</td><td>高め</td><td>90 日</td></tr><tr><td class=\"cc\">アーカイブ</td><td>ほぼアクセスなし</td><td>最安</td><td>最高</td><td>180 日</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「毎日アクセス + 暗号化 + 最小コスト」= <strong>汎用 v2 + ホット層</strong>。頻繁なアクセスにはホット層が最もコスト効率が良い。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/blobs/access-tiers-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/storage/blobs/access-tiers-overview</a></li></ul></div>\n</div>"}, {"num": 4, "id": "q4", "domain": "データストレージ設計", "domain_code": "DS", "domain_color": "#0078D4", "question_text": "機密データ用の Azure ストレージ ソリューションを設計しています。データには毎日アクセスされ、データ量の合計は 10 GB 未満です。\n\nストレージ ソリューションは以下の要件を満たす必要があります：\n\n・ストレージに書き込まれたすべてのデータは最低 5 年間保持されること\n・データが書き込まれた後は読み取り専用となり、保持期間中は変更や削除が許可されないこと\n・5 年間の保持期間が経過した後は、データを削除できること\n\n不変性ポリシーを実装するために使用すべきものはどれですか？", "choices": [{"text": "コンテナー アクセス レベル", "is_correct": false}, {"text": "コンテナー アクセス ポリシー", "is_correct": true}, {"text": "ストレージ アカウント リソース ロック", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">機密データ＋毎日アクセス＋書込み後変更不可</text><rect x=\"20\" y=\"35\" width=\"200\" height=\"130\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#888\" stroke-width=\"1\"/><text x=\"120\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#888\">要件</text><text x=\"120\" y=\"60\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・毎日アクセス（高頻度）</text><text x=\"120\" y=\"77\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・10 GB 未満</text><text x=\"120\" y=\"94\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・書込み後変更不可（WORM）</text><text x=\"120\" y=\"111\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・機密データ</text><rect x=\"240\" y=\"35\" width=\"165\" height=\"60\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"322\" y=\"57\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">ホット アクセス層</text><text x=\"322\" y=\"71\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">毎日アクセス → Hot最適</text><text x=\"322\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">汎用 v2 ストレージ</text><rect x=\"240\" y=\"108\" width=\"165\" height=\"60\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"322\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">コンテナーアクセスポリシー</text><text x=\"322\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">WORM(書込一度のみ)</text><text x=\"322\" y=\"158\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">変更・削除を防止</text><rect x=\"430\" y=\"35\" width=\"160\" height=\"60\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"510\" y=\"57\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">クール層</text><text x=\"510\" y=\"71\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">低頻度向け。毎日</text><text x=\"510\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">アクセスはコスト高</text><rect x=\"430\" y=\"108\" width=\"160\" height=\"60\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"510\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">コンテナーアクセスレベル</text><text x=\"510\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">公開/非公開設定のみ</text><text x=\"510\" y=\"158\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">変更防止機能なし</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">アクセス層:Hot=高頻度 / ポリシー:コンテナーアクセスポリシー=WORM的な変更防止</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「特定のユーザーのみがコンテナー内の BLOB にアクセスできるよう、<strong>時間ベースで制御</strong>する」。\n\n<strong>コンテナー アクセス ポリシー（Stored Access Policy）</strong>：SAS トークンに有効期限・権限を定義するポリシーです。ポリシーを更新・削除することで SAS を即座に無効化・変更でき、特定ユーザーへの時間制限付きアクセスを細かく管理できます。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>コンテナー アクセス レベル：</strong> コンテナー全体を「プライベート」「Blob（匿名読み取り）」「コンテナー（完全匿名）」に設定するもの。<strong>特定のユーザーに限定した制御はできない</strong>\n<strong>ストレージ アカウント リソース ロック：</strong> リソースの削除・変更を防ぐ管理操作のロック。アクセス制御（誰が読み書きできるか）とは全く別の機能</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「コンテナー アクセス レベル」と「コンテナー アクセス ポリシー」は名前が似ていて非常に混同しやすいです：\n\n• <strong>アクセス レベル</strong>：公開範囲の設定（プライベート・Blob 公開・完全公開）\n• <strong>アクセス ポリシー（Stored Access Policy）</strong>：SAS ベースの細かいアクセス制御（期限・権限・失効）\n\n特定ユーザーへの時間制限アクセス → Stored Access Policy を選ぶ。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>機能</th><th>アクセス レベル</th><th class=\"cc\">Stored Access Policy <span class=\"tbl-ok\">○</span></th><th>リソース ロック</th></tr></thead><tbody><tr><td>目的</td><td>コンテナーの公開範囲設定</td><td class=\"cc\">SAS の期限・権限管理</td><td>リソース操作の制限</td></tr><tr><td>特定ユーザー制御</td><td><span class=\"tbl-ng\">×</span></td><td class=\"cc\"><span class=\"tbl-ok\">○</span></td><td><span class=\"tbl-ng\">×</span></td></tr><tr><td>時間制限</td><td><span class=\"tbl-ng\">×</span></td><td class=\"cc\"><span class=\"tbl-ok\">○</span></td><td><span class=\"tbl-ng\">×</span></td></tr><tr><td>SAS の即時失効</td><td><span class=\"tbl-ng\">×</span></td><td class=\"cc\"><span class=\"tbl-ok\">○</span>（ポリシー削除で無効化）</td><td><span class=\"tbl-ng\">×</span></td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「特定ユーザー + 時間制限 + 即時失効」= <strong>コンテナー アクセス ポリシー（Stored Access Policy）</strong>。アクセス レベルは公開範囲設定で別物。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/common/storage-stored-access-policy-define-dotnet\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/storage/common/storage-stored-access-policy-define-dotnet</a></li></ul></div>\n</div>"}, {"num": 5, "id": "q5", "domain": "データストレージ設計", "domain_code": "DS", "domain_color": "#0078D4", "question_text": "オンプレミス環境には 500 GB のデータを含む Server1 というファイル サーバーがあります。\n\nAzure Data Factory を使用して Server1 から Azure Storage にデータをコピーする必要があります。\n\n新しいデータ ファクトリーを作成しました。\n\n次に行うべき操作は何ですか？\n\n「Server1 から ___________________________________________。」", "choices": [{"text": "Azure File Sync エージェントをインストールする", "is_correct": false}, {"text": "セルフホステッド統合ランタイムをインストールする", "is_correct": true}, {"text": "ファイル サーバー リソース マネージャー ロール サービスをインストールする", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">オンプレ → ADF → Azure Storage（Q5-6）</div><svg viewBox=\"0 0 740 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:740px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"740\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polyg n<line x1=\"354\" y1=\"75\" x2=\"380\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"370\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">コピー</text>\n<line x1=\"474\" y1=\"75\" x2=\"500\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"490\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">転送</text>\n</svg></div></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">SHIR のインストール後、実際にデータをオンプレミスから Azure にコピーするには<strong>パイプラインを作成</strong>します。\n\nADF パイプラインは「コピー アクティビティ」でソース（Server1）からシンク（Azure Storage）へのデータ移動を定義し、スケジュール実行・トリガー設定が可能です。SHIR を使ったリンク サービスで Server1 に接続します。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Import/Export ジョブ：</strong> 物理ディスクを Microsoft に郵送して大量データを転送するサービス。ADF を使う場合には不要\n<strong>SSIS 統合ランタイム：</strong> SQL Server Integration Services パッケージを ADF で実行するための IR。ファイルの単純コピーには不要（SSIS は ETL パッケージ専用）</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Q5（SHIR インストール）と Q6（パイプライン作成）は「順序」を問う連問です。両方が必要です：\n\n1. <strong>SHIR インストール</strong> → オンプレミスへの接続を確立\n2. <strong>パイプライン作成</strong> → 実際のコピー処理を定義・実行</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">ADF でオンプレミス → Azure のデータコピー：①<strong>SHIR インストール</strong>（接続）→ ②<strong>パイプライン作成</strong>（コピー実行）の 2 ステップ。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/data-factory/tutorial-hybrid-copy-portal\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/data-factory/tutorial-hybrid-copy-portal</a></li></ul></div>\n</div>"}, {"num": 7, "id": "q7", "domain": "ビジネス継続性設計", "domain_code": "BC", "domain_color": "#107C10", "question_text": "組織は、オンプレミスのデータ センターで販売、財務、レポート アプリケーションをホストする仮想マシンに対して、以下のビジネス継続性とディザスター リカバリー (BCDR) 要件を定義しています：\n\n・販売アプリケーション：二次オンプレミス データ センターへのフェールオーバーをサポートすること\n・レポート アプリケーション：日次粒度でのポイントインタイム データ リカバリーをサポートし、RTO は 8 時間であること\n・財務アプリケーション：7 年間のデータ保持が必要で、災害発生時は Azure から実行でき、RTO は 10 分であること\n\n販売アプリケーションの要件を満たすために使用すべきサービスはどれですか？", "choices": [{"text": "Azure Backup のみ", "is_correct": false}, {"text": "Azure Site Recovery のみ", "is_correct": true}, {"text": "Azure Site Recovery と Azure Backup", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">BCDR: Site Recovery + Backup（Q7-9）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"146\" y=\"26\" width=\"108\" height=\"98\" rx=\"8\" fill=\"#546E7A\" fill-opacity=\"0.06\" stroke=\"#546E7A\" stroke-width=\"1\" stroke-dasharray=\"5,3\"/>\n<text x=\"154\" y=\"40\" font-size=\"8.5\" font-weight=\"600\" fill=\"#546E7A\" font-family=\"Segoe UI,Arial,sans-serif\">オンプレミス DC</text>\n<rect x=\"386\" y=\"26\" width=\"108\" height=\"98\" rx=\"8\" fill=\"#0072C6\" fill-opacity=\"0.06\" stroke=\"#0072C6\" stroke-width=\"1\" stroke-dasharray=\"5,3\"/>\n<text x=\"394\" y=\"40\" font-size=\"8.5\" font-weight=\"600\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">Azure / xp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">ASR と Backup は「代替関係」ではなく「補完関係」です。それぞれ異なる目的のために設計されており、両方の要件がある場合は両方使います。\n\nASR は「VM をまるごと別リージョンに持っていく」もの。Backup は「特定の時点の特定ファイルを取り出す」もの。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">DR フェールオーバー + 個別ファイル復元の両方が要件 → <strong>ASR + Backup の両方</strong>が必要。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/backup/backup-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/backup/backup-overview</a></li></ul></div>\n</div>"}, {"num": 9, "id": "q9", "domain": "ビジネス継続性設計", "domain_code": "BC", "domain_color": "#107C10", "question_text": "組織は、オンプレミスのデータ センターで販売、財務、レポート アプリケーションをホストする仮想マシンに対して、以下のビジネス継続性とディザスター リカバリー (BCDR) 要件を定義しています：\n\n・販売アプリケーション：二次オンプレミス データ センターへのフェールオーバーをサポートすること\n・レポート アプリケーション：日次粒度でのポイントインタイム データ リカバリーをサポートし、RTO は 8 時間であること\n・財務アプリケーション：7 年間のデータ保持が必要で、災害発生時は Azure から実行でき、RTO は 10 分であること\n\nレポート アプリケーションの要件を満たすために使用すべきサービスはどれですか？", "choices": [{"text": "Azure Backup のみ", "is_correct": true}, {"text": "Azure Site Recovery のみ", "is_correct": false}, {"text": "Azure Site Recovery と Azure Backup", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">BCDR: Site Recovery + Backup（Q7-9）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n color": "#107C10", "question_text": "注意：この問題は同じシナリオを使用する関連問題のセットの一部です。各問題は要件を満たす場合と満たさない場合のある異なるソリューションを提示します。\n\n複数の Azure リージョンにまたがって、Azure Web アプリの複数のインスタンスをデプロイする計画があります。\n\n以下のレプリケーションと可用性の要件を満たすアクセス ソリューションを設計する必要があります：\n\n・ソリューションはレート制限をサポートすること\n・リクエストはデプロイされたすべてのインスタンスに分散されること\n・リージョンの停止が発生してもユーザーがアプリケーションにアクセスできること\n\n提案されたソリューション：アプリへのアクセスを提供するために Azure Load Balancer を使用する。\n\nこのソリューションは要件を満たしていますか？", "choices": [{"text": "Yes（はい）", "is_correct": false}, {"text": "No（いいえ）", "is_correct": true}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">マルチリージョン Web App（Q11-14）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"156\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#107C10\" stroke-width=\"1.5\"/>\n<rect x=\"162\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#107C10\" fill-opacity=\"0.18\"/>\n<image href=\"data:image/svg+xml;base64,PHN2ZyBpZD0iYTE4YjkwNWQtOTNjNi00ZmVlLWJhNWItNjk5ZTI1NjJlMDBmIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxOCIgaGVpZ2h0PSIxOCIgdmlld0JveD0iMCAwIDE4IDE4Ij48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImIwMmM3YTIwLTAxZGEtNGRhZi05MWI5LWUxMTUyODQxOGRmYyIgeDE9IjkiIHkxPSIxNy41IiB4Mj0iOSIgeTI9IjAuNSIgZ3JhZGllbnRVbml0cz0idXNlclNwYWNlT25Vc2UiPjxzdG9wIG9mZnNldD0iMC4xNiIgc3RvcC1jb2xvcj0iIzZmNGJiMiIgLz48c3RvcCBvZmZzZXQ9IjAuMzIiIHN0b3AtY29sb3I9IiM3NDUwYjUiIC8+PHN0b3Agb2Zmc2V0PSIwLjUxIiBzd =\"url(#arr)\"/>\n</svg></div></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">シナリオ：「複数リージョンにまたがる App + SQL + Key Vault の DR 構成。提示されたソリューション案が全要件を満たすか？」\n\n提示されたソリューション（Traffic Manager のルーティング設定のみ）では、SQL Database の自動フェールオーバーや Key Vault の DR 設定が含まれておらず、要件をすべて満たさないため <strong>No が正解</strong>です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Yes を選んだ場合：</strong> Traffic Manager 設定だけで全コンポーネントの DR が完成すると誤解している。アプリ・DB・Key Vault それぞれの DR が必要</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">マルチリージョン DR の全要件チェックリスト：\n• Traffic Manager でのトラフィック制御\n• SQL Database の自動フェールオーバー グループ\n• Key Vault のリージョン冗長（または複数リージョンへの復元）\n• App Service の複数リージョン展開\n\nすべてが揃って初めて Yes になります。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Yes/No 問題：提示されたソリューションが要件を<strong>すべて</strong>満たすかを慎重に確認。一つでも欠けたら No。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/architecture/reference-architectures/app-service-web-app/multi-region\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/architecture/reference-architectures/app-service-web-app/multi-region</a></li></ul></div>\n</div>"}, {"num": 12, "id": "q12", "domain": "ビジネス継続性設計", "domain_code": "BC", "domain_color": "#107C10", "question_text": "注意：この問題は同じシナリオを使用する関連問題のセットの一部です。各問題は要件を満たす場合と満たさない場合のある異なるソリューションを提示します。\n\n複数の Azure リージョンにまたがって、Azure Web アプリの複数のインスタンスをデプロイする計画があります。\n\n以下のレプリケーションと可用性の要件を満たすアクセス ソリューションを設計する必要があります：\n\n・ソリューションはレート制限をサポートすること\n・リクエストはデプロイされたすべてのインスタンスに分散されること\n・リージョンの停止が発生してもユーザーがアプリケーションにアクセスできること\n\n提案されたソリューション：アプリへのアクセスを提供するために Azure Traffic Manager を使用する。\n\nこのソリューションは要件を満たしていますか？", "choices": [{"text": "Yes（はい）", "is_correct": false}, {"text": "No（いいえ）", "is_correct": true}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">マルチリージョン Web App（Q11-14）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"156\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#107C10\" stroke-width=\"1.5\"/>\n<rect x=\"162\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#107C10\" fill-opacity=\"0.18\"/>\n<image href=\"data:image/svg+xml;base64,PHN2ZyBpZD0iYTE4YjkwNWQtOTNjNi00ZmVlLWJhNWItNjk5ZTI1NjJlMDBmIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxOCIgaGVpZ2h0PSIxOCIgdmlld0JveD0iMCAwIDE4IDE4Ij48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImIwMmM3YTIwLTAxZGEtNGRhZi05MWI5LWUxMTUyODQxOGRmYyIgeDE9IjkiIHkxPSIxNy41IiB4Mj0iOSIgeTI9IjAuNSIgZ3JhZGllbnRVbml0cz0idXNlclNwYWNlT25Vc2UiPjxzdG9wIG9mZnNldD0iMC4xNiIgc3RvcC1jb2xvcj0iIzZmNGJiMiIgLz48c3RvcCBvZmZzZXQ9IjAuMzIiIHN0b3AtY29sb3I9IiM3NDUwYjUiIC8+PHN0b3Agb2Zmc2V0PSIwLjUxIiBzdG9wLWNvbG9yPSIjODI1ZGJmIiAvPjxzdG9wIG9mZnNldD0iMC43MiIgc3RvcC1jb2xvcj0iIzlhNzJjZSIgLz48c3RvcCBvZmZzZXQ9IjAuOTQiIHN0b3AtY29sb3I9IiNiYjkwZTQiIC8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjYzY5YWViIiAvPjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPjx0aXRsZT5JY29uLW5ldHdvcmtpbmctNjU8L3RpdGxlPjxwYXRoIGQ9Ik0xMi4yOS41SDUuNzFhLjU2LjU2LDAsMCwwLS40LjE3TC42Nyw1LjMxYS41Ni41NiwwLDAsMC0uMTcuNHY2LjU4YS41Ni41NiwwLDAsMCwuMTcuNGw0LjY0LDQuNjRhLjU2LjU2LDAsMC \"><strong>Yes を選んだ場合：</strong> SQL のレプリケーション設定だけを見て「DR が設定できた」と判断し、Key Vault や Traffic Manager 設定を見落としているパターン</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「SQL のフェールオーバーが設定できた」= 「DR 構成が完成した」ではありません。複合的なシステムの DR は各コンポーネントすべてのフェールオーバーが必要です。\n\nKey Vault はリージョン障害時に読み取り専用モードになるため、DR 設計で見落とされやすい要素です。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">マルチリージョン DR は一つのサービスだけでは完成しない。アプリ・DB・Key Vault・ネットワーク全体で設計が必要。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/sql-database/sql-database-auto-failover-group\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/sql-database/sql-database-auto-failover-group</a></li></ul></div>\n</div>"}, {"num": 13, "id": "q13", "domain": "ビジネス継続性設計", "domain_code": "BC", "domain_color": "#107C10", "question_text": "注意：この問題は同じシナリオを使用する関連問題のセットの一部です。各問題は要件を満たす場合と満たさない場合のある異なるソリューションを提示します。\n\n複数の Azure リージョンにまたがって、Azure Web アプリの複数のインスタンスをデプロイする計画があります。\n\n以下のレプリケーションと可用性の要件を満たすアクセス ソリューションを設計する必要があります：\n\n・ソリューションはレート制限をサポートすること\n・リクエストはデプロイされたすべてのインスタンスに分散されること\n・リージョンの停止が発生してもユーザーがアプリケーションにアクセスできること\n\n提案されたソリューション：アプリへのアクセスを提供するために Azure Front Door を使用する。\n\nこのソリューションは要件を満たしていますか？", "choices": [{"text": "Yes（はい）", "is_correct": true}, {"text": "No（いいえ）", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">マルチリージョン Web App（Q11-14）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n fs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/architecture/reference-architectures/app-service-web-app/multi-region\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/architecture/reference-architectures/app-service-web-app/multi-region</a></li></ul></div>\n</div>"}, {"num": 14, "id": "q14", "domain": "インフラストラクチャ設計", "domain_code": "IS", "domain_color": "#C50F1F", "question_text": "注意：この問題は同じシナリオを使用する関連問題のセットの一部です。各問題は要件を満たす場合と満たさない場合のある異なるソリューションを提示します。\n\n複数の Azure リージョンにまたがって、Azure Web アプリの複数のインスタンスをデプロイする計画があります。\n\n以下のレプリケーションと可用性の要件を満たすアクセス ソリューションを設計する必要があります：\n\n・ソリューションはレート制限をサポートすること\n・リクエストはデプロイされたすべてのインスタンスに分散されること\n・リージョンの停止が発生してもユーザーがアプリケーションにアクセスできること\n\n提案されたソリューション：アプリへのアクセスを提供するために Azure Application Gateway を使用する。\n\nこのソリューションは要件を満たしていますか？", "choices": [{"text": "Yes（はい）", "is_correct": false}, {"text": "No（いいえ）", "is_correct": true}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"eb eb-ng\"><div class=\"eb-lbl\">なぜ不正解なのか</div><div class=\"eb-body\">Azure Application Gateway は<strong>リージョナルロードバランサー</strong>です。単一リージョン内でのトラフィック分散・レート制限（WAF）は可能ですが、<strong>複数リージョンにまたがったトラフィック分散</strong>や<strong>リージョン障害時のフェールオーバー</strong>はサポートしていません。要件②③を満たせないため <strong>No（いいえ）</strong> が正解です。</div></div><div class=\"eb eb-ok\"><div class=\"eb-lbl\">正解の根拠</div><div class=\"eb-body\"><table class=\"ctbl\"><thead><tr><th>サービス</th><th>レート制限</th><th>マルチリージョン分散</th><th>リージョン障害フェールオーバー</th><th>判定</th></tr></thead><tbody><tr><td>Application Gateway</td><td>○（WAF）</td><td><strong>×</strong></td><td><strong>×</strong></td><td><span class=\"mk-ng\">No</span></td></tr><tr><td>Traffic Manager</td><td><strong>×</strong></td><td>○</td><td>○</td><td><span class=\"mk-ng\">No</span></td></tr><tr><td>Front Door</td><td>○</td><td>○</td><td>○</td><td><span class=\"mk-ok\">Yes</span></td></tr></tbody></table>Application Gateway はリージョン内専用。グローバル分散・フェールオーバーには Azure Front Door または Traffic Manager が必要です。</div></div><div class=\"eb eb-tip\"><div class=\"eb-lbl\">試験ポイント</div><div class=\"eb-body\">「リージョン停止でもアクセス可能」という要件が出たら、<strong>グローバルサービス（Front Door / Traffic Manager）</strong>が必須。Application Gateway は常にリージョナル限定と覚えましょう。</div></div>"}, {"num": 15, "id": "q15", "domain": "インフラストラクチャ設計", "domain_code": "IS", "domain_color": "#C50F1F", "question_text": "Linux コンピューティング ノードで 2 種類のジョブを実行するコスト最適化された Azure Batch ソリューションを設計しています。\n\n・第 1 ジョブ：開発環境で使用される短時間タスク\n・第 2 ジョブ：適時完了が必要な本番環境で使用される長時間の Message Passing Interface (MPI) ワークロード\n\n各ジョブに適した Azure Batch プール タイプとノード タイプを推奨する必要があります。提案されたソリューションは以下を満たす必要があります：\n\n・コンピューティング コストを最小化すること\n・適用可能な場合は Azure ハイブリッド特典を使用すること\n\n第 1 ジョブに対して推奨すべきものはどれですか？", "choices": [{"text": "Batch サービスと専用仮想マシン", "is_correct": false}, {"text": "ユーザー サブスクリプションと専用仮想マシン", "is_correct": false}, {"text": "ユーザー サブスクリプションと低優先度仮想マシン", "is_correct": true}], "correct_indices": [2], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">Azure Batch: プール割り当てモード × VM 優先度</text><rect x=\"20\" y=\"35\" width=\"200\" height=\"55\" rx=\"8\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"2\"/><text x=\"120\" y=\"54\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#0072C6\">第1ジョブ（開発）</text><text x=\"120\" y=\"68\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">短時間タスク / コスト優先</text><text x=\"120\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">中断許容できる</text><rect x=\"20\" y=\"105\" width=\"200\" height=\"55\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"120\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">第2ジョブ（本番）</text><text x=\"120\" y=\"138\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">適時完了必要</text><text x=\"120\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">中断不可</text><rect x=\"280\" y=\"35\" width=\"200\" height=\"55\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"380\" y=\"54\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">ユーザーサブスクリプション</text><text x=\"380\" y=\"68\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">+ 低優先度 VM</text><text x=\"380\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">スポット VM コスト大幅削減 (Q15)</text><rect x=\"280\" y=\"105\" width=\"200\" height=\"55\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"380\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Batch サービス</text><text x=\"380\" y=\"138\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">+ 専用 VM</text><text x=\"380\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">中断なし・安定実行 (Q16)</text><rect x=\"500\" y=\"35\" width=\"180\" height=\"50\" rx=\"6\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"1.5\"/><text x=\"590\" y=\"64\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">低優先度: 最大90%コスト削減 / 中断リスクあり</text><rect x=\"500\" y=\"105\" width=\"180\" height=\"50\" rx=\"6\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"1.5\"/><text x=\"590\" y=\"134\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">専用VM: 常時確保 / 高コスト</text><line x1=\"220\" y1=\"62\" x2=\"278\" y2=\"62\" stroke=\"#107C10\" stroke-width=\"2\" marker-end=\"url(#ag)\"/><line x1=\"220\" y1=\"132\" x2=\"278\" y2=\"132\" stroke=\"#107C10\" stroke-width=\"2\" marker-end=\"url(#ag)\"/><text x=\"350\" y=\"180\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">低優先度VM=スポットVM相当（安価・中断あり）/ 専用VM=確実（高コスト）</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">第 1 ジョブ（開発環境の短時間タスク）の要件：コスト最小化、中断されても問題なし。\n\n<strong>ユーザー サブスクリプション + 低優先度 VM（スポット VM）</strong>：Azure の余剰キャパシティを使うため通常の 60〜80% 割引。開発用の短時間タスクで中断が許容できるため最適です。ユーザー サブスクリプション モードで Azure Spot VM の機能をフル活用できます。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Batch サービス + 専用 VM：</strong> 専用 VM は常時予約済みでコストが高い。開発の短時間タスクには過剰\n<strong>ユーザー サブスクリプション + 専用 VM：</strong> スポット VM を使わないため割引なし。コスト最適化の要件に反する</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Azure Batch のプール割り当てモードの違い：\n\n• <strong>Batch サービス モード</strong>：Microsoft 管理のサブスクリプションに VM が作成される。シンプルだが低優先度 VM の種類が限定的\n• <strong>ユーザー サブスクリプション モード</strong>：自分のサブスクリプションに VM が作成される。Azure Spot VM の完全な機能が使える</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">構成</th><th>コスト</th><th>中断リスク</th><th>適した用途</th></tr></thead><tbody><tr><td class=\"cc\">ユーザーサブスクリプション + 低優先度 VM <span class=\"tbl-ok\">○</span></td><td>最安（最大 80% 割引）</td><td>あり（許容可）</td><td>開発・短時間タスク</td></tr><tr><td class=\"cc\">Batch サービス + 専用 VM</td><td>高</td><td>なし</td><td>本番・継続処理</td></tr><tr><td class=\"cc\">ユーザーサブスクリプション + 専用 VM</td><td>高</td><td>なし</td><td>本番（自分の VM 管理）</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「コスト最小化 + 中断許容 + 開発タスク」= <strong>低優先度（スポット）VM</strong>。最大 80% 割引だが随時中断される可能性あり。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/batch/batch-spot-vms\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/batch/batch-spot-vms</a></li></ul></div>\n</div>"}, {"num": 16, "id": "q16", "domain": "インフラストラクチャ設計", "domain_code": "IS", "domain_color": "#C50F1F", "question_text": "Linux コンピューティング ノードで 2 種類のジョブを実行するコスト最適化された Azure Batch ソリューションを設計しています。\n\n・第 1 ジョブ：開発環境で使用される短時間タスク\n・第 2 ジョブ：適時完了が必要な本番環境で使用される長時間の Message Passing Interface (MPI) ワークロード\n\n各ジョブに適した Azure Batch プール タイプとノード タイプを推奨する必要があります。提案されたソリューションは以下を満たす必要があります：\n\n・コンピューティング コストを最小化すること\n・適用可能な場合は Azure ハイブリッド特典を使用すること\n\n第 2 ジョブに対して推奨すべきものはどれですか？", "choices": [{"text": "Batch サービスと専用仮想マシン", "is_correct": true}, {"text": "ユーザー サブスクリプションと専用仮想マシン", "is_correct": false}, {"text": "ユーザー サブスクリプションと低優先度仮想マシン", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">Azure Batch: プール割り当てモード × VM 優先度</text><rect x=\"20\" y=\"35\" width=\"200\" height=\"55\" rx=\"8\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"2\"/><text x=\"120\" y=\"54\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#0072C6\">第1ジョブ（開発）</text><text x=\"120\" y=\"68\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">短時間タスク / コスト優先</text><text x=\"120\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">中断許容できる</text><rect x=\"20\" y=\"105\" width=\"200\" height=\"55\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"120\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">第2ジョブ（本番）</text><text x=\"120\" y=\"138\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">適時完了必要</text><text x=\"120\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">中断不可</text><rect x=\"280\" y=\"35\" width=\"200\" height=\"55\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"380\" y=\"54\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">ユーザーサブスクリプション</text><text x=\"380\" y=\"68\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">+ 低優先度 VM</text><text x=\"380\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">スポット VM コスト大幅削減 (Q15)</text><rect x=\"280\" y=\"105\" width=\"200\" height=\"55\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"380\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Batch サービス</text><text x=\"380\" y=\"138\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">+ 専用 VM</text><text x=\"380\" y=\"152\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">中断なし・安定実行 (Q16)</text><rect x=\"500\" y=\"35\" width=\"180\" height=\"50\" rx=\"6\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"1.5\"/><text x=\"590\" y=\"64\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">低優先度: 最大90%コスト削減 / 中断リスクあり</text><rect x=\"500\" y=\"105\" width=\"180\" height=\"50\" rx=\"6\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"1.5\"/><text x=\"590\" y=\"134\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">専用VM: 常時確保 / 高コスト</text><line x1=\"220\" y1=\"62\" x2=\"278\" y2=\"62\" stroke=\"#107C10\" stroke-width=\"2\" marker-end=\"url(#ag)\"/><line x1=\"220\" y1=\"132\" x2=\"278\" y2=\"132\" stroke=\"#107C10\" stroke-width=\"2\" marker-end=\"url(#ag)\"/><text x=\"350\" y=\"180\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">低優先度VM=スポットVM相当（安価・中断あり）/ 専用VM=確実（高コスト）</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">第 2 ジョブ（本番環境の長時間タスク）の要件：中断不可、安定した実行が必要。\n\n<strong>Batch サービス + 専用 VM</strong>：専用 VM は Azure が確保した容量を常時使用し、スポット VM と異なり中断されません。Batch サービス モードは Microsoft が VM 管理を担い、本番ジョブの安定実行に適しています。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>ユーザー サブスクリプション + 専用 VM：</strong> 機能的には動作するが、Batch サービス モードの方が Microsoft が VM 管理を担い本番運用がシンプル\n<strong>ユーザー サブスクリプション + 低優先度 VM：</strong> スポット VM は中断される可能性があり、中断不可の本番タスクには不適切</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Q15（開発）= 低優先度（スポット）、Q16（本番）= 専用 VM という対比を整理しましょう。\n\n「中断されたらどうなるか」がトレードオフの核心です：\n• 短時間・開発：やり直しができる → スポット OK\n• 長時間・本番：中断で大きな損失 → 専用 VM 必須</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「中断不可・長時間・本番」= <strong>専用 VM</strong>（Batch サービス モード）。スポット VM は中断リスクがあるので本番には使わない。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/batch/batch-pool-vm-sizes\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/batch/batch-pool-vm-sizes</a></li></ul></div>\n</div>"}, {"num": 17, "id": "q17", "domain": "ID・ガバナンス・監視", "domain_code": "ID", "domain_color": "#7719AA", "question_text": "組織 ApexCore Ltd. は、HTTP トリガーを使用する複数の Azure Logic Apps を運用しています。これらのロジック アプリは ApexCore がホストするオンプレミス Web サービスへのアクセスを提供しています。\n\nApexCore は Ironclad, Inc. とパートナーシップを締結しました。Ironclad には既存の Microsoft Entra テナントがなく、代わりにサードパーティの OAuth 2.0 ID プロバイダーを使用してユーザーを認証しています。\n\nIronclad の開発者は、ApexCore のシステムと統合するアプリケーションを構築するために、既存のロジック アプリのサブセットを使用する予定です。\n\nこのパートナーシップをサポートするために必要なコンポーネントを推奨する必要があります。ソリューションは以下の要件を満たす必要があります：\n\n・Ironclad の開発者が既存のロジック アプリを使用できること\n・サードパーティの OAuth 2.0 ID プロバイダーを使用した Ironclad ユーザーの認証をサポートすること\n・既存のロジック アプリへの変更を最小限に抑えること\n\n推奨すべきサービスはどれですか？", "choices": [{"text": "Microsoft Entra アプリケーション プロキシ", "is_correct": false}, {"text": "Azure API Management", "is_correct": true}, {"text": "Azure Front Door", "is_correct": false}, {"text": "Microsoft Entra ビジネス ツー ビジネス (B2B)", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">Logic Apps B2B フェデレーション（Q17）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"266\" y=\"26\" width=\"228\" height=\"98\" rx=\"8\" fill=\"#0072C6\" fill-opacity=\"0.06\" stroke=\"#0072C6\" stroke-width=\"1\" stroke-dasharray=\"5,3\"/>\n<text x=\"274\" y=\"40\" font-size=\"8.5\" font-weight=\"600\" fill=\"#0072C6\" font-family=\"Segoe UI,Ari エンタイトルメント管理</strong>。外部 B2B ユーザーのアクセス ライフサイクル全体を管理できる。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/active-directory/governance/entitlement-management-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/active-directory/governance/entitlement-management-overview</a></li></ul></div>\n</div>"}, {"num": 22, "id": "q22", "domain": "データストレージ設計", "domain_code": "DS", "domain_color": "#0078D4", "question_text": "組織には以下のオンプレミス Microsoft SQL Server データベースからデータを使用する App1 というアプリケーションがあります：\n\n・DB1：450 GB\n・DB2：250 GB\n・DB3：300 GB\n・DB4：50 GB\n\nApp1 とそのデータは毎月第 1 日のみアクセスされます。データ量は年間 3% 以内の増加が見込まれます。\n\n会社は App1 を Azure ベースの Web アプリケーションとして再設計し、既存のすべてのデータを Azure に移行する計画です。\n\nデータを Azure SQL Database に移行し、毎月第 1 日のみデータベースを利用可能にする必要があります。\n\nどの Azure SQL Database サービス レベルを選択すべきですか？", "choices": [{"text": "vCore ベースの General Purpose（汎用目的）", "is_correct": true}, {"text": "DTU ベースの Basic", "is_correct": false}, {"text": "DTU ベースの Standard", "is_correct": false}, {"text": "vCore ベースの Business Critical（ビジネス クリティカル）", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient= ght=\"700\" fill=\"#C50F1F\">DTU モデル</text><text x=\"585\" y=\"81\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ライセンス持込不可</text><text x=\"585\" y=\"95\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">スケール単位が粗い</text><rect x=\"500\" y=\"130\" width=\"170\" height=\"50\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"585\" y=\"147\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Business Critical</text><text x=\"585\" y=\"161\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Premium SSD・同期レプリカ</text><text x=\"585\" y=\"175\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">必要以上にコスト高</text><path d=\"M170,75 L238,75 L238,90\" fill=\"none\" stroke=\"#107C10\" stroke-width=\"2\" marker-end=\"url(#ag)\"/><text x=\"350\" y=\"188\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">vCore選択→Azure Hybrid Benefit(AHB)でオンプレSQLライセンス流用可。DTUでは不可</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：DB1（450 GB）+ DB2（250 GB）= <strong>700 GB 以上のデータ</strong>を Azure SQL Database に移行。コスト最適化と拡張性が重要。\n\n<strong>vCore ベースの General Purpose（汎用目的）</strong>：vCore モデルはコンピューティングとストレージを独立してスケール可能。General Purpose は 4 TB までのストレージをサポートし（DTU Basic は最大 2 GB）、汎用ワークロードに適したコスト効率の良い選択です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>DTU ベースの Basic：</strong> 最大ストレージが <strong>2 GB</strong>。450 GB のデータベースは格納不可\n<strong>DTU ベースの Standard：</strong> 最大 1 TB はサポートするが、DTU モデルはコンピューティングとストレージが連動するため柔軟性が低い\n<strong>Business Critical：</strong> 高パフォーマンス・ゾーン冗長が特徴。一般的なワークロードには過剰でコストが高い</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">DTU モデルと vCore モデルの違い：\n\n• <strong>DTU モデル</strong>：コンピューティング・ストレージ・I/O がバンドル。Basic 最大 2 GB、Standard 最大 1 TB\n• <strong>vCore モデル</strong>：コンピューティングとストレージを独立してスケール。最大 4 TB\n\n大容量（700 GB+）かつコスト効率重視 → vCore General Purpose。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>サービス層</th><th>最大ストレージ</th><th class=\"cc\">コスト</th><th>700 GB 対応</th></tr></thead><tbody><tr><td>DTU Basic</td><td>2 GB</td><td class=\"cc\">最安</td><td>不可</td></tr><tr><td>DTU Standard</td><td>1 TB</td><td class=\"cc\">低</td><td><span class=\"tbl-ok\">○</span>（柔軟性低）</td></tr><tr><td>vCore General Purpose <span class=\"tbl-ok\">○</span></td><td>4 TB</td><td class=\"cc\">中</td><td>最適</td></tr><tr><td>vCore Business Critical</td><td>4 TB</td><td class=\"cc\">高</td><td><span class=\"tbl-ok\">○</span>（過剰）</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">700 GB 超の SQL DB 移行 + コスト効率 = <strong>vCore General Purpose</strong>。DTU Basic は 2 GB 上限で絶対不可。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/azure-sql/database/service-tiers-general-purpose-business-critical\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/azure-sql/database/service-tiers-general-purpose-business-critical</a></li></ul></div>\n</div>"}, {"num": 23, "id": "q23", "domain": "データストレージ設計", "domain_code": "DS", "domain_color": "#0078D4", "question_text": "以下の要件を満たす Azure Storage ソリューションを推奨する必要があります：\n\n・最大 1 PB のデータをサポートすること\n・データを Blob ストレージに格納すること\n・ストレージ ソリューションが 3 レベルのサブフォルダーをサポートすること\n・ストレージ ソリューションがアクセス制御リスト (ACL) をサポートすること\n\n推奨に含めるべきものはどれですか？", "choices": [{"text": "ページ BLOB 用に構成されたプレミアム ストレージ アカウント", "is_correct": false}, {"text": "ブロック BLOB 用に構成されたプレミアム ストレージ アカウント", "is_correct": false}, {"text": "大容量ファイル共有をサポートするファイル共有用に構成されたプレミアム ストレージ アカウント", "is_correct": false}, {"text": "階層型名前空間が有効化された汎用 v2 ストレージ アカウント", "is_correct": true}], "correct_indices": [3], "n_correct": 1, "exp_html iv class=\"exp-block exp-tip\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">\n<strong>ACL = ADLS Gen2（階層型名前空間）の固有機能</strong>と覚える。<br>\n通常の汎用 v2 Blob ではコンテナー・BLOB レベルの RBAC のみでファイル/ディレクトリ単位の ACL は使えない。\n</div></div>\n<div class=\"exp-block exp-table\"><div class=\"exp-block-label\">ストレージ選択比較</div><div class=\"exp-block-body\">\n<table style=\"width:100%;border-collapse:collapse;font-size:12px\">\n<tr style=\"background:#0072C6;color:#fff\"><th style=\"padding:6px;border:1px solid #ddd\">種類</th><th style=\"padding:6px;border:1px solid #ddd\">ACL</th><th style=\"padding:6px;border:1px solid #ddd\">階層フォルダ</th><th style=\"padding:6px;border:1px solid #ddd\">Blob格納</th><th style=\"padding:6px;border:1px solid #ddd\">用途</th></tr>\n<tr style=\"background:#E8F5E9\"><td style=\"padding:5px;border:1px solid #ddd\"><strong>汎用v2 + HNS (ADLS Gen2)</strong></td><td style=\"padding:5px;border:1px solid #ddd;color:#107C10\"><span class=\"tbl-ok\">○</span></td><td style=\"padding:5px;border:1px solid #ddd;color:#107C10\"><span class=\"tbl-ok\">○</span></td><td style=\"padding:5px;border:1px solid #ddd;color:#107C10\"><span class=\"tbl-ok\">○</span></td><td style=\"padding:5px;border:1px solid #ddd\">ビッグデータ分析</td></tr>\n<tr><td style=\"padding:5px;border:1px solid #ddd\">ページ BLOB プレミアム</td><td style=\"padding:5px;border:1px solid #ddd;color:#C50F1F\"><span class=\"tbl-ng\">×</span></td><td style=\"padding:5px;border:1px solid #ddd;color:#C50F1F\"><span class=\"tbl-ng\">×</span></td><td style=\"padding:5px;border:1px solid #ddd;color:#107C10\"><span class=\"tbl-ok\">○</span></td><td style=\"padding:5px;border:1px solid #ddd\">VM ディスク</td></tr>\n<tr><td style=\"padding:5px;border:1px solid #ddd\">ブロック BLOB プレミアム</td><td style=\"padding:5px;border:1px solid #ddd;color:#C50F1F\"><span class=\"tbl-ng\">×</span></td><td style=\"padding:5px;border:1px solid #ddd;color:#C50F1F\"><span class=\"tbl-ng\">×</span></td><td style=\"padding:5px;border:1px solid #ddd;c idth=\"2\"/><text x=\"585\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">ホット層</text><text x=\"585\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Blob 用の概念</text><text x=\"585\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Files には無効</text><rect x=\"500\" y=\"135\" width=\"170\" height=\"45\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"585\" y=\"149\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">トランザクション最適化</text><text x=\"585\" y=\"163\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Standard HDD ベース</text><text x=\"585\" y=\"177\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">低 IOPS</text><path d=\"M170,80 L238,80 L238,90\" fill=\"none\" stroke=\"#7719AA\" stroke-width=\"2\" marker-end=\"url(#ap)\"/><rect x=\"20\" y=\"155\" width=\"350\" height=\"22\" rx=\"6\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"1.5\"/><text x=\"195\" y=\"170\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Q25: ZRS = 同リージョン3AZ冗長 (単一DC障害に対応)</text><rect x=\"380\" y=\"155\" width=\"290\" height=\"22\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1.5\"/><text x=\"525\" y=\"170\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">GRS/RA-GRS: 別リージョン複製(不要コスト追加)</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「トランザクション集中型アプリケーションがオンプレミスからファイル共有にアクセスする」。\n\n<strong>プレミアム ファイル共有（FileStorage アカウント）</strong>：SSD ベースで低レイテンシ・高 IOPS を提供します。トランザクション集中型アクセスに最適で、SMB/NFS プロトコルでオンプレミスからマウント可能です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>ホット：</strong> ホット アクセス層は Blob ストレージの概念。Azure Files の「ホット」層は HDD ベースでプレミアムより性能が低い\n<strong>トランザクション最適化：</strong> Azure Files の Standard 層でも HDD ベースのため、プレミアムの SSD よりレイテンシが高く、トランザクション集中型には不十分</div></div>\n< ト）の冗長性オプションは制限されており、<strong>ZRS（ゾーン冗長ストレージ）</strong>が利用可能な最高レベルの冗長性です。\n\nZRS はデータを同一リージョン内の 3 つの可用性ゾーン（異なる物理データセンター）に同期的にレプリケートします。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>GRS（geo 冗長）：</strong> プレミアム ファイル共有（FileStorage アカウント）では GRS は<strong>サポートされていません</strong>\n<strong>LRS（ローカル冗長）：</strong> 単一データセンター内の 3 コピー。ZRS より冗長性が低く、可用性ゾーン障害に対応できない</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">ストレージ アカウントの種類ごとに利用できる冗長性オプションが異なります：\n\n• <strong>汎用 v2（GPv2）</strong>：LRS / ZRS / GRS / RA-GRS / GZRS / RA-GZRS すべて対応\n• <strong>プレミアム ブロック BLOB</strong>：LRS / ZRS のみ\n• <strong>プレミアム ファイル共有（FileStorage）</strong>：LRS / <strong>ZRS のみ</strong>（GRS 不可）\n• <strong>プレミアム ページ BLOB</strong>：LRS のみ</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>ストレージ種別</th><th>LRS</th><th>ZRS</th><th>GRS/RA-GRS</th><th>GZRS</th></tr></thead><tbody><tr><td>汎用 v2（GPv2）</td><td><span class=\"tbl-ok\">○</span></td><td><span class=\"tbl-ok\">○</span></td><td><span class=\"tbl-ok\">○</span></td><td><span class=\"tbl-ok\">○</span></td></tr><tr><td>プレミアム ブロック BLOB</td><td><span class=\"tbl-ok\">○</span></td><td><span class=\"tbl-ok\">○</span></td><td><span class=\"tbl-ng\">×</span></td><td><span class=\"tbl-ng\">×</span></td></tr><tr><td>プレミアム ファイル共有 <span class=\"tbl-ok\">○</span></td><td><span class=\"tbl-ok\">○</span></td><td><span class=\"tbl-ok\">○</span>（最高）</td><td><span class=\"tbl-ng\">×</span></td><td><span class=\"tbl-ng\">×</span></td></tr><tr><td>プレミアム ページ BLOB</td><td><span class=\"tbl-ok\">○</span></td><td><span class=\"tbl-ng\">×</span></td><td><span class=\"tbl-ng\">×</span></td><td><span class=\"tbl-ng\">×</span></td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">プレミアム ファイル共有で使える最高冗長性 = <strong>ZRS</strong>。GRS は非対応なので注意。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/common/storage-redundancy\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/storage/common/storage-redundancy</a></li></ul></div>\n</div>"}, {"num": 26, "id": "q26", "domain": "ビジネス継続性設計", "domain_code": "BC", "domain_color": "#107C10", "question_text": "App1 という Azure Web アプリと KV1 という Azure Key Vault があります。\n\nApp1 はデータベース接続文字列を KV1 に格納しています。\n\nApp1 は KV1 に対して以下の操作を実行します：Get、List、Wrap、Delete、Unwrap、Backup、Decrypt、Encrypt\n\nApp1 のサービス継続性を評価しています。\n\nKV1 をホストする Azure リージョンが利用不可になった場合のシナリオの結果を特定する必要があります：\n\nKV1 はどこにフェールオーバーしますか？", "choices": [{"text": "同じ可用性セット内のサーバー", "is_correct": false}, {"text": "同じフォールト ドメイン内のサーバー", "is_correct": false}, {"text": "ペアリングされたリージョン内のサーバー", "is_correct": true}, {"text": "スケール セット内の仮想マシン", "is_correct": false}], "correct_indices": [2], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 195\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"40\" width=\"130\" height=\"80\" rx=\"8\" fill=\"#FFF8E1\" stroke=\"#E67700\" "text": "Delete", "is_correct": true}, {"text": "Encrypt", "is_correct": false}, {"text": "Get", "is_correct": false}, {"text": "List", "is_correct": false}], "correct_indices": [2], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 195\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"40\" width=\"130\" height=\"80\" rx=\"8\" fill=\"#FFF8E1\" stroke=\"#E67700\" stroke-width=\"2\"/><text x=\"85\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#E67700\">App1</text><text x=\"85\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">Web アプリ</text><text x=\"85\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">KV1 にアクセス</text><rect x=\"215\" y=\"20\" width=\"160\" height=\"155\" rx=\"8\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"2\"/><text x=\"295\" y=\"89\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#0072C6\">KV1 Key Vault</text><text x=\"295\" y=\"103\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">フェールオーバー時</text><text x=\"295\" y=\"117\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">→ 読み取り専用モード</text><rect x=\"225\" y=\"58\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#C8E6C9\"/><text x=\"295\" y=\"71\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Get 利用可</text><rect x=\"225\" y=\"83\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#C8E6C9\"/><text x=\"295\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Decrypt 利用可</text><rect x=\"225\" y=\"108\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#C8E6C9\"/><text x=\"295\" y=\"121\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Encrypt 利用可</text><rect x=\"225\" y=\"133\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#C8E6C9\"/><text x=\"295\" y=\"146\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">List 利用可</text><rect x=\"225\" y=\"158\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"295\" y=\"171\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Delete 利用不可 (Q27)</text><rect x=\"450\" y=\"40\" width=\"200\" height=\"75\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"550\" y=\"69\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Q26: ペアリング先リージョン</text><text x=\"550\" y=\"83\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">KV はペアリングされた</text><text x=\"550\" y=\"97\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">リージョンへ自動 FR</text><rect x=\"450\" y=\"130\" width=\"200\" height=\"50\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"550\" y=\"147\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">Write 系操作</text><text x=\"550\" y=\"161\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">フェールオーバー中は</text><text x=\"550\" y=\"175\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">すべて制限される</text><path d=\"M150,80 L213,80 L213,90\" fill=\"none\" stroke=\"#E67700\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><path d=\"M375,100 L448,100 L448,78\" fill=\"none\" stroke=\"#0072C6\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><text x=\"350\" y=\"192\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">FR中=読み取り専用。Delete/Create/Update等の書き込み系はすべて利用不可</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Azure Key Vault はリージョン障害によるフェールオーバー中に<strong>読み取り専用モード</strong>に入ります。この状態で使用できない（制限される）操作は <strong>Delete（削除）</strong>です。\n\nフェールオーバー中はキー・シークレット・証明書の削除はサポートされません。Get（取得）・Decrypt（復号）などの読み取り操作は通常通り動作します。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Backup（バックアップ）：</strong> 読み取り系操作のため、フェールオーバー中でも一般的には動作可能\n<strong>Decrypt（復号）：</strong> 読み取り系操作のため、フェールオーバー中でも動作可能（アプリが継続して動作できる）\n<strong>Encrypt（暗号化）：</strong> 読み取り系操作のため、フェールオーバー中でも動作可能</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「フェールオーバー中 = 読み取り専用」が核心です。\n\n• 読み取り系（Get/List/Decrypt/Encrypt）→ 動作\n• <strong>書き込み・削除系（Set/Delete/Create）→ 制限</strong>\n\n試験では「何ができなくなるか」の観点で問われることが多いです。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>操作</th><th>フェールオーバー中</th><th>理由</th></tr></thead><tbody><tr><td>Get（取得）</td><td>可能</td><td>読み取り専用モードで動作</td></tr><tr><td>Decrypt / Encrypt</td><td>可能</td><td>暗号化操作は読み取り系</td></tr><tr><td>Backup</td><td>可能</td><td>読み取り系</td></tr><tr><td>Delete（削除）<span class=\"tbl-ok\">○</span>問題の答え</td><td>不可</td><td>書き込み操作は制限</td></tr><tr><td>Set / Create</td><td>不可</td><td>書き込み操作は制限</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Key Vault フェールオーバー中 = <strong>読み取り専用モード</strong>。Delete など書き込み・削除操作は制限される。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/key-vault/general/disaster-recovery-guidance\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/key-vault/general/disaster-recovery-guidance</a></li></ul></div>\n</div>"}, {"num": 28, "id": "q28", "domain": "ビジネス継続性設計", "domain_code": "BC", "domain_color": "#107C10", "question_text": "オンプレミス ネットワークと Azure サブスクリプションがあり、オンプレミス環境には複数のブランチ オフィスがあります。\n\nトロントにある 1 つのブランチ オフィスに VM1 という仮想マシンがあり、ファイル サーバーとして機能しています。すべてのブランチ オフィスのユーザーが VM1 に格納された共有ファイルにアクセスしています。\n\nトロントのブランチ オフィスが利用不可になった場合でも、ユーザーが最低限の遅延で共有ファイルに引き続きアクセスできるソリューションを推奨する必要があります。\n\n推奨に含めるべきものはどれですか？", "choices": [{"text": "Recovery Services コンテナーと Windows Server Backup", "is_correct": false}, {"text": "Azure ファイル共有と Azure File Sync", "is_correct": true}, {"text": "Recovery Services コンテナーと Azure Backup", "is_correct": false}, {"text": "Azure Blob コンテナーと Azure File Sync", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">ブランチ → VPN → Azure Files（Q28）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"386\" y=\"26\" width=\"108\" height=\"98\" rx=\"8\" fill=\"#0072C6\" fill-opacity=\"0.06\" stroke=\"#0072C6\" stroke-width=\"1\" stroke-dasharray=\"5,3\"/>\n<text x=\"394\" y=\"40\" font-size=\"8.5\" font-weight=\"600\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">Azure</text>\n<rect x=\"156\" y=\"44\" width=\"88\" height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#546E7A\" stroke-width=\"1.5\"/>\n<rect x=\"162\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#546E7A\" fill-opacity=\ ank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/storage/file-sync/file-sync-introduction</a></li></ul></div>\n</div>"}, {"num": 29, "id": "q29", "domain": "データストレージ設計", "domain_code": "DS", "domain_color": "#0078D4", "question_text": "オンプレミスのファイル サーバーに 2 TB のデータ ファイルが含まれています。\n\nこれらのデータ ファイルを西ヨーロッパ (West Europe) の Azure リージョンの Azure Blob Storage に移行する計画があります。\n\nストレージ アカウントの適切なアカウントの種類とレプリケーション戦略を推奨する必要があります。選択されたソリューションは以下の要件を満たす必要があります：\n\n・単一の Azure データ センターが障害になってもデータが利用可能であること\n・ストレージ ソリューションが複数のストレージ層をサポートすること\n・コストを最小化すること\n\nストレージ アカウントの種類はどれを推奨しますか？", "choices": [{"text": "Premium ブロック BLOB", "is_correct": false}, {"text": "Standard 汎用 v1", "is_correct": false}, {"text": "Standard 汎用 v2", "is_correct": true}], "correct_indices": [2], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"40\" width=\"150\" height=\"80\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"95\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">オンプレ ファイル サーバー</text><text x=\"95\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">2 TB データファイル</text><text x=\"95\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">→ West Europe へ移行</text><rect x=\"240\" y=\"20\" width=\"200\" height=\"150\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"340\" y=\"87\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Standard 汎用 v2</text><text x=\"340\" y=\"101\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">(Q29: アカウント種類)</text><rect x=\"250\" y=\"60\" width=\"180\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"340\" y=\"73\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">複数ストレージ層対応 ✅</text><rect x=\"250\" y=\"85\" width=\"180\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"340\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ライフサイクル管理 ✅</text><rect x=\"250\" y=\"110\" width=\"180\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"340\" y=\"123\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ZRS 対応 ✅</text><rect x=\"250\" y=\"135\" width=\"180\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"340\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">コスト最適 ✅</text><rect x=\"510\" y=\"20\" width=\"160\" height=\"155\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"590\" y=\"89\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">ZRS (Q30)</text><text x=\"590\" y=\"103\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">同リージョン内 3AZ</text><rect x=\"520\" y=\"60\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"73\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">DC障害対応 ✅</text><rect x=\"520\" y=\"85\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">West Europe 内に留まる ✅</text><rect x=\"520\" y=\"110\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"123\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">GRSより低コスト ✅</text><rect x=\"520\" y=\"135\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">LRSより高可用性 ✅</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">汎用v2: 複数層+ZRS対応。Premium Blobは単一層のみでZRS選択肢が制限</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「2 TB のファイルを Azure Blob Storage に格納し、単一データセンターの障害に備える。コスト最小化。西ヨーロッパ リージョン内に留める」。\n\n<strong>Standard 汎用 v2（GPv2）</strong>：Blob ストレージをサポートし、ZRS などの冗長性オプションと組み合わせ可能。Standard は Premium と比べてコストが低く、2 TB の大容量格納に適切です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Premium ブロック BLOB：</strong> SSD ベースの高性能ストレージ。2 TB のファイル格納でコスト最小化という要件には高コスト過剰\n<strong>Standard 汎用 v1（GPv1）：</strong> 旧世代。ライフサイクル管理・Cool/Archive アクセス層・ZRS などの機能が制限される。新規作成には v2 が推奨</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">GPv1 と GPv2 の違い：\n\n• <strong>GPv1</strong>：旧世代。ライフサイクル管理・Cool/Archive 層・ZRS が非対応または制限あり\n• <strong>GPv2</strong>：現行世代。すべての最新機能をサポート\n\n試験では「なぜ v1 ではなく v2 か」を問われることがあります。新規作成はほぼ GPv2 一択です。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">ストレージ アカウント種別</th><th>Blob サポート</th><th>アクセス層</th><th>ZRS 対応</th><th>コスト</th></tr></thead><tbody><tr><td class=\"cc\">Standard GPv2 <span class=\"tbl-ok\">○</span></td><td><span class=\"tbl-ok\">○</span></td><td>Hot/Cool/Archive</td><td><span class=\"tbl-ok\">○</span></td><td>低〜中</td></tr><tr><td class=\"cc\">Standard GPv1</td><td><span class=\"tbl-ok\">○</span></td><td>Hot のみ</td><td><span class=\"tbl-ng\">×</span></td><td>低（機能制限）</td></tr><tr><td class=\"cc\">Premium ブロック BLOB</td><td><span class=\"tbl-ok\">○</span></td><td>Premium のみ</td><td><span class=\"tbl-ok\">○</span></td><td>高</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">新規ストレージ アカウントは基本的に <strong>Standard GPv2</strong> を選ぶ。GPv1 は機能制限があり、Premium は高コスト。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/common/storage-account-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/storage/common/storage-account-overview</a></li></ul></div>\n</div>"}, {"num": 30, "id": "q30", "domain": "データストレージ設計", "domain_code": "DS", "domain_color": "#0078D4", "question_text": "オンプレミスのファイル サーバーに 2 TB のデータ ファイルが含まれています。\n\nこれらのデータ ファイルを西ヨーロッパ (West Europe) の Azure リージョンの Azure Blob Storage に移行する計画があります。\n\nストレージ アカウントの適切なアカウントの種類とレプリケーション戦略を推奨する必要があります。選択されたソリューションは以下の要件を満たす必要があります：\n\n・単一の Azure データ センターが障害になってもデータが利用可能であること\n・ストレージ ソリューションが複数のストレージ層をサポートすること\n・コストを最小化すること\n\n冗長性はどれを推奨しますか？", "choices": [{"text": "geo 冗長ストレージ (GRS)", "is_correct": false}, {"text": "ゾーン冗長ストレージ (ZRS)", "is_correct": true}, {"text": "ローカル冗長ストレージ (LRS)", "is_correct": false}, {"text": "読み取りアクセス geo 冗長ストレージ (RA-GRS)", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"40\" width=\"150\" height=\"80\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"95\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">オンプレ ファイル サーバー</text><text x=\"95\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">2 TB データファイル</text><text x=\"95\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">→ West Europe へ移行</text><rect x=\"240\" y=\"20\" width=\"200\" height=\"150\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"340\" y=\"87\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Standard 汎用 v2</text><text x=\"340\" y=\"101\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">(Q29: アカウント種類)</text><rect x=\"250\" y=\"60\" width=\"180\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"340\" y=\"73\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">複数ストレージ層対応 ✅</text><rect x=\"250\" y=\"85\" width=\"180\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"340\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ライフサイクル管理 ✅</text><rect x=\"250\" y=\"110\" width=\"180\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"340\" y=\"123\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ZRS 対応 ✅</text><rect x=\"250\" y=\"135\" width=\"180\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"340\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">コスト最適 ✅</text><rect x=\"510\" y=\"20\" width=\"160\" height=\"155\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"590\" y=\"89\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">ZRS (Q30)</text><text x=\"590\" y=\"103\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">同リージョン内 3AZ</text><rect x=\"520\" y=\"60\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"73\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">DC障害対応 ✅</text><rect x=\"520\" y=\"85\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">West Europe 内に留まる ✅</text><rect x=\"520\" y=\"110\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"123\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">GRSより低コスト ✅</text><rect x=\"520\" y=\"135\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">LRSより高可用性 ✅</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">汎用v2: 複数層+ZRS対応。Premium Blobは単一層のみでZRS選択肢が制限</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Q29 の続き。要件：「単一データセンター障害に対してデータを保護する」＋「<strong>西ヨーロッパ内に留める</strong>（geo レプリケーションなし）」＋「コスト最小化」。\n\n<strong>ZRS（ゾーン冗長ストレージ）</strong>：同一リージョン内の 3 つの可用性ゾーン（異なるデータセンター）にデータをレプリケートし、単一データセンター障害に対応。データは西ヨーロッパ リージョン内に留まり（データ主権要件を満たす）、LRS より冗長性が高く GRS よりコストが低いです。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>GRS（geo 冗長）：</strong> データを他のリージョン（西ヨーロッパ → 北ヨーロッパ）にレプリケート。<strong>西ヨーロッパ内にデータを留める要件に違反</strong>\n<strong>LRS（ローカル冗長）：</strong> 単一データセンター内の 3 コピー。<strong>別のデータセンターへのレプリケーションなし</strong>。データセンター障害（火災・洪水）には対応できない\n<strong>RA-GRS：</strong> GRS + セカンダリへの読み取り。リージョン外レプリカがあり、データ主権要件に違反</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">LRS vs ZRS のよくある混同：\n\n• <strong>LRS</strong>：同一データセンター内 3 コピー。ディスク障害には強いが「データセンター障害」には弱い\n• <strong>ZRS</strong>：異なるデータセンター（可用性ゾーン）に同期レプリケート。データセンター障害にも対応\n\n「単一データセンター障害に対応」= ZRS が必要（LRS では不十分）。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>冗長性</th><th class=\"cc\">データセンター障害対応</th><th>リージョン外レプリカ</th><th>コスト</th></tr></thead><tbody><tr><td>LRS</td><td class=\"cc\"><span class=\"tbl-ng\">×</span></td><td><span class=\"tbl-ng\">×</span></td><td>最安</td></tr><tr><td>ZRS <span class=\"tbl-ok\">○</span></td><td class=\"cc\"><span class=\"tbl-ok\">○</span></td><td><span class=\"tbl-ng\">×</span>（ゾーン内のみ）</td><td>中</td></tr><tr><td>GRS</td><td class=\"cc\"><span class=\"tbl-ok\">○</span></td><td><span class=\"tbl-ok\">○</span></td><td>高</td></tr><tr><td>RA-GRS</td><td class=\"cc\"><span class=\"tbl-ok\">○</span></td><td><span class=\"tbl-ok\">○</span></td><td>最高</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「単一 DC 障害対応 + データはリージョン内のみ + コスト最小」= <strong>ZRS</strong>。LRS はデータセンター障害に対応できず、GRS/RA-GRS はリージョン外にデータが出る。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/common/storage-redundancy\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/storage/common/storage-redundancy</a></li></ul></div>\n</div>"}, {"num": 31, "id": "q31", "domain": "インフラストラクチャ設計", "domain_code": "IS", "domain_color": "#C50F1F", "question_text": "注意：この問題は同じシナリオを使用する一連の問題の一部です。シリーズの各問題は要件を満たす場合と満たさない場合のある異なるソリューションを提示します。\n\n組織はオンプレミスと Azure の両方で仮想マシン (VM) を実行しています。Azure ExpressRoute はオンプレミス環境と Azure の間の接続を提供するために構成されています。\n\nいくつかの仮想マシンでネットワーク接続の問題が発生しています。\n\nパケットが VM に対して許可または拒否されているかを確認するためにネットワーク トラフィックを検査する必要があります。\n\n提案されたソリューション：VM Insights をインストールして設定する。\n\nこのソリューションは要件を満たしていますか？", "choices": [{"text": "Yes（はい）", "is_correct": false}, {"text": "No（いいえ）", "is_correct": true}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">Expres
