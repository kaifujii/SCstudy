いは試験頻出です：\n\n• <strong>Event Hubs</strong>：プル型・大量ストリーム・バッファリングあり・順序保証・ビッグデータ取り込み\n• <strong>Event Grid</strong>：プッシュ型・リアクティブ イベント・ファンアウト・Azure リソースのイベント連動\n\n「ログを大量に取り込みたい」→ Event Hubs、「Azure リソースのイベントに反応して何かしたい」→ Event Grid。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>パターン</th><th>大量ストリーム</th><th>バッファリング</th><th>典型的な用途</th></tr></thead><tbody><tr><td class=\"cc\">Azure Event Hubs ✅</td><td>プル型・ストリーム</td><td>✅</td><td>✅</td><td>ログ・テレメトリ大量取り込み</td></tr><tr><td class=\"cc\">Azure Event Grid</td><td>プッシュ型・リアクティブ</td><td>❌</td><td>❌</td><td>Azure リソース イベント連動</td></tr><tr><td class=\"cc\">Azure Service Bus</td><td>キュー/トピック</td><td>△</td><td>✅</td><td>信頼性の高いメッセージング</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Entra ID 監査ログの大量ストリーム取り込み → <strong>Azure Event Hubs</strong>。「大量」「ストリーム」「バッファ」キーワードが出たら Event Hubs。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/event-hubs/event-hubs-about\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/event-hubs/event-hubs-about</a></li></ul></div>\n</div>"},{"num":2,"id":"q2","domain":"ID・ガバナンス・監視","domain_code":"ID","domain_color":"#7719AA","question_text":"ユーザーの作成とロールの割り当てをキャプチャするアーキテクチャを設計する必要があります。キャプチャした情報は Azure Cosmos DB に格納する必要があります。\n\n設計は以下のシーケンスに従います：\n\nAzure Active Directory 監査ログがイベントを生成する\n→ イベントが Azure サービス 1 に送信される\n→ Azure サービス 1 の出力が Azure サービス 2 に転送される\n→ Azure サービス 2 が処理済みデータを Azure Cosmos DB に格納する\n\n各ステージで使用する適切な Azure サービスを選択する必要があります。\n\nAzure サービス 2 として選択すべき Azure サービスはどれですか？","choices":[{"text":"Azure Event Grid","is_correct":false},{"text":"Azure Event Hubs","is_correct":false},{"text":"Azure Functions","is_correct":true},{"text":"Azure Monitor Logs","is_correct":false},{"text a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"490\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">格納</text>\n</svg></div><img src=\"picture/vol3_q01_q02_aad_eventhub_cosmos.png\" style=\"width:100%;border-radius:4px;max-width:760px;\"></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Q1 と同じシナリオで、ステップ 2（イベントを処理して Cosmos DB に書き込む）を担うサービスを問う問題です。\n\n<strong>Azure Functions</strong>：Event Hubs のデータをトリガーとして受け取り、データ変換・加工を行い、Cosmos DB の出力バインディングを使って格納します。サーバーレスでコスト効率が高く、Event Hubs との統合もネイティブにサポートしています。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure Event Grid：</strong> ルーティングのみで処理ロジックがない。ステップ 2 には処理機能が必要 ❌\n\n<strong>Azure Event Hubs：</strong> ステップ 1 で使用済み。2 段重ねで使う構成ではない ❌\n\n<strong>Azure Monitor Logs：</strong> 処理・変換機能を持たない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">アーキテクチャの流れを整理すると：\n\n<strong>Entra ID → (1) Event Hubs → (2) Azure Functions → Cosmos DB</strong>\n\nQ1 は「(1) のサービスは？」= Event Hubs\nQ2 は「(2) のサービスは？」= Azure Functions\n\n関連問題でそれぞれのステップを問うパターンを把握することが重要です。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">イベントを<strong>受け取り → 処理 → Cosmos DB に書き込む</strong>という処理ロジック = <strong>Azure Functions</strong>（イベント ドリブン・サーバーレス）。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/azure-functions/functions-bindings-event-hubs\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/azure-functions/functions-bindings-event-hubs</a></li></ul></div>\n</div>"},{"num":3,"id":"q3","domain":"データストレージ設計","domain_code":"DS","domain_color":"#0078D4","question_text":"機密データ用の Azure ストレージ ソリューションを設計しています。データには毎日アクセスされ、データ量の合計は 10 GB 未満です。\n\nストレージ ソリューションは以下の要件を満たす必要があります：\n\n・ストレージに書き込まれたすべてのデータは最低 5 年間保持されること\n・データが書き込まれた後は読み取り専用となり、保持期間中は変更や削除が許可されないこと\n・5 年間の保持期間が経過した後は、データを削除できること\n\nどのストレージ ソリューションを推奨しますか？","choices":[{"text":"アーカイブ アクセス層用の Blob ストレージを持つ汎用 v2","is_correct":false},{"text":"クール アクセス層用の Blob ストレージを持つ汎用 v2","is_correct":false},{"text":"ホット アクセス層用の Blob ストレージを持つ汎用 v2","is_correct":true}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">機密データ＋毎日アクセス＋書込み後変更不可</text><rect x=\"20\" y=\"35\" width=\"200\" height=\"130\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#888\" stroke-width=\"1\"/><text x=\"120\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#888\">要件</text><text x=\"120\" y=\"60\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・毎日アクセス（高頻度）</text><text x=\"120\" y=\"77\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・10 GB 未満</text><text x=\"120\" y=\"94\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・書込み後変更不可（WORM）</text><text x=\"120\" y=\"111\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・機密データ</text><rect x=\"240\" y=\"35\" width=\"165\" height=\"60\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"322\" y=\"57\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">ホット アクセス層</text><text x=\"322\" y=\"71\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">毎日アクセス → Hot最適</text><text x=\"322\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">汎用 v2 ストレージ</text><rect x=\"240\" y=\"108\" width=\"165\" height=\"60\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"322\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">コンテナーアクセスポリシー</text><text x=\"322\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">WORM(書込一度のみ)</text><text x=\"322\" y=\"158\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">変更・削除を防止</text><rect x=\"430\" y=\"35\" width=\"160\" height=\"60\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"510\" y=\"57\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">クール層</text><text x=\"510\" y=\"71\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">低頻度向け。毎日</text><text x=\"510\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">アクセスはコスト高</text><rect x=\"430\" y=\"108\" width=\"160\" height=\"60\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"510\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">コンテナーアクセスレベル</text><text x=\"510\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">公開/非公開設定のみ</text><text x=\"510\" y=\"158\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">変更防止機能なし</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">アクセス層:Hot=高頻度 / ポリシー:コンテナーアクセスポリシー=WORM的な変更防止</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：①毎日アクセスされる（高頻度）、②機密データの暗号化が必要、③10 GB 未満（少量）、④最小コスト。\n\n<strong>汎用 v2 + ホット アクセス層</strong>：毎日アクセスするデータにはホット層が最適（アクセスコストが最安）。少量データのためストレージコストも低く抑えられます。汎用 v2 は Azure Storage Encryption（SSE）による保存時暗号化をデフォルトでサポートし、CMK（カスタマー マネージド キー）にも対応。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>アーカイブ アクセス層：</strong> めったにアクセスしないデータ向け（リハイドレーションに最大 15 時間）。毎日アクセスするデータには致命的に不適切 ❌\n\n<strong>クール アクセス層：</strong> 30 日以上アクセスしないデータ向け。毎日アクセスするとアクセスコストがホット層より高くなり、トータルコストが増加する ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">アクセス層の選択は「アクセス頻度」で決まります：\n\n• <strong>ホット</strong>：毎日〜週 1 回以上 → ストレージコスト高・アクセスコスト安\n• <strong>クール</strong>：月 1 回程度 → ストレージコスト中・アクセスコスト中\n• <strong>コールド</strong>：年 1〜2 回\n• <strong>アーカイブ</strong>：ほとんどアクセスなし → ストレージコスト最安・アクセスコスト最高</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">アクセス層</th><th>アクセス頻度の目安</th><th>ストレージコスト</th><th>アクセスコスト</th><th>最小保存期間</th></tr></thead><tbody><tr><td class=\"cc\">ホット ✅</td><td>毎日〜頻繁</td><td>高</td><td>最安</td><td>なし</td></tr><tr><td class=\"cc\">クール</td><td>月 1 回程度</td><td>中</td><td>中</td><td>30 日</td></tr><tr><td class=\"cc\">コールド</td><td>年 1〜2 回</td><td>低</td><td>高め</td><td>90 日</td></tr><tr><td class=\"cc\">アーカイブ</td><td>ほぼアクセスなし</td><td>最安</td><td>最高</td><td>180 日</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「毎日アクセス + 暗号化 + 最小コスト」= <strong>汎用 v2 + ホット層</strong>。頻繁なアクセスにはホット層が最もコスト効率が良い。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/blobs/access-tiers-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/storage/blobs/access-tiers-overview</a></li></ul></div>\n</div>"},{"num":4,"id":"q4","domain":"データストレージ設計","domain_code":"DS","domain_color":"#0078D4","question_text":"機密データ用の Azure ストレージ ソリューションを設計しています。データには毎日アクセスされ、データ量の合計は 10 GB 未満です。\n\nストレージ ソリューションは以下の要件を満たす必要があります：\n\n・ストレージに書き込まれたすべてのデータは最低 5 年間保持されること\n・データが書き込まれた後は読み取り専用となり、保持期間中は変更や削除が許可されないこと\n・5 年間の保持期間が経過した後は、データを削除できること\n\n不変性ポリシーを実装するために使用すべきものはどれですか？","choices":[{"text":"コンテナー アクセス レベル","is_correct":false},{"text":"コンテナー アクセス ポリシー","is_correct":true},{"text":"ストレージ アカウント リソース ロック","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">機密データ＋毎日アクセス＋書込み後変更不可</text><rect x=\"20\" y=\"35\" width=\"200\" height=\"130\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#888\" stroke-width=\"1\"/><text x=\"120\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#888\">要件</text><text x=\"120\" y=\"60\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・毎日アクセス（高頻度）</text><text x=\"120\" y=\"77\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・10 GB 未満</text><text x=\"120\" y=\"94\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・書込み後変更不可（WORM）</text><text x=\"120\" y=\"111\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・機密データ</text><rect x=\"240\" y=\"35\" width=\"165\" height=\"60\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"322\" y=\"57\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">ホット アクセス層</text><text x=\"322\" y=\"71\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">毎日アクセス → Hot最適</text><text x=\"322\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">汎用 v2 ストレージ</text><rect x=\"240\" y=\"108\" width=\"165\" height=\"60\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"322\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">コンテナーアクセスポリシー</text><text x=\"322\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">WORM(書込一度のみ)</text><text x=\"322\" y=\"158\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">変更・削除を防止</text><rect x=\"430\" y=\"35\" width=\"160\" height=\"60\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"510\" y=\"57\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">クール層</text><text x=\"510\" y=\"71\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">低頻度向け。毎日</text><text x=\"510\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">アクセスはコスト高</text><rect x=\"430\" y=\"108\" width=\"160\" height=\"60\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"510\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">コンテナーアクセスレベル</text><text x=\"510\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">公開/非公開設定のみ</text><text x=\"510\" y=\"158\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">変更防止機能なし</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">アクセス層:Hot=高頻度 / ポリシー:コンテナーアクセスポリシー=WORM的な変更防止</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「特定のユーザーのみがコンテナー内の BLOB にアクセスできるよう、<strong>時間ベースで制御</strong>する」。\n\n<strong>コンテナー アクセス ポリシー（Stored Access Policy）</strong>：SAS トークンに有効期限・権限を定義するポリシーです。ポリシーを更新・削除することで SAS を即座に無効化・変更でき、特定ユーザーへの時間制限付きアクセスを細かく管理できます。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>コンテナー アクセス レベル：</strong> コンテナー全体を「プライベート」「Blob（匿名読み取り）」「コンテナー（完全匿名）」に設定するもの。<strong>特定のユーザーに限定した制御はできない</strong> ❌\n\n<strong>ストレージ アカウント リソース ロック：</strong> リソースの削除・変更を防ぐ管理操作のロック。アクセス制御（誰が読み書きできるか）とは全く別の機能 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「コンテナー アクセス レベル」と「コンテナー アクセス ポリシー」は名前が似ていて非常に混同しやすいです：\n\n• <strong>アクセス レベル</strong>：公開範囲の設定（プライベート・Blob 公開・完全公開）\n• <strong>アクセス ポリシー（Stored Access Policy）</strong>：SAS ベースの細かいアクセス制御（期限・権限・失効）\n\n特定ユーザーへの時間制限アクセス → Stored Access Policy を選ぶ。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>機能</th><th>アクセス レベル</th><th class=\"cc\">Stored Access Policy ✅</th><th>リソース ロック</th></tr></thead><tbody><tr><td>目的</td><td>コンテナーの公開範囲設定</td><td class=\"cc\">SAS の期限・権限管理</td><td>リソース操作の制限</td></tr><tr><td>特定ユーザー制御</td><td>❌</td><td class=\"cc\">✅</td><td>❌</td></tr><tr><td>時間制限</td><td>❌</td><td class=\"cc\">✅</td><td>❌</td></tr><tr><td>SAS の即時失効</td><td>❌</td><td class=\"cc\">✅（ポリシー削除で無効化）</td><td>❌</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「特定ユーザー + 時間制限 + 即時失効」= <strong>コンテナー アクセス ポリシー（Stored Access Policy）</strong>。アクセス レベルは公開範囲設定で別物。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul cl ong> フェールオーバーは可能だが、個別ファイルのポイント イン タイム復元はサポートしない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">ASR と Backup は「代替関係」ではなく「補完関係」です。それぞれ異なる目的のために設計されており、両方の要件がある場合は両方使います。\n\nASR は「VM をまるごと別リージョンに持っていく」もの。Backup は「特定の時点の特定ファイルを取り出す」もの。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">DR フェールオーバー + 個別ファイル復元の両方が要件 → <strong>ASR + Backup の両方</strong>が必要。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/backup/backup-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/backup/backup-overview</a></li></ul></div>\n</div>"},{"num":9,"id":"q9","domain":"ビジネス継続性設計","domain_code":"BC","domain_color":"#107C10","question_text":"組織は、オンプレミスのデータ センターで販売、財務、レポート アプリケーションをホストする仮想マシンに対して、以下のビジネス継続性とディザスター リカバリー (BCDR) 要件を定義しています：\n\n・販売アプリケーション：二次オンプレミス データ センターへのフェールオーバーをサポートすること\n・レポート アプリケーション：日次粒度でのポイントインタイム データ リカバリーをサポートし、RTO は 8 時間であること\n・財務アプリケーション：7 年間のデータ保持が必要で、災害発生時は Azure から実行でき、RTO は 10 分であること\n\nレポート アプリケーションの要件を満たすために使用すべきサービスはどれですか？","choices":[{"text":"Azure Backup のみ","is_correct":true},{"text":"Azure Site Recovery のみ","is_correct":false},{"text":"Azure Site Recovery と Azure Backup","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">BCDR: Site Recovery + Backup（Q7-9）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Q7・Q8・Q9 の判断フロー：\n「DR が必要か？」→ Yes → ASR が必要\n「個別ファイル復元が必要か？」→ Yes → Backup が必要\n\n両方 Yes → 両方、DR のみ → ASR のみ、復元のみ → Backup のみ</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「個別ファイルの復元のみ、DR は不要」→ <strong>Azure Backup のみ</strong>。ASR は不要（コスト削減）。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/backup/backup-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/backup/backup-overview</a></li></ul></div>\n</div>"},{"num":10,"id":"q10","domain":"インフラストラクチャ設計","domain_code":"IS","domain_color":"#C50F1F","question_text":"Azure Kubernetes Service (AKS) クラスターにホストされるマイクロサービス ベースのアーキテクチャを設計しています。これらのマイクロサービスを使用するアプリケーションは Azure 仮想マシン上で実行されます。仮想マシンと AKS クラスターはいずれも同じ仮想ネットワーク内にデプロイされます。\n\nコンシューマー アプリケーションにマイクロサービスを公開しながら、以下の要件を満たすソリューションを設計する必要があります：\n\n・マイクロサービスへのイングレス アクセスは単一のプライベート IP アドレスに制限され、相互 TLS (mTLS) 認証を使用して保護されること\n・ソリューションはマイクロサービスへの受信リクエストにレート制限を適用すること\n・コストを最小化すること\n\nこの要件を満たすためにソリューションに含めるべきものはどれですか？","choices":[{"text":"仮想ネットワーク接続を持つ Azure API Management Premium レベル","is_correct":true},{"text":"Azure Web Application Firewall (WAF) を持つ Azure Front Door","is_correct":false},{"text":"サービス エンドポイントを持つ Azure API Management Standard レベル","is_correct":false},{"text":"Azure Web Application Firewall (WAF) を持つ Azure Application Gateway","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">AKS マイクロサービス + VM（Q10）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" ma  height=\"62\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"402\" y=\"49\" width=\"76\" height=\"28\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"440\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">AKS</text>\n<text x=\"440\" y=\"86\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">AKS</text>\n<text x=\"440\" y=\"97\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">マイクロサービス</text>\n<line x1=\"244\" y1=\"75\" x2=\"270\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"260\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">内部アクセス</text>\n<line x1=\"364\" y1=\"75\" x2=\"390\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n</svg></div><img src=\"picture/vol3_q10_aks_vm.png\" style=\"width:100%;border-radius:4px;max-width:760px;\"></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「AKS クラスター内のマイクロサービスを、<strong>VNet 内の他のサービスにのみ公開（インターネット公開なし）</strong>し、API の一元管理を行う」。\n\n<strong>Azure API Management Premium（VNet 接続）</strong>：Premium レベルは VNet 統合をサポートし、AKS と同じ VNet 内に配置できます。外部からはアクセスできず、VNet 内のサービスのみが API にアクセス可能。認証・レート制限・監視も一元提供します。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Front Door + WAF：</strong> グローバルな HTTP ロード バランサー。インターネット向けであり、VNet 内プライベート公開には使えない ❌\n\n<strong>API Management Standard（サービス エンドポイント）：</strong> Standard レベルは VNet 統合をサポートしない（Premium 専用機能）❌\n\n<strong>Application Gateway + WAF：</strong> L7 ロード バランサーで VNet 内配置は可能だが、API ゲートウェイ機能（認証・レート制限・変換）がない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</di ce の複数リージョン展開\n\nすべてが揃って初めて Yes になります。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Yes/No 問題：提示されたソリューションが要件を<strong>すべて</strong>満たすかを慎重に確認。一つでも欠けたら No。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/architecture/reference-architectures/app-service-web-app/multi-region\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/architecture/reference-architectures/app-service-web-app/multi-region</a></li></ul></div>\n</div>"},{"num":12,"id":"q12","domain":"ビジネス継続性設計","domain_code":"BC","domain_color":"#107C10","question_text":"注意：この問題は同じシナリオを使用する関連問題のセットの一部です。各問題は要件を満たす場合と満たさない場合のある異なるソリューションを提示します。\n\n複数の Azure リージョンにまたがって、Azure Web アプリの複数のインスタンスをデプロイする計画があります。\n\n以下のレプリケーションと可用性の要件を満たすアクセス ソリューションを設計する必要があります：\n\n・ソリューションはレート制限をサポートすること\n・リクエストはデプロイされたすべてのインスタンスに分散されること\n・リージョンの停止が発生してもユーザーがアプリケーションにアクセスできること\n\n提案されたソリューション：アプリへのアクセスを提供するために Azure Traffic Manager を使用する。\n\nこのソリューションは要件を満たしていますか？","choices":[{"text":"Yes（はい）","is_correct":false},{"text":"No（いいえ）","is_correct":true}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">マルチリージョン Web App（Q11-14）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"156\" y=\"44\" width=\"88\" height=\"62\" rx= r=\"middle\" font-size=\"9\" fill=\"#1B5E20\">承認ワークフロー</text><rect x=\"220\" y=\"118\" width=\"160\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"300\" y=\"131\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">有効期限付きアクセス付与</text><rect x=\"220\" y=\"143\" width=\"160\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"300\" y=\"156\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">自動削除・レビュー</text><rect x=\"460\" y=\"50\" width=\"200\" height=\"80\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"560\" y=\"82\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">その他の選択肢</text><text x=\"560\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">条件付きアクセス: 既存ユーザー向け</text><text x=\"560\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Entra 参加: デバイス管理</text><line x1=\"150\" y1=\"90\" x2=\"208\" y2=\"90\" stroke=\"#7719AA\" stroke-width=\"2\" marker-end=\"url(#ap)\"/><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">エンタイトルメント管理: 外部組織へのアクセスを申請→承認→期限付き付与→自動削除で管理</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「他社（Fabrikam）の外部ユーザーに App1 へのアクセスを付与し、アクセス ライフサイクル（申請・承認・期限切れ・自動削除）を管理する」。\n\n<strong>Microsoft Entra エンタイトルメント管理（Entitlement Management）</strong>：アクセス パッケージで外部ユーザーへのリソースへのアクセスを一括管理し、申請・承認・定期レビュー・自動削除のライフサイクルを自動化します。別テナントの外部ユーザー（B2B ゲスト）の管理に最適。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>条件付きアクセス ポリシー：</strong> サインイン時の条件（MFA・デバイス準拠）を制御するもの。アクセス権のライフサイクル管理はできない ❌\n\n<strong>Entra プロビジョニング サービス：</strong> HR システムや SaaS アプリへのユーザー プロビジョニング自動化。外部ユーザーのアクセス権管理とは目的が異なる ❌\n\n<strong>Entra 参加（Join）：</strong> デバイスを Entra ID に参加させる機能。外部ユーザー管理には無関係 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">エンタイトルメント管理とアクセス レビューの違い：\n\n• <strong>エンタイトルメント管理</strong>：アクセス「申請〜付与〜失効」のライフサイクル全体（将来）\n• <strong>アクセス レビュー</strong>：すでに持っているアクセス権を「定期確認して削除する」（現在の棚卸し）</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">機能</th><th>目的</th><th>外部ユーザー対応</th><th>ライフサイクル管理</th></tr></thead><tbody><tr><td class=\"cc\">エンタイトルメント管理 ✅</td><td>アクセス申請〜付与〜失効</td><td>B2B ゲスト対応</td><td>完全管理</td></tr><tr><td class=\"cc\">アクセス レビュー</td><td>既存アクセスの定期確認・削除</td><td>✅</td><td>△（削除フェーズのみ）</td></tr><tr><td class=\"cc\">条件付きアクセス</td><td>サインイン条件の制御</td><td>✅</td><td>❌</td></tr><tr><td class=\"cc\">PIM</td><td>特権ロールの JIT アクセス</td><td>△</td><td>△（特権 ID のみ）</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「外部ユーザーへのアクセス申請・承認・自動失効」= <strong>エンタイトルメント管理</strong>。外部 B2B ユーザーのアクセス ライフサイクル全体を管理できる。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/active-directory/governance/entitlement-management-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/active-directory/governance/entitlement-management-overview</a></li></ul></div>\n</div>"},{"num":22,"id":"q22","domain":"データストレージ設計","domain_code":"DS","domain_color":"#0078D4","question_text":"組織には以下のオンプレミス Microsoft SQL Server データベースからデータを使用する App1 というアプリケーションがあります：\n\n・DB1：450 GB\n・DB2：250 GB\n・DB3：300 GB\n・DB4：50 GB\n\nApp1 とそのデータは毎月第 1 日のみアクセスされます。データ量は年間 3% 以内の増加が見込まれます。\n\n会社は App1 を Azure ベースの Web アプリケーションとして再設計し、既存のすべてのデータを Azure に移行する計画です。\n\nデータを Azure SQL Database に移行し、毎月第 1 日のみデータベースを利用可能にする必要があります。\n\nどの Azure SQL Database サービス レベルを選択すべきですか？","choices":[{"text":"vCore ベースの General Purpose（汎用目的）","is_correct":true},{"text":"DTU ベースの Basic","is_correct":false},{"text":"DTU ベースの Standard","is_correct":false},{"text":"vCore ベースの Business Critical（ビジネス クリティカル）","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"35\" width=\"150\" height=\"80\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"95\" y=\"67\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">オンプレ SQL Server</text><text x=\"95\" y=\"81\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">DB1:450GB DB2:250GB</text><text x=\"95\" y=\"95\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">DB3:300GB DB4:50GB</text><rect x=\"240\" y=\"20\" width=\"185\" height=\"155\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"332\" y=\"89\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">vCore 汎用目的</text><text x=\"332\" y=\"103\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">(General Purpose)</text><rect x=\"250\" y=\"58\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"332\" y=\"71\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">vCore: ライセンス移行可 ✅</text><rect x=\"250\" y=\"83\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"332\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">AHB で SQL Server 費用削減</text><rect x=\"250\" y=\"108\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"332\" y=\"121\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">GB 単位スケール (450GB超対応)</text><rect x=\"250\" y=\"133\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"332\" y=\"146\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">可用性99.99% ✅</text><rect x=\"250\" y=\"158\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"332\" y=\"171\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">コスト最適（Business Criticalより低）</text><rect x=\"500\" y=\"35\" width=\"170\" height=\"80\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"585\" y=\"67\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">DTU モデル</text><text x=\"585\" y=\"81\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ライセンス持込不可</text><text x=\"585\" y=\"95\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">スケール単位が粗い</text><rect x=\"500\" y=\"130\" width=\"170\" height=\"50\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"585\" y=\"147\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">Business Critical</text><text x=\"585\" y=\"161\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Premium SSD・同期レプリカ</text><text x=\"585\" y=\"175\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">必要以上にコスト高</text><line x1=\"170\" y1=\"75\" x2=\"238\" y2=\"90\" stroke=\"#107C10\" stroke-width=\"2\" marker-end=\"url(#ag)\"/><text x=\"350\" y=\"188\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">vCore選択→Azure Hybrid Benefit(AHB)でオンプレSQLライセンス流用可。DTUでは不可</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：DB1（450 GB）+ DB2（250 GB）= <strong>700 GB 以上のデータ</strong>を Azure SQL Database に移行。コスト最適化と拡張性が重要。\n\n<strong>vCore ベースの General Purpose（汎用目的）</strong>：vCore モデルはコンピューティングとストレージを独立してスケール可能。General Purpose は 4 TB までのストレージをサポートし（DTU Basic は最大 2 GB）、汎用ワークロードに適したコスト効率の良い選択です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>DTU ベースの Basic：</strong> 最大ストレージが <strong>2 GB</strong>。450 GB のデータベースは格納不可 ❌\n\n<strong>DTU ベースの Standard：</strong> 最大 1 TB はサポートするが、DTU モデルはコンピューティングとストレージが連動するため柔軟性が低い ❌\n\n<strong>Business Critical：</strong> 高パフォーマンス・ゾーン冗長が特徴。一般的なワークロードには過剰でコストが高い ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">DTU モデルと vCore モデルの違い：\n\n• <strong>DTU モデル</strong>：コンピューティング・ストレージ・I/O がバンドル。Basic 最大 2 GB、Standard 最大 1 TB\n• <strong>vCore モデル</strong>：コンピューティングとストレージを独立してスケール。最大 4 TB\n\n大容量（700 GB+）かつコスト効率重視 → vCore General Purpose。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>サービス層</th><th>最大ストレージ</th><th class=\"cc\">コスト</th><th>700 GB 対応</th></tr></thead><tbody><tr><td>DTU Basic</td><td>2 GB</td><td class=\"cc\">最安</td><td>不可</td></tr><tr><td>DTU Standard</td><td>1 TB</td><td class=\"cc\">低</td><td>✅（柔軟性低）</td></tr><tr><td>vCore General Purpose ✅</td><td>4 TB</td><td class=\"cc\">中</td><td>最適</td></tr><tr><td>vCore Business Critical</td><td>4 TB</td><td class=\"cc\">高</td><td>✅（過剰）</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">700 GB 超の SQL DB 移行 + コスト効率 = <strong>vCore General Purpose</strong>。DTU Basic は 2 GB 上限で絶対不可。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/azure-sql/database/service-tiers-general-purpose-business-critical\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/azure-sql/database/service-tiers-general-purpose-business-critical</a></li></ul></div>\n</div>"},{"num":23,"id":"q23","domain":"データストレージ設計","domain_code":"DS","domain_color":"#0078D4","question_text":"以下の要件を満たす Azure Storage ソリューションを推奨する必要があります：\n\n・最大 1 PB のデータをサポートすること\n・データを Blob ストレージに格納すること\n・ストレージ ソリューションが 3 レベルのサブフォルダーをサポートすること\n・ストレージ ソリューションがアクセス制御リスト (ACL) をサポートすること\n\n推奨に含めるべきものはどれですか？","choices":[{"text":"ページ BLOB 用に構成されたプレミアム ストレージ アカウント","is_correct":false},{"text":"ブロック BLOB 用に構成されたプレミアム ストレージ アカウント","is_correct":false},{"text":"大容量ファイル共有をサポートするファイル共有用に構成されたプレミアム ストレージ アカウント","is_correct":false},{"text":"階層型名前空間が有効化された汎用 v2 ストレージ アカウント","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 190\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><text x=\"350\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#003F73\" font-weight=\"700\">要件: 1PB + Blob + 3レベルサブフォルダ + ACL</text><rect x=\"20\" y=\"35\" width=\"200\" height=\"130\" rx=\"8\" fill=\"#F8F8F8\" stroke=\"#888\" stroke-width=\"1\"/><text x=\"120\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#888\">要件</text><text x=\"120\" y=\"62\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・最大 1 PB</text><text x=\"120\" y=\"79\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・Blob ストレージに格納</text><text x=\"120\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・3 レベルのサブフォルダー</text><text x=\"120\" y=\"113\" text-anchor=\"middle\" font-size=\"9\" fill=\"#333\">・ACL（アクセス制御リスト）</text><rect x=\"240\" y=\"35\" width=\"195\" height=\"130\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"337\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">汎用v2 + 階層型名前空間</text><text x=\"337\" y=\"106\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">(= ADLS Gen2)</text><rect x=\"250\" y=\"75\" width=\"175\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"337\" y=\"88\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">POSIX ACL サポート ✅</text><rect x=\"250\" y=\"100\" width=\"175\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"337\" y=\"113\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ディレクトリ/サブフォルダ ✅</text><rect x=\"250\" y=\"125\" width=\"175\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"337\" y=\"138\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Blob API 対応 ✅</text><rect x=\"250\" y=\"150\" width=\"175\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"337\" y=\"163\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">1PB 以上スケール ✅</text><rect x=\"460\" y=\"35\" width=\"200\" height=\"130\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"560\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">ページ BLOB プレミアム</text><text x=\"560\" y=\"106\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">VM ディスク専用</text><text x=\"560\" y=\"120\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">ACL 非対応</text><text x=\"350\" y=\"185\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">ACL が要件 → ADLS Gen2（階層型名前空間）が唯一の選択肢</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">\n要件の核心は <strong>ACL（アクセス制御リスト）のサポート</strong>です。<br><br>\n<strong>階層型名前空間が有効化された汎用 v2（= Azure Data Lake Storage Gen2）</strong>のみが、<br>\nPOSIX 準拠の ACL をサポートします。<br><br>\nまた「3 レベルのサブフォルダー」は階層型名前空間によるディレクトリ構造で実現します。<br>\nBlob ストレージとして扱いつつ、ディレクトリ・ACL も使えるのが ADLS Gen2 の特徴です。\n</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\">\n<strong>ページ BLOB 用プレミアム</strong>：SSD 上の仮想ディスク（VM の OS/データ ディスク）向け。ACL 非対応。サブフォルダー構造なし ❌<br><br>\n<strong>ブロック BLOB 用プレミアム</strong>：高スループット Blob 向け。ACL は階層型名前空間なしでは POSIX ACL 非対応 ❌<br><br>\n<strong>大容量ファイル共有用プレミアム</strong>：SMB/NFS ファイル共有向け。「Blob ストレージに格納」要件に不一致 ❌\n</div></div>\n<div class=\"exp-block exp-tip\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">\n<strong>ACL = ADLS Gen2（階層型名前空間）の固有機能</strong>と覚える。<br>\n通常の汎用 v2 Blob ではコンテナー・BLOB レベルの RBAC のみでファイル/ディレクトリ単位の ACL は使えない。\n</div></div>\n<div class=\"exp-block exp-table\"><div class=\"exp-block-label\">ストレージ選択比較</div><div class=\"exp-block-body\">\n<table style=\"width:100%;border-collapse:collapse;font-size:12px\">\n<tr style=\"background:#0072C6;color:#fff\"><th style=\"padding:6px;border:1px solid #ddd\">種類</th><th style=\"padding:6px;border:1px solid #ddd\">ACL</th><th style=\"padding:6px;border:1px solid #ddd\">階層フォルダ</th><th style=\"padding:6px;border:1px solid #ddd\">Blob格納</th><th style=\"padding:6px;border:1px solid #ddd\">用途</th></tr>\n<tr style=\"background:#E8F5E9\"><td style=\"padding:5px;border:1px solid #ddd\"><strong>汎用v2 + HNS (ADLS Gen2)</strong></td><td style=\"padding:5px;border:1px solid #ddd;color:#107C10\">✅</td><td style=\"padding:5px;border:1px solid #ddd;color:#107C10\">✅</td><td style=\"padding:5px;border:1px solid #ddd;color:#107C10\">✅</td><td style=\"padding:5px;border:1px solid #ddd\">ビッグデータ分析</td></tr>\n<tr><td style=\"padding:5px;border:1px solid #ddd\">ページ BLOB プレミアム</td><td style=\"padding:5px;border:1px solid #ddd;color:#C50F1F\">❌</td><td style=\"padding:5px;border:1px solid #ddd;color:#C50F1F\">❌</td><td style=\"padding:5px;border:1px solid #ddd;color:#107C10\">✅</td><td style=\"padding:5px;border:1px solid #ddd\">VM ディスク</td></tr>\n<tr><td style=\"padding:5px;border:1px solid #ddd\">ブロック BLOB プレミアム</td><td style=\"padding:5px;border:1px solid #ddd;color:#C50F1F\">❌</td><td style=\"padding:5px;border:1px solid #ddd;color:#C50F1F\">❌</td><td style=\"padding:5px;border:1px solid #ddd;color:#107C10\">✅</td><td style=\"padding:5px;border:1px solid #ddd\">高スループット</td></tr>\n<tr><td style=\"padding:5px;border:1px solid #ddd\">ファイル共有プレミアム</td><td style=\"padding:5px;border:1px solid #ddd;color:#C50F1F\">❌</td><td style=\"padding:5px;border:1px solid #ddd;color:#107C10\">✅</td><td style=\"padding:5px;border:1px solid #ddd;color:#C50F1F\">❌</td><td style=\"padding:5px;border:1px solid #ddd\">SMB/NFS 共有</td></tr>\n</table>\n</div></div>\n<div class=\"exp-block exp-docs\"><div class=\"exp-block-label\">公式ドキュメント</div><div class=\"exp-block-body\">\n<a href=\"https://learn.microsoft.com/ja-jp/azure/storage/blobs/data-lake-storage-access-control\" target=\"_blank\">Azure Data Lake Storage の ACL</a><br>\n<a href=\"https://learn.microsoft.com/ja-jp/azure/storage/blobs/data-lake-storage-introduction\" target=\"_blank\">Azure Data Lake Storage Gen2 の概要</a>\n</div></div>\n</div>"},{"num":24,"id":"q24","domain":"データストレージ設計","domain_code":"DS","domain_color":"#0078D4","question_text":"ファイル共有をホストする Azure ストレージ アカウントを作成する計画があります。これらのファイル共有は、オンプレミス環境で実行されるトランザクション集中型アプリケーションからアクセスされます。\n\n以下の要件を満たすソリューションを推奨する必要があります：\n\n・ファイル共有を使用する際のアクセス遅延を最小化すること\n・選択したストレージ オプションで利用可能な最高レベルの回復性を提供すること\n\n推奨事項のストレージ層はどれですか？","choices":[{"text":"ホット","is_correct":false},{"text":"プレミアム","is_correct":true},{"text":"トランザクション最適化","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"40\" width=\"150\" height=\"80\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"95\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">オンプレ アプリ</text><text x=\"95\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">トランザクション集中型</text><text x=\"95\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">SMB ファイル共有</text><rect x=\"240\" y=\"20\" width=\"185\" height=\"145\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"332\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Files プレミアム</text><text x=\"332\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">ファイル共有 SKU</text><rect x=\"250\" y=\"60\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"332\" y=\"73\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">SSD ベース低遅延 ✅</text><rect x=\"250\" y=\"85\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"332\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">高 IOPS（トランザクション集中）✅</text><rect x=\"250\" y=\"110\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"332\" y=\"123\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ZRS と組み合せ可 ✅</text><rect x=\"250\" y=\"135\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"332\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Q24: プレミアム層が正解</text><rect x=\"500\" y=\"40\" width=\"170\" height=\"80\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"585\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">ホット層</text><text x=\"585\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Blob 用の概念</text><text x=\"585\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Files には無効</text><rect x=\"500\" y=\"135\" width=\"170\" height=\"45\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"585\" y=\"149\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">トランザクション最適化</text><text x=\"585\" y=\"163\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Standard HDD ベース</text><text x=\"585\" y=\"177\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">低 IOPS</text><line x1=\"170\" y1=\"80\" x2=\"238\" y2=\"90\" stroke=\"#7719AA\" stroke-width=\"2\" marker-end=\"url(#ap)\"/><rect x=\"20\" y=\"155\" width=\"350\" height=\"22\" rx=\"6\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"1.5\"/><text x=\"195\" y=\"170\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Q25: ZRS = 同リージョン3AZ冗長 (単一DC障害に対応)</text><rect x=\"380\" y=\"155\" width=\"290\" height=\"22\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1.5\"/><text x=\"525\" y=\"170\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">GRS/RA-GRS: 別リージョン複製(不要コスト追加)</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「トランザクション集中型アプリケーションがオンプレミスからファイル共有にアクセスする」。\n\n<strong>プレミアム ファイル共有（FileStorage アカウント）</strong>：SSD ベースで低レイテンシ・高 IOPS を提供します。トランザクション集中型アクセスに最適で、SMB/NFS プロトコルでオンプレミスからマウント可能です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>ホット：</strong> ホット アクセス層は Blob ストレージの概念。Azure Files の「ホット」層は HDD ベースでプレミアムより性能が低い ❌\n\n<strong>トランザクション最適化：</strong> Azure Files の Standard 層でも HDD ベースのため、プレミアムの SSD よりレイテンシが高く、トランザクション集中型には不十分 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Azure Files のアクセス層（ファイル共有専用）と Azure Blob Storage のアクセス層（ホット/クール/コールド/アーカイブ）は別の体系です。\n\nAzure Files の層：<strong>プレミアム（SSD）</strong>> トランザクション最適化 > ホット > クール（HDD）</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">Azure Files の層</th><th>ストレージ種別</th><th>レイテンシ</th><th>トランザクション集中型</th></tr></thead><tbody><tr><td class=\"cc\">プレミアム ✅</td><td>SSD</td><td>最低（1 ms 以下）</td><td>最適</td></tr><tr><td class=\"cc\">トランザクション最適化</td><td>HDD</td><td>中</td><td>△</td></tr><tr><td class=\"cc\">ホット（Files）</td><td>HDD</td><td>中〜高</td><td>❌</td></tr><tr><td class=\"cc\">クール（Files）</td><td>HDD</td><td>高</td><td>❌</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">トランザクション集中型のファイル共有 = <strong>プレミアム ファイル共有（SSD）</strong>。HDD ベースのトランザクション最適化では不十分。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/files/storage-files-planning\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/storage/files/storage-files-planning</a></li></ul></div>\n</div>"},{"num":25,"id":"q25","domain":"データストレージ設計","domain_code":"DS","domain_color":"#0078D4","question_text":"ファイル共有をホストする Azure ストレージ アカウントを作成する計画があります。これらのファイル共有は、オンプレミス環境で実行されるトランザクション集中型アプリケーションからアクセスされます。\n\n以下の要件を満たすソリューションを推奨する必要があります：\n\n・ファイル共有を使用する際のアクセス遅延を最小化すること\n・選択したストレージ オプションで利用可能な最高レベルの回復性を提供すること\n\n推奨事項の冗長性はどれですか？","choices":[{"text":"geo 冗長ストレージ (GRS)","is_correct":false},{"text":"ゾーン冗長ストレージ (ZRS)","is_correct":true},{"text":"ローカル冗長ストレージ (LRS)","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"40\" width=\"150\" height=\"80\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"95\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">オンプレ アプリ</text><text x=\"95\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">トランザクション集中型</text><text x=\"95\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">SMB ファイル共有</text><rect x=\"240\" y=\"20\" width=\"185\" height=\"145\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"332\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Azure Files プレミアム</text><text x=\"332\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">ファイル共有 SKU</text><rect x=\"250\" y=\"60\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"332\" y=\"73\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">SSD ベース低遅延 ✅</text><rect x=\"250\" y=\"85\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"332\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">高 IOPS（トランザクション集中）✅</text><rect x=\"250\" y=\"110\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"332\" y=\"123\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">ZRS と組み合せ可 ✅</text><rect x=\"250\" y=\"135\" width=\"165\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"332\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Q24: プレミアム層が正解</text><rect x=\"500\" y=\"40\" width=\"170\" height=\"80\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"585\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">ホット層</text><text x=\"585\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Blob 用の概念</text><text x=\"585\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Files には無効</text><rect x=\"500\" y=\"135\" width=\"170\" height=\"45\" rx=\"8\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"2\"/><text x=\"585\" y=\"149\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C50F1F\">トランザクション最適化</text><text x=\"585\" y=\"163\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Standard HDD ベース</text><text x=\"585\" y=\"177\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">低 IOPS</text><line x1=\"170\" y1=\"80\" x2=\"238\" y2=\"90\" stroke=\"#7719AA\" stroke-width=\"2\" marker-end=\"url(#ap)\"/><rect x=\"20\" y=\"155\" width=\"350\" height=\"22\" rx=\"6\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"1.5\"/><text x=\"195\" y=\"170\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">Q25: ZRS = 同リージョン3AZ冗長 (単一DC障害に対応)</text><rect x=\"380\" y=\"155\" width=\"290\" height=\"22\" rx=\"6\" fill=\"#FFEBEE\" stroke=\"#C50F1F\" stroke-width=\"1.5\"/><text x=\"525\" y=\"170\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">GRS/RA-GRS: 別リージョン複製(不要コスト追加)</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">プレミアム ファイル共有（FileStorage アカウント）の冗長性オプションは制限されており、<strong>ZRS（ゾーン冗長ストレージ）</strong>が利用可能な最高レベルの冗長性です。\n\nZRS はデータを同一リージョン内の 3 つの可用性ゾーン（異なる物理データセンター）に同期的にレプリケートします。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>GRS（geo 冗長）：</strong> プレミアム ファイル共有（FileStorage アカウント）では GRS は<strong>サポートされていません</strong> ❌\n\n<strong>LRS（ローカル冗長）：</strong> 単一データセンター内の 3 コピー。ZRS より冗長性が低く、可用性ゾーン障害に対応できない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">ストレージ アカウントの種類ごとに利用できる冗長性オプションが異なります：\n\n• <strong>汎用 v2（GPv2）</strong>：LRS / ZRS / GRS / RA-GRS / GZRS / RA-GZRS すべて対応\n• <strong>プレミアム ブロック BLOB</strong>：LRS / ZRS のみ\n• <strong>プレミアム ファイル共有（FileStorage）</strong>：LRS / <strong>ZRS のみ</strong>（GRS 不可）\n• <strong>プレミアム ページ BLOB</strong>：LRS のみ</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>ストレージ種別</th><th>LRS</th><th>ZRS</th><th>GRS/RA-GRS</th><th>GZRS</th></tr></thead><tbody><tr><td>汎用 v2（GPv2）</td><td>✅</td><td>✅</td><td>✅</td><td>✅</td></tr><tr><td>プレミアム ブロック BLOB</td><td>✅</td><td>✅</td><td>❌</td><td>❌</td></tr><tr><td>プレミアム ファイル共有 ✅</td><td>✅</td><td>✅（最高）</td><td>❌</td><td>❌</td></tr><tr><td>プレミアム ページ BLOB</td><td>✅</td><td>❌</td><td>❌</td><td>❌</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">プレミアム ファイル共有で使える最高冗長性 = <strong>ZRS</strong>。GRS は非対応なので注意。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/common/storage-redundancy\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/storage/common/storage-redundancy</a></li></ul></div>\n</div>"},{"num":26,"id":"q26","domain":"ビジネス継続性設計","domain_code":"BC","domain_color":"#107C10","question_text":"App1 という Azure Web アプリと KV1 という Azure Key Vault があります。\n\nApp1 はデータベース接続文字列を KV1 に格納しています。\n\nApp1 は KV1 に対して以下の操作を実行します：Get、List、Wrap、Delete、Unwrap、Backup、Decrypt、Encrypt\n\nApp1 のサービス継続性を評価しています。\n\nKV1 をホストする Azure リージョンが利用不可になった場合のシナリオの結果を特定する必要があります：\n\nKV1 はどこにフェールオーバーしますか？","choices":[{"text":"同じ可用性セット内のサーバー","is_correct":false},{"text":"同じフォールト ドメイン内のサーバー","is_correct":false},{"text":"ペアリングされたリージョン内のサーバー","is_correct":true},{"text":"スケール セット内の仮想マシン","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 195\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"40\" width=\"130\" height=\"80\" rx=\"8\" fill=\"#FFF8E1\" stroke=\"#E67700\" stroke-width=\"2\"/><text x=\"85\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#E67700\">App1</text><text x=\"85\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">Web アプリ</text><text x=\"85\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\" \" fill=\"#7719AA\">Write 系操作</text><text x=\"550\" y=\"161\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">フェールオーバー中は</text><text x=\"550\" y=\"175\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">すべて制限される</text><line x1=\"150\" y1=\"80\" x2=\"213\" y2=\"90\" stroke=\"#E67700\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"375\" y1=\"100\" x2=\"448\" y2=\"78\" stroke=\"#0072C6\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><text x=\"350\" y=\"192\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">FR中=読み取り専用。Delete/Create/Update等の書き込み系はすべて利用不可</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Azure Key Vault のバックアップ/復元の制約：バックアップしたシークレット/キーは<strong>元の Key Vault と同じジオグラフィ内の Key Vault にのみ復元可能</strong>です。\n\n「<strong>ペアリングされたリージョン</strong>」は同じジオグラフィ内にあるため、復元先として有効です（例：Japan East ↔ Japan West は同じジオグラフィ内）。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>同じ可用性セット内のサーバー：</strong> VM の高可用性グループであり、Key Vault の復元先とは無関係 ❌\n\n<strong>同じフォールト ドメイン内のサーバー：</strong> VM の物理障害分離の概念。Key Vault の復元先とは無関係 ❌\n\n<strong>スケール セット内の VM：</strong> VM スケール セットは自動スケールの VM グループ。Key Vault 復元先とは無関係 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「ペアリングされたリージョン」と「ジオグラフィ」の関係：Azure のリージョン ペア（例：Japan East ↔ Japan West）は同じジオグラフィ内に存在します。Key Vault のバックアップ/復元は「同じジオグラフィ」が条件なので、ペアリングされたリージョンは有効な復元先です。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Key Vault バックアップの復元先 = <strong>同じジオグラフィ内</strong>の Key Vault。ペアリングされたリージョンは同じジオグラフィ内にあるため有効。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/key-vault/general/backup\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/key-vault/general/backup</a></li></ul></div>\n</div>"},{"num":27,"id":"q27","domain":"ビジネス継続性設計","domain_code":"BC","domain_color":"#107C10","question_text":"App1 という Azure Web アプリと KV1 という Azure Key Vault があります。\n\nApp1 はデータベース接続文字列を KV1 に格納しています。\n\nApp1 は KV1 に対して以下の操作を実行します：Get、List、Wrap、Delete、Unwrap、Backup、Decrypt、Encrypt\n\nApp1 のサービス継続性を評価しています。\n\nKV1 をホストする Azure リージョンが利用不可になった場合のシナリオの結果を特定する必要があります：\n\nフェールオーバー中に利用不可となるリクエストの種類はどれですか？","choices":[{"text":"Backup","is_correct":false},{"text":"Decrypt","is_correct":false},{"text":"Delete","is_correct":true},{"text":"Encrypt","is_correct":false},{"text":"Get","is_correct":false},{"text":"List","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 195\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#107C10\"/></marker><marker id=\"an\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#C50F1F\"/></marker><marker id=\"ap\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#7719AA\"/></marker></defs><rect x=\"20\" y=\"40\" width=\"130\" height=\"80\" rx=\"8\" fill=\"#FFF8E1\" stroke=\"#E67700\" stroke-width=\"2\"/><text x=\"85\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#E67700\">App1</text><text x=\"85\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">Web アプリ</text><text x=\"85\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" fill=\"#E67700\">KV1 にアクセス</text><rect x=\"215\" y=\"20\" width=\"160\" height=\"155\" rx=\"8\" fill=\"#E3F2FD\" stroke=\"#0072C6\" stroke-width=\"2\"/><text x=\"295\" y=\"89\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#0072C6\">KV1 Key Vault</text><text x=\"295\" y=\"103\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">フェールオーバー時</text><text x=\"295\" y=\"117\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0072C6\">→ 読み取り専用モード</text><rect x=\"225\" y=\"58\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#C8E6C9\"/><text x=\"295\" y=\"71\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Get 利用可</text><rect x=\"225\" y=\"83\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#C8E6C9\"/><text x=\"295\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Decrypt 利用可</text><rect x=\"225\" y=\"108\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#C8E6C9\"/><text x=\"295\" y=\"121\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">Encrypt 利用可</text><rect x=\"225\" y=\"133\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#C8E6C9\"/><text x=\"295\" y=\"146\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">List 利用可</text><rect x=\"225\" y=\"158\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#FFCDD2\"/><text x=\"295\" y=\"171\" text-anchor=\"middle\" font-size=\"9\" fill=\"#C50F1F\">Delete 利用不可 (Q27)</text><rect x=\"450\" y=\"40\" width=\"200\" height=\"75\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"550\" y=\"69\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">Q26: ペアリング先リージョン</text><text x=\"550\" y=\"83\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">KV はペアリングされた</text><text x=\"550\" y=\"97\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">リージョンへ自動 FR</text><rect x=\"450\" y=\"130\" width=\"200\" height=\"50\" rx=\"8\" fill=\"#EDE7F6\" stroke=\"#7719AA\" stroke-width=\"2\"/><text x=\"550\" y=\"147\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#7719AA\">Write 系操作</text><text x=\"550\" y=\"161\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">フェールオーバー中は</text><text x=\"550\" y=\"175\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7719AA\">すべて制限される</text><line x1=\"150\" y1=\"80\" x2=\"213\" y2=\"90\" stroke=\"#E67700\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"375\" y1=\"100\" x2=\"448\" y2=\"78\" stroke=\"#0072C6\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><text x=\"350\" y=\"192\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">FR中=読み取り専用。Delete/Create/Update等の書き込み系はすべて利用不可</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Azure Key Vault はリージョン障害によるフェールオーバー中に<strong>読み取り専用モード</strong>に入ります。この状態で使用できない（制限される）操作は <strong>Delete（削除）</strong>です。\n\nフェールオーバー中はキー・シークレット・証明書の削除はサポートされません。Get（取得）・Decrypt（復号）などの読み取り操作は通常通り動作します。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Backup（バックアップ）：</strong> 読み取り系操作のため、フェールオーバー中でも一般的には動作可能 ❌\n\n<strong>Decrypt（復号）：</strong> 読み取り系操作のため、フェールオーバー中でも動作可能（アプリが継続して動作できる）❌\n\n<strong>Encrypt（暗号化）：</strong> 読み取り系操作のため、フェールオーバー中でも動作可能 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「フェールオーバー中 = 読み取り専用」が核心です。\n\n• 読み取り系（Get/List/Decrypt/Encrypt）→ 動作\n• <strong>書き込み・削除系（Set/Delete/Create）→ 制限</strong>\n\n試験では「何ができなくなるか」の観点で問われることが多いです。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>操作</th><th>フェールオーバー中</th><th>理由</th></tr></thead><tbody><tr><td>Get（取得）</td><td>可能</td><td>読み取り専用モードで動作</td></tr><tr><td>Decrypt / Encrypt</td><td>可能</td><td>暗号化操作は読み取り系</td></tr><tr><td>Backup</td><td>可能</td><td>読み取り系</td></tr><tr><td>Delete（削除）✅問題の答え</td><td>不可</td><td>書き込み操作は制限</td></tr><tr><td>Set / Create</td><td>不可</td><td>書き込み操作は制限</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Key Vault フェールオーバー中 = <strong>読み取り専用モード</strong>。Delete など書き込み・削除操作は制限される。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/key-vault/general/disaster-recovery-guidance\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/key-vault/general/disaster-recovery-guidance</a></li></ul></div>\n</div>"},{"num":28,"id":"q28","domain":"ビジネス継続性設計","domain_code":"BC","domain_color":"#107C10","question_text":"オンプレミス ネットワークと Azure サブスクリプションがあり、オンプレミス環境には複数のブランチ オフィスがあります。\n\nトロントにある 1 つのブランチ オフィスに VM1 という仮想マシンがあり、ファイル サーバーとして機能しています。すべてのブランチ オフィスのユーザーが VM1 に格納された共有ファイルにアクセスしています。\n\nトロントのブランチ オフィスが利用不可になった場合でも、ユーザーが最低限の遅延で共有ファイルに引き続きアクセスできるソリューションを推奨する必要があります。\n\n推奨に含めるべきものはどれですか？","choices":[{"text":"Recovery Services コンテナーと Windows Server Backup","is_correct":false},{"text":"Azure ファイル共有と Azure File Sync","is_correct":true},{"text":"Recovery Services コンテナーと Azure Backup","is_correct":false},{"text":"Azure Blob コンテナーと Azure File Sync","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">ブランチ → VPN → Azure Files（Q28）</div><svg viewBox=\"0 0 640 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:640px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"640\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/>\n  </marker>\n  <marker id=\"arr_w\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\">\n    <polygon points=\"0 0,7 2.5,0 5\" fill=\"#ffffff\"/>\n  </marker>\n</defs>\n<rect x=\"386\" y=\"26\" widt 7\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">共有ストレージ</text>\n<line x1=\"244\" y1=\"75\" x2=\"270\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"260\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">S2S VPN</text>\n<line x1=\"364\" y1=\"75\" x2=\"390\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n</svg></div><img src=\"picture/vol3_q28_vpn_azurefiles.png\" style=\"width:100%;border-radius:4px;max-width:760px;\"></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「トロントのオンプレミス VM1 のファイルを Azure にバックアップし、<strong>他のオフィスからもアクセスできる</strong>ようにしたい。かつ VM1 の<strong>ローカル キャッシュ</strong>として高速アクセスも維持したい」。\n\n<strong>Azure ファイル共有 + Azure File Sync</strong>：Azure ファイル共有にファイルをクラウド同期（全拠点からアクセス可能）しながら、File Sync により VM1 のローカル ディスクにもキャッシュを保持（高速アクセス）します。多拠点間のファイル共有に最適。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Recovery Services コンテナー + Windows Server Backup：</strong> バックアップとしては機能するが、他のオフィスからのファイル アクセス共有という要件を満たさない ❌\n\n<strong>Recovery Services コンテナー + Azure Backup：</strong> 同様にバックアップは可能だが多拠点でのリアルタイム ファイル共有には使えない ❌\n\n<strong>Azure Blob コンテナー + Azure File Sync：</strong> File Sync は Azure Files（ファイル共有）と連携するものであり、Blob コンテナーとは連携しない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Azure Blob と Azure Files の違い：\n\n• <strong>Azure Blob</strong>：オブジェクト ストレージ。REST API でアクセス。SMB/NFS プロトコル不可\n• <strong>Azure Files</strong>：クラウド ファイル共有。SMB/NFS でマウント可能。File Sync に対応\n\nFile Sync は Azure Files（ファイル共有）専用。Blob コンテナーと Sync は連携しません。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>多拠点ファイル共有</th><th>ローカルキャッシュ</th><th>SMB マウント</th></tr></thead><tbody><tr><td class=\"cc\">Azure ファイル共有 + File Sync ✅</td><td>全拠点から</td><td>ローカルキャッシュ</td><td>✅</td></tr><tr><td class=\"cc\">Azure Backup</td><td>❌</td><td>❌</td><td>❌</td></tr><tr><td class=\"cc\">Azure Blob + File Sync</td><td>❌（非対応）</td><td>❌</td><td>❌</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「多拠点ファイル共有 + ローカルキャッシュ」= <strong>Azure ファイル共有 + Azure File Sync</strong>。File Sync は Blob ではなく Azure Files と連携する。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/file-sync/file-sync-introduction\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/storage/file-sync/file-sync-introduction</a></li></ul></div>\n</div>"},{"num":29,"id":"q29","domain":"データストレージ設計","domain_code":"DS","domain_color":"#0078D4","question_text":"オンプレミスのファイル サーバーに 2 TB のデータ ファイルが含まれています。\n\nこれらのデータ ファイルを西ヨーロッパ (West Europe) の Azure リージョンの Azure Blob Storage に移行する計画があります。\n\nストレージ アカウントの適切なアカウントの種類とレプリケーション戦略を推奨する必要があります。選択されたソリューションは以下の要件を満たす必要があります：\n\n・単一の Azure データ センターが障害になってもデータが利用可能であること\n・ストレージ ソリューションが複数のストレージ層をサポートすること\n・コストを最小化すること\n\nストレージ アカウントの種類はどれを推奨しますか？","choices":[{"text":"Premium ブロック BLOB","is_correct":false},{"text":"Standard 汎用 v1","is_correct":false},{"text":"Standard 汎用 v2","is_correct":true}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:700px;display:block;margin:12px auto;border-radius:10px;background:#F8FAFF\"><defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"6\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#0072C6\"/></marker><marker id=\"ag\" markerWidth=\"8\" markerHeight=\"6\" r troke-width=\"2\"/><text x=\"590\" y=\"89\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">ZRS (Q30)</text><text x=\"590\" y=\"103\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">同リージョン内 3AZ</text><rect x=\"520\" y=\"60\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"73\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">DC障害対応 ✅</text><rect x=\"520\" y=\"85\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">West Europe 内に留まる ✅</text><rect x=\"520\" y=\"110\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"123\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">GRSより低コスト ✅</text><rect x=\"520\" y=\"135\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">LRSより高可用性 ✅</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">汎用v2: 複数層+ZRS対応。Premium Blobは単一層のみでZRS選択肢が制限</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「2 TB のファイルを Azure Blob Storage に格納し、単一データセンターの障害に備える。コスト最小化。西ヨーロッパ リージョン内に留める」。\n\n<strong>Standard 汎用 v2（GPv2）</strong>：Blob ストレージをサポートし、ZRS などの冗長性オプションと組み合わせ可能。Standard は Premium と比べてコストが低く、2 TB の大容量格納に適切です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Premium ブロック BLOB：</strong> SSD ベースの高性能ストレージ。2 TB のファイル格納でコスト最小化という要件には高コスト過剰 ❌\n\n<strong>Standard 汎用 v1（GPv1）：</strong> 旧世代。ライフサイクル管理・Cool/Archive アクセス層・ZRS などの機能が制限される。新規作成には v2 が推奨 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">GPv1 と GPv2 の違い：\n\n• <strong>GPv1</strong>：旧世代。ライフサイクル管理・Cool/Archive 層・ZRS が非対応または制限あり\n• <strong>GPv2</strong>：現行世代。すべての最新機能をサポート\n\n試験では「なぜ v1 ではなく v2 か」を問われることがあります。新規作成はほぼ GPv2 一択です。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">ストレージ アカウント種別</th><th>Blob サポート</th><th>アクセス層</th><th>ZRS 対応</th><th>コスト</th></tr></thead><tbody><tr><td class=\"cc\">Standard GPv2 ✅</td><td>✅</td><td>Hot/Cool/Archive</td><td>✅</td><td>低〜中</td></tr><tr><td class=\"cc\">Standard GPv1</td><td>✅</td><td>Hot のみ</td><td>❌</td><td>低（機能制限）</td></tr><tr><td class=\"cc\">Premium ブロック BLOB</td><td>✅</td><td>Premium のみ</td><td>✅</td><td>高</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">新規ストレージ アカウントは基本的に <strong>Standard GPv2</strong> を選ぶ。GPv1 は機能制限があり、Premium は高コスト。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/common/storage-account-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/storage/common/storage-account-overview</a></li></ul></div>\n</div>"},{"num":30,"id":"q30","domain":"データストレージ設計","domain_code":"DS","domain_color":"#0078D4","question_text":"オンプレミスのファイル サーバーに 2 TB のデータ ファイルが含まれています。\n\nこれらのデータ ファイルを西ヨーロッパ (West Europe) の Azure リージョンの Azure Blob Storage に移行する計画があります。\n\nストレージ アカウントの適切なアカウントの種類とレプリケーション戦略を推奨する必要があります。選択されたソリューションは以下の要件を満たす必要があります：\n\n・単一の Azure データ センターが障害になってもデータが利用可能であること\n・ストレージ ソリューションが複数のストレージ層をサポートすること\n・コストを最小化すること\n\n冗長性はどれを推奨しますか？","choices":[{"text":"geo 冗長ストレージ (GRS)","is_correct":false},{"text":"ゾーン冗長ストレージ (ZRS)","is_correct":true},{"text":"ローカル冗長ストレージ (LRS)","is_correct":false},{"text":"読み取りアクセス geo 冗長ストレージ (RA-GRS)","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-svg-wrap\"><svg viewBox=\"0 0 700 185\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:70  ✅</text><rect x=\"250\" y=\"135\" width=\"180\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"340\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">コスト最適 ✅</text><rect x=\"510\" y=\"20\" width=\"160\" height=\"155\" rx=\"8\" fill=\"#E8F5E9\" stroke=\"#107C10\" stroke-width=\"2\"/><text x=\"590\" y=\"89\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#107C10\">ZRS (Q30)</text><text x=\"590\" y=\"103\" text-anchor=\"middle\" font-size=\"9\" fill=\"#107C10\">同リージョン内 3AZ</text><rect x=\"520\" y=\"60\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"73\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">DC障害対応 ✅</text><rect x=\"520\" y=\"85\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">West Europe 内に留まる ✅</text><rect x=\"520\" y=\"110\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"123\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">GRSより低コスト ✅</text><rect x=\"520\" y=\"135\" width=\"140\" height=\"20\" rx=\"4\" fill=\"#A5D6A7\"/><text x=\"590\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" fill=\"#1B5E20\">LRSより高可用性 ✅</text><text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"9\" fill=\"#888\">汎用v2: 複数層+ZRS対応。Premium Blobは単一層のみでZRS選択肢が制限</text></svg></div>\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Q29 の続き。要件：「単一データセンター障害に対してデータを保護する」＋「<strong>西ヨーロッパ内に留める</strong>（geo レプリケーションなし）」＋「コスト最小化」。\n\n<strong>ZRS（ゾーン冗長ストレージ）</strong>：同一リージョン内の 3 つの可用性ゾーン（異なるデータセンター）にデータをレプリケートし、単一データセンター障害に対応。データは西ヨーロッパ リージョン内に留まり（データ主権要件を満たす）、LRS より冗長性が高く GRS よりコストが低いです。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>GRS（geo 冗長）：</strong> データを他のリージョン（西ヨーロッパ → 北ヨーロッパ）にレプリケート。<strong>西ヨーロッパ内にデータを留める要件に違反</strong> ❌\n\n<strong>LRS（ローカル冗長）：</strong> 単一データセンター内の 3 コピー。<strong>別のデータセンターへのレプリケーションなし</strong>。データセンター障害（火災・洪水）には対応できない ❌\n\n<strong>RA-GRS：</strong> GRS + セカンダリへの読み取り。リージョン外レプリカがあり、データ主権要件に違反 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">LRS vs ZRS のよくある混同：\n\n• <strong>LRS</strong>：同一データセンター内 3 コピー。ディスク障害には強いが「データセンター障害」には弱い\n• <strong>ZRS</strong>：異なるデータセンター（可用性ゾーン）に同期レプリケート。データセンター障害にも対応\n\n「単一データセンター障害に対応」= ZRS が必要（LRS では不十分）。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>冗長性</th><th class=\"cc\">データセンター障害対応</th><th>リージョン外レプリカ</th><th>コスト</th></tr></thead><tbody><tr><td>LRS</td><td class=\"cc\">❌</td><td>❌</td><td>最安</td></tr><tr><td>ZRS ✅</td><td class=\"cc\">✅</td><td>❌（ゾーン内のみ）</td><td>中</td></tr><tr><td>GRS</td><td class=\"cc\">✅</td><td>✅</td><td>高</td></tr><tr><td>RA-GRS</td><td class=\"cc\">✅</td><td>✅</td><td>最高</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「単一 DC 障害対応 + データはリージョン内のみ + コスト最小」= <strong>ZRS</strong>。LRS はデータセンター障害に対応できず、GRS/RA-GRS はリージョン外にデータが出る。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/storage/common/storage-redundancy\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/storage/common/storage-redundancy</a></li></ul></div>\n</div>"},{"num":31,"id":"q31","domain":"インフラストラクチャ設計","domain_code":"IS","domain_color":"#C50F1F","question_text":"注意：この問題は同じシナリオを使用する一連の問題の一部です。シリーズの各問題は要件を満たす場合と満たさない場合のある異なるソリューションを提示します。\n\n組織はオンプレミスと Azure の両方で仮想マシン (VM) を実行しています。Azure ExpressRoute はオンプレミス環境と Azure の間の接続を提供するために構成されています。\n\nいくつかの仮想マシンでネットワーク接続の問題が発生しています。\n\nパケットが VM に対して許可または拒否されているかを確認するためにネットワーク トラフィックを検査する必要があります。\n\n提案されたソリューション：VM Insights をインストールして設定する。\n\nこのソリュー \">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Yes を選んだ場合：</strong> IP フロー検証が「実際に通信をブロックする」と誤解している。これは診断ツールであり、NSG ルールの確認専用 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">IP フロー検証（IP Flow Verify）と NSG の違い：\n\n• <strong>IP フロー検証</strong>：「このトラフィックは通過する？」を診断するシミュレーター\n• <strong>NSG</strong>：実際にトラフィックを許可・拒否するルール\n\n「検証ツール ≠ 実行ツール」という概念を理解する。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">IP フロー検証は NSG ルールの動作を<strong>シミュレーション</strong>するだけ。実際のブロックは NSG ルール自体が行う。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/ja-jp/azure/network-watcher/ip-flow-verify-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/ja-jp/azure/network-watcher/ip-flow-verify-overview</a></li></ul></div>\n</div>"},{"num":33,"id":"q33","domain":"インフラストラクチャ設計","domain_code":"IS","domain_color":"#C50F1F","question_text":"注意：この問題は同じシナリオを使用する一連の問題の一部です。シリーズの各問題は要件を満たす場合と満たさない場合のある異なるソリューションを提示します。\n\n組織はオンプレミスと Azure の両方で仮想マシン (VM) を実行しています。Azure ExpressRoute はオンプレミス環境と Azure の間の接続を提供するために構成されています。\n\nいくつかの仮想マシンでネットワーク接続の問題が発生しています。\n\nパケットが VM に対して許可または拒否されているかを確認するためにネットワーク トラフィックを検査する必要があります。\n\n提案されたソリューション：Azure Network Watcher から Azure Traffic Analytics を使用する。\n\nこのソリューションは要件を満たしていますか？","choices":[{"text":"Yes（はい）","is_correct":false},{"text":"No（いいえ）","is_correct":true}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\"><div class=\"arch-box\"><div class=\"arch-title\">ExpressRoute ハイブリッド（Q31-34）</div><svg viewBox=\"0 0 740 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:740px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"740\" height=\"150\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\"
