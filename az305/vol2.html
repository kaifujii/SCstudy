7\" stroke=\"#e05252\" stroke-width=\"2\"/>\n<line x1=\"505\" y1=\"45\" x2=\"601\" y2=\"127\" stroke=\"#e05252\" stroke-width=\"2\"/>\n<text x=\"630\" y=\"75\" text-anchor=\"middle\" font-size=\"8\" fill=\"#e05252\" font-family=\"Segoe UI,Arial,sans-serif\">異なるリージョン</text>\n<text x=\"630\" y=\"87\" text-anchor=\"middle\" font-size=\"8\" fill=\"#e05252\" font-family=\"Segoe UI,Arial,sans-serif\">→ 設定不可</text>\n\n</svg></div><div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解か</div><div class=\"exp-block-body\"><b>SQLsvr2（West US）+ storage2（Central US）= 異なるリージョン → False</b><br>SQLsvr2 は West US、storage2 は Central US → リージョンが異なるため監査ログ保存は不可。<br>どちらも同一リージョンでなければ、この組み合わせは無効です。答えは <b>False</b>。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ 他の選択肢が不正解の理由</div><div class=\"exp-block-body\"><b>A: True</b> は誤り。West US ≠ Central US のため設定は機能しない。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">「ストレージアカウントが別リージョンにあっても使える」と混同しないこと。SQL 監査の Storage Account 保存先は<b>同一リージョン限定</b>。</div></div></div>","svg":"","domain_color":"#0072C6"},{"num":4,"id":"q4","domain":"ビジネス継続性設計","question_text":"Azure サブスクリプション内に作成されたすべての新しい Azure Resource Manager (ARM) デプロイを一覧表示する月次サマリー レポートを生成できるソリューションを提案する必要があります。\n\n推奨事項に含めるべきサービスはどれですか？","choices":[{"text":"Azure Log Analytics","is_correct":true},{"text":"Azure Arc","is_correct":false},{"text":"Azure Analysis Services","is_correct":false},{"text":"Azure Monitor アクション グループ","is_correct":false},{"text":"Application Insights","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">ARM デプロイの一覧は<strong>アクティビティ ログ</strong>として記録されます。Azure Log Analytics は、アクティビティ ログを含む各種ログを収集・集約し、KQL（Kusto Query Language）でクエリして<strong>月次サマリー レポートやダッシュボード</strong>を生成できます。\n\n具体的には <code>AzureActivity</code> テーブルをクエリし、<code>OperationName</code> でデプロイ操作をフィルタリングします。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure Arc：</strong> オンプレミス・マルチクラウドのリソースを Azure から管理するサービス。ログ収集・レポート機能はない。\n\n<strong>Azure Analysis Services：</strong> OLAP 型のビジネス インテリジェンス サービス。ソース データのクエリ・レポート向けだが、ARM ログの収集機能はない。\n\n<strong>Azure Monitor アクション グループ：</strong> アラート発生時の通知・自動応答を設定するもの。レポート生成ではない。\n\n<strong>Application Insights：</strong> アプリケーションのパフォーマンス監視専用。ARM デプロイの追跡には使えない。</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「Azure Monitor があるから Application Insights や Monitor アクション グループでできる」と思いがちですが、ARM デプロイの集計レポートには<strong>Log Analytics + KQL</strong> が適切です。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>用途</th><th>ARM ログ収集</th><th>月次レポート生成</th></tr></thead><tbody><tr><td class=\"cc\">Azure Log Analytics</td><td>ログ収集・分析</td><td>✅</td><td>KQL で生成可</td></tr><tr><td class=\"cc\">Azure Arc</td><td>マルチクラウド管理</td><td>❌</td><td>❌</td></tr><tr><td class=\"cc\">Azure Analysis Services</td><td>BI/OLAP</td><td>❌</td><td>△ 別途データ連携が必要</td></tr><tr><td class=\"cc\">Monitor アクション グループ</td><td>アラート通知</td><td>❌</td><td>❌</td></tr><tr><td class=\"cc\">Application Insights</td><td>アプリ監視</td><td>❌</td><td>❌</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">ARM デプロイの追跡 → <strong>Azure Log Analytics</strong>。KQL で <code>AzureActivity</code> テーブルをクエリ。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-analytics-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-analytics-overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#107C10"},{"num":5,"id":"q5","domain":"ID・ガバナンス・監視","question_text":"Azure サブスクリプションを使用しており、開発者が Azure 仮想マシンをデプロイできるようにする方法を提案する必要があります。\n\n推奨ソリューションは以下の制約を適用する必要があります：\n\n・仮想マシンは承認済みの Azure リージョンにのみデプロイできること\n・仮想マシンは定義済みの VM サイズを使用してのみ作成できること\n\n次のうち、これらの要件を満たすために使用すべきサービスはどれですか？","choices":[{"text":"Azure Policy","is_correct":true},{"text":"ロールベースのアクセス制御 (RBAC)","is_correct":false},{"text":"属性ベースのアクセス制御 (ABAC)","is_correct":false},{"text":"条件付きアクセス ポリシー","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Azure Policy は「<strong>リソース構成の制約を強制</strong>」するサービスです。VM を特定のリージョン（例：Japan East）にのみデプロイ許可したり、特定の SKU（例：Standard_D2s_v3）のみを許可する組み込みポリシーが用意されています。\n\nポリシーは<strong>Deny（拒否）</strong>効果を使用することで、要件外のリソース作成を自動的にブロックします。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>RBAC：</strong> 「誰が何を操作できるか（権限）」を管理するもの。「どのリージョンにのみ作れるか（構成制約）」は設定できない。\n\n<strong>ABAC：</strong> RBAC にリソース属性（タグなど）での条件を追加するもの。リソース構成の制約ではなく、アクセス権の細分化が目的。\n\n<strong>条件付きアクセス：</strong> サインイン条件（MFA、場所、デバイスなど）を制御するもの。リソース構成とは無関係。</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">RBAC と Azure Policy を混同するのが最大の落とし穴。\n\n覚え方：<strong>「誰が」を制御 → RBAC</strong>、<strong>「何を・どこに」を制御 → Azure Policy</strong></div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>目的</th><th>リージョン制限</th><th>VM SKU制限</th><th>適切な場面</th></tr></thead><tbody><tr><td class=\"cc\">Azure Policy</td><td>リソース構成の制約・ガバナンス</td><td>✅</td><td>✅</td><td>コンプライアンス強制 ✅</td></tr><tr><td class=\"cc\">RBAC</td><td>アクセス権（誰が何を操作できるか）</td><td>❌</td><td>❌</td><td>権限管理</td></tr><tr><td class=\"cc\">ABAC</td><td>属性ベースのアクセス細分化</td><td>❌</td><td>❌</td><td>Blob タグ条件付きアクセス</td></tr><tr><td class=\"cc\">条件付きアクセス</td><td>サインイン条件制御</td><td>❌</td><td>❌</td><td>MFA・デバイス要件</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「リソースの構成・場所・種類を制限したい」→ <strong>Azure Policy</strong>。「ユーザーの権限を管理したい」→ <strong>RBAC</strong>。この区別が試験の最頻出。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/governance/policy/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/governance/policy/overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":6,"id":"q6","domain":"ID・ガバナンス・監視","question_text":"注意：この問題は同じシナリオを使用する関連問題のセットの一部です。各問題は要件を満たす場合と満たさない場合のある異なるソリューションを提示します。\n\n以下のリソースを含む Azure サブスクリプションがあります。\n\nストレージ アカウント\n\nstorage1 は Azure Storage アカウント (Storage 汎用 v1) であり、米国東部に配置されています\nstorage2 は Azure Storage アカウント (StorageV2 汎用 v2) であり、米国東部に配置されています\n\nLog Analytics ワークスペース\n\nWorkspace1 は米国東部に配置されています\nWorkspace2 は米国東部に配置されています\n\nAzure Event Hub\n\nHub1 は米国東部に配置されています\n\nその後、米国東部に DB1 という Azure SQL データベースを作成しました。\n\nDB1 に対して、以下の設定で Settings1 という診断設定を構成しました：\n\n・SQLInsights ログを storage1 にアーカイブする\n・SQLInsights ログを Workspace1 に送信する\n\n正誤問題：\n\n「Settings1 を更新して SQLInsights ログを Hub1 に送信するよう設定できる」","choices":[{"text":"True（正しい）","is_correct":true},{"text":"False（誤り）","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Azure 診断設定には 2 つの重要な制限があります：\n1. <strong>1 リソースにつき最大 5 つの診断設定</strong>を作成できる\n2. <strong>1 つの診断設定から複数の宛先</strong>（ストレージ、Log Analytics、Event Hub など）に同時送信できる\n\nSettings1 はすでに storage1 と Workspace1 の 2 宛先を使用。Hub1（Event Hub）への追加送信も可能なので True が正解です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\">False を選んだ場合：「1 つの診断設定には 1 つの宛先しか設定できない」と誤解しているパターンです。診断設定は複数宛先をサポートしています。</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「1 診断設定 = 1 宛先」という誤解が多いです。実際は 1 つの診断設定に <strong>複数の宛先（ストレージ + Log Analytics + Event Hub）を同時に設定</strong>できます。\n\nまた「最大 5 つ」の上限があることも覚えておきましょう。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>診断設定の仕様</th><th>制限・機能</th></tr></thead><tbody><tr><td>1 リソースあたりの最大設定数</td><td>5 つ</td></tr><tr><td>1 設定あたりの宛先数</td><td>複数可（ストレージ + LA + Event Hub）</td></tr><tr><td>利用可能な宛先</td><td>ストレージ アカウント、Log Analytics、Event Hub、Partner Solutions</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">診断設定：<strong>1 リソース = 最大 5 設定</strong>、<strong>1 設定 = 複数宛先 OK</strong>。この 2 点が試験頻出。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/diagnostic-settings\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/diagnostic-settings</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":7,"id":"q7","domain":"ID・ガバナンス・監視","question_text":"注意：この問題は同じシナリオを使用する関連問題のセットの一部です。各問題は要件を満たす場合と満たさない場合のある異なるソリューションを提示します。\n\n以下のリソースを含む Azure サブスクリプションがあります。\n\nストレージ アカウント\n\nstorage1 は Azure Storage アカウント (Storage 汎用 v1) であり、米国東部に配置されています\nstorage2 は Azure Storage アカウント (StorageV2 汎用 v2) であり、米国東部に配置されています\n\nLog Analytics ワークスペース\n\nWorkspace1 は米国東部に配置されています\nWorkspace2 は米国東部に配置されています\n\nAzure Event Hub\n\nHub1 は米国東部に配置されています\n\nその後、米国東部に DB1 という Azure SQL データベースを作成しました。\n\nDB1 に対して、以下の設定で Settings1 という診断設定を構成しました：\n\n・SQLInsights ログを storage1 にアーカイブする\n・SQLInsights ログを Workspace1 に送信する\n\n正誤問題：\n\n「DB1 に対して新しい診断設定 Settings2 を追加して、SQLInsights ログを Workspace2 に送信するよう設定できる」","choices":[{"text":"True（正しい）","is_correct":true},{"text":"False（誤り）","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Azure では 1 リソースに最大 5 つの診断設定を作成できます。Settings1 がすでに存在しますが、<strong>別の診断設定 Settings2 を新たに作成</strong>して Workspace2 に送信することは完全に可能です。よって True が正解です。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\">False を選んだ場合：「既存の診断設定があるから新しい設定は作れない」と誤解しているパターンです。</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Q6 と Q7 の違いを整理しましょう：\n• Q6：<strong>既存の Settings1 を更新</strong>して Hub1 を追加（1 設定 = 複数宛先）\n• Q7：<strong>新しい Settings2 を作成</strong>して Workspace2 に送信（複数設定）\n\nどちらも可能です。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">既存の診断設定があっても、追加で新しい診断設定を作成できる（最大 5 つまで）。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/diagnostic-settings\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/diagnostic-settings</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":8,"id":"q8","domain":"ID・ガバナンス・監視","question_text":"Application1 という名前のカスタム アプリケーションをホストする Azure サブスクリプションがあります。このアプリケーションは外部ベンダーの Fabrikam, Ltd. によって構築されました。Fabrikam の開発者には Application1 のさまざまなコンポーネントに対する Azure ロールベースのアクセス制御 (RBAC) アクセス許可が付与されています。すべてのユーザーは Microsoft 365 E5 のライセンスを保有しています。\n\nFabrikam の開発者が Application1 へのアクセス許可を引き続き必要としているかどうかを確認するためのソリューションを推奨する必要があります。ソリューションは以下の要件を満たす必要があります：\n\n・Application1 に付与されたアクセス許可の概要を記載した月次メールを開発者のマネージャーに送信すること\n・マネージャーによって検証・承認されなかったアクセス許可を自動的に削除すること\n・開発作業を最小限に抑えること\n\n次のうち、推奨すべき内容はどれですか？\n\n選択肢：\n1. Get-AzRoleAssignment コマンドレットを実行する Azure Automation Runbook を作成する\n2. Get-AzureADUserAppRoleAssignment コマンドレットを実行する Azure Automation Runbook を作成する\n3. Microsoft Entra Privileged Identity Management で Application1 リソースのカスタム ロール割り当てを作成する\n4. Microsoft Entra ID で Application1 のアクセス レビューを作成する","choices":[{"text":"Get-AzRoleAssignment コマンドレットを実行する Azure Automation Runbook を作成する","is_correct":false},{"text":"Get-AzureADUserAppRoleAssignment コマンドレットを実行する Azure Automation Runbook を作成する","is_correct":false},{"text":"Microsoft Entra Privileged Identity Management で Application1 リソースのカスタム ロール割り当てを作成する","is_correct":false},{"text":"Microsoft Entra ID で Application1 のアクセス レビューを作成する","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか — Microsoft Entra アクセス レビュー</div><div class=\"exp-block-body\">要件を整理します：\n① 月次メールでマネージャーに権限概要を送信\n② 承認されなかった権限を<strong>自動的に削除</strong>\n③ 開発作業を<strong>最小限</strong>に抑える\n\n<strong>Microsoft Entra アクセス レビュー</strong>はこれら3つをノーコードで実現します：\n• <strong>定期レビュー スケジュール</strong>：月次などのサイクルを設定し、マネージャーへ自動メール通知\n• <strong>自動適用（Auto-apply）機能</strong>：マネージャーが応答しなかった場合、「アクセス権を削除」を自動実行\n• <strong>開発ゼロ</strong>：Azure Portal から GUI で設定するだけで完全動作</div></div>\n\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>A: Get-AzRoleAssignment Runbook：</strong>\nPowerShell で Azure RBAC のロール割り当て一覧を取得するだけです。「月次メール送信」「自動削除」の機能がなく、別途スクリプト開発が必要。「最小限の開発作業」の要件に直接違反します。\n\n<strong>B: Get-AzureADUserAppRoleAssignment Runbook：</strong>\nアプリロール割り当てを取得するコマンドですが、A と同様に自動削除・通知の開発が別途必要です。\n\n<strong>C: Entra PIM（Privileged Identity Management）：</strong>\nPIM は特権ロール（グローバル管理者など）に対して「使う直前に申請→承認→時間制限付きで付与」するJIT管理が目的です。一般開発者のアプリ権限の定期レビューには設計されていません。</div></div>\n\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「Automation + スクリプトで自動化できる」という発想は正しいですが、問題文の<strong>「最小限の開発作業」</strong>というキーワードが決め手です。\n\n覚え方：\n• <strong>「定期的にアクセス権が必要か確認したい」→ アクセス レビュー</strong>\n• 「特権ロールを使う前に都度承認が必要」→ PIM\n• 「ログを集めて自分で分析したい」→ Automation + KQL</div></div>\n\n<div class=\"comp-s\"><div class=\"comp-l\">アクセス管理ツール比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>手段</th><th>月次自動通知</th><th>未応答時の自動削除</th><th>開発作業</th><th>推奨シナリオ</th></tr></thead><tbody>\n<tr><td class=\"cc\">Entra アクセス レビュー</td><td>組み込み</td><td>Auto-apply 機能</td><td>ゼロ ✅</td><td>定期的な権限確認 ✅</td></tr>\n<tr><td>Automation + Get-AzRoleAssignment</td><td>別途開発</td><td>別途開発</td><td>大 ❌</td><td>カスタム処理が必要な場合</td></tr>\n<tr><td>Entra PIM</td><td>期限切れ通知</td><td>期限切れ自動失効</td><td>最小</td><td>特権ロールの JIT 管理</td></tr>\n</tbody></table></div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「定期的なアクセス確認 ＋ 自動削除 ＋ 最小開発」＝ <strong>Entra アクセス レビュー</strong>一択。PIM は「使う前に承認が必要な特権ロール」向けで用途が根本的に異なる。</div></div>\n\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory/governance/access-reviews-overview\" target=\"_blank\" rel=\"noopener\">Azure AD アクセス レビューの概要</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":9,"id":"q9","domain":"ID・ガバナンス・監視","question_text":"1 つのルート管理グループと、その下に 10 個の子管理グループを含む Azure 環境を計画しています。各子管理グループには 5 つの Azure サブスクリプションが含まれ、各サブスクリプションには 10〜30 のリソース グループが含まれます。\n\nAzure ガバナンス ソリューションを設計する必要があります。\n\nFabrikam の開発者によって行われた変更が各サブスクリプションでどのように発生したかを追跡する必要があります。その情報はどこに保存されますか？","choices":[{"text":"子管理グループ","is_correct":false},{"text":"ルート管理グループ","is_correct":false},{"text":"サブスクリプション","is_correct":true}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">管理グループ階層（Q9-10）</div><svg viewBox=\"0 0 740 295 cy の割り当てスコープ</b>の問題。<br>Azure Policy をサブスクリプションに割り当てると、そのサブスクリプション内の全リソースに強制・監視が適用されます。<br>Q9 では<b>サブスクリプション単位で変更追跡</b>するため、サブスクリプションスコープが正解。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ 他の選択肢が不正解の理由</div><div class=\"exp-block-body\"><b>A: 子管理グループ</b> — 管理グループに割り当てることも可能だが、問題が「各サブスクリプションで追跡」と言っているのでサブスクリプションが直接的なスコープ。<br><b>B: ルート管理グループ</b> — 全組織に適用されるため粒度が粗すぎる。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">管理グループ・サブスクリプション・RG の各スコープへの Policy 割り当ては試験頻出。「最小権限・最小スコープ」を意識して選ぶ。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">📌 重要知識</div><div class=\"exp-block-body\"><b>Azure Policy スコープの継承</b><br>ルートMG → 子MG → サブスクリプション → RG → リソース の順に継承される。<br>上位スコープに割り当てると下位すべてに継承されるため、粒度に注意。</div></div></div>","svg":"","domain_color":"#7719AA"},{"num":10,"id":"q10","domain":"ID・ガバナンス・監視","question_text":"1 つのルート管理グループと、その下に 10 個の子管理グループを含む Azure 環境を計画しています。各子管理グループには 5 つの Azure サブスクリプションが含まれ、各サブスクリプションには 10〜30 のリソース グループが含まれます。\n\nAzure ガバナンス ソリューションを設計する必要があります。\n\nAzure ブループリントの割り当てに使用できる最も高いスコープ レベルはどこですか？","choices":[{"text":"子管理グループ","is_correct":false},{"text":"ルート管理グループ","is_correct":false},{"text":"サブスクリプション","is_correct":true}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">管理グループ階層（Q9-10）</div><svg viewBox=\"0 0 740 295\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:740px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"740\" height=\"295\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/></marker>\n  <marker id=\"arr2\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/></marker>\n</defs>\n<rect x=\"310\" y=\"10\" width=\"120\" hei exp-block-label\">📌 重要知識</div><div class=\"exp-block-body\"><b>Azure Blueprints</b><br>複数のリソース（ポリシー・ロール・テンプレート等）をパッケージ化してサブスクリプションに一括デプロイする仕組み。<br>ガバナンス基盤の展開に使用。現在は Azure Deployment Stacks に移行中。</div></div></div>","svg":"","domain_color":"#7719AA"},{"num":11,"id":"q11","domain":"ビジネス継続性設計","question_text":"高可用性を提供し、以下の要件を満たす Azure SQL データベース アーキテクチャを設計する必要があります：\n\n・レプリカ間のデータベース フェールオーバーはデータ損失なしに発生すること\n・可用性ゾーンが利用不可になっても、データベースは継続して動作すること\n・全体的なソリューション コストを最小化すること\n\nどの Azure SQL Database サービス レベルを使用すべきですか？","choices":[{"text":"Azure SQL Database Standard","is_correct":false},{"text":"Azure SQL Database Hyperscale","is_correct":false},{"text":"Azure SQL Database Basic","is_correct":false},{"text":"Azure SQL Database Premium","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：①ゾーン障害でもフェールオーバー可能（可用性ゾーン冗長）、②データ損失ゼロ（同期レプリケーション）。\n\n<strong>Azure SQL Database Premium</strong> は：\n• <strong>ゾーン冗長</strong>をサポート（複数の可用性ゾーンにレプリカを配置）\n• <strong>Always On 可用性グループ ベース</strong>の同期レプリケーション → RTO ほぼゼロ、RPO ゼロ\n• Business Critical 層と同等の高可用性アーキテクチャ</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Standard：</strong> ゾーン冗長をサポートしていない。ゾーン障害時のデータ損失ゼロは保証されない ❌\n\n<strong>Basic：</strong> 最低コスト層。高可用性機能は最小限 ❌\n\n<strong>Hyperscale：</strong> 大規模データ（数百 TB）向け。ゾーン冗長対応だが、Premium より高コストで過剰 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「Business Critical の方が高い = 正解」と思いがちですが、<strong>Premium でもゾーン冗長と同期レプリケーションをサポート</strong>します。コスト要件がある場合は Premium を優先します。\n\nまた「Standard でもレプリケーションがある」と誤解される場合がありますが、Standard の HA は同期ではなく非同期レプリケーションです。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>サービス層</th><th>ゾーン冗長</th><th> ラフィックをプロキシしない。<br><b>D: AKS イングレスコントローラー</b> — クラスター内のみのルーティング。クロスリージョンフェールオーバー不可。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">Traffic Manager もグローバル分散できるが<b>SSL 終端ができない</b>ため、HTTPS 終端要件があれば Front Door を選ぶ。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">📌 重要知識</div><div class=\"exp-block-body\"><table class=\"comp-s\"><thead><tr><th>サービス</th><th>レイヤー</th><th>SSL終端</th><th>グローバル</th></tr></thead><tbody><tr><td>Front Door</td><td>L7</td><td>✅</td><td>✅</td></tr><tr><td>App Gateway</td><td>L7</td><td>✅</td><td>❌ 単一リージョン</td></tr><tr><td>Traffic Manager</td><td>DNS</td><td>❌</td><td>✅</td></tr><tr><td>Load Balancer</td><td>L4</td><td>❌</td><td>❌</td></tr></tbody></table></div></div></div>","svg":"","domain_color":"#C50F1F"},{"num":13,"id":"q13","domain":"ID・ガバナンス・監視","question_text":"米国西部 (West US) リージョンにデプロイされた KeyVault1 という Azure Key Vault に依存する Azure Web アプリがあります。\n\nKeyVault1 のディザスター リカバリー計画の一環として、Vault 内に保存されているキーのバックアップを作成する予定です。\n\nバックアップされたキーを復元できる場所を決定する必要があります。バックアップされたキーはどこに復元できますか？","choices":[{"text":"同じジオグラフィ内のみ","is_correct":true},{"text":"KeyVault1 のみ","is_correct":false},{"text":"同じリージョン内のみ","is_correct":false},{"text":"世界中の任意のリージョン","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Azure Key Vault のバックアップ・復元には重要な制約があります：<strong>バックアップしたキーは、元の Key Vault と同じ Azure ジオグラフィ（地理的区域）内の Key Vault にのみ復元可能</strong>です。\n\nたとえば、米国西部でバックアップしたキーは、米国東部には復元できますが、日本やヨーロッパには復元できません。これはデータ主権とコンプライアンス要件によるものです。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>KeyVault1 のみ：</strong> 同じ Key Vault のみというのは過度に制限的 ❌\n\n<strong>同じリージョン内のみ：</strong> ジオグラフィ内であれば別リージョンへの復元も可能（例：米国西部 → 米国東部）❌\n\n<strong>世界中の任意のリージョン：</strong> 別ジオグラフィ（例：米国 → 日本）への復元は不可 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「同じリージョン」と「同じジオグラフィ」を混同しがちです。\n\n• <strong>ジオグラフィ（Geography）</strong>：複数のリージョンを含む地理的グループ（例：米国ジオグラフィには East US, West US, Central US などが含まれる）\n• <strong>リージョン（Region）</strong>：単一のデータセンター グループ（例：Japan East）</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>復元先</th><th>可否</th><th>例</th></tr></thead><tbody><tr><td>同じ Key Vault（元の保管庫）</td><td>✅</td><td>KV1(West US) → KV1(West US)</td></tr><tr><td>同じジオグラフィの別 KV</td><td>正解</td><td>KV1(West US) → KV2(East US)</td></tr><tr><td>異なるジオグラフィの KV</td><td>❌</td><td>KV1(West US) → KV2(Japan East)</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Key Vault のキー復元は<strong>同じジオグラフィ内</strong>の Key Vault に限定。「同じリージョン内のみ」ではなく「同じジオグラフィ」が正しい範囲。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/key-vault/general/backup\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/key-vault/general/backup</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":14,"id":"q14","domain":"ビジネス継続性設計","question_text":"バックアップ ポリシーをデプロイする計画を立てています。\n\nポリシーの内容：\n\n・毎日 18:00 (UTC) にスケジュールされたバックアップ\n・インスタント リカバリー スナップショットを 3 日間保持\n・日次バックアップ ポイントを 90 日間保持\n・毎週日曜日 18:00 の週次バックアップ ポイントを 26 週間保持\n・月次バックアップ ポイント（毎月最初の日曜日 18:00）を 36 か月間保持\n・年次バックアップ ポイント（毎年 1 月最初の日曜日 18:00）を 45 か月間保持\n\nデータをリカバリーできる最大保持期間はどれですか？","choices":[{"text":"90 日間","is_correct":false},{"text":"26 週間","is_correct":false},{"text":"36 か月間","is_correct":false},{"text":"45 か月間","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか — 45 か月間</div><div class=\"exp-block-body\">ポリシーに設定された全ての保持期間を<strong>同じ単位（か月）</strong>に換算して比較します：\n\n• 日次バックアップ：<strong>90 日間</strong> ≈ 3 か月\n• 週次バックアップ：<strong>26 週間</strong> ≈ 6.5 か月\n• 月次バックアップ：<strong>36 か月間</strong> = 3 年\n• 年次バックアップ：<strong>45 か月間</strong> = 3 年 9 か月 ← 最長！\n\n最も長い保持期間は<strong>年次バックアップの 45 か月間</strong>です。したがって、このポリシーを使えば最大 45 か月前（3 年 9 か月前）のデータを年次バックアップ ポイントから復元できます。</div></div>\n\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>A: 90 日間（≈3か月）：</strong>日次バックアップの保持期間。4種類の中で最も短い ❌\n\n<strong>B: 26 週間（≈6.5か月）：</strong>週次バックアップの保持期間 ❌\n\n<strong>C: 36 か月間（3年）：</strong>月次バックアップの保持期間。これが最長に見えますが、年次（45か月）の方が長い ❌\n\n最も間違いやすいのが「C: 36 か月」です。「月次バックアップの方が年次より細かく頻繁だから、保持期間も長いのでは」という誤解から選んでしまいます。</div></div>\n\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">保持期間の比較で最も重要なのは「単位を揃えること」です。\n\n「36 か月 vs 45 か月」を見れば一目瞭然ですが、「36 か月 vs 45 か月」という形で並べて考えないと「月次（月ごとにバックアップ）の方が年次より多いから保持期間も長いはず」という直感的な誤解に引っかかります。\n\n<strong>バックアップの頻度（どのくらいの間隔でバックアップするか）</strong>と<strong>保持期間（バックアップをどのくらい保管するか）</strong>は独立した設定です。</div></div>\n\n<div class=\"comp-s\"><div class=\"comp-l\">バックアップ保持期間の比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>バックアップ種別</th><th>頻度</th><th>保持期間</th><th>か月換算</th><th>最長？</th></tr></thead><tbody>\n<tr><td>日次</td><td>毎日 18:00</td><td>90 日間</td><td>≈ 3 か月</td><td>❌</td></tr>\n<tr><td>週次</td><td>毎週日曜</td><td>26 週間</td><td>≈ 6.5 か月</td><td>❌</td></tr>\n<tr><td>月次</td><td>毎月第1日曜</td><td>36 か月間</td><td>36 か月</td><td>❌</td></tr>\n<tr><td class=\"cc\">年次</td><td class=\"cc\">毎年1月第1日曜</td><td class=\"cc\">45 か月間</td><td class=\"cc\">45 か月 最長</td><td class=\"cc\">✅</td></tr>\n</tbody></table></div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">保持期間の比較は<strong>必ず同じ単位（か月）</strong>に換算してから比較する。この問題では年次バックアップの 45 か月が最長。日次・週次など頻度の高いバックアップの方が保持期間が長いとは限らない。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-introduction\" target=\"_blank\" rel=\"noopener\">Azure VM バックアップの概要</a></li></ul></div>\n</div>","svg":"","domain_color":"#107C10"},{"num":15,"id":"q15","domain":"ビジネス継続性設計","question_text":"バックアップ ポリシーをデプロイする計画を立てています。\n\nポリシーの内容：\n\n・毎日 18:00 (UTC) にスケジュールされたバックアップ\n・インスタント リカバリー スナップショットを 3 日間保持\n・日次バックアップ ポイントを 90 日間保持\n・毎週日曜日 18:00 の週次バックアップ ポイントを 26 週間保持\n・月次バックアップ ポイント（毎月最初の日曜日 18:00）を 36 か月間保持\n・年次バックアップ ポイント（毎年 1 月最初の日曜日 18:00）を 45 か月間保持\n\nこのポリシーのインスタント リカバリー スナップショットの粒度はどれですか？","choices":[{"text":"1 時間","is_correct":false},{"text":"1 日","is_correct":true},{"text":"1 週間","is_correct":false},{"text":"1 か月","is_correct":false},{"text":"1 年","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">バックアップは<strong>毎日 18:00 にスケジュール</strong>されています。インスタント リカバリー スナップショットは、この日次バックアップ スケジュールと連動して取得されます。\n\nつまり、スナップショットは<strong>1 日に 1 回</strong>（日次スケジュールに合わせて）取得されるため、スナップショットの粒度（最小間隔）は「<strong>1 日</strong>」となります。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>1 時間：</strong> バックアップ スケジュールは 1 日 1 回のため、1 時間ごとのスナップショットは取得されない ❌\n\n<strong>1 週間：</strong> スナップショットは日次で取得される ❌\n\n<strong>1 か月・1 年：</strong> さらに粒度が粗すぎる ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">インスタント リカバリー スナップショットの「保持期間（3 日間）」と「取得頻度（バックアップ スケジュールと同じ）」を混同しないように注意。\n\n• 取得頻度：バックアップ スケジュールと同じ（この例では 1 日 1 回）\n• 保持期間：3 日間（直近 3 つのスナップショットが保持される）</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">スナップショットの取得頻度 = バックアップ スケジュールの頻度（この問題では 1 日 1 回）。保持期間（3 日）と混同しないこと。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/backup/backup-instant-restore-capability\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/backup/backup-instant-restore-capability</a></li></ul></div>\n</div>","svg":"","domain_color":"#107C10"},{"num":16,"id":"q16","domain":"インフラストラクチャ設計","question_text":"Service1 という名前の .NET ベースの Web サービスがあり、以下の動作をします：\n\n・ローカル ファイル システムで一時ファイルの読み取りと書き込みを行う\n・アプリケーション イベント ログにエントリを書き込む\n\nService1 の Azure ホスティング ソリューションを推奨する必要があります。推奨事項は以下の要件を満たす必要があります：\n\n・コードまたは構成への変更を最小限に抑えること\n・仮想マシン スケール セットを使用しないこと\n\n推奨に含めるべきサービスはどれですか？","choices":[{"text":"Azure Function アプリ","is_correct":false},{"text":"App Service Environment (ASE)","is_correct":false},{"text":"Azure 仮想マシン スケール セット","is_correct":false},{"text":"Azure App Service Web アプリ","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Service1 の要件：①<strong>ローカル ファイル システムへの読み書き</strong>、②<strong>アプリケーション イベント ログへの書き込み</strong>、③<strong>VM スケール セット不使用</strong>。\n\n<strong>Azure App Service Web アプリ</strong>：\n• ローカル ファイル システムへのアクセスをサポート（一時フォルダー経由）\n• イベント ログへの書き込みを診断ログ経由でサポート\n• PaaS サービスのため VM スケール セット不要\n• .NET アプリをほぼコード変更なしでホスト可能</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure Functions：</strong> サーバーレス・イベント ドリブン向け。常時稼働の Web サービスには向かない。ローカル ファイル システムへのアクセスも制限的 ❌\n\n<strong>App Service Environment（ASE）：</strong> App Service の分離・高スケール版。機能的には App Service Web アプリと同等だが、より高コスト（過剰）❌\n\n<strong>VM スケール セット：</strong> 要件で明示的に除外されている ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「ASE は App Service と違うか？」と迷いがちですが、ASE は App Service の分離バージョンです。要件に「VM スケール セット不使用」とあっても、ASE 自体は VM を抽象化したものではないですが、このシナリオでは通常の <strong>App Service Web アプリで十分</strong>であり、ASE は過剰です。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>ローカル FS</th><th>イベント ログ</th><th>VM 不使用</th><th>コスト</th></tr></thead><tbody><tr><td class=\"cc\">App Service Web アプリ</td><td>✅</td><td>✅</td><td>✅</td><td>低〜中 ✅</td></tr><tr><td class=\"cc\">App Service Environment</td><td>✅</td><td>✅</td><td>✅</td><td>高（過剰）</td></tr><tr><td class=\"cc\">Azure Functions</td><td>△ 制限あり</td><td>△</td><td>✅</td><td>最安（用途違い）</td></tr><tr><td class=\"cc\">VM スケール セット</td><td>✅</td><td>✅</td><td>要件違反</td><td>中〜高</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「VM スケール セット不使用 + ローカル FS + イベント ログ + .NET」= <strong>App Service Web アプリ</strong>。ASE は隔離・高スケールが必要な場合にのみ使う。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/app-service/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/app-service/overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#C50F1F"},{"num":17,"id":"q17","domain":"インフラストラクチャ設計","question_text":"App1 と App2 という 2 つのアプリケーションを含む Azure サブスクリプションがあります。\n\nApp1 は販売トランザクションの処理を担当しています。\n\nApp1 が処理するトランザクションに配送が必要な場合、メッセージが Azure ストレージ アカウントのキューに配置されます。\n\nApp2 はキューを監視してトランザクションを処理します。\n\n将来的に、複数のアプリケーションがこれらのトランザクションに関する通知を購読できるようにする必要があります。ソリューションは、App1 のコードへの変更を最小限に抑えるとともに、最小限の管理コストを実現する必要があります。\n\n推奨すべきものはどれですか？","choices":[{"text":"1 つの Azure Service Bus トピック","is_correct":true},{"text":"1 つの Azure Service Bus キュー","is_correct":false},{"text":"1 つの Azure Data Factory パイプライン","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">Servic t x=\"525\" y=\"101\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#6264A7\" font-family=\"Segoe UI,Arial,sans-serif\">C2</text>\n<text x=\"525\" y=\"121\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Consumer2</text>\n<text x=\"525\" y=\"132\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Logic App</text>\n<rect x=\"470\" y=\"115\" width=\"110\" height=\"50\" rx=\"7\" fill=\"#112240\" stroke=\"#6264A7\" stroke-width=\"1.5\"/>\n<rect x=\"476\" y=\"120\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#6264A7\" fill-opacity=\"0.18\"/>\n<text x=\"525\" y=\"136\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#6264A7\" font-family=\"Segoe UI,Arial,sans-serif\">C3</text>\n<text x=\"525\" y=\"156\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Consumer3</text>\n<text x=\"525\" y=\"167\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">App Service</text>\n<text x=\"370\" y=\"180\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">1メッセージ → 複数サブスクリプションへコピー配信</text>\n\n</svg></div><div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解か</div><div class=\"exp-block-body\"><b>A: Azure Service Bus トピック</b><br>要件：「将来的に複数のアプリが同じメッセージを受信する」= <b>Pub/Sub（1対多）パターン</b><br>Service Bus の<b>トピック</b>は：<br>・1 つのパブリッシャー（App1）が送信<br>・複数のサブスクリプション（App2, App3...）が<b>それぞれ独立してメッセージを受信</b><br>既存の Storage Queue を Service Bus トピックに置き換えることで、将来の拡張に対応できます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ 他の選択肢が不正解の理由</div><div class=\"exp-block-body\"><b>B: Service Bus キュー</b> — 1対1（競合コンシューマー）。複数アプリが同一メッセージを受信できない。<br><b>C: Azure Data Factory パイプライン</b> — ETL/データ変換用。メッセージングサービスではない。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">キューとトピックの違いを整理：<br>・<b>キュー</b>: メッセージを取り出すと削除。1 コンシューマーのみ処理。<br>・<b>トピック</b>: 複数のサブスクリプションが同じメッセージのコピーを受信。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">📌 重要知識</div><div class=\"exp-block-body\"><table class=\"comp-s\"><thead><tr><th></th><th>Service Bus キュー</th><th>Service Bus トピック</th><th>Storage Queue</th></tr></thead><tbody><tr><td>パターン</td><td>P2P（1対1）</td><td>Pub/Sub（1対多）</td><td>P2P（1対1）</td></tr><tr><td>メッセージサイズ</td><td>最大 256KB〜100MB</td><td>最大 256KB〜100MB</td><td>最大 64KB</td></tr><tr><td>順序保証</td><td>FIFO 対応</td><td>FIFO 対応</td><td>ベストエフォート</td></tr></tbody></table></div></div></div>","svg":"","domain_color":"#C50F1F"},{"num":18,"id":"q18","domain":"データストレージ設計","question_text":"store1 という名前の Azure Blob Storage アカウントを含む Azure サブスクリプションがあります。\n\nWindows Server 2016 を実行する Server1 というオンプレミス ファイル サーバーがあり、500 GB の組織ファイルをホストしています。\n\nServer1 に保存されているファイルのコピーを store1 Azure Blob Storage アカウントに作成・維持する必要があります。\n\nこの要件を達成するために使用できる 2 つの Azure サービスを選択してください。","choices":[{"text":"Azure Analysis Services のオンプレミス データ ゲートウェイ","is_correct":false},{"text":"Azure Import/Export ジョブ","is_correct":true},{"text":"Azure Data Factory","is_correct":true},{"text":"Azure Batch アカウント","is_correct":false},{"text":"Azure Logic Apps 統合アカウント","is_correct":false}],"correct_indices":[1,2],"n_correct":2,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">500 GB のデータをオンプレミス サーバーから Azure Blob Storage に移動するには：\n\n<strong>Azure Import/Export ジョブ（正解 1）</strong>：物理ディスクを Microsoft に郵送してデータを Azure に取り込む。帯域幅制限がある環境や大量データの移行に最適。\n\n<strong>Azure Data Factory（正解 2）</strong>：セルフホステッド統合ランタイム（SHIR）を使用して、オンプレミス サーバーから Azure Blob Storage へのデータ パイプラインを構築できる。継続的な転送にも対応。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>オンプレミス データ ゲートウェイ：</strong> Azure Analysis Services や Power BI 向けのデータ接続ツール。ファイル転送には使えない ❌\n\n<strong>Azure Batch：</strong> 大規模な並列計算処理向け。データ転送には使えない ❌\n\n<strong>Logic Apps 統合アカウント：</strong> B2B 統合（EDI/X12/AS2）向け。ファイル転送には不向き ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「大量データ転送」と聞いたら <strong>AzCopy</strong> を思い浮かべる方が多いですが、AzCopy は選択肢にありません。選択肢の中では Import/Export（物理転送）と ADF（ネットワーク転送）の 2 つが適切です。\n\n500 GB はネットワーク転送でもインポート ジョブでも現実的なサイズです（数十 TB 以上なら Data Box の方が適切）。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>サービス</th><th>用途</th><th>オンプレ→Azure Blob</th><th>帯域幅不要</th></tr></thead><tbody><tr><td>Import/Export ジョブ</td><td>物理ディスク郵送によるデータ転送</td><td>✅</td><td>物理転送</td></tr><tr><td>Azure Data Factory</td><td>ETL/データ パイプライン</td><td>SHIR 経由</td><td>ネットワーク必要</td></tr><tr><td>Azure Data Box</td><td>大規模物理転送（数十〜数百 TB）</td><td>✅</td><td>✅</td></tr><tr><td>AzCopy</td><td>コマンドライン ファイル コピー</td><td>✅</td><td>ネットワーク必要</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">大量データのオンプレ → Azure 転送：<strong>Import/Export（物理）</strong> または <strong>ADF + SHIR（ネットワーク）</strong>の 2 択。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/import-export/storage-import-export-service\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/import-export/storage-import-export-service</a></li></ul></div>\n</div>","svg":"","domain_color":"#0072C6"},{"num":19,"id":"q19","domain":"インフラストラクチャ設計","question_text":"オンプレミス ネットワークが 172.16.0.0/16 という IP アドレス範囲を使用しています。\n\n新しい Azure サブスクリプションに 30 台の仮想マシンをデプロイする計画があります。\n\nデプロイは以下の技術要件を満たす必要があります：\n\n・すべての Azure 仮想マシンは Subnet1 という単一のサブネットに配置されること\n・Azure 仮想ネットワークはオンプレミス ネットワークに接続されること\n・Azure 仮想ネットワークとオンプレミス ネットワークの IP アドレス空間が重複しないこと\n\n仮想マシンを収容するのに適した仮想ネットワークのアドレス空間はどれですか？","choices":[{"text":"172.16.0.0/16","is_correct":false},{"text":"172.16.1.0/27","is_correct":false},{"text":"192.168.0.0/24","is_correct":true},{"text":"192.168.1.0/27","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：①オンプレミス 172.16.0.0/16 と重複しない、②30 台の VM を収容する単一サブネット、③Azure が 5 IP 予約。\n\n30 台 + 5 予約 = 最低 35 IP が必要 → /27 (32 IP) では不足、<strong>/24 (256 IP) が必要</strong>。\n\n172.16.x.x との重複を避けるため 192.168.x.x を使用 → <strong>192.168.0.0/24</strong> が正解。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>172.16.0.0/16：</strong> オンプレミスと完全に重複 ❌\n\n<strong>172.16.1.0/27：</strong> 172.16.x.x はオンプレミス範囲内（172.16.0.0/16 の中に含まれる）❌\n\n<strong>192.168.1.0/27：</strong> IP 範囲は問題ないが、/27 は 32 IP（5 予約後 27 個）。30 台には不足（27 < 30）❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Azure のサブネットには<strong>5 つの IP アドレスが予約</strong>されています：\n• .0：ネットワーク アドレス\n• .1：デフォルト ゲートウェイ\n• .2、.3：DNS サーバー（Azure 予約）\n• 最後のアドレス：ブロードキャスト\n\nこの計算を忘れると /27（30 台には不足）を選んでしまいます。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>CIDR</th><th>総 IP 数</th><th class=\"cc\">利用可能 IP</th><th>30 台収容</th><th>オンプレ重複なし</th></tr></thead><tbody><tr><td>172.16.0.0/16</td><td>65,536</td><td class=\"cc\">65,531</td><td>✅</td><td>重複</td></tr><tr><td>172.16.1.0/27</td><td>32</td><td class=\"cc\">27</td><td>不足</td><td>重複</td></tr><tr><td>192.168.0.0/24</td><td>256</td><td class=\"cc\">251</td><td>✅</td><td>正解</td></tr><tr><td>192.168.1.0/27</td><td>32</td><td class=\"cc\">27</td><td>不足</td><td>✅</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">VM 台数 + Azure 予約 5 IP = 必要 IP 数。CIDR 計算は「2^(32-プレフィックス長) - 5 ≥ VM 台数」で判断。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq</a></li></ul></div>\n</div>","svg":"","domain_color":"#C50F1F"},{"num":20,"id":"q20","domain":"インフラストラクチャ設計","question_text":"オンプレミス ネットワークが 172.16.0.0/16 という IP アドレス範囲を使用しています。\n\n新しい Azure サブスクリプションに 30 台の仮想マシンをデプロイする計画があります。\n\nデプロイは以下の技術要件を満たす必要があります：\n\n・すべての Azure 仮想マシンは Subnet1 という単一のサブネットに配置されること\n・Azure 仮想ネットワークはオンプレミス ネットワークに接続されること\n・Azure 仮想ネットワークとオンプレミス ネットワークの IP アドレス空間が重複しないこと\n\n推奨されるソリューションで使用すべきサブネットのアドレス空間はどれですか？","choices":[{"text":"172.16.0.0/16","is_correct":false},{"text":"172.16.1.0/27","is_correct":false},{"text":"192.168.0.0/24","is_correct":false},{"text":"192.168.1.0/27","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">正解について — 192.168.1.0/27</div><div class=\"exp-block-body\">この問題は Q19 の続きで、Q19 で選んだ VNet アドレス空間（192.168.0.0/24）内にサブネットを作成する想定です。\n\n<strong>各選択肢の評価：</strong>\n• <strong>172.16.0.0/16</strong>：オンプレミス範囲と完全に重複 ❌\n• <strong>172.16.1.0/27</strong>：172.16.x.x はオンプレミス（172.16.0.0/16）の中に含まれる ❌\n• <strong>192.168.0.0/24</strong>：VNet アドレス空間全体と同じ。サブネットは VNet より小さい CIDR を使う必要がある ❌\n• <strong>192.168.1.0/27</strong>：オンプレミスと重複なし。/27 = 32 IP（5 予約後 27 個使用可能）\n\n<strong>試験の意図：</strong>オンプレミス（172.16.x.x）と重複しない、かつ192.168.0.0/24の VNet 内に収まるサブネットとして 192.168.1.0/27 が選ばれています。</div></div>\n\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">注意 — この問題について</div><div class=\"exp-block-body\">厳密に言うと 192.168.1.0/27 は 192.168.0.0/24 の範囲外です（/24 は 192.168.0.0〜192.168.0.255 の範囲のみ）。\n\n試験問題として、<strong>オンプレミスと重複しない点</strong>を確認することが主眼で、正確な VNet/サブネット包含関係は簡略化されている可能性があります。\n\n実際の試験では「オンプレミスアドレスと重複しない選択肢を選ぶ」という観点で 192.168.x.x のアドレスが正解とされます。</div></div>\n\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">実務でのサブネット設計の考え方</div><div class=\"exp-block-body\">Azure サブネットの設計では：\n1. <strong>オンプレミスと重複しないアドレス範囲</strong>を VNet に割り当て\n2. VNet アドレス空間の中から<strong>サブネットを切り出す</strong>\n3. VM 台数 + Azure 予約 5 IP（ネットワーク、GW、DNS×2、ブロードキャスト）= 必要 IP 数\n\n<strong>30 台の VM の場合：</strong> 30 + 5 = 35 IP 必要 → /27（32 IP）は理論上は不足\n実際は /26（64 IP、59 使用可能）以上が推奨されますが、この試験問題では /27 が正解とされています。</div></div>\n\n<div class=\"comp-s\"><div class=\"comp-l\">CIDR と使用可能 IP 数</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>CIDR</th><th>総 IP 数</th><th>使用可能 IP</th><th>30 台収容可否</th><th>オンプレ重複</th></tr></thead><tbody>\n<tr><td>172.16.0.0/16</td><td>65,536</td><td>65,531</td><td>理論上可</td><td>重複</td></tr>\n<tr><td>172.16.1.0/27</td><td>32</td><td>27</td><td>不足</td><td>重複</td></tr>\n<tr><td>192.168.0.0/24</td><td>256</td><td>251</td><td>✅</td><td>問題なし（VNet空間）</td></tr>\n<tr><td class=\"cc\">192.168.1.0/27</td><td>32</td><td>27</td><td>△ ギリギリ</td><td class=\"cc\">問題なし（正解）</td></tr>\n</tbody></table></div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">サブネット選択の基本原則：①オンプレミスと重複しないアドレス範囲、②十分な IP 数（VM 台数 + 5 Azure 予約）。この問題では「オンプレミスと重複しない」点が最重要判断基準。</div></div>\n</div>","svg":"","domain_color":"#C50F1F"},{"num":21,"id":"q21","domain":"インフラストラクチャ設計","question_text":"オンプレミス環境から Azure へのデータ移行を計画しています。\n\nデータ ソースと移行先は以下の通りです：\n\n・Microsoft SQL Server 2014 データベース → Azure SQL データベース\n・Microsoft SQL Server 2008 データベースのテーブル → Azure Cosmos DB\n・JSON ファイル → Azure Cosmos DB\n\nどのツールを使用して SQL Server 2014 データベースを Azure SQL データベースに移行すべきですか？","choices":[{"text":"AzCopy","is_correct":false},{"text":"Azure Cosmos DB Data Migration Tool","is_correct":false},{"text":"Data Management Gateway","is_correct":false},{"text":"Data Migration Assistant (DMA)","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">SQL Server 2014 → Azure SQL Database への移行には <strong>Data Migration Assistant（DMA）</strong> が最適です。\n\nDMA の機能：\n• オンプレミス SQL Server の互換性評価（破壊的変更の検出）\n• スキーマとデータの移行\n• Azure SQL Database との互換性レポート</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>AzCopy：</strong> Azure Storage（Blob/Files）間のファイルコピーツール。SQL データベース移行には使えない ❌\n\n<strong>Cosmos DB Data Migration Tool：</strong> Cosmos DB への移行専用。Azure SQL Database への移行には使えない ❌\n\n<strong>Data Management Gateway：</strong> Power BI / Azure Data Factory のオンプレミス接続コンポーネント（旧製品）。データベース移行ツールではない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「SQL Server → Azure SQL Database」と「SQL Server → Cosmos DB」で使うツールが違います。混同しないよう注意。\n\nまた DMA と SSMA（SQL Server Migration Assistant）の違いも：\n• <strong>DMA</strong>：SQL Server → Azure SQL Database/Managed Instance\n• <strong>SSMA</strong>：Oracle/MySQL などの異種 DB → SQL Server/Azure SQL への移行</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">ツール</th><th>移行元</th><th>移行先</th><th>用途</th></tr></thead><tbody><tr><td class=\"cc\">DMA</td><td>SQL Server</td><td>Azure SQL DB / MI</td><td>スキーマ・データ移行 + 評価 ✅</td></tr><tr><td class=\"cc\">Azure Database Migration Service</td><td>SQL Server / MySQL / etc.</td><td>Azure SQL 各種</td><td>大規模オンライン移行</td></tr><tr><td class=\"cc\">Cosmos DB Migration Tool</td><td>SQL Server / JSON / MongoDB</td><td>Cosmos DB</td><td>Cosmos DB 専用</td></tr><tr><td class=\"cc\">AzCopy</td><td>ファイル / Blob / ADLS</td><td>Azure Storage 系</td><td>ストレージ間コピー</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">SQL Server → Azure SQL Database の評価・移行 = <strong>Data Migration Assistant（DMA）</strong>。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/sql/dma/dma-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/sql/dma/dma-overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#C50F1F"},{"num":22,"id":"q22","domain":"インフラストラクチャ設計","question_text":"オンプレミス環境から Azure へのデータ移行を計画しています。\n\nデータ ソースと移行先は以下の通りです：\n\n・Microsoft SQL Server 2014 データベース → Azure SQL データベース\n・Microsoft SQL Server 2008 データベースのテーブル → Azure Cosmos DB\n・JSON ファイル → Azure Cosmos DB\n\nどのツールを使用して SQL Server 2008 のテーブルと JSON ファイルを Azure Cosmos DB に移行すべきですか？","choices":[{"text":"AzCopy","is_correct":false},{"text":"Azure Cosmos DB Data Migration Tool","is_correct":true},{"text":"Data Management Gateway","is_correct":false},{"text":"Data Migration Assistant (DMA)","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">移行対象：SQL Server 2008 のテーブル + JSON ファイル → <strong>Azure Cosmos DB</strong>。\n\n<strong>Azure Cosmos DB Data Migration Tool</strong> は複数のソース（SQL Server、JSON、CSV、MongoDB など）から Cosmos DB へのデータ移行をサポートしています。このツールのみが SQL テーブルと JSON ファイルの両方を同時に Cosmos DB へ移行できます。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>AzCopy：</strong> Azure Storage 間のファイルコピー。Cosmos DB への移行には使えない ❌\n\n<strong>DMA：</strong> Azure SQL Database/Managed Instance への SQL 移行ツール。Cosmos DB は対象外 ❌\n\n<strong>Data Management Gateway：</strong> ADF のオンプレミス接続コンポーネント。直接移行ツールではない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Q21 と Q22 はほぼ同じシナリオですが、<strong>移行先が異なります</strong>（Q21：Azure SQL Database、Q22：Cosmos DB）。移行先によってツールが完全に変わります。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>移行先</th><th>推奨ツール</th></tr></thead><tbody><tr><td>Azure SQL Database</td><td>Data Migration Assistant (DMA)</td></tr><tr><td>Azure SQL Managed Instance</td><td>DMA / Azure Database Migration Service</td></tr><tr><td>Azure Cosmos DB</td><td>Cosmos DB Data Migration Tool ✅</td></tr><tr><td>Azure Synapse Analytics</td><td>Azure Data Factory / COPY ステートメント</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">移行先が Cosmos DB → <strong>Cosmos DB Data Migration Tool</strong>。Azure SQL 系とは別ツール。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/cosmos-db/import-data\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/cosmos-db/import-data</a></li></ul></div>\n</div>","svg":"","domain_color":"#C50F1F"},{"num":23,"id":"q23","domain":"インフラストラクチャ設計","question_text":"ある企業が Azure 仮想マシンで Web アプリケーションをホストしています。\n\nアプリケーションを SQL インジェクション攻撃から保護し、レイヤー 7 ロード バランシング ソリューションを使用してトラフィックを分散させる必要があります。ソリューションは既存のアプリケーションへの変更を最小限に抑えるものでなければなりません。\n\n推奨に含めるべき 2 つのコンポーネントはどれですか？","choices":[{"text":"Web Application Firewall (WAF)","is_correct":false},{"text":"Azure Application Gateway","is_correct":true},{"text":"Azure Load Balancer","is_correct":false},{"text":"Azure Traffic Manager","is_correct":false},{"text":"SSL オフロード","is_correct":false},{"text":"URL ベースのコンテンツ ルーティング","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">Application Gateway + WAF アーキテクチャ（Q23-24）</div><svg viewBox=\"0 0 560 210\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margi t>\n<text x=\"485\" y=\"67\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">SSL証明書</text>\n<line x1=\"185\" y1=\"15\" x2=\"485\" y2=\"15\" stroke=\"#F97C00\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/>\n<line x1=\"485\" y1=\"15\" x2=\"485\" y2=\"15\" stroke=\"#F97C00\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/>\n<text x=\"185\" y=\"200\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">WAF はOWASP ルールセットで SQLi / XSS等をブロック</text>\n\n</svg></div><div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解か</div><div class=\"exp-block-body\"><b>B: Azure Application Gateway</b><br>要件：① SQL インジェクション保護（WAF）、② レイヤー 7 ロードバランシング<br>Azure Application Gateway は<b>L7 ロードバランサー</b>で、URL・ホストヘッダーベースのルーティングと<b>WAF 機能の統合</b>が可能。<br>既存アプリの変更不要でトラフィックを分散しつつ保護できます。2 つのコンポーネントのうちの 1 つ目。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ 他の選択肢が不正解の理由</div><div class=\"exp-block-body\"><b>A: WAF のみ</b> — WAF は Application Gateway 上で有効化するもの。単独では L7 LB 機能がない。<br><b>C: Azure Load Balancer</b> — L4 のみ。WAF 機能なし。SQL インジェクション保護不可。<br><b>D: Traffic Manager</b> — DNS ベース。WAF なし。アプリ変更最小化に貢献しない。<br><b>E: SSL オフロード</b> — Application Gateway の機能の一部だが単体サービスではない。<br><b>F: URL ベースルーティング</b> — 同上、App Gateway の機能。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">Q23 と Q24 はセット問題。Q23 = App Gateway、Q24 = WAF の組み合わせが 2 コンポーネントの答え。</div></div></div>","svg":"","domain_color":"#C50F1F"},{"num":24,"id":"q24","domain":"インフラストラクチャ設計","question_text":"ある企業が Azure 仮想マシンで Web アプリケーションをホストしています。\n\nアプリケーションを SQL インジェクション攻撃から保護し、レイヤー 7 ロード バランシング ソリューションを使用してトラフィックを分散させる必要があります。ソリューションは既存のアプリケーションへの変更を最小限に抑えるものでなければなりません。\n\n推奨事項を作成する必要があります。ソリューションには Azure Application Gateway が含まれます。\n\n何をデプロイ・構成すべきですか？","choices":[{"text":"Azure Application Gateway","is_correct":false serif\">L7 LB + WAF</text>\n<line x1=\"235\" y1=\"95\" x2=\"270\" y2=\"75\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<line x1=\"235\" y1=\"95\" x2=\"270\" y2=\"115\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<rect x=\"275\" y=\"30\" width=\"140\" height=\"130\" rx=\"8\" fill=\"none\" stroke=\"#1e4080\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/>\n<text x=\"345\" y=\"48\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Backend Pool</text>\n<rect x=\"285\" y=\"55\" width=\"110\" height=\"45\" rx=\"7\" fill=\"#112240\" stroke=\"#0078D4\" stroke-width=\"1.5\"/>\n<rect x=\"291\" y=\"60\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#0078D4\" fill-opacity=\"0.18\"/>\n<text x=\"340\" y=\"76\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0078D4\" font-family=\"Segoe UI,Arial,sans-serif\">VM1</text>\n<text x=\"340\" y=\"96\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">VM / App</text>\n<text x=\"340\" y=\"107\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Service 1</text>\n<rect x=\"285\" y=\"105\" width=\"110\" height=\"45\" rx=\"7\" fill=\"#112240\" stroke=\"#0078D4\" stroke-width=\"1.5\"/>\n<rect x=\"291\" y=\"110\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#0078D4\" fill-opacity=\"0.18\"/>\n<text x=\"340\" y=\"126\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0078D4\" font-family=\"Segoe UI,Arial,sans-serif\">VM2</text>\n<text x=\"340\" y=\"146\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">VM / App</text>\n<text x=\"340\" y=\"157\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Service 2</text>\n<line x1=\"185\" y1=\"50\" x2=\"185\" y2=\"15\" stroke=\"#F97C00\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/>\n<rect x=\"430\" y=\"15\" width=\"110\" height=\"55\" rx=\"7\" fill=\"#112240\" stroke=\"#F97C00\" stroke-width=\"1.5\"/>\n<rect x=\"436\" y=\"20\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#F97C00\" fill-opacity=\"0.18\"/>\n<text x=\"485\" y=\"36\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#F97C00\" font-family=\"Segoe UI,Arial,sans-serif\">KV</text>\n<text x=\"485\" y=\"56\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Key Vault</text>\n<text x=\"485\" y=\"67\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">SSL証明書</text>\n<line x1=\"185\" y1=\"15\" x2=\"485\" y2=\"15\" stroke=\"#F97C00\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/>\n<line x1=\"485\" y1=\"15\" x2=\"485\" y2=\"15\" stroke=\"#F97C00\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\"/>\n<text x=\"185\" y=\"200\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">WAF はOWASP ルールセットで SQLi / XSS等をブロック</text>\n\n</svg></div><div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解か</div><div class=\"exp-block-body\"><b>B: Web Application Firewall (WAF)</b><br>問題文に「Azure Application Gateway が含まれる」とあり、もう 1 つのコンポーネントを問われています。<br>WAF は Application Gateway 上で有効化し、<b>OWASP コアルールセット</b>により SQL インジェクション・XSS などの攻撃を自動検知・ブロックします。<br>アプリ側のコード変更不要でセキュリティ対策が完成します。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ 他の選択肢が不正解の理由</div><div class=\"exp-block-body\"><b>A: Application Gateway</b> — 問題文で既に含まれると提示済み。追加コンポーネントではない。<br><b>C: Load Balancer</b> — L4 のみ。WAF なし。<br><b>D: Traffic Manager</b> — DNS LB。L7 保護なし。<br><b>E: SSL オフロード、F: URL ルーティング</b> — App Gateway の機能であり、独立した「コンポーネント」ではない。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">WAF は「Application Gateway の SKU（WAF v2）」として有効化する。App Gateway なしでは使えない。<br>最近は Front Door にも WAF ポリシーを統合可能。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">📌 重要知識</div><div class=\"exp-block-body\"><b>WAF のルールセット</b><br>・OWASP CRS 3.2（デフォルト）: SQLi, XSS, RFI, LFI など<br>・Microsoft_BotManagerRuleSet: ボット対策<br>・カスタムルール: IP 制限・レート制限など独自ルール追加可能</div></div></div>","svg":"","domain_color":"#C50F1F"},{"num":25,"id":"q25","domain":"インフラストラクチャ設計","question_text":"複数のデータベースからデータを取得するアプリケーション インスタンスを管理しています。アプリケーション コードでは、サーバー名、データベース名、テーブル名を指定してデータベース テーブルを参照しています。\n\nアプリケーションのデータを Azure に移行する計画があります。\n\nこの要件を満たすためにアプリケーションのデータを移行できる 2 つの Azure サービスはどれですか？","choices":[{"text":"SQL Server Stretch Database","is_correct":false},{"text":"Azure 仮想マシン上の SQL Server","is_correct":true},{"text":"Azure SQL Database","is_correct":false},{"text":"Azure SQL Managed Instance","is_correct":true}],"correct_indices":[1,3],"n_correct":2,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">アプリがサーバー名・データベース名・テーブル名の<strong>3 部構成（server.database.table）</strong>でデータを参照しているということは、<strong>クロスデータベース クエリ</strong>を使用している証拠です。\n\n<strong>Azure VM 上の SQL Server</strong>：完全な SQL Server 互換性。クロスデータベース クエリ（USE database / 3 部構成参照）完全サポート。\n\n<strong>Azure SQL Managed Instance</strong>：SQL Server とほぼ完全互換。クロスデータベース クエリをサポート。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure SQL Database（単一 DB）：</strong> クロスデータベース クエリは<strong>サポートされていない</strong>（エラスティック クエリを使えば限定的に可能だが、シームレスには動作しない）❌\n\n<strong>SQL Server Stretch Database：</strong> オンプレミス SQL Server の古いデータを Azure にアーカイブするサービス。新規移行先としては適切でない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「Azure SQL Database」と「Azure SQL Managed Instance」は名前が似ていますが機能が大きく異なります。クロスデータベース クエリ（3 部構成参照）は <strong>SQL Database では基本的にサポートされません</strong>。この違いが試験に頻出です。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>サービス</th><th>クロスDB クエリ</th><th>SQL Agent</th><th>CLR</th><th>コード変更不要</th></tr></thead><tbody><tr><td>Azure SQL Database</td><td>非対応</td><td>❌</td><td>❌</td><td>❌</td></tr><tr><td>Azure SQL Managed Instance</td><td>✅</td><td>✅</td><td>✅</td><td>高互換</td></tr><tr><td>Azure VM 上の SQL Server</td><td>✅</td><td>✅</td><td>✅</td><td>完全互換</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">クロスデータベース クエリ（3 部構成参照）が必要 → <strong>SQL Managed Instance または VM 上の SQL Server</strong>。SQL Database はサポートしない。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/sql-managed-instance-paas-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/sql-managed-instance-paas-overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#C50F1F"},{"num":26,"id":"q26","domain":"ID・ガバナンス・監視","question_text":"ある企業が Web アプリケーションで使用される HTTP ベースの API を構築する計画を立てています。この Web アプリケーションを使用すると、顧客は注文ステータスを確認できます。\n\nAPI は以下の条件を満たす必要があります：\n\n・Azure Functions を使用して実装されること\n・パブリックな読み取り専用アクセスを許可すること\n・データの変更を実行する操作をブロックすること\n\nAzure Functions の実装でサポートすべき HTTP メソッドはどれですか？","choices":[{"text":"すべての API メソッド","is_correct":false},{"text":"GET のみ","is_correct":true},{"text":"GET と POST のみ","is_correct":false},{"text":"GET、POST、OPTIONS のみ","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「注文ステータス確認の<strong>読み取り専用</strong>・<strong>パブリック アクセス</strong>の API」。\n\nHTTP メソッドのうち、データの<strong>読み取り専用</strong>は <strong>GET</strong> のみ。POST（作成）、PUT（更新）、DELETE（削除）はデータ変更を伴うため許可すべきではありません。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>すべての API メソッド：</strong> データ変更メソッド（POST/PUT/DELETE）も含むため不適切 ❌\n\n<strong>GET と POST のみ：</strong> POST はデータ作成に使用されるため、読み取り専用には不要 ❌\n\n<strong>GET、POST、OPTIONS：</strong> OPTIONS は CORS プリフライト向けだが、要件外 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">OPTIONS メソッドは CORS（クロスオリジン リソース共有）のプリフライト リクエストに使用されます。「パブリック アクセス + CORS 対応」が要件であれば OPTIONS も必要になりますが、この問題では<strong>読み取り専用</strong>の要件が優先されるため、シンプルに GET のみが正解です。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>HTTP メソッド</th><th>目的</th><th>読み取り専用 API に必要？</th></tr></thead><tbody><tr><td>GET</td><td>データ取得（読み取り）</td><td>必要</td></tr><tr><td>POST</td><td>データ作成（書き込み）</td><td>不要</td></tr><tr><td>PUT / PATCH</td><td>データ更新（書き込み）</td><td>不要</td></tr><tr><td>DELETE</td><td>データ削除（書き込み）</td><td>不要</td></tr><tr><td>OPTIONS</td><td>CORS プリフライト</td><td>△ CORS が必要な場合のみ</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「読み取り専用 API」= <strong>GET のみ許可</strong>。POST/PUT/DELETE はデータ変更メソッドなので不要。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/api-management/api-management-access-restriction-policies\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/api-management/api-management-access-restriction-policies</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":27,"id":"q27","domain":"ID・ガバナンス・監視","question_text":"ある企業が Web アプリケーションで使用される HTTP ベースの API を構築する計画を立てています。この Web アプリケーションを使用すると、顧客は注文ステータスを確認できます。\n\nAPI は以下の条件を満たす必要があります：\n\n・Azure Functions を使用して実装されること\n・パブリックな読み取り専用アクセスを許可すること\n・データの変更を実行する操作をブロックすること\n\nAzure Functions 実装で使用すべき承認レベルはどれですか？","choices":[{"text":"Function","is_correct":false},{"text":"Anonymous（匿名）","is_correct":true},{"text":"Admin（管理者）","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Azure Functions の承認レベル：\n• <strong>Anonymous（匿名）</strong>：API キー不要。誰でもアクセス可能。→ パブリック読み取り専用 API に最適 ✅\n• Function：関数固有の API キーが必要\n• Admin：マスター API キーが必要（最高権限）</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Function：</strong> API キー（x-functions-key ヘッダーまたはクエリ パラメーター）が必要。パブリック アクセスを妨げる ❌\n\n<strong>Admin（管理者）：</strong> マスター キーが必要。最も制限が厳しい ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「パブリックで誰でもアクセスできる」= <strong>Anonymous</strong>、「アプリ/ユーザーごとに制限したい」= <strong>Function</strong>、「管理用の操作のみ」= <strong>Admin</strong>。\n\nAzure API Management の承認（subscription key）と混同しないよう注意。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">承認レベル</th><th>必要なもの</th><th>パブリックアクセス</th><th>用途</th></tr></thead><tbody><tr><td class=\"cc\">Anonymous</td><td>なし</td><td>誰でも可</td><td>パブリック API ✅</td></tr><tr><td class=\"cc\">Function</td><td>関数キー</td><td>キー必要</td><td>特定クライアント向け</td></tr><tr><td class=\"cc\">Admin</td><td>マスター キー</td><td>キー必要</td><td>管理操作のみ</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Azure Functions のパブリック API = <strong>Anonymous 承認レベル</strong>。認証不要でアクセス可能。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-http-webhook-trig
