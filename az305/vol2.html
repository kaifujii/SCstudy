\"55\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#107C41\" fill-opacity=\"0.18\"/>\n<text x=\"85\" y=\"71\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#107C41\" font-family=\"Segoe UI,Arial,sans-serif\">VM</text>\n<text x=\"85\" y=\"91\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Azure VM</text>\n<text x=\"85\" y=\"102\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">監視対象</text>\n<rect x=\"30\" y=\"120\" width=\"110\" height=\"55\" rx=\"7\" fill=\"#112240\" stroke=\"#107C41\" stroke-width=\"1.5\"/>\n<rect x=\"36\" y=\"125\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#107C41\" fill-opacity=\"0.18\"/>\n<text x=\"85\" y=\"141\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#107C41\" font-family=\"Segoe UI,Arial,sans-serif\">AKS</text>\n<text x=\"85\" y=\"161\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">AKS</text>\n<text x=\"85\" y=\"172\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">監視対象</text>\n<rect x=\"175\" y=\"85\" width=\"120\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"181\" y=\"90\" width=\"108\" height=\"24\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"235\" y=\"106\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">PE</text>\n<text x=\"235\" y=\"126\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Private</text>\n<text x=\"235\" y=\"137\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Endpoint</text>\n<line x1=\"140\" y1=\"75\" x2=\"170\" y2=\"100\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<line x1=\"140\" y1=\"147\" x2=\"170\" y2=\"115\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<line x1=\"295\" y1=\"115\" x2=\"335\" y2=\"115\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"315\" y=\"111\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">プライベート通信</text>\n<rect x=\"340\" y=\"20\" width=\"380\" height=\"200\" rx=\"8\" fill=\"none\" stroke=\"#6264A7\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n<text x=\"530\" y=\"38\" text-anchor=\"middle\" font-size=\"8\" fill=\"#6264A7\" font-family=\"Segoe UI,Arial,sans-serif\">AMPLS (Azure Monitor Private Link Scope)</text>\n<rect x=\"355\" y=\"50\" width=\"130\" height=\"55\" rx=\"7\" fill=\"#112240\" stroke=\"#6264A7\" stroke-width=\"1.5\"/>\n<rect x=\"361\" y=\"55\" width=\"118\" height=\"24\" rx=\"4\" fill=\"#6264A7\" fill-opacity=\"0.18\"/>\n<text x=\"420\" y=\"71\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#6264A7\" font-family=\"Segoe UI,Arial,sans-serif\">LAW</text>\n<text x=\"420\" y=\"91\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Log Analytics</text>\n<text x=\"420\" y=\"102\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Workspace</text>\n<rect x=\"355\" y=\"120\" width=\"130\" height=\"55\" rx=\"7\" fill=\"#112240\" stroke=\"#6264A7\" stroke-width=\"1.5\"/>\n<rect x=\"361\" y=\"125\" width=\"118\" height=\"24\" rx=\"4\" fill=\"#6264A7\" fill-opacity=\"0.18\"/>\n<text x=\"420\" y=\"141\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#6264A7\" font-family=\"Segoe UI,Arial,sans-serif\">AI</text>\n<text x=\"420\" y=\"161\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Application</text>\n<text x=\"420\" y=\"172\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Insights</text>\n<rect x=\"510\" y=\"80\" width=\"100\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#E040FB\" stroke-width=\"1.5\"/>\n<rect x=\"516\" y=\"85\" width=\"88\" height=\"24\" rx=\"4\" fill=\"#E040FB\" fill-opacity=\"0.18\"/>\n<text x=\"560\" y=\"101\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#E040FB\" font-family=\"Segoe UI,Arial,sans-serif\">AM</text>\n<text x=\"560\" y=\"121\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Azure Monitor</text>\n<text x=\"560\" y=\"132\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">管理</text>\n<line x1=\"485\" y1=\"77\" x2=\"505\" y2=\"100\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<line x1=\"485\" y1=\"147\" x2=\"505\" y2=\"120\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"530\" y=\"235\" text-anchor=\"middle\" font-size=\"8\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">パブリックインターネット経由なし・監視データ完全プライベート</text>\n\n</svg></div><div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解か</div><div class=\"exp-block-body\"><b>D: Azure Monitor プライベート リンク スコープ (AMPLS)</b><br>要件：「ログデータが Azure プライベートネットワーク経由でのみ取り込まれるようにする」<br>AMPLS は複数の Azure Monitor リソース（Log Analytics Workspace、Application Insights 等）を 1 つの<b>プライベートリンクスコープ</b>にまとめ、VNet 上の<b>プライベートエンドポイント</b>経由でのみアクセスを許可します。<br>・インターネットを経由しない安全なログ転送<br>・Workspace のパブリックアクセスを無効化して完全プライベート化<br>・1,000 台の VM からのログを一元的にプライベート経路で収集</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ 他の選択肢が不正解の理由</div><div class=\"exp-block-body\"><b>A: リンク済みストレージアカウント</b> — Log Analytics の一部カスタムログに使うが、<b>プライベートネットワーク転送の強制</b>には直接対応しない。<br><b>B: Azure Peering Service</b> — ISP 接続の最適化サービス。Azure 内部のプライベート通信制御とは異なる用途。<br><b>C: Service Connector</b> — App Service などからデータストアへの接続設定を自動化するツール。ログ収集のプライベート制御ではない。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">AMPLS の「Scope」の意味：複数の Log Analytics Workspace や Application Insights をまとめてプライベートリンク管理できる点が特徴。<br>リソースごとに個別プライベートエンドポイントを作る必要がなくなる。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">📌 重要知識</div><div class=\"exp-block-body\"><b>AMPLS の構成要素</b><br>1. <b>Azure Monitor Private Link Scope</b>: LAW・App Insights を登録するコンテナ<br>2. <b>プライベートエンドポイント</b>: VNet に作成し、AMPLS に接続<br>3. <b>DNS 設定</b>: プライベート DNS ゾーンで名前解決をプライベート IP に向ける<br>4. <b>Workspace のパブリックアクセス無効化</b>: インターネット経由の取り込みをブロック</div></div></div>","svg":"","domain_color":"#7719AA"}];
const TOTAL = QUESTIONS.length;
const LTR = 'ABCDEFGHIJKLMNOP';
let state={}, filter='all', multiSel={};
function initState(){
  const chk=document.getElementById('chk-shuf');
  const doShuf=chk&&chk.checked;
  state={};multiSel={};displayChoices={};
  QUESTIONS.forEach(q=>{
    state[q.id]={answered:false,correct:false};
    displayChoices[q.id]=doShuf?shuf([...q.choices]):[...q.choices];
  });
}
function filtered(){return filter==='all'?QUESTIONS:QUESTIONS.filter(q=>q.domain===filter);}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){
  const qs=filtered();
  document.getElementById('qwrap').innerHTML=qs.map(q=>renderQ(q)).join('');
  qs.forEach(q=>{if(state[q.id]?.answered)restoreQ(q);});
  updateProgress();
}
function renderQ(q){
  const isMulti=q.n_correct>1;
  const mbadge=isMulti?`<span class="mbadge">複数選択 (${q.n_correct}つ)</span>`:'';
  const mhint=isMulti?`<div class="multi-hint">⚡ ${q.n_correct}つの選択肢を選んでください</div>`:'';
  const choices=(displayChoices[q.id]||q.choices).map((c,i)=>`<button class="cbtn" id="c_${q.id}_${i}" onclick="onChoice('${q.id}',${i})"><span class="cltr">${LTR[i]}</span><span>${escH(c.text)}</span></button>`).join('');
  const sub=isMulti?`<button class="submit-btn" id="sub_${q.id}" onclick="submitMulti('${q.id}')">回答を確定する</button>`:'';
  return `<div class="qcard" id="card_${q.id}"><div class="qh"><span class="qnum">問 ${q.num}</span><span class="dbadge" style="background:${q.domain_color||'#0072C6'}">${q.domain}</span>${mbadge}</div><div class="qbody"><p class="qtext">${escH(q.question_text)}</p></div>${mhint}<div class="choices">${choices}</div>${sub}<div class="expanel" id="exp_${q.id}"><div id="rbadge_${q.id}"></div>${q.exp_html}</div></div>`;
}
function onChoice(qid,idx){
  if(state[qid]?.answered)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  if(q.n_correct>1){
    if(!multiSel[qid])multiSel[qid]=new Set();
    const btn=document.getElementById(`c_${qid}_${idx}`);
    if(multiSel[qid].has(idx)){multiSel[qid].delete(idx);btn.classList.remove('multi-selected');}
    else{if(multiSel[qid].size>=q.n_correct)return;multiSel[qid].add(idx);btn.classList.add('multi-selected');}
    const sub=document.getElementById(`sub_${qid}`);
    if(sub)sub.style.display=multiSel[qid].size>=q.n_correct?'block':'none';
  }else{
    state[qid]={answered:true,correct:(displayChoices[qid]||q.choices)[idx].is_correct};
    applyAnswer(q,[idx]);
  }
}
function submitMulti(qid){
  if(state[qid]?.answered)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  const sel=[...(multiSel[qid]||new Set())];
  const cset=new Set((displayChoices[qid]||q.choices).map((c,i)=>c.is_correct?i:-1).filter(i=>i>=0));
  state[qid]={answered:true,correct:sel.length===cset.size&&sel.every(i=>cset.has(i))};
  applyAnswer(q,sel);
}
function applyAnswer(q,sel){
  const sset=new Set(sel);const isOk=state[q.id].correct;
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);if(!btn)return;
    btn.disabled=true;btn.classList.remove('multi-selected');
    if(sset.has(i))btn.classList.add(c.is_correct?'correct':'wrong');
    if(c.is_correct&&!sset.has(i))btn.classList.add('reveal');
  });
  document.getElementById(`card_${q.id}`).classList.add(isOk?(q.n_correct>1?'multi-ok':'ok'):'ng');
  document.getElementById(`rbadge_${q.id}`).innerHTML=isOk
    ?`<div class="rbadge ${q.n_correct>1?'multi-ok':'ok'}">${q.n_correct>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説で正解・理由を確認しましょう</div>';
  document.getElementById(`exp_${q.id}`).style.display='block';
  const sub=document.getElementById(`sub_${q.id}`);if(sub)sub.style.display='none';
  updateProgress();
  setTimeout(()=>document.getElementById(`exp_${q.id}`).scrollIntoView({behavior:'smooth',block:'nearest'}),120);
}
function restoreQ(q){
  const s=state[q.id];if(!s?.answered)return;
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);if(!btn)return;
    btn.disabled=true;if(c.is_correct)btn.classList.add(s.correct?'correct':'reveal');
  });
  document.getElementById(`card_${q.id}`).classList.add(s.correct?(q.n_correct>1?'multi-ok':'ok'):'ng');
  const exp=document.getElementById(`exp_${q.id}`);if(exp)exp.style.display='block';
  const badge=document.getElementById(`rbadge_${q.id}`);
  if(badge)badge.innerHTML=s.correct
    ?`<div class="rbadge ${q.n_correct>1?'multi-ok':'ok'}">${q.n_correct>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説で正解・理由を確認しましょう</div>';
}
function filterDomain(d){
  filter=d;
  document.querySelectorAll('.dbtn').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  render();window.scrollTo({top:0});
}
function updateProgress(){
  const ans=Object.values(state).filter(s=>s.answered).length;
  const cor=Object.values(state).filter(s=>s.correct).length;
  document.getElementById('pbar').style.width=(ans/TOTAL*100)+'%';
  document.getElementById('hdrScore').textContent=`${cor}/${TOTAL}`;
  document.getElementById('hdrPct').textContent=`正解率 ${ans>0?Math.round(cor/ans*100):0}%`;
}
function showResults(){
  const cor=Object.values(state).filter(s=>s.correct).length;
  const pct=Math.round(cor/TOTAL*100);
  const ds={};
  QUESTIONS.forEach(q=>{
    if(!ds[q.domain])ds[q.domain]={t:0,c:0,color:q.domain_color||'#333'};
    ds[q.domain].t++;if(state[q.id]?.correct)ds[q.domain].c++;
  });
  document.getElementById('mscore').textContent=`${cor}/${TOTAL}`;
  document.getElementById('mpct').textContent=`正解率 ${pct}%`;
  const SVG_TROPHY='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 21 12 17 16 21"/><line x1="12" y1="17" x2="12" y2="11"/><path d="M18 6H6l1-4h10l1 4z"/><path d="M6 6c0 7 6 11 6 11s6-4 6-11"/></svg>';
  const SVG_UP='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>';
  const SVG_ZAP='<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
  const SVG_BOOK='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
  let icon=SVG_BOOK,msg='';
  if(pct>=80){icon=SVG_TROPHY;msg='合格圏内！本番でも自信を持って！';}
  else if(pct>=70){icon=SVG_UP;msg='あと少し！弱点ドメインを集中的に復習しよう。';}
  else if(pct>=50){icon=SVG_ZAP;msg='「間違えやすいポイント」を重点的に確認しよう。';}
  else{icon=SVG_BOOK;msg='各解説の「なぜ正解か」「なぜ不正解か」をしっかり読もう！';}
  document.getElementById('micon').innerHTML=icon;
  document.getElementById('mmsg').textContent=msg;
  document.getElementById('mdomains').innerHTML=Object.entries(ds).map(([d,s])=>{
    const p=Math.round(s.c/s.t*100);
    return `<div class="m-ditem"><div class="m-dname">${d}</div><div class="m-dval" style="color:${s.color}">${s.c}/${s.t} <span style="font-size:13px;font-weight:500;color:#888">(${p}%)</span></div></div>`;
  }).join('');
  document.getElementById('modal').classList.add('show');
}
function modalClose(e){if(!e||e.target.id==='modal')document.getElementById('modal').classList.remove('show');}
function resetAll(){document.getElementById('modal').classList.remove('show');initState();render();window.scrollTo({top:0,behavior:'smooth'});}
window.addEventListener('scroll',()=>document.getElementById('scrollTop').classList.toggle('show',window.scrollY>400));
initState();render();
</script>
