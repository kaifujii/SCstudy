ze=\"11\" font-weight=\"700\" fill=\"#F97C00\" font-family=\"Segoe UI,Arial,sans-serif\">Blob</text>\n<text x=\"380\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Azure Blob</text>\n<text x=\"380\" y=\"112\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Storage (Staging)</text>\n<line x1=\"430\" y1=\"90\" x2=\"465\" y2=\"90\" stroke=\"#4a9fd4\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n<text x=\"447\" y=\"86\" text-anchor=\"middle\" font-size=\"8\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Load</text>\n<rect x=\"470\" y=\"60\" width=\"110\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#0072C6\" stroke-width=\"1.5\"/>\n<rect x=\"476\" y=\"65\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#0072C6\" fill-opacity=\"0.18\"/>\n<text x=\"525\" y=\"81\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#0072C6\" font-family=\"Segoe UI,Arial,sans-serif\">DW</text>\n<text x=\"525\" y=\"101\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Synapse / SQL</text>\n<text x=\"525\" y=\"112\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#c5d8ef\" font-family=\"Segoe UI,Arial,sans-serif\">Data Warehouse</text>\n<text x=\"370\" y=\"145\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7a9cbf\" font-family=\"Segoe UI,Arial,sans-serif\">Linked Service → Dataset → Pipeline → Trigger</text>\n\n</svg></div><div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解か</div><div class=\"exp-block-body\"><b>B: Azure Data Factory</b><br>要件：「マッピング データ フローを使用してデータ変換 → Azure Data Lake Storage に転送」<br><b>マッピング データ フロー</b>は Azure Data Factory 固有の機能で、コーディング不要でデータ変換ロジックを視覚的に定義できます。<br>Blob Storage → ADF（変換）→ ADLS Gen2 という ETL パイプラインを構築できます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ 他の選択肢が不正解の理由</div><div class=\"exp-block-body\"><b>A: Azure Storage Sync</b> — オンプレミス ↔ Azure Files の同期ツール。データ変換機能なし。<br><b>C: Azure Data Box Gateway</b> — 大容量データの物理転送・仮想デバイス。変換機能なし。<br><b>D: Azure Databricks</b> — Spark ベースの分析。マッピングデータフローは ADF 固有の概念。<br><b>E: Azure File Sync</b> — Windows Server ↔ Azure Files の同期。ETL 機能なし。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">「マッピング データ フロー」というキーワードが出たら<b>必ず Azure Data Factory</b>。Databricks や Synapse Analytics とは別物。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">📌 重要知識</div><div class=\"exp-block-body\"><b>Azure Data Factory の主な機能</b><br>・パイプライン: アクティビティの連結<br>・マッピング データ フロー: ノーコードでデータ変換（Spark ベース）<br>・Power Query: セルフサービス ETL<br>・トリガー: スケジュール実行・イベント駆動実行<br>・90+ コネクタ: SQL, Blob, ADLS, Cosmos DB 等</div></div></div>","svg":"","domain_color":"#0072C6"},{"num":29,"id":"q29","domain":"データストレージ設計","question_text":"以下の条件を満たすデータ ストレージ ソリューションを推奨する必要があります：\n\n・REST ベースのインターフェイスを使用してアプリケーションがデータにアクセスできること\n・それぞれ異なるサイズとアクセス パターンを持つ 20 個のテーブルをサポートすること\n・別の Azure リージョンにデータが自動的にレプリケートされること\n・コストを可能な限り最小化すること\n\n推奨すべきストレージ ソリューションはどれですか？","choices":[{"text":"geo レプリケーションを使用した Azure SQL Database エラスティック データベース プール","is_correct":false},{"text":"読み取りアクセス geo 冗長ストレージ (RA-GRS) を使用した Azure Storage アカウントのテーブル","is_correct":false},{"text":"geo 冗長ストレージ (GRS) を使用した Azure Storage アカウントのテーブル","is_correct":true},{"text":"アクティブ geo レプリケーションを使用した Azure SQL Database","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：①REST ベース、②20 個のテーブル（異なるサイズ・アクセス パターン）、③別リージョンへの自動レプリケーション、④コスト最小化。\n\n<strong>GRS の Azure Storage テーブル</strong>が全要件を満たします：\n• REST API でアクセス可能\n• 複数テーブルをサポート\n• GRS で自動的にセカンダリ リージョンにレプリケート\n• Azure Table Storage は非常に低コスト（SQL より大幅に安価）</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>GRS の Azure SQL Database（エラスティック プール）：</strong> SQL クエリ可能だが、REST ベースではなく TDS/ODBC 接続。コスト高 ❌\n\n<strong>RA-GRS の Azure Storage テーブル：</strong> RA-GRS は読み取りアクセスが可能だが、GRS より高コスト。「読み取りアクセスが不要」なら RA-GRS は過剰 ❌\n\n<strong>アクティブ geo レプリケーションの Azure SQL Database：</strong> SQL Database の高コストな DR オプション。REST ベースでもない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">GRS vs RA-GRS の違い：\n• <strong>GRS</strong>：セカンダリへのレプリケートのみ。セカンダリへの直接読み取りは通常不可\n• <strong>RA-GRS</strong>：セカンダリへの読み取りアクセスも可能。コストわずかに高い\n\nコスト最小化が要件の場合は RA-GRS より GRS を選びます。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">オプション</th><th>REST対応</th><th>自動レプリケーション</th><th>コスト</th></tr></thead><tbody><tr><td class=\"cc\">Azure Storage テーブル + GRS</td><td>✅</td><td>✅</td><td>最安 ✅</td></tr><tr><td class=\"cc\">Azure Storage テーブル + RA-GRS</td><td>✅</td><td>+ 読み取り可</td><td>GRS より高</td></tr><tr><td class=\"cc\">Azure SQL DB エラスティック プール</td><td>TDS</td><td>△ 別途設定</td><td>高</td></tr><tr><td class=\"cc\">Azure SQL DB アクティブ geo レプリカ</td><td>TDS</td><td>✅</td><td>最高</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「REST + 低コスト + 自動 geo レプリカ + 複数テーブル」= <strong>Azure Storage テーブル + GRS</strong>。SQL は REST ベースでなくコストも高い。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#0072C6"},{"num":30,"id":"q30","domain":"データストレージ設計","question_text":"20 個の独立したデータベースをホストする SQL ベースのデータベース ソリューションを設計しています。各データベースのサイズは 20 GB です。データベースはそれぞれ異なる変動する使用パターンを持ちます。\n\nこれらのデータベースをホストするための適切なデータベース プラットフォームを推奨する必要があります。提案するソリューションは以下の要件を満たす必要があります：\n\n・99.99% の SLA を提供すること\n・リソースを共有することで変動する使用パターンに対応すること\n・総ストレージ コストを最小化すること\n\n推奨すべきソリューションはどれですか？","choices":[{"text":"20 個の Azure SQL Database を含むエラスティック プール","is_correct":true},{"text":"Azure 仮想マシン上の Microsoft SQL Server（1 台）に 20 個のデータベース","is_correct":false},{"text":"20 個の Azure SQL Database サーバーレス インスタンス","is_correct":false},{"text":"Azure 仮想マシン上の Microsoft SQL Server（複数台）に 20 個のデータベース","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：①20 個の独立した DB（各 20 GB）、②変動する使用パターン、③99.99% SLA、④コスト最小化。\n\n<strong>エラスティック プール</strong>は複数の DB が DTU/vCore リソースを共有します：\n• 変動するパターン → あるデータベースが低負荷のとき、別の高負荷 DB がそのリソースを使える\n• 個別にプロビジョニングするより大幅にコスト削減\n• 99.99% SLA を提供</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure VM 上の SQL Server（1 台）：</strong> 単一障害点があり、99.99% SLA が困難。OS/パッチ管理も必要 ❌\n\n<strong>20 個の Azure SQL Database サーバーレス：</strong> サーバーレスは個別インスタンスのためリソース共有なし。変動パターンには対応するが、20 個分の個別コスト ❌\n\n<strong>Azure VM 上の SQL Server（複数台）：</strong> 最もコストが高く、管理作業が多い ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「変動する使用パターン」「複数の DB でコスト共有」というキーワードが出たら<strong>エラスティック プール</strong>を選びます。\n\nサーバーレス（自動一時停止）は単一 DB の変動負荷向けで、複数 DB のリソース共有ではありません。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">オプション</th><th>リソース共有</th><th>99.99% SLA</th><th>管理作業</th><th>コスト（変動負荷）</th></tr></thead><tbody><tr><td class=\"cc\">エラスティック プール</td><td>DB 間共有</td><td>✅</td><td>最小</td><td>最安 ✅</td></tr><tr><td class=\"cc\">個別 Azure SQL Database</td><td>❌</td><td>✅</td><td>最小</td><td>高（20 倍）</td></tr><tr><td class=\"cc\">サーバーレス SQL Database</td><td>❌</td><td>✅</td><td>最小</td><td>中（個別）</td></tr><tr><td class=\"cc\">VM 上の SQL Server</td><td>❌</td><td>△</td><td>最大</td><td>高</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「複数 DB + 変動負荷 + コスト共有」= <strong>エラスティック プール</strong>。複数の DB が 1 つのリソース プールを共有する。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-pool-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-pool-overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#0072C6"},{"num":31,"id":"q31","domain":"データストレージ設計","question_text":"Microsoft SQL Server をホストし、2 つの独立したデータ ディスクを使用する仮想マシンのデプロイを計画しています。一方のディスクはトランザクション ログ ファイルの保存専用で、もう一方は データベース データ ファイル用です。両方のディスクは P40 マネージド ディスクとして構成されます。\n\nデータ ディスクに推奨すべきホスト キャッシュ オプションはどれですか？","choices":[{"text":"なし (None)","is_correct":true},{"text":"読み取り専用 (ReadOnly)","is_correct":false},{"text":"読み取り/書き込み (ReadWrite)","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか — なし（None）</div><div class=\"exp-block-body\">SQL Server on Azure VM のディスク構成には Microsoft の公式ベスト プラクティスがあります。\n\n<strong>トランザクション ログ ファイル（.ldf）</strong>の特性：\n• <strong>連続した順次書き込み</strong>が主体（ランダム読み取りはほとんどない）\n• データ損失が絶対に許されない（ACID の D = Durability）\n• ログはコミット確認前に必ずディスクに書き込まれる（WAL: Write-Ahead Logging）\n\n<strong>「なし（None）」が正解の理由：</strong>\n• ReadOnly キャッシュ → ログの連続書き込みにキャッシュの恩恵なし。無駄にキャッシュを消費\n• ReadWrite キャッシュ → <strong>データ損失リスク！</strong> VM がクラッシュした場合、キャッシュ内の未フラッシュデータが失われ、ログの整合性が壊れる可能性がある\n• None（なし）→ キャッシュを経由せず直接ディスクに書き込む。データ損失リスクゼロ ✅</div></div>\n\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>B: 読み取り専用（ReadOnly）：</strong>\nデータファイル（.mdf）に適した設定です。ログファイルは読み取りより書き込みが主体なので、ReadOnly キャッシュの恩恵を受けられません ❌\n\n<strong>C: 読み取り/書き込み（ReadWrite）：</strong>\n最も危険な設定です。VM クラッシュ時にキャッシュ内データが失われ、トランザクション ログの整合性が保証されません。SQL Server のデータ破損につながる可能性があります ❌</div></div>\n\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント（Q31 vs Q32 の対比）</div><div class=\"exp-block-body\">Q31（ログ ファイル）と Q32（データ ファイル）は答えが逆になります！\n\n<strong>SQL Server の 2 ディスク構成のベスト プラクティス：</strong>\n<code>データ ファイル（.mdf）ディスク → ReadOnly キャッシュ</code>\n  理由：ランダム読み取りが多い。よく読まれるデータ ページがキャッシュされパフォーマンス向上\n\n<code>トランザクション ログ（.ldf）ディスク → None（キャッシュなし）</code>\n  理由：連続書き込み主体。ReadWrite キャッシュはデータ損失リスクあり\n\nこの組み合わせが <strong>Microsoft の公式推奨</strong>です。</div></div>\n\n<div class=\"comp-s\"><div class=\"comp-l\">SQL Server on Azure VM ディスク キャッシュ設定</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>ディスク用途</th><th>推奨キャッシュ</th><th>理由</th><th>ReadWrite の危険性</th></tr></thead><tbody>\n<tr><td class=\"cc\">トランザクション ログ（.ldf）</td><td class=\"cc\">None ✅</td><td class=\"cc\">連続書き込み主体、整合性保護</td><td class=\"cc\">クラッシュ時データ損失リスク</td></tr>\n<tr><td>データ ファイル（.mdf）</td><td>ReadOnly ✅</td><td>読み取り頻度高、パフォーマンス向上</td><td>書き込みキャッシュ不要</td></tr>\n<tr><td>TempDB</td><td>ReadOnly または None</td><td>ワークロードによる</td><td>一時データなので影響小</td></tr>\n</tbody></table></div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">ログ ファイル ＝ <strong>None（なし）</strong>、データ ファイル ＝ <strong>ReadOnly（読み取り専用）</strong>。この組み合わせが MS 公式ベスト プラクティス。ReadWrite はどちらのディスクにも使わない！</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-machines/premium-storage-performance\" target=\"_blank\" rel=\"noopener\">Azure Premium Storage のパフォーマンス</a></li></ul></div>\n</div>","svg":"","domain_color":"#0072C6"},{"num":32,"id":"q32","domain":"データストレージ設計","question_text":"Microsoft SQL Server をホストし、2 つの独立したデータ ディスクを使用する仮想マシンのデプロイを計画しています。一方のディスクはトランザクション ログ ファイルの保存専用で、もう一方はデータベース データ ファイル用です。両方のディスクは P40 マネージド ディスクとして構成されます。\n\nデータベース データ ファイルを保存するディスクに推奨すべきホスト キャッシュ オプションはどれですか？","choices":[{"text":"なし (None)","is_correct":false},{"text":"読み取り専用 (ReadOnly)","is_correct":true},{"text":"読み取り/書き込み (ReadWrite)","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか — 読み取り専用（ReadOnly）</div><div class=\"exp-block-body\">SQL Server のデータ ファイル（.mdf）の特性：\n• <strong>ランダム読み取り</strong>が主体（インデックス スキャン、テーブル スキャンなど）\n• 同じデータ ページが繰り返し読み取られることが多い（バッファー プールのミスに当たると Disk I/O が発生）\n• 書き込みは相対的に少ない\n\n<strong>ReadOnly（読み取り専用）キャッシュが最適な理由：</strong>\n• 頻繁にアクセスされるデータ ページが Azure ホスト キャッシュに保存される\n• 次回の読み取り時にディスク I/O なしでキャッシュから取得 → <strong>レイテンシ大幅削減</strong>\n• 書き込みはキャッシュを経由せずディスクへ直接 → データ整合性リスクなし ✅</div></div>\n\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>A: なし（None）：</strong>\nトランザクション ログ（.ldf）に推奨される設定です。データ ファイルに使うと読み取りキャッシュの恩恵を受けられず、パフォーマンスが低下します ❌\n\n<strong>C: 読み取り/書き込み（ReadWrite）：</strong>\n書き込みもキャッシュされるため VM クラッシュ時にデータ損失のリスクがあります。SQL Server はデータの整合性が最重要なため、使用が禁止されています ❌</div></div>\n\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント（Q31 との対比）</div><div class=\"exp-block-body\">Q31（ログ ファイル）：<strong>None（なし）</strong> ← 書き込み主体、整合性保護\nQ32（データ ファイル）：<strong>ReadOnly（読み取り専用）</strong> ← 読み取り主体、パフォーマンス向上\n\nこの2つはセットで覚えてください。試験では「どのディスクに何のキャッシュを使うか」という設問で、Q31とQ32のように別々に問われることがあります。</div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">データ ファイル ＝ <strong>ReadOnly キャッシュ</strong>（読み取りパフォーマンス向上）。ログ ファイル ＝ None（整合性保護）。ReadWrite はSQL Server のどのディスクにも使わない。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-machines/premium-storage-performance\" target=\"_blank\" rel=\"noopener\">Azure Premium Storage のパフォーマンス</a></li></ul></div>\n</div>","svg":"","domain_color":"#0072C6"},{"num":33,"id":"q33","domain":"ID・ガバナンス・監視","question_text":"Microsoft Entra ID を使用してユーザーを認証する App1 という Azure Web アプリをデプロイする準備をしています。\n\nApp1 はインターネット経由で組織内の従業員がアクセスします。すべてのユーザーは Windows 10 を実行し、Microsoft Entra ID に参加しているデバイスを使用しています。\n\n認証に必要な Microsoft Entra コンポーネントを推奨する必要があります。\n\n推奨すべきものはどれですか？","choices":[{"text":"Microsoft Entra アプリの登録","is_correct":true},{"text":"Microsoft Entra マネージド ID","is_correct":false},{"text":"Microsoft Entra アプリケーション プロキシ","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Microsoft Entra ID で認証する Azure Web アプリを展開するには、まず<strong>アプリの登録（App Registration）</strong>が必要です。\n\nアプリの登録により：\n• Entra ID がアプリを認識し、OAuth 2.0/OpenID Connect 認証フローを処理\n• クライアント ID とシークレット（またはマニフェスト）が発行される\n• Entra 参加デバイスからの SSO（シングル サインオン）が可能</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Entra マネージド ID：</strong> Azure リソースが他の Azure サービスに対して認証するための ID（資格情報不要）。ユーザー認証用ではない ❌\n\n<strong>Entra アプリケーション プロキシ：</strong> オンプレミス アプリをインターネット経由で公開するためのサービス。Azure Web アプリには不要（既にクラウドにある）❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">3 つのサービスの違い：\n• <strong>アプリの登録</strong>：ユーザーが Web アプリにログインするための設定（アプリ → Entra ID で認証）\n• <strong>マネージド ID</strong>：アプリが他のサービス（Key Vault など）にアクセスするための ID\n• <strong>アプリケーション プロキシ</strong>：オンプレミス アプリをクラウド経由で公開</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">機能</th><th>目的</th><th>主な用途</th></tr></thead><tbody><tr><td class=\"cc\">アプリの登録</td><td>ユーザー認証の設定（アプリを Entra ID に登録）</td><td>Web アプリへのログイン ✅</td></tr><tr><td class=\"cc\">マネージド ID</td><td>アプリが他の Azure サービスにアクセス（資格情報不要）</td><td>Key Vault / Storage アクセス</td></tr><tr><td class=\"cc\">アプリケーション プロキシ</td><td>オンプレミス アプリのクラウド公開</td><td>オンプレミス app → インターネット</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「Web アプリにユーザーが Entra ID でログイン」= <strong>アプリの登録</strong>が必要。マネージド ID はサービス間認証（ユーザー認証ではない）。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory/develop/quickstart-register-app\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/active-directory/develop/quickstart-register-app</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":34,"id":"q34","domain":"ID・ガバナンス・監視","question_text":"Microsoft Entra ID を使用してユーザーを認証する App1 という Azure Web アプリをデプロイする準備をしています。\n\nApp1 はインターネット経由で組織内の従業員がアクセスします。すべてのユーザーは Windows 10 を実行し、Microsoft Entra ID に参加しているデバイスを使用しています。\n\n多要素認証 (MFA) を適用し、準拠デバイスからのアクセスのみを許可するアクセス制御を推奨する必要があります。\n\n推奨すべきものはどれですか？","choices":[{"text":"Microsoft Entra 管理単位","is_correct":false},{"text":"条件付きアクセス ポリシー","is_correct":true},{"text":"Azure Application Gateway","is_correct":false},{"text":"Azure ブループリント","is_correct":false},{"text":"Azure Policy","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「App1 へのアクセス時に<strong>特定の条件（MFA、準拠デバイスなど）</strong>を強制する」。\n\n<strong>条件付きアクセス ポリシー</strong>は：\n• アプリケーションごとにアクセス要件を定義（MFA 強制、準拠デバイス要件など）\n• Entra 参加デバイスからのアクセスに対してシームレスに適用\n• App1 を対象とした細かい制御が可能</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Entra 管理単位：</strong> ユーザー/グループを論理グループ化して管理委任するもの。アクセス条件制御ではない ❌\n\n<strong>Azure Application Gateway：</strong> L7 ロード バランサー + WAF。認証条件制御ではない ❌\n\n<strong>Azure ブループリント：</strong> リソースのデプロイ規範（ポリシー・RBAC・テンプレートのまとめ）。アプリアクセス条件ではない ❌\n\n<strong>Azure Policy：</strong> リソース構成ガバナンス（どんなリソースを作れるか）。ユーザー アクセス条件ではない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Azure Policy と条件付きアクセスを混同しがちです：\n• <strong>Azure Policy</strong>：リソース（何をデプロイできるか）を制御\n• <strong>条件付きアクセス</strong>：ユーザーのアプリアクセス（どんな条件でアクセスできるか）を制御</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「アプリへのアクセスに MFA・デバイス要件を設定」= <strong>条件付きアクセス ポリシー</strong>。Azure Policy はリソース管理、条件付きアクセスはユーザー アクセス管理。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory/conditional-access/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/active-directory/conditional-access/overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":35,"id":"q35","domain":"ID・ガバナンス・監視","question_text":"多数のサブスクリプションを含む大規模な Microsoft Azure 環境を計画しています。\n\nガバナンス戦略の一環として、環境全体の標準を強制し、リソース構成を制御するために Azure Policy を実装する予定です。\n\nAzure Policy の定義を割り当てることができる 3 つのスコープ レベルを特定する必要があります。\n\n該当する 3 つのスコープを選択してください。","choices":[{"text":"Microsoft Entra 管理単位","is_correct":false},{"text":"Microsoft Entra テナント","is_correct":false},{"text":"サブスクリプション","is_correct":true},{"text":"コンピューティング リソース","is_correct":false},{"text":"リソース グループ","is_correct":true},{"text":"管理グループ","is_correct":true}],"correct_indices":[2,4,5],"n_correct":3,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Azure Policy は以下の 3 つのスコープに割り当てることができます：\n• <strong>管理グループ</strong>：複数サブスクリプションを一括でカバーする最上位スコープ\n• <strong>サブスクリプション</strong>：特定サブスクリプション内の全リソースに適用\n• <strong>リソース グループ</strong>：特定リソース グループ内のリソースのみに適用</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Entra 管理単位：</strong> Entra ID のユーザー・グループ管理委任用。Azure リソースの Policy スコープではない ❌\n\n<strong>Entra テナント：</strong> Azure AD の最上位コンテナーだが、Policy の割り当てスコープではない（管理グループが最上位）❌\n\n<strong>コンピューティング リソース：</strong> 個別リソースへの Policy 割り当ては通常行わない（リソース グループが最小スコープ）❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「Azure Policy のスコープ」と「Azure ブループリントの定義/割り当てスコープ」を混同しないこと：\n• Policy 割り当て：管理グループ / サブスクリプション / リソース グループ ✅\n• ブループリント割り当て：サブスクリプションのみ ✅（管理グループ・RG は不可）</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>スコープ</th><th>Azure Policy 割り当て</th><th>ブループリント割り当て</th><th>RBAC 割り当て</th></tr></thead><tbody><tr><td>Entra テナント</td><td>❌</td><td>❌</td><td>❌</td></tr><tr><td>管理グループ</td><td>✅</td><td>❌（定義保存は可）</td><td>✅</td></tr><tr><td>サブスクリプション</td><td>✅</td><td>✅</td><td>✅</td></tr><tr><td>リソース グループ</td><td>✅</td><td>❌</td><td>✅</td></tr><tr><td>個別リソース</td><td>通常行わない</td><td>❌</td><td>✅</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Azure Policy の割り当てスコープ：<strong>管理グループ・サブスクリプション・リソース グループ</strong>の 3 つ。Entra 管理単位はスコープではない。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/governance/policy/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/governance/policy/overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":36,"id":"q36","domain":"データストレージ設計","question_text":"Windows Server 2012 R2 を実行する 100 台のサーバーで構成されるオンプレミス環境の移行を担当しています。各サーバーには Microsoft SQL Server 2014 インスタンスがホストされています。\n\nSQL Server インスタンスのデータベースには以下の属性があります：\n\n・ストアド プロシージャが CLR を使用して実装されている\n・サーバー レベルのエージェント ジョブを使用している\n・複数データベースにまたがるクロスデータベース クエリを使用している\n\nこれらの要件を満たしながら、最小限の管理作業でデータベースを Azure にホストするためのソリューションを推奨する必要があります。\n\n推奨すべきサービスはどれですか？","choices":[{"text":"Azure SQL Database エラスティック プール","is_correct":false},{"text":"Azure SQL Database Managed Instance（マネージド インスタンス）","is_correct":true},{"text":"Azure SQL Database シングル データベース","is_correct":false},{"text":"Azure 仮想マシン上の SQL Server 2016","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：①CLR ストアド プロシージャ、②SQL Server エージェント ジョブ、③クロスデータベース クエリ（3 部構成参照）、④最小管理作業（PaaS 推奨）。\n\n<strong>Azure SQL Managed Instance</strong>はすべての要件を満たします：\n• SQL Server との高い互換性（CLR、SQL Agent、クロスDB クエリ対応）\n• PaaS サービスのため OS/パッチ管理不要（最小管理作業）</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>エラスティック プール：</strong> 複数 Azure SQL Database の共有プール。CLR・SQL Agent・クロスDB クエリはサポートしていない ❌\n\n<strong>シングル Azure SQL Database：</strong> CLR・SQL Agent・クロスDB クエリは非対応 ❌\n\n<strong>Azure VM 上の SQL Server：</strong> すべての機能をサポートするが IaaS（OS・パッチ管理が必要）→「最小管理作業」の要件に不一致 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「CLR」「SQL Agent」「リンク サーバー」「クロスデータベース クエリ」→ これらのキーワードが出たら <strong>SQL Managed Instance</strong> を選びます。Azure SQL Database（通常版）はこれらをサポートしません。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>機能</th><th>SQL Database</th><th class=\"cc\">SQL Managed Instance</th><th>VM 上の SQL Server</th></tr></thead><tbody><tr><td>CLR ストアド プロシージャ</td><td>❌</td><td class=\"cc\">✅</td><td>✅</td></tr><tr><td>SQL Server エージェント</td><td>❌</td><td class=\"cc\">✅</td><td>✅</td></tr><tr><td>クロスデータベース クエリ</td><td>制限あり</td><td class=\"cc\">✅</td><td>✅</td></tr><tr><td>リンク サーバー</td><td>❌</td><td class=\"cc\">✅</td><td>✅</td></tr><tr><td>PaaS（管理作業最小）</td><td>✅</td><td class=\"cc\">✅</td><td>IaaS</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">CLR + SQL Agent + クロスDB クエリ + 最小管理 → <strong>SQL Managed Instance</strong>。「SQL Server と高互換の PaaS」がキャッチフレーズ。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/sql-managed-instance-paas-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/sql-managed-instance-paas-overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#0072C6"},{"num":37,"id":"q37","domain":"ビジネス継続性設計","question_text":"App1 という Web アプリケーションをオンプレミスのデータ センターから Azure に移行する計画を立てています。\n\nApp1 は、ホスト サーバーにインストール済みのカスタム COM コンポーネントに依存しています。\n\nApp1 の Azure ベースのホスティング ソリューションを推奨する必要があります。ソリューションは以下の要件を満たす必要があります：\n\n・複数の可用性ゾーンにまたがるデプロイによって App1 の高可用性を確保すること\n・自動スケールをサポートすること\n\n推奨すべきソリューションはどれですか？","choices":[{"text":"複数の可用性ゾーンにまたがるロード バランサーと仮想マシン スケール セットをデプロイする","is_correct":true},{"text":"Azure Traffic Manager プロファイルと Azure Web App をデプロイする","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">App1 はカスタム <strong>COM コンポーネント</strong>に依存しています。COM コンポーネントは Windows レジストリへの登録が必要で、<strong>仮想マシン環境でのみ動作</strong>します（App Service や Functions などの PaaS では動作不可）。\n\n高可用性 + 自動スケールを VM で実現するには：\n• <strong>VM スケール セット（VMSS）</strong>：複数のゾーンにまたがる VM グループ、自動スケール対応\n• <strong>ロード バランサー</strong>：トラフィックを複数 VM に分散</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Traffic Manager + Azure Web App：</strong> App Service はカスタム COM コンポーネントをサポートしない。Web App は PaaS であり、コンポーネントのレジストリ登録ができない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">COM コンポーネント・カスタム ミドルウェア・旧来のファイル システム依存などがある場合は、<strong>Azure VM（IaaS）でのホストが唯一の選択肢</strong>になります。PaaS（App Service/Functions）では動作しません。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>要件</th><th class=\"cc\">VM + VMSS + LB</th><th>App Service + Traffic Manager</th></tr></thead><tbody><tr><td>COM コンポーネント</td><td class=\"cc\">VM 上で動作可能</td><td>PaaS は非対応</td></tr><tr><td>自動スケール</td><td class=\"cc\">VMSS が対応</td><td>App Service プラン</td></tr><tr><td>高可用性（ゾーン冗長）</td><td class=\"cc\">ゾーン対応 VMSS</td><td>✅</td></tr><tr><td>管理作業</td><td class=\"cc\">多い（IaaS）</td><td>少ない（PaaS）</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">COM コンポーネント・カスタム ミドルウェアが必要 → PaaS は使えず <strong>VM（VMSS + LB）</strong>でホストするしかない。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#107C10"},{"num":38,"id":"q38","domain":"ID・ガバナンス・監視","question_text":"オンプレミス環境には App1 という ASP.NET アプリケーションをホストする Server1 があります。\n\nハイブリッド Azure Active Directory (Azure AD) デプロイを運用しています。\n\nユーザーがインターネットから App1 にアクセスする際に以下を確保するソリューションを推奨する必要があります：\n\n・ユーザーが Azure AD アカウントを使用して認証すること\n・サインイン中に Azure 多要素認証 (MFA) が強制されること\n\n使用可能な機能リスト（番号付き）：\n1. パブリック Azure ロード バランサー\n2. マネージド ID\n3. 内部 Azure ロード バランサー\n4. 条件付きアクセス ポリシー\n5. Azure App Service プラン\n6. Azure AD アプリケーション プロキシ\n7. Azure AD エンタープライズ アプリケーション\n\nデプロイおよび構成すべき 3 つの機能を正しい順序で答えてください。","choices":[{"text":"6 → 7 → 4（アプリケーション プロキシ → エンタープライズ アプリ → 条件付きアクセス）","is_correct":true},{"text":"1 → 7 → 4","is_correct":false},{"text":"3 → 2 → 6","is_correct":false},{"text":"5 → 4 → 7","is_correct":false},{"text":"6 → 2 → 4","is_correct":false},{"text":"7 → 1 → 5","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか — 6 → 7 → 4（アプリケーション プロキシ → エンタープライズ アプリ → 条件付きアクセス）</div><div class=\"exp-block-body\">オンプレミスの ASP.NET アプリ（App1/Server1）にインターネットから Azure AD 認証 + MFA でアクセスするには、以下の順序で設定します：\n\n<strong>ステップ 1：⑥ Azure AD アプリケーション プロキシ（コネクター設置）</strong>\nオンプレミスのサーバーに「アプリケーション プロキシ コネクター」をインストールし、App1 を Azure AD 経由でインターネットに公開します。\n\n<code>インターネット → Azure AD アプリケーション プロキシ（クラウド）\n                          ↕ コネクター経由\n                   オンプレミス Server1（App1）</code>\n\n<strong>ステップ 2：⑦ Azure AD エンタープライズ アプリケーション（SSO 設定）</strong>\nアプリケーション プロキシ設定時に自動作成される「エンタープライズ アプリケーション」に対して SSO（ヘッダーベース、統合 Windows 認証など）を設定します。これにより Azure AD アカウントで App1 にサインインできるようになります。\n\n<strong>ステップ 3：④ 条件付きアクセス ポリシー（MFA 強制）</strong>\nエンタープライズ アプリケーションを対象に条件付きアクセス ポリシーを作成し、「MFA が必要」を設定します。これでサインイン時に MFA が強制されます。</div></div>\n\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>「1 → 7 → 4」：</strong> ①はパブリック Azure ロード バランサーです。オンプレミス アプリの公開にはアプリケーション プロキシが必要であり、ロード バランサーでは Azure AD 認証と連携できません ❌\n\n<strong>「3 → 2 → 6」：</strong> ③内部 LB → ②マネージド ID → ⑥アプリケーション プロキシ。内部LBはオンプレミス アプリの公開には使えず、マネージド IDはユーザー認証ではなくリソース間認証用 ❌\n\n<strong>他の選択肢：</strong> ⑤ App Service プラン はオンプレミスアプリには不要。順序の不正解以前に、そもそも使用するサービスが間違っています ❌</div></div>\n\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「オンプレミス アプリ」と「Azure Web アプリ（App Service）」で設定手順が異なります：\n\n<strong>オンプレミス アプリ（今回のケース）：</strong>\nアプリケーション プロキシ → エンタープライズ アプリ → 条件付きアクセス\n\n<strong>Azure Web アプリ（App Service）のケース：</strong>\nアプリの登録 → 条件付きアクセス（App Service 側の認証設定も必要）\n\n「アプリケーション プロキシ」はオンプレミス アプリを Azure AD 経由でインターネットに公開する専用サービスです。Azure 上のアプリには不要です。</div></div>\n\n<div class=\"comp-s\"><div class=\"comp-l\">オンプレミス アプリの Azure AD 認証設定フロー</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>ステップ</th><th>サービス/機能</th><th>設定内容</th><th>目的</th></tr></thead><tbody>\n<tr><td class=\"cc\">Step 1</td><td class=\"cc\">⑥ アプリケーション プロキシ（コネクター）</td><td class=\"cc\">オンプレミスに軽量エージェントをインストール</td><td class=\"cc\">インターネット経由の安全な公開</td></tr>\n<tr><td>Step 2</td><td>⑦ エンタープライズ アプリケーション</td><td>SSO メソッド・ユーザー割り当てを設定</td><td>Azure AD でアプリを認識・管理</td></tr>\n<tr><td>Step 3</td><td>④ 条件付きアクセス ポリシー</td><td>MFA 必要・準拠デバイスを設定</td><td>セキュリティ条件の強制</td></tr>\n</tbody></table></div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">オンプレミス アプリへの Azure AD 認証 ＝ <strong>アプリケーション プロキシ → エンタープライズ アプリ → 条件付きアクセス</strong>の順で設定。「アプリケーション プロキシ」はオンプレミス アプリ専用。Azure アプリには「アプリの登録」を使う。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory/app-proxy/application-proxy\" target=\"_blank\" rel=\"noopener\">Azure AD アプリケーション プロキシ</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":39,"id":"q39","domain":"インフラストラクチャ設計","question_text":"サードパーティのジョブ スケジューラーを使用して動作する高性能コンピューティング (HPC) クラスターを Azure にプロビジョニングする計画を立てています。\n\nHPC クラスターをプロビジョニングおよび管理するための Azure ベースのソリューションを推奨する必要があります。\n\n推奨に含めるべきサービスはどれですか？","choices":[{"text":"Azure Purview","is_correct":false},{"text":"Azure CycleCloud","is_correct":true},{"text":"Azure Lighthouse","is_correct":false},{"text":"Azure Automation","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：サードパーティのジョブ スケジューラー（SLURM、PBS、LSF など）を使用する HPC クラスターを Azure で管理する。\n\n<strong>Azure CycleCloud</strong>：\n• HPC クラスターの作成・管理・最適化専用ツール\n• SLURM、PBS Pro、Grid Engine、LSF などのサードパーティ スケジューラーとネイティブ統合\n• ジョブ負荷に応じた自動スケール（クラスター オートスケール）</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure Purview（現 Microsoft Purview）：</strong> データ ガバナンス・データ カタログ サービス。HPC とは無関係 ❌\n\n<strong>Azure Lighthouse：</strong> マルチテナント リソース管理（MSP 向け）。HPC 管理ではない ❌\n\n<strong>Azure Automation：</strong> IT プロセスの自動化。HPC ジョブ スケジューリングの専門機能はない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">HPC 関連のサービスは：\n• <strong>Azure CycleCloud</strong>：サードパーティ スケジューラー対応の HPC クラスター管理\n• <strong>Azure HPC Cache</strong>：HPC ワークロード向けの高速ファイル キャッシュ\n• <strong>Azure Batch</strong>：マネージドな並列バッチ処理（スケジューラーの自動管理を含む）\n\n「サードパーティのスケジューラー」= CycleCloud、「スケジューラーが不要でシンプルに使いたい」= Azure Batch。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>HPC 向け</th><th>サードパーティ スケジューラー</th><th>自動スケール</th></tr></thead><tbody><tr><td class=\"cc\">Azure CycleCloud</td><td>専用</td><td>SLURM/PBS/LSF 等</td><td>✅</td></tr><tr><td class=\"cc\">Azure Batch</td><td>汎用並列処理</td><td>独自スケジューラー</td><td>✅</td></tr><tr><td class=\"cc\">Azure Purview</td><td>❌</td><td>❌</td><td>❌</td></tr><tr><td class=\"cc\">Azure Automation</td><td>△ 汎用</td><td>❌</td><td>△</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">HPC + サードパーティ ジョブ スケジューラー = <strong>Azure CycleCloud</strong>。Azure Batch はスケジューラーが不要な場合に使う。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/cyclecloud/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/cyclecloud/overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#C50F1F"},{"num":40,"id":"q40","domain":"データストレージ設計","question_text":"Oracle データベースを使用する App1 というオンプレミス アプリケーションがあります。Azure Databricks を使用して、App1 から Azure Synapse Analytics インスタンスにデータを移動するデータ変換および読み込み操作を実行する計画があります。\n\nこのプロセス中に App1 のデータが Azure Databricks からアクセスできることを確保する必要があります。\n\nこの要件を満たすソリューションに含めるべき 2 つの Azure サービスはどれですか？","choices":[{"text":"Azure Data Box Edge","is_correct":false},{"text":"Azure Data Box Gateway","is_correct":false},{"text":"Azure Import/Export サービス","is_correct":false},{"text":"Azure Data Factory","is_correct":true},{"text":"Azure Data Lake Storage","is_correct":true}],"correct_indices":[3,4],"n_correct":2,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Oracle → Azure Synapse Analytics へのデータ パイプライン（Databricks を使用）：\n\n<strong>Azure Data Factory（正解 1）</strong>：Oracle から Azure Data Lake Storage へのデータ コピー パイプライン。セルフホステッド統合ランタイム（SHIR）で Oracle に接続。継続的・スケジュール転送対応。\n\n<strong>Azure Data Lake Storage（正解 2）</strong>：ADF でコピーした Oracle データの中間ステージング ストレージとして機能。Databricks から ADLS のデータを読み取り、Synapse Analytics に転送する。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Data Box Edge / Data Box Gateway：</strong> オンプレミスからのオフライン大量データ転送向け。継続的パイプラインには不向き ❌\n\n<strong>Azure Import/Export：</strong> 物理ディスク送付による転送。リアルタイム/継続転送には不向き ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">「Oracle → Azure」のアーキテクチャは：<strong>Oracle → ADF + SHIR → ADLS（中間）→ Databricks（処理）→ Synapse（分析）</strong>という流れです。\n\nADLS を「ステージング（中間バッファ）」として使うパターンは Azure のデータ アーキテクチャで非常によく登場します。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Oracle → Synapse のパイプライン：<strong>ADF + SHIR</strong>（転送）＋ <strong>ADLS</strong>（中間ストレージ）＋ Databricks（変換）のアーキテクチャが標準。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/data-factory/connector-oracle\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/data-factory/connector-oracle</a></li></ul></div>\n</div>","svg":"","domain_color":"#0072C6"},{"num":41,"id":"q41","domain":"インフラストラクチャ設計","question_text":"組織はオンプレミスの VMware 環境で 300 台の仮想マシンを運用しています。仮想マシンはサイズも使用率もさまざまです。\n\nすべての既存仮想マシンを Azure に移行する計画があります。\n\n必要な Azure 仮想マシンの数と適切なサイズを決定する必要があります。これを達成するために使用すべきサービスはどれですか？","choices":[{"text":"Azure Migrate","is_correct":true},{"text":"Azure 料金計算ツール","is_correct":false},{"text":"Azure Cost Management","is_correct":false},{"text":"Azure Advisor","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：300 台の VMware VM を Azure に移行するにあたり、<strong>必要な Azure VM の数と適切なサイズ</strong>を決める。\n\n<strong>Azure Migrate</strong>：\n• VMware/Hyper-V/物理サーバーを検出・評価する専用ツール\n• パフォーマンス データに基づく <strong>右サイジング（Azure VM サイズ推奨）</strong>\n• 依存関係の分析\n• 移行コストの見積もり</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure 料金計算ツール：</strong> 手動で VM サイズを入力してコストを試算するツール。自動的なサイズ推奨機能はない ❌\n\n<strong>Azure Cost Management：</strong> 既存 Azure リソースのコスト分析・最適化。移行前の評価には使えない ❌\n\n<strong>Azure Advisor：</strong> 既存 Azure リソースへの最適化推奨（コスト削減・セキュリティなど）。オンプレミス評価機能はない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Azure Migrate と Azure Site Recovery（ASR）を混同しないこと：\n• <strong>Azure Migrate</strong>：評価（アセスメント）+ 移行実行\n• <strong>Azure Site Recovery</strong>：DR（継続的なレプリケーション）+ 移行のどちらにも使えるが、評価・サイジング機能はない</div></div>\n<div class=\"comp-s\"><div class=\ には、<b>「Azure Windows VM サインイン」</b>をターゲットにした条件付きアクセスポリシーを設定します。<br>Azure Bastion + Entra ID 認証と組み合わせることで、VM ログイン時に MFA が強制されます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ 他の選択肢が不正解の理由</div><div class=\"exp-block-body\"><b>A: Azure Identity Governance アクセスパッケージ</b> — アクセス権限のライフサイクル管理用。MFA 強制には使わない。<br><b>C: クラウドアプリ「Microsoft Azure Management」</b> — Azure Portal・ARM API へのアクセスに MFA を強制するポリシー。VM サインインには直接対応しない。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">「Azure Management」は<b>Azure Portal のサインイン</b>に MFA を強制する設定。<br>「Azure Windows VM サインイン」は<b>VM へのログイン自体</b>に MFA を強制する設定。この違いは頻出。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">📌 重要知識</div><div class=\"exp-block-body\"><b>条件付きアクセスのクラウドアプリ選択の違い</b><br>・<b>Microsoft Azure Management</b>: ARM/Portal へのアクセス制御<br>・<b>Azure Windows VM サインイン</b>: VM への RDP/SSH/Bastion 経由ログインの制御<br>・<b>Microsoft Graph</b>: M365 データへのアクセス制御</div></div></div>","svg":"","domain_color":"#C50F1F"},{"num":44,"id":"q44","domain":"インフラストラクチャ設計","question_text":"以下の要件を満たすロード バランシング サービスを推奨する必要があります：\n\n・Azure リージョンが利用不可になっても、アプリケーションの可用性が維持されること\n・Azure Web Application Firewall (WAF) 機能をサポートすること\n・クッキーベースのセッション アフィニティをサポートすること\n・HTTP から HTTPS へのリダイレクトをサポートすること\n\n推奨すべきサービスはどれですか？","choices":[{"text":"Azure Application Gateway","is_correct":false},{"text":"Azure Load Balancer","is_correct":false},{"text":"Azure Front Door","is_correct":true},{"text":"Azure Traffic Manager","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">Azure Front Door グローバル負荷分散（Q44）</div><svg viewBox=\"0 0 480 195\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:480px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"480\" height=\"195\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX= "><b>A: Application Gateway</b> — L7 LB で WAF・セッションアフィニティ・HTTPS リダイレクト対応。しかし<b>単一リージョン</b>のみ。リージョン障害の可用性維持不可。<br><b>B: Azure Load Balancer</b> — L4。WAF なし。セッションアフィニティはハッシュベースのみ。クロスリージョン LB も存在するが WAF なし。<br><b>D: Traffic Manager</b> — DNS ベースのグローバルルーティング。WAF なし。セッションアフィニティなし。HTTPS リダイレクト不可。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">4 要件すべてを満たすのは Front Door のみ。Application Gateway は「単一リージョン」という制約で除外される。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">📌 重要知識</div><div class=\"exp-block-body\"><table class=\"comp-s\"><thead><tr><th>機能</th><th>Front Door</th><th>App Gateway</th><th>Traffic Manager</th><th>Load Balancer</th></tr></thead><tbody><tr><td>クロスリージョンFO</td><td>✅</td><td>❌</td><td>✅</td><td>✅(CRLB)</td></tr><tr><td>WAF</td><td>✅</td><td>✅</td><td>❌</td><td>❌</td></tr><tr><td>セッションアフィニティ</td><td>✅</td><td>✅</td><td>❌</td><td>△Hash</td></tr><tr><td>HTTPS リダイレクト</td><td>✅</td><td>✅</td><td>❌</td><td>❌</td></tr></tbody></table></div></div></div>","svg":"","domain_color":"#C50F1F"},{"num":45,"id":"q45","domain":"データストレージ設計","question_text":"オンプレミス環境には、めったにアクセスされない 5 TB の組織ファイルを保存する Server1 というファイル サーバーがあります。\n\nこれらのファイルを Azure Storage にコピーする計画があります。\n\n以下の要件を満たすストレージ ソリューションを実装する必要があります：\n\n・ファイルはリクエストから 24 時間以内に取得可能であること\n・ストレージ コストを最小化すること\n\nこの要件を満たす 2 つのストレージ ソリューションを選択してください。","choices":[{"text":"クール デフォルト アクセス層に設定された Azure Blob ストレージ アカウントを作成する。BLOB コンテナーを作成してファイルをコピーし、各ファイルをアーカイブ アクセス層に設定する","is_correct":true},{"text":"汎用 v1 ストレージ アカウントを作成する。BLOB コンテナーを作成してファイルをコピーする","is_correct":false},{"text":"汎用 v1 ストレージ アカウントを作成する。ファイル共有を作成してファイルをコピーする","is_correct":false},{"text":"ホット デフォルト アクセス層に設定された汎用 v2 ストレージ アカウントを作成する。BLOB コンテナーを作成してファイルをコピーし、各ファイルをアーカイブ アクセス層に設定する","is_correct":true},{"text":"クール デフォルト アクセス層に設定された汎用 v2 ストレージ アカウントを作成する。ファイル共有を作成してファイルをコピーする","is_correct":false}],"correct_indices":[0,3],"n_correct":2,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：①5 TB のファイル（めったにアクセスされない）、②Azure Storage にコピー、③24 時間以内に取得可能、④コスト最小化。\n\n<strong>アーカイブ層の Blob コンテナー</strong>が要件を満たします。アーカイブ層は最低コストで、リハイドレーション（標準優先度）は最大 15 時間 → 24 時間以内の要件をクリア。\n\n正解 2 選：\n• <strong>選択肢 1</strong>：クール デフォルト アカウント + アーカイブ設定の BLOB コンテナー ✅\n• <strong>選択肢 4</strong>：ホット デフォルト アカウント + アーカイブ設定の BLOB コンテナー ✅\n\nどちらもアーカイブ層の BLOB コンテナーを使用するため、実際のデータはアーカイブ層に格納されます。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>汎用 v1 アカウント：</strong> 最新機能（ライフサイクル管理など）に制限あり。汎用 v2 より古い世代 ❌\n\n<strong>ファイル共有（Files）：</strong> ファイル共有には Cool/Archive 層がない。大量の低頻度ファイルには Blob が適切 ❌\n\n<strong>クール + ファイル共有：</strong> Files にアクセス層（Hot/Cool/Archive）の概念はない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">ストレージ アカウントの<strong>デフォルト アクセス層</strong>（Hot/Cool）と、<strong>個別 BLOB のアクセス層</strong>（Hot/Cool/Archive）は別の設定です。\n\nアカウントのデフォルトを Hot にしても、BLOB コンテナーレベルまたは個別 BLOB をアーカイブ層に設定できます。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>アクセス層</th><th>ストレージ コスト</th><th>アクセス コスト</th><th class=\"cc\">取得時間</th><th>低頻度 5 TB 向け</th></tr></thead><tbody><tr><td>Hot（ホット）</td><td>高</td><td>低</td><td class=\"cc\">即時</td><td>コスト高</td></tr><tr><td>Cool（クール）</td><td>中</td><td>中</td><td class=\"cc\">即時</td><td>△</td></tr><tr><td>Cold（コールド）</td><td>低</td><td>中</td><td class=\"cc\">即時</td><td>△</td></tr><tr><td>Archive（アーカイブ）</td><td>最安</td><td>高</td><td class=\"cc\">最大 15 時間</td><td>24 時間以内 OK</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「めったにアクセスしない + 24 時間以内に取得可 + コスト最小」= <strong>アーカイブ層</strong>。リハイドレーション時間（最大 15 時間）が 24 時間要件をクリアする。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#0072C6"},{"num":46,"id":"q46","domain":"インフラストラクチャ設計","question_text":"組織には 20 個の内部開発 Web API があります。\n\nまた、これらの API を使用する 10 個の Web アプリケーションを構築中です。Web アプリケーションと API の両方が会社の Microsoft Entra テナントに登録されており、API は Azure API Management を通じて公開されています。\n\nWeb アプリから Web API への未承認のリクエストをブロックするソリューションを推奨する必要があります。\n\nソリューションは以下の条件を満たす必要があります：\n\n・Microsoft Entra が生成したクレームを使用すること\n・構成と継続的な管理作業を最小限に抑えること\n\n次の文を完成させてください：\n\n「______________________________ を使用して、Web アプリが Web API にアクセスできるようにアクセス許可を付与する。」","choices":[{"text":"Microsoft Entra ID","is_correct":true},{"text":"Azure API Management","is_correct":false},{"text":"Web API","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">API Management + Entra ID（Q46-47）</div><svg viewBox=\"0 0 570 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:570px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"570\" height=\"200\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/></marker>\n  <marker id=\"arr2\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/></marker>\n</defs>\n<rect x=\"15\" y=\"75\" width=\"90\" height=\"60\" rx=\"7\" fill=\"#112240\" stroke=\"#7a9cbf\" stroke-width=\"1.5\"/>\n<rect x=\"21\" y=\"80\" width=\"78\" height=\"24\" rx=\"4\" fill=\"#7a9cbf\" fill-opacity=\"0.18\"/>\n<text x=\"60\" y=\"96\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#7a9cbf\" font-family=\ exp-block exp-wrong\"><div class=\"exp-block-label\">❌ 他の選択肢が不正解の理由</div><div class=\"exp-block-body\"><b>B: Azure API Management</b> — API Management はゲートウェイとして機能するが、<b>認証の主体</b>ではない。認証は Entra ID が担う。Q47 で問われる部分。<br><b>C: Web API</b> — API 自体は認証を提供するサービスではなく、トークンを検証する側。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">「未承認リクエストを防ぐ」= 認証・認可 → <b>Entra ID</b> が答え。<br>「API を一元管理する」= ゲートウェイ → <b>APIM</b> が答え（Q47）。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">📌 重要知識</div><div class=\"exp-block-body\"><b>OAuth 2.0 フロー（クライアント認証）</b><br>1. Web アプリ → Entra ID: トークン要求<br>2. Entra ID → Web アプリ: アクセストークン発行<br>3. Web アプリ → APIM → API: Bearer Token 付きリクエスト<br>4. API / APIM でトークン検証 → 承認</div></div></div>","svg":"","domain_color":"#C50F1F"},{"num":47,"id":"q47","domain":"インフラストラクチャ設計","question_text":"組織には 20 個の内部開発 Web API があります。\n\nまた、これらの API を使用する 10 個の Web アプリケーションを構築中です。Web アプリケーションと API の両方が会社の Microsoft Entra テナントに登録されており、API は Azure API Management を通じて公開されています。\n\nWeb アプリから Web API への未承認のリクエストをブロックするソリューションを推奨する必要があります。\n\nソリューションは以下の条件を満たす必要があります：\n\n・Microsoft Entra が生成したクレームを使用すること\n・構成と継続的な管理作業を最小限に抑えること\n\n次の文を完成させてください：\n\n「______________________________ を使用して、JSON Web Token (JWT) 検証ポリシーを構成する。」","choices":[{"text":"Microsoft Entra ID","is_correct":false},{"text":"Azure API Management","is_correct":true},{"text":"Web API","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">API Management + Entra ID（Q46-47）</div><svg viewBox=\"0 0 570 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:570px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"570\" height=\"200\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/></marker>\n  <m トークン検証 → APIM でポリシー適用 → Backend へ転送</text>\n\n</svg></div><div class=\"exp-sections\"><div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解か</div><div class=\"exp-block-body\"><b>B: Azure API Management</b><br>要件：「10 個の Web アプリから 20 個の API を使用する構成を管理する」= <b>一元的な API ゲートウェイ</b><br>Azure API Management は：<br>・複数 API を一元的に公開・バージョン管理<br>・レート制限・クォータ制御<br>・Entra ID トークン検証のインライン実施（validate-jwt ポリシー）<br>・API ドキュメントの自動生成（Developer Portal）<br>10 App × 20 API の複雑な管理を APIM 1 つで集約できます。</div></div><div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ 他の選択肢が不正解の理由</div><div class=\"exp-block-body\"><b>A: Entra ID</b> — 認証を提供するが「API の一元管理・ルーティング」は行わない（Q46 の担当）。<br><b>C: Web API</b> — 管理されるリソース側。管理プレーンではない。</div></div><div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">Q46（認証 = Entra ID）と Q47（API ゲートウェイ = APIM）は役割が明確に分かれている。両者を組み合わせるのが正しいアーキテクチャ。</div></div><div class=\"exp-block exp-key\"><div class=\"exp-block-label\">📌 重要知識</div><div class=\"exp-block-body\"><b>APIM のポリシー例</b><br>・<code>validate-jwt</code>: Entra ID トークンを APIM ゲートウェイで検証<br>・<code>rate-limit-by-key</code>: クライアントごとのレート制限<br>・<code>cache-lookup/store</code>: レスポンスキャッシュ<br>・<code>rewrite-uri</code>: バックエンド URL 変換</div></div></div>","svg":"","domain_color":"#C50F1F"},{"num":48,"id":"q48","domain":"ID・ガバナンス・監視","question_text":"組織のインフラストラクチャは以下の通りです：\n\nAzure：\n・Subscription1 という Azure サブスクリプション\n・20 個の Azure Web アプリ\n\nオンプレミス データ センター：\n・Active Directory ドメイン\n・Microsoft Entra Connect を実行するサーバー\n・Server1 という Linux コンピューター\n\nオンプレミスの Active Directory ドメインは Subscription1 にある Azure AD テナントと同期しています。\n\nServer1 は Linux であるため、Active Directory ドメインに参加できません。\n\nServer1 が Subscription1 のリソース（Azure Web アプリなど）にアクセスするために Azure AD 認証を使用できるように、Active Directory ベースの認証が Server1 に対して有効になっていることを確認する必要があります。\n\n推奨すべきソリューションはどれですか？","choices":[{"text":"仮想マシン上の Active Directory Domain Services ロール","is_correct":false},{"text":"Microsoft Entra Domain Services","is_correct":true},{"text":"Microsoft Entra アプリケーション プロキシ","is_correct":false},{"text":"Azure VPN ゲートウェイ","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：Linux サーバー（Server1）が AD ドメインに参加できず、オンプレミス AD と Azure AD が同期されている。Linux を AD ドメインに参加させたい。\n\n<strong>Microsoft Entra Domain Services（旧 Azure AD Domain Services）</strong>：\n• クラウドマネージドの AD ドメイン サービス\n• LDAP、Kerberos、NTLM 認証をサポート\n• Linux サーバーのドメイン参加に対応\n• オンプレミス AD のユーザーが同期されるため、既存アカウントで認証可能</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>VM 上の AD DS：</strong> 機能的には対応するが、IaaS（VM 管理）が必要 → 要件にある最小管理作業に反する ❌\n\n<strong>Entra アプリケーション プロキシ：</strong> オンプレミス Web アプリの公開サービス。ドメイン参加とは無関係 ❌\n\n<strong>Azure VPN ゲートウェイ：</strong> オンプレミスと Azure VNet の接続。ドメイン参加の直接的な機能はない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Entra Domain Services と VM 上の AD DS の違い：\n• <strong>Entra Domain Services</strong>：マネージド PaaS。VM 管理不要。オンプレミス AD との完全な双方向信頼は不可（一方向同期のみ）\n• <strong>VM 上の AD DS</strong>：完全な AD 機能。双方向信頼可能。ただし VM 管理が必要（IaaS）\n\nLinux のドメイン参加 + 最小管理 → Entra Domain Services を優先。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>Linux ドメイン参加</th><th>管理作業</th><th>オンプレ AD との同期</th></tr></thead><tbody><tr><td class=\"cc\">Entra Domain Services</td><td>✅</td><td>最小（PaaS）✅</td><td>一方向同期</td></tr><tr><td class=\"cc\">VM 上の AD DS（IaaS）</td><td>✅</td><td>高い（VM 管理）</td><td>双方向信頼可</td></tr><tr><td class=\"cc\">Entra ID（クラウドのみ）</td><td>従来 AD 不可</td><td>最小</td><td>✅（Connect 経由）</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Linux サーバーを AD ドメインに参加させたい + 最小管理 → <strong>Entra Domain Services</strong>（PaaS、VM 管理不要）。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory-domain-services/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/active-directory-domain-services/overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":49,"id":"q49","domain":"ID・ガバナンス・監視","question_text":"Azure Key Vault を使用してデータ暗号化キーを保存する複数の Azure App Service Web アプリがあります。\n\nさまざまな部門からこれらの Web アプリのサポートに関する具体的なリクエストが届いています。\n\n各部門のリクエストに最も適切な Azure サービスを推奨する必要があります。\n\nセキュリティ部門のリクエスト：\n「最高権限管理者を含むすべての管理者が、Azure Key Vault 暗号化キーにアクセスする際に承認を得る必要があるようにしてほしい。」\n\nセキュリティ部門のリクエストに対して推奨すべきサービスはどれですか？","choices":[{"text":"Microsoft Entra Privileged Identity Management (PIM)","is_correct":true},{"text":"Microsoft Entra Connect","is_correct":false},{"text":"Microsoft Entra Identity Protection","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：「Key Vault への管理者アクセスについて、最高権限の管理者でも必ず承認ワークフローを経ること」。\n\n<strong>Microsoft Entra PIM（Privileged Identity Management）</strong>：\n• Azure リソースへの特権アクセスの Just-in-Time（JIT）管理\n• アクセス要求 → 承認ワークフロー → 時間制限付き付与\n• 管理者も例外なく承認プロセスを経る必要がある\n• すべてのアクセス履歴が監査ログに記録される</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Entra Connect：</strong> オンプレミス AD と Entra ID の同期ツール。Key Vault の特権管理とは無関係 ❌\n\n<strong>Entra Identity Protection：</strong> 不審なサインインの検出・リスク ポリシー。特権アクセス承認ではない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">PIM と アクセス レビューの違い：\n• <strong>PIM</strong>：特権ロールへの JIT アクセス（使う前に要求→承認→時間制限付きで付与）\n• <strong>アクセス レビュー</strong>：定期的に「このアクセス権はまだ必要か？」を確認して不要なら削除\n\n「使う前に承認が必要」= PIM、「定期確認して削除」= アクセス レビュー。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>Just-in-Time アクセス</th><th>承認ワークフロー</th><th>定期レビュー</th></tr></thead><tbody><tr><td class=\"cc\">PIM</td><td>✅</td><td>✅</td><td>✅（アクセス レビュー統合）</td></tr><tr><td class=\"cc\">アクセス レビュー</td><td>❌</td><td>❌（使用後レビュー）</td><td>✅</td></tr><tr><td class=\"cc\">条件付きアクセス</td><td>❌</td><td>❌</td><td>❌</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「特権アクセスに承認ワークフロー必須・例外なし」= <strong>Microsoft Entra PIM</strong>。JIT アクセスが核心機能。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory/privileged-identity-management/pim-configure\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/active-directory/privileged-identity-management/pim-configure</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":50,"id":"q50","domain":"ID・ガバナンス・監視","question_text":"Azure Key Vault を使用してデータ暗号化キーを保存する複数の Azure App Service Web アプリがあります。\n\nさまざまな部門からこれらの Web アプリのサポートに関する具体的なリクエストが届いています。\n\n開発部門のリクエスト：\n「Web アプリが Azure Key Vault からキーを自動的に取得できるようにしてほしい。その際、Azure への認証に使用する資格情報を管理する負荷を開発チームから排除してほしい。」\n\n開発部門のリクエストに対して推奨すべきサービスはどれですか？","choices":[{"text":"Azure マネージド ID","is_correct":true},{"text":"Microsoft Entra Connect","is_correct":false},{"text":"Microsoft Entra Identity Protection","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Web アプリが Azure Key Vault のシークレット・キーにアクセスする際、<strong>認証情報をコードに書かない</strong>最もセキュアな方法は <strong>Azure マネージド ID</strong> です。\n\n• Web アプリのマネージド ID に Key Vault のアクセス ポリシーを付与\n• Web アプリが自動的に Entra ID のトークンを取得して Key Vault に認証\n• シークレットやパスワードをコードに書く必要がなく、管理作業もゼロ</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Entra Connect：</strong> AD 同期ツール。Key Vault アクセスとは無関係 ❌\n\n<strong>Entra Identity Protection：</strong> リスクベースのアクセス制御。Key Vault の認証方法ではない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">マネージド ID の 2 種類を区別しましょう：\n• <strong>システム割り当て</strong>：リソース（Web アプリ）に紐づく。リソース削除で自動削除。1 リソース : 1 ID\n• <strong>ユーザー割り当て</strong>：独立した ID リソース。複数のリソースから共有可能\n\nどちらも資格情報管理は不要で、Key Vault アクセスに使えます。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「コードに認証情報を書かずに Key Vault にアクセス」= <strong>マネージド ID</strong>。Azure が自動管理するため、資格情報の更新・管理が一切不要。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory/managed-identities-azure-resources/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/active-directory/managed-identities-azure-resources/overview</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":51,"id":"q51","domain":"ID・ガバナンス・監視","question_text":"Azure Key Vault を使用してデータ暗号化キーを保存する複数の Azure App Service Web アプリがあります。\n\nさまざまな部門からこれらの Web アプリのサポートに関する具体的なリクエストが届いています。\n\n品質保証 (QA) 部門のリクエスト：\n「ユーザーが Active Directory フェデレーション サービス (AD FS) を使用してサインインしたり、Azure AD とオンプレミス AD FS を同期したりできるようにしてほしい。」\n\nQA 部門のリクエストに対して推奨すべきサービスはどれですか？","choices":[{"text":"Microsoft Entra Privileged Identity Management (PIM)","is_correct":false},{"text":"Azure マネージド ID","is_correct":false},{"text":"Microsoft Entra Connect","is_correct":true},{"text":"Microsoft Entra Identity Protection","is_correct":false}],"correct_indices":[2],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか — Microsoft Entra Connect</div><div class=\"exp-block-body\">QA 部門の要件：「ユーザーが <strong>AD FS を使用してサインイン</strong>したり、<strong>Azure AD とオンプレミス AD FS を同期</strong>したりできるようにしてほしい」\n\n<strong>Microsoft Entra Connect（旧 Azure AD Connect）</strong> がこれを実現します：\n\n<code>オンプレミス AD</code> ←→ <strong>Entra Connect</strong> ←→ <code>Entra ID（Azure AD）</code>\n                              ↕\n                    <code>AD FS（フェデレーション）</code>\n\nEntra Connect は3つのサインイン方法をサポート：\n1. <strong>パスワード ハッシュ同期（PHS）</strong>：パスワードのハッシュを Entra ID に同期\n2. <strong>パススルー認証（PTA）</strong>：認証リクエストをオンプレミス AD に委譲\n3. <strong>フェデレーション（AD FS 連携）</strong>：AD FS を介した SSO ← QA 部門の要件に合致</div></div>\n\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>A: Microsoft Entra PIM：</strong>\n特権 ID 管理（JIT アクセス）のサービスです。AD FS との連携や AD 同期とは全く別の機能です ❌\n\n<strong>B: Azure マネージド ID：</strong>\nAzure リソース（App Service など）が他の Azure サービスに認証するための ID です。ユーザーのサインイン方法や AD 同期とは無関係です ❌\n\n<strong>D: Microsoft Entra Identity Protection：</strong>\n不審なサインインや漏洩した資格情報を検出するリスクベースの保護サービスです。AD 同期ではありません ❌</div></div>\n\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント（Q49〜Q51 の連問）</div><div class=\"exp-block-body\">Q49〜Q51 は同じシナリオで3部門それぞれの要件に最適なサービスを問う問題です：\n\n• Q49（セキュリティ部門）：「最高権限管理者でも承認が必要」 → <strong>Entra PIM</strong>（JIT アクセス管理）\n• Q50（開発部門）：「資格情報を管理せずにキーを取得」 → <strong>マネージド ID</strong>（コード内に認証情報不要）\n• Q51（QA 部門）：「AD FS 連携・AD 同期」 → <strong>Entra Connect</strong>（オンプレミス AD との同期）\n\n各選択肢が「どの部門の要件に対応するか」を正確に把握することが重要です。</div></div>\n\n<div class=\"comp-s\"><div class=\"comp-l\">Entra ID 関連サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>サービス</th><th>目的</th><th>主な用途</th></tr></thead><tbody>\n<tr><td class=\"cc\">Entra Connect</td><td>オンプレミス AD と Entra ID の同期・フェデレーション</td><td>ハイブリッド ID 基盤 Q51</td></tr>\n<tr><td>Entra PIM</td><td>特権ロールの JIT アクセス管理</td><td>管理者権限の一時付与 Q49</td></tr>\n<tr><td>マネージド ID</td><td>Azure リソースの認証（資格情報不要）</td><td>Key Vault・Storage へのアクセス Q50</td></tr>\n<tr><td>Identity Protection</td><td>リスクベースのアクセス条件制御</td><td>異常サインイン検出・ブロック</td></tr>\n</tbody></table></div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">オンプレミス AD と Entra ID の同期 ＝ <strong>Microsoft Entra Connect</strong>。AD FS によるフェデレーション認証も Entra Connect で設定する。「Azure AD Connect」という旧名称でも同じサービスを指す。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory/hybrid/whatis-azure-ad-connect\" target=\"_blank\" rel=\"noopener\">Microsoft Entra Connect とは</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":52,"id":"q52","domain":"ID・ガバナンス・監視","question_text":"以下の動作を提供する Azure Policy を設計する必要があります：\n\n・新しく作成されたリソースに対して、そのリソースがデプロイされたリソース グループのタグとタグ値を自動的に適用すること\n・既存のリソースに対して、タグとタグ値がリソース グループのものと一致しているか評価すること\n・非準拠のリソースに対して、不足しているタグと値を追加するための修復タスクを自動的に開始すること\n\n推奨すべき Azure Policy 効果 (effect) はどれですか？","choices":[{"text":"Append","is_correct":false},{"text":"EnforceOPAConstraint","is_correct":false},{"text":"EnforceRegoPolicy","is_correct":false},{"text":"Modify","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">要件：①新規リソース作成時に自動的にリソース グループのタグを継承、②既存リソースへの修復（自動タグ追加）。\n\n<strong>Azure Policy の Modify 効果</strong>：\n• 新規リソースのプロパティ（タグなど）を自動変更・追加\n• 修復タスクにより既存リソースにも適用可能\n• リソース グループのタグ値を取得して継承するポリシーがサポートされている</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Append：</strong> 新規リソースへの追加フィールド設定のみ。既存リソースへの修復タスクはサポートしない ❌\n\n<strong>EnforceOPAConstraint：</strong> OPA（Open Policy Agent）Gatekeeper を使用する Kubernetes 専用の効果。Azure VM には使えない ❌\n\n<strong>EnforceRegoPolicy：</strong> Rego ポリシー言語を使う Kubernetes 向け。同上 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">Append と Modify の違いが試験頻出：\n• <strong>Append</strong>：新規リソース作成時のみ適用（フィールド追加）。修復タスクなし\n• <strong>Modify</strong>：新規リソース + 修復タスクで既存リソースにも適用。タグ・プロパティの変更に使う\n\n「既存リソースにも適用したい（修復）」= 必ず Modify を選ぶ。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>Policy Effect</th><th>新規リソースへの適用</th><th class=\"cc\">既存リソースへの修復</th><th>主な用途</th></tr></thead><tbody><tr><td>Append</td><td>フィールド追加</td><td class=\"cc\">❌</td><td>配列フィールドの追加</td></tr><tr><td>Modify</td><td>プロパティ変更</td><td class=\"cc\">修復タスク対応</td><td>タグ追加・変更 ✅</td></tr><tr><td>DeployIfNotExists</td><td>設定がない場合にデプロイ</td><td class=\"cc\">修復タスク対応</td><td>診断設定・子リソースの追加</td></tr><tr><td>Deny</td><td>作成ブロック</td><td class=\"cc\">❌</td><td>非準拠リソースの防止</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">「既存リソースへの自動タグ修復」= <strong>Modify 効果</strong>。Append は新規のみ、修復タスクなし。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effects\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effects</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":53,"id":"q53","domain":"ID・ガバナンス・監視","question_text":"以下の動作を提供する Azure Policy を設計する必要があります：\n\n・新しく作成されたリソースに対して、そのリソースがデプロイされたリソース グループのタグとタグ値を自動的に適用すること\n・既存のリソースに対して、タグとタグ値がリソース グループのものと一致しているか評価すること\n・非準拠のリソースに対して、不足しているタグと値を追加するための修復タスクを自動的に開始すること\n\nポリシーの実装は最小権限の原則を守る必要があります。\n\nこのポリシーの修復タスクに必要な Microsoft Entra オブジェクトとロールの推奨事項を完成させてください。","choices":[{"text":"Contributor ロールを持つマネージド ID","is_correct":false},{"text":"User Access Administrator ロールを持つマネージド ID","is_correct":true},{"text":"Contributor ロールを持つサービス プリンシパル","is_correct":false},{"text":"User Access Administrator ロールを持つサービス プリンシパル","is_correct":false}],"correct_indices":[1],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか</div><div class=\"exp-block-body\">Azure Policy の Modify 効果で修復タスクを実行するには、マネージド ID が必要です。\n\n<strong>Contributor ロールを持つマネージド ID</strong>：\n• マネージド ID：Azure が自動管理。資格情報管理不要（最小作業）✅\n• Contributor ロール：タグを追加・変更（リソースのプロパティ変更）するために必要\n\n注：User Access Administrator は RBAC ロール割り当てを管理するもの。タグ変更には不要。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>User Access Administrator のマネージド ID：</strong> RBAC ロールの割り当て変更に使う権限。タグの追加には Contributor が必要（User Access Administrator は過剰）❌\n\n<strong>Contributor のサービス プリンシパル：</strong> 機能的には動作するが、証明書/シークレットの管理が必要 → マネージド ID の方が管理作業が少ない ❌\n\n<strong>User Access Administrator のサービス プリンシパル：</strong> 上記 2 つの問題を兼ね備える ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">ロールの選択：\n• <strong>Contributor</strong>：リソースの作成・変更・削除（タグ変更含む）。ロール割り当ての変更は不可\n• <strong>Owner</strong>：Contributor + ロール割り当て変更\n• <strong>User Access Administrator</strong>：ロール割り当ての管理のみ\n\nタグ変更 = リソースのプロパティ変更 → Contributor が適切（Owner は過剰）。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">選択肢</th><th>資格情報管理</th><th>タグ変更権限</th><th>推奨度</th></tr></thead><tbody><tr><td class=\"cc\">マネージド ID + Contributor</td><td>不要 ✅</td><td>✅</td><td>推奨</td></tr><tr><td class=\"cc\">マネージド ID + User Access Admin</td><td>不要 ✅</td><td>不十分</td><td>❌</td></tr><tr><td class=\"cc\">サービス プリンシパル + Contributor</td><td>必要 ❌</td><td>✅</td><td>❌</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">Policy 修復タスクの ID：<strong>マネージド ID</strong>（資格情報不要）+ <strong>Contributor ロール</strong>（タグ変更に必要）。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources</a></li></ul></div>\n</div>","svg":"","domain_color":"#7719AA"},{"num":54,"id":"q54","domain":"インフラストラクチャ設計","question_text":"Azure Kubernetes Service (AKS) クラスターで実行されるコンテナーで構成される App1 というアプリケーションをデプロイする計画があります。AKS クラスターは 4 つの Azure リージョンにまたがってデプロイされます。\n\n更新されたコンテナー イメージがすべての AKS クラスターに自動的にレプリケートされるストレージ ソリューションを推奨する必要があります。\n\n推奨すべきストレージ ソリューションはどれですか？","choices":[{"text":"Premium SKU の Azure Container Registry","is_correct":true},{"text":"Azure Cache for Redis","is_correct":false},{"text":"geo 冗長ストレージ (GRS) アカウント","is_correct":false},{"text":"Azure Content Delivery Network (CDN)","is_correct":false}],"correct_indices":[0],"n_correct":1,"exp_html":"<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">なぜ正解なのか — Premium SKU の Azure Container Registry</div><div class=\"exp-block-body\">要件：4 つの Azure リージョンにまたがる AKS クラスターで、更新されたコンテナー イメージが<strong>自動的にすべてのクラスターにレプリケート</strong>される。\n\n<strong>Azure Container Registry（ACR）Premium SKU の Geo レプリケーション</strong>がこれを実現します：\n\n<code>開発者</code>\n    ↓ docker push（1回だけ！）\n<code>ACR プライマリ リージョン（例：East US）</code>\n    ↓ 自動レプリケーション\n  ┌─────────────────────────────┐\n<code>ACR レプリカ（West US）</code>  <code>ACR レプリカ（Japan East）</code>  <code>ACR レプリカ（West Europe）</code>\n    ↑                              ↑                              ↑\n<code>AKS クラスター A</code>   <code>AKS クラスター B</code>   <code>AKS クラスター C</code>   <code>AKS クラスター D</code>\n\nメリット：\n• 各 AKS クラスターが<strong>最も近いリージョンのレプリカ</strong>からイメージを取得（低レイテンシ）\n• イメージの更新が<strong>自動的に全リージョンに伝播</strong>\n• <strong>Geo レプリケーションは Premium SKU のみ</strong>利用可能</div></div>\n\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>B: Azure Cache for Redis：</strong>\nRedis はインメモリ キャッシュ（セッション、よく使うデータのキャッシュ）です。コンテナー イメージの配布と管理には全く使えません ❌\n\n<strong>C: geo 冗長ストレージ（GRS）アカウント：</strong>\nGRS はブロック、テーブル、キューなどの Azure Storage データをレプリケートします。Docker コンテナー イメージの標準プロトコル（OCI/Docker Registry API）には対応していません ❌\n\n<strong>D: Azure CDN：</strong>\nCDN は静的 Web コンテンツ（HTML、JS、CSS、画像など）をキャッシュして配信します。Docker イメージ プロトコルには対応しておらず、コンテナー レジストリとして機能しません ❌</div></div>\n\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">間違えやすいポイント</div><div class=\"exp-block-body\">ACR の SKU 選択が重要です：\n• <strong>Basic</strong>：開発・テスト専用。ストレージ 10 GB。Geo レプリケーション ❌\n• <strong>Standard</strong>：本番環境の基本。ストレージ 100 GB。Geo レプリケーション ❌\n• <strong>Premium</strong>：Geo レプリケーション ✅、プライベート エンドポイント ✅、専用データ エンドポイント ✅\n\n「マルチリージョン AKS」「コンテナー イメージの自動レプリケーション」というキーワードが出たら、<strong>ACR Premium が唯一の正解</strong>です。</div></div>\n\n<div class=\"comp-s\"><div class=\"comp-l\">Azure Container Registry SKU 比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>SKU</th><th>Geo レプリケーション</th><th>プライベート EP</th><th>ストレージ</th><th>想定用途</th></tr></thead><tbody>\n<tr><td>Basic</td><td>❌</td><td>❌</td><td>10 GB</td><td>開発・テスト</td></tr>\n<tr><td>Standard</td><td>❌</td><td>❌</td><td>100 GB</td><td>本番（単一リージョン）</td></tr>\n<tr><td class=\"cc\">Premium</td><td><strong>正解</strong></td><td>✅</td><td>500 GB</td><td>マルチリージョン・エンタープライズ</td></tr>\n</tbody></table></div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">試験の核心ポイント</div><div class=\"exp-block-body\">マルチリージョン AKS へのコンテナー イメージ自動配布 ＝ <strong>ACR Premium SKU の Geo レプリケーション</strong>。Basic/Standard SKU は Geo レプリケーション非対応。Azure Cache for Redis や CDN はコンテナー レジストリではない。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/container-registry/container-registry-geo-replication\" target=\"_blank\" rel=\"noopener\">Azure Container Registry の geo レプリケーション</a></li></ul></div>\n</div>","svg":"","domain_color":"#C50F1F"},{"num":55,"id":"q55","domain":"ID・ガバナンス・監視","question_text":"1,000 台の仮想マシンと Workspace1 という Log Analytics ワークスペースを含む Azure サブスクリプションがあります。\n\n仮想マシンからカスタム JSON ログ データを収集し、Workspace1 内のカスタム テーブルにデータを格納する計画があります。\n\nログ データが Azure プライベート ネットワーク経由でのみ取り込まれるようにする必要があります。\n\n推奨すべきソリューションはどれですか？","choices":[{"text":"Workspace1 のリンク済みストレージ アカウント","is_correct":false},{"text":"Azure Peering Service 接続","is_correct":false},{"text":"Service Connector","is_correct":false},{"text":"Azure Monitor プライベート リンク スコープ (AMPLS)","is_correct":true}],"correct_indices":[3],"n_correct":1,"exp_html":"<div class=\"arch-box\"><div class=\"arch-title\">Azure Monitor Private Link Scope / AMPLS（Q55）</div><svg viewBox=\"0 0 740 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:740px;display:block;margin:10px auto;border-radius:10px;\">\n<rect width=\"740\" height=\"250\" rx=\"10\" fill=\"#0d1b2e\"/>\n<defs>\n  <marker id=\"arr\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/></marker>\n  <marker id=\"arr2\" markerWidth=\"7\" markerHeight=\"5\" refX=\"6\" refY=\"2.5\" orient=\"auto\"><polygon points=\"0 0,7 2.5,0 5\" fill=\"#4a9fd4\"/></marker>\n</defs>\n<rect x=\"15\" y=\"20\" width=\"300\" height=\"200\" rx=\"8\" fill=\"none\" stroke=\"#1e4080\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n<text x=\"165\" y=\"38\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a9fd4\" font-family=\"Segoe UI,Arial,sans-serif\">Azure VNet (プライベート)</text>\n<rect x=\"30\" y=\"50\" width=\"110\" height=\"55\" rx=\"7\" fill=\"#112240\" stroke=\"#107C41\" stroke-width=\"1.5\"/>\n<rect x=\"36\" y=\"55\" width=\"98\" height=\"24\" rx=\"4\" fill=\"#107C41\" fill-opaci
