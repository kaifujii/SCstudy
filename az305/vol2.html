"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/data-factory/concepts-data-flow-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/data-factory/concepts-data-flow-overview</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#0072C6"}, {"num": 29, "id": "q29", "domain": "データストレージ設計", "question_text": "以下の条件を満たすデータ ストレージ ソリューションを推奨する必要があります：\n\n・REST ベースのインターフェイスを使用してアプリケーションがデータにアクセスできること\n・それぞれ異なるサイズとアクセス パターンを持つ 20 個のテーブルをサポートすること\n・別の Azure リージョンにデータが自動的にレプリケートされること\n・コストを可能な限り最小化すること\n\n推奨すべきストレージ ソリューションはどれですか？", "choices": [{"text": "geo レプリケーションを使用した Azure SQL Database エラスティック データベース プール", "is_correct": false}, {"text": "読み取りアクセス geo 冗長ストレージ (RA-GRS) を使用した Azure Storage アカウントのテーブル", "is_correct": false}, {"text": "geo 冗長ストレージ (GRS) を使用した Azure Storage アカウントのテーブル", "is_correct": true}, {"text": "アクティブ geo レプリケーションを使用した Azure SQL Database", "is_correct": false}], "correct_indices": [2], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">要件：①REST ベース、②20 個のテーブル（異なるサイズ・アクセス パターン）、③別リージョンへの自動レプリケーション、④コスト最小化。\n\n<strong>GRS の Azure Storage テーブル</strong>が全要件を満たします：\n• REST API でアクセス可能\n• 複数テーブルをサポート\n• GRS で自動的にセカンダリ リージョンにレプリケート\n• Azure Table Storage は非常に低コスト（SQL より大幅に安価）</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>GRS の Azure SQL Database（エラスティック プール）：</strong> SQL クエリ可能だが、REST ベースではなく TDS/ODBC 接続。コスト高 ❌\n\n<strong>RA-GRS の Azure Storage テーブル：</strong> RA-GRS は読み取りアクセスが可能だが、GRS より高コスト。「読み取りアクセスが不要」なら RA-GRS は過剰 ❌\n\n<strong>アクティブ geo レプリケーションの Azure SQL Database：</strong> SQL Database の高コストな DR オプション。REST ベースでもない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">GRS vs RA-GRS の違い：\n• <strong>GRS</strong>：セカンダリへのレプリケートのみ。セカンダリへの直接読み取りは通常不可\n• <strong>RA-GRS</strong>：セカンダリへの読み取りアクセスも可能。コストわずかに高い\n\nコスト最小化が要件の場合は RA-GRS より GRS を選びます。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">オプション</th><th>REST対応</th><th>自動レプリケーション</th><th>コスト</th></tr></thead><tbody><tr><td class=\"cc\">Azure Storage テーブル + GRS</td><td>✅</td><td>✅</td><td>最安 ✅</td></tr><tr><td class=\"cc\">Azure Storage テーブル + RA-GRS</td><td>✅</td><td>✅ + 読み取り可</td><td>GRS より高</td></tr><tr><td class=\"cc\">Azure SQL DB エラスティック プール</td><td>❌ TDS</td><td>△ 別途設定</td><td>高</td></tr><tr><td class=\"cc\">Azure SQL DB アクティブ geo レプリカ</td><td>❌ TDS</td><td>✅</td><td>最高</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">「REST + 低コスト + 自動 geo レプリカ + 複数テーブル」= <strong>Azure Storage テーブル + GRS</strong>。SQL は REST ベースでなくコストも高い。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-overview</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#0072C6"}, {"num": 30, "id": "q30", "domain": "データストレージ設計", "question_text": "20 個の独立したデータベースをホストする SQL ベースのデータベース ソリューションを設計しています。各データベースのサイズは 20 GB です。データベースはそれぞれ異なる変動する使用パターンを持ちます。\n\nこれらのデータベースをホストするための適切なデータベース プラットフォームを推奨する必要があります。提案するソリューションは以下の要件を満たす必要があります：\n\n・99.99% の SLA を提供すること\n・リソースを共有することで変動する使用パターンに対応すること\n・総ストレージ コストを最小化すること\n\n推奨すべきソリューションはどれですか？", "choices": [{"text": "20 個の Azure SQL Database を含むエラスティック プール", "is_correct": true}, {"text": "Azure 仮想マシン上の Microsoft SQL Server（1 台）に 20 個のデータベース", "is_correct": false}, {"text": "20 個の Azure SQL Database サーバーレス インスタンス", "is_correct": false}, {"text": "Azure 仮想マシン上の Microsoft SQL Server（複数台）に 20 個のデータベース", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">要件：①20 個の独立した DB（各 20 GB）、②変動する使用パターン、③99.99% SLA、④コスト最小化。\n\n<strong>エラスティック プール</strong>は複数の DB が DTU/vCore リソースを共有します：\n• 変動するパターン → あるデータベースが低負荷のとき、別の高負荷 DB がそのリソースを使える\n• 個別にプロビジョニングするより大幅にコスト削減\n• 99.99% SLA を提供</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure VM 上の SQL Server（1 台）：</strong> 単一障害点があり、99.99% SLA が困難。OS/パッチ管理も必要 ❌\n\n<strong>20 個の Azure SQL Database サーバーレス：</strong> サーバーレスは個別インスタンスのためリソース共有なし。変動パターンには対応するが、20 個分の個別コスト ❌\n\n<strong>Azure VM 上の SQL Server（複数台）：</strong> 最もコストが高く、管理作業が多い ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">「変動する使用パターン」「複数の DB でコスト共有」というキーワードが出たら<strong>エラスティック プール</strong>を選びます。\n\nサーバーレス（自動一時停止）は単一 DB の変動負荷向けで、複数 DB のリソース共有ではありません。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">オプション</th><th>リソース共有</th><th>99.99% SLA</th><th>管理作業</th><th>コスト（変動負荷）</th></tr></thead><tbody><tr><td class=\"cc\">エラスティック プール</td><td>✅ DB 間共有</td><td>✅</td><td>最小</td><td>最安 ✅</td></tr><tr><td class=\"cc\">個別 Azure SQL Database</td><td>❌</td><td>✅</td><td>最小</td><td>高（20 倍）</td></tr><tr><td class=\"cc\">サーバーレス SQL Database</td><td>❌</td><td>✅</td><td>最小</td><td>中（個別）</td></tr><tr><td class=\"cc\">VM 上の SQL Server</td><td>❌</td><td>△</td><td>最大</td><td>高</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">「複数 DB + 変動負荷 + コスト共有」= <strong>エラスティック プール</strong>。複数の DB が 1 つのリソース プールを共有する。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-pool-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-pool-overview</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#0072C6"}, {"num": 31, "id": "q31", "domain": "データストレージ設計", "question_text": "Microsoft SQL Server をホストし、2 つの独立したデータ ディスクを使用する仮想マシンのデプロイを計画しています。一方のディスクはトランザクション ログ ファイルの保存専用で、もう一方は データベース データ ファイル用です。両方のディスクは P40 マネージド ディスクとして構成されます。\n\nデータ ディスクに推奨すべきホスト キャッシュ オプションはどれですか？", "choices": [{"text": "なし (None)", "is_correct": true}, {"text": "読み取り専用 (ReadOnly)", "is_correct": false}, {"text": "読み取り/書き込み (ReadWrite)", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか — なし（None）</div><div class=\"exp-block-body\">SQL Server on Azure VM のディスク構成には Microsoft の公式ベスト プラクティスがあります。\n\n<strong>トランザクション ログ ファイル（.ldf）</strong>の特性：\n• <strong>連続した順次書き込み</strong>が主体（ランダム読み取りはほとんどない）\n• データ損失が絶対に許されない（ACID の D = Durability）\n• ログはコミット確認前に必ずディスクに書き込まれる（WAL: Write-Ahead Logging）\n\n<strong>「なし（None）」が正解の理由：</strong>\n• ReadOnly キャッシュ → ログの連続書き込みにキャッシュの恩恵なし。無駄にキャッシュを消費\n• ReadWrite キャッシュ → <strong>データ損失リスク！</strong> VM がクラッシュした場合、キャッシュ内の未フラッシュデータが失われ、ログの整合性が壊れる可能性がある\n• None（なし）→ キャッシュを経由せず直接ディスクに書き込む。データ損失リスクゼロ ✅</div></div>\n\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>B: 読み取り専用（ReadOnly）：</strong>\nデータファイル（.mdf）に適した設定です。ログファイルは読み取りより書き込みが主体なので、ReadOnly キャッシュの恩恵を受けられません ❌\n\n<strong>C: 読み取り/書き込み（ReadWrite）：</strong>\n最も危険な設定です。VM クラッシュ時にキャッシュ内データが失われ、トランザクション ログの整合性が保証されません。SQL Server のデータ破損につながる可能性があります ❌</div></div>\n\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント（Q31 vs Q32 の対比）</div><div class=\"exp-block-body\">Q31（ログ ファイル）と Q32（データ ファイル）は答えが逆になります！\n\n<strong>SQL Server の 2 ディスク構成のベスト プラクティス：</strong>\n<code>データ ファイル（.mdf）ディスク → ReadOnly キャッシュ</code>\n  理由：ランダム読み取りが多い。よく読まれるデータ ページがキャッシュされパフォーマンス向上\n\n<code>トランザクション ログ（.ldf）ディスク → None（キャッシュなし）</code>\n  理由：連続書き込み主体。ReadWrite キャッシュはデータ損失リスクあり\n\nこの組み合わせが <strong>Microsoft の公式推奨</strong>です。</div></div>\n\n<div class=\"comp-s\"><div class=\"comp-l\">📊 SQL Server on Azure VM ディスク キャッシュ設定</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>ディスク用途</th><th>推奨キャッシュ</th><th>理由</th><th>ReadWrite の危険性</th></tr></thead><tbody>\n<tr><td class=\"cc\">トランザクション ログ（.ldf）</td><td class=\"cc\">None ✅</td><td class=\"cc\">連続書き込み主体、整合性保護</td><td class=\"cc\">クラッシュ時データ損失リスク</td></tr>\n<tr><td>データ ファイル（.mdf）</td><td>ReadOnly ✅</td><td>読み取り頻度高、パフォーマンス向上</td><td>書き込みキャッシュ不要</td></tr>\n<tr><td>TempDB</td><td>ReadOnly または None</td><td>ワークロードによる</td><td>一時データなので影響小</td></tr>\n</tbody></table></div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">ログ ファイル ＝ <strong>None（なし）</strong>、データ ファイル ＝ <strong>ReadOnly（読み取り専用）</strong>。この組み合わせが MS 公式ベスト プラクティス。ReadWrite はどちらのディスクにも使わない！</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-machines/premium-storage-performance\" target=\"_blank\" rel=\"noopener\">Azure Premium Storage のパフォーマンス</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#0072C6"}, {"num": 32, "id": "q32", "domain": "データストレージ設計", "question_text": "Microsoft SQL Server をホストし、2 つの独立したデータ ディスクを使用する仮想マシンのデプロイを計画しています。一方のディスクはトランザクション ログ ファイルの保存専用で、もう一方はデータベース データ ファイル用です。両方のディスクは P40 マネージド ディスクとして構成されます。\n\nデータベース データ ファイルを保存するディスクに推奨すべきホスト キャッシュ オプションはどれですか？", "choices": [{"text": "なし (None)", "is_correct": false}, {"text": "読み取り専用 (ReadOnly)", "is_correct": true}, {"text": "読み取り/書き込み (ReadWrite)", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか — 読み取り専用（ReadOnly）</div><div class=\"exp-block-body\">SQL Server のデータ ファイル（.mdf）の特性：\n• <strong>ランダム読み取り</strong>が主体（インデックス スキャン、テーブル スキャンなど）\n• 同じデータ ページが繰り返し読み取られることが多い（バッファー プールのミスに当たると Disk I/O が発生）\n• 書き込みは相対的に少ない\n\n<strong>ReadOnly（読み取り専用）キャッシュが最適な理由：</strong>\n• 頻繁にアクセスされるデータ ページが Azure ホスト キャッシュに保存される\n• 次回の読み取り時にディスク I/O なしでキャッシュから取得 → <strong>レイテンシ大幅削減</strong>\n• 書き込みはキャッシュを経由せずディスクへ直接 → データ整合性リスクなし ✅</div></div>\n\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>A: なし（None）：</strong>\nトランザクション ログ（.ldf）に推奨される設定です。データ ファイルに使うと読み取りキャッシュの恩恵を受けられず、パフォーマンスが低下します ❌\n\n<strong>C: 読み取り/書き込み（ReadWrite）：</strong>\n書き込みもキャッシュされるため VM クラッシュ時にデータ損失のリスクがあります。SQL Server はデータの整合性が最重要なため、使用が禁止されています ❌</div></div>\n\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント（Q31 との対比）</div><div class=\"exp-block-body\">Q31（ログ ファイル）：<strong>None（なし）</strong> ← 書き込み主体、整合性保護\nQ32（データ ファイル）：<strong>ReadOnly（読み取り専用）</strong> ← 読み取り主体、パフォーマンス向上\n\nこの2つはセットで覚えてください。試験では「どのディスクに何のキャッシュを使うか」という設問で、Q31とQ32のように別々に問われることがあります。</div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">データ ファイル ＝ <strong>ReadOnly キャッシュ</strong>（読み取りパフォーマンス向上）。ログ ファイル ＝ None（整合性保護）。ReadWrite はSQL Server のどのディスクにも使わない。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-machines/premium-storage-performance\" target=\"_blank\" rel=\"noopener\">Azure Premium Storage のパフォーマンス</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#0072C6"}, {"num": 33, "id": "q33", "domain": "ID・ガバナンス・監視", "question_text": "Microsoft Entra ID を使用してユーザーを認証する App1 という Azure Web アプリをデプロイする準備をしています。\n\nApp1 はインターネット経由で組織内の従業員がアクセスします。すべてのユーザーは Windows 10 を実行し、Microsoft Entra ID に参加しているデバイスを使用しています。\n\n認証に必要な Microsoft Entra コンポーネントを推奨する必要があります。\n\n推奨すべきものはどれですか？", "choices": [{"text": "Microsoft Entra アプリの登録", "is_correct": true}, {"text": "Microsoft Entra マネージド ID", "is_correct": false}, {"text": "Microsoft Entra アプリケーション プロキシ", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">Microsoft Entra ID で認証する Azure Web アプリを展開するには、まず<strong>アプリの登録（App Registration）</strong>が必要です。\n\nアプリの登録により：\n• Entra ID がアプリを認識し、OAuth 2.0/OpenID Connect 認証フローを処理\n• クライアント ID とシークレット（またはマニフェスト）が発行される\n• Entra 参加デバイスからの SSO（シングル サインオン）が可能</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Entra マネージド ID：</strong> Azure リソースが他の Azure サービスに対して認証するための ID（資格情報不要）。ユーザー認証用ではない ❌\n\n<strong>Entra アプリケーション プロキシ：</strong> オンプレミス アプリをインターネット経由で公開するためのサービス。Azure Web アプリには不要（既にクラウドにある）❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">3 つのサービスの違い：\n• <strong>アプリの登録</strong>：ユーザーが Web アプリにログインするための設定（アプリ → Entra ID で認証）\n• <strong>マネージド ID</strong>：アプリが他のサービス（Key Vault など）にアクセスするための ID\n• <strong>アプリケーション プロキシ</strong>：オンプレミス アプリをクラウド経由で公開</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">機能</th><th>目的</th><th>主な用途</th></tr></thead><tbody><tr><td class=\"cc\">アプリの登録</td><td>ユーザー認証の設定（アプリを Entra ID に登録）</td><td>Web アプリへのログイン ✅</td></tr><tr><td class=\"cc\">マネージド ID</td><td>アプリが他の Azure サービスにアクセス（資格情報不要）</td><td>Key Vault / Storage アクセス</td></tr><tr><td class=\"cc\">アプリケーション プロキシ</td><td>オンプレミス アプリのクラウド公開</td><td>オンプレミス app → インターネット</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">「Web アプリにユーザーが Entra ID でログイン」= <strong>アプリの登録</strong>が必要。マネージド ID はサービス間認証（ユーザー認証ではない）。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory/develop/quickstart-register-app\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/active-directory/develop/quickstart-register-app</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#7719AA"}, {"num": 34, "id": "q34", "domain": "ID・ガバナンス・監視", "question_text": "Microsoft Entra ID を使用してユーザーを認証する App1 という Azure Web アプリをデプロイする準備をしています。\n\nApp1 はインターネット経由で組織内の従業員がアクセスします。すべてのユーザーは Windows 10 を実行し、Microsoft Entra ID に参加しているデバイスを使用しています。\n\n多要素認証 (MFA) を適用し、準拠デバイスからのアクセスのみを許可するアクセス制御を推奨する必要があります。\n\n推奨すべきものはどれですか？", "choices": [{"text": "Microsoft Entra 管理単位", "is_correct": false}, {"text": "条件付きアクセス ポリシー", "is_correct": true}, {"text": "Azure Application Gateway", "is_correct": false}, {"text": "Azure ブループリント", "is_correct": false}, {"text": "Azure Policy", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">要件：「App1 へのアクセス時に<strong>特定の条件（MFA、準拠デバイスなど）</strong>を強制する」。\n\n<strong>条件付きアクセス ポリシー</strong>は：\n• アプリケーションごとにアクセス要件を定義（MFA 強制、準拠デバイス要件など）\n• Entra 参加デバイスからのアクセスに対してシームレスに適用\n• App1 を対象とした細かい制御が可能</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Entra 管理単位：</strong> ユーザー/グループを論理グループ化して管理委任するもの。アクセス条件制御ではない ❌\n\n<strong>Azure Application Gateway：</strong> L7 ロード バランサー + WAF。認証条件制御ではない ❌\n\n<strong>Azure ブループリント：</strong> リソースのデプロイ規範（ポリシー・RBAC・テンプレートのまとめ）。アプリアクセス条件ではない ❌\n\n<strong>Azure Policy：</strong> リソース構成ガバナンス（どんなリソースを作れるか）。ユーザー アクセス条件ではない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">Azure Policy と条件付きアクセスを混同しがちです：\n• <strong>Azure Policy</strong>：リソース（何をデプロイできるか）を制御\n• <strong>条件付きアクセス</strong>：ユーザーのアプリアクセス（どんな条件でアクセスできるか）を制御</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">「アプリへのアクセスに MFA・デバイス要件を設定」= <strong>条件付きアクセス ポリシー</strong>。Azure Policy はリソース管理、条件付きアクセスはユーザー アクセス管理。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory/conditional-access/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/active-directory/conditional-access/overview</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#7719AA"}, {"num": 35, "id": "q35", "domain": "ID・ガバナンス・監視", "question_text": "多数のサブスクリプションを含む大規模な Microsoft Azure 環境を計画しています。\n\nガバナンス戦略の一環として、環境全体の標準を強制し、リソース構成を制御するために Azure Policy を実装する予定です。\n\nAzure Policy の定義を割り当てることができる 3 つのスコープ レベルを特定する必要があります。\n\n該当する 3 つのスコープを選択してください。", "choices": [{"text": "Microsoft Entra 管理単位", "is_correct": false}, {"text": "Microsoft Entra テナント", "is_correct": false}, {"text": "サブスクリプション", "is_correct": true}, {"text": "コンピューティング リソース", "is_correct": false}, {"text": "リソース グループ", "is_correct": true}, {"text": "管理グループ", "is_correct": true}], "correct_indices": [2, 4, 5], "n_correct": 3, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">Azure Policy は以下の 3 つのスコープに割り当てることができます：\n• <strong>管理グループ</strong>：複数サブスクリプションを一括でカバーする最上位スコープ\n• <strong>サブスクリプション</strong>：特定サブスクリプション内の全リソースに適用\n• <strong>リソース グループ</strong>：特定リソース グループ内のリソースのみに適用</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Entra 管理単位：</strong> Entra ID のユーザー・グループ管理委任用。Azure リソースの Policy スコープではない ❌\n\n<strong>Entra テナント：</strong> Azure AD の最上位コンテナーだが、Policy の割り当てスコープではない（管理グループが最上位）❌\n\n<strong>コンピューティング リソース：</strong> 個別リソースへの Policy 割り当ては通常行わない（リソース グループが最小スコープ）❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">「Azure Policy のスコープ」と「Azure ブループリントの定義/割り当てスコープ」を混同しないこと：\n• Policy 割り当て：管理グループ / サブスクリプション / リソース グループ ✅\n• ブループリント割り当て：サブスクリプションのみ ✅（管理グループ・RG は不可）</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>スコープ</th><th>Azure Policy 割り当て</th><th>ブループリント割り当て</th><th>RBAC 割り当て</th></tr></thead><tbody><tr><td>Entra テナント</td><td>❌</td><td>❌</td><td>❌</td></tr><tr><td>管理グループ</td><td>✅</td><td>❌（定義保存は可）</td><td>✅</td></tr><tr><td>サブスクリプション</td><td>✅</td><td>✅</td><td>✅</td></tr><tr><td>リソース グループ</td><td>✅</td><td>❌</td><td>✅</td></tr><tr><td>個別リソース</td><td>❌ 通常行わない</td><td>❌</td><td>✅</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">Azure Policy の割り当てスコープ：<strong>管理グループ・サブスクリプション・リソース グループ</strong>の 3 つ。Entra 管理単位はスコープではない。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/governance/policy/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/governance/policy/overview</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#7719AA"}, {"num": 36, "id": "q36", "domain": "データストレージ設計", "question_text": "Windows Server 2012 R2 を実行する 100 台のサーバーで構成されるオンプレミス環境の移行を担当しています。各サーバーには Microsoft SQL Server 2014 インスタンスがホストされています。\n\nSQL Server インスタンスのデータベースには以下の属性があります：\n\n・ストアド プロシージャが CLR を使用して実装されている\n・サーバー レベルのエージェント ジョブを使用している\n・複数データベースにまたがるクロスデータベース クエリを使用している\n\nこれらの要件を満たしながら、最小限の管理作業でデータベースを Azure にホストするためのソリューションを推奨する必要があります。\n\n推奨すべきサービスはどれですか？", "choices": [{"text": "Azure SQL Database エラスティック プール", "is_correct": false}, {"text": "Azure SQL Database Managed Instance（マネージド インスタンス）", "is_correct": true}, {"text": "Azure SQL Database シングル データベース", "is_correct": false}, {"text": "Azure 仮想マシン上の SQL Server 2016", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">要件：①CLR ストアド プロシージャ、②SQL Server エージェント ジョブ、③クロスデータベース クエリ（3 部構成参照）、④最小管理作業（PaaS 推奨）。\n\n<strong>Azure SQL Managed Instance</strong>はすべての要件を満たします：\n• SQL Server との高い互換性（CLR、SQL Agent、クロスDB クエリ対応）\n• PaaS サービスのため OS/パッチ管理不要（最小管理作業）</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>エラスティック プール：</strong> 複数 Azure SQL Database の共有プール。CLR・SQL Agent・クロスDB クエリはサポートしていない ❌\n\n<strong>シングル Azure SQL Database：</strong> CLR・SQL Agent・クロスDB クエリは非対応 ❌\n\n<strong>Azure VM 上の SQL Server：</strong> すべての機能をサポートするが IaaS（OS・パッチ管理が必要）→「最小管理作業」の要件に不一致 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">「CLR」「SQL Agent」「リンク サーバー」「クロスデータベース クエリ」→ これらのキーワードが出たら <strong>SQL Managed Instance</strong> を選びます。Azure SQL Database（通常版）はこれらをサポートしません。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>機能</th><th>SQL Database</th><th class=\"cc\">SQL Managed Instance</th><th>VM 上の SQL Server</th></tr></thead><tbody><tr><td>CLR ストアド プロシージャ</td><td>❌</td><td class=\"cc\">✅</td><td>✅</td></tr><tr><td>SQL Server エージェント</td><td>❌</td><td class=\"cc\">✅</td><td>✅</td></tr><tr><td>クロスデータベース クエリ</td><td>❌ 制限あり</td><td class=\"cc\">✅</td><td>✅</td></tr><tr><td>リンク サーバー</td><td>❌</td><td class=\"cc\">✅</td><td>✅</td></tr><tr><td>PaaS（管理作業最小）</td><td>✅</td><td class=\"cc\">✅</td><td>❌ IaaS</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">CLR + SQL Agent + クロスDB クエリ + 最小管理 → <strong>SQL Managed Instance</strong>。「SQL Server と高互換の PaaS」がキャッチフレーズ。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/sql-managed-instance-paas-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/sql-managed-instance-paas-overview</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#0072C6"}, {"num": 37, "id": "q37", "domain": "ビジネス継続性設計", "question_text": "App1 という Web アプリケーションをオンプレミスのデータ センターから Azure に移行する計画を立てています。\n\nApp1 は、ホスト サーバーにインストール済みのカスタム COM コンポーネントに依存しています。\n\nApp1 の Azure ベースのホスティング ソリューションを推奨する必要があります。ソリューションは以下の要件を満たす必要があります：\n\n・複数の可用性ゾーンにまたがるデプロイによって App1 の高可用性を確保すること\n・自動スケールをサポートすること\n\n推奨すべきソリューションはどれですか？", "choices": [{"text": "複数の可用性ゾーンにまたがるロード バランサーと仮想マシン スケール セットをデプロイする", "is_correct": true}, {"text": "Azure Traffic Manager プロファイルと Azure Web App をデプロイする", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">App1 はカスタム <strong>COM コンポーネント</strong>に依存しています。COM コンポーネントは Windows レジストリへの登録が必要で、<strong>仮想マシン環境でのみ動作</strong>します（App Service や Functions などの PaaS では動作不可）。\n\n高可用性 + 自動スケールを VM で実現するには：\n• <strong>VM スケール セット（VMSS）</strong>：複数のゾーンにまたがる VM グループ、自動スケール対応\n• <strong>ロード バランサー</strong>：トラフィックを複数 VM に分散</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Traffic Manager + Azure Web App：</strong> App Service はカスタム COM コンポーネントをサポートしない。Web App は PaaS であり、コンポーネントのレジストリ登録ができない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">COM コンポーネント・カスタム ミドルウェア・旧来のファイル システム依存などがある場合は、<strong>Azure VM（IaaS）でのホストが唯一の選択肢</strong>になります。PaaS（App Service/Functions）では動作しません。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>要件</th><th class=\"cc\">VM + VMSS + LB</th><th>App Service + Traffic Manager</th></tr></thead><tbody><tr><td>COM コンポーネント</td><td class=\"cc\">✅ VM 上で動作可能</td><td>❌ PaaS は非対応</td></tr><tr><td>自動スケール</td><td class=\"cc\">✅ VMSS が対応</td><td>✅ App Service プラン</td></tr><tr><td>高可用性（ゾーン冗長）</td><td class=\"cc\">✅ ゾーン対応 VMSS</td><td>✅</td></tr><tr><td>管理作業</td><td class=\"cc\">多い（IaaS）</td><td>少ない（PaaS）</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">COM コンポーネント・カスタム ミドルウェアが必要 → PaaS は使えず <strong>VM（VMSS + LB）</strong>でホストするしかない。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/overview</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#107C10"}, {"num": 38, "id": "q38", "domain": "ID・ガバナンス・監視", "question_text": "オンプレミス環境には App1 という ASP.NET アプリケーションをホストする Server1 があります。\n\nハイブリッド Azure Active Directory (Azure AD) デプロイを運用しています。\n\nユーザーがインターネットから App1 にアクセスする際に以下を確保するソリューションを推奨する必要があります：\n\n・ユーザーが Azure AD アカウントを使用して認証すること\n・サインイン中に Azure 多要素認証 (MFA) が強制されること\n\n使用可能な機能リスト（番号付き）：\n1. パブリック Azure ロード バランサー\n2. マネージド ID\n3. 内部 Azure ロード バランサー\n4. 条件付きアクセス ポリシー\n5. Azure App Service プラン\n6. Azure AD アプリケーション プロキシ\n7. Azure AD エンタープライズ アプリケーション\n\nデプロイおよび構成すべき 3 つの機能を正しい順序で答えてください。", "choices": [{"text": "6 → 7 → 4（アプリケーション プロキシ → エンタープライズ アプリ → 条件付きアクセス）", "is_correct": true}, {"text": "1 → 7 → 4", "is_correct": false}, {"text": "3 → 2 → 6", "is_correct": false}, {"text": "5 → 4 → 7", "is_correct": false}, {"text": "6 → 2 → 4", "is_correct": false}, {"text": "7 → 1 → 5", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか — 6 → 7 → 4（アプリケーション プロキシ → エンタープライズ アプリ → 条件付きアクセス）</div><div class=\"exp-block-body\">オンプレミスの ASP.NET アプリ（App1/Server1）にインターネットから Azure AD 認証 + MFA でアクセスするには、以下の順序で設定します：\n\n<strong>ステップ 1：⑥ Azure AD アプリケーション プロキシ（コネクター設置）</strong>\nオンプレミスのサーバーに「アプリケーション プロキシ コネクター」をインストールし、App1 を Azure AD 経由でインターネットに公開します。\n\n<code>インターネット → Azure AD アプリケーション プロキシ（クラウド）\n                          ↕ コネクター経由\n                   オンプレミス Server1（App1）</code>\n\n<strong>ステップ 2：⑦ Azure AD エンタープライズ アプリケーション（SSO 設定）</strong>\nアプリケーション プロキシ設定時に自動作成される「エンタープライズ アプリケーション」に対して SSO（ヘッダーベース、統合 Windows 認証など）を設定します。これにより Azure AD アカウントで App1 にサインインできるようになります。\n\n<strong>ステップ 3：④ 条件付きアクセス ポリシー（MFA 強制）</strong>\nエンタープライズ アプリケーションを対象に条件付きアクセス ポリシーを作成し、「MFA が必要」を設定します。これでサインイン時に MFA が強制されます。</div></div>\n\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>「1 → 7 → 4」：</strong> ①はパブリック Azure ロード バランサーです。オンプレミス アプリの公開にはアプリケーション プロキシが必要であり、ロード バランサーでは Azure AD 認証と連携できません ❌\n\n<strong>「3 → 2 → 6」：</strong> ③内部 LB → ②マネージド ID → ⑥アプリケーション プロキシ。内部LBはオンプレミス アプリの公開には使えず、マネージド IDはユーザー認証ではなくリソース間認証用 ❌\n\n<strong>他の選択肢：</strong> ⑤ App Service プラン はオンプレミスアプリには不要。順序の不正解以前に、そもそも使用するサービスが間違っています ❌</div></div>\n\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">「オンプレミス アプリ」と「Azure Web アプリ（App Service）」で設定手順が異なります：\n\n<strong>オンプレミス アプリ（今回のケース）：</strong>\nアプリケーション プロキシ → エンタープライズ アプリ → 条件付きアクセス\n\n<strong>Azure Web アプリ（App Service）のケース：</strong>\nアプリの登録 → 条件付きアクセス（App Service 側の認証設定も必要）\n\n「アプリケーション プロキシ」はオンプレミス アプリを Azure AD 経由でインターネットに公開する専用サービスです。Azure 上のアプリには不要です。</div></div>\n\n<div class=\"comp-s\"><div class=\"comp-l\">📊 オンプレミス アプリの Azure AD 認証設定フロー</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>ステップ</th><th>サービス/機能</th><th>設定内容</th><th>目的</th></tr></thead><tbody>\n<tr><td class=\"cc\">Step 1</td><td class=\"cc\">⑥ アプリケーション プロキシ（コネクター）</td><td class=\"cc\">オンプレミスに軽量エージェントをインストール</td><td class=\"cc\">インターネット経由の安全な公開</td></tr>\n<tr><td>Step 2</td><td>⑦ エンタープライズ アプリケーション</td><td>SSO メソッド・ユーザー割り当てを設定</td><td>Azure AD でアプリを認識・管理</td></tr>\n<tr><td>Step 3</td><td>④ 条件付きアクセス ポリシー</td><td>MFA 必要・準拠デバイスを設定</td><td>セキュリティ条件の強制</td></tr>\n</tbody></table></div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">オンプレミス アプリへの Azure AD 認証 ＝ <strong>アプリケーション プロキシ → エンタープライズ アプリ → 条件付きアクセス</strong>の順で設定。「アプリケーション プロキシ」はオンプレミス アプリ専用。Azure アプリには「アプリの登録」を使う。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory/app-proxy/application-proxy\" target=\"_blank\" rel=\"noopener\">Azure AD アプリケーション プロキシ</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#7719AA"}, {"num": 39, "id": "q39", "domain": "インフラストラクチャ設計", "question_text": "サードパーティのジョブ スケジューラーを使用して動作する高性能コンピューティング (HPC) クラスターを Azure にプロビジョニングする計画を立てています。\n\nHPC クラスターをプロビジョニングおよび管理するための Azure ベースのソリューションを推奨する必要があります。\n\n推奨に含めるべきサービスはどれですか？", "choices": [{"text": "Azure Purview", "is_correct": false}, {"text": "Azure CycleCloud", "is_correct": true}, {"text": "Azure Lighthouse", "is_correct": false}, {"text": "Azure Automation", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">要件：サードパーティのジョブ スケジューラー（SLURM、PBS、LSF など）を使用する HPC クラスターを Azure で管理する。\n\n<strong>Azure CycleCloud</strong>：\n• HPC クラスターの作成・管理・最適化専用ツール\n• SLURM、PBS Pro、Grid Engine、LSF などのサードパーティ スケジューラーとネイティブ統合\n• ジョブ負荷に応じた自動スケール（クラスター オートスケール）</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure Purview（現 Microsoft Purview）：</strong> データ ガバナンス・データ カタログ サービス。HPC とは無関係 ❌\n\n<strong>Azure Lighthouse：</strong> マルチテナント リソース管理（MSP 向け）。HPC 管理ではない ❌\n\n<strong>Azure Automation：</strong> IT プロセスの自動化。HPC ジョブ スケジューリングの専門機能はない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">HPC 関連のサービスは：\n• <strong>Azure CycleCloud</strong>：サードパーティ スケジューラー対応の HPC クラスター管理\n• <strong>Azure HPC Cache</strong>：HPC ワークロード向けの高速ファイル キャッシュ\n• <strong>Azure Batch</strong>：マネージドな並列バッチ処理（スケジューラーの自動管理を含む）\n\n「サードパーティのスケジューラー」= CycleCloud、「スケジューラーが不要でシンプルに使いたい」= Azure Batch。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>HPC 向け</th><th>サードパーティ スケジューラー</th><th>自動スケール</th></tr></thead><tbody><tr><td class=\"cc\">Azure CycleCloud</td><td>✅ 専用</td><td>✅ SLURM/PBS/LSF 等</td><td>✅</td></tr><tr><td class=\"cc\">Azure Batch</td><td>✅ 汎用並列処理</td><td>❌ 独自スケジューラー</td><td>✅</td></tr><tr><td class=\"cc\">Azure Purview</td><td>❌</td><td>❌</td><td>❌</td></tr><tr><td class=\"cc\">Azure Automation</td><td>△ 汎用</td><td>❌</td><td>△</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">HPC + サードパーティ ジョブ スケジューラー = <strong>Azure CycleCloud</strong>。Azure Batch はスケジューラーが不要な場合に使う。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/cyclecloud/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/cyclecloud/overview</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#C50F1F"}, {"num": 40, "id": "q40", "domain": "データストレージ設計", "question_text": "Oracle データベースを使用する App1 というオンプレミス アプリケーションがあります。Azure Databricks を使用して、App1 から Azure Synapse Analytics インスタンスにデータを移動するデータ変換および読み込み操作を実行する計画があります。\n\nこのプロセス中に App1 のデータが Azure Databricks からアクセスできることを確保する必要があります。\n\nこの要件を満たすソリューションに含めるべき 2 つの Azure サービスはどれですか？", "choices": [{"text": "Azure Data Box Edge", "is_correct": false}, {"text": "Azure Data Box Gateway", "is_correct": false}, {"text": "Azure Import/Export サービス", "is_correct": false}, {"text": "Azure Data Factory", "is_correct": true}, {"text": "Azure Data Lake Storage", "is_correct": true}], "correct_indices": [3, 4], "n_correct": 2, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">Oracle → Azure Synapse Analytics へのデータ パイプライン（Databricks を使用）：\n\n<strong>Azure Data Factory（正解 1）</strong>：Oracle から Azure Data Lake Storage へのデータ コピー パイプライン。セルフホステッド統合ランタイム（SHIR）で Oracle に接続。継続的・スケジュール転送対応。\n\n<strong>Azure Data Lake Storage（正解 2）</strong>：ADF でコピーした Oracle データの中間ステージング ストレージとして機能。Databricks から ADLS のデータを読み取り、Synapse Analytics に転送する。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Data Box Edge / Data Box Gateway：</strong> オンプレミスからのオフライン大量データ転送向け。継続的パイプラインには不向き ❌\n\n<strong>Azure Import/Export：</strong> 物理ディスク送付による転送。リアルタイム/継続転送には不向き ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">「Oracle → Azure」のアーキテクチャは：<strong>Oracle → ADF + SHIR → ADLS（中間）→ Databricks（処理）→ Synapse（分析）</strong>という流れです。\n\nADLS を「ステージング（中間バッファ）」として使うパターンは Azure のデータ アーキテクチャで非常によく登場します。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">Oracle → Synapse のパイプライン：<strong>ADF + SHIR</strong>（転送）＋ <strong>ADLS</strong>（中間ストレージ）＋ Databricks（変換）のアーキテクチャが標準。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/data-factory/connector-oracle\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/data-factory/connector-oracle</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#0072C6"}, {"num": 41, "id": "q41", "domain": "インフラストラクチャ設計", "question_text": "組織はオンプレミスの VMware 環境で 300 台の仮想マシンを運用しています。仮想マシンはサイズも使用率もさまざまです。\n\nすべての既存仮想マシンを Azure に移行する計画があります。\n\n必要な Azure 仮想マシンの数と適切なサイズを決定する必要があります。これを達成するために使用すべきサービスはどれですか？", "choices": [{"text": "Azure Migrate", "is_correct": true}, {"text": "Azure 料金計算ツール", "is_correct": false}, {"text": "Azure Cost Management", "is_correct": false}, {"text": "Azure Advisor", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">要件：300 台の VMware VM を Azure に移行するにあたり、<strong>必要な Azure VM の数と適切なサイズ</strong>を決める。\n\n<strong>Azure Migrate</strong>：\n• VMware/Hyper-V/物理サーバーを検出・評価する専用ツール\n• パフォーマンス データに基づく <strong>右サイジング（Azure VM サイズ推奨）</strong>\n• 依存関係の分析\n• 移行コストの見積もり</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure 料金計算ツール：</strong> 手動で VM サイズを入力してコストを試算するツール。自動的なサイズ推奨機能はない ❌\n\n<strong>Azure Cost Management：</strong> 既存 Azure リソースのコスト分析・最適化。移行前の評価には使えない ❌\n\n<strong>Azure Advisor：</strong> 既存 Azure リソースへの最適化推奨（コスト削減・セキュリティなど）。オンプレミス評価機能はない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">Azure Migrate と Azure Site Recovery（ASR）を混同しないこと：\n• <strong>Azure Migrate</strong>：評価（アセスメント）+ 移行実行\n• <strong>Azure Site Recovery</strong>：DR（継続的なレプリケーション）+ 移行のどちらにも使えるが、評価・サイジング機能はない</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">ツール</th><th>VM 評価・サイジング</th><th>移行実行</th><th>コスト見積もり</th></tr></thead><tbody><tr><td class=\"cc\">Azure Migrate</td><td>✅ 自動推奨</td><td>✅</td><td>✅</td></tr><tr><td class=\"cc\">Azure Site Recovery</td><td>❌</td><td>✅（移行モード）</td><td>❌</td></tr><tr><td class=\"cc\">Azure Advisor</td><td>❌（既存 Azure のみ）</td><td>❌</td><td>✅（既存のみ）</td></tr><tr><td class=\"cc\">料金計算ツール</td><td>❌（手動入力のみ）</td><td>❌</td><td>✅</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">オンプレミス VM の評価・サイジング → <strong>Azure Migrate</strong>。「何台の VM を、どのサイズで移行するか」を自動的に推奨してくれる。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/migrate/migrate-services-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/migrate/migrate-services-overview</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#C50F1F"}, {"num": 42, "id": "q42", "domain": "インフラストラクチャ設計", "question_text": "VNET1 という仮想ネットワークと、すべて VNET1 に接続された 10 台の仮想マシンを含む Azure サブスクリプションがあります。\n\nインターネットから仮想マシンへの管理アクセスを可能にするソリューションを設計する必要があります。ソリューションは以下の要件を満たす必要があります：\n\n・すべての受信接続は、ネットワーク アクセスが許可される前に Azure 多要素認証 (MFA) を使用して認証されること\n・すべての接続は TLS を使用し、TCP ポート 443 を使用して確立されること\n・ソリューションはリモート デスクトップ プロトコル (RDP) と Secure Shell (SSH) の両方のアクセスをサポートすること\n\n推奨すべきサービスはどれですか？", "choices": [{"text": "Azure Bastion", "is_correct": true}, {"text": "Just-in-time (JIT) VM アクセス", "is_correct": false}, {"text": "Azure Front Door の Azure Web Application Firewall (WAF)", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">要件：①パブリック IP なしの VM へのインターネットからの RDP/SSH、②TLS ポート 443 使用、③RDP と SSH の両方サポート、④MFA 対応。\n\n<strong>Azure Bastion</strong>：\n• ブラウザー（Azure portal）経由で VM に RDP/SSH 接続\n• HTTPS（TLS ポート 443）使用\n• VM にパブリック IP が不要\n• 条件付きアクセス + MFA と統合可能</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>JIT（Just-in-Time）VM アクセス：</strong> NSG を一時的に開いて特定の IP からの接続を許可する機能。ブラウザー接続ではなく直接 RDP/SSH クライアントが必要。TLS 443 使用でない ❌\n\n<strong>Front Door + WAF：</strong> HTTP/HTTPS トラフィックのルーティングとセキュリティ保護。RDP/SSH 接続には対応しない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">JIT と Bastion の違い：\n• <strong>JIT VM アクセス</strong>：NSG を時間制限付きで開く。RDP/SSH クライアント（3389/22 ポート）が必要\n• <strong>Azure Bastion</strong>：ポート 443 のみ使用、ブラウザーベース、VM のパブリック IP 不要\n\n「ポート 443 のみ」「パブリック IP 不要」が言及されたら Bastion が正解です。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>機能</th><th class=\"cc\">Bastion</th><th>JIT VM アクセス</th><th>VPN Gateway</th></tr></thead><tbody><tr><td>使用ポート</td><td class=\"cc\">443 (HTTPS)</td><td>3389/22（一時開放）</td><td>500/4500 (IPsec)</td></tr><tr><td>VM のパブリック IP</td><td class=\"cc\">不要</td><td>不要（NSG 一時開放）</td><td>不要</td></tr><tr><td>ブラウザーベース</td><td class=\"cc\">✅</td><td>❌（RDP クライアント）</td><td>❌</td></tr><tr><td>MFA 連携</td><td class=\"cc\">✅（条件付きアクセス）</td><td>✅（条件付きアクセス）</td><td>✅</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">「ブラウザーで RDP/SSH、ポート 443、パブリック IP 不要」= <strong>Azure Bastion</strong>。JIT は NSG を時間制限で開く仕組み（別目的）。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/bastion/bastion-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/bastion/bastion-overview</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#C50F1F"}, {"num": 43, "id": "q43", "domain": "インフラストラクチャ設計", "question_text": "VNET1 という仮想ネットワークと、すべて VNET1 に接続された 10 台の仮想マシンを含む Azure サブスクリプションがあります。\n\nインターネットから仮想マシンへの管理アクセスを可能にするソリューションを設計する必要があります。ソリューションは以下の要件を満たす必要があります：\n\n・すべての受信接続は、ネットワーク アクセスが許可される前に Azure 多要素認証 (MFA) を使用して認証されること\n・すべての接続は TLS を使用し、TCP ポート 443 を使用して確立されること\n・ソリューションはリモート デスクトップ プロトコル (RDP) と Secure Shell (SSH) の両方のアクセスをサポートすること\n\nAzure MFA を適用するには、「____________________________」を使用する。\n\n空欄に入る最も適切な選択肢を選んでください。", "choices": [{"text": "Azure Identity Governance アクセス パッケージ", "is_correct": false}, {"text": "クラウド アプリの割り当てを「Azure Windows VM サインイン」に設定した条件付きアクセス ポリシー", "is_correct": true}, {"text": "クラウド アプリの割り当てを「Microsoft Azure Management」に設定した条件付きアクセス ポリシー", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">VM へのサインイン時に MFA を強制する条件付きアクセス ポリシーを設定するには、クラウド アプリのターゲットを <strong>「Azure Windows VM サインイン」</strong> に設定する必要があります。\n\nこれにより、VM へのログイン時に MFA が要求されます（Azure portal や ARM API のアクセスではなく、VM 自体へのサインイン）。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>「Microsoft Azure Management」を対象とした条件付きアクセス：</strong> これは Azure portal や ARM API（Azure Resource Manager）への管理操作に対して MFA を強制するもの。VM へのサインイン（RDP/SSH ログイン）には適用されない ❌\n\n<strong>Entra Identity Governance アクセス パッケージ：</strong> エンタイトルメント管理（アクセス権のライフサイクル管理）。VM サインイン条件とは別の機能 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">2 つのクラウド アプリの違いを理解することが重要：\n• <strong>「Azure Windows VM サインイン」</strong>：VM OS への RDP/SSH ログイン時に MFA\n• <strong>「Microsoft Azure Management」</strong>：Azure portal/ARM API 操作時に MFA\n\n「VM の管理（ARM 操作）」と「VM へのログイン（OS サインイン）」は別の操作です。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">クラウド アプリのターゲット</th><th>適用タイミング</th><th>用途</th></tr></thead><tbody><tr><td class=\"cc\">Azure Windows VM サインイン</td><td>VM の OS ログイン時（RDP/SSH）</td><td>VM ログインに MFA 強制 ✅</td></tr><tr><td class=\"cc\">Microsoft Azure Management</td><td>Azure portal/ARM API 操作時</td><td>管理操作に MFA 強制</td></tr><tr><td class=\"cc\">Office 365</td><td>Microsoft 365 アプリへのアクセス時</td><td>M365 アクセスに MFA 強制</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">VM ログイン時の MFA = 条件付きアクセスのターゲットを <strong>「Azure Windows VM サインイン」</strong> に設定。ARM 管理用の「Microsoft Azure Management」とは別。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory/devices/howto-vm-sign-in-azure-ad-windows\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/active-directory/devices/howto-vm-sign-in-azure-ad-windows</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#C50F1F"}, {"num": 44, "id": "q44", "domain": "インフラストラクチャ設計", "question_text": "以下の要件を満たすロード バランシング サービスを推奨する必要があります：\n\n・Azure リージョンが利用不可になっても、アプリケーションの可用性が維持されること\n・Azure Web Application Firewall (WAF) 機能をサポートすること\n・クッキーベースのセッション アフィニティをサポートすること\n・HTTP から HTTPS へのリダイレクトをサポートすること\n\n推奨すべきサービスはどれですか？", "choices": [{"text": "Azure Application Gateway", "is_correct": false}, {"text": "Azure Load Balancer", "is_correct": false}, {"text": "Azure Front Door", "is_correct": true}, {"text": "Azure Traffic Manager", "is_correct": false}], "correct_indices": [2], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">要件：①リージョン障害時のフェールオーバー（グローバル冗長）、②WAF、③セッション アフィニティ、④HTTP → HTTPS リダイレクト。\n\n<strong>Azure Front Door</strong> はすべての要件を満たします：\n• グローバルな Anycast ネットワーク → リージョン障害時の自動フェールオーバー\n• WAF 統合（OWASP ルール）\n• クッキーベースのセッション アフィニティ\n• ルール エンジンで HTTP → HTTPS リダイレクト</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Azure Application Gateway：</strong> リージョン スコープ。リージョン障害には対応できない ❌\n\n<strong>Azure Load Balancer：</strong> L4 のみ。WAF なし、セッション アフィニティは IP ベースのみ ❌\n\n<strong>Azure Traffic Manager：</strong> DNS ベース。WAF なし、セッション アフィニティなし、HTTP リダイレクト機能なし ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">「グローバル」「WAF」「セッション アフィニティ」「HTTP リダイレクト」の<strong>4 つが全部揃っているのは Front Door だけ</strong>です。Application Gateway は WAF とセッション アフィニティを持ちますが、グローバル対応ではありません。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>グローバル冗長</th><th>WAF</th><th>セッション アフィニティ</th><th>HTTP→HTTPS リダイレクト</th></tr></thead><tbody><tr><td class=\"cc\">Azure Front Door</td><td>✅</td><td>✅</td><td>✅ Cookie ベース</td><td>✅ ルール エンジン</td></tr><tr><td class=\"cc\">Application Gateway</td><td>❌ リージョン</td><td>✅</td><td>✅ Cookie ベース</td><td>✅</td></tr><tr><td class=\"cc\">Traffic Manager</td><td>✅ DNS</td><td>❌</td><td>❌</td><td>❌</td></tr><tr><td class=\"cc\">Load Balancer</td><td>△</td><td>❌</td><td>△ IP ベース</td><td>❌</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">「グローバル + WAF + セッション アフィニティ + リダイレクト」= <strong>Azure Front Door</strong>。Application Gateway はリージョン内専用。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/frontdoor/front-door-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/frontdoor/front-door-overview</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#C50F1F"}, {"num": 45, "id": "q45", "domain": "データストレージ設計", "question_text": "オンプレミス環境には、めったにアクセスされない 5 TB の組織ファイルを保存する Server1 というファイル サーバーがあります。\n\nこれらのファイルを Azure Storage にコピーする計画があります。\n\n以下の要件を満たすストレージ ソリューションを実装する必要があります：\n\n・ファイルはリクエストから 24 時間以内に取得可能であること\n・ストレージ コストを最小化すること\n\nこの要件を満たす 2 つのストレージ ソリューションを選択してください。", "choices": [{"text": "クール デフォルト アクセス層に設定された Azure Blob ストレージ アカウントを作成する。BLOB コンテナーを作成してファイルをコピーし、各ファイルをアーカイブ アクセス層に設定する", "is_correct": true}, {"text": "汎用 v1 ストレージ アカウントを作成する。BLOB コンテナーを作成してファイルをコピーする", "is_correct": false}, {"text": "汎用 v1 ストレージ アカウントを作成する。ファイル共有を作成してファイルをコピーする", "is_correct": false}, {"text": "ホット デフォルト アクセス層に設定された汎用 v2 ストレージ アカウントを作成する。BLOB コンテナーを作成してファイルをコピーし、各ファイルをアーカイブ アクセス層に設定する", "is_correct": true}, {"text": "クール デフォルト アクセス層に設定された汎用 v2 ストレージ アカウントを作成する。ファイル共有を作成してファイルをコピーする", "is_correct": false}], "correct_indices": [0, 3], "n_correct": 2, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">要件：①5 TB のファイル（めったにアクセスされない）、②Azure Storage にコピー、③24 時間以内に取得可能、④コスト最小化。\n\n<strong>アーカイブ層の Blob コンテナー</strong>が要件を満たします。アーカイブ層は最低コストで、リハイドレーション（標準優先度）は最大 15 時間 → 24 時間以内の要件をクリア。\n\n正解 2 選：\n• <strong>選択肢 1</strong>：クール デフォルト アカウント + アーカイブ設定の BLOB コンテナー ✅\n• <strong>選択肢 4</strong>：ホット デフォルト アカウント + アーカイブ設定の BLOB コンテナー ✅\n\nどちらもアーカイブ層の BLOB コンテナーを使用するため、実際のデータはアーカイブ層に格納されます。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>汎用 v1 アカウント：</strong> 最新機能（ライフサイクル管理など）に制限あり。汎用 v2 より古い世代 ❌\n\n<strong>ファイル共有（Files）：</strong> ファイル共有には Cool/Archive 層がない。大量の低頻度ファイルには Blob が適切 ❌\n\n<strong>クール + ファイル共有：</strong> Files にアクセス層（Hot/Cool/Archive）の概念はない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">ストレージ アカウントの<strong>デフォルト アクセス層</strong>（Hot/Cool）と、<strong>個別 BLOB のアクセス層</strong>（Hot/Cool/Archive）は別の設定です。\n\nアカウントのデフォルトを Hot にしても、BLOB コンテナーレベルまたは個別 BLOB をアーカイブ層に設定できます。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>アクセス層</th><th>ストレージ コスト</th><th>アクセス コスト</th><th class=\"cc\">取得時間</th><th>低頻度 5 TB 向け</th></tr></thead><tbody><tr><td>Hot（ホット）</td><td>高</td><td>低</td><td class=\"cc\">即時</td><td>❌ コスト高</td></tr><tr><td>Cool（クール）</td><td>中</td><td>中</td><td class=\"cc\">即時</td><td>△</td></tr><tr><td>Cold（コールド）</td><td>低</td><td>中</td><td class=\"cc\">即時</td><td>△</td></tr><tr><td>Archive（アーカイブ）</td><td>最安</td><td>高</td><td class=\"cc\">最大 15 時間</td><td>✅ 24 時間以内 OK</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">「めったにアクセスしない + 24 時間以内に取得可 + コスト最小」= <strong>アーカイブ層</strong>。リハイドレーション時間（最大 15 時間）が 24 時間要件をクリアする。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#0072C6"}, {"num": 46, "id": "q46", "domain": "インフラストラクチャ設計", "question_text": "組織には 20 個の内部開発 Web API があります。\n\nまた、これらの API を使用する 10 個の Web アプリケーションを構築中です。Web アプリケーションと API の両方が会社の Microsoft Entra テナントに登録されており、API は Azure API Management を通じて公開されています。\n\nWeb アプリから Web API への未承認のリクエストをブロックするソリューションを推奨する必要があります。\n\nソリューションは以下の条件を満たす必要があります：\n\n・Microsoft Entra が生成したクレームを使用すること\n・構成と継続的な管理作業を最小限に抑えること\n\n次の文を完成させてください：\n\n「______________________________ を使用して、Web アプリが Web API にアクセスできるようにアクセス許可を付与する。」", "choices": [{"text": "Microsoft Entra ID", "is_correct": true}, {"text": "Azure API Management", "is_correct": false}, {"text": "Web API", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか — Microsoft Entra ID</div><div class=\"exp-block-body\">Q46 と Q47 は同じシナリオで「アクセス許可の付与」と「JWT 検証」を別々に問う連問です。\n\n<strong>「Web アプリが Web API にアクセスできるようにアクセス許可を付与する」</strong>\n\nこの操作は <strong>Microsoft Entra ID（アプリの登録）</strong>で行います：\n\n<code>Web アプリ（App Registration）</code>\n  → \"API のアクセス許可\" セクションで Web API を追加\n  → 管理者が同意（Admin Consent）を付与\n  → Entra ID が Web アプリに対して Web API へのスコープを承認\n\n<strong>仕組みの流れ：</strong>\n1. <code>Web アプリ</code> → Entra ID：「Web API にアクセスするトークンをください（client_credentials フロー）」\n2. <code>Entra ID</code> → Web アプリ：「はい、JWT アクセス トークンです（scope: api://xxxx/.default）」\n3. <code>Web アプリ</code> → API Management：「このJWT付きで API を呼びます」\n4. <code>API Management</code>：validate-jwt ポリシーでトークンを検証（← Q47 の正解）\n5. <code>API Management</code> → Web API：「認証 OK、リクエストを転送」</div></div>\n\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>B: Azure API Management：</strong>\nAPI Management は「アクセス許可の付与」ではなく「JWT トークンの検証」を担当します（Q47 の正解）。API Management はアプリに権限を与えることができません ❌\n\n<strong>C: Web API（バックエンド）：</strong>\nWeb API はアクセスを「受け取る」側です。他のアプリに対してアクセス許可を「付与する」権限はありません ❌</div></div>\n\n<div class=\"comp-s\"><div class=\"comp-l\">📊 Q46・Q47 の役割分担</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>役割</th><th>担当サービス</th><th>具体的な作業</th></tr></thead><tbody>\n<tr><td class=\"cc\">アクセス許可の定義・付与（Q46）</td><td class=\"cc\">Microsoft Entra ID</td><td class=\"cc\">アプリ登録でスコープ設定、管理者同意 ✅</td></tr>\n<tr><td>JWT アクセス トークン発行</td><td>Microsoft Entra ID</td><td>OAuth 2.0 トークン エンドポイント</td></tr>\n<tr><td>JWT トークンの検証（Q47）</td><td>Azure API Management</td><td>validate-jwt ポリシー</td></tr>\n<tr><td>実際の API ロジック処理</td><td>Web API（バックエンド）</td><td>ビジネス ロジック</td></tr>\n</tbody></table></div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">「Web アプリに Web API へのアクセス許可を付与」 ＝ <strong>Entra ID（アプリの登録）</strong>。「JWT トークンを検証して未承認リクエストをブロック」 ＝ <strong>API Management の validate-jwt ポリシー</strong>。この2つを混同しないこと。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory/develop/v2-permissions-and-consent\" target=\"_blank\" rel=\"noopener\">Microsoft ID プラットフォームのアクセス許可と同意</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#C50F1F"}, {"num": 47, "id": "q47", "domain": "インフラストラクチャ設計", "question_text": "組織には 20 個の内部開発 Web API があります。\n\nまた、これらの API を使用する 10 個の Web アプリケーションを構築中です。Web アプリケーションと API の両方が会社の Microsoft Entra テナントに登録されており、API は Azure API Management を通じて公開されています。\n\nWeb アプリから Web API への未承認のリクエストをブロックするソリューションを推奨する必要があります。\n\nソリューションは以下の条件を満たす必要があります：\n\n・Microsoft Entra が生成したクレームを使用すること\n・構成と継続的な管理作業を最小限に抑えること\n\n次の文を完成させてください：\n\n「______________________________ を使用して、JSON Web Token (JWT) 検証ポリシーを構成する。」", "choices": [{"text": "Microsoft Entra ID", "is_correct": false}, {"text": "Azure API Management", "is_correct": true}, {"text": "Web API", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">Q46 の続き。Web アプリから送られてきた JWT アクセス トークンを検証するのは <strong>Azure API Management</strong> です。\n\nAPI Management のインバウンド ポリシーとして「validate-jwt」ポリシーを設定することで：\n• Entra ID が発行した有効な JWT トークンをチェック\n• 無効なトークン → 401 Unauthorized を返す\n• Web API のコードを変更せずに認証を追加できる</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Microsoft Entra ID：</strong> トークンを「発行」するが「検証」は行わない（検証はリソース側が実施）❌\n\n<strong>Web API：</strong> コード側でトークン検証もできるが、API Management での検証の方が「コード変更なし」という要件に適合 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">JWT トークンの流れ：\n1. Web アプリ → Entra ID：「トークンをください」\n2. Entra ID → Web アプリ：「はい、JWT トークンです」（トークン発行）\n3. Web アプリ → API Management：「このトークンを使って API を呼びます」\n4. API Management → Entra ID：「このトークンは有効ですか？」（validate-jwt ポリシー）\n5. API Management → Web API：「OK、通してよし」</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">JWT トークン検証 = <strong>API Management の validate-jwt ポリシー</strong>。Web API のコードを変更せずに認証を追加できる。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/api-management/api-management-access-restriction-policies#ValidateJWT\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/api-management/api-management-access-restriction-policies#ValidateJWT</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#C50F1F"}, {"num": 48, "id": "q48", "domain": "ID・ガバナンス・監視", "question_text": "組織のインフラストラクチャは以下の通りです：\n\nAzure：\n・Subscription1 という Azure サブスクリプション\n・20 個の Azure Web アプリ\n\nオンプレミス データ センター：\n・Active Directory ドメイン\n・Microsoft Entra Connect を実行するサーバー\n・Server1 という Linux コンピューター\n\nオンプレミスの Active Directory ドメインは Subscription1 にある Azure AD テナントと同期しています。\n\nServer1 は Linux であるため、Active Directory ドメインに参加できません。\n\nServer1 が Subscription1 のリソース（Azure Web アプリなど）にアクセスするために Azure AD 認証を使用できるように、Active Directory ベースの認証が Server1 に対して有効になっていることを確認する必要があります。\n\n推奨すべきソリューションはどれですか？", "choices": [{"text": "仮想マシン上の Active Directory Domain Services ロール", "is_correct": false}, {"text": "Microsoft Entra Domain Services", "is_correct": true}, {"text": "Microsoft Entra アプリケーション プロキシ", "is_correct": false}, {"text": "Azure VPN ゲートウェイ", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">要件：Linux サーバー（Server1）が AD ドメインに参加できず、オンプレミス AD と Azure AD が同期されている。Linux を AD ドメインに参加させたい。\n\n<strong>Microsoft Entra Domain Services（旧 Azure AD Domain Services）</strong>：\n• クラウドマネージドの AD ドメイン サービス\n• LDAP、Kerberos、NTLM 認証をサポート\n• Linux サーバーのドメイン参加に対応\n• オンプレミス AD のユーザーが同期されるため、既存アカウントで認証可能</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>VM 上の AD DS：</strong> 機能的には対応するが、IaaS（VM 管理）が必要 → 要件にある最小管理作業に反する ❌\n\n<strong>Entra アプリケーション プロキシ：</strong> オンプレミス Web アプリの公開サービス。ドメイン参加とは無関係 ❌\n\n<strong>Azure VPN ゲートウェイ：</strong> オンプレミスと Azure VNet の接続。ドメイン参加の直接的な機能はない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">Entra Domain Services と VM 上の AD DS の違い：\n• <strong>Entra Domain Services</strong>：マネージド PaaS。VM 管理不要。オンプレミス AD との完全な双方向信頼は不可（一方向同期のみ）\n• <strong>VM 上の AD DS</strong>：完全な AD 機能。双方向信頼可能。ただし VM 管理が必要（IaaS）\n\nLinux のドメイン参加 + 最小管理 → Entra Domain Services を優先。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">サービス</th><th>Linux ドメイン参加</th><th>管理作業</th><th>オンプレ AD との同期</th></tr></thead><tbody><tr><td class=\"cc\">Entra Domain Services</td><td>✅</td><td>最小（PaaS）✅</td><td>✅ 一方向同期</td></tr><tr><td class=\"cc\">VM 上の AD DS（IaaS）</td><td>✅</td><td>高い（VM 管理）</td><td>✅ 双方向信頼可</td></tr><tr><td class=\"cc\">Entra ID（クラウドのみ）</td><td>❌ 従来 AD 不可</td><td>最小</td><td>✅（Connect 経由）</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">Linux サーバーを AD ドメインに参加させたい + 最小管理 → <strong>Entra Domain Services</strong>（PaaS、VM 管理不要）。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory-domain-services/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/active-directory-domain-services/overview</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#7719AA"}, {"num": 49, "id": "q49", "domain": "ID・ガバナンス・監視", "question_text": "Azure Key Vault を使用してデータ暗号化キーを保存する複数の Azure App Service Web アプリがあります。\n\nさまざまな部門からこれらの Web アプリのサポートに関する具体的なリクエストが届いています。\n\n各部門のリクエストに最も適切な Azure サービスを推奨する必要があります。\n\nセキュリティ部門のリクエスト：\n「最高権限管理者を含むすべての管理者が、Azure Key Vault 暗号化キーにアクセスする際に承認を得る必要があるようにしてほしい。」\n\nセキュリティ部門のリクエストに対して推奨すべきサービスはどれですか？", "choices": [{"text": "Microsoft Entra Privileged Identity Management (PIM)", "is_correct": true}, {"text": "Microsoft Entra Connect", "is_correct": false}, {"text": "Microsoft Entra Identity Protection", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">要件：「Key Vault への管理者アクセスについて、最高権限の管理者でも必ず承認ワークフローを経ること」。\n\n<strong>Microsoft Entra PIM（Privileged Identity Management）</strong>：\n• Azure リソースへの特権アクセスの Just-in-Time（JIT）管理\n• アクセス要求 → 承認ワークフロー → 時間制限付き付与\n• 管理者も例外なく承認プロセスを経る必要がある\n• すべてのアクセス履歴が監査ログに記録される</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Entra Connect：</strong> オンプレミス AD と Entra ID の同期ツール。Key Vault の特権管理とは無関係 ❌\n\n<strong>Entra Identity Protection：</strong> 不審なサインインの検出・リスク ポリシー。特権アクセス承認ではない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">PIM と アクセス レビューの違い：\n• <strong>PIM</strong>：特権ロールへの JIT アクセス（使う前に要求→承認→時間制限付きで付与）\n• <strong>アクセス レビュー</strong>：定期的に「このアクセス権はまだ必要か？」を確認して不要なら削除\n\n「使う前に承認が必要」= PIM、「定期確認して削除」= アクセス レビュー。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th
