div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Entra Connect：</strong> AD 同期ツール。Key Vault アクセスとは無関係 ❌\n\n<strong>Entra Identity Protection：</strong> リスクベースのアクセス制御。Key Vault の認証方法ではない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">マネージド ID の 2 種類を区別しましょう：\n• <strong>システム割り当て</strong>：リソース（Web アプリ）に紐づく。リソース削除で自動削除。1 リソース : 1 ID\n• <strong>ユーザー割り当て</strong>：独立した ID リソース。複数のリソースから共有可能\n\nどちらも資格情報管理は不要で、Key Vault アクセスに使えます。</div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">「コードに認証情報を書かずに Key Vault にアクセス」= <strong>マネージド ID</strong>。Azure が自動管理するため、資格情報の更新・管理が一切不要。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory/managed-identities-azure-resources/overview\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/active-directory/managed-identities-azure-resources/overview</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#7719AA"}, {"num": 51, "id": "q51", "domain": "ID・ガバナンス・監視", "question_text": "Azure Key Vault を使用してデータ暗号化キーを保存する複数の Azure App Service Web アプリがあります。\n\nさまざまな部門からこれらの Web アプリのサポートに関する具体的なリクエストが届いています。\n\n品質保証 (QA) 部門のリクエスト：\n「ユーザーが Active Directory フェデレーション サービス (AD FS) を使用してサインインしたり、Azure AD とオンプレミス AD FS を同期したりできるようにしてほしい。」\n\nQA 部門のリクエストに対して推奨すべきサービスはどれですか？", "choices": [{"text": "Microsoft Entra Privileged Identity Management (PIM)", "is_correct": false}, {"text": "Azure マネージド ID", "is_correct": false}, {"text": "Microsoft Entra Connect", "is_correct": true}, {"text": "Microsoft Entra Identity Protection", "is_correct": false}], "correct_indices": [2], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか — Microsoft Entra Connect</div><div class=\"exp-block-body\">QA 部門の要件：「ユーザーが <strong>AD FS を使用してサインイン</strong>したり、<strong>Azure AD とオンプレミス AD FS を同期</strong>したりできるようにしてほしい」\n\n<strong>Microsoft Entra Connect（旧 Azure AD Connect）</strong> がこれを実現します：\n\n<code>オンプレミス AD</code> ←→ <strong>Entra Connect</strong> ←→ <code>Entra ID（Azure AD）</code>\n                              ↕\n                    <code>AD FS（フェデレーション）</code>\n\nEntra Connect は3つのサインイン方法をサポート：\n1. <strong>パスワード ハッシュ同期（PHS）</strong>：パスワードのハッシュを Entra ID に同期\n2. <strong>パススルー認証（PTA）</strong>：認証リクエストをオンプレミス AD に委譲\n3. <strong>フェデレーション（AD FS 連携）</strong>：AD FS を介した SSO ← QA 部門の要件に合致</div></div>\n\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>A: Microsoft Entra PIM：</strong>\n特権 ID 管理（JIT アクセス）のサービスです。AD FS との連携や AD 同期とは全く別の機能です ❌\n\n<strong>B: Azure マネージド ID：</strong>\nAzure リソース（App Service など）が他の Azure サービスに認証するための ID です。ユーザーのサインイン方法や AD 同期とは無関係です ❌\n\n<strong>D: Microsoft Entra Identity Protection：</strong>\n不審なサインインや漏洩した資格情報を検出するリスクベースの保護サービスです。AD 同期ではありません ❌</div></div>\n\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント（Q49〜Q51 の連問）</div><div class=\"exp-block-body\">Q49〜Q51 は同じシナリオで3部門それぞれの要件に最適なサービスを問う問題です：\n\n• Q49（セキュリティ部門）：「最高権限管理者でも承認が必要」 → <strong>Entra PIM</strong>（JIT アクセス管理）\n• Q50（開発部門）：「資格情報を管理せずにキーを取得」 → <strong>マネージド ID</strong>（コード内に認証情報不要）\n• Q51（QA 部門）：「AD FS 連携・AD 同期」 → <strong>Entra Connect</strong>（オンプレミス AD との同期）\n\n各選択肢が「どの部門の要件に対応するか」を正確に把握することが重要です。</div></div>\n\n<div class=\"comp-s\"><div class=\"comp-l\">📊 Entra ID 関連サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>サービス</th><th>目的</th><th>主な用途</th></tr></thead><tbody>\n<tr><td class=\"cc\">Entra Connect</td><td>オンプレミス AD と Entra ID の同期・フェデレーション</td><td>ハイブリッド ID 基盤 ✅ Q51</td></tr>\n<tr><td>Entra PIM</td><td>特権ロールの JIT アクセス管理</td><td>管理者権限の一時付与 ✅ Q49</td></tr>\n<tr><td>マネージド ID</td><td>Azure リソースの認証（資格情報不要）</td><td>Key Vault・Storage へのアクセス ✅ Q50</td></tr>\n<tr><td>Identity Protection</td><td>リスクベースのアクセス条件制御</td><td>異常サインイン検出・ブロック</td></tr>\n</tbody></table></div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">オンプレミス AD と Entra ID の同期 ＝ <strong>Microsoft Entra Connect</strong>。AD FS によるフェデレーション認証も Entra Connect で設定する。「Azure AD Connect」という旧名称でも同じサービスを指す。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/active-directory/hybrid/whatis-azure-ad-connect\" target=\"_blank\" rel=\"noopener\">Microsoft Entra Connect とは</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#7719AA"}, {"num": 52, "id": "q52", "domain": "ID・ガバナンス・監視", "question_text": "以下の動作を提供する Azure Policy を設計する必要があります：\n\n・新しく作成されたリソースに対して、そのリソースがデプロイされたリソース グループのタグとタグ値を自動的に適用すること\n・既存のリソースに対して、タグとタグ値がリソース グループのものと一致しているか評価すること\n・非準拠のリソースに対して、不足しているタグと値を追加するための修復タスクを自動的に開始すること\n\n推奨すべき Azure Policy 効果 (effect) はどれですか？", "choices": [{"text": "Append", "is_correct": false}, {"text": "EnforceOPAConstraint", "is_correct": false}, {"text": "EnforceRegoPolicy", "is_correct": false}, {"text": "Modify", "is_correct": true}], "correct_indices": [3], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">要件：①新規リソース作成時に自動的にリソース グループのタグを継承、②既存リソースへの修復（自動タグ追加）。\n\n<strong>Azure Policy の Modify 効果</strong>：\n• 新規リソースのプロパティ（タグなど）を自動変更・追加\n• 修復タスクにより既存リソースにも適用可能\n• リソース グループのタグ値を取得して継承するポリシーがサポートされている</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>Append：</strong> 新規リソースへの追加フィールド設定のみ。既存リソースへの修復タスクはサポートしない ❌\n\n<strong>EnforceOPAConstraint：</strong> OPA（Open Policy Agent）Gatekeeper を使用する Kubernetes 専用の効果。Azure VM には使えない ❌\n\n<strong>EnforceRegoPolicy：</strong> Rego ポリシー言語を使う Kubernetes 向け。同上 ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">Append と Modify の違いが試験頻出：\n• <strong>Append</strong>：新規リソース作成時のみ適用（フィールド追加）。修復タスクなし\n• <strong>Modify</strong>：新規リソース + 修復タスクで既存リソースにも適用。タグ・プロパティの変更に使う\n\n「既存リソースにも適用したい（修復）」= 必ず Modify を選ぶ。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>Policy Effect</th><th>新規リソースへの適用</th><th class=\"cc\">既存リソースへの修復</th><th>主な用途</th></tr></thead><tbody><tr><td>Append</td><td>✅ フィールド追加</td><td class=\"cc\">❌</td><td>配列フィールドの追加</td></tr><tr><td>Modify</td><td>✅ プロパティ変更</td><td class=\"cc\">✅ 修復タスク対応</td><td>タグ追加・変更 ✅</td></tr><tr><td>DeployIfNotExists</td><td>✅ 設定がない場合にデプロイ</td><td class=\"cc\">✅ 修復タスク対応</td><td>診断設定・子リソースの追加</td></tr><tr><td>Deny</td><td>✅ 作成ブロック</td><td class=\"cc\">❌</td><td>非準拠リソースの防止</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">「既存リソースへの自動タグ修復」= <strong>Modify 効果</strong>。Append は新規のみ、修復タスクなし。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effects\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effects</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#7719AA"}, {"num": 53, "id": "q53", "domain": "ID・ガバナンス・監視", "question_text": "以下の動作を提供する Azure Policy を設計する必要があります：\n\n・新しく作成されたリソースに対して、そのリソースがデプロイされたリソース グループのタグとタグ値を自動的に適用すること\n・既存のリソースに対して、タグとタグ値がリソース グループのものと一致しているか評価すること\n・非準拠のリソースに対して、不足しているタグと値を追加するための修復タスクを自動的に開始すること\n\nポリシーの実装は最小権限の原則を守る必要があります。\n\nこのポリシーの修復タスクに必要な Microsoft Entra オブジェクトとロールの推奨事項を完成させてください。", "choices": [{"text": "Contributor ロールを持つマネージド ID", "is_correct": false}, {"text": "User Access Administrator ロールを持つマネージド ID", "is_correct": true}, {"text": "Contributor ロールを持つサービス プリンシパル", "is_correct": false}, {"text": "User Access Administrator ロールを持つサービス プリンシパル", "is_correct": false}], "correct_indices": [1], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">Azure Policy の Modify 効果で修復タスクを実行するには、マネージド ID が必要です。\n\n<strong>Contributor ロールを持つマネージド ID</strong>：\n• マネージド ID：Azure が自動管理。資格情報管理不要（最小作業）✅\n• Contributor ロール：タグを追加・変更（リソースのプロパティ変更）するために必要\n\n注：User Access Administrator は RBAC ロール割り当てを管理するもの。タグ変更には不要。</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>User Access Administrator のマネージド ID：</strong> RBAC ロールの割り当て変更に使う権限。タグの追加には Contributor が必要（User Access Administrator は過剰）❌\n\n<strong>Contributor のサービス プリンシパル：</strong> 機能的には動作するが、証明書/シークレットの管理が必要 → マネージド ID の方が管理作業が少ない ❌\n\n<strong>User Access Administrator のサービス プリンシパル：</strong> 上記 2 つの問題を兼ね備える ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">ロールの選択：\n• <strong>Contributor</strong>：リソースの作成・変更・削除（タグ変更含む）。ロール割り当ての変更は不可\n• <strong>Owner</strong>：Contributor + ロール割り当て変更\n• <strong>User Access Administrator</strong>：ロール割り当ての管理のみ\n\nタグ変更 = リソースのプロパティ変更 → Contributor が適切（Owner は過剰）。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">選択肢</th><th>資格情報管理</th><th>タグ変更権限</th><th>推奨度</th></tr></thead><tbody><tr><td class=\"cc\">マネージド ID + Contributor</td><td>不要 ✅</td><td>✅</td><td>✅ 推奨</td></tr><tr><td class=\"cc\">マネージド ID + User Access Admin</td><td>不要 ✅</td><td>❌ 不十分</td><td>❌</td></tr><tr><td class=\"cc\">サービス プリンシパル + Contributor</td><td>必要 ❌</td><td>✅</td><td>❌</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">Policy 修復タスクの ID：<strong>マネージド ID</strong>（資格情報不要）+ <strong>Contributor ロール</strong>（タグ変更に必要）。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#7719AA"}, {"num": 54, "id": "q54", "domain": "インフラストラクチャ設計", "question_text": "Azure Kubernetes Service (AKS) クラスターで実行されるコンテナーで構成される App1 というアプリケーションをデプロイする計画があります。AKS クラスターは 4 つの Azure リージョンにまたがってデプロイされます。\n\n更新されたコンテナー イメージがすべての AKS クラスターに自動的にレプリケートされるストレージ ソリューションを推奨する必要があります。\n\n推奨すべきストレージ ソリューションはどれですか？", "choices": [{"text": "Premium SKU の Azure Container Registry", "is_correct": true}, {"text": "Azure Cache for Redis", "is_correct": false}, {"text": "geo 冗長ストレージ (GRS) アカウント", "is_correct": false}, {"text": "Azure Content Delivery Network (CDN)", "is_correct": false}], "correct_indices": [0], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか — Premium SKU の Azure Container Registry</div><div class=\"exp-block-body\">要件：4 つの Azure リージョンにまたがる AKS クラスターで、更新されたコンテナー イメージが<strong>自動的にすべてのクラスターにレプリケート</strong>される。\n\n<strong>Azure Container Registry（ACR）Premium SKU の Geo レプリケーション</strong>がこれを実現します：\n\n<code>開発者</code>\n    ↓ docker push（1回だけ！）\n<code>ACR プライマリ リージョン（例：East US）</code>\n    ↓ 自動レプリケーション\n  ┌─────────────────────────────┐\n<code>ACR レプリカ（West US）</code>  <code>ACR レプリカ（Japan East）</code>  <code>ACR レプリカ（West Europe）</code>\n    ↑                              ↑                              ↑\n<code>AKS クラスター A</code>   <code>AKS クラスター B</code>   <code>AKS クラスター C</code>   <code>AKS クラスター D</code>\n\nメリット：\n• 各 AKS クラスターが<strong>最も近いリージョンのレプリカ</strong>からイメージを取得（低レイテンシ）\n• イメージの更新が<strong>自動的に全リージョンに伝播</strong>\n• <strong>Geo レプリケーションは Premium SKU のみ</strong>利用可能</div></div>\n\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>B: Azure Cache for Redis：</strong>\nRedis はインメモリ キャッシュ（セッション、よく使うデータのキャッシュ）です。コンテナー イメージの配布と管理には全く使えません ❌\n\n<strong>C: geo 冗長ストレージ（GRS）アカウント：</strong>\nGRS はブロック、テーブル、キューなどの Azure Storage データをレプリケートします。Docker コンテナー イメージの標準プロトコル（OCI/Docker Registry API）には対応していません ❌\n\n<strong>D: Azure CDN：</strong>\nCDN は静的 Web コンテンツ（HTML、JS、CSS、画像など）をキャッシュして配信します。Docker イメージ プロトコルには対応しておらず、コンテナー レジストリとして機能しません ❌</div></div>\n\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">ACR の SKU 選択が重要です：\n• <strong>Basic</strong>：開発・テスト専用。ストレージ 10 GB。Geo レプリケーション ❌\n• <strong>Standard</strong>：本番環境の基本。ストレージ 100 GB。Geo レプリケーション ❌\n• <strong>Premium</strong>：Geo レプリケーション ✅、プライベート エンドポイント ✅、専用データ エンドポイント ✅\n\n「マルチリージョン AKS」「コンテナー イメージの自動レプリケーション」というキーワードが出たら、<strong>ACR Premium が唯一の正解</strong>です。</div></div>\n\n<div class=\"comp-s\"><div class=\"comp-l\">📊 Azure Container Registry SKU 比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th>SKU</th><th>Geo レプリケーション</th><th>プライベート EP</th><th>ストレージ</th><th>想定用途</th></tr></thead><tbody>\n<tr><td>Basic</td><td>❌</td><td>❌</td><td>10 GB</td><td>開発・テスト</td></tr>\n<tr><td>Standard</td><td>❌</td><td>❌</td><td>100 GB</td><td>本番（単一リージョン）</td></tr>\n<tr><td class=\"cc\">Premium</td><td>✅ <strong>正解</strong></td><td>✅</td><td>500 GB</td><td>マルチリージョン・エンタープライズ</td></tr>\n</tbody></table></div></div>\n\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">マルチリージョン AKS へのコンテナー イメージ自動配布 ＝ <strong>ACR Premium SKU の Geo レプリケーション</strong>。Basic/Standard SKU は Geo レプリケーション非対応。Azure Cache for Redis や CDN はコンテナー レジストリではない。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/container-registry/container-registry-geo-replication\" target=\"_blank\" rel=\"noopener\">Azure Container Registry の geo レプリケーション</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#C50F1F"}, {"num": 55, "id": "q55", "domain": "ID・ガバナンス・監視", "question_text": "1,000 台の仮想マシンと Workspace1 という Log Analytics ワークスペースを含む Azure サブスクリプションがあります。\n\n仮想マシンからカスタム JSON ログ データを収集し、Workspace1 内のカスタム テーブルにデータを格納する計画があります。\n\nログ データが Azure プライベート ネットワーク経由でのみ取り込まれるようにする必要があります。\n\n推奨すべきソリューションはどれですか？", "choices": [{"text": "Workspace1 のリンク済みストレージ アカウント", "is_correct": false}, {"text": "Azure Peering Service 接続", "is_correct": false}, {"text": "Service Connector", "is_correct": false}, {"text": "Azure Monitor プライベート リンク スコープ (AMPLS)", "is_correct": true}], "correct_indices": [3], "n_correct": 1, "exp_html": "<div class=\"exp-sections\">\n<div class=\"exp-block exp-correct\"><div class=\"exp-block-label\">✅ なぜ正解なのか</div><div class=\"exp-block-body\">要件：1,000 台の VM から Log Analytics ワークスペースへのカスタム JSON ログ データを<strong>プライベート ネットワーク経由</strong>で収集する。\n\n<strong>Azure Monitor プライベート リンク スコープ（AMPLS）</strong>：\n• Azure Monitor リソース（Log Analytics）への接続をプライベート エンドポイント経由に制限\n• インターネットを経由せず、Azure バックボーン ネットワークでデータを転送\n• 1,000 台 VM → プライベート接続 → Log Analytics ワークスペースを実現</div></div>\n<div class=\"exp-block exp-wrong\"><div class=\"exp-block-label\">❌ なぜ他の選択肢は不正解か</div><div class=\"exp-block-body\"><strong>リンク済みストレージ アカウント：</strong> Log Analytics の古いアーキテクチャでの中間ストレージ。プライベート接続の制御ではない ❌\n\n<strong>Azure Peering Service：</strong> ISP を介した Azure への接続の最適化（企業ネットワーク向け）。VM → Log Analytics の内部接続には使わない ❌\n\n<strong>Service Connector：</strong> App Service や Container Apps から Azure サービスへの接続を簡素化するツール。VM から Log Analytics への接続には使わない ❌</div></div>\n<div class=\"exp-block exp-trap\"><div class=\"exp-block-label\">⚠️ 間違えやすいポイント</div><div class=\"exp-block-body\">AMPLS の仕組みを理解しましょう：\n1. AMPLS リソースを作成\n2. Log Analytics ワークスペースを AMPLS に追加\n3. VNet にプライベート エンドポイントを作成して AMPLS に接続\n4. VM が Log Analytics に送るデータはプライベート エンドポイント経由に制限\n\nこれにより「カスタム ログをインターネットを経由せず安全に送れる」環境になります。</div></div>\n<div class=\"comp-s\"><div class=\"comp-l\">📊 サービス比較</div><div class=\"ctw\"><table class=\"ct\"><thead><tr><th class=\"cc\">ソリューション</th><th>プライベート接続</th><th>大規模（1,000 VM）</th><th>用途</th></tr></thead><tbody><tr><td class=\"cc\">AMPLS（Azure Monitor プライベート リンク スコープ）</td><td>✅</td><td>✅</td><td>Azure Monitor リソースへのプライベート接続 ✅</td></tr><tr><td class=\"cc\">リンク済みストレージ</td><td>△</td><td>❌</td><td>Log Analytics の古い中間ストレージ</td></tr><tr><td class=\"cc\">Private Endpoint（個別）</td><td>✅</td><td>△ 管理複雑</td><td>個別サービスへの接続</td></tr></tbody></table></div></div>\n<div class=\"exp-block exp-key\"><div class=\"exp-block-label\">🔑 試験の核心ポイント</div><div class=\"exp-block-body\">「VM → Log Analytics をプライベート接続」= <strong>Azure Monitor プライベート リンク スコープ（AMPLS）</strong>。インターネットを経由しない安全なログ送信を実現。</div></div>\n<div class=\"refs-s\"><div class=\"refs-l\">📚 Microsoft 公式ドキュメント</div><ul class=\"refs-ul\"><li><a href=\"https://learn.microsoft.com/en-us/azure/azure-monitor/logs/private-link-security\" target=\"_blank\" rel=\"noopener\">https://learn.microsoft.com/en-us/azure/azure-monitor/logs/private-link-security</a></li></ul></div>\n</div>", "svg": "", "domain_color": "#7719AA"}];
const TOTAL = QUESTIONS.length;
const LTR = 'ABCDEFGHIJKLMNOP';
let state={}, filter='all', multiSel={};
function initState(){
  const chk=document.getElementById('chk-shuf');
  const doShuf=chk&&chk.checked;
  state={};multiSel={};displayChoices={};
  QUESTIONS.forEach(q=>{
    state[q.id]={answered:false,correct:false};
    displayChoices[q.id]=doShuf?shuf([...q.choices]):[...q.choices];
  });
}
function filtered(){return filter==='all'?QUESTIONS:QUESTIONS.filter(q=>q.domain===filter);}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){
  const qs=filtered();
  document.getElementById('qwrap').innerHTML=qs.map(q=>renderQ(q)).join('');
  qs.forEach(q=>{if(state[q.id]?.answered)restoreQ(q);});
  updateProgress();
}
function renderQ(q){
  const isMulti=q.n_correct>1;
  const mbadge=isMulti?`<span class="mbadge">複数選択 (${q.n_correct}つ)</span>`:'';
  const mhint=isMulti?`<div class="multi-hint">⚡ ${q.n_correct}つの選択肢を選んでください</div>`:'';
  const choices=(displayChoices[q.id]||q.choices).map((c,i)=>`<button class="cbtn" id="c_${q.id}_${i}" onclick="onChoice('${q.id}',${i})"><span class="cltr">${LTR[i]}</span><span>${escH(c.text)}</span></button>`).join('');
  const sub=isMulti?`<button class="submit-btn" id="sub_${q.id}" onclick="submitMulti('${q.id}')">✅ 回答を確定する</button>`:'';
  return `<div class="qcard" id="card_${q.id}"><div class="qh"><span class="qnum">問 ${q.num}</span><span class="dbadge" style="background:${q.domain_color||'#0072C6'}">${q.domain}</span>${mbadge}</div><div class="qbody"><p class="qtext">${escH(q.question_text)}</p></div>${mhint}<div class="choices">${choices}</div>${sub}<div class="expanel" id="exp_${q.id}"><div id="rbadge_${q.id}"></div>${q.exp_html}</div></div>`;
}
function onChoice(qid,idx){
  if(state[qid]?.answered)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  if(q.n_correct>1){
    if(!multiSel[qid])multiSel[qid]=new Set();
    const btn=document.getElementById(`c_${qid}_${idx}`);
    if(multiSel[qid].has(idx)){multiSel[qid].delete(idx);btn.classList.remove('multi-selected');}
    else{if(multiSel[qid].size>=q.n_correct)return;multiSel[qid].add(idx);btn.classList.add('multi-selected');}
    const sub=document.getElementById(`sub_${qid}`);
    if(sub)sub.style.display=multiSel[qid].size>=q.n_correct?'block':'none';
  }else{
    state[qid]={answered:true,correct:(displayChoices[qid]||q.choices)[idx].is_correct};
    applyAnswer(q,[idx]);
  }
}
function submitMulti(qid){
  if(state[qid]?.answered)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  const sel=[...(multiSel[qid]||new Set())];
  const cset=new Set((displayChoices[qid]||q.choices).map((c,i)=>c.is_correct?i:-1).filter(i=>i>=0));
  state[qid]={answered:true,correct:sel.length===cset.size&&sel.every(i=>cset.has(i))};
  applyAnswer(q,sel);
}
function applyAnswer(q,sel){
  const sset=new Set(sel);const isOk=state[q.id].correct;
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);if(!btn)return;
    btn.disabled=true;btn.classList.remove('multi-selected');
    if(sset.has(i))btn.classList.add(c.is_correct?'correct':'wrong');
    if(c.is_correct&&!sset.has(i))btn.classList.add('reveal');
  });
  document.getElementById(`card_${q.id}`).classList.add(isOk?(q.n_correct>1?'multi-ok':'ok'):'ng');
  document.getElementById(`rbadge_${q.id}`).innerHTML=isOk
    ?`<div class="rbadge ${q.n_correct>1?'multi-ok':'ok'}">${q.n_correct>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説で正解・理由を確認しましょう</div>';
  document.getElementById(`exp_${q.id}`).style.display='block';
  const sub=document.getElementById(`sub_${q.id}`);if(sub)sub.style.display='none';
  updateProgress();
  setTimeout(()=>document.getElementById(`exp_${q.id}`).scrollIntoView({behavior:'smooth',block:'nearest'}),120);
}
function restoreQ(q){
  const s=state[q.id];if(!s?.answered)return;
  (displayChoices[q.id]||q.choices).forEach((c,i)=>{
    const btn=document.getElementById(`c_${q.id}_${i}`);if(!btn)return;
    btn.disabled=true;if(c.is_correct)btn.classList.add(s.correct?'correct':'reveal');
  });
  document.getElementById(`card_${q.id}`).classList.add(s.correct?(q.n_correct>1?'multi-ok':'ok'):'ng');
  const exp=document.getElementById(`exp_${q.id}`);if(exp)exp.style.display='block';
  const badge=document.getElementById(`rbadge_${q.id}`);
  if(badge)badge.innerHTML=s.correct
    ?`<div class="rbadge ${q.n_correct>1?'multi-ok':'ok'}">${q.n_correct>1?'正解！（複数選択）':'正解！'}</div>`
    :'<div class="rbadge ng">不正解 — 解説で正解・理由を確認しましょう</div>';
}
function filterDomain(d){
  filter=d;
  document.querySelectorAll('.dbtn').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  render();window.scrollTo({top:0});
}
function updateProgress(){
  const ans=Object.values(state).filter(s=>s.answered).length;
  const cor=Object.values(state).filter(s=>s.correct).length;
  document.getElementById('pbar').style.width=(ans/TOTAL*100)+'%';
  document.getElementById('hdrScore').textContent=`${cor}/${TOTAL}`;
  document.getElementById('hdrPct').textContent=`正解率 ${ans>0?Math.round(cor/ans*100):0}%`;
}
function showResults(){
  const cor=Object.values(state).filter(s=>s.correct).length;
  const pct=Math.round(cor/TOTAL*100);
  const ds={};
  QUESTIONS.forEach(q=>{
    if(!ds[q.domain])ds[q.domain]={t:0,c:0,color:q.domain_color||'#333'};
    ds[q.domain].t++;if(state[q.id]?.correct)ds[q.domain].c++;
  });
  document.getElementById('mscore').textContent=`${cor}/${TOTAL}`;
  document.getElementById('mpct').textContent=`正解率 ${pct}%`;
  const SVG_TROPHY='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 21 12 17 16 21"/><line x1="12" y1="17" x2="12" y2="11"/><path d="M18 6H6l1-4h10l1 4z"/><path d="M6 6c0 7 6 11 6 11s6-4 6-11"/></svg>';
  const SVG_UP='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>';
  const SVG_ZAP='<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';
  const SVG_BOOK='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
  let icon=SVG_BOOK,msg='';
  if(pct>=80){icon=SVG_TROPHY;msg='合格圏内！本番でも自信を持って！';}
  else if(pct>=70){icon=SVG_UP;msg='あと少し！弱点ドメインを集中的に復習しよう。';}
  else if(pct>=50){icon=SVG_ZAP;msg='「間違えやすいポイント」を重点的に確認しよう。';}
  else{icon=SVG_BOOK;msg='各解説の「なぜ正解か」「なぜ不正解か」をしっかり読もう！';}
  document.getElementById('micon').innerHTML=icon;
  document.getElementById('mmsg').textContent=msg;
  document.getElementById('mdomains').innerHTML=Object.entries(ds).map(([d,s])=>{
    const p=Math.round(s.c/s.t*100);
    return `<div class="m-ditem"><div class="m-dname">${d}</div><div class="m-dval" style="color:${s.color}">${s.c}/${s.t} <span style="font-size:13px;font-weight:500;color:#888">(${p}%)</span></div></div>`;
  }).join('');
  document.getElementById('modal').classList.add('show');
}
function modalClose(e){if(!e||e.target.id==='modal')document.getElementById('modal').classList.remove('show');}
function resetAll(){document.getElementById('modal').classList.remove('show');initState();render();window.scrollTo({top:0,behavior:'smooth'});}
window.addEventListener('scroll',()=>document.getElementById('scrollTop').classList.toggle('show',window.scrollY>400));
initState();render();
</script>
