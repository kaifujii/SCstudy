<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyDeck — 資格学習プラットフォーム</title>
<link rel="manifest" href="sc/manifest.json">
<meta name="theme-color" content="#0c1018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyDeck">
<link rel="apple-touch-icon" href="sc/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800;9..40,900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   StudyDeck — Bold Typography Dark (案B)
   ================================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0c1018;
  --surface: #111827;
  --border:  rgba(255,255,255,0.07);
  --text:    #f1f5f9;
  --muted:   rgba(255,255,255,0.38);
  --sc:      #3f52c4;
  --sc-lt:   rgba(63,82,196,0.15);
  --sc-text: #8b9ef8;
  --az:      #0078d4;
  --az-lt:   rgba(0,120,212,0.15);
  --az-text: #5ab4f8;
  --green:   #2d7a4f;
  --green-lt:rgba(74,222,128,0.12);
  --green-text:#4ade80;
  --amber:   #b45309;
  --amber-lt:rgba(245,158,11,0.12);
  --amber-text:#fbbf24;
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans JP', -apple-system, sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(63,82,196,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(0,120,212,0.08) 0%, transparent 50%);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ===== HEADER ===== */
header {
  height: 54px;
  padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  background: rgba(12,16,24,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-text { display: flex; flex-direction: column; gap: 1px; }
.logo-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.48rem; color: rgba(255,255,255,0.28);
  letter-spacing: 3.5px; text-transform: uppercase; font-weight: 500;
}
.logo-main {
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem; font-weight: 900; color: #fff; letter-spacing: -0.5px;
}
.header-right { display: flex; align-items: center; gap: 10px; }
#dark-toggle {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 5px; width: 32px; height: 32px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
#dark-toggle:hover { background: rgba(255,255,255,0.1); }

/* ===== MAIN ===== */
main { max-width: 640px; margin: 0 auto; padding: 40px 16px 80px; }

/* ===== HERO ===== */
.hero { margin-bottom: 36px; }
.hero-eyebrow {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.55rem; font-weight: 700; letter-spacing: 4px;
  text-transform: uppercase; color: var(--sc-text);
  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
}
.hero-eyebrow::before {
  content: ''; display: block; width: 18px; height: 1.5px;
  background: var(--sc-text); flex-shrink: 0;
}
.hero-title {
  font-family: 'DM Sans', sans-serif;
  font-size: 2rem; font-weight: 900; color: #fff;
  letter-spacing: -0.04em; line-height: 1.15; margin-bottom: 10px;
}
.hero-sub { font-size: 0.84rem; color: var(--muted); line-height: 1.75; }

/* ===== TABS ===== */
.tab-bar {
  display: flex; gap: 3px; margin-bottom: 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 3px;
}
.tab-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 12px; border: none; background: none; cursor: pointer;
  border-radius: 7px;
  font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
  font-size: 0.76rem; font-weight: 700; color: var(--muted);
  transition: background 0.18s, color 0.18s;
}
.tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
.tab-btn.active { color: #fff; background: rgba(255,255,255,0.1); }
#tab-done.active { background: rgba(74,222,128,0.12); color: var(--green-text); }
.tab-count {
  font-size: 0.6rem; font-weight: 700; letter-spacing: 0;
  background: rgba(255,255,255,0.12); border-radius: 99px; padding: 1px 6px;
  color: rgba(255,255,255,0.55);
}
#tab-done.active .tab-count { background: rgba(74,222,128,0.2); color: var(--green-text); }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ===== COURSE GRID ===== */
.course-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) {
  .course-grid { grid-template-columns: 1fr; }
  .hero-title { font-size: 1.6rem; }
}

/* ===== COURSE CARD (案B) ===== */
.course-card {
  border-radius: 12px;
  padding: 20px;
  text-decoration: none; color: inherit;
  display: flex; flex-direction: column; gap: 0;
  border: 1px solid var(--border);
  position: relative; overflow: hidden;
  transition: transform 0.18s ease-out, border-color 0.18s;
  cursor: pointer;
  min-height: 200px;
}
.course-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.14); }

/* SC card */
.course-card.sc-card { background: linear-gradient(145deg, #1a2040 0%, #0e1528 60%, #0c1018 100%); }
.course-card.sc-card:hover { border-color: rgba(63,82,196,0.4); }

/* AZ completed card */
.course-card.az-card { background: linear-gradient(145deg, #0e1e32 0%, #091422 60%, #0c1018 100%); }
.course-card.az-card:hover { border-color: rgba(0,120,212,0.4); }

/* Ghost code text in background */
.card-bg-code {
  position: absolute; top: -12px; right: -10px;
  font-family: 'DM Sans', sans-serif; font-weight: 900;
  line-height: 1; opacity: 0.055; color: #fff;
  pointer-events: none; user-select: none; letter-spacing: -0.05em;
}

/* Badge row */
.card-badge-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 20px; position: relative; z-index: 1;
}
.card-badge {
  font-family: 'DM Sans', monospace; font-size: 0.55rem; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 3px 8px; border-radius: 3px;
}
.card-badge.sc { background: var(--sc-lt); color: var(--sc-text); border: 1px solid rgba(63,82,196,0.3); }
.card-badge.az { background: var(--az-lt); color: var(--az-text); border: 1px solid rgba(0,120,212,0.3); }
.done-pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: 'DM Sans', sans-serif; font-size: 0.55rem; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--green-text); background: var(--green-lt);
  border: 1px solid rgba(74,222,128,0.2); border-radius: 3px; padding: 3px 7px;
}

/* Card content */
.card-name {
  font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
  font-size: 1.05rem; font-weight: 900; color: #fff;
  letter-spacing: -0.02em; line-height: 1.3; margin-bottom: 8px;
  position: relative; z-index: 1;
}
.card-desc {
  font-size: 0.66rem; color: var(--muted); line-height: 1.65;
  flex: 1; position: relative; z-index: 1; margin-bottom: 16px;
}
.card-cta {
  display: flex; align-items: center; gap: 5px;
  font-family: 'DM Sans', sans-serif; font-size: 0.72rem; font-weight: 700;
  position: relative; z-index: 1;
}
.card-cta.sc { color: var(--sc-text); }
.card-cta.az { color: var(--az-text); }

/* ===== SC EXPAND ===== */
.sc-options {
  display: none; flex-direction: column; gap: 6px;
  padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.07);
  margin-top: 4px; position: relative; z-index: 1;
}
.course-card.sc-card.expanded .card-cta { display: none; }
.course-card.sc-card.expanded .sc-options { display: flex; }

.sc-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 13px; border-radius: 7px;
  text-decoration: none;
  font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
  font-size: 0.78rem; font-weight: 700;
  transition: background 0.15s, transform 0.1s;
  border: 1px solid transparent;
}
.sc-opt:active { transform: scale(0.98); }
.sc-opt span { flex: 1; }
.sc-opt svg { flex-shrink: 0; }

.sc-opt-read {
  background: rgba(63,82,196,0.15);
  color: var(--sc-text);
  border-color: rgba(63,82,196,0.25);
}
.sc-opt-read:hover { background: rgba(63,82,196,0.22); }

.sc-opt-card {
  background: rgba(45,122,79,0.12);
  color: #4ade80;
  border-color: rgba(74,222,128,0.2);
}
.sc-opt-card:hover { background: rgba(45,122,79,0.2); }

.sc-opt-gogo {
  background: rgba(180,83,9,0.12);
  color: var(--amber-text);
  border-color: rgba(245,158,11,0.2);
}
.sc-opt-gogo:hover { background: rgba(180,83,9,0.2); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </svg>
    <div class="logo-text">
      <div class="logo-sub">資格学習プラットフォーム</div>
      <div class="logo-main">StudyDeck</div>
    </div>
  </div>
  <div class="header-right">
    <button id="dark-toggle" title="ライトモード切替">
      <svg id="theme-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <div class="hero">
    <div class="hero-eyebrow">Study Deck</div>
    <h1 class="hero-title">資格学習を、<br>もっとスマートに。</h1>
    <p class="hero-sub">試験範囲を単語帳形式で効率よく学習。<br>スキマ時間にスマホで、確実に知識を定着させる。</p>
  </div>

  <!-- タブ -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-active" onclick="switchTab('active')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      学習中
      <span class="tab-count" id="count-active">1</span>
    </button>
    <button class="tab-btn" id="tab-done" onclick="switchTab('done')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      完了済み
      <span class="tab-count" id="count-done">1</span>
    </button>
  </div>

  <!-- 学習中パネル -->
  <div class="tab-panel active" id="panel-active">
    <div class="course-grid">

      <div class="course-card sc-card" id="sc-card" onclick="toggleSC(event)">
        <div class="card-bg-code" style="font-size:5.5rem;">SC</div>
        <div class="card-badge-row">
          <span class="card-badge sc">SC</span>
        </div>
        <div class="card-name">情報処理<br>安全確保支援士</div>
        <div class="card-desc">暗号技術・認証・ネットワークセキュリティ・攻撃手法・法律など全範囲を網羅</div>
        <div class="card-cta sc">
          学習する
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <div class="sc-options">
          <a href="sc/descriptions/" class="sc-opt sc-opt-read" onclick="event.stopPropagation()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <span>解説書を読む</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </a>
          <a href="sc/flashcard.html" class="sc-opt sc-opt-card" onclick="event.stopPropagation()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            <span>カードで覚える</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </a>
          <a href="sc/gogo/SC_AFTERNOON_INDEX.html" class="sc-opt sc-opt-gogo" onclick="event.stopPropagation()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span>午後試験対策</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </a>
        </div>
      </div>

    </div>
  </div>

  <!-- 完了済みパネル -->
  <div class="tab-panel" id="panel-done">
    <div class="course-grid">

      <a href="az305/" class="course-card az-card">
        <div class="card-bg-code" style="font-size:3.2rem; top:-8px; right:-6px; line-height:1.1;">AZ<br>305</div>
        <div class="card-badge-row">
          <span class="card-badge az">AZ-305</span>
          <span class="done-pill">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            合格済み
          </span>
        </div>
        <div class="card-name">Microsoft Azure<br>Solutions Architect</div>
        <div class="card-desc">インフラ設計・ガバナンス・データ・継続性の全ドメインを網羅した演習問題集</div>
        <div class="card-cta az">
          復習する
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </a>

    </div>
  </div>

</main>

<script>
function switchTab(tab) {
  ['active', 'done'].forEach(p => {
    document.getElementById('panel-' + p).classList.toggle('active', p === tab);
    document.getElementById('tab-' + p).classList.toggle('active', p === tab);
  });
  localStorage.setItem('studydeck-tab', tab);
}
(function() {
  if (localStorage.getItem('studydeck-tab') === 'done') switchTab('done');
})();

function toggleSC(e) {
  document.getElementById('sc-card').classList.toggle('expanded');
}
document.addEventListener('click', function(e) {
  const card = document.getElementById('sc-card');
  if (card && card.classList.contains('expanded') && !card.contains(e.target)) {
    card.classList.remove('expanded');
  }
});

// ダークモードトグル（案Bはダークが基本なので、ライトモードに切り替え）
const darkToggle = document.getElementById('dark-toggle');
const themeIcon  = document.getElementById('theme-icon');
const sunPath  = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
const moonPath = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
darkToggle.addEventListener('click', () => {
  const isLight = document.documentElement.hasAttribute('data-light');
  document.documentElement.toggleAttribute('data-light', !isLight);
  themeIcon.innerHTML = !isLight ? moonPath : sunPath;
  localStorage.setItem('studydeck-theme', !isLight ? 'light' : 'dark');
});
if (localStorage.getItem('studydeck-theme') === 'light') {
  document.documentElement.setAttribute('data-light', '');
  themeIcon.innerHTML = moonPath;
}
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js'));
}
</script>
</body>
</html>
