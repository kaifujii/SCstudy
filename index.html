<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情報処理安全確保支援士 単語帳</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e429f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SC単語帳">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --primary: #1a56db;
    --primary-dark: #1e429f;
    --secondary: #6875f5;
    --success: #057a55;
    --warning: #c27803;
    --danger: #c81e1e;
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --text: #111827;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --tag-bg: #eff6ff;
    --tag-text: #1e40af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== HEADER ===== */
  header {
    background: linear-gradient(135deg, var(--primary-dark), var(--secondary));
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 1.1rem; font-weight: 700; }
  header .sub { font-size: 0.75rem; opacity: 0.85; margin-top: 2px; }
  #progress-badge {
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
  }

  /* ===== CHAPTER TABS ===== */
  #chapter-tabs {
    display: flex;
    overflow-x: auto;
    background: white;
    border-bottom: 2px solid var(--border);
    padding: 0 8px;
    gap: 2px;
    scrollbar-width: none;
  }
  #chapter-tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex-shrink: 0;
    padding: 10px 14px;
    border: none;
    background: none;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }
  .tab-btn:hover { color: var(--primary); }

  /* ===== SEARCH ===== */
  #search-bar {
    padding: 12px 16px;
    background: white;
    border-bottom: 1px solid var(--border);
  }
  #search-input {
    width: 100%;
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    border-radius: 24px;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  #search-input:focus { border-color: var(--primary); }

  /* ===== MAIN CONTENT ===== */
  #app { max-width: 700px; margin: 0 auto; padding: 16px; }

  /* Mode selector */
  #mode-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .mode-btn {
    flex: 1;
    padding: 10px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: white;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .mode-btn.active {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--tag-bg);
  }

  /* ===== FLASHCARD VIEW ===== */
  #flashcard-view { display: block; }
  #list-view { display: none; }

  .card-counter {
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 12px;
    font-weight: 500;
  }

  .flashcard {
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    min-height: 300px;
    cursor: pointer;
    perspective: 1000px;
    position: relative;
    user-select: none;
  }
  .flashcard-inner {
    position: relative;
    width: 100%;
    min-height: 300px;
    transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
    transform-style: preserve-3d;
  }
  .flashcard.flipped .flashcard-inner {
    transform: rotateY(180deg);
  }
  .flashcard-front, .flashcard-back {
    position: absolute;
    top: 0; left: 0; right: 0;
    min-height: 300px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .flashcard-front {
    background: linear-gradient(135deg, #f8faff, #eef2ff);
    border: 2px solid #c7d2fe;
  }
  .flashcard-back {
    background: linear-gradient(135deg, #f0fdf4, #dcfce7);
    border: 2px solid #bbf7d0;
    transform: rotateY(180deg);
  }

  .card-chapter-tag {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--tag-text);
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 12px;
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .card-term {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 8px;
  }
  .card-hint {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-top: 16px;
  }
  .tap-icon {
    position: absolute;
    bottom: 20px;
    right: 24px;
    font-size: 1.2rem;
    opacity: 0.35;
  }
  .card-answer-label {
    font-size: 0.75rem;
    font-weight: 700;
    color: #059669;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .card-answer {
    font-size: 0.95rem;
    line-height: 1.8;
    color: var(--text);
  }
  .card-answer li {
    margin-left: 18px;
    margin-bottom: 4px;
  }

  /* Navigation */
  .card-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    gap: 12px;
  }
  .nav-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #btn-prev { background: #f3f4f6; color: var(--text); }
  #btn-prev:hover:not(:disabled) { background: #e5e7eb; }
  #btn-next { background: var(--primary); color: white; }
  #btn-next:hover:not(:disabled) { background: var(--primary-dark); }

  /* Result buttons */
  .result-btns {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .result-btn {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 12px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  #btn-known { background: #d1fae5; color: #065f46; }
  #btn-known:hover { background: #a7f3d0; }
  #btn-unknown { background: #fee2e2; color: #991b1b; }
  #btn-unknown:hover { background: #fecaca; }

  /* Progress bar */
  .progress-bar-wrap {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  /* ===== LIST VIEW ===== */
  .list-item {
    background: white;
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: all 0.2s;
    border: 1.5px solid transparent;
  }
  .list-item:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(26,86,219,0.15); }
  .list-item-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .list-item-term {
    font-weight: 700;
    font-size: 1rem;
    flex: 1;
  }
  .list-item-tag {
    font-size: 0.68rem;
    background: var(--tag-bg);
    color: var(--tag-text);
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .list-item-answer {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 0.88rem;
    line-height: 1.7;
    color: #374151;
  }
  .list-item-answer li { margin-left: 18px; margin-bottom: 3px; }
  .list-item.expanded .list-item-answer { display: block; }
  .expand-icon { transition: transform 0.2s; opacity: 0.5; margin-top: 2px; }
  .list-item.expanded .expand-icon { transform: rotate(180deg); }

  /* ===== STATS ===== */
  #stats-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat-box {
    flex: 1;
    background: white;
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .stat-num { font-size: 1.4rem; font-weight: 800; }
  .stat-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; margin-top: 2px; }
  .stat-known { color: var(--success); }
  .stat-unknown { color: var(--danger); }
  .stat-total { color: var(--primary); }

  /* Shuffle / Reset */
  .action-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .action-btn {
    flex: 1;
    padding: 9px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: white;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.2s;
  }
  .action-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

  /* Mobile optimizations */
  @media (max-width: 480px) {
    .card-term { font-size: 1.3rem; }
    .flashcard-front, .flashcard-back { padding: 24px 20px; }
    #app { padding: 12px; }
  }

  /* ===== DETAIL OPEN BUTTON ===== */
  .detail-open-btn {
    margin-top: 14px;
    width: 100%;
    padding: 11px;
    background: linear-gradient(135deg, #1e429f, #6875f5);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    display: none;
    letter-spacing: 0.3px;
  }
  .detail-open-btn:active { opacity: 0.85; }

  /* ===== DETAIL SHEET OVERLAY ===== */
  .detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 300;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .detail-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .detail-sheet {
    background: #f3f4f6;
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
  }
  .detail-overlay.open .detail-sheet { transform: translateY(0); }
  .detail-handle {
    width: 40px; height: 4px;
    background: #d1d5db;
    border-radius: 2px;
    margin: 10px auto 0;
  }
  .detail-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .detail-top-title {
    font-size: 0.95rem;
    font-weight: 800;
    color: #1f2937;
    flex: 1;
    padding-right: 8px;
  }
  .detail-close-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    background: #f3f4f6;
    font-size: 1rem;
    cursor: pointer;
    color: #6b7280;
    flex-shrink: 0;
  }
  .detail-body { padding: 14px; }

  /* ===== DETAIL CONTENT COMPONENTS ===== */
  .ds-section { margin-bottom: 14px; }
  .ds-section-title {
    font-size: 0.8rem;
    font-weight: 800;
    color: #374151;
    margin-bottom: 8px;
  }
  .ds-intro {
    background: #eff6ff;
    border-left: 3px solid #3b82f6;
    border-radius: 0 10px 10px 0;
    padding: 10px 12px;
    font-size: 0.84rem;
    line-height: 1.65;
    color: #1e3a5f;
  }
  /* Sequence diagram */
  .ds-diagram-card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .ds-actors {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    padding: 12px 10px 2px;
    gap: 4px;
  }
  .ds-actor { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .ds-actor-icon {
    width: 42px; height: 42px;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem;
  }
  .ds-actor-name { font-size: 0.64rem; font-weight: 800; text-align: center; line-height: 1.2; }
  .ds-actor-sub  { font-size: 0.57rem; color: #9ca3af; text-align: center; }
  .ds-svg-wrap { padding: 0 10px 12px; }
  .ds-svg-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  /* Comparison table */
  .ds-compare {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .ds-compare-head {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    background: #1e429f;
    color: white;
  }
  .ds-compare-head div { padding: 8px 6px; font-size: 0.7rem; font-weight: 800; text-align: center; }
  .ds-compare-head div:first-child { background: #172b6e; }
  .ds-compare-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-bottom: 1px solid #f3f4f6;
  }
  .ds-compare-row:last-child { border-bottom: none; }
  .ds-compare-row div { padding: 9px 6px; font-size: 0.71rem; text-align: center; line-height: 1.4; }
  .ds-compare-row div:first-child { background: #f9fafb; font-weight: 800; color: #374151; font-size: 0.67rem; }
  .ds-compare-row div:nth-child(2) { color: #1e429f; font-weight: 600; }
  .ds-compare-row div:nth-child(3) { color: #6d28d9; font-weight: 600; }
  .ds-compare-row:nth-child(even) { background: #fafafa; }
  .ds-compare-row:nth-child(even) div:first-child { background: #f3f4f6; }
  /* 2-column table */
  .ds-compare.col2 .ds-compare-head,
  .ds-compare.col2 .ds-compare-row { grid-template-columns: 1fr 2.5fr; }
  /* 4-column table */
  .ds-compare.col4 .ds-compare-head,
  .ds-compare.col4 .ds-compare-row { grid-template-columns: repeat(4, 1fr); }
  .ds-compare.col4 .ds-compare-row div:nth-child(4) { color: #065f46; font-weight: 600; }
  /* 4-actor diagram header */
  .ds-actors.col4 { grid-template-columns: repeat(4, 1fr); }
  /* Q&A list */
  .ds-qa-item { display: flex; gap: 8px; margin-bottom: 8px; align-items: stretch; }
  .ds-qa-item:last-child { margin-bottom: 0; }
  .ds-qa-q {
    flex: 1;
    background: #eff6ff;
    border-left: 3px solid #3b82f6;
    border-radius: 0 8px 8px 0;
    padding: 8px 10px;
    font-size: 0.74rem;
    font-weight: 600;
    color: #1e429f;
    line-height: 1.4;
  }
  .ds-qa-a {
    background: #f0fdf4;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.74rem;
    font-weight: 800;
    color: #065f46;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    text-align: center;
    line-height: 1.3;
    max-width: 45%;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="sub">情報処理安全確保支援士</div>
    <h1>セキュリティ単語帳</h1>
  </div>
  <div id="progress-badge">0 / 0</div>
</header>

<div id="chapter-tabs">
  <button class="tab-btn active" data-chapter="all">すべて</button>
  <button class="tab-btn" data-chapter="1">第1章</button>
  <button class="tab-btn" data-chapter="2">第2章</button>
  <button class="tab-btn" data-chapter="3">第3章</button>
  <button class="tab-btn" data-chapter="4">第4章</button>
  <button class="tab-btn" data-chapter="5">第5章</button>
  <button class="tab-btn" data-chapter="6">第6章</button>
  <button class="tab-btn" data-chapter="8">第8章</button>
  <button class="tab-btn" data-chapter="9">第9章</button>
</div>

<div id="search-bar">
  <input type="text" id="search-input" placeholder="🔍 用語を検索...">
</div>

<div id="app">
  <!-- Mode selector -->
  <div id="mode-selector">
    <button class="mode-btn active" data-mode="flash">🃏 カード</button>
    <button class="mode-btn" data-mode="list">📋 一覧</button>
  </div>

  <!-- Stats -->
  <div id="stats-bar">
    <div class="stat-box">
      <div class="stat-num stat-total" id="stat-total">0</div>
      <div class="stat-label">全カード</div>
    </div>
    <div class="stat-box">
      <div class="stat-num stat-known" id="stat-known">0</div>
      <div class="stat-label">覚えた ✓</div>
    </div>
    <div class="stat-box">
      <div class="stat-num stat-unknown" id="stat-unknown">0</div>
      <div class="stat-label">要復習 ✗</div>
    </div>
  </div>

  <!-- Actions -->
  <div class="action-row">
    <button class="action-btn" id="btn-shuffle">🔀 シャッフル</button>
    <button class="action-btn" id="btn-unknown-only">📌 要復習のみ</button>
    <button class="action-btn" id="btn-reset">🔄 リセット</button>
  </div>

  <!-- Progress bar -->
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>

  <!-- Flashcard view -->
  <div id="flashcard-view">
    <div class="card-counter" id="card-counter">1 / 1</div>
    <div class="flashcard" id="flashcard">
      <div class="flashcard-inner">
        <div class="flashcard-front">
          <span class="card-chapter-tag" id="card-chapter-tag"></span>
          <div class="card-term" id="card-term"></div>
          <div class="card-hint" id="card-hint"></div>
          <span class="tap-icon">👆</span>
        </div>
        <div class="flashcard-back">
          <div class="card-answer-label">解答</div>
          <div class="card-answer" id="card-answer"></div>
          <button class="detail-open-btn" id="detail-open-btn">📖 詳しく見る</button>
        </div>
      </div>
    </div>

    <div class="result-btns" id="result-btns" style="display:none">
      <button class="result-btn" id="btn-unknown">✗ もう一度</button>
      <button class="result-btn" id="btn-known">✓ 覚えた</button>
    </div>

    <div class="card-nav">
      <button class="nav-btn" id="btn-prev">← 前</button>
      <button class="nav-btn" id="btn-next">次 →</button>
    </div>
  </div>

  <!-- List view -->
  <div id="list-view">
    <div id="list-container"></div>
  </div>

  <div class="empty-state" id="empty-state" style="display:none">
    <div class="icon">🔍</div>
    <div>該当する用語が見つかりません</div>
  </div>
</div>

<!-- Detail Sheet -->
<div class="detail-overlay" id="detail-overlay">
  <div class="detail-sheet" id="detail-sheet">
    <div class="detail-handle"></div>
    <div class="detail-top">
      <div class="detail-top-title" id="detail-top-title"></div>
      <button class="detail-close-btn" id="detail-close-btn">✕</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>
</div>

<script src="data/ch01.js"></script>
<script src="data/ch02.js"></script>
<script src="data/ch03.js"></script>
<script src="data/ch04.js"></script>
<script src="data/ch05.js"></script>
<script src="data/ch06.js"></script>
<script src="data/ch08.js"></script>
<script src="data/ch09.js"></script>
<script>
// ============================================================
// FLASHCARD DATA
// ============================================================
const CARDS = [
  ...CH01_CARDS,
  ...CH02_CARDS,
  ...CH03_CARDS,
  ...CH04_CARDS,
  ...CH05_CARDS,
  ...CH06_CARDS,
  ...CH08_CARDS,
  ...CH09_CARDS,
];

// ============================================================
// STATE
// ============================================================
let currentCards = [...CARDS];
let currentIndex = 0;
let isFlipped = false;
let known = new Set();
let unknown = new Set();
let currentChapter = "all";
let currentMode = "flash";
let showUnknownOnly = false;
let searchQuery = "";

// ============================================================
// DOM REFS
// ============================================================
const flashcard = document.getElementById("flashcard");
const cardChapterTag = document.getElementById("card-chapter-tag");
const cardTerm = document.getElementById("card-term");
const cardHint = document.getElementById("card-hint");
const cardAnswer = document.getElementById("card-answer");
const cardCounter = document.getElementById("card-counter");
const detailOpenBtn = document.getElementById("detail-open-btn");
const detailOverlay = document.getElementById("detail-overlay");
const detailTopTitle = document.getElementById("detail-top-title");
const detailBody = document.getElementById("detail-body");
const detailCloseBtn = document.getElementById("detail-close-btn");
const progressFill = document.getElementById("progress-fill");
const progressBadge = document.getElementById("progress-badge");
const resultBtns = document.getElementById("result-btns");
const flashcardView = document.getElementById("flashcard-view");
const listView = document.getElementById("list-view");
const listContainer = document.getElementById("list-container");
const emptyState = document.getElementById("empty-state");
const statTotal = document.getElementById("stat-total");
const statKnown = document.getElementById("stat-known");
const statUnknown = document.getElementById("stat-unknown");

// ============================================================
// FILTER
// ============================================================
function getFilteredCards() {
  let cards = CARDS;
  if (currentChapter !== "all") {
    cards = cards.filter(c => c.chapter === currentChapter);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    cards = cards.filter(c =>
      c.term.toLowerCase().includes(q) ||
      c.chapterName.toLowerCase().includes(q) ||
      c.answer.some(a => a.toLowerCase().includes(q))
    );
  }
  if (showUnknownOnly) {
    cards = cards.filter(c => unknown.has(c.term) || (!known.has(c.term) && !unknown.has(c.term)));
  }
  return cards;
}

function applyFilter() {
  currentCards = getFilteredCards();
  currentIndex = 0;
  isFlipped = false;
  renderCard();
  if (currentMode === "list") renderList();
  updateStats();
}

// ============================================================
// RENDER CARD
// ============================================================
function renderCard() {
  if (currentCards.length === 0) {
    emptyState.style.display = "block";
    flashcardView.style.display = "none";
    return;
  }
  emptyState.style.display = "none";
  flashcardView.style.display = "block";

  const card = currentCards[currentIndex];
  flashcard.classList.remove("flipped");
  isFlipped = false;
  resultBtns.style.display = "none";

  cardChapterTag.textContent = card.chapterName;
  cardTerm.textContent = card.term;
  cardHint.textContent = card.hint || "";

  cardAnswer.innerHTML = "";
  const ul = document.createElement("ul");
  card.answer.forEach(item => {
    const li = document.createElement("li");
    li.textContent = item;
    ul.appendChild(li);
  });
  cardAnswer.appendChild(ul);

  cardCounter.textContent = `${currentIndex + 1} / ${currentCards.length}`;
  const pct = currentCards.length > 0 ? ((currentIndex + 1) / currentCards.length) * 100 : 0;
  progressFill.style.width = pct + "%";
  progressBadge.textContent = `${currentIndex + 1} / ${currentCards.length}`;

  document.getElementById("btn-prev").disabled = currentIndex === 0;
  document.getElementById("btn-next").disabled = currentIndex === currentCards.length - 1;

  // 詳細ボタン: カードに detail があれば表示（裏返し時のみ見える）
  detailOpenBtn.style.display = card.detail ? "block" : "none";
}

// ============================================================
// RENDER LIST
// ============================================================
function renderList() {
  listContainer.innerHTML = "";
  if (currentCards.length === 0) {
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";
  currentCards.forEach((card, i) => {
    const div = document.createElement("div");
    div.className = "list-item";
    div.innerHTML = `
      <div class="list-item-header">
        <div class="list-item-term">${card.term}</div>
        <span class="list-item-tag">${card.chapterName}</span>
        <span class="expand-icon">▾</span>
      </div>
      <div class="list-item-answer">
        <ul>${card.answer.map(a => `<li>${a}</li>`).join("")}</ul>
      </div>
    `;
    div.addEventListener("click", () => div.classList.toggle("expanded"));
    listContainer.appendChild(div);
  });
}

// ============================================================
// STATS
// ============================================================
function updateStats() {
  const filtered = getFilteredCards();
  statTotal.textContent = filtered.length;
  const knownCount = filtered.filter(c => known.has(c.term)).length;
  const unknownCount = filtered.filter(c => unknown.has(c.term)).length;
  statKnown.textContent = knownCount;
  statUnknown.textContent = unknownCount;
}

// ============================================================
// EVENTS
// ============================================================
// Flip card
flashcard.addEventListener("click", () => {
  if (currentCards.length === 0) return;
  flashcard.classList.toggle("flipped");
  isFlipped = !isFlipped;
  resultBtns.style.display = isFlipped ? "flex" : "none";
});

// Detail sheet open / close
function openDetail() {
  const card = currentCards[currentIndex];
  if (!card.detail) return;
  detailTopTitle.textContent = card.term;
  detailBody.innerHTML = card.detail;
  detailOverlay.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeDetail() {
  detailOverlay.classList.remove("open");
  document.body.style.overflow = "";
}
detailOpenBtn.addEventListener("click", (e) => { e.stopPropagation(); openDetail(); });
detailCloseBtn.addEventListener("click", closeDetail);
detailOverlay.addEventListener("click", (e) => { if (e.target === detailOverlay) closeDetail(); });
// スワイプダウンで閉じる
let touchStartY = 0;
document.getElementById("detail-sheet").addEventListener("touchstart", e => { touchStartY = e.touches[0].clientY; }, { passive: true });
document.getElementById("detail-sheet").addEventListener("touchend", e => {
  if (e.changedTouches[0].clientY - touchStartY > 80) closeDetail();
}, { passive: true });

// Navigation
document.getElementById("btn-prev").addEventListener("click", () => {
  if (currentIndex > 0) {
    currentIndex--;
    renderCard();
  }
});
document.getElementById("btn-next").addEventListener("click", () => {
  if (currentIndex < currentCards.length - 1) {
    currentIndex++;
    renderCard();
  }
});

// Known / Unknown
document.getElementById("btn-known").addEventListener("click", () => {
  const term = currentCards[currentIndex].term;
  known.add(term);
  unknown.delete(term);
  updateStats();
  if (currentIndex < currentCards.length - 1) {
    currentIndex++;
    renderCard();
  }
});
document.getElementById("btn-unknown").addEventListener("click", () => {
  const term = currentCards[currentIndex].term;
  unknown.add(term);
  known.delete(term);
  updateStats();
  if (currentIndex < currentCards.length - 1) {
    currentIndex++;
    renderCard();
  }
});

// Chapter tabs
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentChapter = btn.dataset.chapter;
    showUnknownOnly = false;
    applyFilter();
  });
});

// Mode
document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentMode = btn.dataset.mode;
    flashcardView.style.display = currentMode === "flash" ? "block" : "none";
    listView.style.display = currentMode === "list" ? "block" : "none";
    if (currentMode === "list") renderList();
    if (currentMode === "flash") renderCard();
  });
});

// Search
document.getElementById("search-input").addEventListener("input", e => {
  searchQuery = e.target.value.trim();
  applyFilter();
});

// Shuffle
document.getElementById("btn-shuffle").addEventListener("click", () => {
  for (let i = currentCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [currentCards[i], currentCards[j]] = [currentCards[j], currentCards[i]];
  }
  currentIndex = 0;
  isFlipped = false;
  renderCard();
  if (currentMode === "list") renderList();
});

// Unknown only
document.getElementById("btn-unknown-only").addEventListener("click", () => {
  showUnknownOnly = !showUnknownOnly;
  document.getElementById("btn-unknown-only").style.color = showUnknownOnly ? "var(--danger)" : "";
  document.getElementById("btn-unknown-only").style.borderColor = showUnknownOnly ? "var(--danger)" : "";
  applyFilter();
});

// Reset
document.getElementById("btn-reset").addEventListener("click", () => {
  known.clear();
  unknown.clear();
  showUnknownOnly = false;
  document.getElementById("btn-unknown-only").style.color = "";
  document.getElementById("btn-unknown-only").style.borderColor = "";
  applyFilter();
});

// Keyboard
document.addEventListener("keydown", e => {
  if (currentMode !== "flash") return;
  if (e.key === " " || e.key === "Enter") {
    flashcard.click();
    e.preventDefault();
  } else if (e.key === "ArrowRight" || e.key === "ArrowDown") {
    if (currentIndex < currentCards.length - 1) { currentIndex++; renderCard(); }
  } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
    if (currentIndex > 0) { currentIndex--; renderCard(); }
  } else if (e.key === "1" && isFlipped) {
    document.getElementById("btn-unknown").click();
  } else if (e.key === "2" && isFlipped) {
    document.getElementById("btn-known").click();
  }
});

// ============================================================
// INIT
// ============================================================
applyFilter();
</script>

<script>
// Service Worker 登録（PWA オフライン対応）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js');
  });
}
</script>
</body>
</html>
